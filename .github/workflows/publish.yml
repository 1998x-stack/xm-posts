name: Validate & publish xm-posts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  build:
    name: Validate, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Start CI performance clock
        run: python scripts/ci_metrics.py start
      - name: Install test dependencies
        run: python scripts/ci_metrics.py run --name python-dependencies -- python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python scripts/ci_metrics.py run --name chromium-install -- python -m playwright install --with-deps chromium
      - name: Check mirrored skills
        run: python scripts/ci_metrics.py run --name skill-mirrors -- python scripts/sync_skills.py --check
      - name: Run tests
        run: python scripts/ci_metrics.py run --name pytest -- python -m pytest -q
      - name: Audit inline and standalone SVG integrity
        run: python scripts/ci_metrics.py run --name svg-audit -- python scripts/audit_svg.py
      - name: Build static site
        run: python scripts/ci_metrics.py run --name site-build -- python scripts/build_site.py
      - name: Validate generated site and original articles
        run: python scripts/ci_metrics.py run --name site-validation -- python scripts/validate_site.py
      - name: Check interactive teaching batches in Chromium
        run: |
          python scripts/ci_metrics.py run --name browser-fifth -- python scripts/browser_check_fifth_batch.py --output reports/fifth-batch
          python scripts/ci_metrics.py run --name browser-fourth -- python scripts/browser_check_fourth_batch.py --output reports/fourth-batch
          python scripts/ci_metrics.py run --name browser-nb-svm-sgd -- python scripts/browser_check_nb_svm_sgd.py --output reports/nb-svm-sgd
          python scripts/ci_metrics.py run --name browser-teacher-forcing -- python scripts/browser_check_teacher_forcing.py --output reports/teacher-forcing
          python scripts/ci_metrics.py run --name browser-sixth-batch -- python scripts/browser_check_sixth_batch.py --output reports/sixth-batch
          python scripts/ci_metrics.py run --name browser-third -- python scripts/browser_check_third_batch.py --output reports/third-batch
          python scripts/ci_metrics.py run --name browser-svm-math -- python scripts/browser_check_svm_math.py --output reports/svm-math
          python scripts/ci_metrics.py run --name browser-three-guides -- python scripts/browser_check_three_guides.py
          python scripts/ci_metrics.py run --name browser-second -- python scripts/browser_check_second_batch.py --output reports/second-batch
      - name: Validate Agent Evaluation article source
        run: python scripts/ci_metrics.py run --name validate-agent-evaluation -- python skills/olah-style-paper-posts/scripts/validate.py posts/agents/agent-evaluation/index.html --report reports/agent-evaluation/static-validation.json
      - name: Browser QA with the canonical Olah-style skill
        run: python scripts/ci_metrics.py run --name skill-browser-agent-evaluation -- python skills/olah-style-paper-posts/scripts/browser_check.py posts/agents/agent-evaluation/index.html --output reports/agent-evaluation/skill-browser --click "#success-p"
      - name: Check Agent Evaluation metrics and responsive diagrams
        run: python scripts/ci_metrics.py run --name browser-agent-evaluation -- python scripts/browser_check_agent_evaluation.py --output reports/agent-evaluation
      - name: Check every published article with shared Chromium workers
        run: python scripts/ci_metrics.py run --name browser-all -- python scripts/browser_check_all.py --workers 2
      - name: Verify actual generated Pages site in Chromium
        run: python scripts/ci_metrics.py run --name browser-site -- python scripts/browser_check_site.py --output reports/site
      - name: Install Chinese and math fonts for PDF export
        run: python scripts/ci_metrics.py run --name pdf-font-install -- bash -lc 'sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-stix'
      # Cache only validated PDF outputs, not generated _site HTML. The key is
      # immutable per workflow run; restore-keys picks the latest compatible
      # prior cache from the branch/default-branch scope.
      - name: Record installed PDF font versions
        run: echo "PDF_FONT_SIGNATURE=$(dpkg-query -W -f='${Package}=${Version};' fonts-noto-cjk fonts-stix)" >> "$GITHUB_ENV"
      - name: Restore incremental PDF cache
        id: pdf-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .pdf-cache
          key: xm-posts-pdf-v3-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xm-posts-pdf-v3-${{ runner.os }}-
      - name: Restore cached PDFs and render only changed posts
        run: python scripts/ci_metrics.py run --name pdf-export --log reports/ci/pdf-render.log -- python scripts/render_pdfs.py
      - name: Validate final site with complete PDF downloads
        run: python scripts/ci_metrics.py run --name pdf-site-validation -- python scripts/validate_site.py --require-pdfs
      - name: Save validated PDF cache
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .pdf-cache
          key: ${{ steps.pdf-cache.outputs.cache-primary-key }}
      - name: Summarize CI timing, browser QA and PDF cache reuse
        if: always()
        run: python scripts/ci_metrics.py summary --write "$GITHUB_STEP_SUMMARY"
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: reports/
          if-no-files-found: ignore
      - name: Upload validated site artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: _site/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: _site
      # GitHub Actions Pages source must be enabled for the repository.
      # If this repo has not enabled it yet, try to create workflow-source Pages
      # using the job-scoped pages:write GitHub token. If policy disallows this,
      # the action will fail clearly and the README provides a one-time UI path.
      - name: Enable Pages (workflow source) if necessary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo 'Pages already enabled.'
          else
            echo 'Attempting first-time Pages enablement for GitHub Actions...'
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -H 'Accept: application/vnd.github+json' \
              -f build_type=workflow
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages article recommendations
        run: python scripts/verify_deployed_related.py --base-url "${{ steps.deployment.outputs.page_url }}"
