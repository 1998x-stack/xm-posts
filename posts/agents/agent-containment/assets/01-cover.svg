<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-labelledby="contain-cover-title contain-cover-desc"><title id="contain-cover-title">Agent containment 的三道边界</title><desc id="contain-cover-desc">环境约束能做什么，模型策略引导倾向，外部内容和工具输入必须被视为不可信。</desc><rect width="840" height="260" rx="18" fill="#f0f5f3"/><g font-family="Arial,sans-serif"><text x="30" y="38" fill="#315d57" font-size="16" font-weight="700">CONTAIN THE BLAST RADIUS — NOT JUST THE PROMPT</text><rect x="35" y="78" width="225" height="130" rx="14" fill="#dcefe5" stroke="#9fc9b6" stroke-width="2"/><text x="58" y="116" fill="#287d70" font-size="19" font-weight="700">Environment</text><text x="58" y="150" fill="#456965" font-size="15">VM · sandbox</text><text x="58" y="177" fill="#456965" font-size="15">filesystem · egress</text><rect x="307" y="78" width="225" height="130" rx="14" fill="#fff" stroke="#c3d7d0" stroke-width="2"/><text x="330" y="116" fill="#287d70" font-size="19" font-weight="700">Model</text><text x="330" y="150" fill="#456965" font-size="15">system prompt</text><text x="330" y="177" fill="#456965" font-size="15">classifier · training</text><rect x="579" y="78" width="225" height="130" rx="14" fill="#fff0e4" stroke="#dfb997" stroke-width="2"/><text x="602" y="116" fill="#985f3d" font-size="19" font-weight="700">External content</text><text x="602" y="150" fill="#805d48" font-size="15">MCP · files · web</text><text x="602" y="177" fill="#805d48" font-size="15">tool output · connectors</text><text x="30" y="237" fill="#68847c" font-size="13">Hard boundaries constrain capability; probabilistic defenses steer behavior; content trust is a separate concern.</text></g></svg>
