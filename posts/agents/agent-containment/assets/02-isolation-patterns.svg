<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="contain-patterns-title contain-patterns-desc"><title id="contain-patterns-title">三种产品运行隔离模式</title><desc id="contain-patterns-desc">云端短生命周期容器、开发者本机操作系统沙箱、知识工作者使用的完整虚拟机，各自权衡隔离、能力和监督要求。</desc><rect width="840" height="300" rx="18" fill="#f1f6f3"/><g font-family="Arial,sans-serif"><rect x="28" y="73" width="244" height="160" rx="13" fill="#fff" stroke="#bdd5ca" stroke-width="2"/><text x="50" y="109" fill="#287d70" font-size="18" font-weight="700">Ephemeral container</text><text x="50" y="141" fill="#496a66" font-size="14">claude.ai code execution</text><text x="50" y="171" fill="#496a66" font-size="14">server-side · per-session</text><text x="50" y="200" fill="#68847c" font-size="13">低持久性 / 小 blast radius</text><rect x="298" y="73" width="244" height="160" rx="13" fill="#fff" stroke="#bdd5ca" stroke-width="2"/><text x="320" y="109" fill="#287d70" font-size="18" font-weight="700">OS sandbox + HITL</text><text x="320" y="141" fill="#496a66" font-size="14">Claude Code</text><text x="320" y="171" fill="#496a66" font-size="14">workspace write / network deny</text><text x="320" y="200" fill="#68847c" font-size="13">开发者监督 + 硬边界</text><rect x="568" y="73" width="244" height="160" rx="13" fill="#fff" stroke="#bdd5ca" stroke-width="2"/><text x="590" y="109" fill="#287d70" font-size="18" font-weight="700">Sealed VM</text><text x="590" y="141" fill="#496a66" font-size="14">Claude Cowork</text><text x="590" y="171" fill="#496a66" font-size="14">guest kernel / mounted workspace</text><text x="590" y="200" fill="#68847c" font-size="13">强隔离 / host credentials</text><text x="28" y="266" fill="#68847c" font-size="13">模式不是安全等级排行榜：要匹配用户监督能力、工作空间和产品需求。</text></g></svg>
