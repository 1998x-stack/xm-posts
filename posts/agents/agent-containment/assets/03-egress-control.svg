<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="contain-egress-title contain-egress-desc"><title id="contain-egress-title">出口控制必须检查能力而非只看域名</title><desc id="contain-egress-desc">仅允许某个 API 域名仍可能开放其上传功能；代理还要验证会话身份、令牌来源和请求能力。</desc><rect width="840" height="300" rx="18" fill="#f2f6f4"/><g font-family="Arial,sans-serif"><rect x="30" y="94" width="160" height="112" rx="12" fill="#fff" stroke="#bdd5ca" stroke-width="2"/><text x="51" y="131" fill="#287d70" font-size="17" font-weight="700">Agent</text><text x="51" y="162" fill="#496a66" font-size="14">reads files / calls tool</text><path d="M192 150 H264" stroke="#478b7d" stroke-width="4"/><path d="M256 142 L266 150 L256 158" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="274" y="94" width="220" height="112" rx="12" fill="#fff0e4" stroke="#dfb997" stroke-width="2"/><text x="296" y="131" fill="#985f3d" font-size="17" font-weight="700">Domain allowlist</text><text x="296" y="162" fill="#805d48" font-size="14">destination only</text><path d="M496 150 H568" stroke="#bc8055" stroke-width="4"/><path d="M560 142 L570 150 L560 158" fill="none" stroke="#bc8055" stroke-width="3"/><rect x="578" y="94" width="232" height="112" rx="12" fill="#fff" stroke="#9fc9b6" stroke-width="2"/><text x="600" y="131" fill="#287d70" font-size="17" font-weight="700">Scoped proxy</text><text x="600" y="162" fill="#496a66" font-size="14">session token · method</text><text x="600" y="184" fill="#496a66" font-size="14">provenance · request policy</text><path d="M384 216 V246 H694 V207" fill="none" stroke="#bc8055" stroke-width="3" stroke-dasharray="7 6"/><text x="430" y="271" fill="#925f40" font-size="14">A permitted destination can still expose dangerous capabilities.</text></g></svg>
