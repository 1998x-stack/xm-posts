<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="contain-trust-title contain-trust-desc"><title id="contain-trust-title">外部工具的双重信任边界</title><desc id="contain-trust-desc">本地工具需要代码供应链审查，远程工具还可能在授权后改变行为；两者的输出都可能包含 prompt injection。</desc><rect width="840" height="270" rx="18" fill="#eff5f1"/><g font-family="Arial,sans-serif"><rect x="35" y="58" width="350" height="154" rx="13" fill="#fff" stroke="#bdd5ca" stroke-width="2"/><text x="58" y="95" fill="#287d70" font-size="18" font-weight="700">Local tool</text><text x="58" y="129" fill="#496a66" font-size="14">可审计代码 · 可 pin 版本</text><text x="58" y="157" fill="#496a66" font-size="14">仍需检查依赖与输出内容</text><text x="58" y="185" fill="#68847c" font-size="13">Install-time trust is not content trust</text><rect x="455" y="58" width="350" height="154" rx="13" fill="#fff0e4" stroke="#dfb997" stroke-width="2"/><text x="478" y="95" fill="#985f3d" font-size="18" font-weight="700">Remote tool</text><text x="478" y="129" fill="#805d48" font-size="14">服务端行为可在授权后变化</text><text x="478" y="157" fill="#805d48" font-size="14">工具结果可携带间接指令</text><text x="478" y="185" fill="#956c52" font-size="13">Trust must be continuously evaluated</text><text x="35" y="245" fill="#68847c" font-size="13">代码安全（supply chain）与上下文安全（prompt injection）是两种不同问题。</text></g></svg>
