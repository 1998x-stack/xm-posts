<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="agent-eval-01-title agent-eval-01-desc">
<title id="agent-eval-01-title">Agent Evaluation 的二维分类体系</title><desc id="agent-eval-01-desc">上方是评测目标：行为、能力、可靠性、安全与对齐；下方是评测过程：交互模式、评测数据、指标计算、评测工具和评测环境。两维共同定义一次 Agent 评测。</desc>
<rect width="1100" height="520" rx="20" fill="#f8fbf9"/>
<text x="42" y="43" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#247e73" letter-spacing="2">TWO AXES · ONE EVALUATION DESIGN</text>
<text x="42" y="80" font-family="system-ui,sans-serif" font-size="27" font-weight="800" fill="#203b3c">评测目标 WHAT × 评测过程 HOW</text>
<rect x="42" y="105" width="1016" height="40" rx="9" fill="#e4f0e9"/>
<text x="550" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#276b63">评测目标 · Evaluation Objectives</text>
<g font-family="system-ui,sans-serif">
<rect x="42" y="160" width="238" height="105" rx="12" fill="#e9f4ee" stroke="#91bca9" stroke-width="2"/>
<text x="161" y="196" text-anchor="middle" font-size="21" font-weight="800" fill="#214f49">Behavior</text><text x="161" y="226" text-anchor="middle" font-size="15" fill="#52736b">任务成功 · 输出质量</text>
<rect x="300" y="160" width="238" height="105" rx="12" fill="#eaf1f8" stroke="#9cb8d1" stroke-width="2"/>
<text x="419" y="196" text-anchor="middle" font-size="21" font-weight="800" fill="#254d68">Capabilities</text><text x="419" y="226" text-anchor="middle" font-size="15" fill="#58768c">工具 · 规划 · 记忆 · 协作</text>
<rect x="558" y="160" width="238" height="105" rx="12" fill="#fff2e8" stroke="#d9ae8b" stroke-width="2"/>
<text x="677" y="196" text-anchor="middle" font-size="21" font-weight="800" fill="#85583b">Reliability</text><text x="677" y="226" text-anchor="middle" font-size="15" fill="#94715a">一致性 · 鲁棒性 · 恢复</text>
<rect x="816" y="160" width="242" height="105" rx="12" fill="#f8eceb" stroke="#d7aaa5" stroke-width="2"/>
<text x="937" y="196" text-anchor="middle" font-size="21" font-weight="800" fill="#89524c">Safety &amp; Alignment</text><text x="937" y="226" text-anchor="middle" font-size="15" fill="#98716d">权限 · 注入 · 合规</text>
</g>
<path d="M550 278 V307" stroke="#7ea99b" stroke-width="3" stroke-linecap="round"/><path d="M542 299 L550 309 L558 299" fill="none" stroke="#7ea99b" stroke-width="3"/>
<rect x="42" y="322" width="1016" height="40" rx="9" fill="#e9eff6"/>
<text x="550" y="349" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#365d7b">评测过程 · Evaluation Process</text>
<g font-family="system-ui,sans-serif" font-size="15" fill="#385c5a">
<rect x="42" y="380" width="190" height="83" rx="10" fill="#fff" stroke="#d5e2dc"/><text x="137" y="411" text-anchor="middle" font-size="17" font-weight="800" fill="#203b3c">Interaction</text><text x="137" y="437" text-anchor="middle">静态 / 多轮 / 用户</text>
<rect x="248" y="380" width="190" height="83" rx="10" fill="#fff" stroke="#d5e2dc"/><text x="343" y="411" text-anchor="middle" font-size="17" font-weight="800" fill="#203b3c">Data</text><text x="343" y="437" text-anchor="middle">合成 / 真实 / 领域</text>
<rect x="454" y="380" width="190" height="83" rx="10" fill="#fff" stroke="#d5e2dc"/><text x="549" y="411" text-anchor="middle" font-size="17" font-weight="800" fill="#203b3c">Metrics</text><text x="549" y="437" text-anchor="middle">状态 / AST / Judge</text>
<rect x="660" y="380" width="190" height="83" rx="10" fill="#fff" stroke="#d5e2dc"/><text x="755" y="411" text-anchor="middle" font-size="17" font-weight="800" fill="#203b3c">Tooling</text><text x="755" y="437" text-anchor="middle">Trace / Sandbox / Logs</text>
<rect x="866" y="380" width="192" height="83" rx="10" fill="#fff" stroke="#d5e2dc"/><text x="962" y="411" text-anchor="middle" font-size="17" font-weight="800" fill="#203b3c">Context</text><text x="962" y="437" text-anchor="middle">模拟器 / Web / API</text>
</g>
<text x="550" y="495" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#6b8580">每个 Benchmark 都是这两个维度上的一个具体设计点，而不是 Agent 能力的完整定义。</text>
</svg>