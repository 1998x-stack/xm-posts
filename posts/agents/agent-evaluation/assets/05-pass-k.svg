<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="agent-eval-05-title agent-eval-05-desc">
<title id="agent-eval-05-title">Pass at k 与 Pass 的 k 次方对比</title><desc id="agent-eval-05-desc">单次成功概率 p 等于 0.8，在独立尝试假设下，Pass at k 随 k 增加趋近 1，而 Pass 的 k 次方持续下降。</desc>
<rect width="1100" height="460" rx="20" fill="#f8fbf9"/>
<text x="42" y="43" font-family="system-ui,sans-serif" font-size="17" font-weight="800" fill="#247e73" letter-spacing="2">REPEATED-TRIAL RELIABILITY</text>
<text x="42" y="80" font-family="system-ui,sans-serif" font-size="26" font-weight="800" fill="#203b3c">单次成功率 p = 0.80 · 假设各次尝试独立</text>
<g font-family="system-ui,sans-serif" fill="#69827d" font-size="13"><text x="28" y="137">100%</text><text x="40" y="238">50%</text><text x="48" y="339">0%</text><text x="100" y="373">k=1</text><text x="275" y="373">k=2</text><text x="450" y="373">k=3</text><text x="625" y="373">k=4</text><text x="800" y="373">k=5</text></g>
<path d="M95 120 V340 H930" fill="none" stroke="#a7c2b8" stroke-width="2"/>
<path d="M95 220 H930 M95 320 H930" stroke="#dce8e2" stroke-width="1" stroke-dasharray="5 6"/>
<path d="M110 164 L285 128.8 L460 121.76 L635 120.35 L810 120.07" fill="none" stroke="#247e73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M110 164 L285 199.2 L460 227.36 L635 249.89 L810 267.0" fill="none" stroke="#c77c51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#247e73"><circle cx="110" cy="164" r="6"/><circle cx="285" cy="128.8" r="6"/><circle cx="460" cy="121.76" r="6"/><circle cx="635" cy="120.35" r="6"/><circle cx="810" cy="120.07" r="6"/></g>
<g fill="#c77c51"><circle cx="110" cy="164" r="6"/><circle cx="285" cy="199.2" r="6"/><circle cx="460" cy="227.36" r="6"/><circle cx="635" cy="249.89" r="6"/><circle cx="810" cy="267.0 r="6"/></g>
<g font-family="system-ui,sans-serif" font-size="15" font-weight="700"><rect x="955" y="147" width="22" height="6" rx="3" fill="#247e73"/><text x="988" y="155" fill="#247e73">Pass@k</text><rect x="955" y="183" width="22" height="6" rx="3" fill="#c77c51"/><text x="988" y="191" fill="#9b6442">Pass^k</text></g>
<rect x="875" y="224" width="185" height="90" rx="11" fill="#fff" stroke="#dce8e2"/><text x="892" y="251" font-family="system-ui,sans-serif" font-size="14" fill="#58716d">k = 5</text><text x="892" y="277" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#247e73">99.968%</text><text x="892" y="299" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#c77c51">32.768%</text>
<text x="550" y="421" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#6b8580">“至少一次成功”适合多次采样；“每次都成功”更严格地衡量一致性。</text>
</svg>