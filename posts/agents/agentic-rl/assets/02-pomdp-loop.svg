<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Agentic RL 的部分可观测决策循环">
<title>Agentic RL 的 POMDP 交互循环</title><desc>环境具有不可直接观察的状态，智能体根据历史观察形成策略，输出思考、工具调用或最终回答；环境转移后返回新观察。</desc>
<rect width="960" height="420" rx="18" fill="#f7faf8"/>
<rect x="38" y="82" width="215" height="235" rx="15" fill="#f0f3f6" stroke="#8fa5b0" stroke-width="2"/>
<text x="145" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#314d57">Environment</text>
<rect x="66" y="137" width="159" height="62" rx="9" fill="#e1eaf0" stroke="#9ab1bc"/><text x="145" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#314d57">Hidden state sₜ</text><text x="145" y="184" text-anchor="middle" font-size="13" fill="#526d76">真实世界状态</text>
<rect x="66" y="225" width="159" height="62" rx="9" fill="#fff0e7" stroke="#d69b79"/><text x="145" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#814e36">Observation oₜ</text><text x="145" y="272" text-anchor="middle" font-size="13" fill="#814e36">可见反馈</text>
<path d="M145 199 V225" stroke="#9a6b4d" stroke-width="2.5"/><path d="M145 225 l-6 -9 h12 z" fill="#9a6b4d"/>
<rect x="371" y="104" width="220" height="190" rx="15" fill="#e7f3ee" stroke="#7baea3" stroke-width="2"/>
<text x="481" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#24534d">Agent Policy πθ</text>
<rect x="401" y="157" width="160" height="52" rx="9" fill="#fff" stroke="#a9c9bf"/><text x="481" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#24534d">History hₜ</text><text x="481" y="198" text-anchor="middle" font-size="13" fill="#52756d">观察 + 动作 + 结果</text>
<rect x="401" y="225" width="160" height="48" rx="9" fill="#d8ece4" stroke="#8bb9aa"/><text x="481" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#24534d">Action aₜ</text>
<path d="M253 255 H371" stroke="#9a6b4d" stroke-width="3"/><path d="M371 255 l-10 -7 v14 z" fill="#9a6b4d"/><text x="312" y="241" text-anchor="middle" font-size="14" fill="#814e36">oₜ</text>
<path d="M591 249 H706" stroke="#187e75" stroke-width="3"/><path d="M706 249 l-10 -7 v14 z" fill="#187e75"/><text x="648" y="235" text-anchor="middle" font-size="14" fill="#187e75">aₜ</text>
<rect x="712" y="180" width="210" height="138" rx="15" fill="#fff4eb" stroke="#d69b79" stroke-width="2"/>
<text x="817" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#814e36">Transition</text><text x="817" y="242" text-anchor="middle" font-size="15" fill="#814e36">sₜ → sₜ₊₁</text><text x="817" y="271" text-anchor="middle" font-size="14" fill="#814e36">Reward rₜ / done</text><text x="817" y="296" text-anchor="middle" font-size="13" fill="#814e36">工具执行与状态更新</text>
<path d="M817 180 V66 H145 V82" fill="none" stroke="#187e75" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M145 82 l-7 10 h14 z" fill="#187e75"/>
<text x="480" y="42" text-anchor="middle" font-size="15" fill="#526d76">部分可观测：策略看见的是 observation，不是完整 state</text>
<text x="480" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#24434a">每一步行动都会改变下一步可见的信息与可行决策</text>
<text x="480" y="391" text-anchor="middle" font-size="14" fill="#63777b">历史 hₜ 是策略的条件输入；必要时还可维护显式 belief / memory</text>
</svg>
