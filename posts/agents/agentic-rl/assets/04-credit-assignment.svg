<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="稀疏终局奖励如何沿多轮轨迹分配信用">
<title>从终局奖励到逐步信用分配</title><desc>三次动作分别产生观察，最后一次任务完成得到奖励，回报和优势估计把终局信号关联到前面决策。</desc>
<rect width="960" height="390" rx="18" fill="#f7faf8"/><text x="40" y="43" font-size="20" font-weight="700" fill="#24434a">一条三步轨迹：只有最后一步拿到显式成功奖励</text>
<line x1="125" y1="150" x2="835" y2="150" stroke="#9eb3ad" stroke-width="4"/>
<circle cx="160" cy="150" r="34" fill="#e5f2ed" stroke="#79aaa0" stroke-width="3"/><text x="160" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#24534d">a₀</text><text x="160" y="98" text-anchor="middle" font-size="15" fill="#24534d">搜索项目</text><rect x="88" y="205" width="144" height="58" rx="9" fill="#fff" stroke="#a9c9bf"/><text x="160" y="230" text-anchor="middle" font-size="15" fill="#24534d">o₁：找到团队</text><text x="160" y="251" text-anchor="middle" font-size="13" fill="#52756d">r₀ = 0</text>
<circle cx="480" cy="150" r="34" fill="#e5f2ed" stroke="#79aaa0" stroke-width="3"/><text x="480" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#24534d">a₁</text><text x="480" y="98" text-anchor="middle" font-size="15" fill="#24534d">查询负责人</text><rect x="408" y="205" width="144" height="58" rx="9" fill="#fff" stroke="#a9c9bf"/><text x="480" y="230" text-anchor="middle" font-size="15" fill="#24534d">o₂：找到姓名</text><text x="480" y="251" text-anchor="middle" font-size="13" fill="#52756d">r₁ = 0</text>
<circle cx="800" cy="150" r="34" fill="#f9e8df" stroke="#d69b79" stroke-width="3"/><text x="800" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#814e36">a₂</text><text x="800" y="98" text-anchor="middle" font-size="15" fill="#814e36">提交答案</text><rect x="728" y="205" width="144" height="58" rx="9" fill="#fff2e9" stroke="#d69b79"/><text x="800" y="230" text-anchor="middle" font-size="15" fill="#814e36">任务完成</text><text x="800" y="251" text-anchor="middle" font-size="13" fill="#814e36">r₂ = +1</text>
<path d="M800 263 V290 H160 V263" fill="none" stroke="#b87954" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M160 263 l-7 10 h14 z" fill="#b87954"/>
<text x="480" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#814e36">Credit assignment：估计前面动作对最终成功的贡献</text>
<rect x="78" y="338" width="804" height="34" rx="8" fill="#e9f1ec"/><text x="480" y="360" text-anchor="middle" font-size="15" fill="#315b46">G₂ = 1 ··· G₁ = γ ··· G₀ = γ²（示意：γ = 0.9 时分别为 1、0.9、0.81）</text>
</svg>
