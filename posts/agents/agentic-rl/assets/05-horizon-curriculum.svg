<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="逐步扩展交互轮数的长程训练课程">
<title>渐进式交互 Horizon Curriculum</title><desc>训练从短交互任务开始，逐渐增加最大交互轮数，使策略先学会基本行为，再学习长程探索与规划。</desc>
<rect width="960" height="360" rx="18" fill="#f7faf8"/><text x="40" y="43" font-size="20" font-weight="700" fill="#24434a">先学会完成短任务，再逐步增加决策跨度</text>
<path d="M80 275 H880" stroke="#9eb3ad" stroke-width="2"/><path d="M80 275 V80" stroke="#9eb3ad" stroke-width="2"/><text x="480" y="329" text-anchor="middle" font-size="14" fill="#63777b">训练进度 →</text><text x="35" y="180" transform="rotate(-90 35 180)" text-anchor="middle" font-size="14" fill="#63777b">最大交互轮数 H</text>
<rect x="130" y="205" width="180" height="70" rx="10" fill="#e5f2ed" stroke="#79aaa0" stroke-width="2"/><text x="220" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#24534d">Stage 1</text><text x="220" y="257" text-anchor="middle" font-size="15" fill="#52756d">H = 2–3 · 短任务</text>
<rect x="390" y="145" width="180" height="130" rx="10" fill="#edf0f8" stroke="#9ca8ca" stroke-width="2"/><text x="480" y="177" text-anchor="middle" font-size="18" font-weight="700" fill="#4c547c">Stage 2</text><text x="480" y="203" text-anchor="middle" font-size="15" fill="#5c648b">H = 4–6</text><text x="480" y="231" text-anchor="middle" font-size="14" fill="#5c648b">多工具组合</text>
<rect x="650" y="80" width="180" height="195" rx="10" fill="#fff0e7" stroke="#d69b79" stroke-width="2"/><text x="740" y="113" text-anchor="middle" font-size="18" font-weight="700" fill="#814e36">Stage 3</text><text x="740" y="139" text-anchor="middle" font-size="15" fill="#814e36">H = 8–12+</text><text x="740" y="168" text-anchor="middle" font-size="14" fill="#814e36">长程约束</text><text x="740" y="192" text-anchor="middle" font-size="14" fill="#814e36">回溯与重规划</text>
<path d="M310 205 L390 145" stroke="#187e75" stroke-width="3"/><path d="M390 145 l-12 3 8 9 z" fill="#187e75"/><path d="M570 145 L650 80" stroke="#187e75" stroke-width="3"/><path d="M650 80 l-12 3 8 9 z" fill="#187e75"/>
<text x="480" y="300" text-anchor="middle" font-size="13" fill="#63777b">概念示意图；不是 AgentGym-RL 的原始训练曲线</text>
</svg>
