<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="autogpt-evolution-title autogpt-evolution-desc">
<title id="autogpt-evolution-title">AutoGPT Classic 与 AutoGPT Platform 的控制方式比较</title>
<desc id="autogpt-evolution-desc">Classic 以 LLM 逐轮决定下一步行动，形成开放式反馈循环；Platform 以显式的图工作流连接类型化 Blocks，并通过输出端、错误端和触发器管理流程。</desc>
<rect width="1000" height="500" rx="22" fill="#f6f8f5"/>
<rect x="35" y="35" width="440" height="430" rx="18" fill="#fff" stroke="#d6e2dc" stroke-width="2"/>
<rect x="525" y="35" width="440" height="430" rx="18" fill="#fff" stroke="#d6e2dc" stroke-width="2"/>
<text x="255" y="76" text-anchor="middle" font-size="23" font-weight="700" fill="#315c55">Classic：动态决策循环</text>
<text x="745" y="76" text-anchor="middle" font-size="23" font-weight="700" fill="#315c55">Platform：显式工作流图</text>
<rect x="145" y="112" width="220" height="65" rx="12" fill="#e6f1ed" stroke="#8eb9a8" stroke-width="2"/><text x="255" y="151" text-anchor="middle" font-size="19" font-weight="700" fill="#2b6258">LLM 选择下一动作</text>
<rect x="145" y="235" width="220" height="65" rx="12" fill="#fff0df" stroke="#d9a674" stroke-width="2"/><text x="255" y="274" text-anchor="middle" font-size="19" font-weight="700" fill="#80542f">工具 / 环境执行</text>
<rect x="145" y="358" width="220" height="65" rx="12" fill="#e9eef8" stroke="#9aaed0" stroke-width="2"/><text x="255" y="397" text-anchor="middle" font-size="19" font-weight="700" fill="#3a5074">Observation / 历史</text>
<path d="M255 177 V235 M255 300 V358 M145 390 H80 V145 H145" fill="none" stroke="#3c8477" stroke-width="3" stroke-linecap="round"/>
<path d="M255 177 V235 M255 300 V358" stroke="#3c8477" stroke-width="3"/>
<text x="70" y="275" transform="rotate(-90 70 275)" text-anchor="middle" font-size="13" fill="#6e8179">根据新结果再次规划</text>
<rect x="565" y="112" width="130" height="70" rx="11" fill="#e8edf8" stroke="#9aadd0" stroke-width="2"/><text x="630" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#3a5074">Input</text><text x="630" y="164" text-anchor="middle" font-size="13" fill="#63799a">任务参数</text>
<rect x="735" y="112" width="170" height="70" rx="11" fill="#e6f1ed" stroke="#8eb9a8" stroke-width="2"/><text x="820" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#2b6258">AI / Search</text><text x="820" y="164" text-anchor="middle" font-size="13" fill="#63837a">Action Block</text>
<rect x="735" y="252" width="170" height="70" rx="11" fill="#fff0df" stroke="#d9a674" stroke-width="2"/><text x="820" y="283" text-anchor="middle" font-size="17" font-weight="700" fill="#80542f">Human Review</text><text x="820" y="304" text-anchor="middle" font-size="13" fill="#9a754f">人工审核</text>
<rect x="565" y="382" width="130" height="55" rx="11" fill="#e9eef8" stroke="#9aadd0" stroke-width="2"/><text x="630" y="416" text-anchor="middle" font-size="17" font-weight="700" fill="#3a5074">Output</text>
<path d="M695 147 H735 M820 182 V252 M735 287 H695 V409 H695" fill="none" stroke="#3c8477" stroke-width="3" stroke-linecap="round"/>
<path d="M820 322 V352 H630 V382" fill="none" stroke="#bd7950" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="865" y="365" font-size="12" fill="#9a6748">error / fallback</text>
<text x="255" y="450" text-anchor="middle" font-size="13" fill="#74857e">开放式任务适应性强，但必须限制循环与副作用</text>
<text x="745" y="450" text-anchor="middle" font-size="13" fill="#74857e">流程更可审查，但动态规划能力取决于图中设计</text>
</svg>