<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
<title id="title">长时任务的五类上下文管理策略</title><desc id="desc">比较 Trimming、Summarization、Compaction、Persistent Memory 和 Sub-agent Isolation 各自解决的问题。</desc>
<rect width="1040" height="470" rx="22" fill="#f8fbf9"/>
<text x="520" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#24484c" font-family="system-ui,sans-serif">Five levers for long-horizon context</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif">
<g transform="translate(36 92)"><rect width="178" height="278" rx="13" fill="#fff0e7" stroke="#d8a27d" stroke-width="2"/><text x="89" y="37" text-anchor="middle" font-size="18" font-weight="700" fill="#a85e3d">TRIMMING</text><rect x="24" y="66" width="130" height="23" rx="5" fill="#e7c2aa"/><rect x="24" y="96" width="130" height="23" rx="5" fill="#e7c2aa"/><rect x="24" y="126" width="130" height="23" rx="5" fill="#e7c2aa"/><rect x="24" y="156" width="130" height="23" rx="5" fill="#bd8766"/><rect x="24" y="186" width="130" height="23" rx="5" fill="#bd8766"/><path d="M24 224 H154" stroke="#b06b48" stroke-width="2" stroke-dasharray="5 4"/><text x="89" y="251" text-anchor="middle" font-size="12" fill="#765d4d">删除旧轮次</text></g>
<g transform="translate(239 92)"><rect width="178" height="278" rx="13" fill="#eaf2f8" stroke="#8bb3ca" stroke-width="2"/><text x="89" y="37" text-anchor="middle" font-size="18" font-weight="700" fill="#3e7092">SUMMARY</text><rect x="25" y="72" width="128" height="31" rx="6" fill="#c8dce8"/><rect x="25" y="114" width="128" height="31" rx="6" fill="#c8dce8"/><rect x="25" y="156" width="128" height="31" rx="6" fill="#c8dce8"/><text x="89" y="92" text-anchor="middle" font-size="11" fill="#315d78">目标</text><text x="89" y="134" text-anchor="middle" font-size="11" fill="#315d78">决策</text><text x="89" y="176" text-anchor="middle" font-size="11" fill="#315d78">待办</text><path d="M89 200 V222" stroke="#5c91ae" stroke-width="2"/><path d="M82 215 L89 224 L96 215" fill="none" stroke="#5c91ae" stroke-width="2"/><text x="89" y="251" text-anchor="middle" font-size="12" fill="#526f7e">压缩旧历史</text></g>
<g transform="translate(442 92)"><rect width="178" height="278" rx="13" fill="#f0edfa" stroke="#aa9dce" stroke-width="2"/><text x="89" y="37" text-anchor="middle" font-size="18" font-weight="700" fill="#6b5b9d">COMPACTION</text><rect x="23" y="73" width="132" height="45" rx="7" fill="#d7d0ed"/><text x="89" y="101" text-anchor="middle" font-size="12" fill="#5c5087">旧窗口</text><path d="M89 121 V153" stroke="#8072ad" stroke-width="2"/><path d="M82 146 L89 155 L96 146" fill="none" stroke="#8072ad" stroke-width="2"/><rect x="23" y="161" width="132" height="35" rx="7" fill="#bdb2df"/><text x="89" y="183" text-anchor="middle" font-size="12" fill="#4e427c">紧凑状态</text><path d="M89 198 V222" stroke="#8072ad" stroke-width="2"/><text x="89" y="251" text-anchor="middle" font-size="12" fill="#615b7b">跨窗口续跑</text></g>
<g transform="translate(645 92)"><rect width="178" height="278" rx="13" fill="#e7f3ef" stroke="#83b5a8" stroke-width="2"/><text x="89" y="37" text-anchor="middle" font-size="18" font-weight="700" fill="#176f67">MEMORY</text><rect x="23" y="73" width="132" height="32" rx="7" fill="#c7e4d9"/><rect x="23" y="115" width="132" height="32" rx="7" fill="#b7d9cc"/><rect x="23" y="157" width="132" height="32" rx="7" fill="#a6cdbd"/><text x="89" y="94" text-anchor="middle" font-size="12" fill="#24675f">事件</text><text x="89" y="136" text-anchor="middle" font-size="12" fill="#24675f">笔记</text><text x="89" y="178" text-anchor="middle" font-size="12" fill="#24675f">知识索引</text><text x="89" y="251" text-anchor="middle" font-size="12" fill="#486e68">跨会话复用</text></g>
<g transform="translate(848 92)"><rect width="156" height="278" rx="13" fill="#edf1f0" stroke="#a7b9b4" stroke-width="2"/><text x="78" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#526c69">SUB-AGENT</text><rect x="18" y="74" width="120" height="48" rx="7" fill="#d8e5e0"/><rect x="18" y="135" width="120" height="48" rx="7" fill="#c7dcd5"/><rect x="18" y="196" width="120" height="35" rx="7" fill="#b6d1c7"/><text x="78" y="103" text-anchor="middle" font-size="12" fill="#355d57">独立上下文 A</text><text x="78" y="164" text-anchor="middle" font-size="12" fill="#355d57">独立上下文 B</text><text x="78" y="218" text-anchor="middle" font-size="12" fill="#355d57">摘要交接</text><text x="78" y="251" text-anchor="middle" font-size="12" fill="#526c69">任务隔离</text></g>
</g>
<text x="520" y="420" text-anchor="middle" font-size="14" fill="#6a8181" font-family="system-ui,sans-serif">可组合使用，但需要分别评估信息丢失、压缩失真、记忆陈旧与交接成本</text>
</svg>