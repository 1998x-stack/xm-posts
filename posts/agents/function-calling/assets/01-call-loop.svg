<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="fc-flow-title fc-flow-desc" data-export="01-call-loop.svg">
<title id="fc-flow-title">Function Calling 的模型与应用执行闭环</title><desc id="fc-flow-desc">用户请求进入模型，模型产生结构化工具调用；应用侧验证参数和权限后执行外部工具，再把带调用标识的结果交回模型，最终由模型生成回答或下一次调用。</desc>
<defs><marker id="fc-flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#187e75"/></marker><marker id="fc-flow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#b46744"/></marker></defs><rect width="1120" height="430" rx="18" fill="#f8fbf9"/><text x="560" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#24484c">模型决定“调用什么”；宿主应用决定“是否执行、如何执行”</text>
<rect x="28" y="150" width="128" height="86" rx="12" fill="#e8f1f5" stroke="#91b1bf" stroke-width="2"/><text x="92" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#24484c">用户请求</text><text x="92" y="210" text-anchor="middle" font-size="13" fill="#49666e">自然语言</text>
<rect x="200" y="150" width="160" height="86" rx="12" fill="#dff1eb" stroke="#78b9a8" stroke-width="2"/><text x="280" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#205e56">LLM</text><text x="280" y="210" text-anchor="middle" font-size="13" fill="#49666e">选择工具 / 生成参数</text>
<rect x="408" y="150" width="160" height="86" rx="12" fill="#fff0df" stroke="#d9a36e" stroke-width="2"/><text x="488" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#89552f">Tool Call</text><text x="488" y="210" text-anchor="middle" font-size="13" fill="#805f45">name + arguments + id</text>
<rect x="616" y="132" width="190" height="122" rx="12" fill="#eee9fb" stroke="#a99bd5" stroke-width="2"/><text x="711" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#574b8d">应用 / Runtime</text><text x="711" y="194" text-anchor="middle" font-size="13" fill="#5f5b79">解析 · Schema 校验</text><text x="711" y="216" text-anchor="middle" font-size="13" fill="#5f5b79">权限 · 审批 · 执行</text>
<rect x="856" y="150" width="132" height="86" rx="12" fill="#e5f0f7" stroke="#8aaec4" stroke-width="2"/><text x="922" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#355c73">外部工具</text><text x="922" y="210" text-anchor="middle" font-size="13" fill="#49666e">API / DB / 文件</text>
<rect x="1010" y="150" width="88" height="86" rx="12" fill="#f8e9e2" stroke="#d5a18b" stroke-width="2"/><text x="1054" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#8b4f39">结果</text><text x="1054" y="210" text-anchor="middle" font-size="12" fill="#805f45">Output</text>
<path d="M156 193 H196 M360 193 H404 M568 193 H612 M806 193 H852 M988 193 H1006" fill="none" stroke="#187e75" stroke-width="3" marker-end="url(#fc-flow-arrow)"/>
<path d="M1054 238 V332 H280 V240" fill="none" stroke="#b46744" stroke-width="3" marker-end="url(#fc-flow-orange)"/><text x="675" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#a45e3c">tool result：带着原 call_id 返回模型</text>
<rect x="220" y="355" width="120" height="42" rx="9" fill="#e0f0e9" stroke="#8bbcae"/><text x="280" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#205e56">最终回答 / 再调用</text><path d="M280 355 V240" fill="none" stroke="#187e75" stroke-width="2" stroke-dasharray="5 5"/>
<text x="560" y="414" text-anchor="middle" font-size="12" fill="#667b7c">任何校验失败、权限拒绝或工具错误，都必须形成明确结果，而不是假装执行成功。</text></svg>