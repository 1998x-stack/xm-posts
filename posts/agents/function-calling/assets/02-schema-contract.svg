<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="fc-schema-title fc-schema-desc" data-export="02-schema-contract.svg">
<title id="fc-schema-title">工具 Schema 与执行校验的多层契约</title><desc id="fc-schema-desc">工具定义包含名称、描述、参数结构；模型生成调用后，运行时依次进行 JSON 解析、Schema 结构校验、业务规则检查和权限验证，最后才允许执行。</desc>
<defs><marker id="fc-schema-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#187e75"/></marker></defs><rect width="1000" height="390" rx="18" fill="#f8fbf9"/><text x="500" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#24484c">结构正确 ≠ 业务允许 ≠ 操作安全</text>
<rect x="35" y="88" width="205" height="220" rx="13" fill="#e7f2ee" stroke="#88bcae" stroke-width="2"/><text x="137" y="121" text-anchor="middle" font-size="17" font-weight="700" fill="#205e56">Tool Definition</text><text x="58" y="160" font-size="14" fill="#345f5d">① name</text><text x="58" y="190" font-size="14" fill="#345f5d">② description</text><text x="58" y="220" font-size="14" fill="#345f5d">③ input schema</text><text x="58" y="250" font-size="14" fill="#345f5d">④ output / errors</text><text x="58" y="280" font-size="14" fill="#345f5d">⑤ usage examples</text>
<path d="M240 198 H286" stroke="#187e75" stroke-width="3" marker-end="url(#fc-schema-arrow)"/>
<rect x="292" y="115" width="148" height="166" rx="13" fill="#fff0df" stroke="#d9a36e" stroke-width="2"/><text x="366" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#89552f">Model Call</text><text x="366" y="186" text-anchor="middle" font-size="13" fill="#805f45">tool name</text><text x="366" y="210" text-anchor="middle" font-size="13" fill="#805f45">JSON arguments</text><text x="366" y="234" text-anchor="middle" font-size="13" fill="#805f45">call_id</text>
<path d="M440 198 H482" stroke="#187e75" stroke-width="3" marker-end="url(#fc-schema-arrow)"/>
<rect x="488" y="77" width="455" height="252" rx="14" fill="#fff" stroke="#b9c9c4" stroke-width="2"/><text x="715" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#24484c">Application-side gates</text>
<rect x="515" y="132" width="190" height="65" rx="9" fill="#e7f2f8" stroke="#8aaec4"/><text x="610" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#355c73">1 · JSON Parse</text><text x="610" y="180" text-anchor="middle" font-size="12" fill="#49666e">语法是否合法？</text>
<rect x="726" y="132" width="190" height="65" rx="9" fill="#e7f2f8" stroke="#8aaec4"/><text x="821" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#355c73">2 · Schema</text><text x="821" y="180" text-anchor="middle" font-size="12" fill="#49666e">类型 / 字段 / 枚举</text>
<rect x="515" y="220" width="190" height="65" rx="9" fill="#eee9fb" stroke="#a99bd5"/><text x="610" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#574b8d">3 · Business Rules</text><text x="610" y="268" text-anchor="middle" font-size="12" fill="#5f5b79">范围 / 状态 / 约束</text>
<rect x="726" y="220" width="190" height="65" rx="9" fill="#fff0df" stroke="#d9a36e"/><text x="821" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#89552f">4 · Authorization</text><text x="821" y="268" text-anchor="middle" font-size="12" fill="#805f45">身份 / 权限 / 审批</text>
<text x="500" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#a34e4e">任一关失败：拒绝执行，并返回可诊断的错误</text></svg>