<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="fc-parallel-title fc-parallel-desc" data-export="03-parallel-vs-sequential.svg">
<title id="fc-parallel-title">工具调用的并行与顺序依赖</title><desc id="fc-parallel-desc">上半部分展示两个独立查询同时执行后聚合；下半部分展示先查询库存，再依据结果创建订单，后一步依赖前一步。</desc>
<defs><marker id="fc-par-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#187e75"/></marker></defs><rect width="1000" height="390" rx="18" fill="#f8fbf9"/><text x="500" y="37" text-anchor="middle" font-size="21" font-weight="700" fill="#24484c">是否并行，取决于数据依赖和副作用，而不只是模型能否一次输出多个调用</text>
<text x="42" y="89" font-size="16" font-weight="700" fill="#205e56">A · 独立查询：可以并行</text><rect x="42" y="116" width="150" height="54" rx="10" fill="#e8f1f5" stroke="#91b1bf"/><text x="117" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#355c73">模型发起 2 calls</text>
<path d="M192 143 H245 V116 H294 M245 143 V174 H294" fill="none" stroke="#187e75" stroke-width="2.5" marker-end="url(#fc-par-arrow)"/>
<rect x="300" y="91" width="180" height="52" rx="10" fill="#e0f1eb" stroke="#83b9a9"/><text x="390" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#205e56">get_weather(Tokyo)</text><rect x="300" y="151" width="180" height="52" rx="10" fill="#e0f1eb" stroke="#83b9a9"/><text x="390" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#205e56">get_weather(Osaka)</text>
<path d="M480 117 H555 V146 H622 M480 177 H555 V146" fill="none" stroke="#187e75" stroke-width="2.5" marker-end="url(#fc-par-arrow)"/><rect x="628" y="118" width="180" height="56" rx="10" fill="#eee9fb" stroke="#a99bd5"/><text x="718" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#574b8d">聚合 / 比较结果</text>
<text x="42" y="250" font-size="16" font-weight="700" fill="#89552f">B · 有依赖：必须顺序执行</text><rect x="42" y="278" width="150" height="54" rx="10" fill="#e8f1f5" stroke="#91b1bf"/><text x="117" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#355c73">用户下单请求</text>
<rect x="300" y="278" width="170" height="54" rx="10" fill="#fff0df" stroke="#d9a36e"/><text x="385" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#89552f">查询库存</text><rect x="580" y="278" width="170" height="54" rx="10" fill="#fff0df" stroke="#d9a36e"/><text x="665" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#89552f">创建订单</text>
<path d="M192 305 H296 M470 305 H576" fill="none" stroke="#b46744" stroke-width="2.5" marker-end="url(#fc-par-arrow)"/><text x="520" y="360" text-anchor="middle" font-size="13" fill="#805f45">第二步必须读取第一步的库存结果；不能把依赖关系当成并行任务。</text></svg>