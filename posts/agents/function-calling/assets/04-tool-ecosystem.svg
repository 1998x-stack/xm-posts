<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="fc-stack-title fc-stack-desc" data-export="04-tool-ecosystem.svg">
<title id="fc-stack-title">现代工具生态的三个互补层次</title><desc id="fc-stack-desc">模型能力负责判断何时调用以及生成参数；工具协议负责结构化调用和工具发现；运行时负责编排、权限、执行、重试和评测。</desc>
<rect width="1000" height="365" rx="18" fill="#f8fbf9"/><text x="500" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#24484c">工具生态不是一个 API：它由能力、协议和运行时共同构成</text>
<rect x="110" y="70" width="780" height="75" rx="12" fill="#e0f1eb" stroke="#83b9a9" stroke-width="2"/><text x="145" y="101" font-size="17" font-weight="700" fill="#205e56">模型能力层</text><text x="145" y="125" font-size="13" fill="#49666e">Toolformer · ReAct · SFT / tool traces · tool selection · argument generation</text>
<rect x="110" y="158" width="780" height="75" rx="12" fill="#e7f2f8" stroke="#8aaec4" stroke-width="2"/><text x="145" y="189" font-size="17" font-weight="700" fill="#355c73">协议与发现层</text><text x="145" y="213" font-size="13" fill="#49666e">Function Calling · JSON Schema · MCP · tool search · call/result correlation</text>
<rect x="110" y="246" width="780" height="75" rx="12" fill="#eee9fb" stroke="#a99bd5" stroke-width="2"/><text x="145" y="277" font-size="17" font-weight="700" fill="#574b8d">运行时与治理层</text><text x="145" y="301" font-size="13" fill="#5f5b79">Execution · authorization · approval · sandbox · retries · observability · evals</text><path d="M500 145 V154 M500 233 V242" stroke="#187e75" stroke-width="3"/><text x="500" y="348" text-anchor="middle" font-size="12" fill="#667b7c">每一层解决不同问题；任何一层都不能替代其他层。</text></svg>