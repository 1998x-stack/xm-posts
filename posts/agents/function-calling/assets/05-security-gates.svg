<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="fc-security-title fc-security-desc" data-export="05-security-gates.svg">
<title id="fc-security-title">高影响工具调用的安全闸门</title><desc id="fc-security-desc">模型提出动作后，系统依次检查原始用户意图、参数和目标、权限、人工审批、沙箱执行和审计结果；任何一步失败都停止动作。</desc>
<defs><marker id="fc-sec-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#187e75"/></marker></defs><rect width="1000" height="390" rx="18" fill="#f8fbf9"/><text x="500" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#24484c">模型提出动作 ≠ 系统授予权限</text>
<rect x="34" y="125" width="130" height="72" rx="10" fill="#fff0df" stroke="#d9a36e" stroke-width="2"/><text x="99" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#89552f">Tool Call</text><text x="99" y="177" text-anchor="middle" font-size="12" fill="#805f45">模型提议</text>
<rect x="200" y="125" width="140" height="72" rx="10" fill="#e7f2f8" stroke="#8aaec4"/><text x="270" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#355c73">意图校验</text><text x="270" y="177" text-anchor="middle" font-size="12" fill="#49666e">是否符合用户目标？</text>
<rect x="376" y="125" width="140" height="72" rx="10" fill="#e7f2f8" stroke="#8aaec4"/><text x="446" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#355c73">权限校验</text><text x="446" y="177" text-anchor="middle" font-size="12" fill="#49666e">身份 / 资源 / 范围</text>
<rect x="552" y="125" width="140" height="72" rx="10" fill="#eee9fb" stroke="#a99bd5"/><text x="622" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#574b8d">人工审批</text><text x="622" y="177" text-anchor="middle" font-size="12" fill="#5f5b79">高风险操作</text>
<rect x="728" y="125" width="112" height="72" rx="10" fill="#e0f1eb" stroke="#83b9a9"/><text x="784" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#205e56">隔离执行</text><text x="784" y="177" text-anchor="middle" font-size="12" fill="#49666e">沙箱 / 限额</text>
<rect x="876" y="125" width="92" height="72" rx="10" fill="#e0f1eb" stroke="#83b9a9"/><text x="922" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#205e56">审计</text><text x="922" y="177" text-anchor="middle" font-size="12" fill="#49666e">日志</text>
<path d="M164 161 H196 M340 161 H372 M516 161 H548 M692 161 H724 M840 161 H872" fill="none" stroke="#187e75" stroke-width="2.5" marker-end="url(#fc-sec-arrow)"/>
<path d="M270 197 V257 H622 V202 M446 197 V257 M622 197 V257 M784 197 V257" fill="none" stroke="#b46744" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="350" y="276" width="300" height="58" rx="11" fill="#fff0ef" stroke="#d5a1a1" stroke-width="2"/><text x="500" y="301" text-anchor="middle" font-size="15" font-weight="700" fill="#a34e4e">拒绝 / 暂停 / 请求澄清</text><text x="500" y="321" text-anchor="middle" font-size="12" fill="#805b5b">任一闸门失败，不执行副作用</text><text x="500" y="367" text-anchor="middle" font-size="12" fill="#667b7c">执行结果还要验证，并将成功、失败或待审批状态准确回传。</text></svg>