<path d="M565 166H634 M624 157L634 166L624 175" stroke="#438a7d" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M754 263V300H450V282" stroke="#c47e50" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>
<path d="M441 291L450 282L459 291" stroke="#c47e50" stroke-width="2.5" fill="none"/>
<text x="600" y="326" fill="#8a664c" font-size="13" text-anchor="middle">执行结果、测试与日志回流</text>
</g></svg>