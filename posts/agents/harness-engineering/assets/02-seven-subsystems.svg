<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="h2-title h2-desc">
<title id="h2-title">Harness 的七个核心子系统</title>
<desc id="h2-desc">围绕 Agent Loop 的七个子系统：模型集成、工具与动作、记忆与上下文、安全与权限、编排、扩展性，以及横切的接口和会话底座。</desc>
<rect width="900" height="390" rx="22" fill="#f6f8f5"/>
