<text x="450" y="182" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">Agent Loop</text>
<text x="450" y="211" text-anchor="middle" font-size="14" fill="#e4f4ed">observe → decide → act</text>
<g fill="#fff" stroke="#bfd7cc" stroke-width="2">
<rect x="36" y="55" width="190" height="76" rx="13"/><rect x="267" y="34" width="190" height="76" rx="13"/><rect x="503" y="34" width="190" height="76" rx="13"/><rect x="674" y="55" width="190" height="76" rx="13"/>
<rect x="36" y="266" width="190" height="76" rx="13"/><rect x="267" y="282" width="190" height="76" rx="13"/><rect x="503" y="282" width="190" height="76" rx="13"/>
</g>
<g fill="#315f5c" font-size="17" font-weight="750" text-anchor="middle">
<text x="131" y="86">LLM Integration</text><text x="362" y="65">Tools &amp; Actions</text><text x="598" y="65">Memory &amp; Context</text><text x="769" y="86">Safety &amp; Permissions</text>
<text x="131" y="297">Orchestration</text><text x="362" y="313">Extensibility</text><text x="598" y="313">Interface / Session</text>
</g>
<g fill="#66817b" font-size="12" text-anchor="middle">
<text x="131" y="109">模型协议、路由、缓存</text><text x="362" y="88">搜索、编辑、执行</text><text x="598" y="88">检索、压缩、持久化</text><text x="769" y="109">沙箱、审批、策略</text>
<text x="131" y="320">子 Agent 与任务协调</text><text x="362" y="336">Skills、Hooks、MCP</text><text x="598" y="336">CLI、IDE、SDK、恢复</text>
