<path d="M371 284V311H796V284" stroke="#c17b4d" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
<text x="584" y="334" text-anchor="middle" fill="#94633f" font-size="13">Git 历史 + 结构化进度文件 = 跨窗口交接协议</text>
</g></svg>