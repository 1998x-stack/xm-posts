<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="stack-title stack-desc">
<title id="stack-title">从 Prompt 到 Loop：工程关注点逐层外移</title><desc id="stack-desc">四层工程关注点从单次指令扩展到可持续运行的 Agent 系统。</desc>
<rect width="960" height="360" rx="20" fill="#fffdf9" stroke="#d8e2dd"/>

<text x="42" y="44" fill="#52706e" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">ENGINEERING ABSTRACTION</text>
<rect x="40" y="64" width="880" height="58" rx="11" fill="#e9f4ee" stroke="#d8e2dd"/><rect x="40" y="64" width="9" height="58" rx="4" fill="#2d776d"/><text x="68" y="88" fill="#25484b" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Prompt Engineering</text><text x="390" y="88" fill="#345b5c" font-size="16" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">写清楚这一轮要模型做什么</text><text x="390" y="109" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">单次输入与输出</text><rect x="40" y="134" width="880" height="58" rx="11" fill="#eaf1f8" stroke="#d8e2dd"/><rect x="40" y="134" width="9" height="58" rx="4" fill="#456f96"/><text x="68" y="158" fill="#25484b" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Context Engineering</text><text x="390" y="158" fill="#345b5c" font-size="16" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">决定模型这一轮应该看到什么</text><text x="390" y="179" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">信息选择、排序与压缩</text><rect x="40" y="204" width="880" height="58" rx="11" fill="#fdf0e5" stroke="#d8e2dd"/><rect x="40" y="204" width="9" height="58" rx="4" fill="#a66b43"/><text x="68" y="228" fill="#25484b" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Harness Engineering</text><text x="390" y="228" fill="#345b5c" font-size="16" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">定义模型能做什么、如何运行</text><text x="390" y="249" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">工具、权限、沙箱、测试与观测</text><rect x="40" y="274" width="880" height="58" rx="11" fill="#eeeafa" stroke="#d8e2dd"/><rect x="40" y="274" width="9" height="58" rx="4" fill="#6f5c9c"/><text x="68" y="298" fill="#25484b" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Loop Engineering</text><text x="390" y="298" fill="#345b5c" font-size="16" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">决定系统何时再次启动、何时结束</text><text x="390" y="319" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">触发、发现、验证、持久化与升级</text>
<text x="480" y="350" text-anchor="middle" fill="#617b78" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">不是替代关系：上层系统依赖并编排下层能力</text>

</svg>
