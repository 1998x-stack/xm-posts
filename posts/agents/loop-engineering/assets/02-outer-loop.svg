<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="outer-title outer-desc">
<title id="outer-title">Loop Engineering 的外层任务闭环</title><desc id="outer-desc">外部事件触发任务发现与执行，独立验证后进入持久化、重试、人工升级或终止。</desc>
<rect width="960" height="360" rx="20" fill="#fffdf9" stroke="#d8e2dd"/>

<text x="480" y="38" text-anchor="middle" fill="#52706e" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">OUTER CONTROL LOOP · 任务级闭环</text>
<rect x="40" y="100" width="128" height="88" rx="12" fill="#eaf1f8" stroke="#cbd9d3" stroke-width="1.5"/><text x="104" y="136" text-anchor="middle" fill="#456f96" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Trigger</text><text x="104" y="163" text-anchor="middle" fill="#486566" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">事件 / 日程</text><rect x="190" y="100" width="128" height="88" rx="12" fill="#e9f4ee" stroke="#cbd9d3" stroke-width="1.5"/><text x="254" y="136" text-anchor="middle" fill="#2d776d" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Discover</text><text x="254" y="163" text-anchor="middle" fill="#486566" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">发现 / 去重</text><rect x="340" y="100" width="128" height="88" rx="12" fill="#eeeafa" stroke="#cbd9d3" stroke-width="1.5"/><text x="404" y="136" text-anchor="middle" fill="#6f5c9c" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Context</text><text x="404" y="163" text-anchor="middle" fill="#486566" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">状态投影</text><rect x="490" y="100" width="128" height="88" rx="12" fill="#fdf0e5" stroke="#cbd9d3" stroke-width="1.5"/><text x="554" y="136" text-anchor="middle" fill="#a66b43" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Execute</text><text x="554" y="163" text-anchor="middle" fill="#486566" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">隔离执行</text><rect x="640" y="100" width="128" height="88" rx="12" fill="#eaf1f8" stroke="#cbd9d3" stroke-width="1.5"/><text x="704" y="136" text-anchor="middle" fill="#456f96" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Verify</text><text x="704" y="163" text-anchor="middle" fill="#486566" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">独立验收</text><rect x="790" y="100" width="128" height="88" rx="12" fill="#e9f4ee" stroke="#cbd9d3" stroke-width="1.5"/><text x="854" y="136" text-anchor="middle" fill="#2d776d" font-size="18" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Persist</text><text x="854" y="163" text-anchor="middle" fill="#486566" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">写回状态</text>
<path d="M168 144h18m-7 -6 7 6 -7 6" fill="none" stroke="#4d8a80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M318 144h18m-7 -6 7 6 -7 6" fill="none" stroke="#4d8a80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M468 144h18m-7 -6 7 6 -7 6" fill="none" stroke="#4d8a80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M618 144h18m-7 -6 7 6 -7 6" fill="none" stroke="#4d8a80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M768 144h18m-7 -6 7 6 -7 6" fill="none" stroke="#4d8a80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M854 188V250H554V205" fill="none" stroke="#4d8a80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M547 215l7 -10 7 10" fill="none" stroke="#4d8a80" stroke-width="2.5"/>
<rect x="362" y="252" width="384" height="55" rx="10" fill="#f4f7f4" stroke="#d8e2dd"/><text x="554" y="276" text-anchor="middle" fill="#345b5c" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">DECIDE · 根据证据选择下一步</text><text x="554" y="295" text-anchor="middle" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">重试 / 完成 / 人工升级 / 停止</text>
<path d="M362 279H255V189" fill="none" stroke="#a66b43" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M248 199l7 -10 7 10" fill="none" stroke="#a66b43" stroke-width="2.5"/>
<text x="40" y="335" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">内层 ReAct：Agent 一次运行中的 Thought → Action → Observation；外层 Loop：跨任务 / 跨会话的调度与治理。</text>

</svg>
