<text x="605" y="107" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">C</text><text x="628" y="108" fill="#294d50" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Context</text><text x="662" y="142" text-anchor="middle" fill="#567271" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">本轮看到什么</text><rect x="760" y="76" width="164" height="94" rx="12" fill="#eaf1f8" stroke="#d8e2dd"/><circle cx="785" cy="102" r="15" fill="#456f96"/><text x="785" y="107" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Π</text><text x="808" y="108" fill="#294d50" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Policy</text><text x="842" y="142" text-anchor="middle" fill="#567271" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Agent 如何行动</text><rect x="40" y="194" width="164" height="94" rx="12" fill="#fcecec" stroke="#d8e2dd"/><circle cx="65" cy="220" r="15" fill="#a34f4f"/><text x="65" y="225" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">A</text><text x="88" y="226" fill="#294d50" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Authority</text><text x="122" y="260" text-anchor="middle" fill="#567271" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">允许改什么</text><rect x="220" y="194" width="164" height="94" rx="12" fill="#e9f4ee" stroke="#d8e2dd"/><circle cx="245" cy="220" r="15" fill="#2d776d"/><text x="245" y="225" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">V</text><text x="268" y="226" fill="#294d50" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Verifier</text><text x="302" y="260" text-anchor="middle" fill="#567271" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">谁来验收</text><rect x="400" y="194" width="164" height="94" rx="12" fill="#eeeafa" stroke="#d8e2dd"/><circle cx="425" cy="220" r="15" fill="#6f5c9c"/><text x="425" y="225" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">S</text><text x="448" y="226" fill="#294d50" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Stop</text><text x="482" y="260" text-anchor="middle" fill="#567271" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">何时停止</text><rect x="580" y="194" width="164" height="94" rx="12" fill="#fdf0e5" stroke="#d8e2dd"/><circle cx="605" cy="220" r="15" fill="#a66b43"/><text x="605" y="225" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">M</text><text x="628" y="226" fill="#294d50" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Memory</text><text x="662" y="260" text-anchor="middle" fill="#567271" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">状态如何写回</text><rect x="760" y="194" width="164" height="94" rx="12" fill="#eaf1f8" stroke="#d8e2dd"/><circle cx="785" cy="220" r="15" fill="#456f96"/><text x="785" y="225" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">B</text><text x="808" y="226" fill="#294d50" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Budget</text><text x="842" y="260" text-anchor="middle" fill="#567271" font-size="14" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">最多花多少</text>
<rect x="40" y="316" width="880" height="28" rx="7" fill="#f2f5f2"/><text x="480" y="335" text-anchor="middle" fill="#526e6d" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Human escalation (H) 是贯穿所有环节的升级通道，不是循环结束后才补上的客服按钮。</text>

