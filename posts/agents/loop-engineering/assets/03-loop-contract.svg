<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="contract-title contract-desc">
<title id="contract-title">Loop Specification 的十个工程契约</title><desc id="contract-desc">每个可运行循环都应明确触发、目标、发现、上下文、策略、权限、验证、停止、状态和预算。</desc>
<rect width="960" height="360" rx="20" fill="#fffdf9" stroke="#d8e2dd"/>

<text x="480" y="36" text-anchor="middle" fill="#52706e" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">LOOP SPECIFICATION · 设计前先写清楚</text>
