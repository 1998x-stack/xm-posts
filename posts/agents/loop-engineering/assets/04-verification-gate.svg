<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="verify-title verify-desc">
<title id="verify-title">生成器与验证器分离的证据门</title><desc id="verify-desc">Agent 提交候选变更后，由独立测试、规则或评测器给出可追溯结果；失败反馈用于重试，风险和歧义升级给人。</desc>
<rect width="960" height="360" rx="20" fill="#fffdf9" stroke="#d8e2dd"/>

<text x="480" y="40" text-anchor="middle" fill="#52706e" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">GENERATOR ≠ VERIFIER</text>
<rect x="48" y="105" width="210" height="116" rx="14" fill="#eaf1f8" stroke="#b8cbd8" stroke-width="2"/><text x="153" y="146" text-anchor="middle" fill="#456f96" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Generator</text><text x="153" y="178" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">提出候选结果 Δ</text><text x="153" y="199" text-anchor="middle" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Agent / Worker</text>
<path d="M258 163H354" stroke="#4d8a80" stroke-width="3" fill="none"/><path d="M344 155l10 8 -10 8" stroke="#4d8a80" stroke-width="3" fill="none"/>
<rect x="355" y="82" width="250" height="162" rx="14" fill="#e9f4ee" stroke="#a8c8bd" stroke-width="2"/><text x="480" y="119" text-anchor="middle" fill="#2d776d" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Verifier</text><text x="480" y="151" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">单元 / 集成测试</text><text x="480" y="176" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Schema / Policy 检查</text><text x="480" y="201" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Evals / 人工抽检</text>
<path d="M605 163H688" stroke="#4d8a80" stroke-width="3" fill="none"/><path d="M678 155l10 8 -10 8" stroke="#4d8a80" stroke-width="3" fill="none"/>
<path d="M688 163V89H738" stroke="#2d776d" stroke-width="2.5" fill="none"/><path d="M728 81l10 8 -10 8" stroke="#2d776d" stroke-width="2.5" fill="none"/><rect x="739" y="54" width="176" height="70" rx="12" fill="#e9f4ee" stroke="#a8c8bd"/><text x="827" y="82" text-anchor="middle" fill="#2d776d" font-size="19" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">PASS</text><text x="827" y="105" text-anchor="middle" fill="#456b66" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">提交 / 写回</text>
<path d="M688 163V183H738" stroke="#a66b43" stroke-width="2.5" fill="none"/><path d="M728 175l10 8 -10 8" stroke="#a66b43" stroke-width="2.5" fill="none"/><rect x="739" y="149" width="176" height="70" rx="12" fill="#fdf0e5" stroke="#e3c6ad"/><text x="827" y="177" text-anchor="middle" fill="#a66b43" font-size="19" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">FAIL</text><text x="827" y="200" text-anchor="middle" fill="#765b48" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">证据反馈 / 重试</text>
<path d="M480 244V269" stroke="#a34f4f" stroke-width="2.5" fill="none"/><path d="M473 260l7 10 7 -10" stroke="#a34f4f" stroke-width="2.5" fill="none"/><rect x="356" y="278" width="250" height="50" rx="10" fill="#fcecec" stroke="#e5bcbc"/><text x="481" y="309" text-anchor="middle" fill="#a34f4f" font-size="16" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">ESCALATE · 人工决策</text>
<text x="48" y="345" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">验证器可以是确定性测试、规则、领域评测或人；“另一个 LLM”不自动等于独立验证。</text>

</svg>