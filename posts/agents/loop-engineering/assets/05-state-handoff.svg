<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="handoff-title handoff-desc">
<title id="handoff-title">跨会话状态交接：让下一轮从事实而不是猜测开始</title><desc id="handoff-desc">第一轮将任务进度、决策、证据、提交版本和下一步写入持久化状态；第二轮据此恢复。</desc>
<rect width="960" height="360" rx="20" fill="#fffdf9" stroke="#d8e2dd"/>

<text x="480" y="39" text-anchor="middle" fill="#52706e" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">CROSS-SESSION HANDOFF</text>
<rect x="42" y="90" width="244" height="180" rx="14" fill="#eaf1f8" stroke="#b8cbd8" stroke-width="2"/><text x="164" y="124" text-anchor="middle" fill="#456f96" font-size="21" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Session A</text><text x="164" y="158" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">读取目标与代码</text><text x="164" y="185" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">完成一个可验证增量</text><text x="164" y="212" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">记录失败与下一步</text><text x="164" y="244" text-anchor="middle" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">结束本次上下文</text>
<path d="M286 180H362" stroke="#4d8a80" stroke-width="3" fill="none"/><path d="M352 172l10 8 -10 8" stroke="#4d8a80" stroke-width="3" fill="none"/>
<rect x="363" y="66" width="234" height="226" rx="14" fill="#e9f4ee" stroke="#a8c8bd" stroke-width="2"/><text x="480" y="101" text-anchor="middle" fill="#2d776d" font-size="20" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Durable State</text>
<rect x="385" y="119" width="190" height="23" rx="5" fill="#fff" stroke="#d8e2dd"/><text x="480" y="135" text-anchor="middle" fill="#3f6264" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">task_id + goal</text><rect x="385" y="149" width="190" height="23" rx="5" fill="#fff" stroke="#d8e2dd"/><text x="480" y="165" text-anchor="middle" fill="#3f6264" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">current status + owner</text><rect x="385" y="179" width="190" height="23" rx="5" fill="#fff" stroke="#d8e2dd"/><text x="480" y="195" text-anchor="middle" fill="#3f6264" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">completed / pending items</text><rect x="385" y="209" width="190" height="23" rx="5" fill="#fff" stroke="#d8e2dd"/><text x="480" y="225" text-anchor="middle" fill="#3f6264" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">commit SHA + test evidence</text><rect x="385" y="239" width="190" height="23" rx="5" fill="#fff" stroke="#d8e2dd"/><text x="480" y="255" text-anchor="middle" fill="#3f6264" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">last feedback + next action</text>
<path d="M597 180H673" stroke="#4d8a80" stroke-width="3" fill="none"/><path d="M663 172l10 8 -10 8" stroke="#4d8a80" stroke-width="3" fill="none"/>
<rect x="674" y="90" width="244" height="180" rx="14" fill="#eeeafa" stroke="#c8bfe1" stroke-width="2"/><text x="796" y="124" text-anchor="middle" fill="#6f5c9c" font-size="21" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Session B</text><text x="796" y="158" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">恢复状态与版本</text><text x="796" y="185" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">重新检查关键事实</text><text x="796" y="212" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">从 next_action 继续</text><text x="796" y="244" text-anchor="middle" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">新上下文 / 同一目标</text>
<text x="480" y="333" text-anchor="middle" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">对话记录可辅助理解，但不能替代版本化、可校验的任务状态。</text>

</svg>
