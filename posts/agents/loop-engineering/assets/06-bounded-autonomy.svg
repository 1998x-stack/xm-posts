<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="bounded-title bounded-desc">
<title id="bounded-title">自主性必须被权限、预算和终止条件包围</title><desc id="bounded-desc">循环执行被限制在任务范围、工具权限、隔离环境、尝试次数、时间和费用预算之内。</desc>
<rect width="960" height="360" rx="20" fill="#fffdf9" stroke="#d8e2dd"/>

<text x="480" y="40" text-anchor="middle" fill="#52706e" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">BOUNDED AUTONOMY · 允许自动，但不允许无限</text>
<rect x="245" y="88" width="470" height="204" rx="18" fill="#f4f7f4" stroke="#9fbab0" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="480" y="118" text-anchor="middle" fill="#456b66" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">ISOLATED EXECUTION BOUNDARY</text>
<rect x="348" y="143" width="264" height="105" rx="14" fill="#eaf1f8" stroke="#b8cbd8" stroke-width="2"/><text x="480" y="179" text-anchor="middle" fill="#456f96" font-size="22" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Agent Worker</text><text x="480" y="208" text-anchor="middle" fill="#3f6264" font-size="15" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">限定任务 · 限定工具</text><text x="480" y="231" text-anchor="middle" fill="#627a79" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">无默认生产写权限</text>
<rect x="40" y="100" width="190" height="72" rx="11" fill="#e9f4ee" stroke="#d8e2dd"/><text x="135" y="127" text-anchor="middle" fill="#2d776d" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Scope</text><text x="135" y="151" text-anchor="middle" fill="#526e6d" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">文件 / API 范围</text><rect x="40" y="210" width="190" height="72" rx="11" fill="#fdf0e5" stroke="#d8e2dd"/><text x="135" y="237" text-anchor="middle" fill="#a66b43" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Permissions</text><text x="135" y="261" text-anchor="middle" fill="#526e6d" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">读写 / 网络权限</text><rect x="730" y="100" width="190" height="72" rx="11" fill="#eeeafa" stroke="#d8e2dd"/><text x="825" y="127" text-anchor="middle" fill="#6f5c9c" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Budget</text><text x="825" y="151" text-anchor="middle" fill="#526e6d" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Token / 时间 / 费用</text><rect x="730" y="210" width="190" height="72" rx="11" fill="#fcecec" stroke="#d8e2dd"/><text x="825" y="237" text-anchor="middle" fill="#a34f4f" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">Stop rules</text><text x="825" y="261" text-anchor="middle" fill="#526e6d" font-size="13" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">通过 / 超限 / 无进展</text>
<path d="M230 136H245M230 246H245M715 136H730M715 246H730" stroke="#7e9c92" stroke-width="2" fill="none"/>
<rect x="260" y="310" width="440" height="34" rx="8" fill="#fcecec" stroke="#e5bcbc"/><text x="480" y="332" text-anchor="middle" fill="#a34f4f" font-size="14" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">高风险 / 权限不足 / 预算耗尽 → STOP 或 HUMAN</text>

</svg>
