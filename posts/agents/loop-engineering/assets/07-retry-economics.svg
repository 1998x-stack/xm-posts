<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="economics-title economics-desc">
<title id="economics-title">有限重试的成功概率示例</title><desc id="economics-desc">假设每次尝试独立且成功概率恒定为百分之三十，成功概率随尝试次数增加但边际收益递减。</desc>
<rect width="960" height="360" rx="20" fill="#fffdf9" stroke="#d8e2dd"/>

<text x="480" y="40" text-anchor="middle" fill="#52706e" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">ILLUSTRATIVE MODEL · p = 0.30, independent attempts</text>
<text x="48" y="82" fill="#345b5c" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">尝试次数 n</text><text x="330" y="82" fill="#345b5c" font-size="15" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">至少成功一次的概率</text>
<text x="64" y="133" fill="#456f96" font-size="19" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">1</text><rect x="150" y="112" width="570" height="30" rx="7" fill="#edf2ee"/><rect x="150" y="112" width="171" height="30" rx="7" fill="#78b5a4"/><text x="744" y="133" fill="#2d776d" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">30.0%</text><text x="64" y="187" fill="#456f96" font-size="19" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">2</text><rect x="150" y="166" width="570" height="30" rx="7" fill="#edf2ee"/><rect x="150" y="166" width="290.7" height="30" rx="7" fill="#78b5a4"/><text x="744" y="187" fill="#2d776d" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">51.0%</text><text x="64" y="241" fill="#456f96" font-size="19" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">3</text><rect x="150" y="220" width="570" height="30" rx="7" fill="#edf2ee"/><rect x="150" y="220" width="374.49" height="30" rx="7" fill="#78b5a4"/><text x="744" y="241" fill="#2d776d" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">65.7%</text><text x="64" y="295" fill="#456f96" font-size="19" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">4</text><rect x="150" y="274" width="570" height="30" rx="7" fill="#edf2ee"/><rect x="150" y="274" width="433.14300000000003" height="30" rx="7" fill="#78b5a4"/><text x="744" y="295" fill="#2d776d" font-size="17" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">76.0%</text>
<path d="M150 332H720" stroke="#cbd9d3" stroke-width="1.5"/><text x="480" y="351" text-anchor="middle" fill="#627a79" font-size="12" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif">教学假设，不是实测 Agent 成功率；真实尝试通常相关且质量不恒定。</text>

</svg>
