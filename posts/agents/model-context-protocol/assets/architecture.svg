  <marker id="arch-arrow-b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#a46c43" stroke-width="1.5"/></marker>
</defs>
