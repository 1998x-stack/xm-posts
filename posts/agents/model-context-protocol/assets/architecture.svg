<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">MCP 的 Host、Client、Server 与外部系统架构</title>
<desc id="arch-desc">Host 管理模型、用户交互和权限策略；多个 MCP Client 分别连接专门的 MCP Server；Server 再访问数据库、文件系统和 SaaS API。服务器只接收 Host 显式发送的请求和上下文。</desc>
