<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">从用户请求到 MCP tools/call 的端到端流程</title>
<desc id="flow-desc">Host 获取服务器工具清单，将工具定义提供给模型；模型选择工具并生成参数；Host 执行策略检查后由 MCP Client 发送 tools/call；Server 调用后端并返回结果；Host 将结果交回模型。</desc>
<defs><marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#3d7772" stroke-width="1.5"/></marker></defs>
<rect x="18" y="18" width="1164" height="434" rx="22" fill="#f7faf7" stroke="#d4e1dc" stroke-width="2"/>
<g font-family="system-ui, sans-serif">
<rect x="55" y="90" width="185" height="90" rx="13" fill="#e8f3ee" stroke="#8db8aa" stroke-width="2"/>
<text x="147" y="126" text-anchor="middle" fill="#244b50" font-size="21" font-weight="700">Host</text><text x="147" y="154" text-anchor="middle" fill="#56736f" font-size="15">发现工具清单</text>
<rect x="300" y="90" width="185" height="90" rx="13" fill="#e9f3fa" stroke="#91b4ce" stroke-width="2"/>
<text x="392" y="126" text-anchor="middle" fill="#2d5975" font-size="21" font-weight="700">Model</text><text x="392" y="154" text-anchor="middle" fill="#55758b" font-size="15">选择工具 + 生成参数</text>
<rect x="545" y="90" width="185" height="90" rx="13" fill="#fff1e7" stroke="#d9a17a" stroke-width="2"/>
<text x="637" y="126" text-anchor="middle" fill="#75472f" font-size="21" font-weight="700">Policy Gate</text><text x="637" y="154" text-anchor="middle" fill="#805d49" font-size="15">校验 / 审批 / 限权</text>
<rect x="790" y="90" width="185" height="90" rx="13" fill="#e9f3fa" stroke="#91b4ce" stroke-width="2"/>
<text x="882" y="126" text-anchor="middle" fill="#2d5975" font-size="21" font-weight="700">MCP Client</text><text x="882" y="154" text-anchor="middle" fill="#55758b" font-size="15">tools/call</text>
<rect x="1035" y="90" width="125" height="90" rx="13" fill="#e9f4ef" stroke="#8db9a7" stroke-width="2"/>
<text x="1097" y="126" text-anchor="middle" fill="#2d685e" font-size="20" font-weight="700">Server</text><text x="1097" y="154" text-anchor="middle" fill="#557b73" font-size="14">执行</text>
<path d="M240 135 H300 M485 135 H545 M730 135 H790 M975 135 H1035" stroke="#3d7772" stroke-width="3" fill="none" marker-end="url(#flow-arrow)"/>
<text x="392" y="66" text-anchor="middle" fill="#557b73" font-size="14">工具定义已进入模型可见上下文</text>
<path d="M1097 180 V265 H882 V180" stroke="#a46c43" stroke-width="3" fill="none" marker-end="url(#flow-arrow)"/>
<text x="986" y="250" text-anchor="middle" fill="#855d3c" font-size="15">JSON-RPC 响应</text>
<path d="M882 180 V330 H392 V180" stroke="#3d7772" stroke-width="3" fill="none" marker-end="url(#flow-arrow)"/>
<text x="640" y="317" text-anchor="middle" fill="#557b73" font-size="15">Host 将工具结果作为 observation / tool output 返回模型</text>
<rect x="300" y="365" width="185" height="54" rx="10" fill="#ffffff" stroke="#cbdcd4"/>
<text x="392" y="398" text-anchor="middle" fill="#244b50" font-size="16">模型整合结果</text>
<path d="M392 330 V365" stroke="#3d7772" stroke-width="3" fill="none" marker-end="url(#flow-arrow)"/>
<text x="600" y="433" text-anchor="middle" fill="#617a76" font-size="14">协议负责互操作；任务规划、上下文选择与最终回答仍由 Host / Model 负责</text>
</g>
</svg>