<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="growth-title growth-desc">
<title id="growth-title">点对点定制集成与统一协议的结构对比</title><desc id="growth-desc">左侧三个 Host 与四个服务之间形成大量定制连接；右侧每个 Host 实现一次共同协议客户端，每个服务实现一次共同协议服务器。</desc>
