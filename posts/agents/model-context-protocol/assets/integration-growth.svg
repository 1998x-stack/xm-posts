<g stroke="#c1845c" stroke-width="2" opacity=".7" fill="none"><path d="M185 139 L415 126 M185 139 L415 198 M185 139 L415 270 M185 139 L415 342"/><path d="M185 234 L415 126 M185 234 L415 198 M185 234 L415 270 M185 234 L415 342"/><path d="M185 329 L415 126 M185 329 L415 198 M185 329 L415 270 M185 329 L415 342"/></g>
