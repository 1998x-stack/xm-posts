<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="prim-title prim-desc">
<title id="prim-title">MCP 三种 Server Primitives</title>
<desc id="prim-desc">Tools 是模型可选择执行的动作；Resources 是应用可读取并放入上下文的数据；Prompts 是用户可显式选择的可复用交互模板。</desc>
<rect x="18" y="18" width="1164" height="394" rx="22" fill="#f7faf7" stroke="#d4e1dc" stroke-width="2"/>
<g font-family="system-ui, sans-serif">
<rect x="48" y="62" width="336" height="280" rx="16" fill="#fff1e7" stroke="#d9a17a" stroke-width="2"/>
<circle cx="216" cy="119" r="33" fill="#b96d43"/><path d="M199 119 L211 131 L235 103" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216" y="185" text-anchor="middle" fill="#75472f" font-size="27" font-weight="700">Tools</text>
<text x="216" y="221" text-anchor="middle" fill="#805d49" font-size="18">可执行动作</text>
<text x="216" y="258" text-anchor="middle" fill="#805d49" font-size="16">tools/list · tools/call</text>
<text x="216" y="293" text-anchor="middle" fill="#805d49" font-size="15">搜索、创建工单、更新记录</text>
<rect x="432" y="62" width="336" height="280" rx="16" fill="#e9f3fa" stroke="#91b4ce" stroke-width="2"/>
<circle cx="600" cy="119" r="33" fill="#4c83a7"/><path d="M585 106 H615 V132 H585 Z M590 99 H620 V125" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round"/>
<text x="600" y="185" text-anchor="middle" fill="#2d5975" font-size="27" font-weight="700">Resources</text>
<text x="600" y="221" text-anchor="middle" fill="#55758b" font-size="18">可读取数据</text>
<text x="600" y="258" text-anchor="middle" fill="#55758b" font-size="16">resources/list · resources/read</text>
<text x="600" y="293" text-anchor="middle" fill="#55758b" font-size="15">文档、数据库 Schema、状态</text>
<rect x="816" y="62" width="336" height="280" rx="16" fill="#e9f4ef" stroke="#8db9a7" stroke-width="2"/>
<circle cx="984" cy="119" r="33" fill="#388879"/><path d="M969 104 H999 V134 H969 Z M976 114 H992 M976 123 H992" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="984" y="185" text-anchor="middle" fill="#2d685e" font-size="27" font-weight="700">Prompts</text>
<text x="984" y="221" text-anchor="middle" fill="#557b73" font-size="18">可复用模板</text>
<text x="984" y="258" text-anchor="middle" fill="#557b73" font-size="16">prompts/list · prompts/get</text>
<text x="984" y="293" text-anchor="middle" fill="#557b73" font-size="15">代码审查、报告生成、工作流模板</text>
<text x="600" y="384" text-anchor="middle" fill="#5e7772" font-size="17">核心区别：谁决定何时使用？动作 / 数据 / 用户选择的模板</text>
</g>
</svg>