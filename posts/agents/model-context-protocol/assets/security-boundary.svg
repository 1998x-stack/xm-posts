<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="sec-title sec-desc">
<title id="sec-title">MCP 安全边界与纵深防御</title><desc id="sec-desc">用户与 Host 之间有确认和权限策略；Host 与 MCP Server 之间有身份认证、最小权限和工具白名单；Server 与外部 API 之间有令牌受众校验、输入验证和审计。工具输出与资源内容始终视为不可信数据。</desc>
<defs><marker id="sec-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#3d7772" stroke-width="1.5"/></marker></defs>
<rect x="18" y="18" width="1164" height="464" rx="22" fill="#f7faf7" stroke="#d4e1dc" stroke-width="2"/>
<g font-family="system-ui, sans-serif">
<rect x="55" y="90" width="205" height="112" rx="13" fill="#e8f3ee" stroke="#8db8aa" stroke-width="2"/><text x="157" y="132" text-anchor="middle" fill="#244b50" font-size="22" font-weight="700">User / Host</text><text x="157" y="164" text-anchor="middle" fill="#56736f" font-size="15">用户意图 · 审批</text>
<rect x="345" y="90" width="205" height="112" rx="13" fill="#e9f3fa" stroke="#91b4ce" stroke-width="2"/><text x="447" y="132" text-anchor="middle" fill="#2d5975" font-size="22" font-weight="700">MCP Client</text><text x="447" y="164" text-anchor="middle" fill="#55758b" font-size="15">工具白名单 · 参数校验</text>
<rect x="635" y="90" width="205" height="112" rx="13" fill="#fff1e7" stroke="#d9a17a" stroke-width="2"/><text x="737" y="132" text-anchor="middle" fill="#75472f" font-size="22" font-weight="700">MCP Server</text><text x="737" y="164" text-anchor="middle" fill="#805d49" font-size="15">认证 · 授权 · 沙箱</text>
<rect x="925" y="90" width="205" height="112" rx="13" fill="#e9f4ef" stroke="#8db9a7" stroke-width="2"/><text x="1027" y="132" text-anchor="middle" fill="#2d685e" font-size="22" font-weight="700">External API</text><text x="1027" y="164" text-anchor="middle" fill="#557b73" font-size="15">真实数据 / 副作用</text>
<path d="M260 146 H345 M550 146 H635 M840 146 H925" stroke="#3d7772" stroke-width="3" fill="none" marker-end="url(#sec-arrow)"/>
<rect x="55" y="254" width="1075" height="85" rx="12" fill="#fff4ec" stroke="#d9a17a" stroke-width="2"/><text x="592" y="287" text-anchor="middle" fill="#855d3c" font-size="20" font-weight="700">不可信输入 / 输出区</text><text x="592" y="316" text-anchor="middle" fill="#805d49" font-size="16">Prompt Injection · Tool Poisoning · 恶意资源内容 · 伪造或过时的工具结果</text>
<path d="M737 202 V254" stroke="#b96d43" stroke-width="3" stroke-dasharray="7 6"/><text x="760" y="234" fill="#855d3c" font-size="14">数据边界</text>
<rect x="55" y="374" width="250" height="68" rx="10" fill="#ffffff" stroke="#cbdcd4"/><text x="180" y="402" text-anchor="middle" fill="#244b50" font-size="16" font-weight="700">Least Privilege</text><text x="180" y="425" text-anchor="middle" fill="#56736f" font-size="14">最小权限 / 短期凭证</text>
<rect x="340" y="374" width="250" height="68" rx="10" fill="#ffffff" stroke="#cbdcd4"/><text x="465" y="402" text-anchor="middle" fill="#244b50" font-size="16" font-weight="700">Audience Binding</text><text x="465" y="425" text-anchor="middle" fill="#56736f" font-size="14">令牌受众校验 / 禁止透传</text>
<rect x="625" y="374" width="250" height="68" rx="10" fill="#ffffff" stroke="#cbdcd4"/><text x="750" y="402" text-anchor="middle" fill="#244b50" font-size="16" font-weight="700">Human Approval</text><text x="750" y="425" text-anchor="middle" fill="#56736f" font-size="14">敏感操作逐次确认</text>
<rect x="910" y="374" width="220" height="68" rx="10" fill="#ffffff" stroke="#cbdcd4"/><text x="1020" y="402" text-anchor="middle" fill="#244b50" font-size="16" font-weight="700">Audit &amp; Validate</text><text x="1020" y="425" text-anchor="middle" fill="#56736f" font-size="14">结果校验 / 审计日志</text>
</g></svg>