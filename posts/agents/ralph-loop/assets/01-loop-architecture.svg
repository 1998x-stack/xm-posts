<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="ralph-loop-title ralph-loop-desc">
<title id="ralph-loop-title">Ralph Loop 的外层执行循环</title><desc id="ralph-loop-desc">规格和任务清单被读取，Agent 执行一个小任务，验证器检查结果，通过后持久化状态并选择下一项；满足完成条件或达到预算时停止。</desc>
<defs><marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#397f75"/></marker></defs><rect width="1120" height="520" rx="22" fill="#f8fbf8"/>
<text x="560" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#234b4d">One task · One verification · One checkpoint</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle">
<rect x="60" y="108" width="230" height="100" rx="16" fill="#e8f3ed" stroke="#85b8a9" stroke-width="2"/><text x="175" y="147" font-size="22" font-weight="700" fill="#226c62">1 · SPEC</text><text x="175" y="178" font-size="16" fill="#416c68">规格 / 任务清单</text>
<rect x="445" y="108" width="230" height="100" rx="16" fill="#e8f1f8" stroke="#8eb5ca" stroke-width="2"/><text x="560" y="147" font-size="22" font-weight="700" fill="#3f7795">2 · AGENT</text><text x="560" y="178" font-size="16" fill="#456b7d">一个工作单元</text>
<rect x="830" y="108" width="230" height="100" rx="16" fill="#fff0e5" stroke="#d7a17b" stroke-width="2"/><text x="945" y="147" font-size="22" font-weight="700" fill="#a56640">3 · PATCH</text><text x="945" y="178" font-size="16" fill="#765b49">代码 / 测试变更</text>
<rect x="830" y="318" width="230" height="100" rx="16" fill="#f1eef9" stroke="#a99bc9" stroke-width="2"/><text x="945" y="357" font-size="22" font-weight="700" fill="#6e5f9d">4 · VERIFY</text><text x="945" y="388" font-size="16" fill="#655c7e">测试 / 类型 / Lint</text>
<rect x="445" y="318" width="230" height="100" rx="16" fill="#e8f3ed" stroke="#85b8a9" stroke-width="2"/><text x="560" y="357" font-size="22" font-weight="700" fill="#226c62">5 · PERSIST</text><text x="560" y="388" font-size="16" fill="#416c68">计划 / Git / 日志</text>
<rect x="60" y="318" width="230" height="100" rx="16" fill="#f8f1e8" stroke="#d6b58a" stroke-width="2"/><text x="175" y="357" font-size="22" font-weight="700" fill="#946c42">6 · DECIDE</text><text x="175" y="388" font-size="16" fill="#78654e">继续 / 完成 / 停止</text></g>
<g fill="none" stroke="#397f75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-arrow)"><path d="M290 158 H432"/><path d="M675 158 H817"/><path d="M945 208 V305"/><path d="M830 368 H688"/><path d="M445 368 H303"/><path d="M175 318 V265 H34 V158 H48" stroke-dasharray="8 7"/></g>
<g font-family="system-ui,sans-serif" font-size="14" fill="#55736f"><text x="360" y="143" text-anchor="middle">选取最高优先级</text><text x="750" y="143" text-anchor="middle">生成增量</text><text x="1000" y="265" text-anchor="middle">运行外部检查</text><text x="755" y="350" text-anchor="middle">仅保存可审查状态</text><text x="365" y="350" text-anchor="middle">更新剩余任务</text></g>
<rect x="350" y="452" width="420" height="40" rx="20" fill="#234b4d"/><text x="560" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">STOP = verified complete OR budget exhausted</text></svg>