<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="state-title state-desc">
<title id="state-title">上下文与持久状态的双层结构</title><desc id="state-desc">上层是当前 Agent 的短暂上下文，下层是跨轮次保存的规格、计划、代码、测试和 Git 历史。</desc><rect width="1040" height="480" rx="22" fill="#f8fbf8"/>
<text x="520" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#234b4d">Two different memory layers</text>
<rect x="54" y="80" width="932" height="140" rx="16" fill="#eaf2f8" stroke="#8eb4c8" stroke-width="2"/><text x="82" y="115" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#3e7591">EPHEMERAL · CURRENT CONTEXT</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="88" y="137" width="185" height="58" rx="10" fill="#fff" stroke="#b6cad8"/><text x="180" y="173" font-size="16" fill="#385e72">Prompt / Rules</text><rect x="300" y="137" width="185" height="58" rx="10" fill="#fff" stroke="#b6cad8"/><text x="392" y="173" font-size="16" fill="#385e72">Current Task</text><rect x="512" y="137" width="185" height="58" rx="10" fill="#fff" stroke="#b6cad8"/><text x="604" y="173" font-size="16" fill="#385e72">Tool Observations</text><rect x="724" y="137" width="224" height="58" rx="10" fill="#fff" stroke="#b6cad8"/><text x="836" y="173" font-size="16" fill="#385e72">Reasoning / Scratchpad</text></g>
<path d="M520 222 V274" stroke="#397f75" stroke-width="3" stroke-dasharray="7 7"/><path d="M508 262 L520 276 L532 262" fill="none" stroke="#397f75" stroke-width="3"/><text x="550" y="253" font-family="system-ui,sans-serif" font-size="14" fill="#52736f">read / write / reassemble</text>
<rect x="54" y="286" width="932" height="146" rx="16" fill="#e9f3ec" stroke="#8bb9a7" stroke-width="2"/><text x="82" y="322" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#287267">DURABLE · PROJECT STATE</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="88" y="345" width="160" height="64" rx="10" fill="#fff" stroke="#a8c8b9"/><text x="168" y="372" font-size="16" font-weight="700" fill="#356c62">Specs</text><text x="168" y="393" font-size="13" fill="#5a7d73">目标 / 验收</text><rect x="270" y="345" width="160" height="64" rx="10" fill="#fff" stroke="#a8c8b9"/><text x="350" y="372" font-size="16" font-weight="700" fill="#356c62">Plan</text><text x="350" y="393" font-size="13" fill="#5a7d73">优先级 / 进度</text><rect x="452" y="345" width="160" height="64" rx="10" fill="#fff" stroke="#a8c8b9"/><text x="532" y="372" font-size="16" font-weight="700" fill="#356c62">Code</text><text x="532" y="393" font-size="13" fill="#5a7d73">实际工作区</text><rect x="634" y="345" width="160" height="64" rx="10" fill="#fff" stroke="#a8c8b9"/><text x="714" y="372" font-size="16" font-weight="700" fill="#356c62">Tests</text><text x="714" y="393" font-size="13" fill="#5a7d73">行为证据</text><rect x="816" y="345" width="132" height="64" rx="10" fill="#fff" stroke="#a8c8b9"/><text x="882" y="372" font-size="16" font-weight="700" fill="#356c62">Git</text><text x="882" y="393" font-size="13" fill="#5a7d73">检查点</text></g>
<text x="520" y="463" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#65817b">A fresh process can rebuild context only if useful state has been persisted outside it.</text></svg>