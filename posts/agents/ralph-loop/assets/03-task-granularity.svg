<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="task-title task-desc">
<title id="task-title">把大型任务拆成可验证的工作单元</title><desc id="task-desc">一个过大的编译器项目被拆成 Lexer、Parser、类型检查、IR lowering 和测试任务，形成可排序的依赖图。</desc><defs><marker id="task-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53877c"/></marker></defs>
<rect width="1040" height="500" rx="22" fill="#f8fbf8"/><text x="520" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#234b4d">Decompose before you loop</text>
<rect x="335" y="76" width="370" height="72" rx="14" fill="#fff0e5" stroke="#d8a17a" stroke-width="2"/><text x="520" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#9c633f">Too large for one iteration</text><text x="520" y="129" text-anchor="middle" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="16" fill="#795d4c">“Build a complete compiler”</text>
<path d="M520 148 V192 M520 192 H160 V225 M520 192 V225 M520 192 H880 V225" fill="none" stroke="#53877c" stroke-width="2.5"/>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="70" y="225" width="180" height="78" rx="12" fill="#e8f2f8" stroke="#8fb6cb" stroke-width="2"/><text x="160" y="257" font-size="19" font-weight="700" fill="#3f7592">Lexer</text><text x="160" y="281" font-size="14" fill="#527181">Token tests</text><rect x="430" y="225" width="180" height="78" rx="12" fill="#e9f3ec" stroke="#8bb9a7" stroke-width="2"/><text x="520" y="257" font-size="19" font-weight="700" fill="#287267">Parser</text><text x="520" y="281" font-size="14" fill="#52766d">Grammar tests</text><rect x="790" y="225" width="180" height="78" rx="12" fill="#f0edfa" stroke="#a99bc9" stroke-width="2"/><text x="880" y="257" font-size="19" font-weight="700" fill="#6e5f9d">Type Check</text><text x="880" y="281" font-size="14" fill="#6a6280">Type tests</text><rect x="250" y="360" width="210" height="78" rx="12" fill="#f8f1e8" stroke="#d6b58a" stroke-width="2"/><text x="355" y="392" font-size="18" font-weight="700" fill="#946c42">IR Lowering</text><text x="355" y="416" font-size="14" fill="#78654e">IR shape tests</text><rect x="580" y="360" width="210" height="78" rx="12" fill="#e9f3ec" stroke="#8bb9a7" stroke-width="2"/><text x="685" y="392" font-size="18" font-weight="700" fill="#287267">Integration</text><text x="685" y="416" font-size="14" fill="#52766d">End-to-end tests</text></g>
<g fill="none" stroke="#53877c" stroke-width="2.5" marker-end="url(#task-arrow)"><path d="M160 303 V330 H355 V350"/><path d="M520 303 V337 H355 V350"/><path d="M520 303 V330 H685 V350"/><path d="M880 303 V330 H685 V350"/></g>
<text x="520" y="474" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#65817b">Each node needs a bounded change, a verifier and a clear done condition.</text></svg>