<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 460" role="img" aria-labelledby="verify-title verify-desc">
<title id="verify-title">验证器为 Agent 提供 Backpressure</title><desc id="verify-desc">代码补丁依次经过单元测试、类型检查、集成测试和安全审查，失败时把诊断反馈给 Agent，通过后才能形成检查点。</desc><defs><marker id="verify-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#4b8278"/></marker></defs>
<rect width="1060" height="460" rx="22" fill="#f8fbf8"/><text x="530" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#234b4d">Verification is the feedback channel</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="38" y="140" width="170" height="90" rx="13" fill="#e8f1f8" stroke="#8eb4c8" stroke-width="2"/><text x="123" y="177" font-size="19" font-weight="700" fill="#3e7591">Patch</text><text x="123" y="203" font-size="14" fill="#567687">代码增量</text><rect x="260" y="140" width="170" height="90" rx="13" fill="#e9f3ec" stroke="#8bb9a7" stroke-width="2"/><text x="345" y="177" font-size="18" font-weight="700" fill="#287267">Unit Tests</text><text x="345" y="203" font-size="14" fill="#56766d">局部行为</text><rect x="482" y="140" width="170" height="90" rx="13" fill="#f1eef9" stroke="#a99bc9" stroke-width="2"/><text x="567" y="177" font-size="18" font-weight="700" fill="#6e5f9d">Type / Lint</text><text x="567" y="203" font-size="14" fill="#6a6280">静态约束</text><rect x="704" y="140" width="150" height="90" rx="13" fill="#fff0e5" stroke="#d8a17a" stroke-width="2"/><text x="779" y="177" font-size="18" font-weight="700" fill="#9c633f">Integration</text><text x="779" y="203" font-size="14" fill="#795d4c">系统行为</text><rect x="900" y="140" width="130" height="90" rx="13" fill="#e9f3ec" stroke="#8bb9a7" stroke-width="2"/><text x="965" y="177" font-size="18" font-weight="700" fill="#287267">Commit</text><text x="965" y="203" font-size="14" fill="#56766d">检查点</text></g>
<g fill="none" stroke="#4b8278" stroke-width="2.5" marker-end="url(#verify-arrow)"><path d="M208 185 H248"/><path d="M430 185 H470"/><path d="M652 185 H692"/><path d="M854 185 H888"/></g>
<path d="M779 231 V306 H345 V242" fill="none" stroke="#b16e4c" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#verify-arrow)"/>
<rect x="430" y="292" width="300" height="70" rx="12" fill="#fff1e7" stroke="#d7a17b" stroke-width="2"/><text x="580" y="321" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#a36340">FAIL → diagnostic feedback</text><text x="580" y="345" text-anchor="middle" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="14" fill="#795d4c">修复、缩小范围或停止请求人工判断</text>
<text x="530" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#65817b">A green test signal is evidence about tested behavior—not proof of all correctness.</text></svg>