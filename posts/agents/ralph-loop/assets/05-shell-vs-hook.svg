<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" role="img" aria-labelledby="variant-title variant-desc">
<title id="variant-title">Shell Ralph 与 Stop Hook Ralph 的差异</title><desc id="variant-desc">左侧是 Shell 每轮启动新的 CLI 进程，右侧是 Stop Hook 在同一会话内拦截退出并重新注入 Prompt。</desc><rect width="1080" height="480" rx="22" fill="#f8fbf8"/><text x="540" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#234b4d">Same idea, different context lifecycle</text>
<rect x="42" y="80" width="482" height="340" rx="17" fill="#edf4f8" stroke="#8eb4c8" stroke-width="2"/><rect x="556" y="80" width="482" height="340" rx="17" fill="#eef5ef" stroke="#8bb9a7" stroke-width="2"/>
<text x="283" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#3e7591">A · Shell process loop</text><text x="797" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#287267">B · Stop Hook loop</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="88" y="150" width="390" height="54" rx="10" fill="#fff" stroke="#b6cad8"/><text x="283" y="183" font-size="17" fill="#385e72">Shell invokes CLI process</text><rect x="88" y="230" width="390" height="54" rx="10" fill="#fff" stroke="#b6cad8"/><text x="283" y="263" font-size="17" fill="#385e72">Agent reads prompt + repo state</text><rect x="88" y="310" width="390" height="54" rx="10" fill="#fff" stroke="#b6cad8"/><text x="283" y="343" font-size="17" fill="#385e72">Process exits → next process starts</text><rect x="602" y="150" width="390" height="54" rx="10" fill="#fff" stroke="#a8c8b9"/><text x="797" y="183" font-size="17" fill="#356c62">Agent reaches Stop event</text><rect x="602" y="230" width="390" height="54" rx="10" fill="#fff" stroke="#a8c8b9"/><text x="797" y="263" font-size="17" fill="#356c62">Hook reads session state / transcript</text><rect x="602" y="310" width="390" height="54" rx="10" fill="#fff" stroke="#a8c8b9"/><text x="797" y="343" font-size="17" fill="#356c62">Block exit → re-inject same prompt</text></g>
<g stroke-width="2.5" fill="none"><path d="M283 204 V221 M275 213 L283 222 L291 213" stroke="#4b8298"/><path d="M283 284 V301 M275 293 L283 302 L291 293" stroke="#4b8298"/><path d="M797 204 V221 M789 213 L797 222 L805 213" stroke="#4b8278"/><path d="M797 284 V301 M789 293 L797 302 L805 293" stroke="#4b8278"/><path d="M88 338 H66 V177 H80" stroke="#4b8298" stroke-dasharray="7 6"/><path d="M602 338 H580 V177 H594" stroke="#4b8278" stroke-dasharray="7 6"/></g>
<text x="283" y="395" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#587787">New process / usually new context</text><text x="797" y="395" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#5e7d70">Same session / context continues</text>
<text x="540" y="455" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#65817b">Do not infer context reset from the name “Ralph Loop”; inspect the executor.</text></svg>