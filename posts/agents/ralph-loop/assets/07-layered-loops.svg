<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="nested-title nested-desc">
<title id="nested-title">Ralph 外层循环与 ReAct 内层循环</title><desc id="nested-desc">Ralph 在外层选择任务、验证和持久化；单次 Agent 运行内部可通过 ReAct 思考、行动和观察。</desc><rect width="1040" height="470" rx="22" fill="#f8fbf8"/><text x="520" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#234b4d">Nested control loops</text>
<rect x="52" y="84" width="936" height="324" rx="22" fill="#eaf3ed" stroke="#83b6a5" stroke-width="3"/><text x="85" y="119" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#287267">OUTER LOOP · RALPH</text><text x="85" y="146" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="14" fill="#56786f">任务选择 → 启动一轮 → 验证 → 持久化 → 下一项</text>
<rect x="165" y="180" width="710" height="176" rx="18" fill="#edf3f8" stroke="#8eb4c8" stroke-width="2.5"/><text x="520" y="213" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#3e7591">INNER LOOP · REACT (one agent run)</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle"><rect x="220" y="247" width="170" height="72" rx="12" fill="#fff" stroke="#b6cad8"/><text x="305" y="276" font-size="18" font-weight="700" fill="#3e7591">Thought</text><text x="305" y="300" font-size="13" fill="#567687">推理 / 计划</text><rect x="435" y="247" width="170" height="72" rx="12" fill="#fff" stroke="#b6cad8"/><text x="520" y="276" font-size="18" font-weight="700" fill="#3e7591">Action</text><text x="520" y="300" font-size="13" fill="#567687">工具 / 文件操作</text><rect x="650" y="247" width="170" height="72" rx="12" fill="#fff" stroke="#b6cad8"/><text x="735" y="276" font-size="18" font-weight="700" fill="#3e7591">Observation</text><text x="735" y="300" font-size="13" fill="#567687">外部反馈</text></g>
<g stroke="#4b8298" stroke-width="2.5" fill="none"><path d="M390 283 H424"/><path d="M415 275 L425 283 L415 291"/><path d="M605 283 H639"/><path d="M630 275 L640 283 L630 291"/><path d="M735 320 V337 H305 V320" stroke-dasharray="6 5"/></g><path d="M520 356 V388" stroke="#397f75" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="540" y="435" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#65817b">When the inner run ends, the outer controller verifies and persists the result.</text></svg>