<rect x="416" y="229" width="215" height="83" rx="13" fill="#fdf1e7" stroke="#d8a879" stroke-width="2"/><text x="523" y="265" text-anchor="middle" fill="#a35e40" font-size="23" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">Action</text><text x="523" y="292" text-anchor="middle" fill="#234650" font-size="16" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">工具动作集 A</text>
<path d="M631 80 L704 80" fill="none" stroke="#649a92" stroke-width="3" stroke-linecap="round"/><circle cx="704" cy="80" r="4" fill="#649a92"/><rect x="704" y="40" width="268" height="82" rx="13" fill="#e8f4ef" stroke="#89b9b2" stroke-width="2"/><text x="838" y="76" text-anchor="middle" fill="#234650" font-size="20" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">上下文追加 Thought</text><text x="838" y="102" text-anchor="middle" fill="#647b7a" font-size="16" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">环境保持不变</text>
<path d="M631 271 L696 271" fill="none" stroke="#649a92" stroke-width="3" stroke-linecap="round"/><circle cx="696" cy="271" r="4" fill="#649a92"/><rect x="696" y="226" width="275" height="91" rx="13" fill="#e3eff8" stroke="#91b6d1" stroke-width="2"/><text x="834" y="261" text-anchor="middle" fill="#234650" font-size="22" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">Observation</text><text x="834" y="290" text-anchor="middle" fill="#234650" font-size="16" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">结果进入上下文</text>
<text x="523" y="187" text-anchor="middle" fill="#476a70" font-size="20" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">思考 ≠ 外部事实；动作 ≠ 已经成功</text>
<text x="520" y="353" text-anchor="middle" fill="#647e81" font-size="16" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">两个分支共享历史，但只有下方分支访问环境</text>
