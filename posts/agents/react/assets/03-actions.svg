<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-label="语言思考和环境动作的差别"><title>语言思考和环境动作的差别</title><desc>Thought 不向外部环境发请求；Action 触发工具并且可能返回新观察。</desc><rect width="1040" height="390" rx="18" fill="#f8fbf9"/>
