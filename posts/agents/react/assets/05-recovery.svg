<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-label="空结果下的回退与终止"><title>空结果下的回退与终止</title><desc>从空检索出发，可以改写查询、重试预算受控；无法确认时应退出而不是假装成功。</desc><rect width="1040" height="390" rx="18" fill="#f8fbf9"/>
<rect x="35" y="120" width="185" height="101" rx="13" fill="#e3eff8" stroke="#91b6d1" stroke-width="2"/><text x="127" y="158" text-anchor="middle" fill="#234650" font-size="20" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">检索结果为空</text><text x="127" y="189" text-anchor="middle" fill="#647e81" font-size="16" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">Observation</text>
<path d="M220 169 L276 169" fill="none" stroke="#649a92" stroke-width="3" stroke-linecap="round"/><circle cx="276" cy="169" r="4" fill="#649a92"/><rect x="276" y="120" width="197" height="101" rx="13" fill="#fff2e8" stroke="#d9a578" stroke-width="2"/><text x="375" y="157" text-anchor="middle" fill="#234650" font-size="21" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">判断原因</text><text x="375" y="187" text-anchor="middle" fill="#8b6553" font-size="15" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">目标 / 查询 / 来源</text>
<path d="M473 169 L533 169" fill="none" stroke="#649a92" stroke-width="3" stroke-linecap="round"/><circle cx="533" cy="169" r="4" fill="#649a92"/><rect x="533" y="51" width="215" height="88" rx="13" fill="#e8f4ef" stroke="#89b9b2" stroke-width="2"/><text x="640" y="86" text-anchor="middle" fill="#234650" font-size="21" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">重写查询</text><text x="640" y="113" text-anchor="middle" fill="#587674" font-size="15" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">可安全重试</text>
<rect x="533" y="220" width="215" height="88" rx="13" fill="#f9ebe8" stroke="#d9aca6" stroke-width="2"/><text x="640" y="254" text-anchor="middle" fill="#234650" font-size="21" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">停止 / 回退</text><text x="640" y="282" text-anchor="middle" fill="#8f6762" font-size="15" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">预算耗尽 / 无证据</text>
<path d="M503 169 V95 H533 M503 169 V264 H533" fill="none" stroke="#649a92" stroke-width="3"/>
<path d="M748 95 L807 95" fill="none" stroke="#649a92" stroke-width="3" stroke-linecap="round"/><circle cx="807" cy="95" r="4" fill="#649a92"/><rect x="807" y="51" width="190" height="88" rx="13" fill="#e9f6ef" stroke="#89b9b2" stroke-width="2"/><text x="902" y="85" text-anchor="middle" fill="#234650" font-size="18" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">新 Observation</text><text x="902" y="114" text-anchor="middle" fill="#54746e" font-size="16" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">再评估</text>
<path d="M748 264 L807 264" fill="none" stroke="#649a92" stroke-width="3" stroke-linecap="round"/><circle cx="807" cy="264" r="4" fill="#649a92"/><rect x="807" y="220" width="190" height="88" rx="13" fill="#e3eff8" stroke="#91b6d1" stroke-width="2"/><text x="902" y="254" text-anchor="middle" fill="#234650" font-size="18" font-weight="600" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">明确不确定</text><text x="902" y="283" text-anchor="middle" fill="#54746e" font-size="16" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">或请求人工</text>
<text x="521" y="365" text-anchor="middle" fill="#647e81" font-size="15" font-weight="500" font-family="system-ui,Segoe UI,PingFang SC,sans-serif">回退、停止与权限策略均需产品明确实现；不能假定 ReAct 自动具备</text>
</svg>