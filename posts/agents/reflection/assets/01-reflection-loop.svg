<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="fig1-title fig1-desc">
<title id="fig1-title">Reflection 的反馈闭环</title><desc id="fig1-desc">任务进入 Actor，Actor 产生轨迹；Evaluator 根据环境或工具结果评价，Reflector 生成可操作经验，Memory 保存经验并影响下一轮 Actor。</desc>
<rect width="1080" height="430" rx="22" fill="#f7faf7"/><text x="540" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#23474a">From one attempt to a better next attempt</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" text-anchor="middle">
<rect x="35" y="143" width="135" height="86" rx="13" fill="#eaf1f7" stroke="#9ab7cb" stroke-width="2"/><text x="102" y="178" font-size="20" font-weight="750" fill="#3d6c8b">Task</text><text x="102" y="204" font-size="14" fill="#526d78">目标与约束</text>
<rect x="207" y="143" width="145" height="86" rx="13" fill="#e6f3ed" stroke="#88b7a7" stroke-width="2"/><text x="279" y="178" font-size="20" font-weight="750" fill="#207566">Actor</text><text x="279" y="204" font-size="14" fill="#526d78">生成 / 行动</text>
<rect x="389" y="143" width="150" height="86" rx="13" fill="#fff0e6" stroke="#d7a17b" stroke-width="2"/><text x="464" y="178" font-size="20" font-weight="750" fill="#a55f3b">Trajectory</text><text x="464" y="204" font-size="14" fill="#775b49">动作与观察</text>
<rect x="578" y="143" width="145" height="86" rx="13" fill="#eaf1f7" stroke="#9ab7cb" stroke-width="2"/><text x="650" y="178" font-size="20" font-weight="750" fill="#3d6c8b">Evaluator</text><text x="650" y="204" font-size="14" fill="#526d78">通过 / 失败 / 证据</text>
<rect x="761" y="143" width="145" height="86" rx="13" fill="#f1edfa" stroke="#ada0d1" stroke-width="2"/><text x="833" y="178" font-size="20" font-weight="750" fill="#6f60a1">Reflector</text><text x="833" y="204" font-size="14" fill="#625b7d">定位与修正</text>
<rect x="943" y="143" width="112" height="86" rx="13" fill="#e9f2ee" stroke="#8db5a6" stroke-width="2"/><text x="999" y="178" font-size="19" font-weight="750" fill="#207566">Memory</text><text x="999" y="204" font-size="13" fill="#526d78">经验</text></g>
