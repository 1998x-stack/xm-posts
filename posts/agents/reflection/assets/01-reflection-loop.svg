<rect x="386" y="281" width="305" height="48" rx="10" fill="#fffefa" stroke="#d8e4dd"/><text x="538" y="311" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#426660">下一轮：把经验作为条件，而非参数更新</text><text x="540" y="382" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#708782">Evaluator 的证据来源可以是规则、测试、环境、工具、独立模型或人工审查</text></svg>