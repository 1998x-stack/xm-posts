<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-labelledby="fig2-title fig2-desc">
<title id="fig2-title">Self-Refine、CRITIC 与 Reflexion 的反馈路线</title><desc id="fig2-desc">三列对比内部反馈修订、外部工具验证修订和跨轮次经验记忆。</desc>
<rect width="1080" height="470" rx="22" fill="#f7faf7"/><text x="540" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#23474a">Three feedback routes, three different system boundaries</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif">
<rect x="32" y="78" width="320" height="335" rx="16" fill="#f1f6f2" stroke="#b8d0c3" stroke-width="2"/><text x="192" y="116" text-anchor="middle" font-size="21" font-weight="750" fill="#207566">SELF-REFINE</text><text x="192" y="140" text-anchor="middle" font-size="13" fill="#607b73">内部自评与修订</text>
<rect x="92" y="168" width="200" height="48" rx="9" fill="#e2f0e8" stroke="#90b9a5"/><text x="192" y="198" text-anchor="middle" font-size="16" fill="#315f52">Generate y₀</text><path d="M192 216V239 M185 231L192 239L199 231" stroke="#4d8c78" stroke-width="2.5" fill="none"/><rect x="92" y="241" width="200" height="48" rx="9" fill="#fff0e6" stroke="#d8a27d"/><text x="192" y="271" text-anchor="middle" font-size="16" fill="#985c3d">Feedback</text><path d="M192 289V312 M185 304L192 312L199 304" stroke="#4d8c78" stroke-width="2.5" fill="none"/><rect x="92" y="314" width="200" height="48" rx="9" fill="#e9f0f8" stroke="#a2bad0"/><text x="192" y="344" text-anchor="middle" font-size="16" fill="#3c6c89">Refine y₁</text><text x="192" y="390" text-anchor="middle" font-size="12" fill="#657d76">同一模型可兼任三个角色</text>
<rect x="380" y="78" width="320" height="335" rx="16" fill="#f2f6f9" stroke="#b9cedc" stroke-width="2"/><text x="540" y="116" text-anchor="middle" font-size="21" font-weight="750" fill="#3d7193">CRITIC</text><text x="540" y="140" text-anchor="middle" font-size="13" fill="#607b87">工具辅助验证</text>
<rect x="440" y="168" width="200" height="48" rx="9" fill="#e9f0f8" stroke="#a2bad0"/><text x="540" y="198" text-anchor="middle" font-size="16" fill="#3c6c89">Initial output</text><path d="M540 216V239 M533 231L540 239L547 231" stroke="#4d7f9b" stroke-width="2.5" fill="none"/><rect x="440" y="241" width="200" height="48" rx="9" fill="#fff0e6" stroke="#d8a27d"/><text x="540" y="271" text-anchor="middle" font-size="16" fill="#985c3d">Tool / Verifier</text><path d="M540 289V312 M533 304L540 312L547 304" stroke="#4d7f9b" stroke-width="2.5" fill="none"/><rect x="440" y="314" width="200" height="48" rx="9" fill="#e2f0e8" stroke="#90b9a5"/><text x="540" y="344" text-anchor="middle" font-size="16" fill="#315f52">Evidence-based edit</text><text x="540" y="390" text-anchor="middle" font-size="12" fill="#657d76">外部证据仍需要正确解释</text>
<rect x="728" y="78" width="320" height="335" rx="16" fill="#f5f2fa" stroke="#c7bde0" stroke-width="2"/><text x="888" y="116" text-anchor="middle" font-size="21" font-weight="750" fill="#6d5c9e">REFLEXION</text><text x="888" y="140" text-anchor="middle" font-size="13" fill="#716887">跨轮次经验记忆</text>
<rect x="788" y="168" width="200" height="48" rx="9" fill="#e9f0f8" stroke="#a2bad0"/><text x="888" y="198" text-anchor="middle" font-size="16" fill="#3c6c89">Actor trajectory</text><path d="M888 216V239 M881 231L888 239L895 231" stroke="#8071ad" stroke-width="2.5" fill="none"/><rect x="788" y="241" width="200" height="48" rx="9" fill="#fff0e6" stroke="#d8a27d"/><text x="888" y="271" text-anchor="middle" font-size="16" fill="#985c3d">Evaluator + Reflector</text><path d="M888 289V312 M881 304L888 312L895 304" stroke="#8071ad" stroke-width="2.5" fill="none"/><rect x="788" y="314" width="200" height="48" rx="9" fill="#f0ecf8" stroke="#b5a8d5"/><text x="888" y="344" text-anchor="middle" font-size="16" fill="#62538e">Memory → next trial</text><text x="888" y="390" text-anchor="middle" font-size="12" fill="#716887">经验改变后续决策上下文</text></g></svg>