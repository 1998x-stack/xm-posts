<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="fig3-title fig3-desc">
<title id="fig3-title">轨迹、反思经验与长期记忆的层次</title><desc id="fig3-desc">当前轮次轨迹先经过评价与反思，再形成有来源的经验条目，筛选后写入记忆，下一轮按相关性检索。</desc>
<rect width="1000" height="430" rx="22" fill="#f8faf8"/><text x="500" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#23474a">From raw trajectory to reusable experience</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif"><rect x="70" y="85" width="860" height="70" rx="13" fill="#eaf1f7" stroke="#9ab7cb" stroke-width="2"/><text x="105" y="116" font-size="18" font-weight="750" fill="#3d6c8b">01 · TRAJECTORY</text><text x="105" y="140" font-size="14" fill="#536e7a">原始观察、动作、工具输出、错误栈、任务状态与时间戳</text>
<path d="M500 155V183 M492 175L500 183L508 175" stroke="#72988a" stroke-width="2.5" fill="none"/><rect x="140" y="185" width="720" height="68" rx="13" fill="#fff0e6" stroke="#d8a27d" stroke-width="2"/><text x="175" y="216" font-size="18" font-weight="750" fill="#a55f3b">02 · REFLECTION</text><text x="175" y="239" font-size="14" fill="#775b49">定位差异 · 解释原因 · 提出可验证的下一步修改</text>
<path d="M500 253V281 M492 273L500 281L508 273" stroke="#72988a" stroke-width="2.5" fill="none"/><rect x="205" y="283" width="590" height="62" rx="13" fill="#e7f3ed" stroke="#8db9a7" stroke-width="2"/><text x="240" y="311" font-size="18" font-weight="750" fill="#207566">03 · VERIFIED MEMORY NOTE</text><text x="240" y="333" font-size="14" fill="#526f65">经验、来源、适用范围、验证状态、失效条件</text>
<path d="M500 345V369 M492 361L500 369L508 361" stroke="#72988a" stroke-width="2.5" fill="none"/><rect x="325" y="371" width="350" height="40" rx="10" fill="#f0ecf8" stroke="#b6a9d5"/><text x="500" y="397" text-anchor="middle" font-size="15" font-weight="700" fill="#65568e">RETRIEVE ONLY WHEN RELEVANT</text></g></svg>