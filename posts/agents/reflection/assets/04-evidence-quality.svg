<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="fig4-title fig4-desc">
<title id="fig4-title">反馈证据的独立性与可验证性</title><desc id="fig4-desc">从内部自评到独立工具、确定性测试和人工审查，逐步增加证据独立性，但任何来源都需要核验其适用性和正确性。</desc>
<rect width="1000" height="430" rx="22" fill="#f8faf8"/><text x="500" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#23474a">Feedback is only as useful as its evidence</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif">
<rect x="42" y="92" width="206" height="200" rx="14" fill="#f0ecf8" stroke="#b6a9d5" stroke-width="2"/><text x="145" y="129" text-anchor="middle" font-size="18" font-weight="750" fill="#65568e">Internal critique</text><text x="145" y="164" text-anchor="middle" font-size="14" fill="#6d6684">同一模型</text><text x="145" y="190" text-anchor="middle" font-size="13" fill="#6d6684">成本低</text><text x="145" y="214" text-anchor="middle" font-size="13" fill="#6d6684">可能共享盲点</text><text x="145" y="257" text-anchor="middle" font-size="12" fill="#7b7390">需防止循环自证</text>
<rect x="282" y="92" width="206" height="200" rx="14" fill="#eaf1f7" stroke="#9ab7cb" stroke-width="2"/><text x="385" y="129" text-anchor="middle" font-size="18" font-weight="750" fill="#3d6c8b">External tool</text><text x="385" y="164" text-anchor="middle" font-size="14" fill="#526d78">搜索 / API / 编译器</text><text x="385" y="190" text-anchor="middle" font-size="13" fill="#526d78">来源相对独立</text><text x="385" y="214" text-anchor="middle" font-size="13" fill="#526d78">可能过时或误读</text><text x="385" y="257" text-anchor="middle" font-size="12" fill="#617b87">保留来源与时间戳</text>
<rect x="522" y="92" width="206" height="200" rx="14" fill="#e6f3ed" stroke="#8db9a7" stroke-width="2"/><text x="625" y="129" text-anchor="middle" font-size="18" font-weight="750" fill="#207566">Deterministic test</text><text x="625" y="164" text-anchor="middle" font-size="14" fill="#526f65">单元测试 / 类型检查</text><text x="625" y="190" text-anchor="middle" font-size="13" fill="#526f65">可重复、可自动化</text><text x="625" y="214" text-anchor="middle" font-size="13" fill="#526f65">覆盖不全仍会漏错</text><text x="625" y="257" text-anchor="middle" font-size="12" fill="#607b70">审查测试本身</text>
<rect x="762" y="92" width="196" height="200" rx="14" fill="#fff0e6" stroke="#d8a27d" stroke-width="2"/><text x="860" y="129" text-anchor="middle" font-size="18" font-weight="750" fill="#a55f3b">Human review</text><text x="860" y="164" text-anchor="middle" font-size="14" fill="#775b49">专家 / 用户验收</text><text x="860" y="190" text-anchor="middle" font-size="13" fill="#775b49">能判断隐含约束</text><text x="860" y="214" text-anchor="middle" font-size="13" fill="#775b49">昂贵且可能不一致</text><text x="860" y="257" text-anchor="middle" font-size="12" fill="#8a684f">记录标准与裁决</text></g>
<text x="500" y="337" text-anchor="middle" font-size="15" font-weight="700" fill="#315956">不要把来源类型直接等同于真值</text><text x="500" y="367" text-anchor="middle" font-size="13" fill="#6d8580">始终检查：来源独立性 · 任务相关性 · 可复现性 · 评价器误报 / 漏报</text></svg>