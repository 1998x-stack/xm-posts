<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fig5-title fig5-desc">
<title id="fig5-title">Reflection 评测的多维仪表盘</title><desc id="fig5-desc">反思评测同时关注初始成功率、反思后成功率、回归率、验证器错误、每次成功成本和记忆效用。</desc>
<rect width="1000" height="420" rx="22" fill="#f8faf8"/><text x="500" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="750" fill="#23474a">Measure improvement, regression, reliability and cost</text>
<g font-family="system-ui,'Microsoft YaHei',sans-serif">
<rect x="55" y="85" width="275" height="112" rx="13" fill="#eaf1f7" stroke="#9ab7cb" stroke-width="2"/><text x="78" y="119" font-size="16" font-weight="750" fill="#3d6c8b">Effectiveness</text><text x="78" y="150" font-size="14" fill="#526d78">Initial → Post-Reflection Success</text><text x="78" y="176" font-size="12" fill="#607b87">Reflection Gain / Success after N rounds</text>
<rect x="365" y="85" width="275" height="112" rx="13" fill="#e6f3ed" stroke="#8db9a7" stroke-width="2"/><text x="388" y="119" font-size="16" font-weight="750" fill="#207566">Reliability</text><text x="388" y="150" font-size="14" fill="#526f65">Verifier false positive / false negative</text><text x="388" y="176" font-size="12" fill="#607b70">Feedback calibration / evidence trace</text>
<rect x="675" y="85" width="270" height="112" rx="13" fill="#fff0e6" stroke="#d8a27d" stroke-width="2"/><text x="698" y="119" font-size="16" font-weight="750" fill="#a55f3b">Regression</text><text x="698" y="150" font-size="14" fill="#775b49">Correct → Incorrect after revision</text><text x="698" y="176" font-size="12" fill="#8a684f">Best-candidate retention</text>
<rect x="55" y="226" width="430" height="112" rx="13" fill="#f0ecf8" stroke="#b6a9d5" stroke-width="2"/><text x="78" y="260" font-size="16" font-weight="750" fill="#65568e">Cost &amp; latency</text><text x="78" y="291" font-size="14" fill="#6d6684">LLM calls · tool calls · tokens · wall-clock time</text><text x="78" y="317" font-size="12" fill="#7b7390">Cost per successful task, not only cost per attempt</text>
<rect x="515" y="226" width="430" height="112" rx="13" fill="#f7f3e9" stroke="#d4c08c" stroke-width="2"/><text x="538" y="260" font-size="16" font-weight="750" fill="#8b6d2d">Memory utility</text><text x="538" y="291" font-size="14" fill="#74623c">Retrieval relevance · transfer · staleness</text><text x="538" y="317" font-size="12" fill="#8b7950">Compare no-memory and shuffled-memory controls</text></g>
<text x="500" y="385" text-anchor="middle" font-size="13" fill="#6d8580">每项指标都需要任务定义、数据切分、预算、基线和统计不确定性</text></svg>