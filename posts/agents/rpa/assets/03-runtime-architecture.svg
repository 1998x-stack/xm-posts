<title id="rpa-fig3-title">企业级 RPA 运行时架构</title><desc id="rpa-fig3-desc">控制平面包括调度、队列、策略、凭据和审计；执行平面由机器人 Worker、UI 与 API 适配器访问企业应用；异常进入人工处理队列。</desc>
