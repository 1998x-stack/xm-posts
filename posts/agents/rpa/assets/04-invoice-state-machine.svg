<rect x="352" y="32" width="196" height="66" rx="12" fill="#fff0df" stroke="#d18a48" stroke-width="2"/><text x="450" y="60" font-weight="700" fill="#8d4c20">HUMAN_REVIEW</text><text x="450" y="81" font-size="12" fill="#8d684b">歧义 / 金额不符 / 无审批</text><path d="M386 174V130H450V98M536 174V130H450V98" fill="none" stroke="#d18a48" stroke-width="2.5" stroke-dasharray="6 5"/>
