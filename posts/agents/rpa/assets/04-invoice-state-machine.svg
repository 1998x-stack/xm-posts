<text x="450" y="402" font-size="15" fill="#536d69">每个状态都应有：进入条件、动作、后置条件、超时策略和审计事件</text><text x="450" y="430" font-size="13" fill="#6d817c">失败不是简单地“再点一次”：先确认上次动作是否已经提交</text></g></svg>