<rect x="180" y="174" width="112" height="62" rx="12" fill="#dff2ed" stroke="#168777" stroke-width="2"/><text x="236" y="210" font-weight="700" fill="#155e55">VALIDATED</text>
<rect x="330" y="174" width="112" height="62" rx="12" fill="#dff2ed" stroke="#168777" stroke-width="2"/><text x="386" y="210" font-weight="700" fill="#155e55">MATCHED</text>
<rect x="480" y="174" width="112" height="62" rx="12" fill="#fff0df" stroke="#d18a48" stroke-width="2"/><text x="536" y="210" font-weight="700" fill="#8d4c20">APPROVED</text>
<rect x="630" y="174" width="112" height="62" rx="12" fill="#e4eef1" stroke="#668a99" stroke-width="2"/><text x="686" y="210" font-weight="700" fill="#315b6a">POSTED</text>
<rect x="780" y="174" width="112" height="62" rx="12" fill="#dff2ed" stroke="#168777" stroke-width="2"/><text x="836" y="210" font-weight="700" fill="#155e55">VERIFIED</text>
<g fill="none" stroke="#637b77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M142 205H180M168 195l12 10-12 10"/><path d="M292 205H330M318 195l12 10-12 10"/><path d="M442 205H480M468 195l12 10-12 10"/><path d="M592 205H630M618 195l12 10-12 10"/><path d="M742 205H780M768 195l12 10-12 10"/></g>
