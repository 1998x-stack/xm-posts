<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="rpa-fig4-title rpa-fig4-desc">
<title id="rpa-fig4-title">发票处理 RPA 的有限状态机</title><desc id="rpa-fig4-desc">发票从接收、校验、匹配、审批、入账、核验到完成；金额不符或审批缺失进入人工复核；提交超时只允许在幂等保护下有限重试。</desc>
