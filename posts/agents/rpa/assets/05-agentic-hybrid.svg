<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="rpa-fig5-title rpa-fig5-desc">
<title id="rpa-fig5-title">从 Agent 轨迹到可复用 RPA 函数</title><desc id="rpa-fig5-desc">Agent 探索任务并产生轨迹，Translator 提炼步骤，Builder 合成可复用 RPA 函数，验证失败时用 Agent 辅助修复，高影响动作仍经过人工门控。</desc>
<rect width="920" height="400" rx="22" fill="#f4f8f6"/>
<rect x="28" y="78" width="150" height="104" rx="13" fill="#e7e9fb" stroke="#777bc4" stroke-width="2"/><text x="103" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#41467f">ReAct Agent</text><text x="103" y="139" text-anchor="middle" font-size="13" fill="#5d6094">探索任务</text><text x="103" y="160" text-anchor="middle" font-size="13" fill="#5d6094">Thought / Action</text>
<rect x="222" y="78" width="150" height="104" rx="13" fill="#fff0df" stroke="#d18a48" stroke-width="2"/><text x="297" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#8d4c20">Translator</text><text x="297" y="139" text-anchor="middle" font-size="13" fill="#8d684b">轨迹提炼</text><text x="297" y="160" text-anchor="middle" font-size="13" fill="#8d684b">规则 / 参数</text>
<rect x="416" y="78" width="150" height="104" rx="13" fill="#dff2ed" stroke="#168777" stroke-width="2"/><text x="491" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#155e55">Builder</text><text x="491" y="139" text-anchor="middle" font-size="13" fill="#386d66">多轨迹检索</text><text x="491" y="160" text-anchor="middle" font-size="13" fill="#386d66">合成 RPA 函数</text>
<rect x="610" y="78" width="150" height="104" rx="13" fill="#e4eef1" stroke="#668a99" stroke-width="2"/><text x="685" y="111" text-anchor="middle" font-size="18" font-weight="700" fill="#315b6a">RPA Function</text><text x="685" y="139" text-anchor="middle" font-size="13" fill="#52727d">稳定重复执行</text><text x="685" y="160" text-anchor="middle" font-size="13" fill="#52727d">低推理开销</text>
<rect x="804" y="78" width="90" height="104" rx="13" fill="#ece9f8" stroke="#9a8bc8" stroke-width="2"/><text x="849" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#51457f">Verify</text><text x="849" y="146" text-anchor="middle" font-size="12" fill="#665e8f">后置条件</text>
