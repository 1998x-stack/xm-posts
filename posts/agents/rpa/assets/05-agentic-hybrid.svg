<rect x="270" y="258" width="190" height="74" rx="12" fill="#fff" stroke="#9a8bc8" stroke-width="2"/><text x="365" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#51457f">ReAct Repair</text><text x="365" y="311" text-anchor="middle" font-size="13" fill="#665e8f">定位偏差并提出修复</text>
<rect x="526" y="258" width="190" height="74" rx="12" fill="#fff0df" stroke="#d18a48" stroke-width="2"/><text x="621" y="287" text-anchor="middle" font-size="16" font-weight="700" fill="#8d4c20">Human Approval</text><text x="621" y="311" text-anchor="middle" font-size="13" fill="#8d684b">高影响动作审批</text>
