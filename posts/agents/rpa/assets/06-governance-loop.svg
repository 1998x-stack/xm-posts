<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="rpa-fig6-title rpa-fig6-desc">
<title id="rpa-fig6-title">高风险 RPA 动作的治理闭环</title><desc id="rpa-fig6-desc">动作执行前经过最小权限和策略判断，高影响操作进入人工审批；执行后读取真实业务状态进行核验，并写入审计记录。</desc>
<rect width="920" height="330" rx="22" fill="#f4f8f6"/>
<rect x="35" y="104" width="150" height="90" rx="13" fill="#e7e9fb" stroke="#777bc4" stroke-width="2"/><text x="110" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#41467f">Action Request</text><text x="110" y="164" text-anchor="middle" font-size="13" fill="#5d6094">操作意图</text>
<rect x="235" y="104" width="150" height="90" rx="13" fill="#fff0df" stroke="#d18a48" stroke-width="2"/><text x="310" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#8d4c20">Policy Gate</text><text x="310" y="164" text-anchor="middle" font-size="13" fill="#8d684b">权限 · 风险等级</text>
<rect x="435" y="104" width="150" height="90" rx="13" fill="#dff2ed" stroke="#168777" stroke-width="2"/><text x="510" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#155e55">Execute</text><text x="510" y="164" text-anchor="middle" font-size="13" fill="#386d66">受控操作</text>
<rect x="635" y="104" width="150" height="90" rx="13" fill="#e4eef1" stroke="#668a99" stroke-width="2"/><text x="710" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#315b6a">Verify State</text><text x="710" y="164" text-anchor="middle" font-size="13" fill="#52727d">读回业务记录</text>
<rect x="785" y="235" width="100" height="60" rx="11" fill="#dff2ed" stroke="#168777" stroke-width="2"/><text x="835" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#155e55">Audit</text>
<rect x="235" y="235" width="190" height="60" rx="11" fill="#fff" stroke="#d18a48" stroke-width="2"/><text x="330" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#8d4c20">Human Approval</text><text x="330" y="281" text-anchor="middle" font-size="12" fill="#8d684b">高影响动作 / 例外</text>
<g fill="none" stroke="#637b77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M185 149H235M223 139l12 10-12 10"/><path d="M385 149H435M423 139l12 10-12 10"/><path d="M585 149H635M623 139l12 10-12 10"/><path d="M710 194V265H785"/><path d="M310 194V235"/></g>
<text x="450" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#203b3c">先授权，再执行；先核验，再宣告成功</text><text x="460" y="317" text-anchor="middle" font-size="12" fill="#6d817c">“已保存”只是界面反馈，必须读取持久化记录并验证关键字段</text></svg>