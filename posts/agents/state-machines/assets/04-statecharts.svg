<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" role="img" aria-labelledby="fsm04-title fsm04-desc">
<title id="fsm04-title">层次状态机把复杂行为拆成嵌套与正交区域</title><desc id="fsm04-desc">一个 AgentTask 复合状态包含准备和执行两个阶段；执行阶段中，任务执行与预算监控是同时激活的两个正交区域。</desc>
<rect x="8" y="8" width="904" height="354" rx="18" fill="#f5f8f6"/>
<g font-family="system-ui,sans-serif" fill="#29484c">
<rect x="35" y="35" width="850" height="300" rx="18" fill="#fff" stroke="#7a79b6" stroke-width="2.5"/><text x="62" y="66" font-size="19" font-weight="700" fill="#514878">AgentTask（复合状态）</text>
<rect x="70" y="105" width="220" height="190" rx="13" fill="#e7e9fb" stroke="#7774b9" stroke-width="2"/><text x="180" y="132" text-anchor="middle" font-size="17" font-weight="700">准备区域</text>
<rect x="95" y="158" width="170" height="48" rx="9" fill="#fff" stroke="#7774b9"/><text x="180" y="188" text-anchor="middle" font-size="15">校验输入</text><path d="M180 206 V226 M174 219 L180 228 L186 219" fill="none" stroke="#7774b9" stroke-width="2"/>
<rect x="95" y="230" width="170" height="48" rx="9" fill="#fff" stroke="#7774b9"/><text x="180" y="260" text-anchor="middle" font-size="15">生成计划</text>
<rect x="330" y="105" width="525" height="190" rx="13" fill="#eaf5ef" stroke="#287f77" stroke-width="2"/><text x="592" y="132" text-anchor="middle" font-size="17" font-weight="700">执行阶段（复合状态）</text>
<rect x="350" y="151" width="300" height="123" rx="10" fill="#fff" stroke="#287f77" stroke-width="1.7"/><text x="500" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#287f77">正交区域 A · 任务执行</text>
<rect x="370" y="194" width="115" height="54" rx="8" fill="#dcefeb" stroke="#287f77"/><text x="427" y="226" text-anchor="middle" font-size="14">调用工具</text><path d="M485 221 H520 M514 215 L522 221 L514 227" fill="none" stroke="#287f77" stroke-width="2"/>
<rect x="522" y="194" width="108" height="54" rx="8" fill="#dcefeb" stroke="#287f77"/><text x="576" y="226" text-anchor="middle" font-size="14">观察结果</text>
<rect x="670" y="151" width="165" height="123" rx="10" fill="#fff0dc" stroke="#c18a3d" stroke-width="1.7"/><text x="752" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#916c35">正交区域 B · 预算</text>
<rect x="688" y="194" width="130" height="54" rx="8" fill="#fff" stroke="#c18a3d"/><text x="753" y="226" text-anchor="middle" font-size="14">剩余预算监控</text>
<path d="M290 200 H326 M320 194 L328 200 L320 206" fill="none" stroke="#287f77" stroke-width="2"/>
<text x="460" y="322" text-anchor="middle" font-size="13" fill="#61777a">正交区域表示同时处于活动配置中，不等价于必须创建两个线程</text></g></svg>
