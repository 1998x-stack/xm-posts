<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="jev-agent-title jev-agent-desc">
<title id="jev-agent-title">Agent 中的混合决策架构</title>
<desc id="jev-agent-desc">代码构建和过滤状态，生成式模型负责需要语言表达的任务，Jev 负责窄范围类型化判断，策略代码计算风险并选择工具执行、人工审核或拒绝。</desc>
