<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 335" role="img" aria-labelledby="alex-fig-1-title alex-fig-1-desc"><title id="alex-fig-1-title">两条视觉识别路径</title><desc id="alex-fig-1-desc">上方为特征工程加分类器的基线，下方为图像到类别分布的多层卷积网络。</desc><rect width="800" height="335" rx="14" fill="#f5faf7"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="30" y="38" fill="#2d5457" font-size="18" font-weight="700">同样是识别一张图片，两条信息路径</text>
<text x="30" y="95" fill="#697e7d" font-size="13">典型传统路线（概念简化）</text>
<rect x="33" y="110" width="154" height="66" rx="12" fill="#e5eeed" stroke="#8bb5aa"/><text x="110" y="136" fill="#224b4f" text-anchor="middle" font-size="17" font-weight="700">图像</text><text x="110" y="159" fill="#526e70" text-anchor="middle" font-size="12">像素输入</text><rect x="253" y="110" width="165" height="66" rx="12" fill="#f5e6d6" stroke="#8bb5aa"/><text x="335.5" y="136" fill="#224b4f" text-anchor="middle" font-size="17" font-weight="700">手工特征</text><text x="335.5" y="159" fill="#526e70" text-anchor="middle" font-size="12">SIFT / Fisher Vector</text><rect x="486" y="110" width="135" height="66" rx="12" fill="#eee8f8" stroke="#8bb5aa"/><text x="553.5" y="143" fill="#224b4f" text-anchor="middle" font-size="17" font-weight="700">分类器</text><rect x="680" y="110" width="100" height="66" rx="12" fill="#dceee7" stroke="#8bb5aa"/><text x="730" y="143" fill="#224b4f" text-anchor="middle" font-size="17" font-weight="700">标签</text>
<path d="M188 143 H249 M418 143 H482 M622 143 H676" stroke="#739390" stroke-width="3" stroke-linecap="round"/>
<text x="30" y="224" fill="#697e7d" font-size="13">AlexNet 路线（可学习的层级表示）</text>
<rect x="33" y="238" width="154" height="62" rx="12" fill="#e5eeed" stroke="#8bb5aa"/><text x="110" y="269" fill="#224b4f" text-anchor="middle" font-size="17" font-weight="700">RGB 图像</text><rect x="253" y="238" width="165" height="62" rx="12" fill="#d9eceb" stroke="#8bb5aa"/><text x="335.5" y="262" fill="#224b4f" text-anchor="middle" font-size="17" font-weight="700">5 层卷积</text><text x="335.5" y="285" fill="#526e70" text-anchor="middle" font-size="12">边缘 → 组合</text><rect x="486" y="238" width="135" height="62" rx="12" fill="#f7e3d6" stroke="#8bb5aa"/><text x="553.5" y="269" fill="#224b4f" text-anchor="middle" font-size="17" font-weight="700">3 层全连接</text><rect x="680" y="238" width="100" height="62" rx="12" fill="#dceee7" stroke="#8bb5aa"/><text x="730" y="269" fill="#224b4f" text-anchor="middle" font-size="17" font-weight="700">1000 类</text>
<path d="M188 269 H249 M418 269 H482 M622 269 H676" stroke="#318985" stroke-width="3" stroke-linecap="round"/></g></svg>
