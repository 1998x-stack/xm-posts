<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" role="img" aria-labelledby="alex-fig-4-title alex-fig-4-desc"><title id="alex-fig-4-title">ReLU 和 tanh 形状对比</title><desc id="alex-fig-4-desc">ReLU 正半轴不饱和，tanh 两端趋向平坦。</desc><rect width="800" height="334" rx="14" fill="#f5faf7"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="30" y="38" font-size="18" font-weight="700" fill="#2d5457">两个激活函数的形状（原理示意，不是论文实验曲线）</text>
<path d="M92 228 H365 M225 276 V65 M470 228 H743 M605 276 V65" stroke="#9eb9b5" stroke-width="2"/>
<path d="M90 228 H225 L347 83" stroke="#198782" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M484 269 C540 268 553 255 570 233 C590 205 611 127 632 108 C655 85 700 82 744 82" stroke="#b97051" stroke-width="5" fill="none"/><path d="M472 81 H748 M472 270 H748" stroke="#d8d8d0" stroke-dasharray="5 6"/><g font-size="17" font-weight="700"><text x="105" y="68" fill="#187e7b">ReLU(z) = max(0,z)</text><text x="510" y="67" fill="#b36b4b">tanh(z)</text></g><text x="106" y="301" font-size="13" fill="#466b6b">z &gt; 0 时斜率为 1</text><text x="525" y="301" font-size="13" fill="#7f6b5f">两端梯度趋近于 0</text></g></svg>
