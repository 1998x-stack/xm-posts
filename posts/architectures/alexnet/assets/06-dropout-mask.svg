<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 284" role="img" aria-labelledby="alex-fig-6-title alex-fig-6-desc"><title id="alex-fig-6-title">Dropout 在训练时随机屏蔽隐藏单元</title><desc id="alex-fig-6-desc">一组中间神经元部分被随机屏蔽，但参数仍共享；推理时不用采样。</desc><rect width="800" height="284" rx="14" fill="#f5faf7"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="29" y="37" font-size="18" font-weight="700" fill="#315d5b">同一层权重，两种训练时采样的掩码</text>
<text x="25" y="84" font-size="14" fill="#3c6867">训练样本 A</text><text x="420" y="84" font-size="14" fill="#3c6867">训练样本 B</text>
<circle cx="62" cy="144" r="18" fill="#bce7d9" stroke="#428e85"/><text x="62" y="150" text-anchor="middle" font-size="16" fill="#346966">●</text><circle cx="108" cy="144" r="18" fill="#e4e5e2" stroke="#aab9b6"/><text x="108" y="150" text-anchor="middle" font-size="16" fill="#346966">×</text><circle cx="154" cy="144" r="18" fill="#bce7d9" stroke="#428e85"/><text x="154" y="150" text-anchor="middle" font-size="16" fill="#346966">●</text><circle cx="200" cy="144" r="18" fill="#bce7d9" stroke="#428e85"/><text x="200" y="150" text-anchor="middle" font-size="16" fill="#346966">●</text><circle cx="246" cy="144" r="18" fill="#e4e5e2" stroke="#aab9b6"/><text x="246" y="150" text-anchor="middle" font-size="16" fill="#346966">×</text><circle cx="292" cy="144" r="18" fill="#bce7d9" stroke="#428e85"/><text x="292" y="150" text-anchor="middle" font-size="16" fill="#346966">●</text>
<circle cx="453" cy="144" r="18" fill="#e4e5e2" stroke="#aab9b6"/><text x="453" y="150" text-anchor="middle" font-size="16" fill="#346966">×</text><circle cx="499" cy="144" r="18" fill="#f5dac2" stroke="#ca956d"/><text x="499" y="150" text-anchor="middle" font-size="16" fill="#346966">●</text><circle cx="545" cy="144" r="18" fill="#f5dac2" stroke="#ca956d"/><text x="545" y="150" text-anchor="middle" font-size="16" fill="#346966">●</text><circle cx="591" cy="144" r="18" fill="#e4e5e2" stroke="#aab9b6"/><text x="591" y="150" text-anchor="middle" font-size="16" fill="#346966">×</text><circle cx="637" cy="144" r="18" fill="#f5dac2" stroke="#ca956d"/><text x="637" y="150" text-anchor="middle" font-size="16" fill="#346966">●</text><circle cx="683" cy="144" r="18" fill="#e4e5e2" stroke="#aab9b6"/><text x="683" y="150" text-anchor="middle" font-size="16" fill="#346966">×</text>
<text x="27" y="220" font-size="14" fill="#5c7675">每次前向随机置零，减少隐藏单元过度依赖彼此；不等于删除参数。</text><text x="27" y="245" font-size="14" fill="#5c7675">原论文采用丢弃概率 0.5，主要作用于前两个全连接隐藏层。</text></g></svg>
