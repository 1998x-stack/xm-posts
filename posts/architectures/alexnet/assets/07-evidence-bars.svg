<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 337" role="img" aria-labelledby="alex-fig-7-title alex-fig-7-desc"><title id="alex-fig-7-title">2012 年 Top-5 错误率</title><desc id="alex-fig-7-desc">验证与测试集的数据口径区分；单模型和竞赛集成的条形数据源于论文表二。</desc><rect width="800" height="337" rx="14" fill="#f5faf7"/><g font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><text x="28" y="35" font-size="18" fill="#2d5759" font-weight="700">ILSVRC-2012 Top-5 error · 越低越好</text>
<text x="32" y="88" font-size="14" fill="#405d60">1 CNN · val</text><rect x="195" y="68" width="291.2" height="28" rx="5" fill="#7caea5"/><text x="496.2" y="88" font-size="15" font-weight="700" fill="#325e5e">18.2%</text><text x="32" y="142" font-size="14" fill="#405d60">5 CNNs · test</text><rect x="195" y="122" width="262.4" height="28" rx="5" fill="#5e9690"/><text x="467.4" y="142" font-size="15" font-weight="700" fill="#325e5e">16.4%</text><text x="32" y="196" font-size="14" fill="#405d60">7 CNNs* · test</text><rect x="195" y="176" width="244.8" height="28" rx="5" fill="#23837e"/><text x="449.8" y="196" font-size="15" font-weight="700" fill="#325e5e">15.3%</text><text x="32" y="250" font-size="14" fill="#405d60">SIFT + FV · test</text><rect x="195" y="230" width="419.2" height="28" rx="5" fill="#bf876b"/><text x="624.2" y="250" font-size="15" font-weight="700" fill="#325e5e">26.2%</text>
<text x="32" y="310" fill="#607979" font-size="13">* 7 CNNs 包含在 ImageNet Fall 2011 额外数据上预训练的网络；不可等同于 1 CNN。</text></g></svg>
