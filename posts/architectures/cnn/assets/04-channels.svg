<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cnn-fig-4-title cnn-fig-4-desc" viewBox="0 0 840 290" font-family="-apple-system,Segoe UI,PingFang SC,sans-serif"><title id="cnn-fig-4-title">跨通道卷积归约</title><desc id="cnn-fig-4-desc">三个输入通道由不同核组映射为两个输出通道。</desc><rect x="0" y="0" width="840" height="290" rx="14" fill="#fff" stroke="none"/><text x="151" y="40" font-size="20" fill="#147f80" text-anchor="middle">3 个输入通道</text><rect x="75" y="75" width="125" height="76" rx="10" fill="#e1f3ed" stroke="#147f80"/><rect x="96" y="115" width="125" height="76" rx="10" fill="#b9e3d6" stroke="#147f80"/><rect x="117" y="155" width="125" height="76" rx="10" fill="#85c7b3" stroke="#147f80"/><text x="420" y="40" font-size="19" fill="#ce7251" text-anchor="middle">每个输出核跨越 3 通道</text><rect x="344" y="99" width="152" height="54" rx="10" fill="#ffeadf" stroke="#ce7251"/><text x="420" y="130" font-size="18" fill="#ce7251" text-anchor="middle">W0: 3 × K²</text><rect x="344" y="181" width="152" height="54" rx="10" fill="#ffeadf" stroke="#ce7251"/><text x="420" y="212" font-size="18" fill="#ce7251" text-anchor="middle">W1: 3 × K²</text><path d="M220 168 L341 126" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M496 125 L628 156" fill="none" stroke="#ce7251" stroke-width="3" stroke-linecap="round"/><path d="M496 208 L652 204" fill="none" stroke="#ce7251" stroke-width="3" stroke-linecap="round"/><rect x="630" y="106" width="125" height="80" rx="9" fill="#e8e2f7" stroke="#7665aa"/><rect x="650" y="171" width="125" height="80" rx="9" fill="#e8e2f7" stroke="#7665aa"/><text x="709" y="40" font-size="20" fill="#7665aa" text-anchor="middle">2 个输出通道</text></svg>
