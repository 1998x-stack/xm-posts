<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cnn-fig-6-title cnn-fig-6-desc" viewBox="0 0 840 290" font-family="-apple-system,Segoe UI,PingFang SC,sans-serif"><title id="cnn-fig-6-title">LeNet-5 的精确尺寸顺序</title><desc id="cnn-fig-6-desc">32x32 input，28x28x6 C1，14x14x6 S2，10x10x16 C3，5x5x16 S4，1x1x120 C5，84 F6，10 欧氏 RBF。</desc><rect x="0" y="0" width="840" height="290" rx="14" fill="#fff" stroke="none"/><text x="420" y="38" font-size="22" fill="#223c40" text-anchor="middle">LeNet-5 · 1998 / Figure 2</text><rect x="14" y="92" width="94" height="105" rx="9" fill="#e3f3ee" stroke="#147f80"/><text x="61" y="130" font-size="18" fill="#223c40" text-anchor="middle">Input</text><text x="61" y="162" font-size="14" fill="#5f7477" text-anchor="middle">32²×1</text><rect x="118" y="92" width="94" height="105" rx="9" fill="#ffefdf" stroke="#ce7251"/><text x="165" y="130" font-size="18" fill="#223c40" text-anchor="middle">C1</text><text x="165" y="162" font-size="14" fill="#5f7477" text-anchor="middle">28²×6</text><rect x="222" y="92" width="94" height="105" rx="9" fill="#e3f3ee" stroke="#147f80"/><text x="269" y="130" font-size="18" fill="#223c40" text-anchor="middle">S2</text><text x="269" y="162" font-size="14" fill="#5f7477" text-anchor="middle">14²×6</text><rect x="326" y="92" width="94" height="105" rx="9" fill="#ffefdf" stroke="#ce7251"/><text x="373" y="130" font-size="18" fill="#223c40" text-anchor="middle">C3</text><text x="373" y="162" font-size="14" fill="#5f7477" text-anchor="middle">10²×16</text><rect x="430" y="92" width="94" height="105" rx="9" fill="#e3f3ee" stroke="#147f80"/><text x="477" y="130" font-size="18" fill="#223c40" text-anchor="middle">S4</text><text x="477" y="162" font-size="14" fill="#5f7477" text-anchor="middle">5²×16</text><rect x="534" y="92" width="94" height="105" rx="9" fill="#ffefdf" stroke="#ce7251"/><text x="581" y="130" font-size="18" fill="#223c40" text-anchor="middle">C5</text><text x="581" y="162" font-size="14" fill="#5f7477" text-anchor="middle">1²×120</text><rect x="638" y="92" width="94" height="105" rx="9" fill="#e3f3ee" stroke="#147f80"/><text x="685" y="130" font-size="18" fill="#223c40" text-anchor="middle">F6</text><text x="685" y="162" font-size="14" fill="#5f7477" text-anchor="middle">84</text><rect x="742" y="92" width="94" height="105" rx="9" fill="#ffefdf" stroke="#ce7251"/><text x="789" y="130" font-size="18" fill="#223c40" text-anchor="middle">RBF</text><text x="789" y="162" font-size="14" fill="#5f7477" text-anchor="middle">10</text><text x="420" y="234" font-size="17" fill="#223c40" text-anchor="middle">C3 部分连接 · S2/S4 可学习下采样 · RBF 距离输出</text><text x="420" y="262" font-size="14" fill="#ce7251" text-anchor="middle">现代 ReLU / MaxPool / Softmax 教学模板不等于 1998 原始网络</text></svg>
