<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cnn-fig-7-title cnn-fig-7-desc" viewBox="0 0 840 290" font-family="-apple-system,Segoe UI,PingFang SC,sans-serif"><title id="cnn-fig-7-title">共享核梯度在空间求和</title><desc id="cnn-fig-7-desc">三个不同输出位置对同一卷积核权重贡献梯度，合并后更新同一权重。</desc><rect x="0" y="0" width="840" height="290" rx="14" fill="#fff" stroke="none"/><text x="180" y="42" font-size="20" fill="#147f80" text-anchor="middle">不同输出位置</text><rect x="89" y="68" width="169" height="46" rx="8" fill="#e5f4ed" stroke="#147f80"/><text x="173" y="97" font-size="17" fill="#147f80" text-anchor="middle">δ1 × patch1</text><path d="M260 93 L362 160" fill="none" stroke="#ce7251" stroke-width="2" stroke-linecap="round"/><rect x="89" y="133" width="169" height="46" rx="8" fill="#e5f4ed" stroke="#147f80"/><text x="173" y="162" font-size="17" fill="#147f80" text-anchor="middle">δ2 × patch2</text><path d="M260 158 L362 160" fill="none" stroke="#ce7251" stroke-width="2" stroke-linecap="round"/><rect x="89" y="198" width="169" height="46" rx="8" fill="#e5f4ed" stroke="#147f80"/><text x="173" y="227" font-size="17" fill="#147f80" text-anchor="middle">δ3 × patch3</text><path d="M260 223 L362 160" fill="none" stroke="#ce7251" stroke-width="2" stroke-linecap="round"/><text x="413" y="176" font-size="61" fill="#ce7251" text-anchor="middle">Σ</text><path d="M446 160 L535 160" fill="none" stroke="#ce7251" stroke-width="3" stroke-linecap="round"/><rect x="540" y="110" width="221" height="104" rx="12" fill="#ece6fa" stroke="#7665aa"/><text x="651" y="158" font-size="26" fill="#7665aa" text-anchor="middle">∂ L / ∂ W</text><text x="651" y="187" font-size="16" fill="#5f7477" text-anchor="middle">同一共享参数</text></svg>
