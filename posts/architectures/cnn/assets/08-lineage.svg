<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cnn-fig-8-title cnn-fig-8-desc" viewBox="0 0 840 290" font-family="-apple-system,Segoe UI,PingFang SC,sans-serif"><title id="cnn-fig-8-title">CNN 论文演进脉络</title><desc id="cnn-fig-8-desc">LeNet-5 1998，AlexNet 2012，VGG 2014，ResNet 2015 至 2016。</desc><rect x="0" y="0" width="840" height="290" rx="14" fill="#fff" stroke="none"/><path d="M88 148 L750 148" fill="none" stroke="#bfd5cb" stroke-width="7" stroke-linecap="round"/><circle cx="98" cy="148" r="13" fill="#147f80"/><text x="98" y="70" font-size="22" fill="#223c40" text-anchor="middle">1998</text><text x="98" y="110" font-size="18" fill="#5f7477" text-anchor="middle">LeNet-5</text><text x="98" y="215" font-size="17" fill="#147f80" text-anchor="middle">局部 · 共享</text><circle cx="311" cy="148" r="13" fill="#ce7251"/><text x="311" y="70" font-size="22" fill="#223c40" text-anchor="middle">2012</text><text x="311" y="110" font-size="18" fill="#5f7477" text-anchor="middle">AlexNet</text><text x="311" y="215" font-size="17" fill="#ce7251" text-anchor="middle">GPU · ReLU</text><circle cx="524" cy="148" r="13" fill="#147f80"/><text x="524" y="70" font-size="22" fill="#223c40" text-anchor="middle">2014</text><text x="524" y="110" font-size="18" fill="#5f7477" text-anchor="middle">VGG</text><text x="524" y="215" font-size="17" fill="#147f80" text-anchor="middle">深层小核</text><circle cx="737" cy="148" r="13" fill="#ce7251"/><text x="737" y="70" font-size="22" fill="#223c40" text-anchor="middle">2015–16</text><text x="737" y="110" font-size="18" fill="#5f7477" text-anchor="middle">ResNet</text><text x="737" y="215" font-size="17" fill="#ce7251" text-anchor="middle">恒等捷径</text><text x="420" y="272" font-size="14" fill="#5f7477" text-anchor="middle">不同论文的实验协议不可直接混作公平比较</text></svg>
