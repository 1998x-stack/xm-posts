<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="左侧直接累加键值对，右侧先读取旧值，根据误差进行定向修正；两种方式使用相同状态矩阵"><title>从叠加记忆到纠错记忆</title><desc>左侧直接累加键值对，右侧先读取旧值，根据误差进行定向修正；两种方式使用相同状态矩阵</desc><rect width="960" height="330" rx="22" fill="#f8fbf9"/><text x="34" y="49" font-size="25" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#284e51">写入新键值对：旧记忆是否需要修正？</text><rect x="35" y="83" width="416" height="204" rx="13" fill="#fff7ef" stroke="#f1dac5" stroke-width="2"/><rect x="509" y="83" width="416" height="204" rx="13" fill="#edf8f4" stroke="#c3e2d7" stroke-width="2"/><text x="63" y="120" font-size="20" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#98633f">普通线性注意力</text><text x="540" y="120" font-size="20" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#20776e">DeltaNet</text><text x="63" y="167" font-size="21" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#775e4b">状态  +  新的 v ⊗ k</text><text x="540" y="167" font-size="21" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#1f6a64">先读：v_old = S · k</text><text x="540" y="205" font-size="21" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#1f6a64">误差：v − v_old</text><text x="540" y="243" font-size="19" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#1f6a64">修正：S ← S + β · 误差 ⊗ k</text><text x="63" y="224" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#98633f">相似 Key 的信息可能叠加干扰</text><text x="63" y="251" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#98633f">没有基于旧读出的纠错步骤</text><text x="37" y="311" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#98633f">橙色：无条件累积</text><text x="510" y="311" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#20776e">绿色：先读、再比较、再写</text></svg>
