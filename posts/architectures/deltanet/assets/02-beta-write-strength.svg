<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="假设键为单位向量，旧读出为0.2，新目标为1，学习率β分别为0、0.5、1；对应读出为0.2、0.6、1"><title>同一地址更新的三种学习率</title><desc>假设键为单位向量，旧读出为0.2，新目标为1，学习率β分别为0、0.5、1；对应读出为0.2、0.6、1</desc><rect width="960" height="330" rx="22" fill="#f8fbf9"/><text x="33" y="49" font-size="24" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#284e51">单位 Key 的定向覆写：从旧值 0.2 写向目标 1.0</text><rect x="35" y="83" width="282" height="210" rx="13" fill="#fff" stroke="#d5e5df" stroke-width="2"/><text x="55" y="119" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#295457">β = 0</text><rect x="55" y="152" width="242" height="29" rx="13" fill="#e6eeeb" stroke="#d5e5df" stroke-width="2"/><rect x="55" y="152" width="48" height="29" rx="7" fill="#dfe9e6"/><text x="55" y="212" font-size="20" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#216c68">新读出 = 0.2</text><text x="55" y="257" font-size="17" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#607c7d">不修改</text><rect x="347" y="83" width="282" height="210" rx="13" fill="#fff" stroke="#d5e5df" stroke-width="2"/><text x="367" y="119" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#295457">β = 0.5</text><rect x="367" y="152" width="242" height="29" rx="13" fill="#e6eeeb" stroke="#d5e5df" stroke-width="2"/><rect x="367" y="152" width="145" height="29" rx="7" fill="#afdcd1"/><text x="367" y="212" font-size="20" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#216c68">新读出 = 0.6</text><text x="367" y="257" font-size="17" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#607c7d">折中</text><rect x="659" y="83" width="282" height="210" rx="13" fill="#fff" stroke="#d5e5df" stroke-width="2"/><text x="679" y="119" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#295457">β = 1</text><rect x="679" y="152" width="242" height="29" rx="13" fill="#e6eeeb" stroke="#d5e5df" stroke-width="2"/><rect x="679" y="152" width="242" height="29" rx="7" fill="#2b9185"/><text x="679" y="212" font-size="20" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#216c68">新读出 = 1.0</text><text x="679" y="257" font-size="17" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#607c7d">覆盖</text><text x="35" y="316" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#6b7f80">仅当 ‖k‖₂ = 1 时，β = 1 才意味着该 Key 方向上的精确覆写。</text></svg>
