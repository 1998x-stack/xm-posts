<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="时间轴先分块，每个块内计算伪值与低秩表示，块边界递推状态；非声称时间步完全独立"><title>分块并行与 WY 表示</title><desc>时间轴先分块，每个块内计算伪值与低秩表示，块边界递推状态；非声称时间步完全独立</desc><rect width="960" height="330" rx="22" fill="#f8fbf9"/><text x="35" y="50" font-size="24" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#284e51">训练时不逐 token 启动独立 GPU kernel，而在块内批量计算</text><rect x="42" y="94" width="96" height="52" rx="13" fill="#e8f5f1" stroke="#9bd3c6" stroke-width="2"/><text x="90" y="126" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#345b60">t1</text><rect x="152" y="94" width="96" height="52" rx="13" fill="#e8f5f1" stroke="#9bd3c6" stroke-width="2"/><text x="200" y="126" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#345b60">t2</text><rect x="262" y="94" width="96" height="52" rx="13" fill="#e8f5f1" stroke="#9bd3c6" stroke-width="2"/><text x="310" y="126" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#345b60">t3</text><rect x="372" y="94" width="96" height="52" rx="13" fill="#e8f5f1" stroke="#9bd3c6" stroke-width="2"/><text x="420" y="126" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#345b60">t4</text><rect x="482" y="94" width="96" height="52" rx="13" fill="#edf2fb" stroke="#b6c7dd" stroke-width="2"/><text x="530" y="126" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#345b60">t5</text><rect x="592" y="94" width="96" height="52" rx="13" fill="#edf2fb" stroke="#b6c7dd" stroke-width="2"/><text x="640" y="126" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#345b60">t6</text><rect x="702" y="94" width="96" height="52" rx="13" fill="#edf2fb" stroke="#b6c7dd" stroke-width="2"/><text x="750" y="126" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#345b60">t7</text><rect x="812" y="94" width="96" height="52" rx="13" fill="#edf2fb" stroke="#b6c7dd" stroke-width="2"/><text x="860" y="126" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#345b60">t8</text><rect x="41" y="180" width="429" height="88" rx="13" fill="#e8f5f1" stroke="#9bd3c6" stroke-width="2"/><rect x="491" y="180" width="429" height="88" rx="13" fill="#edf2fb" stroke="#b6c7dd" stroke-width="2"/><text x="63" y="215" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#236c67">Chunk A：伪值 U、W / 三角结构 T</text><text x="512" y="215" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#376a8d">Chunk B：相同块内操作</text><text x="63" y="247" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#547875">高效矩阵乘法，因果下三角</text><text x="512" y="247" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="start" font-weight="600" fill="#53728c">从上一块边界状态继续</text><line x1="470" y1="224" x2="491" y2="224" stroke="#a77955" stroke-width="3" stroke-linecap="round"/><text x="465" y="304" font-size="17" font-family="system-ui,'PingFang SC',sans-serif" text-anchor="middle" font-weight="600" fill="#6e7373">块之间仍保留状态依赖；跨块不是无条件并行。</text></svg>
