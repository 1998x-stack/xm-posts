<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" role="img" aria-labelledby="title desc">
<title id="title">三类别真实与生成分布的差异</title>
<desc id="desc">真实概率 A 0.60、B 0.30、C 0.10；生成概率 A 0.15、B 0.20、C 0.65。每对柱子的差异显示生成器尚未学会目标分布。</desc>
<rect width="960" height="415" rx="20" fill="#fbfcf8"/>
<g font-family="system-ui,'PingFang SC',sans-serif">
<text x="48" y="51" fill="#25494d" font-size="26" font-weight="750">从离散小例子看“学一个分布”</text>
<text x="48" y="83" fill="#5d7571" font-size="18">A、B、C 是教学用的三种样本类型，不是论文实验结果</text>
<rect x="52" y="115" width="19" height="19" rx="3" fill="#2d857e"/><text x="81" y="131" font-size="18" fill="#3d6661">真实 p_data</text>
<rect x="267" y="115" width="19" height="19" rx="3" fill="#cc835d"/><text x="297" y="131" font-size="18" fill="#855d44">生成 p_g</text>
<line x1="130" x2="862" y1="343" y2="343" stroke="#b6cdc1" stroke-width="2"/>
<g fill="#2d857e"><rect x="202" y="170" width="51" height="173" rx="6"/><rect x="432" y="256" width="51" height="87" rx="6"/><rect x="662" y="314" width="51" height="29" rx="6"/></g>
<g fill="#cc835d"><rect x="261" y="300" width="51" height="43" rx="6"/><rect x="491" y="285" width="51" height="58" rx="6"/><rect x="721" y="155" width="51" height="188" rx="6"/></g>
<g font-size="19" font-weight="750" text-anchor="middle"><text x="227" y="158" fill="#286d67">.60</text><text x="457" y="244" fill="#286d67">.30</text><text x="687" y="302" fill="#286d67">.10</text><text x="286" y="290" fill="#ab633f">.15</text><text x="516" y="274" fill="#ab633f">.20</text><text x="746" y="144" fill="#ab633f">.65</text></g>
<g font-size="20" text-anchor="middle" fill="#4d6e67"><text x="257" y="376">类别 A</text><text x="487" y="376">类别 B</text><text x="717" y="376">类别 C</text></g>
</g></svg>