<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" role="img" aria-labelledby="title desc">
<title id="title">最优判别器 D 星的三个具体输出</title>
<desc id="desc">D星等于真实密度除以真实与生成密度之和。类别 A 为80%，B 为60%，C 为13.3%，说明判断取决于两侧相对概率。</desc>
<rect width="960" height="418" rx="20" fill="#fbfcf8"/>
<g font-family="system-ui,'PingFang SC',sans-serif">
<text x="47" y="49" fill="#264b50" font-size="27" font-weight="750">判别器不是“记住真假”，而是比较两种来源</text>
<text x="47" y="86" fill="#4e7471" font-size="20">D*(x) = p_data(x) / (p_data(x) + p_g(x))</text>
<rect x="47" y="119" width="866" height="245" rx="16" fill="#eff6f1" stroke="#c7ded3"/>
<g fill="#315b5a" font-weight="700" font-size="20"><text x="79" y="159">样本</text><text x="235" y="159">真实 / 生成</text><text x="570" y="159">D* 认为真实的概率</text></g>
<g font-size="22" fill="#335c5b"><text x="82" y="223">A</text><text x="235" y="223">.60 / .15</text><text x="82" y="281">B</text><text x="235" y="281">.30 / .20</text><text x="82" y="339">C</text><text x="235" y="339">.10 / .65</text></g>
<g fill="#d8e6dd"><rect x="570" y="202" width="235" height="23" rx="5"/><rect x="570" y="260" width="235" height="23" rx="5"/><rect x="570" y="318" width="235" height="23" rx="5"/></g>
<g fill="#2d857e"><rect x="570" y="202" width="188" height="23" rx="5"/><rect x="570" y="260" width="141" height="23" rx="5"/><rect x="570" y="318" width="31.3" height="23" rx="5"/></g>
<g font-size="20" font-weight="750" fill="#266c65"><text x="819" y="221">80%</text><text x="819" y="279">60%</text><text x="819" y="337">13.3%</text></g>
<text x="47" y="395" font-size="17" fill="#56756e">p_g = p_data 时，所有有概率质量的类别对应 D* = 50%。</text>
</g></svg>