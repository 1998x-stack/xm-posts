<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GNN 邻居消息流：A、B、C 对 B 的新表示有贡献，D 不能在一层内直接到达 B" viewBox="0 0 960 350"><title>GNN 邻居消息流：A、B、C 对 B 的新表示有贡献，D 不能在一层内直接到达 B</title><rect x="1" y="1" width="958" height="348" rx="18" fill="#f8fbf9" stroke="#dae8e3" stroke-width="1.5"/><text x="35" y="44" fill="#35565f" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start">四节点链 A — B — C — D</text><line x1="105" y1="154" x2="235" y2="154" stroke="#91adab" stroke-width="4" stroke-linecap="round"/><line x1="235" y1="154" x2="365" y2="154" stroke="#91adab" stroke-width="4" stroke-linecap="round"/><line x1="365" y1="154" x2="495" y2="154" stroke="#b4c9c5" stroke-width="3" stroke-linecap="round"/><circle cx="105" cy="154" r="35" fill="#43799c" stroke="#fff" stroke-width="3"/><text x="105" y="151" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="800" text-anchor="middle">A</text><text x="105" y="173" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="650" text-anchor="middle">2</text><circle cx="235" cy="154" r="35" fill="#c4743d" stroke="#fff" stroke-width="3"/><text x="235" y="151" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="800" text-anchor="middle">B</text><text x="235" y="173" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="650" text-anchor="middle">4</text><circle cx="365" cy="154" r="35" fill="#43799c" stroke="#fff" stroke-width="3"/><text x="365" y="151" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="800" text-anchor="middle">C</text><text x="365" y="173" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="650" text-anchor="middle">8</text><circle cx="495" cy="154" r="35" fill="#9dafae" stroke="#fff" stroke-width="3"/><text x="495" y="151" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="800" text-anchor="middle">D</text><text x="495" y="173" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="650" text-anchor="middle">6</text><text x="105" y="229" fill="#294b56" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">邻居</text><text x="235" y="229" fill="#294b56" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">目标 + 自身</text><text x="365" y="229" fill="#294b56" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">邻居</text><text x="495" y="229" fill="#6b8585" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">一跳不可达</text><rect x="579" y="72" width="340" height="207" rx="19" fill="#eef7f2" stroke="#bcdad1" stroke-width="1.5"/><text x="608" y="113" fill="#255f5d" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start">B 收到的三条信号</text><text x="751" y="159" fill="#1c6967" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="750" text-anchor="middle">2   +   4   +   8</text><line x1="652" y1="179" x2="849" y2="179" stroke="#87aaa0" stroke-width="2" stroke-linecap="round"/><text x="748" y="210" fill="#b26739" font-family="system-ui,'PingFang SC',sans-serif" font-size="25" font-weight="750" text-anchor="middle">÷ 3  =  4.67</text><text x="750" y="249" fill="#426b65" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle">教学版：含自身的等权平均</text><text x="35" y="306" fill="#53706f" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="start">实线：相邻节点可直接通信；灰边 D—C 需要再传播一层才能影响 B。</text></svg>
