<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="图神经网络的感受野：零层只有 B，一层触及 A 和 C，两层扩展到 D" viewBox="0 0 980 370"><title>图神经网络的感受野：零层只有 B，一层触及 A 和 C，两层扩展到 D</title><rect x="1" y="1" width="978" height="368" rx="18" fill="#f8fbf9" stroke="#dae8e3" stroke-width="1.5"/><text x="25" y="38" fill="#35565f" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" text-anchor="start">每增加一层，信息可以沿一条边多传播一步</text><rect x="14" y="62" width="286" height="240" rx="15" fill="#ffffff" stroke="#d6e7e1" stroke-width="1.5"/><text x="157" y="101" fill="#264d59" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle">0 层 · 只看自身</text><line x1="64" y1="178" x2="126" y2="178" stroke="#56a39b" stroke-width="4" stroke-linecap="round"/><line x1="126" y1="178" x2="188" y2="178" stroke="#c7d3d2" stroke-width="4" stroke-linecap="round"/><line x1="188" y1="178" x2="250" y2="178" stroke="#c7d3d2" stroke-width="4" stroke-linecap="round"/><circle cx="64" cy="178" r="21" fill="#cad9d6" stroke="#fff" stroke-width="3"/><text x="64" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">A</text><circle cx="126" cy="178" r="21" fill="#bf723d" stroke="#fff" stroke-width="3"/><text x="126" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">B</text><circle cx="188" cy="178" r="21" fill="#cad9d6" stroke="#fff" stroke-width="3"/><text x="188" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">C</text><circle cx="250" cy="178" r="21" fill="#cad9d6" stroke="#fff" stroke-width="3"/><text x="250" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">D</text><text x="157" y="258" fill="#5d7a7b" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle">B 的原始特征</text><rect x="347" y="62" width="286" height="240" rx="15" fill="#ffffff" stroke="#d6e7e1" stroke-width="1.5"/><text x="490" y="101" fill="#264d59" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle">1 层 · 一跳邻域</text><line x1="397" y1="178" x2="459" y2="178" stroke="#56a39b" stroke-width="4" stroke-linecap="round"/><line x1="459" y1="178" x2="521" y2="178" stroke="#56a39b" stroke-width="4" stroke-linecap="round"/><line x1="521" y1="178" x2="583" y2="178" stroke="#c7d3d2" stroke-width="4" stroke-linecap="round"/><circle cx="397" cy="178" r="21" fill="#3e8e86" stroke="#fff" stroke-width="3"/><text x="397" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">A</text><circle cx="459" cy="178" r="21" fill="#bf723d" stroke="#fff" stroke-width="3"/><text x="459" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">B</text><circle cx="521" cy="178" r="21" fill="#3e8e86" stroke="#fff" stroke-width="3"/><text x="521" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">C</text><circle cx="583" cy="178" r="21" fill="#cad9d6" stroke="#fff" stroke-width="3"/><text x="583" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">D</text><text x="490" y="258" fill="#5d7a7b" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle">A、B、C 可以影响 B</text><rect x="680" y="62" width="286" height="240" rx="15" fill="#ffffff" stroke="#d6e7e1" stroke-width="1.5"/><text x="823" y="101" fill="#264d59" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle">2 层 · 两跳邻域</text><line x1="730" y1="178" x2="792" y2="178" stroke="#56a39b" stroke-width="4" stroke-linecap="round"/><line x1="792" y1="178" x2="854" y2="178" stroke="#56a39b" stroke-width="4" stroke-linecap="round"/><line x1="854" y1="178" x2="916" y2="178" stroke="#56a39b" stroke-width="4" stroke-linecap="round"/><circle cx="730" cy="178" r="21" fill="#3e8e86" stroke="#fff" stroke-width="3"/><text x="730" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">A</text><circle cx="792" cy="178" r="21" fill="#bf723d" stroke="#fff" stroke-width="3"/><text x="792" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">B</text><circle cx="854" cy="178" r="21" fill="#3e8e86" stroke="#fff" stroke-width="3"/><text x="854" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">C</text><circle cx="916" cy="178" r="21" fill="#3e8e86" stroke="#fff" stroke-width="3"/><text x="916" y="184" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="800" text-anchor="middle">D</text><text x="823" y="258" fill="#5d7a7b" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle">D 通过 C 间接影响 B</text><text x="490" y="340" fill="#587677" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle">图中的“可影响”表示计算路径，不表示每条路径的权重相等。</text></svg>
