<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同一个四节点图中，等权邻居平均与 GCN 对称度归一化不是同一个算子" viewBox="0 0 980 390"><title>同一个四节点图中，等权邻居平均与 GCN 对称度归一化不是同一个算子</title><rect x="1" y="1" width="978" height="388" rx="18" fill="#f8fbf9" stroke="#dae8e3" stroke-width="1.5"/><text x="29" y="45" fill="#294f59" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start">同一个目标节点 B，两种权重</text><rect x="24" y="75" width="444" height="250" rx="18" fill="#fff" stroke="#cbdedb" stroke-width="1.5"/><rect x="512" y="75" width="444" height="250" rx="18" fill="#fff" stroke="#cbdedb" stroke-width="1.5"/><text x="45" y="116" fill="#226b67" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="start">行均值（教学演示）</text><text x="45" y="156" fill="#5e7377" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="start">每个来源权重 = 1 / 3</text><text x="245" y="214" fill="#2d6b6b" font-family="system-ui,'PingFang SC',sans-serif" font-size="26" font-weight="700" text-anchor="middle">( 2 + 4 + 8 ) / 3</text><text x="245" y="270" fill="#b66a35" font-family="system-ui,'PingFang SC',sans-serif" font-size="27" font-weight="750" text-anchor="middle">= 4.6667</text><text x="537" y="116" fill="#226b67" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="start">GCN 对称归一化</text><text x="537" y="156" fill="#5e7377" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start">加自环后度数 dA=2、dB=3、dC=3</text><text x="732" y="215" fill="#2d6b6b" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" font-weight="700" text-anchor="middle">2 / √6  +  4 / 3  +  8 / 3</text><text x="732" y="270" fill="#b66a35" font-family="system-ui,'PingFang SC',sans-serif" font-size="27" font-weight="750" text-anchor="middle">≈ 4.8165</text><text x="30" y="359" fill="#567474" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="520" text-anchor="start">GCN 的对称系数未必逐行和为 1；因此不能把它直接称为“平均值”。</text></svg>
