<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-label="示意单步自回归解码中的新查询与历史 KV Cache 数据流，不代表端到端耗时比例" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" aria-describedby="gqa-asset-desc-01"><title>Decode 需要反复读取历史 Key 和 Value</title><desc id="gqa-asset-desc-01">示意从当前 Query 到历史 K/V 的数据流。图中的长条仅说明 KV 宽度随组数 G 缩减，不是实测 GPU 带宽曲线。</desc><rect width="900" height="345" rx="18" fill="#f7faf7"/><text x="36" y="47" font-size="23" fill="#25494b" font-weight="750" text-anchor="start">同一时刻只生成一个新 token</text><rect x="40" y="83" width="210" height="78" rx="8" fill="#e4efff" stroke="#8aa9d2"/><text x="145" y="116" font-size="20" fill="#325a8b" font-weight="700" text-anchor="middle">新的 Q (本步)</text><text x="145" y="143" font-size="14" fill="#45688e" font-weight="500" text-anchor="middle">H 个 Query Head</text><line x1="250" y1="121" x2="312" y2="121" stroke="#4a86bd" stroke-width="3" /><text x="280" y="110" font-size="14" fill="#4d6975" font-weight="600" text-anchor="middle">读取</text><rect x="317" y="76" width="537" height="100" rx="8" fill="#fff6ed" stroke="#e2be97"/><text x="585" y="112" font-size="23" fill="#9e5737" font-weight="700" text-anchor="middle">历史 K / V (所有 token)</text><text x="585" y="147" font-size="16" fill="#966e50" font-weight="500" text-anchor="middle">T × G × d × 2 份张量</text><text x="43" y="239" font-size="18" fill="#23494b" font-weight="650" text-anchor="start">改变 KV Head 数 G，会改变缓存大小与加载量</text><rect x="42" y="264" width="790" height="25" rx="7" fill="#e5ebe8" stroke="none"/><rect x="42" y="264" width="790" height="25" rx="7" fill="#db8b6b" stroke="none"/><text x="842" y="283" font-size="13" fill="#734d39" font-weight="700" text-anchor="start">MHA</text><rect x="42" y="302" width="198" height="23" rx="7" fill="#177f7a" stroke="none"/><text x="258" y="320" font-size="14" fill="#287d77" font-weight="700" text-anchor="start">GQA (G/H = 1/4)</text></svg>
