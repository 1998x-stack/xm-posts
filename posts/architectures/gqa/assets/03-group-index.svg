<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="八个Query Head按相邻两个组成一组，映射至四个共享KV Head" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" aria-describedby="gqa-asset-desc-03"><title>分组索引计算</title><desc id="gqa-asset-desc-03">Q0/Q1 使用 KV0；Q2/Q3 使用 KV1；依此类推。实际张量实现中不必先物理复制共享的 K/V。</desc><rect width="900" height="320" rx="18" fill="#f7faf7"/><text x="35" y="45" font-size="22" fill="#274c4e" font-weight="730" text-anchor="start">用一个确定的映射将 Query Head 指向 KV Group</text><rect x="56" y="82" width="74" height="61" rx="8" fill="#e4efff" stroke="#96b5d8"/><text x="93" y="110" font-size="20" fill="#356390" font-weight="750" text-anchor="middle">Q0</text><text x="93" y="129" font-size="11" fill="#4f6c8c" font-weight="550" text-anchor="middle">g=0</text><line x1="93" y1="147" x2="92" y2="226" stroke="#2b9890" stroke-width="2.5" /><rect x="156" y="82" width="74" height="61" rx="8" fill="#e4efff" stroke="#96b5d8"/><text x="193" y="110" font-size="20" fill="#356390" font-weight="750" text-anchor="middle">Q1</text><text x="193" y="129" font-size="11" fill="#4f6c8c" font-weight="550" text-anchor="middle">g=0</text><line x1="193" y1="147" x2="92" y2="226" stroke="#2b9890" stroke-width="2.5" /><rect x="256" y="82" width="74" height="61" rx="8" fill="#e4efff" stroke="#96b5d8"/><text x="293" y="110" font-size="20" fill="#356390" font-weight="750" text-anchor="middle">Q2</text><text x="293" y="129" font-size="11" fill="#4f6c8c" font-weight="550" text-anchor="middle">g=1</text><line x1="293" y1="147" x2="292" y2="226" stroke="#d28c59" stroke-width="2.5" /><rect x="356" y="82" width="74" height="61" rx="8" fill="#e4efff" stroke="#96b5d8"/><text x="393" y="110" font-size="20" fill="#356390" font-weight="750" text-anchor="middle">Q3</text><text x="393" y="129" font-size="11" fill="#4f6c8c" font-weight="550" text-anchor="middle">g=1</text><line x1="393" y1="147" x2="292" y2="226" stroke="#d28c59" stroke-width="2.5" /><rect x="456" y="82" width="74"