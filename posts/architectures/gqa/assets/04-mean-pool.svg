<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" role="img" aria-label="四个旧Key和Value投影被两两平均变成两个Group的新投影，Query与输出投影保留" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>分组均值池化旧的 K/V 权重</title><rect width="900" height="355" rx="18" fill="#f7faf7"/><text x="38" y="48" font-size="21" fill="#234b4e" font-weight="750" text-anchor="start">转换：每个 KV Group 内的旧投影矩阵求算术平均</text><rect x="45" y="104" width="131" height="67" rx="8" fill="#fff0e5" stroke="#d0a18d"/><text x="110" y="129" font-size="20" fill="#a35a3c" font-weight="750" text-anchor="middle">Wᴷ0</text><text x="110" y="153" font-size="17" fill="#987463" font-weight="650" text-anchor="middle">Wⱽ0</text><rect x="221" y="104" width="131" height="67" rx="8" fill="#fff0e5" stroke="#d0a18d"/><text x="286" y="129" font-size="20" fill="#a35a3c" font-weight="750" text-anchor="middle">Wᴷ1</text><text x="286" y="153" font-size="17" fill="#987463" font-weight="650" text-anchor="middle">Wⱽ1</text><rect x="397" y="104" width="131" height="67" rx="8" fill="#fff0e5" stroke="#d0a18d"/><text x="462" y="129" font-size="20" fill="#a35a3c" font-weight="750" text-anchor="middle">Wᴷ2</text><text x="462" y="153" font-size="17" fill="#987463" font-weight="650" text-anchor="middle">Wⱽ2</text><rect x="573" y="104" width="131" height="67" rx="8" fill="#fff0e5" stroke="#d0a18d"/><text x="638" y="129" font-size="20" fill="#a35a3c" font-weight="750" text-anchor="middle">Wᴷ3</text><text x="638" y="153" font-size="17" fill="#987463" font-weight="650" text-anchor="middle">Wⱽ3</text><line x1="180" y1="198" x2="420" y2="243" stroke="#9aada5" stroke-width="2.3" /><line x1="360" y1="198" x2="420" y2="243" stroke="#9aada5" stroke-width="2.3" /><line x1="536" y1="198" x2="641" y2="243" stroke="#9aada5" stroke-width="2.3" /><line x1="712" y1="198" x2="641" y2="243" stroke="#9aada5" stroke-width="2.3" /><rect x="344" y="237" width="157" height="58" rx="8" fill="#dff6ef" stroke="#8ebfaf"/><text x="422" y="273" font-size="16" fill="#257267" font-weight="750" text-anchor="middle">Group 0 平均</text><rect x="554" y="237" width="157" height="58" rx="8" fill="#e7e5f8" stroke="#b4a8d8"/><text x="632" y="273" font-size="16" fill="#6758a4" font-weight="750" text-anchor="middle">Group 1 平均</text><text x="35" y="330" font-size="15" fill="#526e6d" font-weight="500" text-anchor="start">Q、输出投影保持对应结构；变化的是 K/V 参数与随后的继续训练。</text></svg>
