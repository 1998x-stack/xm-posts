<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 305" role="img" aria-label="先均值池化得到GQA结构，再使用预训练方案继续训练部分步骤，不是仅改变缓存设置" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" aria-describedby="gqa-asset-desc-05"><title>从 MHA checkpoint 到 GQA 模型的两阶段流程</title><desc id="gqa-asset-desc-05">两阶段流程是 Checkpoint mean pooling → Uptraining。5% 不是推理时只使用 5% 的算力，也不是只保存 5% 的模型权重。</desc><rect width="900" height="305" rx="18" fill="#f7faf7"/><text x="40" y="48" font-size="22" fill="#24494b" font-weight="760" text-anchor="start">这是一条训练路径，不是仅在推理时更改开关</text><rect x="34" y="82" width="255" height="135" rx="15" fill="#edf4fc" stroke="#cadae0"/><text x="54" y="116" font-size="12" fill="#4f7781" font-weight="750" text-anchor="start">阶段 0</text><text x="54" y="152" font-size="22" fill="#294c4e" font-weight="780" text-anchor="start">MHA checkpoint</text><text x="54" y="184" font-size="13" fill="#546f70" font-weight="500" text-anchor="start">T5.1.1 预训练参数</text><rect x="323" y="82" width="255" height="135" rx="15" fill="#fff1e8" stroke="#cadae0"/><text x="343" y="116" font-size="12" fill="#4f7781" font-weight="750" text-anchor="start">阶段 1</text><text x="343" y="152" font-size="22" fill="#294c4e" font-weight="780" text-anchor="start">KV mean pooling</text><text x="343" y="184" font-size="13" fill="#546f70" font-weight="500" text-anchor="start">按组平均旧 K/V 投影</text><rect x="612" y="82" width="255" height="135" rx="15" fill="#e5f6f0" stroke="#cadae0"/><text x="632" y="116" font-size="12" fill="#4f7781" font-weight="750" text-anchor="start">阶段 2</text><text x="632" y="152" font-size="22" fill="#294c4e" font-weight="780" text-anchor="start">继续预训练</text><text x="632" y="184" font-size="13" fill="#546f70" font-weight="500" text-anchor="start">α = 0.05 的原训练步数</text><line x1="289" y1="152" x2="322" y2="152" stroke="#7c9c9b" stroke-width="3" /><line x1="577" y1="152" x2="611" y2="152" stroke="#7c9c9b" stroke-width="3" /><text x="43" y="273" font-size="16" fill="#526e71" font-weight="500" text-anchor="start">论文中的 5% 是相对于原预训练计算预算的额外训练，不是总算力节省 95%。</text></svg>
