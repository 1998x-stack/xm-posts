<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 335" role="img" aria-label="相同的时间跨度下不同遗忘门系数导致不同直接状态梯度衰减，0.9 100次接近零，0.99 100次约0.366" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>保留门的时间梯度</title><rect width="920" height="335" rx="18" fill="#f6faf8"/><text x="50" y="42" font-size="18" fill="#25474a" text-anchor="start">仅看直接状态通路：常数遗忘门 f 连乘 N 次 → fᴺ</text><text x="45" y="104" font-size="17" fill="#395b60" text-anchor="start">f = 0.90</text><rect x="187" y="81" width="650" height="33" rx="7" fill="#e1eae6"/><rect x="187" y="81" width="2" height="33" rx="7" fill="#c67e6b"/><text x="856" y="104" font-size="15" fill="#2c5357" text-anchor="end">0.00003</text><text x="45" y="177" font-size="17" fill="#395b60" text-anchor="start">f = 0.99</text><rect x="187" y="154" width="650" height="33" rx="7" fill="#e1eae6"/><rect x="187" y="154" width="237.921021827599" height="33" rx="7" fill="#d29b52"/><text x="856" y="177" font-size="15" fill="#2c5357" text-anchor="end">0.36603</text><text x="45" y="250" font-size="17" fill="#395b60" text-anchor="start">f = 0.999</text><rect x="187" y="227" width="650" height="33" rx="7" fill="#e1eae6"/><rect x="187" y="227" width="588.1148956239108" height="33" rx="7" fill="#278c7c"/><text x="856" y="250" font-size="15" fill="#2c5357" text-anchor="end">0.90479</text><text x="45" y="311" font-size="14" fill="#4b696c" text-anchor="start">教学演算：固定 f、只计算直接支路，不等同于完整梯度，也未运行训练。</text></svg>
