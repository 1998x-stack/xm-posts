<text x="44" y="205" font-size="18" fill="#9b6041" font-family="system-ui" font-weight="600">固定混合：每步类似地扰动记忆</text><path d="M50 235 L195 224 L340 263 L485 213 L630 265 L775 239 L905 284" stroke="#b66c45" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="905" cy="284" r="8" fill="#b66c45"/>
<text x="44" y="303" font-size="18" fill="#126a61" font-family="system-ui" font-weight="600">选择性更新：跳过噪声，保留有效信息</text><path d="M360 296 L485 296 L630 254 L775 254 L905 254" stroke="#15887c" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="905" cy="254" r="8" fill="#15887c"/>
