<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="m1t m1d"><title id="m1t">选择性记忆：按内容保存关键 token</title><desc id="m1d">上方固定写入轨迹持续受干扰，下方选择性轨迹仅对关键 token 明显更新状态，噪声时保留旧状态。</desc>
<rect width="980" height="360" rx="22" fill="#f4f9f6"/>
<text x="42" y="46" font-size="23" font-family="system-ui" fill="#204a48" font-weight="700">同一段输入，为什么需要选择性记忆？</text>
<g font-family="system-ui" font-size="20" text-anchor="middle">
<rect x="48" y="88" width="115" height="64" rx="12" fill="#d3ebe0"/><text x="105" y="129" fill="#125a4e">A · 关键</text>
<rect x="211" y="88" width="115" height="64" rx="12" fill="#e7eaf0"/><text x="268" y="129" fill="#65717c">噪声</text>
<rect x="374" y="88" width="115" height="64" rx="12" fill="#e7eaf0"/><text x="431" y="129" fill="#65717c">噪声</text>
<rect x="537" y="88" width="115" height="64" rx="12" fill="#d3ebe0"/><text x="594" y="129" fill="#125a4e">B · 关键</text>
<rect x="700" y="88" width="115" height="64" rx="12" fill="#e7eaf0"/><text x="758" y="129" fill="#65717c">噪声</text>
</g>
