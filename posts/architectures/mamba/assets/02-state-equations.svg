<text x="496" y="93" font-size="15" fill="#406879" font-family="system-ui">A 为学习参数，Δ 决定离散化步长</text><text x="40" y="351" font-size="15" fill="#5c7787" font-family="system-ui">注意：此图隐藏了完整 Mamba Block 中的 Conv1D、门控和残差路径</text></svg>