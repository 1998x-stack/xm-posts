<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-label="标准卷积一次完成空间滤波和跨通道融合；深度可分离卷积把两者拆成 Depthwise 和 Pointwise 两步"><title>一个卷积，还是两个分工？</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#21454a}.head{font-size:21px;font-weight:750}.lab{font-size:16px;font-weight:650}.small{font-size:13px;fill:#4d6f73}.box{fill:#eef8f5;stroke:#8ac8ba;stroke-width:2}.warm{fill:#fff1e6;stroke:#dca57f;stroke-width:2}.purple{fill:#f1edfd;stroke:#bab0e5;stroke-width:2}.line{stroke:#4e7777;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="18" y="32" class="head">标准卷积：两件事在同一个核里完成</text><rect x="18" y="62" rx="14" width="208" height="86" class="box"/><text x="122" y="98" text-anchor="middle" class="lab">输入 H×W×M</text><text x="122" y="124" text-anchor="middle" class="small">所有输入通道</text><path d="M232 105 H291" class="line"/><path d="M281 97 L293 105 L281 113" class="line"/><rect x="299" y="62" rx="14" width="210" height="86" class="warm"/><text x="404" y="98" text-anchor="middle" class="lab">k×k×M×N</text><text x="404" y="124" text-anchor="middle" class="small">空间 + 融合</text><path d="M515 105 H569" class="line"/><rect x="580" y="62" rx="14" width="182" height="86" class="box"/><text x="670" y="110" text-anchor="middle" class="lab">H′×W′×N</text><text x="18" y="184" class="head">MobileNet V1：先滤波，再融合</text><rect x="18" y="207" rx="12" width="158" height="65" class="box"/><text x="97" y="248" text-anchor="middle" class="lab">H×W×M</text><path d="M181 239 H205" class="line"/><rect x="211" y="207" rx="12" width="167" height="65" class="purple"/><text x="294" y="233" text-anchor="middle" class="lab">Depthwise</text><text x="294" y="252" text-anchor="middle" class="small">k×k×M</text><path d="M382 239 H407" class="line"/><rect x="413" y="207" rx="12" width="167" height="65" class="warm"/><text x="496" y="233" text-anchor="middle" class="lab">Pointwise</text><text x="496" y="252" text-anchor="middle" class="small">1×1×M×N</text><path d="M585 239 H607" class="line"/><rect x="614" y="207" rx="12" width="148" height="65" class="box"/><text x="688" y="246" text-anchor="middle" class="lab">H′×W′×N</text></svg>
