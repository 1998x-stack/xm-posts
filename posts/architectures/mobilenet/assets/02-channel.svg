<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-label="示例展示三个输入通道分别使用三个空间卷积核，经过 Depthwise 后由 Pointwise 混合形成多个输出通道"><title>逐通道滤波与跨通道混合</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#21454a}.head{font-size:21px;font-weight:750}.lab{font-size:16px;font-weight:650}.small{font-size:13px;fill:#4d6f73}.box{fill:#eef8f5;stroke:#8ac8ba;stroke-width:2}.warm{fill:#fff1e6;stroke:#dca57f;stroke-width:2}.purple{fill:#f1edfd;stroke:#bab0e5;stroke-width:2}.line{stroke:#4e7777;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="18" y="35" class="head">Depthwise：一条输入通道对应一个空间核</text><rect x="32" y="67" rx="10" width="180" height="51" class="box"/><text x="122" y="98" text-anchor="middle" class="lab">输入通道 1</text><path d="M218 92 H282" class="line"/><rect x="290" y="67" rx="10" width="174" height="51" class="purple"/><text x="377" y="98" text-anchor="middle" class="lab">3×3 核 1</text><rect x="32" y="137" rx="10" width="180" height="51" class="purple"/><text x="122" y="168" text-anchor="middle" class="lab">输入通道 2</text><path d="M218 162 H282" class="line"/><rect x="290" y="137" rx="10" width="174" height="51" class="purple"/><text x="377" y="168" text-anchor="middle" class="lab">3×3 核 2</text><rect x="32" y="207" rx="10" width="180" height="51" class="box"/><text x="122" y="238" text-anchor="middle" class="lab">输入通道 3</text><path d="M218 232 H282" class="line"/><rect x="290" y="207" rx="10" width="174" height="51" class="purple"/><text x="377" y="238" text-anchor="middle" class="lab">3×3 核 3</text><path d="M469 162 H518" class="line"/><rect x="529" y="96" rx="14" width="219" height="131" class="warm"/><text x="638" y="136" text-anchor="middle" class="lab">Pointwise 1×1</text><text x="638" y="165" text-anchor="middle" class="small">跨通道线性组合</text><text x="638" y="196" text-anchor="middle" class="lab">输出 N 通道</text><text x="25" y="306" class="small">中间特征图仍是 M 通道；Depthwise 本身不会让不同通道相互交流。</text></svg>
