<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-label="MobileNet V1 架构从首层标准卷积，重复 Depthwise Pointwise 堆叠并下采样，最后全局平均池化、全连接与 softmax"><title>MobileNet V1 的特征提取流水线</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#21454a}.head{font-size:21px;font-weight:750}.lab{font-size:16px;font-weight:650}.small{font-size:13px;fill:#4d6f73}.box{fill:#eef8f5;stroke:#8ac8ba;stroke-width:2}.warm{fill:#fff1e6;stroke:#dca57f;stroke-width:2}.purple{fill:#f1edfd;stroke:#bab0e5;stroke-width:2}.line{stroke:#4e7777;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="18" y="31" class="head">从 224² RGB 输入到 1000 类概率</text><rect x="18" y="91" width="115" height="102" rx="14" class="box"/><text x="75.5" y="133" text-anchor="middle" class="lab">RGB</text><text x="75.5" y="158" text-anchor="middle" class="small">224²×3</text><path d="M137 142 H150" class="line"/><rect x="153" y="91" width="124" height="102" rx="14" class="warm"/><text x="215" y="133" text-anchor="middle" class="lab">Conv 3×3</text><text x="215" y="158" text-anchor="middle" class="small">stride 2</text><path d="M281 142 H294" class="line"/><rect x="297" y="91" width="155" height="102" rx="14" class="purple"/><text x="374.5" y="133" text-anchor="middle" class="lab">DW → PW</text><text x="374.5" y="158" text-anchor="middle" class="small">重复堆叠</text><path d="M456 142 H469" class="line"/><rect x="472" y="91" width="125" height="102" rx="14" class="box"/><text x="534.5" y="133" text-anchor="middle" class="lab">Avg Pool</text><text x="534.5" y="158" text-anchor="middle" class="small">7×7 → 1×1</text><path d="M601 142 H614" class="line"/><rect x="617" y="91" width="145" height="102" rx="14" class="warm"/><text x="689.5" y="133" text-anchor="middle" class="lab">FC → Softmax</text><text x="689.5" y="158" text-anchor="middle" class="small">1000 classes</text><text x="25" y="227" class="small">完整 V1：首层普通卷积；之后 13 个 Depthwise + Pointwise 对；降采样由步幅 2 完成。</text><text x="25" y="254" class="small">1 个首层卷积 + 13 组 DW/PW = 27 个卷积层；连同最终 FC，共 28 个可学习层。</text></svg>
