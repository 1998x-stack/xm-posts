<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-label="原论文 Table 2 的计算量分布，其中 1 乘 1 卷积占 94.86%，Depthwise 卷积占 3.06%"><title>节约计算量之后，计算主要去了哪里？</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#21454a}.head{font-size:21px;font-weight:750}.lab{font-size:16px;font-weight:650}.small{font-size:13px;fill:#4d6f73}.box{fill:#eef8f5;stroke:#8ac8ba;stroke-width:2}.warm{fill:#fff1e6;stroke:#dca57f;stroke-width:2}.purple{fill:#f1edfd;stroke:#bab0e5;stroke-width:2}.line{stroke:#4e7777;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="20" y="34" class="head">MobileNet V1 各层类型的 Mult-Adds 占比</text><text x="22" y="87" class="lab">1×1 Pointwise</text><rect x="195" y="66" width="472" height="24" rx="6" fill="#e8f1ee"/><rect x="195" y="66" width="447.7392" height="24" rx="6" fill="#16847c"/><text x="685" y="85" class="lab">94.86%</text><text x="22" y="148" class="lab">3×3 Depthwise</text><rect x="195" y="127" width="472" height="24" rx="6" fill="#e8f1ee"/><rect x="195" y="127" width="14.4432" height="24" rx="6" fill="#a89be8"/><text x="685" y="146" class="lab">3.06%</text><text x="22" y="209" class="lab">首层 3×3</text><rect x="195" y="188" width="472" height="24" rx="6" fill="#e8f1ee"/><rect x="195" y="188" width="5.6168" height="24" rx="6" fill="#e5ae7e"/><text x="685" y="207" class="lab">1.19%</text><text x="22" y="270" class="lab">最终 FC</text><rect x="195" y="249" width="472" height="24" rx="6" fill="#e8f1ee"/><rect x="195" y="249" width="3" height="24" rx="6" fill="#99b9b5"/><text x="685" y="268" class="lab">0.18%</text><text x="22" y="312" class="small">原论文 Table 2；四项之和因其他零散计算与四舍五入不必恰好等于 100%。</text></svg>
