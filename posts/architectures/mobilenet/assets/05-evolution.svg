<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-label="MobileNet 系列四代机制比较：V1 深度可分离卷积、V2 逆残差线性瓶颈、V3 NAS 与 SE 和 h-swish、V4 Universal Inverted Bottleneck 和移动注意力"><title>四代 MobileNet 解决了不同的瓶颈</title><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#21454a}.head{font-size:21px;font-weight:750}.lab{font-size:16px;font-weight:650}.small{font-size:13px;fill:#4d6f73}.box{fill:#eef8f5;stroke:#8ac8ba;stroke-width:2}.warm{fill:#fff1e6;stroke:#dca57f;stroke-width:2}.purple{fill:#f1edfd;stroke:#bab0e5;stroke-width:2}.line{stroke:#4e7777;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect x="20" y="65" width="168" height="182" rx="16" class="box"/><text x="104" y="104" text-anchor="middle" class="head">V1 · 2017</text><text x="104" y="145" text-anchor="middle" class="lab" style="font-size:14px">DW → PW</text><text x="104" y="195" text-anchor="middle" class="small" style="font-size:12px">先分离空间和通道</text><rect x="211" y="65" width="168" height="182" rx="16" class="purple"/><text x="295" y="104" text-anchor="middle" class="head">V2 · 2018</text><text x="295" y="145" text-anchor="middle" class="lab" style="font-size:14px">扩张 → DW → 投影</text><text x="295" y="195" text-anchor="middle" class="small" style="font-size:12px">薄层之间残差连接</text><rect x="402" y="65" width="168" height="182" rx="16" class="warm"/><text x="486" y="104" text-anchor="middle" class="head">V3 · 2019</text><text x="486" y="145" text-anchor="middle" class="lab" style="font-size:14px">NAS + SE + h-swish</text><text x="486" y="195" text-anchor="middle" class="small" style="font-size:12px">更贴近设备延迟</text><rect x="593" y="65" width="168" height="182" rx="16" class="box"/><text x="677" y="104" text-anchor="middle" class="head">V4 · 2024</text><text x="677" y="145" text-anchor="middle" class="lab" style="font-size:14px">UIB + Mobile MQA</text><text x="677" y="195" text-anchor="middle" class="small" style="font-size:12px">适配多类加速器</text><text x="23" y="282" class="small">示意是机制演进，不表示四代训练设置或基准指标可直接横向比较。</text></svg>
