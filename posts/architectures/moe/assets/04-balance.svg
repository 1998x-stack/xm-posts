<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-label="六枚token各选择两个专家，四名专家收到7、5、0、0次调用，说明使用不均衡。" font-family="system-ui,'PingFang SC',sans-serif"><title>负载不均的路由后果</title><desc>六枚token各选择两个专家，四名专家收到7、5、0、0次调用，说明使用不均衡。</desc><rect width="900" height="350" fill="#f5faf7" rx="18"/><text x="35" y="45" fill="#254b50" font-size="23" font-weight="650">04 / Expert imbalance</text><text x="44" y="85" fill="#607c75" font-size="17" font-weight="650">Toy: 6 tokens × top-2 = 12 routes</text><rect x="110" y="110" width="89" height="164" rx="10" fill="#e7efea" stroke="#e7efea" stroke-width="1.5"/><rect x="110" y="134" width="89" height="140" rx="10" fill="#c78362" stroke="#c78362" stroke-width="1.5"/><text x="133" y="300" fill="#254b50" font-size="18" font-weight="650">E0</text><text x="134" y="143" fill="#254b50" font-size="22" font-weight="650">7</text><rect x="296" y="110" width="89" height="164" rx="10" fill="#e7efea" stroke="#e7efea" stroke-width="1.5"/><rect x="296" y="174" width="89" height="100" rx="10" fill="#c78362" stroke="#c78362" stroke-width="1.5"/><text x="319" y="300" fill="#254b50" font-size="18" font-weight="650">E1</text><text x="320" y="143" fill="#254b50" font-size="22" font-weight="650">5</text><rect x="482" y="110" width="89" height="164" rx="10" fill="#e7efea" stroke="#e7efea" stroke-width="1.5"/><text x="505" y="300" fill="#254b50" font-size="18" font-weight="650">E2</text><text x="506" y="143" fill="#254b50" font-size="22" font-weight="650">0</text><rect x="668" y="110" width="89" height="164" rx="10" fill="#e7efea" stroke="#e7efea" stroke-width="1.5"/><text x="691" y="300" fill="#254b50" font-size="18" font-weight="650">E3</text><text x="692" y="143" fill="#254b50" font-size="22" font-weight="650">0</text><text x="40" y="332" fill="#617e77" font-size="14" font-weight="650">Importance = 总门控权重；Load = 实际调用量，不可混淆。</text></svg>
