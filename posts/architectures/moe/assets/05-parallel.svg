<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 365" role="img" aria-label="两张 GPU 分别持有两名专家，路由后token需跨设备 dispatch 再返回 combine。" font-family="system-ui,'PingFang SC',sans-serif"><title>两个 GPU 的专家并行和通信</title><desc>两张 GPU 分别持有两名专家，路由后token需跨设备 dispatch 再返回 combine。</desc><rect width="900" height="365" fill="#f5faf7" rx="18"/><text x="35" y="45" fill="#254b50" font-size="23" font-weight="650">05 / Expert parallelism</text><rect x="37" y="86" width="383" height="227" rx="10" fill="#fff" stroke="#bdd5ce" stroke-width="1.5"/><rect x="482" y="86" width="381" height="227" rx="10" fill="#fff" stroke="#bdd5ce" stroke-width="1.5"/><text x="65" y="125" fill="#27786e" font-size="22" font-weight="650">GPU 0</text><text x="510" y="125" fill="#27786e" font-size="22" font-weight="650">GPU 1</text><rect x="85" y="154" width="132" height="66" rx="10" fill="#f7dec9" stroke="#d9aa89" stroke-width="1.5"/><text x="110" y="194" fill="#a85e3c" font-size="17" font-weight="650">Expert 0</text><rect x="236" y="154" width="132" height="66" rx="10" fill="#f7dec9" stroke="#d9aa89" stroke-width="1.5"/><text x="261" y="194" fill="#a85e3c" font-size="17" font-weight="650">Expert 1</text><rect x="528" y="154" width="132" height="66" rx="10" fill="#f7dec9" stroke="#d9aa89" stroke-width="1.5"/><text x="553" y="194" fill="#a85e3c" font-size="17" font-weight="650">Expert 2</text><rect x="679" y="154" width="132" height="66" rx="10" fill="#f7dec9" stroke="#d9aa89" stroke-width="1.5"/><text x="704" y="194" fill="#a85e3c" font-size="17" font-weight="650">Expert 3</text><path d="M416 246L484 246" fill="none" stroke="#538e88" stroke-width="3"/><path d="M484 265L416 265" fill="none" stroke="#c47b58" stroke-width="3"/><text x="415" y="231" fill="#254b50" font-size="13" font-weight="650">dispatch</text><text x="413" y="295" fill="#254b50" font-size="13" font-weight="650">combine</text><text x="49" y="343" fill="#627e79" font-size="15" font-weight="650">All-to-all、微批大小、尾部专家与显存，都会影响端到端时延。</text></svg>
