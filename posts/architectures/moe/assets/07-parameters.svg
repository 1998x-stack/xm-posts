<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 305" role="img" aria-label="八位专家的权重可能都需要存储，但是一枚token只需执行其中两名专家。" font-family="system-ui,'PingFang SC',sans-serif"><title>专家总参数和每token激活参数</title><desc>八位专家的权重可能都需要存储，但是一枚token只需执行其中两名专家。</desc><rect width="900" height="305" fill="#f5faf7" rx="18"/><text x="33" y="46" fill="#254b50" font-size="23" font-weight="650">07 / Parameters stored vs. executed</text><text x="42" y="89" fill="#254b50" font-size="18" font-weight="650">Stored: all N=8 experts</text><rect x="44" y="118" width="88" height="75" rx="10" fill="#deece6" stroke="#bad4c8" stroke-width="1.5"/><text x="67" y="160" fill="#60837b" font-size="20" font-weight="650">E1</text><rect x="150" y="118" width="88" height="75" rx="10" fill="#ffddc3" stroke="#d59f76" stroke-width="1.5"/><text x="173" y="160" fill="#a15c37" font-size="20" font-weight="650">E2</text><rect x="256" y="118" width="88" height="75" rx="10" fill="#deece6" stroke="#bad4c8" stroke-width="1.5"/><text x="279" y="160" fill="#60837b" font-size="20" font-weight="650">E3</text><rect x="362" y="118" width="88" height="75" rx="10" fill="#deece6" stroke="#bad4c8" stroke-width="1.5"/><text x="385" y="160" fill="#60837b" font-size="20" font-weight="650">E4</text><rect x="468" y="118" width="88" height="75" rx="10" fill="#deece6" stroke="#bad4c8" stroke-width="1.5"/><text x="491" y="160" fill="#60837b" font-size="20" font-weight="650">E5</text><rect x="574" y="118" width="88" height="75" rx="10" fill="#deece6" stroke="#bad4c8" stroke-width="1.5"/><text x="597" y="160" fill="#60837b" font-size="20" font-weight="650">E6</text><rect x="680" y="118" width="88" height="75" rx="10" fill="#ffddc3" stroke="#d59f76" stroke-width="1.5"/><text x="703" y="160" fill="#a15c37" font-size="20" font-weight="650">E7</text><rect x="786" y="118" width="88" height="75" rx="10" fill="#deece6" stroke="#bad4c8" stroke-width="1.5"/><text x="809" y="160" fill="#60837b" font-size="20" font-weight="650">E8</text><text x="43" y="235" fill="#267e72" font-size="18" font-weight="650">Active per token: k=2 (orange)</text><text x="43" y="281" fill="#647c75" font-size="14" font-weight="650">主干参数、Router、通信和 KV Cache 不在图中；激活 ≠ 权重只需存两个。</text></svg>
