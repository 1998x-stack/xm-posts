<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="fig-02-title" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" aria-describedby="mha-asset-desc-02"><title id="fig-02-title">缩放点积注意力数据流及掩码位置</title><desc id="mha-asset-desc-02">先根据 Q/K 得到相似度，缩放并可选地加入 Mask，Softmax 后按概率读取 V。 单独查看图示</desc><rect width="900" height="350" rx="16" fill="#f8faf8"/><text x="450" y="37" fill="#294e52" font-size="22" text-anchor="middle" font-weight="600">单头 Attention：打分 → 缩放与掩码 → 归一化 → 读取 Value</text><rect x="40" y="76" width="144" height="55" rx="9" fill="#e6f1fa" stroke="#cbded7" stroke-width="1.6"/><text x="112" y="110" fill="#3978a8" font-size="17" text-anchor="middle" font-weight="600">Q (Query)</text><rect x="40" y="163" width="144" height="55" rx="9" fill="#ffefe1" stroke="#cbded7" stroke-width="1.6"/><text x="112" y="197" fill="#c17c54" font-size="17" text-anchor="middle" font-weight="600">K (Key)</text><rect x="40" y="250" width="144" height="55" rx="9" fill="#e0f4e8" stroke="#cbded7" stroke-width="1.6"/><text x="112" y="284" fill="#168078" font-size="17" text-anchor="middle" font-weight="600">V (Value)</text><rect x="251" y="118" width="160" height="93" rx="9" fill="#fff" stroke="#cbded7" stroke-width="1.6"/><text x="331" y="151" fill="#294e52" font-size="22" text-anchor="middle" font-weight="600">Q × Kᵀ</text><text x="331" y="180" fill="#294e52" font-size="16" text-anchor="middle" font-weight="600">Lq × Lk</text><rect x="475" y="118" width="168" height="93" rx="9" fill="#fff6ea" stroke="#cbded7" stroke-width="1.6"/><text x="559" y="149" fill="#c17c54" font-size="17" text-anchor="middle" font-weight="600">÷ √dk + mask</text><text x="559" y="183" fill="#294e52" font-size="16" text-anchor="middle" font-weight="600">row softmax</text><rect x="705" y="118" width="154" height="93" rx="9" fill="#e5f5ed" stroke="#cbded7" stroke-width="1.6"/><text x="782" y="151" fill="#168078" font-size="23" text-anchor="middle" font-weight="600">A × V</text><text x="782" y="183" fill="#294e52" font-size="16" text-anchor="middle" font-weight="600">Lq × dv</text><path d="M184 103 L251 149" stroke="#3978a8" stroke-width="2" fill="none"/><path d="M184 190 L251 182" stroke="#c17c54" stroke-width="2" fill="none"/><path d="M411 166 L475 166" stroke="#6b9091" stroke-width="2" fill="none"/><path d="M643 166 L705 166" stroke="#6b9091" stroke-width="2" fill="none"/><path d="M184 277 L782 277" stroke="#168078" stroke-width="2" fill="none"/><path d="M782 277 L782 211" stroke="#168078" stroke-width="2" fill="none"/><text x="460" y="330" fill="#617d7d" font-size="15" text-anchor="middle" font-weight="600">V 不参与打分，只在得到注意力权重 A 后参与加权求和</text></svg>
