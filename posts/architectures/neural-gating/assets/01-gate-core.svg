<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-label="内容流 a 与来自输入和状态的门控 g 在逐元素乘法处汇合，得到受门调节的输出" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>门控：内容和系数的逐元素相乘</title><rect width="920" height="330" rx="18" fill="#f7faf7"/><text x="462" y="43" font-size="19" fill="#40636a" text-anchor="middle">门不是一个固定开关，而是依赖当前输入的可学习系数</text><rect x="50" y="99" width="190" height="78" rx="14" fill="#e4f3ef" stroke="#478c83" stroke-width="2"/><text x="145" y="144" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">内容 a = F(x)</text><rect x="50" y="225" width="190" height="68" rx="14" fill="#fff0e3" stroke="#c99167" stroke-width="2"/><text x="145" y="265" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">输入 / 上下文 x</text><rect x="327" y="218" width="232" height="76" rx="14" fill="#fff0e3" stroke="#c99167" stroke-width="2"/><text x="443" y="262" font-size="16" text-anchor="middle" fill="#244c50" font-weight="650">g = sigmoid(Wx+b)</text><path d="M243 257 L321 257" fill="none" stroke="#c58a61" stroke-width="3" stroke-linecap="round"/><path d="M311 251 L321 257 L311 263" fill="none" stroke="#c58a61" stroke-width="2.7" stroke-linejoin="round"/><path d="M440 217 L440 170" fill="none" stroke="#c58a61" stroke-width="3" stroke-linecap="round"/><path d="M430 164 L440 170 L430 176" fill="none" stroke="#c58a61" stroke-width="2.7" stroke-linejoin="round"/><rect x="367" y="96" width="147" height="72" rx="14" fill="#e9e4f7" stroke="#786ca9" stroke-width="2"/><text x="440.5" y="138" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">逐元素 ×</text><path d="M244 138 L359 138" fill="none" stroke="#588984" stroke-width="3" stroke-linecap="round"/><path d="M349 132 L359 138 L349 144" fill="none" stroke="#588984" stroke-width="2.7" stroke-linejoin="round"/><rect x="651" y="96" width="208" height="72" rx="14" fill="#d9eee5" stroke="#478c83" stroke-width="2"/><text x="755" y="138" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">输出 y = g ⊙ a</text><path d="M520 132 L643 132" fill="none" stroke="#588984" stroke-width="3" stroke-linecap="round"/><path d="M633 126 L643 132 L633 138" fill="none" stroke="#588984" stroke-width="2.7" stroke-linejoin="round"/><text x="460" y="316" font-size="15" fill="#40636a" text-anchor="middle">σ 门典型范围 0 到 1；SwiGLU 等变体并不受这个范围限制</text></svg>
