<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-label="展示输入 logits 从负到正，Sigmoid 系数从近零到近一；零处为二分之一" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>Sigmoid 门的连续程度</title><rect width="920" height="330" rx="18" fill="#f7faf7"/><text x="450" y="44" font-size="19" fill="#40636a" text-anchor="middle">由 logit 到系数：连续、可微、可学习</text><path d="M84 255H836 M84 255V74" stroke="#839d98" stroke-width="2.5" fill="none"/><text x="90" y="274" font-size="14" fill="#40636a" text-anchor="middle">−6</text><text x="451" y="274" font-size="14" fill="#40636a" text-anchor="middle">0</text><text x="808" y="274" font-size="14" fill="#40636a" text-anchor="middle">+6</text><text x="62" y="85" font-size="15" fill="#40636a" text-anchor="middle">1</text><text x="62" y="251" font-size="15" fill="#40636a" text-anchor="middle">0</text><path d="M110 248 C220 246 300 238 360 197 S450 167 470 154 S590 84 680 82 S780 79 820 79" stroke="#197e78" stroke-width="5" fill="none"/><path d="M452 80V255" stroke="#c38b64" stroke-width="2" stroke-dasharray="6 5"/><circle cx="452" cy="165" r="7" fill="#b97e50"/><text x="532" y="175" font-size="16" fill="#ad734d" text-anchor="start">σ(0)=0.5</text><text x="210" y="133" font-size="17" fill="#587e79" text-anchor="middle">更偏关闭</text><text x="704" y="133" font-size="17" fill="#587e79" text-anchor="middle">更偏打开</text><text x="457" y="313" font-size="15" fill="#40636a" text-anchor="middle">图形为概念曲线；σ(z)=1/(1+exp(−z))</text></svg>
