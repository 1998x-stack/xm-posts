<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-label="由 H(x) 的变换分支与原始 x 的直通分支通过 T 和 1 减 T 组合" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>Highway 层的保持与更新</title><rect width="920" height="330" rx="18" fill="#f7faf7"/><text x="459" y="43" font-size="19" fill="#40636a" text-anchor="middle">同一个输出，可由“保留旧信息”和“写入新信息”组成</text><rect x="49" y="117" width="144" height="73" rx="14" fill="#e1f2ed" stroke="#478c83" stroke-width="2"/><text x="121" y="159.5" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">输入 x</text><rect x="276" y="65" width="186" height="73" rx="14" fill="#fff0e3" stroke="#c99167" stroke-width="2"/><text x="369" y="107.5" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">H(x) 新表征</text><rect x="276" y="203" width="186" height="73" rx="14" fill="#e1f2ed" stroke="#478c83" stroke-width="2"/><text x="369" y="245.5" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">原样保留 x</text><path d="M199 153 L268 102" fill="none" stroke="#ca8e63" stroke-width="3" stroke-linecap="round"/><path d="M258 96 L268 102 L258 108" fill="none" stroke="#ca8e63" stroke-width="2.7" stroke-linejoin="round"/><path d="M199 153 L268 237" fill="none" stroke="#588984" stroke-width="3" stroke-linecap="round"/><path d="M258 231 L268 237 L258 243" fill="none" stroke="#588984" stroke-width="2.7" stroke-linejoin="round"/><rect x="532" y="66" width="123" height="73" rx="14" fill="#fff0e3" stroke="#c99167" stroke-width="2"/><text x="593.5" y="108.5" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">× T(x)</text><rect x="532" y="203" width="123" height="73" rx="14" fill="#e1f2ed" stroke="#478c83" stroke-width="2"/><text x="593.5" y="245.5" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">× (1−T)</text><path d="M468 102 L524 102" fill="none" stroke="#ca8e63" stroke-width="3" stroke-linecap="round"/><path d="M514 96 L524 102 L514 108" fill="none" stroke="#ca8e63" stroke-width="2.7" stroke-linejoin="round"/><path d="M468 239 L524 239" fill="none" stroke="#588984" stroke-width="3" stroke-linecap="round"/><path d="M514 233 L524 239 L514 245" fill="none" stroke="#588984" stroke-width="2.7" stroke-linejoin="round"/><rect x="733" y="137" width="153" height="70" rx="14" fill="#e8e4f7" stroke="#7569a6" stroke-width="2"/><text x="809.5" y="178" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">加权和 y</text><path d="M662 102 L720 160" fill="none" stroke="#ca8e63" stroke-width="3" stroke-linecap="round"/><path d="M710 154 L720 160 L710 166" fill="none" stroke="#ca8e63" stroke-width="2.7" stroke-linejoin="round"/><path d="M662 237 L720 183" fill="none" stroke="#588984" stroke-width="3" stroke-linecap="round"/><path d="M710 177 L720 183 L710 189" fill="none" stroke="#588984" stroke-width="2.7" stroke-linejoin="round"/><text x="459" y="312" font-size="16" fill="#40636a" text-anchor="middle">T 接近 0：保留输入；T 接近 1：偏向 H(x)</text></svg>
