<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 357" role="img" aria-label="旧状态与候选状态分别按 z 和 1 减 z 加权汇合，更新门控制保持比例" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>GRU 更新门的混合含义</title><rect width="920" height="357" rx="18" fill="#f7faf7"/><text x="459" y="42" font-size="18" fill="#40636a" text-anchor="middle">本图约定 z 越大，保留旧状态越多（实现约定需核对）</text><rect x="55" y="112" width="183" height="78" rx="14" fill="#e1f2ed" stroke="#478c83" stroke-width="2"/><text x="146.5" y="157" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">旧隐藏态 h(t−1)</text><rect x="55" y="233" width="183" height="78" rx="14" fill="#fff0e3" stroke="#c99167" stroke-width="2"/><text x="146.5" y="278" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">候选态 h̃(t)</text><rect x="337" y="110" width="176" height="70" rx="14" fill="#e1f2ed" stroke="#478c83" stroke-width="2"/><text x="425" y="151" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">保留权重 z</text><rect x="337" y="234" width="176" height="70" rx="14" fill="#fff0e3" stroke="#c99167" stroke-width="2"/><text x="425" y="275" font-size="18" text-anchor="middle" fill="#244c50" font-weight="650">更新权重 1−z</text><path d="M244 152 L330 146" fill="none" stroke="#588984" stroke-width="3" stroke-linecap="round"/><path d="M320 140 L330 146 L320 152" fill="none" stroke="#588984" stroke-width="2.7" stroke-linejoin="round"/><path d="M244 273 L330 269" fill="none" stroke="#c58a61" stroke-width="3" stroke-linecap="round"/><path d="M320 263 L330 269 L320 275" fill="none" stroke="#c58a61" stroke-width="2.7" stroke-linejoin="round"/><rect x="650" y="178" width="227" height="76" rx="14" fill="#e8e4f7" stroke="#7569a6" stroke-width="2"/><text x="763.5" y="222" font-size="17" text-anchor="middle" fill="#244c50" font-weight="650">输出 h(t) = 加权和</text><path d="M520 148 L642 208" fill="none" stroke="#588984" stroke-width="3" stroke-linecap="round"/><path d="M632 202 L642 208 L632 214" fill="none" stroke="#588984" stroke-width="2.7" stroke-linejoin="round"/><path d="M520 270 L642 231" fill="none" stroke="#c58a61" stroke-width="3" stroke-linecap="round"/><path d="M632 225 L642 231 L632 237" fill="none" stroke="#c58a61" stroke-width="2.7" stroke-linejoin="round"/><text x="459" y="330" font-size="16" fill="#40636a" text-anchor="middle">reset gate r 只参与候选态计算；z 决定旧态与新态的混合</text></svg>
