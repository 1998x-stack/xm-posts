<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Post-LN 对残差和归一化；Pre-LN 先对分支输入归一化，然后再与未改变的跳连相加。" viewBox="0 0 960 380"><title>相同的残差算子，不同的归一化顺序</title><desc>Post-LN 对残差和归一化；Pre-LN 先对分支输入归一化，然后再与未改变的跳连相加。</desc><rect width="960" height="380" rx="18" fill="#fbfdfb"/>
