<text x="47" y="366" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#3a585f" font-weight="650">y = LN(x + F(x))</text><text x="515" y="366" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#3a585f" font-weight="650">y = x + F(LN(x))</text>
