<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="对于每个 token 的 d 个特征计算均值和方差，并按特征应用缩放与偏置。" viewBox="0 0 960 380"><title>LayerNorm 沿隐藏维工作</title><desc>对于每个 token 的 d 个特征计算均值和方差，并按特征应用缩放与偏置。</desc><rect width="960" height="380" rx="18" fill="#fbfdfb"/>
<text x="38" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" fill="#30555d" font-weight="750">一个 token 的隐藏状态（d = 4）</text>
<rect x="38" y="79" width="150" height="76" rx="12" fill="#ebf3f6" stroke="#cbded9" stroke-width="2"/><text x="71" y="126" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#294954" font-weight="500">[1, 2, 3, 6]</text>
<path d="M189 117L273 117" fill="none" stroke="#72969a" stroke-width="3" stroke-linecap="round" /><rect x="273" y="79" width="182" height="76" rx="12" fill="#e8f4ea" stroke="#cbded9" stroke-width="2"/><text x="292" y="109" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#294954" font-weight="500">mean = 3</text><text x="292" y="137" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#294954" font-weight="500">var = 3.5</text>
<path d="M455 117L531 117" fill="none" stroke="#72969a" stroke-width="3" stroke-linecap="round" /><rect x="531" y="67" width="383" height="105" rx="12" fill="#e5f1f0" stroke="#cbded9" stroke-width="2"/><text x="552" y="100" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#1d6971" font-weight="740">(xᵢ − μ) / √(σ² + ε)</text><text x="555" y="141" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#294954" font-weight="500">再乘 γᵢ、加 βᵢ（逐特征）</text>
<path d="M75 213L892 213" fill="none" stroke="#dee8e5" stroke-width="2" stroke-linecap="round" />
<text x="39" y="256" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#809697" font-weight="650">Batch</text><text x="242" y="256" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#809697" font-weight="650">Sequence</text><text x="502" y="256" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#27767d" font-weight="760">Hidden features</text>
<rect x="38" y="280" width="150" height="55" rx="12" fill="#f1f4f3" stroke="#cbded9" stroke-width="2"/><rect x="224" y="280" width="212" height="55" rx="12" fill="#f1f4f3" stroke="#cbded9" stroke-width="2"/><rect x="472" y="280" width="439" height="55" rx="12" fill="#dcefed" stroke="#9acbc3" stroke-width="2"/>
<text x="86" y="314" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#294954" font-weight="500">B</text><text x="324" y="314" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#294954" font-weight="500">T</text><text x="664" y="314" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" fill="#176f70" font-weight="800">D</text>
<text x="38" y="371" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#294954" font-weight="500">标准 LayerNorm：每个 (b, t) 位置在 D 维上归一化；不是跨样本 BatchNorm。</text>
</svg>