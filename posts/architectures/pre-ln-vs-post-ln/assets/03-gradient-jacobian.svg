<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pre-LN 的块内含显式恒等导数项；Post-LN 的块输出经过归一化雅可比。" viewBox="0 0 960 380"><title>残差快捷通路与雅可比因子</title><desc>Pre-LN 的块内含显式恒等导数项；Post-LN 的块输出经过归一化雅可比。</desc><rect width="960" height="380" rx="18" fill="#fbfdfb"/>
<text x="40" y="48" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" fill="#187a7c" font-weight="750">PRE-LN：恒等项直接加入</text><text x="505" y="48" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" fill="#a96643" font-weight="750">POST-LN：出口必经 LN</text>
<path d="M474 24L474 349" fill="none" stroke="#dde9e6" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8"/>
<rect x="42" y="86" width="395" height="65" rx="12" fill="#e5f3ee" stroke="#cbded9" stroke-width="2"/><text x="66" y="125" font-family="system-ui,'PingFang SC',sans-serif" font-size="26" fill="#1f7474" font-weight="750">J = I + JF · JLN</text>
<rect x="43" y="185" width="166" height="62" rx="12" fill="#e7f0f5" stroke="#cbded9" stroke-width="2"/><text x="76" y="224" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#2d7088" font-weight="740">identity I</text>
<rect x="265" y="185" width="173" height="62" rx="12" fill="#fff0e5" stroke="#cbded9" stroke-width="2"/><text x="291" y="224" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#a96541" font-weight="740">branch JF</text>
<path d="M209 216L263 216" fill="none" stroke="#72969a" stroke-width="3" stroke-linecap="round" /><text x="42" y="284" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#294954" font-weight="500">注意：这不等于总梯度永不衰减。</text>
<rect x="509" y="86" width="409" height="65" rx="12" fill="#fff0e5" stroke="#cbded9" stroke-width="2"/><text x="529" y="125" font-family="system-ui,'PingFang SC',sans-serif" font-size="26" fill="#a96541" font-weight="750">J = JLN · (I + JF)</text>
<rect x="510" y="185" width="183" height="62" rx="12" fill="#e9f2f5" stroke="#cbded9" stroke-width="2"/><text x="531" y="223" font-family="system-ui,'PingFang SC',sans-serif" font-size="25" fill="#315f72" font-weight="750">I + JF</text>
<rect x="742" y="185" width="176" height="62" rx="12" fill="#e5f3ee" stroke="#cbded9" stroke-width="2"/><text x="774" y="224" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" fill="#2b806d" font-weight="750">JLN</text>
<path d="M693 216L742 216" fill="none" stroke="#72969a" stroke-width="3" stroke-linecap="round" />
<text x="509" y="284" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#294954" font-weight="500">LayerNorm 的 Jacobian 在求导链上。</text>
<text x="43" y="348" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#698185" font-weight="500">两式均为单个子层的局部链式法则；多层乘积、参数梯度和优化器行为需另行分析。</text>
</svg>