<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="比较 Pre-LN、Post-LN、DeepNorm、Peri-LN 的残差支路和归一化位置。" viewBox="0 0 960 380"><title>规范化策略的演进</title><desc>比较 Pre-LN、Post-LN、DeepNorm、Peri-LN 的残差支路和归一化位置。</desc><rect width="960" height="380" rx="18" fill="#fbfdfb"/>
<text x="38" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" fill="#32535a" font-weight="750">归一化是架构设计变量，不是二选一的永久结论</text>
<rect x="38" y="78" width="180" height="219" rx="12" fill="#ffffff" stroke="#d8e6e2" stroke-width="2"/><rect x="274" y="78" width="180" height="219" rx="12" fill="#ffffff" stroke="#d8e6e2" stroke-width="2"/><rect x="510" y="78" width="180" height="219" rx="12" fill="#ffffff" stroke="#d8e6e2" stroke-width="2"/><rect x="746" y="78" width="180" height="219" rx="12" fill="#ffffff" stroke="#d8e6e2" stroke-width="2"/>
<text x="66" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#b36c49" font-weight="750">Post-LN</text><text x="302" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#1d7b80" font-weight="750">Pre-LN</text>
<text x="538" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#76649c" font-weight="750">DeepNorm</text><text x="774" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#2e7e72" font-weight="750">Peri-LN</text>
<text x="57" y="162" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#294954" font-weight="500">LN(x + F(x))</text><text x="289" y="162" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#294954" font-weight="500">x + F(LN(x))</text>
<text x="524" y="162" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#294954" font-weight="500">LN(αx + F(x))</text><text x="760" y="162" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#294954" font-weight="500">分支前后归一化</text>
<text x="57" y="208" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#668086" font-weight="500">原始 Transformer</text><text x="289" y="208" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#668086" font-weight="500">现代常见选项</text>
<text x="524" y="208" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#668086" font-weight="500">残差增益与初始化</text><text x="760" y="208" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#668086" font-weight="500">Peri-LN (2025)</text>
<text x="56" y="263" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#91a2a2" font-weight="500">Vaswani 2017</text><text x="289" y="263" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#91a2a2" font-weight="500">Xiong 2020</text>
<text x="524" y="263" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#91a2a2" font-weight="500">Wang 2022</text><text x="760" y="263" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#91a2a2" font-weight="500">Kim 2025</text>
<text x="42" y="344" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#4c6f74" font-weight="500">策略还包括 RMSNorm、缩放与初始化；“归一化函数”和“归一化位置”是两个不同轴。</text>
</svg>