<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="750" height="214" viewBox="0 0 750 214" role="img" aria-label="左侧传统网络从输入直接学习完整输出，右侧残差网络保留原输入加上学习到的修改量"><style>
.svg-label{font-family:"Noto Sans CJK SC",sans-serif;fill:#26474c;font-size:16px}
