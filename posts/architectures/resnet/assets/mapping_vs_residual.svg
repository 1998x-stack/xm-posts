</style><rect width="100%" height="100%" fill="#fff"/><rect x="11" y="24" width="354" height="163" rx="15" fill="#fff7f1" stroke="#efcfb4"/><rect x="386" y="24" width="354" height="163" rx="15" fill="#edfaf5" stroke="#aad9cd"/><text x="189" y="52" class="svg-title" text-anchor="middle">传统：重新完成整个映射</text><text x="561" y="52" class="svg-title" text-anchor="middle">残差：保留输入 + 学习修改</text><rect x="36" y="91" width="88" height="49" rx="8" class="svg-teal"/><text x="80" y="120" text-anchor="middle" class="svg-label">输入 x</text><path d="M124 115H163" stroke="#c17d4c" stroke-width="3"/><path d="M156 110L164 115L156 120" fill="none" stroke="#c17d4c" stroke-width="3"/><rect x="165" y="88" width="96" height="55" rx="8" class="svg-block"/><text x="213" y="111" text-anchor="middle" class="svg-small">学习完整</text><text x="213" y="129" text-anchor="middle" class="svg-small">映射</text><path d="M261 115H282" stroke="#c17d4c" stroke-width="3"/><rect x="283" y="91" width="62" height="49" rx="8" class="svg-teal"/><text x="314" y="120" text-anchor="middle" class="svg-label">H(x)</text><rect x="403" y="91" width="78" height="49" rx="8" class="svg-teal"/><text x="442" y="120" text-anchor="middle" class="svg-label">x</text><path d="M481 115H549" stroke="#169d98" stroke-width="4"/><rect x="496" y="71" width="97" height="35" rx="7" class="svg-block"/><text x="544" y="93" text-anchor="middle" class="svg-small">修正 F(x)</text><path d="M545 106V115" stroke="#d88460" stroke-width="3"/><circle cx="612" cy="115" r="18" fill="#e1f5ee" stroke="#169d98" stroke-width="2"/><text x="612" y="121" font-family="Noto Sans CJK SC" font-size="24" fill="#188b88" text-anchor="middle">+</text><path d="M549 115H594M630 115H651" stroke="#169d98" stroke-width="3"/><rect x="651" y="91" width="71" height="49" rx="8" class="svg-teal"/><text x="687" y="120" text-anchor="middle" class="svg-label">H(x)</text><text x="561" y="166" class="svg-small" text-anchor="middle">当 F(x) ≈ 0，输出近似输入</text></svg>