<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" id="step-diagram" viewBox="0 0 760 368" role="img" aria-label="交互残差块示意图：输入x向上经过Conv、BN、ReLU、Conv、BN，向下经恒等捷径，到加法节点汇合后经ReLU输出"><style>
.svg-label{font-family:"Noto Sans CJK SC",sans-serif;fill:#26474c;font-size:16px}
.svg-small{font-family:"Noto Sans CJK SC",sans-serif;fill:#577476;font-size:12px}
.svg-title{font-family:"Noto Sans CJK SC",sans-serif;fill:#194e50;font-size:17px;font-weight:700}
.svg-line{stroke:#527478;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.svg-skip{stroke:#159d9d;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.svg-block{fill:#fff2df;stroke:#e3b375;stroke-width:1.5}
.svg-teal{fill:#e2f5ef;stroke:#86ccc0;stroke-width:1.5}
.svg-violet{fill:#ece9fa;stroke:#b2a8e1;stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arr-step" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526f72"/></marker></defs><g data-part="base"><rect x="18" y="145" width="91" height="52" rx="9" class="svg-teal"/><text x="63" y="175" class="svg-title" text-anchor="middle">输入 x</text><path d="M109 171H160" class="svg-line" marker-end="url(#arr-step)"/><circle cx="163" cy="171" r="6" fill="#3d7577"/></g><g data-part="residual"><path d="M163 171V82H225" stroke="#d78c58" stroke-width="3.7" fill="none"/><rect x="224" y="56" width="126" height="53" rx="9" class="svg-block"/><text x="287" y="77" class="svg-label" text-anchor="middle">Conv 3×3</text><text x="287" y="96" class="svg-small" text-anchor="middle">BN + ReLU</text><path d="M350 82H389" class="svg-line"/><rect x="389" y="56" width="126" height="53" rx="9" class="svg-block"/><text x="452" y="77" class="svg-label" text-anchor="middle">Conv 3×3</text><text x="452" y="96" class="svg-small" text-anchor="middle">BN</text><path d="M515 82H608V159" stroke="#d78c58" stroke-width="3.7" fill="none"/><text x="416" y="38" class="svg-small" text-anchor="middle">残差分支：F(x)</text></g><g data-part="identity"><path d="M163 171V254H608V186" class="svg-skip"/><text x="377" y="283" class="svg-label" text-anchor="middle" fill="#148f93">Shortcut：直接传递 x</text><text x="377" y="306" class="svg-small" text-anchor="middle">相同形状时没有额外参数</text></g><g data-part="merge"><circle cx="608" cy="171" r="23" fill="#e6f7f1" stroke="#128b8d" stroke-width="3"/><path d="M595 171H621M608 158V184" stroke="#128b8d" stroke-width="3"/><path d="M631 171H650" class="svg-line"/><rect x="650" y="144" width="83" height="55" rx="8" class="svg-violet"/><text x="692" y="166" class="svg-label" text-anchor="middle">ReLU</text><text x="692" y="184" class="svg-small" text-anchor="middle">输出</text><text x="608" y="214" class="svg-small" text-anchor="middle">相加</text></g><g data-part="gradient"><path d="M596 329C475 354 263 345 174 329" fill="none" stroke="#8977ca" stroke-width="2.8" stroke-dasharray="8 7"/><text x="383" y="357" class="svg-small" text-anchor="middle" fill="#7865b3">反向传播：直达路径 + 学习路径的贡献</text></g></svg>