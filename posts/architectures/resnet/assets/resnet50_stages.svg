<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="291" viewBox="0 0 760 291" role="img" aria-label="ResNet-50网络结构从输入224方形经过stem、四个stage，块数3、4、6、3，空间尺寸56、28、14、7，最后全局平均池化和1000类全连接"><style>
.svg-label{font-family:"Noto Sans CJK SC",sans-serif;fill:#26474c;font-size:16px}
.svg-small{font-family:"Noto Sans CJK SC",sans-serif;fill:#577476;font-size:12px}
.svg-title{font-family:"Noto Sans CJK SC",sans-serif;fill:#194e50;font-size:17px;font-weight:700}
.svg-line{stroke:#527478;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.svg-skip{stroke:#159d9d;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.svg-block{fill:#fff2df;stroke:#e3b375;stroke-width:1.5}
.svg-teal{fill:#e2f5ef;stroke:#86ccc0;stroke-width:1.5}
.svg-violet{fill:#ece9fa;stroke:#b2a8e1;stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ar-stg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#587477"/></marker></defs><g stroke="#587477" stroke-width="2.7" fill="none" marker-end="url(#ar-stg)"><path d="M76 143H108M183 143H205M311 143H333M438 143H460M565 143H587M692 143H713"/></g><rect x="4" y="110" width="72" height="66" rx="10" class="svg-teal"/><text x="40" y="137" text-anchor="middle" class="svg-label" style="font-size:13px">输入</text><text x="40" y="157" text-anchor="middle" class="svg-small">224²×3</text><rect x="108" y="97" width="75" height="92" rx="10" class="svg-violet"/><text x="146" y="125" text-anchor="middle" class="svg-label" style="font-size:13px">Stem</text><text x="146" y="147" text-anchor="middle" class="svg-small">7×7 Conv</text><text x="146" y="166" text-anchor="middle" class="svg-small">MaxPool</text><rect x="205" y="83" width="106" height="120" rx="12" fill="#e7f6ee" stroke="#74bda6"/><text x="258" y="109" text-anchor="middle" class="svg-title">Stage 2</text><text x="258" y="137" text-anchor="middle" class="svg-label">×3</text><text x="258" y="164" text-anchor="middle" class="svg-small">56×56</text><text x="258" y="186" text-anchor="middle" class="svg-small">256 ch</text><rect x="333" y="67" width="105" height="136" rx="12" fill="#e6f3f0" stroke="#77b4aa"/><text x="385" y="93" text-anchor="middle" class="svg-title">Stage 3</text><text x="385" y="121" text-anchor="middle" class="svg-label">×4</text><text x="385" y="164" text-anchor="middle" class="svg-small">28×28</text><text x="385" y="186" text-anchor="middle" class="svg-small">512 ch</text><rect x="460" y="43" width="105" height="160" rx="12" fill="#d4eae9" stroke="#6ba7ae"/><text x="512" y="72" text-anchor="middle" class="svg-title">Stage 4</text><text x="512" y="102" text-anchor="middle" class="svg-label">×6</text><text x="512" y="164" text-anchor="middle" class="svg-small">14×14</text><text x="512" y="186" text-anchor="middle" class="svg-small">1024 ch</text><rect x="587" y="25" width="105" height="178" rx="12" fill="#c9e6e6" stroke="#548e9e"/><text x="640" y="57" text-anchor="middle" class="svg-title">Stage 5</text><text x="640" y="86" text-anchor="middle" class="svg-label">×3</text><text x="640" y="164" text-anchor="middle" class="svg-small">7×7</text><text x="640" y="186" text-anchor="middle" class="svg-small">2048 ch</text><rect x="713" y="110" width="43" height="66" rx="8" class="svg-violet"/><text x="734" y="136" font-size="11" text-anchor="middle" fill="#4c4d79">GAP</text><text x="734" y="155" font-size="11" text-anchor="middle" fill="#4c4d79">FC</text><text x="380" y="251" text-anchor="middle" class="svg-title">1 (stem) + 3 × (3 + 4 + 6 + 3) + 1 (FC) = 50</text><text x="380" y="274" text-anchor="middle" class="svg-small">每个 Bottleneck 包含 3 个卷积；通常不把 BN、ReLU、pooling 单独计入“50 层”</text></svg>