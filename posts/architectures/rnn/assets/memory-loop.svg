<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 265" role="img" aria-label="x_t 与上一状态 h_{t-1} 进入同一个更新模块，产生 h_t 和输出 y_t，状态向下一时刻传播"><title>RNN 每一步如何更新状态</title><rect width="800" height="265" rx="18" fill="#f8fbf9"/><rect x="24" y="93" width="115" height="78" rx="13" fill="#fff0e1" stroke="#bdd5cd" stroke-width="2"/><text x="82" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">当前输入</text><text x="82" y="151" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#284c50" font-weight="650">xₜ</text><rect x="24" y="8" width="115" height="67" rx="13" fill="#efe9f8" stroke="#c4aed9" stroke-width="2"/><text x="82" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">上一状态</text><text x="82" y="61" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#284c50" font-weight="650">hₜ₋₁</text><rect x="215" y="63" width="213" height="105" rx="13" fill="#fff5e9" stroke="#e5c6a4" stroke-width="2"/><text x="321" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">融合两路信息</text><text x="321" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#284c50" font-weight="650">Wₓₕxₜ + Wₕₕhₜ₋₁</text><text x="321" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#284c50" font-weight="650">tanh</text><rect x="499" y="77" width="126" height="78" rx="13" fill="#e0f5ec" stroke="#9bcdbc" stroke-width="2"/><text x="562" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">新状态</text><text x="562" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#284c50" font-weight="650">hₜ</text><rect x="678" y="77" width="103" height="78" rx="13" fill="#e9effe" stroke="#b6c6e8" stroke-width="2"/><text x="730" y="109" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">输出</text><text x="730" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#284c50" font-weight="650">yₜ</text><line x1="139" y1="130" x2="211" y2="130" stroke="#49827d" stroke-width="3"/><path d="M 201 123 L 211 130 L 201 137" fill="none" stroke="#49827d" stroke-width="3"/><line x1="139" y1="42" x2="181" y2="42" stroke="#9b7ac0" stroke-width="3"/><line x1="181" y1="42" x2="181" y2="94" stroke="#9b7ac0" stroke-width="3"/><line x1="181" y1="94" x2="211" y2="94" stroke="#9b7ac0" stroke-width="3"/><path d="M 201 87 L 211 94 L 201 101" fill="none" stroke="#9b7ac0" stroke-width="3"/><line x1="428" y1="115" x2="495" y2="115" stroke="#49827d" stroke-width="3"/><path d="M 485 108 L 495 115 L 485 122" fill="none" stroke="#49827d" stroke-width="3"/><line x1="625" y1="115" x2="675" y2="115" stroke="#49827d" stroke-width="3"/><path d="M 665 108 L 675 115 L 665 122" fill="none" stroke="#49827d" stroke-width="3"/><path d="M562 155 V204 H82 V77" stroke="#1f978b" stroke-width="3" fill="none"/><text x="415" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#3c7771" font-weight="650">下一个时间步继续复用同一组参数</text></svg>