<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 235" role="img" aria-label="两位随机输入后，第三位是前两位异或，因此只在第三位预测有确定性"><title>时序 XOR 的预测位置</title><rect width="846" height="235" rx="18" fill="#f8fbf9"/><rect x="25" y="57" width="111" height="105" rx="13" fill="#fff1e4" stroke="#ecc8a5" stroke-width="2"/><text x="80" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">a</text><text x="80" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" fill="#284c50" font-weight="650">1</text><text x="80" y="187" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#a26946" font-weight="650">不确定</text><rect x="161" y="57" width="111" height="105" rx="13" fill="#fff1e4" stroke="#ecc8a5" stroke-width="2"/><text x="216" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">b</text><text x="216" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" fill="#284c50" font-weight="650">0</text><text x="216" y="187" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#a26946" font-weight="650">不确定</text><rect x="297" y="57" width="111" height="105" rx="13" fill="#dff5ec" stroke="#88c9b6" stroke-width="2"/><text x="352" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">a ⊕ b</text><text x="352" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" fill="#284c50" font-weight="650">1</text><text x="352" y="187" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#278779" font-weight="650">可预测</text><rect x="433" y="57" width="111" height="105" rx="13" fill="#fff1e4" stroke="#ecc8a5" stroke-width="2"/><text x="488" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">c</text><text x="488" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" fill="#284c50" font-weight="650">0</text><text x="488" y="187" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#a26946" font-weight="650">不确定</text><rect x="569" y="57" width="111" height="105" rx="13" fill="#fff1e4" stroke="#ecc8a5" stroke-width="2"/><text x="624" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">d</text><text x="624" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" fill="#284c50" font-weight="650">1</text><text x="624" y="187" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#a26946" font-weight="650">不确定</text><rect x="705" y="57" width="111" height="105" rx="13" fill="#dff5ec" stroke="#88c9b6" stroke-width="2"/><text x="760" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#284c50" font-weight="650">c ⊕ d</text><text x="760" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" fill="#284c50" font-weight="650">1</text><text x="760" y="187" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#278779" font-weight="650">可预测</text><text x="419" y="31" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#284c50" font-weight="650">每三位为一个 XOR 结构（说明性输入）</text><text x="420" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#668285" font-weight="650">示意，不是原论文的测量曲线</text></svg>