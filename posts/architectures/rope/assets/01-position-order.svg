<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="未加入位置时，内容相同的两个 token 顺序交换，会相应置换自注意力输出" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>只看内容无法独立标记绝对位置</title><rect width="760" height="290" rx="12" fill="#f7faf7"/><text x="30" y="36" fill="#35565b" font-size="17" font-weight="700">输入序列 A</text><text x="393" y="36" fill="#35565b" font-size="17" font-weight="700">交换位置后</text><rect x="36" y="70" width="114" height="70" rx="10" fill="#daf0ec" stroke="#4a9995"/><rect x="169" y="70" width="114" height="70" rx="10" fill="#fff0e5" stroke="#c98458"/><rect x="399" y="70" width="114" height="70" rx="10" fill="#fff0e5" stroke="#c98458"/><rect x="532" y="70" width="114" height="70" rx="10" fill="#daf0ec" stroke="#4a9995"/><g fill="#2c555a" font-size="17" text-anchor="middle"><text x="93" y="110">猫</text><text x="226" y="110">追</text><text x="456" y="110">追</text><text x="589" y="110">猫</text></g><path d="M283 104 H394" stroke="#718e8f" stroke-width="2.5" stroke-dasharray="6 7"/><path d="M385 97 l9 7 -9 7" fill="none" stroke="#718e8f" stroke-width="2.5"/><path d="M93 142 V182 M226 142 V182 M456 142 V182 M589 142 V182" stroke="#80979a" stroke-width="2"/><rect x="35" y="184" width="250" height="48" rx="9" fill="#e4ecef"/><rect x="398" y="184" width="250" height="48" rx="9" fill="#e4ecef"/><g font-size="15" fill="#34555b" text-anchor="middle"><text x="160" y="213">Self-Attention（不含位置项）</text><text x="523" y="213">输出也随 token 置换</text></g><text x="380" y="270" text-anchor="middle" font-size="13" fill="#637a7d">此图讨论没有位置编码且没有顺序相关 Mask 的 Self-Attention；因果 Mask 会改变这一结论的前提。</text></svg>