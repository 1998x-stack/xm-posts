<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" role="img" aria-label="两组查询键位置分别为 2 与 5、8 与 11，间距相同所以相对旋转相同" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>绝对位置变化而相对位移保持不变</title><rect width="760" height="286" rx="12" fill="#f7faf7"/><g fill="#2e5358" font-size="16"><text x="30" y="56" font-weight="700">第一组</text><text x="30" y="171" font-weight="700">整体右移 +6</text></g><path d="M150 75 H701 M150 190 H701" stroke="#afc2c0" stroke-width="2"/><g font-size="13" fill="#839596" text-anchor="middle"><text x="210" y="99">2</text><text x="360" y="99">5</text><text x="474" y="214">8</text><text x="624" y="214">11</text></g><circle cx="210" cy="75" r="16" fill="#278b86"/><circle cx="360" cy="75" r="16" fill="#d38154"/><circle cx="474" cy="190" r="16" fill="#278b86"/><circle cx="624" cy="190" r="16" fill="#d38154"/><g font-size="12" fill="white" font-weight="700" text-anchor="middle"><text x="210" y="79">Q</text><text x="360" y="79">K</text><text x="474" y="194">Q</text><text x="624" y="194">K</text></g><path d="M230 60 Q285 22 340 60 M494 175 Q549 137 604 175" fill="none" stroke="#7e72b1" stroke-width="2.5"/><g font-size="17" fill="#6658a0" font-weight="700" text-anchor="middle"><text x="285" y="30">Δ = 3</text><text x="549" y="144">Δ = 3</text></g><text x="380" y="266" fill="#516c70" text-anchor="middle" font-size="15">在相同 q、k 内容与频率下，RoPE 打分只依赖 n−m（这里都是 +3）。</text></svg>