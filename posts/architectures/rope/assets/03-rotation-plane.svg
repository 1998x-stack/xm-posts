<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="二维向量在不同位置按 m 乘 theta 旋转，长度不变" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>RoPE 的最小单元：二维平面中的旋转</title><rect width="760" height="320" rx="12" fill="#f7faf7"/><circle cx="250" cy="160" r="103" fill="none" stroke="#dce5e2" stroke-width="2"/><path d="M95 160 H410 M250 287 V31" stroke="#aebfbe" stroke-width="1.5"/><path d="M250 160 L345 119" stroke="#228782" stroke-width="5" stroke-linecap="round"/><path d="M250 160 L278 61" stroke="#d68157" stroke-width="5" stroke-linecap="round"/><path d="M250 160 L177 87" stroke="#7769b5" stroke-width="5" stroke-linecap="round"/><path d="M250 160 L325 83" fill="none" stroke="#c5d1ca" stroke-width="1.3" stroke-dasharray="5 5"/><path d="M285 145 Q295 117 282 96" fill="none" stroke="#cc9561" stroke-width="2.5"/><text x="337" y="106" font-size="14" fill="#1c7975">m=0</text><text x="284" y="46" font-size="14" fill="#b66e47">m=1</text><text x="119" y="77" font-size="14" fill="#6c60a8">m=2</text><text x="307" y="127" font-size="14" fill="#b66e47">θ</text><text x="456" y="91" fill="#2e5055" font-size="22" font-weight="700">每个位置的角度</text><text x="456" y="137" fill="#228782" font-size="23">φ(m) = m · θ</text><text x="456" y="190" fill="#526e71" font-size="16">向量模长不变</text><text x="456" y="222" fill="#526e71" font-size="16">方向随位置发生旋转</text><text x="456" y="264" fill="#617b7d" font-size="13">示意角度，不代表任一模型真实 θ</text></svg>