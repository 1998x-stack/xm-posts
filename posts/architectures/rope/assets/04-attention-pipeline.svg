<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="RoPE 仅施加于 query 与 key，在注意力 softmax 前计算；value 不旋转" font-family="system-ui,-apple-system,'PingFang SC',sans-serif"><title>Attention 中 RoPE 的插入位置</title><rect width="760" height="310" rx="12" fill="#f7faf7"/><rect x="40" y="38" width="150" height="55" rx="10" fill="#eaf1f3" stroke="#b7cbd0"/><text x="115" y="70" fill="#39575c" font-size="16" font-weight="700" text-anchor="middle">x ∈ ℝᵈ</text><path d="M190 65 H224 M223 65 V245" fill="none" stroke="#92a6a7" stroke-width="2"/><g font-size="16" text-anchor="middle" font-weight="700"><rect x="248" y="27" width="108" height="48" rx="9" fill="#d9f1eb"/><text x="302" y="56" fill="#1d726c">Wq → Q</text><rect x="248" y="109" width="108" height="48" rx="9" fill="#feecde"/><text x="302" y="139" fill="#a7643d">Wk → K</text><rect x="248" y="191" width="108" height="48" rx="9" fill="#eeebfa"/><text x="302" y="220" fill="#695fa2">Wv → V</text></g><path d="M223 51 H247 M223 133 H247 M223 215 H247" stroke="#92a6a7" stroke-width="2"/><rect x="405" y="27" width="122" height="48" rx="9" fill="#d9f1eb" stroke="#259188"/><rect x="405" y="109" width="122" height="48" rx="9" fill="#feecde" stroke="#cd7e51"/><g font-size="16" text-anchor="middle" font-weight="700"><text x="466" y="56" fill="#1d726c">RoPE(Q,m)</text><text x="466" y="139" fill="#a7643d">RoPE(K,n)</text></g><path d="M356 51 H405 M356 133 H405" stroke="#92a6a7" stroke-width="2.3"/><rect x="566" y="76" width="156" height="75" rx="10" fill="#eaf0f1" stroke="#a9bcbf"/><text x="644" y="105" text-anchor="middle" fill="#34565a" font-size="16" font-weight="700">Q′K′ᵀ / √dₖ</text><text x="644" y="132" text-anchor="middle" fill="#607b7d" font-size="14">Mask → softmax</text><path d="M527 51 H546 V96 H566 M527 133 H566" stroke="#92a6a7" stroke-width="2.3" fill="none"/><path d="M356 215 H648 V153" fill="none" stroke="#7d6db5" stroke-width="3"/><text x="445" y="205" fill="#7466a6" font-size="14">V 直达加权聚合</text><rect x="567" y="227" width="155" height="48" rx="9" fill="#f2f4ec" stroke="#c0cdb7"/><text x="645" y="257" fill="#38575c" font-size="16" text-anchor="middle" font-weight="700">Attention 输出</text><path d="M644 151 V227" stroke="#92a6a7" stroke-width="2"/><text x="31" y="287" font-size="13" fill="#5b7578">每个 head 的 Q/K 最后维度必须与旋转维度兼容；实际实现可能只旋转部分维度。</text></svg>