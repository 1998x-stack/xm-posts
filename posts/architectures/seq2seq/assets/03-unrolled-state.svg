<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 314" width="780" height="314" role="img" aria-label="编码器的 h_t 和 s_t 随时间更新，最终状态用于初始化解码器；LSTM 细节折叠为状态块" font-family="system-ui,-apple-system,'PingFang SC','Microsoft Yahei',sans-serif"><title>时序状态如何流动</title><desc>编码器的 h_t 和 s_t 随时间更新，最终状态用于初始化解码器；LSTM 细节折叠为状态块</desc><rect width="780" height="314" rx="16" fill="#f7faf8"/><text x="30" y="38" fill="#237e7b" font-size="17" text-anchor="start" font-weight="700">读入源序列（LSTM 状态持续更新）</text><rect x="33" y="112" width="143" height="82" rx="12" fill="#e1f2ed" stroke="#6caaa4" stroke-width="1.8"/><text x="104" y="144" fill="#294c55" font-size="18" text-anchor="middle" font-weight="500">state₁</text><text x="104" y="173" fill="#526e75" font-size="14" text-anchor="middle" font-weight="500">f(x₁, s₀)</text><path d="M177 152 L208 152" fill="none" stroke="#69848b" stroke-width="2" /><path d="M 208 152 L 197 146.6 L 197 157.4 Z" fill="#69848b"/><rect x="210" y="112" width="143" height="82" rx="12" fill="#e1f2ed" stroke="#6caaa4" stroke-width="1.8"/><text x="281" y="144" fill="#294c55" font-size="18" text-anchor="middle" font-weight="500">state₂</text><text x="281" y="173" fill="#526e75" font-size="14" text-anchor="middle" font-weight="500">f(x₂, s₁)</text><path d="M354 152 L385 152" fill="none" stroke="#69848b" stroke-width="2" /><path d="M 385 152 L 374 146.6 L 374 157.4 Z" fill="#69848b"/><rect x="387" y="112" width="143" height="82" rx="12" fill="#e1f2ed" stroke="#6caaa4" stroke-width="1.8"/><text x="458" y="144" fill="#294c55" font-size="18" text-anchor="middle" font-weight="500">state₃</text><text x="458" y="173" fill="#526e75" font-size="14" text-anchor="middle" font-weight="500">f(x₃, s₂)</text><path d="M531 152 L562 152" fill="none" stroke="#69848b" stroke-width="2" /><path d="M 562 152 L 551 146.6 L 551 157.4 Z" fill="#69848b"/><rect x="564" y="112" width="143" height="82" rx="12" fill="#eae3f5" stroke="#9d82bd" stroke-width="1.8"/><text x="635" y="144" fill="#294c55" font-size="18" text-anchor="middle" font-weight="500">state_T</text><text x="635" y="173" fill="#526e75" font-size="14" text-anchor="middle" font-weight="500">c = g(s_T)</text><path d="M104 82 L104 109" fill="none" stroke="#318980" stroke-width="2" /><path d="M 104 109 L 109.4 98 L 98.6 98 Z" fill="#318980"/><text x="104" y="71" fill="#294c55" font-size="16" text-anchor="middle" font-weight="500">x₁</text><path d="M281 82 L281 109" fill="none" stroke="#318980" stroke-width="2" /><path d="M 281 109 L 286.4 98 L 275.6 98 Z" fill="#318980"/><text x="281" y="71" fill="#294c55" font-size="16" text-anchor="middle" font-weight="500">x₂</text><path d="M458 82 L458 109" fill="none" stroke="#318980" stroke-width="2" /><path d="M 458 109 L 463.4 98 L 452.6 98 Z" fill="#318980"/><text x="458" y="71" fill="#294c55" font-size="16" text-anchor="middle" font-weight="500">x₃</text><text x="390" y="252" fill="#526e75" font-size="15" text-anchor="middle" font-weight="500">在真正 LSTM 中，状态包括 hidden state 与 cell state；此图做了记号简化。</text><text x="390" y="285" fill="#526e75" font-size="14" text-anchor="middle" font-weight="500">原论文使用多层 LSTM；图中只展开一条抽象的状态时间线。</text></svg>
