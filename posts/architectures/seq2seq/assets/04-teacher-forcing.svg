<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 343" width="780" height="343" role="img" aria-label="训练时使用参考答案的上一 token；推理时使用模型上一轮的预测 token，均预测下一词概率" font-family="system-ui,-apple-system,'PingFang SC','Microsoft Yahei',sans-serif"><title>训练与推理采用不同的上一步 token</title><desc>训练时使用参考答案的上一 token；推理时使用模型上一轮的预测 token，均预测下一词概率</desc><rect width="780" height="343" rx="16" fill="#f7faf8"/><text x="30" y="43" fill="#237e7b" font-size="17" text-anchor="start" font-weight="700">TRAIN / Teacher forcing</text><text x="30" y="196" fill="#b3744d" font-size="17" text-anchor="start" font-weight="700">INFERENCE / autoregressive</text><rect x="31" y="68" width="153" height="64" rx="12" fill="#e1f2ed" stroke="#6caaa4" stroke-width="1.8"/><text x="107" y="93" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">BOS</text><text x="107" y="116" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">→ P(y₁)</text> <path d="M184 102 L212 102" fill="none" stroke="#69848b" stroke-width="2" /><path d="M 212 102 L 201 96.6 L 201 107.4 Z" fill="#69848b"/><rect x="218" y="68" width="153" height="64" rx="12" fill="#e1f2ed" stroke="#6caaa4" stroke-width="1.8"/><text x="294" y="93" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">y₁ (真值)</text><text x="294" y="116" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">→ P(y₂)</text> <path d="M371 102 L399 102" fill="none" stroke="#69848b" stroke-width="2" /><path d="M 399 102 L 388 96.6 L 388 107.4 Z" fill="#69848b"/><rect x="405" y="68" width="153" height="64" rx="12" fill="#e1f2ed" stroke="#6caaa4" stroke-width="1.8"/><text x="481" y="93" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">y₂ (真值)</text><text x="481" y="116" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">→ P(y₃)</text> <path d="M558 102 L586 102" fill="none" stroke="#69848b" stroke-width="2" /><path d="M 586 102 L 575 96.6 L 575 107.4 Z" fill="#69848b"/><rect x="592" y="68" width="153" height="64" rx="12" fill="#e1f2ed" stroke="#6caaa4" stroke-width="1.8"/><text x="668" y="93" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">y₃ (真值)</text><text x="668" y="116" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">→ P(EOS)</text> <rect x="31" y="218" width="153" height="64" rx="12" fill="#fff0e3" stroke="#cf916d" stroke-width="1.8"/><text x="107" y="243" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">BOS</text><text x="107" y="267" fill="#294c55" font-size="15" text-anchor="middle" font-weight="500">→ ŷ₁</text> <path d="M184 252 L212 252" fill="none" stroke="#ce956f" stroke-width="2" /><path d="M 212 252 L 201 246.6 L 201 257.4 Z" fill="#ce956f"/><rect x="218" y="218" width="153" height="64" rx="12" fill="#fff0e3" stroke="#cf916d" stroke-width="1.8"/><text x="294" y="243" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">ŷ₁ (预测)</text><text x="294" y="267" fill="#294c55" font-size="15" text-anchor="middle" font-weight="500">→ ŷ₂</text> <path d="M371 252 L399 252" fill="none" stroke="#ce956f" stroke-width="2" /><path d="M 399 252 L 388 246.6 L 388 257.4 Z" fill="#ce956f"/><rect x="405" y="218" width="153" height="64" rx="12" fill="#fff0e3" stroke="#cf916d" stroke-width="1.8"/><text x="481" y="243" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">ŷ₂ (预测)</text><text x="481" y="267" fill="#294c55" font-size="15" text-anchor="middle" font-weight="500">→ ŷ₃</text> <path d="M558 252 L586 252" fill="none" stroke="#ce956f" stroke-width="2" /><path d="M 586 252 L 575 246.6 L 575 257.4 Z" fill="#ce956f"/><rect x="592" y="218" width="153" height="64" rx="12" fill="#fff0e3" stroke="#cf916d" stroke-width="1.8"/><text x="668" y="243" fill="#294c55" font-size="14" text-anchor="middle" font-weight="500">ŷ₃ (预测)</text><text x="668" y="267" fill="#294c55" font-size="15" text-anchor="middle" font-weight="500">→ EOS</text> <text x="390" y="324" fill="#587076" font-size="14" text-anchor="middle" font-weight="500">两行是不同的数据来源，而非不同的条件分布定义。</text></svg>
