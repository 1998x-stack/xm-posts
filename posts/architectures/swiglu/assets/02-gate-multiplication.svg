<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="swg-title-2 swg-desc-2"><title id="swg-title-2">元素级门控不是二值开关</title><desc id="swg-desc-2">SwiGLU 计算是先对 gate 分支施加 SiLU，再乘上 up 分支；门值可以为负数或大于一。</desc><rect width="960" height="340" rx="18" fill="#ffffff"/>
<rect x="36" y="53" width="220" height="78" rx="14" fill="#f1f8f5" stroke="#91bdb1" stroke-width="2"/><text x="146" y="87" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#264d50">gate: a = x Wg</text><text x="146" y="115" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="600" fill="#6b8385">-1 / 0 / +2</text>
<rect x="36" y="210" width="220" height="78" rx="14" fill="#f1f8f5" stroke="#91bdb1" stroke-width="2"/><text x="146" y="246" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#264d50">value: b = x Wu</text><text x="146" y="275" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" font-weight="600" fill="#6b8385">每个通道独立</text>
