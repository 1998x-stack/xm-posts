<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="swg-title-3 swg-desc-3"><title id="swg-title-3">两矩阵与三矩阵的参数预算</title><desc id="swg-desc-3">同输入输出维度 d，传统 FFN 内宽 m，门控 FFN 内宽 m'，匹配参数要求三倍 dm' 等于两倍 dm。</desc><rect width="960" height="340" rx="18" fill="#ffffff"/>
<text x="252" y="45" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#264d50">传统 FFN</text><text x="708" y="45" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#264d50">SwiGLU FFN</text>
<rect x="90" y="91" width="324" height="77" rx="14" fill="#edf5fb" stroke="#99bdd4" stroke-width="2"/><text x="252" y="129" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#264d50">W₁ : d × m</text><text x="252" y="155" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="20" font-weight="600" fill="#264d50">W₂ : m × d</text>
<rect x="540" y="91" width="324" height="77" rx="14" fill="#fff1e9" stroke="#dc9e80" stroke-width="2"/><text x="702" y="126" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" fill="#264d50">Wg, Wu : d × m′</text><text x="702" y="153" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="20" font-weight="600" fill="#264d50">Wd : m′ × d</text>
<text x="252" y="221" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="28" font-weight="600" fill="#345b87">P = 2dm</text><text x="702" y="221" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="28" font-weight="600" fill="#ba7352">P = 3dm′</text>
<rect x="190" y="255" width="580" height="58" rx="14" fill="#e7f6f1" stroke="#8bc3b1" stroke-width="2"/><text x="480" y="293" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="23" font-weight="600" fill="#216d66">m′ = 2m / 3    •    T5: 3072 → 2048</text></svg>