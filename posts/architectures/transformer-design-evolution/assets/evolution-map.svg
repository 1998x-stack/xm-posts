<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="evo-title evo-desc"><title id="evo-title">Transformer 架构演进的五条主线</title><desc id="evo-desc">中心为原始 Transformer，向外连接训练稳定性、位置表示、FFN 门控、KV Cache 和 GPU IO 五条演进路线。</desc><rect width="1000" height="520" rx="24" fill="#f8fbf8"/><rect x="370" y="198" width="260" height="120" rx="18" fill="#e6f1ed" stroke="#6ca79a" stroke-width="3"/><text x="500" y="244" text-anchor="middle" font-size="25" font-weight="700" fill="#234b4d">Transformer</text><text x="500" y="280" text-anchor="middle" font-size="17" fill="#47696a">2017 · 原始基线</text><g stroke="#91aaa4" stroke-width="3" fill="none"><path d="M410 198L220 105"/><path d="M500 198L500 105"/><path d="M590 198L780 105"/><path d="M410 318L220 415"/><path d="M590 318L780 415"/></g><g font-family="Arial,'Noto Sans SC',sans-serif"><rect x="48" y="35" width="280" height="120" rx="15" fill="#fff1e9" stroke="#d68b6b" stroke-width="2"/><text x="76" y="76" font-size="21" font-weight="700" fill="#a34e31">01 · 训练稳定性</text><text x="76" y="111" font-size="17" fill="#594b45">Post-LN → Pre-LN → DeepNorm</text><rect x="358" y="35" width="284" height="120" rx="15" fill="#f0edfa" stroke="#9b8ac7" stroke-width="2"/><text x="386" y="76" font-size="21" font-weight="700" fill="#655493">02 · 位置表示</text><text x="386" y="111" font-size="17" fill="#514b61">Absolute PE → RoPE / ALiBi</text><rect x="672" y="35" width="280" height="120" rx="15" fill="#fff7e8" stroke="#d6b66b" stroke-width="2"/><text x="700" y="76" font-size="21" font-weight="700" fill="#8c6b24">03 · FFN 计算单元</text><text x="700" y="111" font-size="17" fill="#5d5747">ReLU → GELU → SwiGLU</text><rect x="48" y="365" width="340" height="120" rx="15" fill="#eaf3f8" stroke="#78a8c0" stroke-width="2"/><text x="76" y="406" font-size="21" font-weight="700" fill="#356f8b">04 · 推理内存</text><text x="76" y="441" font-size="17" fill="#465b65">MHA → MQA → GQA</text><rect x="612" y="365" width="340" height="120" rx="15" fill="#eaf5ef" stroke="#7ab092" stroke-width="2"/><text x="640" y="406" font-size="21" font-weight="700" fill="#397a57">05 · GPU 数据流</text><text x="640" y="441" font-size="17" fill="#4b6254">Standard → FlashAttention</text></g></svg>