<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="io-title io-desc"><title id="io-title">标准 Attention 与 FlashAttention 的数据流差异</title><desc id="io-desc">标准实现物化完整 N 乘 N 分数矩阵；FlashAttention 分块载入 Q K V，在 SRAM 中计算局部块并在线合并 Softmax 统计量。</desc><rect width="980" height="390" rx="20" fill="#fbfcfa"/><path d="M490 30V360" stroke="#dce6e1" stroke-width="2" stroke-dasharray="6 7"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="245" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#a65e3c">传统物化路径</text><text x="735" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#397d5b">FlashAttention</text><rect x="70" y="82" width="350" height="68" rx="12" fill="#e8f0f3" stroke="#9bb9c1" stroke-width="2"/><text x="245" y="123" text-anchor="middle" font-size="20" fill="#294954">QKᵀ → 完整 N × N 分数矩阵</text><path d="M245 150V190" stroke="#8aa6a5" stroke-width="3"/><rect x="70" y="190" width="350" height="76" rx="12" fill="#fff0e5" stroke="#e3ad8c" stroke-width="2"/><text x="245" y="222" text-anchor="middle" font-size="18" fill="#a65e3c">写入 HBM</text><text x="245" y="247" text-anchor="middle" font-size="15" fill="#765c50">Softmax 中间张量物化</text><path d="M245 266V302" stroke="#8aa6a5" stroke-width="3"/><rect x="70" y="302" width="350" height="54" rx="12" fill="#f0edfa" stroke="#a99bcb" stroke-width="2"/><text x="245" y="336" text-anchor="middle" font-size="18" fill="#665595">再读取并乘 V</text><rect x="560" y="82" width="350" height="68" rx="12" fill="#e8f0f3" stroke="#9bb9c1" stroke-width="2"/><text x="735" y="123" text-anchor="middle" font-size="20" fill="#294954">分块加载 Q / K / V</text><path d="M735 150V190" stroke="#8aa6a5" stroke-width="3"/><rect x="560" y="190" width="350" height="76" rx="12" fill="#eaf5ef" stroke="#7ab092" stroke-width="2"/><text x="735" y="222" text-anchor="middle" font-size="18" fill="#397d5b">片上 SRAM 中局部计算</text><text x="735" y="247" text-anchor="middle" font-size="15" fill="#526e5c">在线更新 m、ℓ 与输出累积</text><path d="M735 266V302" stroke="#8aa6a5" stroke-width="3"/><rect x="560" y="302" width="350" height="54" rx="12" fill="#fff7df" stroke="#d8bd71" stroke-width="2"/><text x="735" y="336" text-anchor="middle" font-size="18" fill="#806b2c">不写出完整注意力矩阵</text></g></svg>