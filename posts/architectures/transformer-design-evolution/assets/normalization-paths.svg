<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="norm-title norm-desc"><title id="norm-title">Post-LN 与 Pre-LN 的计算顺序</title><desc id="norm-desc">Post-LN 在残差加法之后执行 LayerNorm；Pre-LN 在变换分支之前执行 LayerNorm，恒等路径绕过归一化。</desc><rect width="960" height="370" rx="20" fill="#fbfdfb"/><path d="M480 24V345" stroke="#dce6e1" stroke-width="2" stroke-dasharray="6 7"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="240" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#b65f40">POST-LN</text><text x="720" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#147f80">PRE-LN</text><rect x="45" y="90" width="90" height="56" rx="10" fill="#e8f0f3" stroke="#9bb9c1"/><text x="90" y="125" text-anchor="middle" font-size="22" fill="#294954">x</text><rect x="205" y="90" width="120" height="56" rx="10" fill="#fff0e5" stroke="#e3ad8c"/><text x="265" y="125" text-anchor="middle" font-size="20" fill="#a65e3c">F(x)</text><circle cx="370" cy="118" r="22" fill="#fff7df" stroke="#d8bd71" stroke-width="2"/><text x="370" y="126" text-anchor="middle" font-size="27" fill="#806b2c">+</text><rect x="315" y="220" width="110" height="55" rx="10" fill="#e7f4e9" stroke="#9fc9ac"/><text x="370" y="254" text-anchor="middle" font-size="20" fill="#397d5b">LayerNorm</text><path d="M135 118H205M325 118H348M370 140V220M90 146V180H370V140M370 275V310" fill="none" stroke="#668d8b" stroke-width="3"/><text x="70" y="205" font-size="14" fill="#32758b">identity path</text><text x="240" y="340" text-anchor="middle" font-size="16" fill="#586d70">相加后的结果也要归一化</text><rect x="525" y="90" width="90" height="56" rx="10" fill="#e8f0f3" stroke="#9bb9c1"/><text x="570" y="125" text-anchor="middle" font-size="22" fill="#294954">x</text><rect x="660" y="90" width="110" height="56" rx="10" fill="#e7f4e9" stroke="#9fc9ac"/><text x="715" y="125" text-anchor="middle" font-size="20" fill="#397d5b">LayerNorm</text><rect x="815" y="90" width="100" height="56" rx="10" fill="#fff0e5" stroke="#e3ad8c"/><text x="865" y="125" text-anchor="middle" font-size="20" fill="#a65e3c">F(LN x)</text><circle cx="715" cy="245" r="22" fill="#fff7df" stroke="#d8bd71" stroke-width="2"/><text x="715" y="253" text-anchor="middle" font-size="27" fill="#806b2c">+</text><path d="M615 118H660M770 118H815M865 146V245H737M570 146V180H715V223M715 267V310" fill="none" stroke="#668d8b" stroke-width="3"/><text x="535" y="205" font-size="14" fill="#32758b">identity path</text><text x="720" y="340" text-anchor="middle" font-size="16" fill="#586d70">恒等路径绕过 LayerNorm</text></g></svg>