<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="rope-title rope-desc"><title id="rope-title">RoPE 的相对位置性质</title><desc id="rope-desc">位置 m 的 Query 与位置 n 的 Key 分别旋转，二者内积中的旋转矩阵合成为相对位移 n 减 m。</desc><rect width="920" height="360" rx="20" fill="#fafbfd"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#334e59">位置决定旋转角度，内积只保留相对旋转</text><g transform="translate(180 178)"><circle r="78" fill="#fff" stroke="#c7d8dc" stroke-width="2"/><path d="M-90 0H90M0 -90V90" stroke="#d6e0e2" stroke-width="1.5"/><path d="M0 0L62 -35" stroke="#c86f4b" stroke-width="5" stroke-linecap="round"/><path d="M62 -35L48 -33M62 -35L56 -21" stroke="#c86f4b" stroke-width="3" fill="none"/><text x="0" y="112" text-anchor="middle" font-size="17" fill="#425d62">q 在位置 m：Rₘq</text></g><g transform="translate(740 178)"><circle r="78" fill="#fff" stroke="#c7d8dc" stroke-width="2"/><path d="M-90 0H90M0 -90V90" stroke="#d6e0e2" stroke-width="1.5"/><path d="M0 0L48 52" stroke="#147f80" stroke-width="5" stroke-linecap="round"/><path d="M48 52L45 36M48 52L64 49" stroke="#147f80" stroke-width="3" fill="none"/><text x="0" y="112" text-anchor="middle" font-size="17" fill="#425d62">k 在位置 n：Rₙk</text></g><path d="M280 178H365M555 178H640" stroke="#8ca5a8" stroke-width="3"/><path d="M355 168L365 178L355 188M630 168L640 178L630 188" fill="none" stroke="#8ca5a8" stroke-width="3"/><rect x="365" y="130" width="190" height="96" rx="14" fill="#edf5f2" stroke="#9cc6b8" stroke-width="2"/><text x="460" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#276b66">qᵀ Rₙ₋ₘ k</text><text x="460" y="198" text-anchor="middle" font-size="15" fill="#516d6c">相对位移</text><text x="460" y="325" text-anchor="middle" font-size="16" fill="#63777a">RₘᵀRₙ = Rₙ₋ₘ（同一频率二维旋转的群性质）</text></g></svg>