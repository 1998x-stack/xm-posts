dle" fill="#18343b" font-size="18" font-weight="650">书</text><rect x="560" y="196" width="78" height="51" rx="12" fill="#eeebfc" stroke="#7b6fc6" stroke-width="1.6"/><text x="599.0" y="226.5" text-anchor="middle" fill="#18343b" font-size="18" font-weight="650">它</text><rect x="666" y="196" width="78" height="51" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="705.0" y="226.5" text-anchor="middle" fill="#18343b" font-size="18" font-weight="650">很厚</text><path d="M600 188 Q510 35 495 186" stroke="#178f91" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><path d="M600 188 Q345 75 71 190" stroke="#9bb5b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35"/><path d="M600 188 Q500 98 388 190" stroke="#9bb5b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35"/><text x="395" y="83" text-anchor="middle" class="txt">“它”关注“书”的信息</text><rect x="278" y="104" width="250" height="37" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="403.0" y="127.5" text-anchor="middle" fill="#18343b" font-size="15" font-weight="650">语境相关的特征更新</text><text x="395" y="276" text-anchor="middle" class="small">真实注意力权重是模型根据数据学习的，这里只是教学示意。</text></svg>