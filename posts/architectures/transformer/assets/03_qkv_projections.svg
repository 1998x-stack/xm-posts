<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 314" role="img" aria-label="输入向量分别线性投影成 Query Key Value 的示意"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#728f93"/></marker></defs><style>.txt{fill:#254d53;font-size:16px;font-weight:650;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{fill:#657d80;font-size:12px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{fill:#6b8585;font-size:10px;font-family:system-ui,sans-serif}.strong{fill:#204a4d;font-size:20px;font-weight:800;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}</style><text x="400" y="34" text-anchor="middle" class="txt">同一组输入 X，经三组独立的可学习投影得到 Q、K、V</text><rect x="296" y="59" width="210" height="45" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="401.0" y="86.5" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">输入向量矩阵 X</text><path d="M401 104V134H145V163" stroke="#178f91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="63" y="171" width="164" height="53" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="145.0" y="197.5" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">XWQ · Query</text><text x="145.0" y="219.5" text-anchor="middle" class="small">我要找什么</text><text x="145" y="251" text-anchor="middle" class="small">Q · Query  参与相似度计算</text><path d="M401 104V134H398V163" stroke="#db7a53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="316" y="171" width="164" height="53" rx="12" fill="#fff0e7" stroke="#db7a53" stroke-width="1.6"/><text x="398.0" y="197.5" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">XWK · Key</text><text x="398.0" y="219.5" text-anchor="middle" class="small">我可被怎样匹配</text><text x="398" y="251" text-anchor="middle" class="small">K · Key  参与相似度计算</text><path d="M401 104V134H650V163" stroke="#7b6fc6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="568" y="171" width="164" height="53" rx="12" fill="#eeebfc" stroke="#7b6fc6" stroke-width="1.6"/><text x="650.0" y="197.5" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">XWV · Value</text><text x="650.0" y="219.5" text-anchor="middle" class="small">我提供什么信息</text><text x="650" y="251" text-anchor="middle" class="small">V · Value  被加权汇总</text><text x="400" y="293" text-anchor="middle" class="small">Q、K、V 是向量 / 矩阵，不是三个离散“身份标签”</text></svg>