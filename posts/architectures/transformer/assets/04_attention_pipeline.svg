<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 345" role="img" aria-label="缩放点积注意力的六步计算流水线"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#728f93"/></marker></defs><style>.txt{fill:#254d53;font-size:16px;font-weight:650;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{fill:#657d80;font-size:12px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{fill:#6b8585;font-size:10px;font-family:system-ui,sans-serif}.strong{fill:#204a4d;font-size:20px;font-weight:800;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}</style><text x="420" y="33" text-anchor="middle" class="strong">Scaled Dot-Product Attention</text><rect x="30" y="112" width="111" height="70" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="85.5" y="147.0" text-anchor="middle" fill="#18343b" font-size="17" font-weight="650">Q · Kᵀ</text><text x="85.5" y="169.0" text-anchor="middle" class="small">相关性分数</text><rect x="169" y="112" width="111" height="70" rx="12" fill="#fff3d7" stroke="#c49734" stroke-width="1.6"/><text x="224.5" y="147.0" text-anchor="middle" fill="#18343b" font-size="17" font-weight="650">÷ √dₖ</text><text x="224.5" y="169.0" text-anchor="middle" class="small">稳定数值</text><path d="M141 147 L161 147" stroke="#9bb5b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="307" y="112" width="111" height="70" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="362.5" y="147.0" text-anchor="middle" fill="#18343b" font-size="17" font-weight="650">Mask</text><text x="362.5" y="169.0" text-anchor="middle" class="small">屏蔽不可见</text><path d="M280 147 L299 147" stroke="#9bb5b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="453" y="112" width="111" height="70" rx="12" fill="#fff0e7" stroke="#db7a53" stroke-width="1.6"/><text x="508.5" y="147.0" text-anchor="middle" fill="#18343b" font-size="17" font-weight="650">Softmax</text><text x="508.5" y="169.0" text-anchor="middle" class="small">归一化权重</text><path d="M418 147 L445 147" stroke="#9bb5b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="599" y="112" width="111" height="70" rx="12" fill="#eeebfc" stroke="#7b6fc6" stroke-width="1.6"/><text x="654.5" y="147.0" text-anchor="middle" fill="#18343b" font-size="17" font-weight="650">× V</text><text x="654.5" y="169.0" text-anchor="middle" class="small">汇总信息</text><path d="M564 147 L591 147" stroke="#9bb5b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="727" y="112" width="90" height="70" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="772.0" y="147.0" text-anchor="middle" fill="#18343b" font-size="17" font-weight="650">输出</text><text x="772.0" y="169.0" text-anchor="middle" class="small">新表示</text><path d="M710 147 L719 147" stroke="#9bb5b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="46" y="236" width="705" height="48" rx="12" fill="#ffffff" stroke="#9bb5b8" stroke-width="1.6"/><text x="398.5" y="265.0" text-anchor="middle" fill="#18343b" font-size="20" font-weight="650">Attention(Q,K,V) = softmax( (QKᵀ / √dₖ) + M ) V</text><text x="406" y="321" text-anchor="middle" class="small">M：允许位置加 0；禁止位置加极大负数（概念上为 −∞）</text></svg>