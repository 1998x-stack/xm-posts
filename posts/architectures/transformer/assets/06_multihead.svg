<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 465" role="img" aria-label="多头注意力三组并行注意力头以及拼接输出投影" aria-describedby="tf-asset-desc-06"><title id="tf-asset-title-06">多头注意力三组并行注意力头以及拼接输出投影</title><desc id="tf-asset-desc-06">仅画三个头以保持阅读清晰，原始 Transformer base 使用 8 个头，投影参数是可学习的。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#728f93"/></marker></defs><style>.txt{fill:#254d53;font-size:16px;font-weight:650;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{fill:#657d80;font-size:12px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{fill:#6b8585;font-size:10px;font-family:system-ui,sans-serif}.strong{fill:#204a4d;font-size:20px;font-weight:800;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}</style><text x="411" y="35" text-anchor="middle" class="txt">多头注意力：多组独立的投影，让模型学习不同的关系</text><rect x="336" y="62" width="147" height="42" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="409.5" y="88.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">输入 X</text><path d="M410 104V135H114V164" stroke="#178f91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="31" y="169" width="166" height="54" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="114.0" y="196.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Head 1</text><text x="114.0" y="218.0" text-anchor="middle" class="small">局部语法</text><path d="M114 223V249H410V280" stroke="#178f91" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1"/><path d="M410 104V135H398V164" stroke="#db7a53" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="315" y="169" width="166" height="54" rx="12" fill="#fff0e7" stroke="#db7a53" stroke-width="1.6"/><text x="398.0" y="196.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Head 2</text><text x="398.0" y="218.0" text-anchor="middle" class="small">指代 / 依赖</text><path d="M398 223V249H410V280" stroke="#db7a53" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1"/><path d="M410 104V135H682V164" stroke="#7b6fc6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="599" y="169" width="166" height="54" rx="12" fill="#eeebfc" stroke="#7b6fc6" stroke-width="1.6"/><text x="682.0" y="196.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Head 3</text><text x="682.0" y="218.0" text-anchor="middle" class="small">远距离线索</text><path d="M682 223V249H410V280" stroke="#7b6fc6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1"/><rect x="339" y="288" width="142" height="45" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="410.0" y="315.5" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Concat</text><path d="M410 333 L410 362" stroke="#9bb5b8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="337" y="366" width="146" height="44" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="410.0" y="393.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">输出投影 Wᴼ</text><text x="411" y="444" text-anchor="middle" class="small">原始 base 模型为 8 个头；图示只画 3 个，示例用途</text></svg>