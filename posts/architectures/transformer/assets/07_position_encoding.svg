7a53" stroke-width="1.6"/><text x="722.5" y="104.5" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">狗</text><text x="221" y="152" text-anchor="middle" class="small">顺序 A</text><text x="577" y="152" text-anchor="middle" class="small">顺序 B</text><text x="411" y="197" text-anchor="middle" class="txt">原始 Transformer 在输入向量上叠加位置编码</text><rect x="54" y="233" width="162" height="60" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="135.0" y="268.0" text-anchor="middle" fill="#18343b" font-size="15" font-weight="650">Token Embedding</text><text x="243" y="270" text-anchor="middle" class="strong">+</text><rect x="277" y="233" width="180" height="60" rx="12" fill="#fff3d7" stroke="#c49734" stroke-width="1.6"/><text x="367.0" y="268.0" text-anchor="middle" fill="#18343b" font-size="15" font-weight="650">Positional Encoding</text><text x="485" y="270" text-anchor="middle" class="strong">=</text><rect x="520" y="233" width="242" height="60" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="641.0" y="268.0" text-anchor="middle" fill="#18343b" font-size="15" font-weight="650">携带内容与位置信息的表示</text><text x="405" y="334" text-anchor="middle" class="small">原论文使用不同频率的 sin/cos；是相加，不是拼接</text></svg>