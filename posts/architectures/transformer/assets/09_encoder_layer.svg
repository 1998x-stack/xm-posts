<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 645" role="img" aria-label="编码器层包含自注意力、两次残差连接与 LayerNorm 以及 FFN" aria-describedby="tf-asset-desc-09"><title id="tf-asset-title-09">编码器层包含自注意力、两次残差连接与 LayerNorm 以及 FFN</title><desc id="tf-asset-desc-09">只画一个 layer。原始模型 6 层堆叠；每个子层采用残差相加后 LayerNorm 的 Post-LN 形式。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#728f93"/></marker></defs><style>.txt{fill:#254d53;font-size:16px;font-weight:650;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{fill:#657d80;font-size:12px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{fill:#6b8585;font-size:10px;font-family:system-ui,sans-serif}.strong{fill:#204a4d;font-size:20px;font-weight:800;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}</style><text x="409" y="30" text-anchor="middle" class="strong">Encoder Layer（原论文 Post-LN 结构）</text><rect x="290.0" y="55" width="184" height="58" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="382.0" y="89.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">输入 X</text><rect x="258.5" y="150" width="247" height="58" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="382.0" y="184.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Multi-Head Self-Attention</text><path d="M381 114 L381 143" stroke="#9bb5b8" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="290.0" y="254" width="184" height="58" rx="12" fill="#fff3d7" stroke="#c49734" stroke-width="1.6"/><text x="382.0" y="288.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Add &amp; Norm</text><path d="M381 218 L381 247" stroke="#9bb5b8" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="290.0" y="353" width="184" height="58" rx="12" fill="#fff0e7" stroke="#db7a53" stroke-width="1.6"/><text x="382.0" y="387.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">FFN</text><path d="M381 317 L381 346" stroke="#9bb5b8" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="290.0" y="453" width="184" height="58" rx="12" fill="#fff3d7" stroke="#c49734" stroke-width="1.6"/><text x="382.0" y="487.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Add &amp; Norm</text><path d="M381 417 L381 446" stroke="#9bb5b8" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="290.0" y="555" width="184" height="58" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="382.0" y="589.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">输出 Z</text><path d="M381 519 L381 548" stroke="#9bb5b8" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><path d="M290 83H195V283H290" stroke="#178f91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><path d="M381 322H140V482H290" stroke="#178f91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><text x="149" y="220" text-anchor="middle" class="small">Residual 1</text><text x="103" y="405" text-anchor="middle" class="small">Residual 2</text><rect x="539" y="177" width="203" height="72" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="640.5" y="213.0" text-anchor="middle" fill="#18343b" font-size="14" font-weight="650">每个 Token 可读整个序列</text><text x="640.5" y="235.0" text-anchor="middle" class="small">注意力负责 token 间交互</text><rect x="539" y="369" width="203" height="72" rx="12" fill="#f4f8f8" stroke="#9bb5b8" stroke-width="1.6"/><text x="640.5" y="405.0" text-anchor="middle" fill="#18343b" font-size="14" font-weight="650">同一 FFN 应用于每个位置</text><text x="640.5" y="427.0" text-anchor="middle" class="small">处理每个 token 的通道特征</text></svg>