343b" font-size="15" font-weight="650">Cross-Attention</text><path d="M410 281 L410 301" stroke="#9bb5b8" stroke-width="2.3" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="318.0" y="394" width="185" height="49" rx="12" fill="#fff3d7" stroke="#c49734" stroke-width="1.6"/><text x="410.5" y="423.5" text-anchor="middle" fill="#18343b" font-size="15" font-weight="650">Add &amp; Norm</text><path d="M410 365 L410 385" stroke="#9bb5b8" stroke-width="2.3" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="318.0" y="480" width="185" height="49" rx="12" fill="#fff0e7" stroke="#db7a53" stroke-width="1.6"/><text x="410.5" y="509.5" text-anchor="middle" fill="#18343b" font-size="15" font-weight="650">FFN</text><path d="M410 451 L410 471" stroke="#9bb5b8" stroke-width="2.3" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="318.0" y="567" width="185" height="49" rx="12" fill="#fff3d7" stroke="#c49734" stroke-width="1.6"/><text x="410.5" y="596.5" text-anchor="middle" fill="#18343b" font-size="15" font-weight="650">Add &amp; Norm</text><path d="M410 538 L410 558" stroke="#9bb5b8" stroke-width="2.3" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="571" y="281" width="188" height="55" rx="12" fill="#eeebfc" stroke="#7b6fc6" stroke-width="1.6"/><text x="665.0" y="308.5" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Encoder Memory</text><text x="665.0" y="330.5" text-anchor="middle" class="small">作为 K 与 V</text><path d="M571 308H548V334H528" stroke="#7b6fc6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><text x="571" y="374" text-anchor="middle" class="small">Q 来自 Decoder</text><path d="M318 86H245V251H318" stroke="#178f91" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><path d="M410 287H199V414H318