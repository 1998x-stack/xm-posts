<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 660" role="img" aria-label="2017 原始 Transformer 编码器解码器整体结构" aria-describedby="tf-asset-desc-11"><title id="tf-asset-title-11">2017 原始 Transformer 编码器解码器整体结构</title><desc id="tf-asset-desc-11">左侧源序列经过 Encoder，右侧目标序列右移输入 Decoder；每侧 6 个层，图中省略每个子层内部残差与归一化的细节。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#728f93"/></marker></defs><style>.txt{fill:#254d53;font-size:16px;font-weight:650;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.small{fill:#657d80;font-size:12px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{fill:#6b8585;font-size:10px;font-family:system-ui,sans-serif}.strong{fill:#204a4d;font-size:20px;font-weight:800;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}</style><text x="430" y="33" text-anchor="middle" class="strong">2017 原始 Transformer：Encoder–Decoder（N = 6）</text><rect x="65" y="539" width="272" height="60" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="201.0" y="574.0" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">输入 tokens → Embedding + PE</text><rect x="487" y="539" width="272" height="60" rx="12" fill="#fff0e7" stroke="#db7a53" stroke-width="1.6"/><text x="623.0" y="574.0" text-anchor="middle" fill="#18343b" font-size="15" font-weight="650">右移目标 tokens → Embedding + PE</text><rect x="83" y="183" width="240" height="323" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="203" y="220" text-anchor="middle" class="txt">Encoder Layer × 6</text><rect x="505" y="137" width="238" height="369" rx="12" fill="#fff0e7" stroke="#db7a53" stroke-width="1.6"/><text x="624" y="173" text-anchor="middle" class="txt">Decoder Layer × 6</text><rect x="113" y="276" width="180" height="48" rx="12" fill="#ffffff" stroke="#9bb5b8" stroke-width="1.6"/><text x="203.0" y="305.0" text-anchor="middle" fill="#18343b" font-size="12" font-weight="650">Multi-Head Self-Attention</text><rect x="113" y="370" width="180" height="48" rx="12" fill="#ffffff" stroke="#9bb5b8" stroke-width="1.6"/><text x="203.0" y="399.0" text-anchor="middle" fill="#18343b" font-size="12" font-weight="650">Feed-Forward Network</text><rect x="537" y="228" width="173" height="48" rx="12" fill="#e1f5ef" stroke="#178f91" stroke-width="1.6"/><text x="623.5" y="257.0" text-anchor="middle" fill="#18343b" font-size="12" font-weight="650">Masked Self-Attention</text><rect x="537" y="309" width="173" height="48" rx="12" fill="#eeebfc" stroke="#7b6fc6" stroke-width="1.6"/><text x="623.5" y="338.0" text-anchor="middle" fill="#18343b" font-size="12" font-weight="650">Encoder–Decoder Attention</text><rect x="537" y="400" width="173" height="48" rx="12" fill="#ffffff" stroke="#9bb5b8" stroke-width="1.6"/><text x="623.5" y="429.0" text-anchor="middle" fill="#18343b" font-size="12" font-weight="650">Feed-Forward Network</text><path d="M200 539 L200 509" stroke="#9bb5b8" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><path d="M623 539 L623 509" stroke="#9bb5b8" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><path d="M323 350H442V335H537" stroke="#7b6fc6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" marker-end="url(#arrow)"/><text x="448" y="323" text-anchor="middle" class="small">K, V</text><path d="M623 136 L623 112" stroke="#9bb5b8" stroke-width="2.7" stroke-linecap="round" fill="none" opacity="1" marker-end="url(#arrow)"/><rect x="532" y="56" width="182" height="47" rx="12" fill="#fff3d7" stroke="#c49734" stroke-width="1.6"/><text x="623.0" y="84.5" text-anchor="middle" fill="#18343b" font-size="16" font-weight="650">Linear + Softmax</text><text x="410" y="638" text-anchor="middle" class="small">Add &amp; Norm 已折叠在各子层中；每个堆栈为 6 层</text></svg>