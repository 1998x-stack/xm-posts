<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt01-title dt01-desc" viewBox="0 0 760 330" width="760" height="330" data-export="dt01.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dt01-title">一棵树如何把规则组合成路径</title><desc id="dt01-desc">根节点提问温度，再根据是否存在异常信号分叉，最终给出高低风险；这是一棵教学示意树。</desc><rect width="760" height="330" rx="14" fill="#f9fbf8"/><rect x="280" y="27" width="200" height="64" rx="9" fill="#e6f3ef" stroke="#d7e5df"/><text x="380" y="53" font-size="17" font-weight="600" fill="#263e47" text-anchor="middle">温度 ≥ 70°C ?</text><text x="380" y="75" font-size="13" font-weight="600" fill="#657b7d" text-anchor="middle">连续特征阈值</text><line x1="325" y1="91" x2="200" y2="154" stroke="#2b7d77" stroke-width="3" /><line x1="435" y1="91" x2="570" y2="154" stroke="#2b7d77" stroke-width="3" /><text x="256" y="121" font-size="15" font-weight="600" fill="#447c9d" text-anchor="middle">否</text><text x="516" y="121" font-size="15" font-weight="600" fill="#c77a51" text-anchor="middle">是</text><rect x="94" y="154" width="212" height="72" rx="9" fill="#e8f2f8" stroke="#bbd3e1"/><text x="200" y="183" font-size="19" font-weight="600" fill="#447c9d" text-anchor="middle">叶：低风险</text><text x="200" y="207" font-size="14" font-weight="600" fill="#657b7d" text-anchor="middle">预测 0</text><rect x="462" y="154" width="220" height="72" rx="9" fill="#f8eee8" stroke="#e9c4af"/><text x="572" y="184" font-size="18" font-weight="600" fill="#263e47" text-anchor="middle">异常信号 ?</text><line x1="530" y1="226" x2="426" y2="272" stroke="#2b7d77" stroke-width="3" /><line x1="620" y1="226" x2="690" y2="272" stroke="#2b7d77" stroke-width="3" /><text x="478" y="260" font-size="14" font-weight="600" fill="#447c9d" text-anchor="middle">否</text><text x="665" y="258" font-size="14" font-weight="600" fill="#c77a51" text-anchor="middle">是</text><rect x="332" y="272" width="180" height="46" rx="9" fill="#e7f2f7" stroke="#bbd3e1"/><rect x="602" y="272" width="150" height="46" rx="9" fill="#f7e8de" stroke="#e9c4af"/><text x="422" y="302" font-size="16" font-weight="600" fill="#447c9d" text-anchor="middle">叶：低风险</text><text x="677" y="302" font-size="16" font-weight="600" fill="#c77a51" text-anchor="middle">叶：高风险</text></svg>