<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt02-title dt02-desc" viewBox="0 0 760 330" width="760" height="330" data-export="dt02.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dt02-title">递归贪心分裂：一次只优化当前节点</title><desc id="dt02-desc">原始样本依次接受候选规则，选择使加权子节点不纯度最小的分裂，并对每个子节点重复。</desc><rect width="760" height="330" rx="14" fill="#f9fbf8"/><rect x="28" y="105" width="165" height="111" rx="9" fill="#e8f1f8" stroke="#bed5e2"/><text x="110" y="135" font-size="18" font-weight="600" fill="#263e47" text-anchor="middle">当前节点</text><text x="110" y="160" font-size="15" font-weight="600" fill="#657b7d" text-anchor="middle">8 个样本</text><text x="110" y="188" font-size="15" font-weight="600" fill="#447c9d" text-anchor="middle">5 正 / 3 负</text><line x1="193" y1="160" x2="260" y2="160" stroke="#2b7d77" stroke-width="3" /><rect x="260" y="66" width="205" height="175" rx="9" fill="#fff" stroke="#cfded8"/><text x="362" y="95" font-size="16" font-weight="600" fill="#263e47" text-anchor="middle">枚举候选特征/阈值</text><text x="362" y="130" font-size="15" font-weight="600" fill="#657b7d" text-anchor="middle">t = 2.5</text><text x="362" y="160" font-size="16" font-weight="600" fill="#2b7d77" text-anchor="middle">t = 4.5  ✓</text><text x="362" y="190" font-size="15" font-weight="600" fill="#657b7d" text-anchor="middle">t = 5.5</text><text x="362" y="220" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">比较 Δ Gini</text><line x1="465" y1="160" x2="525" y2="160" stroke="#2b7d77" stroke-width="3" /><line x1="525" y1="160" x2="590" y2="106" stroke="#2b7d77" stroke-width="3" /><line x1="525" y1="160" x2="590" y2="212" stroke="#2b7d77" stroke-width="3" /><rect x="579" y="69" width="164" height="79" rx="9" fill="#e4f4ed" stroke="#b0d7c5"/><text x="661" y="98" font-size="16" font-weight="600" fill="#2b7d77" text-anchor="middle">左子节点</text><text x="661" y="125" font-size="15" font-weight="600" fill="#657b7d" text-anchor="middle">1 正 / 3 负</text><rect x="579" y="190" width="164" height="79" rx="9" fill="#f6ebe5" stroke="#e7cab9"/><text x="661" y="219" font-size="16" font-weight="600" fill="#c77a51" text-anchor="middle">右子节点</text><text x="661" y="246" font-size="15" font-weight="600" fill="#657b7d" text-anchor="middle">4 正 / 0 负</text><text x="380" y="300" font-size="16" font-weight="600" fill="#263e47" text-anchor="middle">局部最优 ≠ 全局最小树；停止与剪枝同样重要</text></svg>