<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt03-title dt03-desc" viewBox="0 0 760 330" width="760" height="330" data-export="dt03.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dt03-title">节点不纯度随两类比例变化</title><desc id="dt03-desc">对二分类，当正例比例为 0、0.25、0.5、0.75、1 时 Gini 分别为 0、0.375、0.5、0.375、0；熵在 0.5 最高为 1 bit。</desc><rect width="760" height="330" rx="14" fill="#f9fbf8"/><text x="380" y="40" font-size="20" font-weight="600" fill="#263e47" text-anchor="middle">二分类：越混杂，不纯度越大</text><line x1="86" y1="256" x2="672" y2="256" stroke="#95aaa5" stroke-width="2" /><line x1="86" y1="256" x2="86" y2="80" stroke="#95aaa5" stroke-width="2" /><text x="65" y="82" font-size="13" font-weight="600" fill="#657b7d" text-anchor="middle">高</text><text x="65" y="261" font-size="13" font-weight="600" fill="#657b7d" text-anchor="middle">0</text><rect x="90" y="256" width="56" height="0" rx="4" fill="#d9eae5" stroke="none"/><text x="118" y="282" font-size="14" font-weight="600" fill="#263e47" text-anchor="middle">0</text><text x="118" y="300" font-size="13" font-weight="600" fill="#657b7d" text-anchor="middle">全负类</text><text x="118" y="244" font-size="13" font-weight="600" fill="#2b7d77" text-anchor="middle">0</text><rect x="220" y="162.25" width="56" height="93.75" rx="4" fill="#d9eae5" stroke="none"/><text x="248" y="282" font-size="14" font-weight="600" fill="#263e47" text-anchor="middle">0.25</text><text x="248" y="300" font-size="13" font-weight="600" fill="#657b7d" text-anchor="middle">1/4 正</text><text x="248" y="150.25" font-size="13" font-weight="600" fill="#2b7d77" text-anchor="middle">0.375</text><rect x="350" y="131" width="56" height="125" rx="4" fill="#acd8c9" stroke="none"/><text x="378" y="282" font-size="14" font-weight="600" fill="#263e47" text-anchor="middle">0.5</text><text x="378" y="300" font-size="13" font-weight="600" fill="#657b7d" text-anchor="middle">各一半</text><text x="378" y="119" font-size="13" font-weight="600" fill="#2b7d77" text-anchor="middle">0.5</text><rect x="480" y="162.25" width="56" height="93.75" rx="4" fill="#d9eae5" stroke="none"/><text x="508" y="282" font-size="14" font-weight="600" fill="#263e47" text-anchor="middle">0.75</text><text x="508" y="300" font-size="13" font-weight="600" fill="#657b7d" text-anchor="middle">3/4 正</text><text x="508" y="150.25" font-size="13" font-weight="600" fill="#2b7d77" text-anchor="middle">0.375</text><rect x="610" y="256" width="56" height="0" rx="4" fill="#d9eae5" stroke="none"/><text x="638" y="282" font-size="14" font-weight="600" fill="#263e47" text-anchor="middle">1</text><text x="638" y="300" font-size="13" font-weight="600" fill="#657b7d" text-anchor="middle">全正</text><text x="638" y="244" font-size="13" font-weight="600" fill="#2b7d77" text-anchor="middle">0</text><text x="385" y="325" font-size="14" font-weight="600" fill="#657b7d" text-anchor="middle">横轴：正类比例 p；柱高：Gini = 2p(1 − p)</text></svg>