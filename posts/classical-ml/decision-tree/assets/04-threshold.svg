<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt04-title dt04-desc" viewBox="0 0 760 330" width="760" height="330" data-export="dt04.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dt04-title">把连续特征变成一条可搜索的切分线</title><desc id="dt04-desc">八个按 x 排序的观测值及二分类标签，4.5 把左侧 1/4 正例和右侧 4/4 正例分开。</desc><rect width="760" height="330" rx="14" fill="#f9fbf8"/><text x="380" y="38" font-size="19" font-weight="600" fill="#263e47" text-anchor="middle">逐个检查相邻不同取值的中点</text><line x1="65" y1="156" x2="700" y2="156" stroke="#263e47" stroke-width="2" /><circle cx="87" cy="156" r="15" fill="#447c9d" stroke="white" stroke-width="2"/><text x="87" y="198" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">1</text><text x="87" y="124" font-size="14" font-weight="600" fill="#447c9d" text-anchor="middle">0</text><circle cx="170" cy="156" r="15" fill="#447c9d" stroke="white" stroke-width="2"/><text x="170" y="198" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">2</text><text x="170" y="124" font-size="14" font-weight="600" fill="#447c9d" text-anchor="middle">0</text><circle cx="253" cy="156" r="15" fill="#c77a51" stroke="white" stroke-width="2"/><text x="253" y="198" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">3</text><text x="253" y="124" font-size="14" font-weight="600" fill="#c77a51" text-anchor="middle">1</text><circle cx="336" cy="156" r="15" fill="#447c9d" stroke="white" stroke-width="2"/><text x="336" y="198" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">4</text><text x="336" y="124" font-size="14" font-weight="600" fill="#447c9d" text-anchor="middle">0</text><circle cx="419" cy="156" r="15" fill="#c77a51" stroke="white" stroke-width="2"/><text x="419" y="198" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">5</text><text x="419" y="124" font-size="14" font-weight="600" fill="#c77a51" text-anchor="middle">1</text><circle cx="502" cy="156" r="15" fill="#c77a51" stroke="white" stroke-width="2"/><text x="502" y="198" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">6</text><text x="502" y="124" font-size="14" font-weight="600" fill="#c77a51" text-anchor="middle">1</text><circle cx="585" cy="156" r="15" fill="#c77a51" stroke="white" stroke-width="2"/><text x="585" y="198" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">7</text><text x="585" y="124" font-size="14" font-weight="600" fill="#c77a51" text-anchor="middle">1</text><circle cx="668" cy="156" r="15" fill="#c77a51" stroke="white" stroke-width="2"/><text x="668" y="198" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">8</text><text x="668" y="124" font-size="14" font-weight="600" fill="#c77a51" text-anchor="middle">1</text><line x1="377.5" y1="80" x2="377.5" y2="229" stroke="#2b7d77" stroke-width="3" stroke-dasharray="7 5"/><text x="377.5" y="72" font-size="18" font-weight="600" fill="#2b7d77" text-anchor="middle">t = 4.5</text><rect x="85" y="235" width="257" height="62" rx="9" fill="#e8f3f8" stroke="#c4dce6"/><rect x="422" y="235" width="258" height="62" rx="9" fill="#f7ece6" stroke="#ebd1be"/><text x="214" y="260" font-size="15" font-weight="600" fill="#447c9d" text-anchor="middle">左：4 个样本</text><text x="214" y="282" font-size="13" font-weight="600" fill="#263e47" text-anchor="middle">1 正 / 3 负；Gini = 0.375</text><text x="551" y="260" font-size="15" font-weight="600" fill="#c77a51" text-anchor="middle">右：4 个样本</text><text x="551" y="282" font-size="13" font-weight="600" fill="#263e47" text-anchor="middle">4 正 / 0 负；Gini = 0</text><text x="380" y="317" font-size="15" font-weight="600" fill="#2b7d77" text-anchor="middle">加权 Gini = 0.1875；Gini 下降 = 0.28125</text></svg>