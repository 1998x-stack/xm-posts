<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt05-title dt05-desc" viewBox="0 0 760 330" width="760" height="330" data-export="dt05.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dt05-title">回归树通过叶节点均值减少平方误差</title><desc id="dt05-desc">四个样本在 x 为 1、2 时 y 为 2，在 x 为 3、4 时 y 为 8。以 2.5 切分后左右均值为 2、8，训练平方误差为零。</desc><rect width="760" height="330" rx="14" fill="#f9fbf8"/><text x="380" y="37" font-size="19" font-weight="600" fill="#263e47" text-anchor="middle">回归树叶节点：预测该叶样本目标值的平均</text><line x1="106" y1="262" x2="672" y2="262" stroke="#263e47" stroke-width="2" /><line x1="106" y1="262" x2="106" y2="63" stroke="#263e47" stroke-width="2" /><text x="75" y="72" font-size="17" font-weight="600" fill="#657b7d" text-anchor="middle">y</text><text x="685" y="283" font-size="17" font-weight="600" fill="#657b7d" text-anchor="middle">x</text><line x1="140" y1="224" x2="350" y2="224" stroke="#447c9d" stroke-width="4" /><line x1="416" y1="90" x2="650" y2="90" stroke="#c77a51" stroke-width="4" /><line x1="383" y1="62" x2="383" y2="275" stroke="#2b7d77" stroke-width="3" stroke-dasharray="8 6"/><text x="383" y="48" font-size="15" font-weight="600" fill="#2b7d77" text-anchor="middle">t=2.5</text><circle cx="210" cy="224" r="12" fill="#447c9d" stroke="white" stroke-width="2"/><text x="210" y="289" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">1</text><circle cx="332" cy="224" r="12" fill="#447c9d" stroke="white" stroke-width="2"/><text x="332" y="289" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">2</text><circle cx="454" cy="90" r="12" fill="#c77a51" stroke="white" stroke-width="2"/><text x="454" y="289" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">3</text><circle cx="576" cy="90" r="12" fill="#c77a51" stroke="white" stroke-width="2"/><text x="576" y="289" font-size="15" font-weight="600" fill="#263e47" text-anchor="middle">4</text><text x="250" y="202" font-size="15" font-weight="600" fill="#447c9d" text-anchor="middle">左叶均值 2</text><text x="544" y="70" font-size="15" font-weight="600" fill="#c77a51" text-anchor="middle">右叶均值 8</text><text x="380" y="320" font-size="15" font-weight="600" fill="#657b7d" text-anchor="middle">父节点均值 5；切分前 SSE = 36，切分后 SSE = 0</text></svg>