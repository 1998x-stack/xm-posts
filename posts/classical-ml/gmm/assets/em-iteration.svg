<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="EM 交替进行后验责任估计与加权参数更新，再监测对数似然"><title>EM 交替进行后验责任估计与加权参数更新，再监测对数似然</title><rect width="820" height="320" rx="14" fill="#fbfcfa"/>
<text x="39" y="36" font-size="18" fill="#25434a" font-weight="700">从潜变量的不确定性，迭代回参数</text>
<rect x="40" y="87" width="190" height="113" rx="12" fill="#e6f0f1" stroke="#2f7f8f" stroke-width="2"/>
<text x="60" y="120" font-size="18" fill="#25434a" font-weight="700">① E-step</text><text x="60" y="150" font-size="15" fill="#25434a">固定参数 θᵗ</text><text x="60" y="177" font-size="15" fill="#25434a">求责任 rᵢₖ</text>
<path d="M235 143H304" stroke="#729893" stroke-width="3"/><path d="M295 136l12 7-12 7" fill="none" stroke="#729893" stroke-width="3"/>
<rect x="310" y="87" width="190" height="113" rx="12" fill="#f8eee6" stroke="#be754d" stroke-width="2"/>
<text x="330" y="120" font-size="18" fill="#25434a" font-weight="700">② M-step</text><text x="330" y="150" font-size="15" fill="#25434a">固定责任 rᵢₖ</text><text x="330" y="177" font-size="15" fill="#25434a">更新 π, μ, Σ</text>
<path d="M505 143H569" stroke="#729893" stroke-width="3"/><path d="M560 136l12 7-12 7" fill="none" stroke="#729893" stroke-width="3"/>
<rect x="575" y="87" width="204" height="113" rx="12" fill="#eaf2e9" stroke="#4d8b72" stroke-width="2"/>
<text x="594" y="120" font-size="18" fill="#25434a" font-weight="700">③ 检查</text><text x="594" y="150" font-size="14" fill="#25434a">对数似然 ℓ(θ)</text><text x="594" y="177" font-size="14" fill="#25434a">收敛则停止</text>
<path d="M677 206V239H141V205" fill="none" stroke="#4d8b72" stroke-width="3" stroke-dasharray="9 6"/><path d="M134 216l7-13 7 13" fill="none" stroke="#4d8b72" stroke-width="3"/>
<text x="270" y="272" font-size="15" fill="#25434a">未收敛：用新 θ 重算后验</text>
</svg>
