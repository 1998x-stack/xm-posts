<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="km-f04-title km-f04-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif"><title id="km-f04-title">k-means++ 的 D 平方抽样</title><desc id="km-f04-desc">在0作为已选中心时，候选点1、2、3距离平方为1、4、9，下一中心选择概率为1/14、4/14、9/14。</desc><rect x="1" y="1" width="758" height="348" rx="12" fill="#fbfcfa" stroke="#dfebe5"/><text x="380" y="34" font-size="17" font-weight="650" fill="#253a42" text-anchor="middle">已有中心 c₁ = 0，下一中心按离最近中心的距离平方抽样</text><text x="79" y="95" font-size="18" font-weight="680" fill="#253a42" text-anchor="start">x = 1</text><rect x="190" y="77" width="40" height="34" rx="5" fill="#397f98" opacity=".84"/><text x="590" y="100" font-size="19" font-weight="750" fill="#397f98" text-anchor="start">1/14</text><text x="79" y="170" font-size="18" font-weight="680" fill="#253a42" text-anchor="start">x = 2</text><rect x="190" y="152" width="160" height="34" rx="5" fill="#dc8756" opacity=".84"/><text x="590" y="175" font-size="19" font-weight="750" fill="#dc8756" text-anchor="start">4/14</text><text x="79" y="245" font-size="18" font-weight="680" fill="#253a42" text-anchor="start">x = 3</text><rect x="190" y="227" width="360" height="34" rx="5" fill="#277a6f" opacity=".84"/><text x="590" y="250" font-size="19" font-weight="750" fill="#277a6f" text-anchor="start">9/14</text><text x="380" y="315" font-size="16" font-weight="700" fill="#277a6f" text-anchor="middle">采样权重 1 : 4 : 9；不是永远选择最远点</text></svg>
