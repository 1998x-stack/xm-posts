<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="knn-retrieval-title knn-retrieval-desc" data-export="knn-retrieval.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="knn-retrieval-title">精确 KNN 的预测规则与加速最近邻搜索的数据结构是两个层次</title><desc id="knn-retrieval-desc">精确 KNN 的预测规则与加速最近邻搜索的数据结构是两个层次。图为本文独立构造的教学数据，不是论文的实验结果。</desc><rect width="760" height="330" rx="12" fill="#f9fcfa"/><rect x="28" y="45" width="207" height="122" rx="12" fill="#e7f2ed" stroke="#b8d8c9"/><rect x="276" y="45" width="207" height="122" rx="12" fill="#eff5fa" stroke="#c2d6e1"/><rect x="524" y="45" width="207" height="122" rx="12" fill="#f9ede5" stroke="#ead4c3"/><text x="131" y="84" font-size="19" text-anchor="middle" font-weight="700" fill="#294c58">数据集</text><text x="131" y="116" font-size="14" text-anchor="middle" fill="#6b7f83">特征与标签</text><text x="379" y="84" font-size="19" text-anchor="middle" font-weight="700" fill="#294c58">邻居搜索</text><text x="379" y="114" font-size="14" text-anchor="middle" fill="#6b7f83">暴力 / KD / Ball</text><text x="627" y="84" font-size="19" text-anchor="middle" font-weight="700" fill="#294c58">预测聚合</text><text x="627" y="114" font-size="14" text-anchor="middle" fill="#6b7f83">投票 / 均值</text><path d="M235 104H271M483 104H519" stroke="#4f8880" stroke-width="3" fill="none"/><path d="M265 98l7 6-7 6M513 98l7 6-7 6" fill="none" stroke="#4f8880" stroke-width="2"/><rect x="47" y="219" width="670" height="69" rx="10" fill="#fff" stroke="#dbe7e2"/><text x="382" y="244" font-size="15" fill="#294c58" text-anchor="middle" font-weight="700">ANN / 向量索引改变的是「候选检索」阶段</text><text x="382" y="268" font-size="13" fill="#6b7f83" text-anchor="middle">近似搜索可以牺牲部分精确召回以换取速度；不等于改变 KNN 投票定义</text></svg>