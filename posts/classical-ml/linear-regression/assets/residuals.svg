="520" cy="74" r="8" fill="#367a97" stroke="white" stroke-width="3"/><text x="530" y="64" font-size="13" fill="#233d47">(3, 4)</text><rect x="352" y="40" width="265" height="67" rx="7" fill="#edf6f2"/><text x="370" y="67" font-size="17" font-weight="700" fill="#233d47">残差 r = 真实值 − 预测值</text><text x="370" y="89" font-size="14" fill="#587078">垂直线段长短决定平方误差</text></svg>
