<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="lgr-d1-title lgr-d1-desc"><title id="lgr-d1-title">线性分数转成类别概率</title><desc id="lgr-d1-desc">输入特征经过线性打分，Sigmoid 转换为概率，再按阈值决定类别。</desc><rect width="760" height="320" rx="12" fill="#fbfcfa"/>
<g font-family="sans-serif"><rect x="38" y="102" width="147" height="95" rx="13" fill="#e6f0ee" stroke="#bad8cd"/><text x="111" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#284750">输入特征</text><text x="111" y="171" text-anchor="middle" font-size="15" fill="#526e75">x ∈ ℝᵈ</text>
<path d="M186 150 H230" stroke="#567a78" stroke-width="3"/><path d="m222 143 9 7-9 7" fill="none" stroke="#567a78" stroke-width="3"/>
<rect x="231" y="102" width="149" height="95" rx="13" fill="#f8efe5" stroke="#e0b899"/><text x="305" y="142" text-anchor="middle" font-size="19" font-weight="700" fill="#8a5635">线性打分</text><text x="305" y="171" text-anchor="middle" font-size="16" fill="#8a5635">z = wᵀx+b</text>
<path d="M381 150 H425" stroke="#567a78" stroke-width="3"/><path d="m417 143 9 7-9 7" fill="none" stroke="#567a78" stroke-width="3"/>
<rect x="426" y="102" width="149" height="95" rx="13" fill="#e3f1ec" stroke="#a3d5c6"/><text x="500" y="142" text-anchor="middle" font-size="19" font-weight="700" fill="#176d67">Sigmoid</text><text x="500" y="171" text-anchor="middle" font-size="16" fill="#176d67">0 &lt; p &lt; 1</text>
<path d="M576 150 H620" stroke="#567a78" stroke-width="3"/><path d="m612 143 9 7-9 7" fill="none" stroke="#567a78" stroke-width="3"/>
<rect x="620" y="102" width="107" height="95" rx="13" fill="#e4eef7" stroke="#b6d3e1"/><text x="673" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#2f6e86">阈值决策</text><text x="673" y="167" text-anchor="middle" font-size="14" fill="#2f6e86">p ≥ t ?</text>
<text x="380" y="55" text-anchor="middle" font-size="25" font-weight="700" fill="#284750">分类器预测的是条件概率</text><text x="380" y="260" text-anchor="middle" font-size="16" fill="#5f7780">阈值只作用在推断决策；训练通常直接优化概率损失，而非硬阈值</text></g></svg>
