<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="lgr-d6-title lgr-d6-desc"><title id="lgr-d6-title">从二分类推广到 K 类 Softmax</title><desc id="lgr-d6-desc">K 个线性得分按指数归一化得到和为一的类别分布；并非逐类独立 Sigmoid。</desc><rect width="760" height="320" rx="12" fill="#fbfcfa"/>
