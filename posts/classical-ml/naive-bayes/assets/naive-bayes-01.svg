<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="nb-01-title nb-01-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="nb-01-title">一封短信被拆成词证据</title><desc id="nb-01-desc">以 free、offer 为线索，在两类文档词频中计数，然后比较后验分数。</desc><rect width="760" height="320" rx="12" fill="#fbfcfa"/><rect x="34" y="72" width="196" height="184" rx="12" fill="#edf4f0" stroke="#d8e4de" stroke-width="1.5"/><text x="132" y="104" text-anchor="middle" font-size="16" font-weight="600" fill="#29444b">新消息：</text><text x="132" y="147" text-anchor="middle" font-size="23" font-weight="750" fill="#24786d">free offer</text><text x="132" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#607978">→ 分词计数</text><line x1="231" y1="161" x2="278" y2="161" stroke="#6e9e94" stroke-width="3" /><rect x="278" y="69" width="205" height="188" rx="12" fill="#fff" stroke="#d8e4de" stroke-width="1.5"/><text x="380" y="103" text-anchor="middle" font-size="17" font-weight="600" fill="#29444b">词频证据</text><text x="380" y="144" text-anchor="middle" font-size="18" font-weight="600" fill="#27796f">free × 1</text><text x="380" y="185" text-anchor="middle" font-size="18" font-weight="600" fill="#27796f">offer × 1</text><line x1="484" y1="161" x2="530" y2="161" stroke="#6e9e94" stroke-width="3" /><rect x="530" y="89" width="202" height="62" rx="12" fill="#e0f1e8" stroke="#97cbb4" stroke-width="1.5"/><rect x="530" y="169" width="202" height="62" rx="12" fill="#fcebdd" stroke="#e6bd9a" stroke-width="1.5"/><text x="631" y="126" text-anchor="middle" font-size="17" font-weight="750" fill="#206b64">推广类  12 : 1</text><text x="631" y="206" text-anchor="middle" font-size="17" font-weight="750" fill="#a7603d">工作类  1 : 12</text><text x="382" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#607976">两类得分比较 · 比值来自本文教学语料</text></svg>
