<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322" role="img" aria-labelledby="nb-02-title nb-02-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="nb-02-title">条件独立的朴素贝叶斯图模型</title><desc id="nb-02-desc">类别 C 作为共同父节点，分别生成 free、offer、meeting 三个观察特征。</desc><rect width="760" height="322" rx="12" fill="#fbfcfa"/><rect x="280" y="22" width="200" height="64" rx="12" fill="#d9eee6" stroke="#8cc5b2" stroke-width="1.5"/><text x="380" y="62" text-anchor="middle" font-size="21" font-weight="750" fill="#1e6d62">类别 C</text><line x1="380" y1="86" x2="158" y2="172" stroke="#84a7a0" stroke-width="3" /><line x1="380" y1="86" x2="380" y2="172" stroke="#84a7a0" stroke-width="3" /><line x1="380" y1="86" x2="601" y2="172" stroke="#84a7a0" stroke-width="3" /><rect x="50" y="172" width="216" height="82" rx="12" fill="#eaf2f6" stroke="#c6dce7" stroke-width="1.5"/><rect x="272" y="172" width="216" height="82" rx="12" fill="#eaf2f6" stroke="#c6dce7" stroke-width="1.5"/><rect x="494" y="172" width="216" height="82" rx="12" fill="#eaf2f6" stroke="#c6dce7" stroke-width="1.5"/><text x="158" y="220" text-anchor="middle" font-size="24" font-weight="600" fill="#316b86">free</text><text x="380" y="220" text-anchor="middle" font-size="24" font-weight="600" fill="#316b86">offer</text><text x="601" y="220" text-anchor="middle" font-size="24" font-weight="600" fill="#316b86">meeting</text><text x="380" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="#637b7c">假设：给定类别后，每个特征单独提供证据</text></svg>
