<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" role="img" aria-labelledby="nb-03-title nb-03-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="nb-03-title">多项式与伯努利事件模型的区别</title><desc id="nb-03-desc">重复出现的 free 让多项式模型的词频变大；伯努利只记录词是否出现，同时考虑其他词缺席。</desc><rect width="760" height="328" rx="12" fill="#fbfcfa"/><rect x="30" y="52" width="333" height="220" rx="12" fill="#eef4ef" stroke="#d8e4de" stroke-width="1.5"/><rect x="398" y="52" width="333" height="220" rx="12" fill="#f9f0e8" stroke="#d8e4de" stroke-width="1.5"/><text x="196" y="88" text-anchor="middle" font-size="21" font-weight="750" fill="#286c6a">Multinomial</text><text x="565" y="88" text-anchor="middle" font-size="21" font-weight="750" fill="#a76343">Bernoulli</text><text x="196" y="141" text-anchor="middle" font-size="19" font-weight="600" fill="#29494f">free  free  meeting</text><text x="196" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#286c6a">free : 2    meeting : 1</text><text x="196" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#637b7c">保留重复次数</text><text x="565" y="141" text-anchor="middle" font-size="19" font-weight="600" fill="#29494f">free  free  meeting</text><text x="565" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#a76343">free : 1    meeting : 1</text><text x="565" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#637b7c">出现 = 1，缺席 = 0</text><text x="380" y="307" text-anchor="middle" font-size="13" font-weight="600" fill="#526c70">两者是不同的事件模型，不能把伯努利当作词频归一化</text></svg>
