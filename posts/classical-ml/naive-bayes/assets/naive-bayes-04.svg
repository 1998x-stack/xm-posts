<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="nb-04-title nb-04-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="nb-04-title">加法平滑如何防止零似然</title><desc id="nb-04-desc">工作类的 free 词频为零；alpha 等于一时，从 0/9 变成 1/17，分母是 9 加 8。</desc><rect width="760" height="310" rx="12" fill="#fbfcfa"/><rect x="55" y="72" width="295" height="170" rx="12" fill="#fbece5" stroke="#e9c5ac" stroke-width="1.5"/><rect x="410" y="72" width="295" height="170" rx="12" fill="#e6f1eb" stroke="#a9d0bd" stroke-width="1.5"/><text x="201" y="112" text-anchor="middle" font-size="19" font-weight="600" fill="#a35d43">未平滑（α = 0）</text><text x="201" y="169" text-anchor="middle" font-size="23" font-weight="600" fill="#a35d43">P(free | 工作) = 0</text><text x="201" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#896d5d">一票否决整个乘积</text><text x="557" y="112" text-anchor="middle" font-size="19" font-weight="600" fill="#2d796e">Laplace（α = 1）</text><text x="557" y="169" text-anchor="middle" font-size="22" font-weight="600" fill="#27766e">P(free | 工作) = 1/17</text><text x="557" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#5b7c74">未见过 ≠ 不可能</text><text x="380" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#587578">教学语料：工作类 9 个词位，词表大小 8</text></svg>
