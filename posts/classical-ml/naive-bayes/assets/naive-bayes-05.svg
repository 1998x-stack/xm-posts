<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" role="img" aria-labelledby="nb-05-title nb-05-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="nb-05-title">对数域将相乘变成相加</title><desc id="nb-05-desc">free 贡献 log4，offer 贡献 log3，在等先验条件下总 log odds 为 log12。</desc><rect width="760" height="302" rx="12" fill="#fbfcfa"/><rect x="24" y="77" width="204" height="145" rx="12" fill="#e9f2ee" stroke="#d8e4de" stroke-width="1.5"/><rect x="278" y="77" width="204" height="145" rx="12" fill="#e9f2ee" stroke="#d8e4de" stroke-width="1.5"/><rect x="532" y="77" width="204" height="145" rx="12" fill="#dceee4" stroke="#9bc6b1" stroke-width="1.5"/><text x="126" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#356a68">free 的对数证据</text><text x="126" y="164" text-anchor="middle" font-size="29" font-weight="750" fill="#21776a">ln 4</text><text x="380" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#356a68">offer 的对数证据</text><text x="380" y="164" text-anchor="middle" font-size="29" font-weight="750" fill="#21776a">ln 3</text><text x="634" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#356a68">后验对数优势</text><text x="634" y="164" text-anchor="middle" font-size="29" font-weight="750" fill="#21776a">ln 12</text><text x="252" y="161" text-anchor="middle" font-size="28" font-weight="600" fill="#77978f">+</text><text x="506" y="161" text-anchor="middle" font-size="28" font-weight="600" fill="#77978f">=</text><text x="380" y="267" text-anchor="middle" font-size="15" font-weight="600" fill="#557475">从小概率连乘变成数值稳定的 log-sum</text></svg>
