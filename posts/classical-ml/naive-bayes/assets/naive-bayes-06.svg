<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 309" width="760" height="309" role="img" aria-labelledby="nb-06-title nb-06-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="nb-06-title">相关线索可能造成重复计数</title><desc id="nb-06-desc">free 与 complimentary 如果来自相同促销模板，两者并非独立证据；朴素贝叶斯可能把同一原因计算两次。</desc><rect width="760" height="309" rx="12" fill="#fbfcfa"/><rect x="50" y="53" width="279" height="170" rx="12" fill="#e8f2f5" stroke="#bedbe5" stroke-width="1.5"/><rect x="432" y="53" width="279" height="170" rx="12" fill="#fceee3" stroke="#e4c5a8" stroke-width="1.5"/><text x="190" y="98" text-anchor="middle" font-size="17" font-weight="600" fill="#346c83">潜在原因：促销模板</text><text x="190" y="153" text-anchor="middle" font-size="18" font-weight="600" fill="#346c83">free + complimentary</text><text x="190" y="197" text-anchor="middle" font-size="14" font-weight="600" fill="#637a86">高度相关的两个词</text><text x="570" y="98" text-anchor="middle" font-size="17" font-weight="600" fill="#a05b3e">朴素乘积</text><text x="570" y="153" text-anchor="middle" font-size="20" font-weight="600" fill="#a05b3e">证据 × 证据</text><text x="570" y="197" text-anchor="middle" font-size="14" font-weight="600" fill="#926d56">后验可能过度自信</text><line x1="332" y1="138" x2="429" y2="138" stroke="#a7a39a" stroke-width="3" /><text x="380" y="281" text-anchor="middle" font-size="14" font-weight="600" fill="#596f73">分类边界可能仍然有效，但概率校准需要另行检验</text></svg>
