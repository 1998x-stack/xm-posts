<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="从协方差特征分解走向SVD"><title>从协方差特征分解走向SVD</title><desc>中心化数据矩阵A等于U乘Sigma乘V转置，特征空间主方向在V的列中。</desc><rect width="760" height="340" rx="12" fill="#fcfdfb"/><rect x="75" y="74" width="115" height="191" rx="8" fill="#dcefe7" stroke="#b5d2ca"/><text x="132" y="161" font-size="38" fill="#245a63" text-anchor="middle">A</text><text x="132" y="195" font-size="15" fill="#56777d" text-anchor="middle">n × d</text><rect x="268" y="74" width="115" height="191" rx="8" fill="#e1edf4" stroke="#b5d2ca"/><text x="325" y="161" font-size="38" fill="#245a63" text-anchor="middle">U</text><text x="325" y="195" font-size="15" fill="#56777d" text-anchor="middle">n × r</text><rect x="444" y="74" width="115" height="191" rx="8" fill="#fae9df" stroke="#b5d2ca"/><text x="501" y="161" font-size="38" fill="#245a63" text-anchor="middle">Σ</text><text x="501" y="195" font-size="15" fill="#56777d" text-anchor="middle">r × r</text><rect x="600" y="74" width="115" height="191" rx="8" fill="#e3f2ec" stroke="#b5d2ca"/><text x="657" y="161" font-size="38" fill="#245a63" text-anchor="middle">Vᵀ</text><text x="657" y="195" font-size="15" fill="#56777d" text-anchor="middle">r × d</text><text x="216" y="166" font-size="16" fill="#30565d">=</text><text x="401" y="166" font-size="16" fill="#30565d">×</text><text x="565" y="166" font-size="16" fill="#30565d">×</text><text x="92" y="306" font-size="16" fill="#30565d">右奇异向量 = 主轴；奇异值的平方 ∝ 解释方差</text></svg>