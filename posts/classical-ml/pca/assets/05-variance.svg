<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="四点算例解释方差80百分比"><title>四点算例解释方差80百分比</title><desc>第一根主轴解释80%的总方差，第二根解释剩余20%，此数据是教学构造。</desc><rect width="760" height="340" rx="12" fill="#fcfdfb"/><line x1="126" y1="271" x2="646" y2="271" stroke="#83aaa2" stroke-width="3"/><line x1="126" y1="271" x2="126" y2="35" stroke="#83aaa2" stroke-width="3"/><rect x="215" y="91" width="104" height="180" fill="#d08a5f" rx="8"/><text x="267" y="74" text-anchor="middle" font-size="28" fill="#2e5860">80%</text><rect x="445" y="226" width="104" height="45" fill="#79b9aa" rx="8"/><text x="497" y="209" text-anchor="middle" font-size="28" fill="#2e5860">20%</text><text x="248" y="302" font-size="16" fill="#30565d">PC₁</text><text x="477" y="302" font-size="16" fill="#30565d">PC₂</text><text x="45" y="52" font-size="16" fill="#30565d">100%</text><text x="64" y="271" font-size="16" fill="#30565d">0%</text></svg>