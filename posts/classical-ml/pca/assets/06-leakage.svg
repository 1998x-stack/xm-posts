<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="先切分再拟合PCA的数据处理流程"><title>先切分再拟合PCA的数据处理流程</title><desc>先划分训练测试集，均值和主轴都只从训练集学习。测试集只调用transform。</desc><rect width="760" height="340" rx="12" fill="#fcfdfb"/><rect x="23" y="116" width="141" height="99" rx="9" fill="#e4f0ec" stroke="#afcfc5"/><text x="93" y="171" font-size="15" fill="#2a5860" text-anchor="middle">原始数据</text><rect x="214" y="116" width="141" height="99" rx="9" fill="#e4f0ec" stroke="#afcfc5"/><text x="284" y="171" font-size="15" fill="#2a5860" text-anchor="middle">划分数据</text><rect x="409" y="116" width="141" height="99" rx="9" fill="#f7e8dd" stroke="#afcfc5"/><text x="479" y="171" font-size="15" fill="#2a5860" text-anchor="middle">训练 fit PCA</text><rect x="601" y="116" width="141" height="99" rx="9" fill="#e3f3eb" stroke="#afcfc5"/><text x="671" y="171" font-size="15" fill="#2a5860" text-anchor="middle">测试 transform</text><line x1="164" y1="168" x2="212" y2="168" stroke="#83aaa2" stroke-width="3"/><line x1="355" y1="168" x2="407" y2="168" stroke="#c47851" stroke-width="3"/><line x1="552" y1="168" x2="599" y2="168" stroke="#2a9584" stroke-width="3"/><text x="55" y="75" font-size="16" fill="#30565d">错误：对完整数据拟合 PCA，再切分</text><text x="60" y="280" font-size="16" fill="#30565d">正确：训练集 fit；验证 / 测试集 transform</text></svg>