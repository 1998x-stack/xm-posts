<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="svm-d1-title svm-d1-desc" width="760" height="350" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="svm-d1-title">两条都能分类的分隔线</title><desc id="svm-d1-desc">蓝色负类在左、橙色正类在右。最大间隔方案离左右最近样本更远，支持向量有绿色外圈。</desc><rect width="760" height="350" rx="12" fill="#fbfcfa"/><rect x="286" y="55" width="186" height="240" fill="#e5f0eb" opacity=".65"/><line x1="286" y1="54" x2="286" y2="300" stroke="#2e827a" stroke-width="2" stroke-dasharray="8 7"/><line x1="472" y1="54" x2="472" y2="300" stroke="#2e827a" stroke-width="2" stroke-dasharray="8 7"/><line x1="379" y1="48" x2="379" y2="308" stroke="#263b43" stroke-width="4" /><line x1="307" y1="50" x2="433" y2="308" stroke="#b9a282" stroke-width="3" stroke-dasharray="9 9"/><circle cx="110" cy="90" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="160" cy="160" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="286" cy="136" r="16" fill="none" stroke="#2e827a" stroke-width="2.5"/><circle cx="286" cy="136" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="145" cy="260" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="240" cy="240" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="220" cy="95" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="472" cy="213" r="16" fill="none" stroke="#2e827a" stroke-width="2.5"/><circle cx="472" cy="213" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="550" cy="100" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="620" cy="165" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="555" cy="255" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="625" cy="275" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="525" cy="290" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><text x="380" y="32" fill="#263b43" font-size="17" font-weight="700" text-anchor="middle">最大间隔分隔线</text><text x="433" y="319" fill="#93764f" font-size="13" font-weight="600" text-anchor="middle">另一条也能分开，但余量更小</text><text x="194" y="335" fill="#397b91" font-size="15" font-weight="700" text-anchor="middle">−1 类</text><text x="575" y="335" fill="#cc7750" font-size="15" font-weight="700" text-anchor="middle">+1 类</text><text x="379" y="175" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">f(x)=0</text></svg>