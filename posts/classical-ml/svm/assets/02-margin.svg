<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" role="img" aria-labelledby="svm-d2-title svm-d2-desc" width="760" height="366" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="svm-d2-title">支持向量决定几何间隔</title><desc id="svm-d2-desc">决策面 f(x)=0 居中，支持向量位于 f(x)=-1 和 f(x)=+1 的边界上，间隔总宽 2 除以 w 的范数。</desc><rect width="760" height="366" rx="12" fill="#fbfcfa"/><rect x="266" y="58" width="228" height="245" fill="#e5f1eb"/><line x1="266" y1="55" x2="266" y2="310" stroke="#2e827a" stroke-width="2.5" stroke-dasharray="8 7"/><line x1="380" y1="55" x2="380" y2="310" stroke="#263b43" stroke-width="4" /><line x1="494" y1="55" x2="494" y2="310" stroke="#2e827a" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="266" cy="155" r="19" fill="none" stroke="#2e827a" stroke-width="2.5"/><circle cx="266" cy="155" r="12" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="494" cy="220" r="19" fill="none" stroke="#2e827a" stroke-width="2.5"/><circle cx="494" cy="220" r="12" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="160" cy="110" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="178" cy="240" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="608" cy="130" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="570" cy="280" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><line x1="266" y1="322" x2="494" y2="322" stroke="#2e827a" stroke-width="2" /><line x1="266" y1="315" x2="266" y2="329" stroke="#2e827a" stroke-width="2" /><line x1="494" y1="315" x2="494" y2="329" stroke="#2e827a" stroke-width="2" /><text x="380" y="347" fill="#2e827a" font-size="15" font-weight="700" text-anchor="middle">总间隔宽度 = 2 / ||w||</text><text x="266" y="42" fill="#397b91" font-size="15" font-weight="650" text-anchor="middle">f(x) = −1</text><text x="380" y="42" fill="#263b43" font-size="15" font-weight="700" text-anchor="middle">f(x) = 0</text><text x="494" y="42" fill="#cc7750" font-size="15" font-weight="650" text-anchor="middle">f(x) = +1</text></svg>