<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="svm-d3-title svm-d3-desc" width="760" height="352" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="svm-d3-title">软间隔中的三种样本</title><desc id="svm-d3-desc">右侧是正类区域；正类样本在间隔外无损失、在间隔内但分类正确会产生损失、落到错误一侧产生更大损失。</desc><rect width="760" height="352" rx="12" fill="#fbfcfa"/><rect x="283" y="45" width="194" height="260" fill="#e6f0eb"/><line x1="283" y1="40" x2="283" y2="312" stroke="#2e827a" stroke-width="2" stroke-dasharray="7 7"/><line x1="380" y1="40" x2="380" y2="312" stroke="#263b43" stroke-width="3" /><line x1="477" y1="40" x2="477" y2="312" stroke="#2e827a" stroke-width="2" stroke-dasharray="7 7"/><circle cx="560" cy="100" r="13" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="431" cy="180" r="13" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="318" cy="260" r="13" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><line x1="431" y1="195" x2="477" y2="195" stroke="#cc7750" stroke-width="2" /><line x1="318" y1="278" x2="477" y2="278" stroke="#cc7750" stroke-width="2" /><text x="561" y="67" fill="#cc7750" font-size="17" font-weight="750" text-anchor="middle">ξ = 0</text><text x="415" y="150" fill="#cc7750" font-size="15" font-weight="750" text-anchor="middle">0 &lt; ξ &lt; 1</text><text x="316" y="230" fill="#cc7750" font-size="15" font-weight="750" text-anchor="middle">ξ &gt; 1</text><text x="160" y="110" fill="#70828b" font-size="14" font-weight="600" text-anchor="middle">间隔外</text><text x="158" y="190" fill="#70828b" font-size="14" font-weight="600" text-anchor="middle">间隔内</text><text x="158" y="270" fill="#70828b" font-size="14" font-weight="600" text-anchor="middle">错分</text><text x="380" y="333" fill="#263b43" font-size="14" font-weight="600" text-anchor="middle">错误不被隐藏：用 ξ 记录违反间隔约束的程度</text></svg>