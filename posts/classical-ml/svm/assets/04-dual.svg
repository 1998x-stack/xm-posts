<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="svm-d4-title svm-d4-desc" width="760" height="350" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="svm-d4-title">从训练点到支持向量的双重形式</title><desc id="svm-d4-desc">拉格朗日乘子将权重 w 表示为训练点的加权和，只有非零乘子的支持向量直接进入决策函数。</desc><rect width="760" height="350" rx="12" fill="#fbfcfa"/><rect x="30" y="75" width="188" height="204" rx="12" fill="#edf3f5" stroke="#d4e3e8"/><rect x="286" y="75" width="188" height="204" rx="12" fill="#e7f2ee" stroke="#c8e2d7"/><rect x="542" y="75" width="188" height="204" rx="12" fill="#f9efe8" stroke="#f2d9c7"/><text x="124" y="110" fill="#263b43" font-size="18" font-weight="700" text-anchor="middle">全部训练样本</text><text x="380" y="110" fill="#263b43" font-size="18" font-weight="700" text-anchor="middle">αᵢ &gt; 0 的点</text><text x="636" y="110" fill="#263b43" font-size="18" font-weight="700" text-anchor="middle">预测新样本</text><circle cx="73" cy="152" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="102" cy="184" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="145" cy="159" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="168" cy="216" r="9" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="95" cy="235" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="145" cy="235" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="172" cy="143" r="9" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="345" cy="167" r="18" fill="none" stroke="#2e827a" stroke-width="2.5"/><circle cx="345" cy="167" r="11" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="412" cy="210" r="18" fill="none" stroke="#2e827a" stroke-width="2.5"/><circle cx="412" cy="210" r="11" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><text x="380" y="258" fill="#2e827a" font-size="14" font-weight="700" text-anchor="middle">支持向量</text><text x="636" y="174" fill="#263b43" font-size="15" font-weight="650" text-anchor="middle">f(x) = Σ αᵢyᵢK(xᵢ,x)+b</text><text x="636" y="225" fill="#cc7750" font-size="18" font-weight="750" text-anchor="middle">sign(f(x))</text><line x1="224" y1="175" x2="278" y2="175" stroke="#2e827a" stroke-width="3" /><text x="250" y="160" fill="#2e827a" font-size="12" font-weight="700" text-anchor="middle">求解 α</text><line x1="480" y1="175" x2="534" y2="175" stroke="#2e827a" stroke-width="3" /><text x="507" y="160" fill="#2e827a" font-size="12" font-weight="700" text-anchor="middle">核求和</text><text x="380" y="330" fill="#70828b" font-size="15" font-weight="600" text-anchor="middle">非支持向量的 αᵢ = 0，因此不进入预测求和</text></svg>