<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="svm-d5-title svm-d5-desc" width="760" height="320" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="svm-d5-title">非线性映射后可以线性分离</title><desc id="svm-d5-desc">一维 x 轴上左右两端为正类、中间为负类；映射到 phi(x)=x 的平方后，在新轴上可用一个阈值区分。</desc><rect width="760" height="320" rx="12" fill="#fbfcfa"/><rect x="34" y="48" width="306" height="245" rx="10" fill="#edf3f5"/><rect x="420" y="48" width="306" height="245" rx="10" fill="#f4f0e9"/><text x="187" y="82" fill="#263b43" font-size="18" font-weight="750" text-anchor="middle">原始空间 x</text><text x="573" y="82" fill="#263b43" font-size="18" font-weight="750" text-anchor="middle">特征空间 φ(x)=x²</text><line x1="73" y1="188" x2="303" y2="188" stroke="#263b43" stroke-width="2" /><line x1="452" y1="188" x2="690" y2="188" stroke="#263b43" stroke-width="2" /><circle cx="90" cy="188" r="10" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><text x="90" y="219" fill="#70828b" font-size="13" font-weight="650" text-anchor="middle">-2</text><circle cx="140" cy="188" r="10" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><text x="140" y="219" fill="#70828b" font-size="13" font-weight="650" text-anchor="middle">-1</text><circle cx="188" cy="188" r="10" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><text x="188" y="219" fill="#70828b" font-size="13" font-weight="650" text-anchor="middle">0</text><circle cx="236" cy="188" r="10" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><text x="236" y="219" fill="#70828b" font-size="13" font-weight="650" text-anchor="middle">1</text><circle cx="285" cy="188" r="10" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><text x="285" y="219" fill="#70828b" font-size="13" font-weight="650" text-anchor="middle">2</text><circle cx="478" cy="188" r="10" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="518" cy="188" r="10" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="560" cy="188" r="10" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="603" cy="188" r="10" fill="#397b91" stroke="#fffdf9" stroke-width="2"/><circle cx="675" cy="188" r="10" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><circle cx="681" cy="188" r="10" fill="#cc7750" stroke="#fffdf9" stroke-width="2"/><line x1="624" y1="122" x2="624" y2="244" stroke="#2e827a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="624" y="115" fill="#2e827a" font-size="14" font-weight="700" text-anchor="middle">阈值 = 2</text><text x="188" y="258" fill="#70828b" font-size="14" font-weight="600" text-anchor="middle">需要两侧阈值才能分开</text><text x="573" y="258" fill="#70828b" font-size="14" font-weight="600" text-anchor="middle">一个线性阈值足够</text><line x1="347" y1="166" x2="412" y2="166" stroke="#2e827a" stroke-width="3" /><text x="379" y="150" fill="#2e827a" font-size="14" font-weight="750" text-anchor="middle">映射</text></svg>