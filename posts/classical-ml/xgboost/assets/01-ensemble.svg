<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="xgb-01-t xgb-01-d"><title id="xgb-01-t">树提升的加性路径</title><desc id="xgb-01-d">一棵树给出原始分数，下一棵树给出连续修正项，最终分数相加。</desc><rect width="800" height="350" rx="14" fill="#fbfdfb"/><rect x="55" y="105" width="188" height="95" rx="12" fill="#e8f4ef" stroke="#cedfd9"/><text x="149" y="158.5" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">Tree 1：−0.40</text><rect x="303" y="105" width="188" height="95" rx="12" fill="#fff0df" stroke="#cedfd9"/><text x="397" y="158.5" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">Tree 2：+0.12</text><rect x="555" y="105" width="187" height="95" rx="12" fill="#e9f0fa" stroke="#cedfd9"/><text x="648.5" y="158.5" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">合计：−0.28</text><path d="M249 153L295 153" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="295" cy="153" r="4" fill="#63837f"/><path d="M497 153L547 153" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="547" cy="153" r="4" fill="#63837f"/><text x="400" y="67" text-anchor="middle" font-size="19" fill="#4c686b">逐轮训练的新树在旧预测上添加修正，而不是投票</text><text x="400" y="275" text-anchor="middle" font-size="17" fill="#4c686b">示例为模型 raw score，未执行概率链接函数</text></svg>