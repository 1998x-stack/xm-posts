<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="xgb-02-t xgb-02-d"><title id="xgb-02-t">二阶统计量求叶子值</title><desc id="xgb-02-d">梯度与 Hessian 聚合成左、右叶，叶子最优分数等于负梯度和除以 Hessian 和加正则项。</desc><rect width="800" height="350" rx="14" fill="#fbfdfb"/><rect x="31" y="91" width="220" height="90" rx="12" fill="#e9f0fa" stroke="#cedfd9"/><text x="141" y="142" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">左：G=+1，H=2</text><rect x="31" y="207" width="220" height="90" rx="12" fill="#fff0df" stroke="#cedfd9"/><text x="141" y="258" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">右：G=−1，H=2</text><rect x="322" y="135" width="175" height="91" rx="12" fill="#e8f4ef" stroke="#cedfd9"/><text x="409.5" y="186.5" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">λ=1，H+λ=3</text><rect x="571" y="91" width="199" height="90" rx="12" fill="#e9f0fa" stroke="#cedfd9"/><text x="670.5" y="142" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">w左 = −1/3</text><rect x="571" y="207" width="199" height="90" rx="12" fill="#fff0df" stroke="#cedfd9"/><text x="670.5" y="258" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">w右 = +1/3</text><path d="M255 133L316 171" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="316" cy="171" r="4" fill="#63837f"/><path d="M255 250L316 194" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="316" cy="194" r="4" fill="#63837f"/><path d="M501 174L564 133" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="564" cy="133" r="4" fill="#63837f"/><path d="M501 197L564 250" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="564" cy="250" r="4" fill="#63837f"/><text x="403" y="45" text-anchor="middle" font-size="19" fill="#4c686b">固定结构后，叶子内每条样本只需累加 g 与 h</text></svg>