<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="xgb-03-t xgb-03-d"><title id="xgb-03-t">父叶拆分带来的目标下降</title><desc id="xgb-03-d">左叶和右叶二阶得分之和与父叶得分作差，并减去额外叶子惩罚 gamma。</desc><rect width="800" height="350" rx="14" fill="#fbfdfb"/><rect x="50" y="113" width="223" height="107" rx="12" fill="#e9f0fa" stroke="#cedfd9"/><text x="161.5" y="172.5" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">父叶：G=0，H=4</text><rect x="469" y="63" width="267" height="88" rx="12" fill="#e8f4ef" stroke="#cedfd9"/><text x="602.5" y="113" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">左叶：G=+1，H=2</text><rect x="469" y="186" width="267" height="88" rx="12" fill="#fff0df" stroke="#cedfd9"/><text x="602.5" y="236" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">右叶：G=−1，H=2</text><path d="M278 166L460 108" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="460" cy="108" r="4" fill="#63837f"/><path d="M278 166L460 229" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="460" cy="229" r="4" fill="#63837f"/><text x="390" y="43" text-anchor="middle" font-size="20" fill="#4c686b">增加一次分裂需要超过 γ 的收益</text><text x="397" y="320" text-anchor="middle" font-size="18" fill="#4c686b">Gain = 1/2 × (新叶项 − 父叶项) − γ</text></svg>