<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="xgb-04-t xgb-04-d"><title id="xgb-04-t">缺失样本的默认分支</title><desc id="xgb-04-d">固定阈值后分别计算缺失值走左和走右的增益，节点选择得分更好的方向。</desc><rect width="800" height="350" rx="14" fill="#fbfdfb"/><rect x="41" y="73" width="328" height="80" rx="12" fill="#e8f4ef" stroke="#cedfd9"/><text x="205" y="119" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">候选 A：missing → 左</text><rect x="431" y="73" width="328" height="80" rx="12" fill="#fff0df" stroke="#cedfd9"/><text x="595" y="119" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">候选 B：missing → 右</text><rect x="64" y="205" width="128" height="66" rx="12" fill="#e9f0fa" stroke="#cedfd9"/><text x="128" y="244" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">左 + 缺失</text><rect x="226" y="205" width="128" height="66" rx="12" fill="#fff0df" stroke="#cedfd9"/><text x="290" y="244" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">右</text><rect x="454" y="205" width="128" height="66" rx="12" fill="#e9f0fa" stroke="#cedfd9"/><text x="518" y="244" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">左</text><rect x="616" y="205" width="128" height="66" rx="12" fill="#fff0df" stroke="#cedfd9"/><text x="680" y="244" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">右 + 缺失</text><path d="M205 157L125 198" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="125" cy="198" r="4" fill="#63837f"/><path d="M205 157L286 198" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="286" cy="198" r="4" fill="#63837f"/><path d="M594 157L516 198" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="516" cy="198" r="4" fill="#63837f"/><path d="M594 157L674 198" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="674" cy="198" r="4" fill="#63837f"/><text x="400" y="322" text-anchor="middle" font-size="17" fill="#4c686b">只遍历非缺失特征项，比较两个默认方向的 Gain</text></svg>