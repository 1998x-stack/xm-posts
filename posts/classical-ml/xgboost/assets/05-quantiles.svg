<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="xgb-05-t xgb-05-d"><title id="xgb-05-t">Hessian 权重影响候选分位点</title><desc id="xgb-05-d">不同样本贡献不同 Hessian 质量，候选阈值按权重累计提出，而非只按样本计数。</desc><rect width="800" height="350" rx="14" fill="#fbfdfb"/><text x="400" y="47" text-anchor="middle" font-size="21" fill="#4c686b">按累计 Hessian 权重提出候选切分点</text><path d="M80 236L720 236" stroke="#375d67" stroke-width="3"/><circle cx="120" cy="236" r="10" fill="#3b7c98" opacity=".87"/><circle cx="210" cy="236" r="11" fill="#3b7c98" opacity=".87"/><circle cx="290" cy="236" r="19" fill="#bd794e" opacity=".87"/><circle cx="375" cy="236" r="10" fill="#3b7c98" opacity=".87"/><circle cx="475" cy="236" r="27" fill="#bd794e" opacity=".87"/><circle cx="560" cy="236" r="12" fill="#3b7c98" opacity=".87"/><circle cx="650" cy="236" r="23" fill="#bd794e" opacity=".87"/><path d="M330 95L330 228 M524 95L524 228" stroke="#238179" stroke-dasharray="8 7" stroke-width="3"/><text x="331" y="84" text-anchor="middle" font-size="17" fill="#4c686b">候选 1</text><text x="524" y="84" text-anchor="middle" font-size="17" fill="#4c686b">候选 2</text><text x="400" y="308" text-anchor="middle" font-size="16" fill="#4c686b">圆的面积表示教学假设的 h 权重，不是原论文的数据图</text></svg>