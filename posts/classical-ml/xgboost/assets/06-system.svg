<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="xgb-06-t xgb-06-d"><title id="xgb-06-t">从排序列块到可扩展训练</title><desc id="xgb-06-d">磁盘上列块依次预取解压入内存，利用排序后的连续扫描并行积累统计量。</desc><rect width="800" height="350" rx="14" fill="#fbfdfb"/><rect x="34" y="85" width="201" height="176" rx="12" fill="#e9f0fa" stroke="#cedfd9"/><text x="134.5" y="179" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">磁盘列块 / 压缩</text><rect x="298" y="85" width="201" height="176" rx="12" fill="#e8f4ef" stroke="#cedfd9"/><text x="398.5" y="179" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">预取 / 解压 / 缓存</text><rect x="562" y="85" width="201" height="176" rx="12" fill="#fff0df" stroke="#cedfd9"/><text x="662.5" y="179" font-size="17" font-weight="650" text-anchor="middle" fill="#24444a">并行列扫描 / 分裂</text><path d="M240 173L290 173" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="290" cy="173" r="4" fill="#63837f"/><path d="M503 173L554 173" stroke="#63837f" stroke-width="3" fill="none"/><circle cx="554" cy="173" r="4" fill="#63837f"/><text x="402" y="47" text-anchor="middle" font-size="19" fill="#4c686b">算法、内存布局与磁盘 IO 协同决定训练吞吐</text><text x="401" y="318" text-anchor="middle" font-size="17" fill="#4c686b">大数据时，避免反复排序、无谓遍历与同步等待</text></svg>