<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 920 310" aria-label="FineWeb 语料整理流程">
<title>FineWeb 语料整理流程</title><desc>原论文不同步骤的近似 token 规模：36T、20T、15T 和 Edu 1.3T。</desc><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24444a} .tiny{font-size:13px;fill:#5c777a}.small{font-size:16px}.mid{font-size:20px;font-weight:700}.big{font-size:32px;font-weight:800}.tag{font-size:13px;font-weight:800;letter-spacing:1.6px;fill:#15796e}.base{fill:#f6f9f4;stroke:#cadbd4;stroke-width:2}.teal{fill:#dcefeb;stroke:#52a194;stroke-width:2}.amber{fill:#fff1e5;stroke:#d59c65;stroke-width:2}.purple{fill:#ece8f9;stroke:#a598cf;stroke-width:2}.bar{fill:#368879}.red{fill:#c47a65}.line{stroke:#91ada8;stroke-width:3;stroke-linecap:round}</style><rect width="920" height="310" rx="18" fill="#fdfcf8"/>
<text x="34" y="43" class="tag">FROM CRAWL TO PRETRAINING TEXT</text>
<rect x="34" y="86" width="199" height="153" rx="14" fill="#f6f9f4" stroke="#c3d3cf"/><text x="49" y="115" class="small" font-weight="700">96 snapshots</text><text x="49" y="139" class="tiny">WARC → Trafilatura</text><text x="49" y="167" class="tiny">提取与基础筛选</text><text x="49" y="216" class="big">36T</text><rect x="260" y="86" width="199" height="153" rx="14" fill="#dcefeb" stroke="#c3d3cf"/><text x="275" y="115" class="small" font-weight="700">Per-crawl MinHash</text><text x="275" y="139" class="tiny">5-grams · 14 × 8</text><text x="275" y="167" class="tiny">每次抓取内部去重</text><text x="275" y="216" class="big">20T</text><rect x="487" y="86" width="199" height="153" rx="14" fill="#fff1e5" stroke="#c3d3cf"/><text x="502" y="115" class="small" font-weight="700">Heuristics</text><text x="502" y="139" class="tiny">C4 子集 + 自建规则</text><text x="502" y="167" class="tiny">减少列表与重复行</text><text x="502" y="216" class="big">15T</text><rect x="714" y="86" width="199" height="153" rx="14" fill="#ece8f9" stroke="#c3d3cf"/><text x="729" y="115" class="small" font-weight="700">FineWeb-Edu</text><text x="729" y="139" class="tiny">教育价值评分 ≥ 3</text><text x="729" y="167" class="tiny">独立衍生子集</text><text x="729" y="216" class="big">1.3T</text>
<path d="M244 158h13m-7 -7 7 7 -7 7" stroke="#719e94" fill="none" stroke-width="2"/><path d="M471 158h13m-7 -7 7 7 -7 7" stroke="#719e94" fill="none" stroke-width="2"/><path d="M698 158h13m-7 -7 7 7 -7 7" stroke="#719e94" fill="none" stroke-width="2"/>
<text x="35" y="278" class="tiny">规模为论文发布时 GPT-2 tokenizer 计数；15T → 1.3T 是选择教育子集，不是所有任务都应采用的默认配方。</text></svg>