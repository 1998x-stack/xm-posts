<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 920 310" aria-label="跨快照去重与逐快照去重">
<title>跨快照去重与逐快照去重</title><desc>全局最新优先可能删去历史快照中高质量但已再次抓取的文档；逐快照去重保留跨期差异。</desc><style>
