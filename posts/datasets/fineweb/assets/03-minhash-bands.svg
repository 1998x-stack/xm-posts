<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 920 310" aria-label="MinHash LSH banding 原理图">
<title>MinHash LSH banding 原理图</title><desc>从文档 5-gram 集合得到 112 个哈希最小值，拆成十四个八维 band，某一 band 匹配即候选近重复。</desc><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24444a} .tiny{font-size:13px;fill:#5c777a}.small{font-size:16px}.mid{font-size:20px;font-weight:700}.big{font-size:32px;font-weight:800}.tag{font-size:13px;font-weight:800;letter-spacing:1.6px;fill:#15796e}.base{fill:#f6f9f4;stroke:#cadbd4;stroke-width:2}.teal{fill:#dcefeb;stroke:#52a194;stroke-width:2}.amber{fill:#fff1e5;stroke:#d59c65;stroke-width:2}.purple{fill:#ece8f9;stroke:#a598cf;stroke-width:2}.bar{fill:#368879}.red{fill:#c47a65}.line{stroke:#91ada8;stroke-width:3;stroke-linecap:round}</style><rect width="920" height="310" rx="18" fill="#fdfcf8"/>
<text x="34" y="42" class="tag">LOCALITY-SENSITIVE HASHING, STEP BY STEP</text>
<rect x="38" y="78" rx="13" width="238" height="153" class="base"/><text x="58" y="114" class="mid">① Shingling</text><text x="58" y="146" class="small">5-word n-grams</text><text x="58" y="185" class="tiny">转换为词组集合</text><rect x="343" y="78" rx="13" width="238" height="153" class="teal"/><text x="363" y="114" class="mid">② MinHash</text><text x="363" y="146" class="small">112 signatures</text><text x="363" y="185" class="tiny">估计 Jaccard 相似</text><rect x="646" y="78" rx="13" width="238" height="153" class="amber"/><text x="666" y="114" class="mid">③ 14 × 8 bands</text><text x="666" y="146" class="small">any band matches</text><text x="666" y="185" class="tiny">候选近重复 → 聚类</text>
<path d="M280 151h55m-8 -8 8 8 -8 8" class="line" fill="none"/><path d="M586 151h52m-8 -8 8 8 -8 8" class="line" fill="none"/>
<text x="38" y="277" class="tiny">注意：这是概率近邻检索机制；75% 是论文的目标相似度，不是每对文档都被精确算出并硬切的 Jaccard 边界。</text></svg>