<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 920 310" aria-label="FineWeb 自建质量过滤器">
<title>FineWeb 自建质量过滤器</title><desc>论文自建的三项质量启发式阈值，分别作用于终止标点、重复行字符比例、短行比例。</desc><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24444a} .tiny{font-size:13px;fill:#5c777a}.small{font-size:16px}.mid{font-size:20px;font-weight:700}.big{font-size:32px;font-weight:800}.tag{font-size:13px;font-weight:800;letter-spacing:1.6px;fill:#15796e}.base{fill:#f6f9f4;stroke:#cadbd4;stroke-width:2}.teal{fill:#dcefeb;stroke:#52a194;stroke-width:2}.amber{fill:#fff1e5;stroke:#d59c65;stroke-width:2}.purple{fill:#ece8f9;stroke:#a598cf;stroke-width:2}.bar{fill:#368879}.red{fill:#c47a65}.line{stroke:#91ada8;stroke-width:3;stroke-linecap:round}</style><rect width="920" height="310" rx="18" fill="#fdfcf8"/>
<text x="34" y="42" class="tag">PRACTICAL QUALITY HEURISTICS</text>
<rect x="36" y="83" rx="13" width="238" height="150" class="teal"/><text x="53" y="113" class="small" font-weight="700">① 终止标点比例</text><text x="53" y="156" class="big">≤ 0.12</text><text x="53" y="187" class="tiny">排除菜单式文本</text><text x="53" y="213" class="tiny">单独移除 tokens：10.14%</text><rect x="341" y="83" rx="13" width="238" height="150" class="amber"/><text x="358" y="113" class="small" font-weight="700">② 重复行字符比例</text><text x="358" y="156" class="big">≥ 0.10</text><text x="358" y="187" class="tiny">排除模板重复</text><text x="358" y="213" class="tiny">单独移除 tokens：12.47%</text><rect x="646" y="83" rx="13" width="238" height="150" class="purple"/><text x="663" y="113" class="small" font-weight="700">③ 短行比例</text><text x="663" y="156" class="big">≥ 0.67</text><text x="663" y="187" class="tiny">排除碎片列表</text><text x="663" y="213" class="tiny">单独移除 tokens：3.73%</text>
<text x="35" y="270" class="mid">三项合用：约移除 22% tokens</text><text x="450" y="270" class="tiny">过滤集合重叠，不可把百分比直接相加。</text></svg>