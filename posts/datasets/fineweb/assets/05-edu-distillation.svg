<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 920 310" aria-label="FineWeb-Edu 教育质量筛选流程">
<title>FineWeb-Edu 教育质量筛选流程</title><desc>论文以 Llama-3-70B-Instruct 为 46 万页面生成零到五标签，冻结 embedding encoder，训练线性回归头并按三分阈值选择 1.3T token。</desc><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24444a} .tiny{font-size:13px;fill:#5c777a}.small{font-size:16px}.mid{font-size:20px;font-weight:700}.big{font-size:32px;font-weight:800}.tag{font-size:13px;font-weight:800;letter-spacing:1.6px;fill:#15796e}.base{fill:#f6f9f4;stroke:#cadbd4;stroke-width:2}.teal{fill:#dcefeb;stroke:#52a194;stroke-width:2}.amber{fill:#fff1e5;stroke:#d59c65;stroke-width:2}.purple{fill:#ece8f9;stroke:#a598cf;stroke-width:2}.bar{fill:#368879}.red{fill:#c47a65}.line{stroke:#91ada8;stroke-width:3;stroke-linecap:round}</style><rect width="920" height="310" rx="18" fill="#fdfcf8"/>
<text x="34" y="42" class="tag">TEACHER SIGNAL → SMALLER SCORER → TRILLION-SCALE FILTER</text>
<rect x="33" y="91" width="172" height="158" rx="13" class="amber"/><text x="46" y="122" class="small" font-weight="700">Llama-3-70B</text><text x="46" y="171" class="small">460k 网页伪标签</text><text x="46" y="212" class="small">0–5 分</text><rect x="271" y="91" width="172" height="158" rx="13" class="base"/><text x="284" y="122" class="small" font-weight="700">Embedding</text><text x="284" y="171" class="small">Snowflake-arctic</text><text x="284" y="212" class="small">冻结编码器</text><rect x="509" y="91" width="172" height="158" rx="13" class="teal"/><text x="522" y="122" class="small" font-weight="700">Linear head</text><text x="522" y="171" class="small">410k train</text><text x="522" y="212" class="small">50k validation</text><rect x="747" y="91" width="172" height="158" rx="13" class="purple"/><text x="760" y="122" class="small" font-weight="700">Threshold</text><text x="760" y="171" class="small">预测分 ≥ 3</text><text x="760" y="212" class="small">1.3T tokens</text>
<path d="M210 170h54m-8 -8 8 8 -8 8" stroke="#658e8b" stroke-width="2.5" fill="none"/><path d="M448 170h54m-8 -8 8 8 -8 8" stroke="#658e8b" stroke-width="2.5" fill="none"/><path d="M686 170h54m-8 -8 8 8 -8 8" stroke="#658e8b" stroke-width="2.5" fill="none"/>
<text x="35" y="286" class="tiny">论文 §4：F1 ≈ 82% 是对教师生成标签的验证，不等于人工标注的客观真值。</text></svg>