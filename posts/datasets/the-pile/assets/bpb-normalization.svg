<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="pile-f04-title pile-f04-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="pile-f04-title">为何用每字节比特数而非直接比较 Token Perplexity</title><desc id="pile-f04-desc">同一段 UTF-8 文本可能被分成不同数量的 token；将负对数似然统一归一化到 UTF-8 字节数更易于跨分词器比较。</desc><rect width="820" height="350" rx="17" fill="#f5faf7"/><text x="29" y="42" fill="#24595a" font-size="21" font-weight="800" text-anchor="start">同一份文本：UTF-8 bytes = B</text><rect x="33" y="65" width="352" height="116" rx="11" fill="#fff" stroke="#cbddd5" stroke-width="1.5"/><text x="54" y="96" fill="#22766d" font-size="17" font-weight="700" text-anchor="start">Tokenizer A</text><rect x="52" y="113" width="70" height="42" rx="7" fill="#dceee7" stroke="#adcebe" stroke-width="1.5"/><text x="87" y="138" fill="#1e675c" font-size="15" font-weight="700" text-anchor="middle">1</text><rect x="129" y="113" width="70" height="42" rx="7" fill="#dceee7" stroke="#adcebe" stroke-width="1.5"/><text x="164" y="138" fill="#1e675c" font-size="15" font-weight="700" text-anchor="middle">2</text><rect x="206" y="113" width="70" height="42" rx="7" fill="#dceee7" stroke="#adcebe" stroke-width="1.5"/><text x="241" y="138" fill="#1e675c" font-size="15" font-weight="700" text-anchor="middle">3</text><rect x="283" y="113" width="70" height="42" rx="7" fill="#dceee7" stroke="#adcebe" stroke-width="1.5"/><text x="318" y="138" fill="#1e675c" font-size="15" font-weight="700" text-anchor="middle">4</text><rect x="434" y="65" width="354" height="116" rx="11" fill="#fff" stroke="#cbddd5" stroke-width="1.5"/><text x="453" y="96" fill="#af6748" font-size="17" font-weight="700" text-anchor="start">Tokenizer B</text><rect x="475" y="113" width="130" height="42" rx="7" fill="#f8e5d2" stroke="#e6c59c" stroke-width="1.5"/><text x="540" y="138" fill="#9c5b3b" font-size="15" font-weight="700" text-anchor="middle">1</text><rect x="625" y="113" width="130" height="42" rx="7" fill="#f8e5d2" stroke="#e6c59c" stroke-width="1.5"/><text x="690" y="138" fill="#9c5b3b" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="205" y="218" fill="#256c63" font-size="19" font-weight="750" text-anchor="middle">4 tokens</text><text x="612" y="218" fill="#a26743" font-size="19" font-weight="750" text-anchor="middle">2 tokens</text><rect x="163" y="250" width="492" height="62" rx="11" fill="#eaf2f9" stroke="#c8d9e7" stroke-width="1.5"/><text x="409" y="276" fill="#2e5b6d" font-size="17" font-weight="700" text-anchor="middle">BPB = 总负 log₂ 概率 / UTF-8 字节数</text><text x="409" y="297" fill="#5a7782" font-size="13" font-weight="500" text-anchor="middle">归一化后的比较尺度是字节，而不是 token</text></svg>