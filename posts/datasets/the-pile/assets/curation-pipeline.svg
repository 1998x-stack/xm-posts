<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="pile-f03-title pile-f03-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="pile-f03-title">从数据采集到采样和数据分割的流程</title><desc id="pile-f03-desc">展示数据工程的五个阶段；去重为尽力进行，原论文不保证不同数据划分完全无重叠。</desc><rect width="820" height="350" rx="17" fill="#f5faf7"/><text x="31" y="45" fill="#214e50" font-size="20" font-weight="800" text-anchor="start">语料工程是分阶段决策，不是“把文本拼起来”</text><rect x="20" y="95" width="144" height="116" rx="11" fill="#e8f5ec" stroke="#cfdfd8" stroke-width="1.5"/><text x="92" y="143" fill="#254c4d" font-size="15" font-weight="700" text-anchor="middle">来源授权与采集</text><text x="92" y="176" fill="#5b7372" font-size="13" font-weight="500" text-anchor="middle">可靠来源</text><path d="M166 152 h13" fill="none" stroke="#c47a50" stroke-width="3"/><rect x="182" y="95" width="144" height="116" rx="11" fill="#ecf3fb" stroke="#cfdfd8" stroke-width="1.5"/><text x="254" y="143" fill="#254c4d" font-size="15" font-weight="700" text-anchor="middle">提取与清洗</text><text x="254" y="176" fill="#5b7372" font-size="13" font-weight="500" text-anchor="middle">抽取正文</text><path d="M328 152 h13" fill="none" stroke="#c47a50" stroke-width="3"/><rect x="344" y="95" width="144" height="116" rx="11" fill="#e8f5ec" stroke="#cfdfd8" stroke-width="1.5"/><text x="416" y="143" fill="#254c4d" font-size="15" font-weight="700" text-anchor="middle">去重/污染检查</text><text x="416" y="176" fill="#5b7372" font-size="13" font-weight="500" text-anchor="middle">检查重叠</text><path d="M490 152 h13" fill="none" stroke="#c47a50" stroke-width="3"/><rect x="506" y="95" width="144" height="116" rx="11" fill="#ecf3fb" stroke="#cfdfd8" stroke-width="1.5"/><text x="578" y="143" fill="#254c4d" font-size="15" font-weight="700" text-anchor="middle">混合与加权</text><text x="578" y="176" fill="#5b7372" font-size="13" font-weight="500" text-anchor="middle">控制分布</text><path d="M652 152 h13" fill="none" stroke="#c47a50" stroke-width="3"/><rect x="668" y="95" width="144" height="116" rx="11" fill="#e8f5ec" stroke="#cfdfd8" stroke-width="1.5"/><text x="740" y="143" fill="#254c4d" font-size="15" font-weight="700" text-anchor="middle">Train / Val / Test</text><text x="740" y="176" fill="#5b7372" font-size="13" font-weight="500" text-anchor="middle">保留标识</text><text x="410" y="259" fill="#54716f" font-size="15" font-weight="600" text-anchor="middle">原论文：Train / Validation / Test；验证集与测试集各 0.1%</text><text x="410" y="292" fill="#a06c46" font-size="15" font-weight="600" text-anchor="middle">谨记：原论文明确提醒跨 split 仍可能存在重复文档</text></svg>