<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="pile-f01-title pile-f01-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="pile-f01-title">单一网页语料与多领域语料的覆盖差异</title><desc id="pile-f01-desc">左侧只依赖网页语料，右侧在网页外加入学术、法律、代码和对话文本；这是一幅概念图，而非真实比例。</desc><rect width="820" height="350" rx="17" fill="#f5faf7"/><text x="36" y="38" fill="#6f5c49" font-size="19" font-weight="750" text-anchor="start">只使用宽泛网页文本</text><text x="450" y="38" fill="#1b716b" font-size="19" font-weight="750" text-anchor="start">The Pile：领域组合</text><rect x="35" y="61" width="333" height="235" rx="11" fill="#fff5ea" stroke="#edd6c5" stroke-width="1.5"/><rect x="449" y="61" width="336" height="235" rx="11" fill="#eaf6f1" stroke="#b5dcd1" stroke-width="1.5"/><rect x="62" y="85" width="279" height="188" rx="14" fill="#f0c59c" stroke="#e8b07b" stroke-width="1.5"/><text x="202" y="168" fill="#754628" font-size="28" font-weight="800" text-anchor="middle">Web / Crawl</text><text x="202" y="203" fill="#754628" font-size="15" font-weight="500" text-anchor="middle">领域覆盖依赖抓取分布</text><rect x="468" y="83" width="131" height="54" rx="8" fill="#cdece1" stroke="#c9d8d1" stroke-width="1.5"/><text x="533" y="116" fill="#2d5656" font-size="15" font-weight="700" text-anchor="middle">Web / Crawl</text><rect x="636" y="83" width="131" height="54" rx="8" fill="#d5e9f5" stroke="#c9d8d1" stroke-width="1.5"/><text x="701" y="116" fill="#2d5656" font-size="15" font-weight="700" text-anchor="middle">论文 / 医学</text><rect x="468" y="153" width="131" height="54" rx="8" fill="#f7ead5" stroke="#c9d8d1" stroke-width="1.5"/><text x="533" y="186" fill="#2d5656" font-size="15" font-weight="700" text-anchor="middle">代码 / 数学</text><rect x="636" y="153" width="131" height="54" rx="8" fill="#eadcf2" stroke="#c9d8d1" stroke-width="1.5"/><text x="701" y="186" fill="#2d5656" font-size="15" font-weight="700" text-anchor="middle">法律 / 专利</text><rect x="468" y="223" width="131" height="54" rx="8" fill="#f7dfd7" stroke="#c9d8d1" stroke-width="1.5"/><text x="533" y="256" fill="#2d5656" font-size="15" font-weight="700" text-anchor="middle">图书 / 对话</text><rect x="636" y="223" width="131" height="54" rx="8" fill="#e4ead2" stroke="#c9d8d1" stroke-width="1.5"/><text x="701" y="256" fill="#2d5656" font-size="15" font-weight="700" text-anchor="middle">问答 / 讨论</text><text x="410" y="325" fill="#58716e" font-size="17" font-weight="550" text-anchor="middle">关键变化：显式纳入长尾领域，而非让爬虫碰运气</text></svg>