<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="jev-pipeline-title jev-pipeline-desc">
<title id="jev-pipeline-title">从生成文本到类型化概率决策</title>
<desc id="jev-pipeline-desc">上方展示生成式语言模型需要生成文本、解析和校验后再执行；下方展示 Jev 接收状态与类型化问题，输出概率分布，再由策略代码决定动作。</desc>
<defs><marker id="jev-pipeline-arrow-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#8b9b9a"/></marker><marker id="jev-pipeline-arrow-b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker></defs>
<rect width="1080" height="470" rx="22" fill="#fbfdfb"/>
<text x="44" y="52" font-size="22" font-weight="700" fill="#53676d">A · 生成式 LLM + JSON 约束</text>
<g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="42" y="83" width="190" height="106" rx="14" fill="#eef2f1" stroke="#cbd8d4" stroke-width="2"/>
<text x="137" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">State + Prompt</text><text x="137" y="153" text-anchor="middle" font-size="15" fill="#53676d">自然语言上下文</text>
<path d="M232 136 H276" stroke="#8b9b9a" stroke-width="3" marker-end="url(#jev-pipeline-arrow-a)"/>
<rect x="282" y="83" width="190" height="106" rx="14" fill="#f4f1fb" stroke="#d6cfee" stroke-width="2"/>
<text x="377" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#453b75">Token Generation</text><text x="377" y="153" text-anchor="middle" font-size="15" fill="#625b7d">逐 token 生成文本</text>
<path d="M472 136 H516" stroke="#8b9b9a" stroke-width="3" marker-end="url(#jev-pipeline-arrow-a)"/>
<rect x="522" y="83" width="190" height="106" rx="14" fill="#fff3e9" stroke="#ebc7ae" stroke-width="2"/>
<text x="617" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#85472e">Parse + Validate</text><text x="617" y="153" text-anchor="middle" font-size="15" fill="#8a624e">解析、校验、兜底</text>
<path d="M712 136 H756" stroke="#8b9b9a" stroke-width="3" marker-end="url(#jev-pipeline-arrow-a)"/>
<rect x="762" y="83" width="276" height="106" rx="14" fill="#eef2f1" stroke="#cbd8d4" stroke-width="2"/>
<text x="900" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#203035">Application Policy</text><text x="900" y="153" text-anchor="middle" font-size="15" fill="#53676d">决定执行或报错</text>
<rect x="42" y="214" width="996" height="38" rx="9" fill="#fff4e8"/>
<text x="540" y="239" text-anchor="middle" font-size="16" font-weight="650" fill="#99522f">JSON Schema 约束结构，不会自动校准语义判断，也不会定义错误成本</text>
<text x="44" y="302" font-size="22" font-weight="700" fill="#147f80">B · Jev / Typed Decision Model</text>
<rect x="42" y="330" width="190" height="100" rx="14" fill="#e9f4f0" stroke="#a9cec0" stroke-width="2"/>
<text x="137" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#24545a">State + Questions</text><text x="137" y="397" text-anchor="middle" font-size="15" fill="#426c69">状态 + 答案契约</text>
<path d="M232 380 H276" stroke="#147f80" stroke-width="3" marker-end="url(#jev-pipeline-arrow-b)"/>
<rect x="282" y="330" width="190" height="100" rx="14" fill="#e9f4f0" stroke="#a9cec0" stroke-width="2"/>
<text x="377" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#24545a">Jev · fθ</text><text x="377" y="397" text-anchor="middle" font-size="15" fill="#426c69">窄范围判断</text>
<path d="M472 380 H516" stroke="#147f80" stroke-width="3" marker-end="url(#jev-pipeline-arrow-b)"/>
<rect x="522" y="330" width="230" height="100" rx="14" fill="#f4f1fb" stroke="#d6cfee" stroke-width="2"/>
<text x="637" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#453b75">Typed Probabilities</text><text x="637" y="396" text-anchor="middle" font-size="15" fill="#625b7d">Choice · Score · Noul</text>
<path d="M752 380 H796" stroke="#147f80" stroke-width="3" marker-end="url(#jev-pipeline-arrow-b)"/>
<rect x="802" y="330" width="236" height="100" rx="14" fill="#e9f4f0" stroke="#a9cec0" stroke-width="2"/>
<text x="920" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#24545a">Policy in Code</text><text x="920" y="396" text-anchor="middle" font-size="15" fill="#426c69">Act · Review · Reject</text>
</g>
</svg>