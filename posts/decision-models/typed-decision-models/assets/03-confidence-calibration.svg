<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="jev-calibration-title jev-calibration-desc">
<title id="jev-calibration-title">概率校准与 confidence 的区别</title>
<desc id="jev-calibration-desc">左侧可靠性图对比理想校准线与过度自信曲线。右侧展示三分类 top probability 为 0.70 时，Jev 归一化 confidence 为 0.55 的教学例子。</desc>
<rect width="1080" height="500" rx="22" fill="#fbfdfb"/>
<g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="46" y="48" font-size="23" font-weight="750" fill="#203035">A · Reliability diagram（示意）</text>
<rect x="64" y="76" width="470" height="330" rx="12" fill="#fff" stroke="#dce7e2"/>
<path d="M112 356 V112 M112 356 H495" stroke="#53676d" stroke-width="2"/>
<path d="M112 356 L470 112" stroke="#147f80" stroke-width="4" stroke-dasharray="9 7"/>
<path d="M112 356 C190 280 258 224 320 192 S420 140 470 126" stroke="#c36a45" stroke-width="5" fill="none"/>
<g fill="#53676d" font-size="14"><text x="110" y="384">0</text><text x="288" y="384">0.5</text><text x="465" y="384">1.0</text><text x="75" y="356">0</text><text x="75" y="238">0.5</text><text x="75" y="119">1.0</text><text x="300" y="430" text-anchor="middle">平均预测概率</text><text x="35" y="240" transform="rotate(-90 35 240)" text-anchor="middle">实际正确率</text></g>
<line x1="120" y1="96" x2="153" y2="96" stroke="#147f80" stroke-width="4" stroke-dasharray="8 6"/><text x="163" y="102" font-size="14" fill="#426c69">理想校准</text>
<line x1="276" y1="96" x2="309" y2="96" stroke="#c36a45" stroke-width="4"/><text x="319" y="102" font-size="14" fill="#8a624e">过度自信示意</text>
<text x="64" y="463" font-size="14" fill="#53676d">若预测 0.8 的样本中只有约 0.6 正确，模型在该区间过度自信。</text>
<text x="588" y="48" font-size="23" font-weight="750" fill="#203035">B · top probability ≠ confidence</text>
<rect x="588" y="76" width="446" height="330" rx="12" fill="#fff" stroke="#dce7e2"/>
<text x="620" y="126" font-size="18" font-weight="700" fill="#203035">三分类概率向量</text>
<g font-size="16" fill="#53676d"><text x="620" y="180">Billing</text><text x="620" y="232">Support</text><text x="620" y="284">Delivery</text></g>
<rect x="715" y="159" width="245" height="27" rx="7" fill="#e5ece8"/><rect x="715" y="159" width="171.5" height="27" rx="7" fill="#147f80"/><text x="977" y="180" font-size="16" font-weight="700" fill="#203035">0.70</text>
<rect x="715" y="211" width="245" height="27" rx="7" fill="#e5ece8"/><rect x="715" y="211" width="49" height="27" rx="7" fill="#6656a6"/><text x="977" y="232" font-size="16" font-weight="700" fill="#203035">0.20</text>
<rect x="715" y="263" width="245" height="27" rx="7" fill="#e5ece8"/><rect x="715" y="263" width="24.5" height="27" rx="7" fill="#c36a45"/><text x="977" y="284" font-size="16" font-weight="700" fill="#203035">0.10</text>
<rect x="620" y="318" width="178" height="58" rx="10" fill="#e9f4f0"/><text x="709" y="343" text-anchor="middle" font-size="14" fill="#426c69">Top probability</text><text x="709" y="367" text-anchor="middle" font-size="24" font-weight="800" fill="#147f80">0.70</text>
<rect x="816" y="318" width="188" height="58" rx="10" fill="#f4f1fb"/><text x="910" y="343" text-anchor="middle" font-size="14" fill="#625b7d">Choice confidence</text><text x="910" y="367" text-anchor="middle" font-size="24" font-weight="800" fill="#6656a6">0.55</text>
<text x="588" y="463" font-size="14" fill="#53676d">confidence 是分布集中度的变换，不是“本次答案正确概率”。</text>
</g>
</svg>