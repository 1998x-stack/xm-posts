<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="jev-risk-title jev-risk-desc">
<title id="jev-risk-title">概率分布通过损失函数变成决策</title>
<desc id="jev-risk-desc">流程图展示模型概率、成本矩阵、各动作的期望风险和人工复核选项，说明最大概率不一定是最低风险动作。</desc>
<defs><marker id="jev-risk-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147f80"/></marker></defs>
<rect width="1080" height="470" rx="22" fill="#fbfdfb"/>
<g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="38" y="48" width="215" height="112" rx="15" fill="#e9f4f0" stroke="#a9cec0" stroke-width="2"/>
<text x="145" y="91" text-anchor="middle" font-size="21" font-weight="750" fill="#24545a">Probability</text><text x="145" y="122" text-anchor="middle" font-size="16" fill="#426c69">P(y | x)</text>
<path d="M253 104 H300" stroke="#147f80" stroke-width="3" marker-end="url(#jev-risk-arrow)"/>
<rect x="306" y="48" width="215" height="112" rx="15" fill="#f4f1fb" stroke="#d6cfee" stroke-width="2"/>
<text x="413" y="91" text-anchor="middle" font-size="21" font-weight="750" fill="#453b75">Cost Matrix</text><text x="413" y="122" text-anchor="middle" font-size="16" fill="#625b7d">L(action, truth)</text>
<path d="M521 104 H568" stroke="#147f80" stroke-width="3" marker-end="url(#jev-risk-arrow)"/>
<rect x="574" y="48" width="215" height="112" rx="15" fill="#fff3e9" stroke="#ebc7ae" stroke-width="2"/>
<text x="681" y="91" text-anchor="middle" font-size="21" font-weight="750" fill="#85472e">Expected Risk</text><text x="681" y="122" text-anchor="middle" font-size="16" fill="#8a624e">Σ L(a,y) P(y|x)</text>
<path d="M789 104 H836" stroke="#147f80" stroke-width="3" marker-end="url(#jev-risk-arrow)"/>
<rect x="842" y="48" width="200" height="112" rx="15" fill="#e9f4f0" stroke="#a9cec0" stroke-width="2"/>
<text x="942" y="91" text-anchor="middle" font-size="21" font-weight="750" fill="#24545a">Policy</text><text x="942" y="122" text-anchor="middle" font-size="16" fill="#426c69">arg min action</text>
<text x="42" y="220" font-size="21" font-weight="750" fill="#203035">教学算例：P = (0.70, 0.20, 0.10)</text>
<text x="42" y="251" font-size="15" fill="#53676d">下方数值为每种动作的期望损失；成本单位是假设值。</text>
<g font-size="17" fill="#203035">
<text x="42" y="305">自动路由 Billing</text><rect x="245" y="282" width="520" height="29" rx="8" fill="#e4ebe7"/><rect x="245" y="282" width="135" height="29" rx="8" fill="#147f80"/><text x="790" y="304" font-weight="750">1.30</text>
<text x="42" y="351">自动路由 Support</text><rect x="245" y="328" width="520" height="29" rx="8" fill="#e4ebe7"/><rect x="245" y="328" width="260" height="29" rx="8" fill="#6656a6"/><text x="790" y="350" font-weight="750">2.50</text>
<text x="42" y="397">自动路由 Delivery</text><rect x="245" y="374" width="520" height="29" rx="8" fill="#e4ebe7"/><rect x="245" y="374" width="447" height="29" rx="8" fill="#c36a45"/><text x="790" y="396" font-weight="750">4.30</text>
</g>
<rect x="858" y="270" width="184" height="133" rx="13" fill="#fff4e8" stroke="#ebc7ae" stroke-width="2"/>
<text x="950" y="307" text-anchor="middle" font-size="17" font-weight="750" fill="#85472e">人工复核</text><text x="950" y="346" text-anchor="middle" font-size="28" font-weight="800" fill="#85472e">1.00</text><text x="950" y="376" text-anchor="middle" font-size="14" fill="#8a624e">最低风险动作</text>
</g>
</svg>