<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" role="img" aria-labelledby="safety-cover-title safety-cover-desc"><title id="safety-cover-title">安全评测的四个环节</title><desc id="safety-cover-desc">明确风险问题，生成多轮场景，依据领域量表判分，报告带有不确定性的结果。</desc><rect width="840" height="250" rx="18" fill="#eff6f2"/><g font-family="Arial, sans-serif"><text x="30" y="35" fill="#315d57" font-size="16" font-weight="700">FROM A SAFETY QUESTION TO A DEFENSIBLE CLAIM</text><g><rect x="28" y="78" width="174" height="112" rx="13" fill="#fff" stroke="#b8d5c8" stroke-width="2"/><text x="48" y="112" fill="#287d70" font-size="15" font-weight="700">01 · Define</text><text x="48" y="145" fill="#365b5b" font-size="17">测量什么风险？</text></g><path d="M205 134 H226" stroke="#568f80" stroke-width="4"/><path d="M218 126 L228 134 L218 142" fill="none" stroke="#568f80" stroke-width="3"/><g><rect x="236" y="78" width="174" height="112" rx="13" fill="#fff" stroke="#b8d5c8" stroke-width="2"/><text x="256" y="112" fill="#287d70" font-size="15" font-weight="700">02 · Simulate</text><text x="256" y="145" fill="#365b5b" font-size="17">多轮真实场景</text></g><path d="M413 134 H434" stroke="#568f80" stroke-width="4"/><path d="M426 126 L436 134 L426 142" fill="none" stroke="#568f80" stroke-width="3"/><g><rect x="444" y="78" width="174" height="112" rx="13" fill="#fff" stroke="#b8d5c8" stroke-width="2"/><text x="464" y="112" fill="#287d70" font-size="15" font-weight="700">03 · Grade</text><text x="464" y="145" fill="#365b5b" font-size="17">原子化行为量表</text></g><path d="M621 134 H642" stroke="#568f80" stroke-width="4"/><path d="M634 126 L644 134 L634 142" fill="none" stroke="#568f80" stroke-width="3"/><g><rect x="652" y="78" width="160" height="112" rx="13" fill="#fff" stroke="#b8d5c8" stroke-width="2"/><text x="672" y="112" fill="#287d70" font-size="15" font-weight="700">04 · Report</text><text x="672" y="145" fill="#365b5b" font-size="17">区间与限制</text></g><text x="30" y="222" fill="#68847c" font-size="13">Safety evaluation ≠ capability benchmark ≠ refusal-rate counter</text></g></svg>
