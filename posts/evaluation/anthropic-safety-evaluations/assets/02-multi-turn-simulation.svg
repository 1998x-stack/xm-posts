<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="safety-multi-title safety-multi-desc"><title id="safety-multi-title">多轮安全场景生成</title><desc id="safety-multi-desc">固定起始用户消息，模拟用户根据模型回答调整后续对话，最后由评分器按风险量表评估整段轨迹。</desc><rect width="840" height="300" rx="18" fill="#f1f6f3"/><g font-family="Arial,sans-serif"><rect x="28" y="80" width="150" height="100" rx="12" fill="#fff" stroke="#a9cfc0" stroke-width="2"/><text x="50" y="115" fill="#287d70" font-size="16" font-weight="700">Scenario spec</text><text x="50" y="143" fill="#496a66" font-size="14">目标 · 人设 · 策略</text><path d="M180 130 H215" stroke="#478b7d" stroke-width="4"/><path d="M207 122 L217 130 L207 138" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="224" y="80" width="150" height="100" rx="12" fill="#fff" stroke="#a9cfc0" stroke-width="2"/><text x="246" y="115" fill="#287d70" font-size="16" font-weight="700">Simulated user</text><text x="246" y="143" fill="#496a66" font-size="14">后续轮次自适应</text><path d="M376 130 H411" stroke="#478b7d" stroke-width="4"/><path d="M403 122 L413 130 L403 138" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="420" y="80" width="150" height="100" rx="12" fill="#fff" stroke="#a9cfc0" stroke-width="2"/><text x="442" y="115" fill="#287d70" font-size="16" font-weight="700">Model under test</text><text x="442" y="143" fill="#496a66" font-size="14">生成 assistant turns</text><path d="M572 130 H607" stroke="#478b7d" stroke-width="4"/><path d="M599 122 L609 130 L599 138" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="616" y="80" width="196" height="100" rx="12" fill="#fff" stroke="#a9cfc0" stroke-width="2"/><text x="638" y="115" fill="#287d70" font-size="16" font-weight="700">Rubric grader</text><text x="638" y="143" fill="#496a66" font-size="14">整段对话 · 一次判定</text><path d="M300 188 V228 H714 V188" fill="none" stroke="#bc8055" stroke-width="3" stroke-dasharray="7 6"/><text x="350" y="254" fill="#925f40" font-size="14">模型回答改变下一轮用户行为；不是静态脚本重放</text><text x="30" y="35" fill="#315d57" font-size="15" font-weight="700">ONE FIXED START · MANY DIVERGING TRAJECTORIES</text></g></svg>
