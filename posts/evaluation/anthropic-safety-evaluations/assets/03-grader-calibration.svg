<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="safety-grader-title safety-grader-desc"><title id="safety-grader-title">评分器校准流程</title><desc id="safety-grader-desc">专家先盲标一组对话，再与模型评分比较，分析一致性和分歧，修订量表并重新测试。</desc><rect width="840" height="300" rx="18" fill="#f2f6f4"/><g font-family="Arial,sans-serif"><rect x="34" y="80" width="205" height="126" rx="13" fill="#fff" stroke="#bdd4ca" stroke-width="2"/><text x="55" y="114" fill="#287d70" font-size="17" font-weight="700">Human labels</text><text x="55" y="146" fill="#496a66" font-size="14">专家独立标注</text><text x="55" y="171" fill="#496a66" font-size="14">不看模型判分</text><path d="M241 143 H302" stroke="#478b7d" stroke-width="4"/><path d="M294 135 L304 143 L294 151" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="310" y="80" width="205" height="126" rx="13" fill="#fff" stroke="#bdd4ca" stroke-width="2"/><text x="331" y="114" fill="#287d70" font-size="17" font-weight="700">Compare</text><text x="331" y="146" fill="#496a66" font-size="14">human ↔ grader</text><text x="331" y="171" fill="#496a66" font-size="14">检查分歧样本</text><path d="M517 143 H578" stroke="#478b7d" stroke-width="4"/><path d="M570 135 L580 143 L570 151" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="586" y="80" width="220" height="126" rx="13" fill="#fff" stroke="#bdd4ca" stroke-width="2"/><text x="607" y="114" fill="#287d70" font-size="17" font-weight="700">Revise rubric</text><text x="607" y="146" fill="#496a66" font-size="14">原子化 · 明确反例</text><text x="607" y="171" fill="#496a66" font-size="14">重新抽样验证</text><path d="M696 212 V245 H135 V211" fill="none" stroke="#bc8055" stroke-width="3" stroke-dasharray="7 6"/><text x="330" y="271" fill="#925f40" font-size="14">评测器本身也必须被评测</text></g></svg>
