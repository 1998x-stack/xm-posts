<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="safety-report-title safety-report-desc"><title id="safety-report-title">安全评测报告的组成</title><desc id="safety-report-desc">报告需要包含主指标、置信区间、风险类别切片、模型和系统配置、评分器版本以及偏差披露。</desc><rect width="840" height="270" rx="18" fill="#eff5f1"/><g font-family="Arial,sans-serif"><rect x="32" y="55" width="230" height="160" rx="13" fill="#fff" stroke="#b9d4c8" stroke-width="2"/><text x="55" y="91" fill="#287d70" font-size="18" font-weight="700">Outcome</text><rect x="55" y="111" width="180" height="18" rx="8" fill="#dceae2"/><rect x="55" y="111" width="132" height="18" rx="8" fill="#4a9b83"/><text x="55" y="159" fill="#496a66" font-size="14">Appropriate response rate</text><text x="55" y="185" fill="#496a66" font-size="13">+ uncertainty interval</text><rect x="304" y="55" width="230" height="160" rx="13" fill="#fff" stroke="#b9d4c8" stroke-width="2"/><text x="327" y="91" fill="#287d70" font-size="18" font-weight="700">Slices</text><text x="327" y="124" fill="#496a66" font-size="14">risk area · severity</text><text x="327" y="151" fill="#496a66" font-size="14">single / multi-turn</text><text x="327" y="178" fill="#496a66" font-size="14">language · product surface</text><rect x="576" y="55" width="230" height="160" rx="13" fill="#fff" stroke="#b9d4c8" stroke-width="2"/><text x="599" y="91" fill="#287d70" font-size="18" font-weight="700">Reproducibility</text><text x="599" y="124" fill="#496a66" font-size="14">model & prompt version</text><text x="599" y="151" fill="#496a66" font-size="14">sampling & grader version</text><text x="599" y="178" fill="#496a66" font-size="14">date · deviations · flaws</text><text x="32" y="245" fill="#68847c" font-size="13">A headline score without uncertainty and configuration is not a reproducible safety claim.</text></g></svg>
