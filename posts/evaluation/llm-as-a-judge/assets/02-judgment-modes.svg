<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title-02 desc-02">
<title id="title-02">Four LLM judge task formats</title><desc id="desc-02">Pointwise scoring evaluates one answer, pairwise comparison chooses between two, listwise ranking compares several, and critique or verification checks evidence and correctness.</desc>
<rect width="1000" height="460" rx="22" fill="#f8faf8"/><text x="38" y="52" font-size="23" font-weight="700" fill="#25464b">四种常见的评审任务：输入形式决定输出与风险</text>
<g font-family="Arial, sans-serif">
<g transform="translate(35 90)"><rect width="445" height="150" rx="15" fill="#eaf2f5" stroke="#9dbcc8" stroke-width="2"/><text x="22" y="34" font-size="19" font-weight="700" fill="#315a66">01 · Pointwise / 单点评分</text><rect x="22" y="54" width="180" height="54" rx="8" fill="#fff" stroke="#a5bdc5"/><text x="112" y="76" font-size="14" text-anchor="middle" fill="#45666e">Answer A</text><text x="112" y="95" font-size="12" text-anchor="middle" fill="#6c858b">单个候选</text><path d="M208 81 H257" stroke="#557b78" stroke-width="2.5"/><path d="M251 75 L260 81 L251 87" fill="none" stroke="#557b78" stroke-width="2.5"/><rect x="267" y="54" width="150" height="54" rx="8" fill="#dff0e5" stroke="#8ab99a"/><text x="342" y="77" font-size="14" text-anchor="middle" fill="#32694a">4.2 / 5</text><text x="342" y="96" font-size="12" text-anchor="middle" fill="#4b745b">维度分数</text><text x="22" y="132" font-size="13" fill="#58727a">适合：质量画像、rubric 诊断；风险：分数尺度漂移</text></g>
<g transform="translate(520 90)"><rect width="445" height="150" rx="15" fill="#fff1e2" stroke="#d9b17d" stroke-width="2"/><text x="22" y="34" font-size="19" font-weight="700" fill="#80552d">02 · Pairwise / 成对比较</text><rect x="22" y="54" width="112" height="54" rx="8" fill="#fff" stroke="#d5b58d"/><text x="78" y="86" font-size="15" text-anchor="middle" fill="#795f47">A</text><text x="153" y="86" font-size="16" text-anchor="middle" fill="#8c765e">vs</text><rect x="172" y="54" width="112" height="54" rx="8" fill="#fff" stroke="#d5b58d"/><text x="228" y="86" font-size="15" text-anchor="middle" fill="#795f47">B</text><path d="M293 81 H328" stroke="#8b765e" stroke-width="2.5"/><path d="M322 75 L331 81 L322 87" fill="none" stroke="#8b765e" stroke-width="2.5"/><rect x="338" y="54" width="86" height="54" rx="8" fill="#f4dfc8" stroke="#d4a76e"/><text x="381" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#80552d">A 胜</text><text x="22" y="132" font-size="13" fill="#806d58">适合：偏好排序；风险：位置偏差、平局与循环偏好</text></g>
<g transform="translate(35 270)"><rect width="445" height="150" rx="15" fill="#eeeafa" stroke="#aaa0d0" stroke-width="2"/><text x="22" y="34" font-size="19" font-weight="700" fill="#51447d">03 · Listwise / 列表排序</text><g transform="translate(24 57)"><rect width="62" height="45" rx="7" fill="#fff" stroke="#b6acd6"/><rect x="72" width="62" height="45" rx="7" fill="#fff" stroke="#b6acd6"/><rect x="144" width="62" height="45" rx="7" fill="#fff" stroke="#b6acd6"/><text x="31" y="28" font-size="15" text-anchor="middle" fill="#51447d">A</text><text x="103" y="28" font-size="15" text-anchor="middle" fill="#51447d">B</text><text x="175" y="28" font-size="15" text-anchor="middle" fill="#51447d">C</text></g><path d="M250 80 H286" stroke="#70659a" stroke-width="2.5"/><path d="M280 74 L289 80 L280 86" fill="none" stroke="#70659a" stroke-width="2.5"/><rect x="298" y="57" width="120" height="45" rx="7" fill="#e0daf4" stroke="#aaa0d0"/><text x="358" y="85" font-size="14" text-anchor="middle" fill="#51447d">B ≻ A ≻ C</text><text x="22" y="132" font-size="13" fill="#665d87">适合：多模型排行榜；风险：排列空间与候选数影响</text></g>
<g transform="translate(520 270)"><rect width="445" height="150" rx="15" fill="#e7f3ec" stroke="#8ab99a" stroke-width="2"/><text x="22" y="34" font-size="19" font-weight="700" fill="#32694a">04 · Critique / Verifier</text><rect x="22" y="56" width="155" height="48" rx="8" fill="#fff" stroke="#9fc4a9"/><text x="99" y="85" font-size="14" text-anchor="middle" fill="#4b745b">答案 + 证据</text><path d="M184 80 H232" stroke="#628b70" stroke-width="2.5"/><path d="M226 74 L235 80 L226 86" fill="none" stroke="#628b70" stroke-width="2.5"/><rect x="242" y="56" width="178" height="48" rx="8" fill="#d7ebdc" stroke="#8ab99a"/><text x="331" y="85" font-size="14" text-anchor="middle" fill="#32694a">缺陷 / 证据 / 结论</text><text x="22" y="132" font-size="13" fill="#557b62">适合：事实、代码与推理核验；风险：评审器也会幻觉</text></g>
</g></svg>