<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title-03 desc-03">
<title id="title-03">Position swap audit for pairwise judging</title><desc id="desc-03">The same two answers are judged twice, once as A then B and once as B then A. Choosing the same answer indicates candidate consistency; choosing the first slot both times indicates primacy bias.</desc>
<rect width="1000" height="420" rx="22" fill="#f8faf8"/><text x="38" y="50" font-size="23" font-weight="700" fill="#25464b">只交换位置，不改变答案内容：把位置效应单独测出来</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<text x="250" y="104" font-size="18" font-weight="700" fill="#315a66">原始顺序</text><rect x="100" y="126" width="145" height="68" rx="12" fill="#dcecf2" stroke="#8daeba" stroke-width="2"/><text x="172" y="154" font-size="18" font-weight="700" fill="#315a66">第 1 位</text><text x="172" y="178" font-size="15" fill="#45666e">答案 A</text><rect x="270" y="126" width="145" height="68" rx="12" fill="#f5e8d8" stroke="#d9a56d" stroke-width="2"/><text x="342" y="154" font-size="18" font-weight="700" fill="#80552d">第 2 位</text><text x="342" y="178" font-size="15" fill="#795f47">答案 B</text>
<text x="750" y="104" font-size="18" font-weight="700" fill="#315a66">交换顺序</text><rect x="585" y="126" width="145" height="68" rx="12" fill="#f5e8d8" stroke="#d9a56d" stroke-width="2"/><text x="657" y="154" font-size="18" font-weight="700" fill="#80552d">第 1 位</text><text x="657" y="178" font-size="15" fill="#795f47">答案 B</text><rect x="755" y="126" width="145" height="68" rx="12" fill="#dcecf2" stroke="#8daeba" stroke-width="2"/><text x="827" y="154" font-size="18" font-weight="700" fill="#315a66">第 2 位</text><text x="827" y="178" font-size="15" fill="#45666e">答案 A</text>
<path d="M430 160 H565" stroke="#557b78" stroke-width="3" stroke-dasharray="8 6"/><path d="M555 151 L568 160 L555 169" fill="none" stroke="#557b78" stroke-width="3"/>
<rect x="75" y="250" width="400" height="110" rx="14" fill="#e7f3ec" stroke="#8ab99a" stroke-width="2"/><text x="275" y="283" font-size="18" font-weight="700" fill="#32694a">内容一致：A 胜 → A 胜</text><text x="275" y="312" font-size="15" fill="#4b745b">原始选第 1 位，交换后选第 2 位</text><text x="275" y="338" font-size="14" fill="#4b745b">同一候选 A 获胜，位置一致</text>
<rect x="525" y="250" width="400" height="110" rx="14" fill="#fff0e4" stroke="#d9a56d" stroke-width="2"/><text x="725" y="283" font-size="18" font-weight="700" fill="#80552d">位置偏好：第 1 位 → 第 1 位</text><text x="725" y="312" font-size="15" fill="#795f47">原始选 A，交换后选 B</text><text x="725" y="338" font-size="14" fill="#795f47">获胜候选改变，说明首位偏好</text>
</g></svg>