<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title-04 desc-04">
<title id="title-04">Three dimensions of judge meta-evaluation</title><desc id="desc-04">A judge should be evaluated on agreement with human reference labels, consistency under repeated runs, and fairness or robustness under controlled perturbations.</desc>
<rect width="1000" height="430" rx="22" fill="#f8faf8"/><text x="38" y="52" font-size="23" font-weight="700" fill="#25464b">评审器的三维体检：有效性、稳定性、公平性</text>
<g font-family="Arial, sans-serif">
<g transform="translate(42 105)"><rect width="285" height="240" rx="18" fill="#e7f0f4" stroke="#8daeba" stroke-width="2"/><circle cx="142" cy="70" r="34" fill="#d0e4ec" stroke="#6d9aaa" stroke-width="2"/><path d="M126 70 L138 82 L160 55" fill="none" stroke="#356b7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#315a66">Agreement</text><text x="142" y="161" text-anchor="middle" font-size="15" fill="#45666e">与人工参考是否一致？</text><text x="142" y="192" text-anchor="middle" font-size="13" fill="#45666e">Spearman · κ · Alpha</text><text x="142" y="217" text-anchor="middle" font-size="13" fill="#45666e">Human–human baseline</text></g>
<g transform="translate(357 105)"><rect width="285" height="240" rx="18" fill="#eeeafa" stroke="#aaa0d0" stroke-width="2"/><circle cx="142" cy="70" r="34" fill="#e0daf4" stroke="#8e82bc" stroke-width="2"/><path d="M122 68 C122 47 155 44 161 64 C166 83 145 92 132 80 M132 80 L131 68 M132 80 L145 81" fill="none" stroke="#51447d" stroke-width="4" stroke-linecap="round"/><text x="142" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#51447d">Consistency</text><text x="142" y="161" text-anchor="middle" font-size="15" fill="#665d87">相同输入是否稳定？</text><text x="142" y="192" text-anchor="middle" font-size="13" fill="#665d87">Repeat · Seed · Prompt</text><text x="142" y="217" text-anchor="middle" font-size="13" fill="#665d87">Test–retest reliability</text></g>
<g transform="translate(672 105)"><rect width="285" height="240" rx="18" fill="#e7f3ec" stroke="#8ab99a" stroke-width="2"/><circle cx="142" cy="70" r="34" fill="#d7ebdc" stroke="#78a98a" stroke-width="2"/><path d="M142 45 L165 86 H119 Z" fill="none" stroke="#32694a" stroke-width="4" stroke-linejoin="round"/><path d="M142 59 V72 M142 79 V81" stroke="#32694a" stroke-width="4" stroke-linecap="round"/><text x="142" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#32694a">Fairness &amp; Robustness</text><text x="142" y="161" text-anchor="middle" font-size="15" fill="#557b62">无关变化会改变结论吗？</text><text x="142" y="192" text-anchor="middle" font-size="13" fill="#557b62">Swap · Length · Style · Attack</text><text x="142" y="217" text-anchor="middle" font-size="13" fill="#557b62">Calibration · Stress test</text></g>
<text x="500" y="391" text-anchor="middle" font-size="15" font-weight="700" fill="#4d6968">三者不可互相替代：高一致性 ≠ 高有效性；高相关性 ≠ 无偏差</text>
</g></svg>