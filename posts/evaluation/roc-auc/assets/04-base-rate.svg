<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-labelledby="roc-d-title roc-d-desc"><title id="roc-d-title">不同正类比例下的Precision</title><desc id="roc-d-desc">TPR固定0.9、FPR固定0.01，正类占比50%时精确率98.9%，正类占比1%时精确率47.6%。</desc><rect width="760" height="355" rx="13" fill="#fcfdfa"/><text x="35" y="40" font-size="20" fill="#216f69" >04 / ROC 不变时，基率能改变 Precision</text><rect x="43" y="78" width="325" height="212" rx="14" fill="#e9f5ef" stroke="#a9d2c1"/><text x="205" y="129" font-size="22" fill="#305d60" text-anchor="middle">正类 50%</text><text x="205" y="181" font-size="23" fill="#1b7b73" text-anchor="middle" font-weight="700">Precision 98.9%</text><text x="205" y="232" font-size="14" fill="#6a7270" text-anchor="middle">10,000 例：TP 4500 / FP 50</text><rect x="395" y="78" width="325" height="212" rx="14" fill="#fff2e9" stroke="#e7c4a9"/><text x="557" y="129" font-size="22" fill="#305d60" text-anchor="middle">正类 1%</text><text x="557" y="181" font-size="23" fill="#b36c4b" text-anchor="middle" font-weight="700">Precision 47.6%</text><text x="557" y="232" font-size="14" fill="#6a7270" text-anchor="middle">10,000 例：TP 90 / FP 99</text><text x="380" y="327" font-size="14" fill="#607878" text-anchor="middle">两个实验均假定 TPR = 90%，FPR = 1%（非论文结果）</text></svg>
