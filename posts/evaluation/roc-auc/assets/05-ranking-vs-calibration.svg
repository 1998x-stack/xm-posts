<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-labelledby="roc-e-title roc-e-desc"><title id="roc-e-title">AUC与阈值和校准的区别</title><desc id="roc-e-desc">三个框分别解释排序能力、操作阈值和概率校准，不可相互替代。</desc><rect width="760" height="355" rx="13" fill="#fcfdfa"/><text x="35" y="40" font-size="20" fill="#216f69" >05 / 排序、阈值决策、概率校准回答不同问题</text><rect x="31" y="82" width="215" height="224" rx="13" fill="#e7f4ee" stroke="#b7d5c8"/><text x="138" y="128" font-size="19" fill="#315a62" text-anchor="middle" font-weight="700">AUC / 排序</text><text x="138" y="202" font-size="15" fill="#526e71" text-anchor="middle">正例是否排在</text><text x="138" y="235" font-size="15" fill="#526e71" text-anchor="middle">负例前面？</text><rect x="272" y="82" width="215" height="224" rx="13" fill="#edf2fb" stroke="#c8d4e8"/><text x="379" y="128" font-size="19" fill="#315a62" text-anchor="middle" font-weight="700">阈值 / 行动</text><text x="379" y="202" font-size="15" fill="#526e71" text-anchor="middle">在约束下何时</text><text x="379" y="235" font-size="15" fill="#526e71" text-anchor="middle">触发决策？</text><rect x="513" y="82" width="215" height="224" rx="13" fill="#fff2e8" stroke="#e8c7ac"/><text x="620" y="128" font-size="19" fill="#315a62" text-anchor="middle" font-weight="700">校准 / 概率</text><text x="620" y="202" font-size="15" fill="#526e71" text-anchor="middle">输出的 0.8 是否</text><text x="620" y="235" font-size="15" fill="#526e71" text-anchor="middle">真的约有80%？</text></svg>
