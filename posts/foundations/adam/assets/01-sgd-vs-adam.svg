<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="adam-fig01-title adam-fig01-desc" data-export="adam-fig01.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="adam-fig01-title">同一梯度，SGD 与 Adam 第一步更新的比例不同</title><desc id="adam-fig01-desc">在二维 toy gradient g=(4,1) 且零初始、epsilon 为零时，SGD 的步长比例是四比一，Adam 第一步为一比一；不代表每一步都相等。</desc><rect x="1" y="1" width="758" height="338" rx="16" fill="#fbfdfb" stroke="#e3ebe7"/><text x="380" y="39" fill="#233c45" font-size="19" font-weight="700" text-anchor="middle">一个梯度向量 g = (4, 1)，两个参数坐标</text><rect x="30" y="60" width="335" height="220" rx="12" fill="#fff" stroke="#dae6e1"/><rect x="395" y="60" width="335" height="220" rx="12" fill="#fff" stroke="#dae6e1"/><text x="198" y="94" fill="#477fa5" font-size="18" font-weight="700" text-anchor="middle">SGD · 同一学习率</text><text x="562" y="94" fill="#237e78" font-size="18" font-weight="700" text-anchor="middle">Adam · 第一步</text><text x="90" y="146" fill="#657c80" font-size="14" font-weight="500" text-anchor="middle">坐标 1</text><text x="90" y="208" fill="#657c80" font-size="14" font-weight="500" text-anchor="middle">坐标 2</text><text x="455" y="146" fill="#657c80" font-size="14" font-weight="500" text-anchor="middle">坐标 1</text><text x="455" y="208" fill="#657c80" font-size="14" font-weight="500" text-anchor="middle">坐标 2</text><line x1="150" y1="135" x2="335" y2="135" stroke="#d7e2e0" stroke-width="2"  stroke-linecap="round"/><line x1="150" y1="197" x2="335" y2="197" stroke="#d7e2e0" stroke-width="2"  stroke-linecap="round"/><line x1="515" y1="135" x2="700" y2="135" stroke="#d7e2e0" stroke-width="2"  stroke-linecap="round"/><line x1="515" y1="197" x2="700" y2="197" stroke="#d7e2e0" stroke-width="2"  stroke-linecap="round"/><line x1="150" y1="135" x2="310" y2="135" stroke="#477fa5" stroke-width="13"  stroke-linecap="round"/><line x1="150" y1="197" x2="190" y2="197" stroke="#477fa5" stroke-width="13"  stroke-linecap="round"/><line x1="515" y1="135" x2="625" y2="135" stroke="#237e78" stroke-width="13"  stroke-linecap="round"/><line x1="515" y1="197" x2="625" y2="197" stroke="#237e78" stroke-width="13"  stroke-linecap="round"/><text x="200" y="257" fill="#477fa5" font-size="16" font-weight="650" text-anchor="middle">相对步长 4 : 1</text><text x="563" y="257" fill="#237e78" font-size="16" font-weight="650" text-anchor="middle">相对步长 1 : 1</text><text x="380" y="313" fill="#657c80" font-size="13" font-weight="500" text-anchor="middle">教学设定：t = 1，m₀ = v₀ = 0，ε = 0，两个梯度均为正</text></svg>