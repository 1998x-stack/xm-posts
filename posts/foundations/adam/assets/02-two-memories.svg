<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" width="760" height="365" role="img" aria-labelledby="adam-fig02-title adam-fig02-desc" data-export="adam-fig02.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="adam-fig02-title">Adam 的两条指数记忆路径</title><desc id="adam-fig02-desc">梯度同时更新一阶矩 m 和二阶原始矩 v，分别做零初始化偏差修正，再按坐标合成参数更新。</desc><rect x="1" y="1" width="758" height="363" rx="16" fill="#fbfdfb" stroke="#e3ebe7"/><text x="380" y="35" fill="#233c45" font-size="20" font-weight="700" text-anchor="middle">同一批梯度，走两条不同的记忆路径</text><rect x="290" y="57" width="180" height="48" rx="12" fill="#e8f4f0" stroke="#dae6e1"/><text x="380" y="87" fill="#237e78" font-size="19" font-weight="700" text-anchor="middle">gₜ ∈ ℝᵈ</text><line x1="380" y1="105" x2="380" y2="125" stroke="#657c80" stroke-width="2"  stroke-linecap="round"/><line x1="190" y1="125" x2="570" y2="125" stroke="#657c80" stroke-width="2"  stroke-linecap="round"/><line x1="190" y1="125" x2="190" y2="146" stroke="#657c80" stroke-width="2"  stroke-linecap="round"/><line x1="570" y1="125" x2="570" y2="146" stroke="#657c80" stroke-width="2"  stroke-linecap="round"/><rect x="50" y="148" width="280" height="76" rx="12" fill="#e7f1f7" stroke="#dae6e1"/><rect x="430" y="148" width="280" height="76" rx="12" fill="#f3eaf8" stroke="#dae6e1"/><text x="190" y="176" fill="#477fa5" font-size="19" font-weight="700" text-anchor="middle">一阶矩 mₜ</text><text x="190" y="204" fill="#233c45" font-size="14" font-weight="500" text-anchor="middle">方向：梯度的平滑均值</text><text x="570" y="176" fill="#796ba3" font-size="19" font-weight="700" text-anchor="middle">二阶原始矩 vₜ</text><text x="570" y="204" fill="#233c45" font-size="14" font-weight="500" text-anchor="middle">尺度：平方梯度的平滑均值</text><line x1="190" y1="225" x2="190" y2="250" stroke="#477fa5" stroke-width="3"  stroke-linecap="round"/><polygon points="190,250 179,244 179,256" fill="#477fa5"/><line x1="570" y1="225" x2="570" y2="250" stroke="#796ba3" stroke-width="3"  stroke-linecap="round"/><polygon points="570,250 559,244 559,256" fill="#796ba3"/><rect x="85" y="251" width="210" height="51" rx="12" fill="#fff" stroke="#dae6e1"/><rect x="465" y="251" width="210" height="51" rx="12" fill="#fff" stroke="#dae6e1"/><text x="190" y="283" fill="#477fa5" font-size="15" font-weight="700" text-anchor="middle">m̂ₜ = mₜ / (1−β₁ᵗ)</text><text x="570" y="283" fill="#796ba3" font-size="15" font-weight="700" text-anchor="middle">v̂ₜ = vₜ / (1−β₂ᵗ)</text><text x="380" y="330" fill="#237e78" font-size="19" font-weight="700" text-anchor="middle">θₜ ← θₜ₋₁ − α · m̂ₜ / (√v̂ₜ + ε)</text></svg>