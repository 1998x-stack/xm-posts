<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 367" width="760" height="367" role="img" aria-labelledby="adam-fig03-title adam-fig03-desc" data-export="adam-fig03.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="adam-fig03-title">指数滑动平均的时间权重</title><desc id="adam-fig03-desc">越近的梯度通常获得更大的未归一化权重；β1 等于 0.9 的衰减比 β2 等于 0.999 快。</desc><rect x="1" y="1" width="758" height="365" rx="16" fill="#fbfdfb" stroke="#e3ebe7"/><text x="380" y="42" fill="#233c45" font-size="18" font-weight="700" text-anchor="middle">先看一段 5 步历史：各时间点给现在留下多少权重？</text><text x="132" y="100" fill="#657c80" font-size="15" font-weight="600" text-anchor="middle">时间步</text><text x="132" y="144" fill="#233c45" font-size="17" font-weight="500" text-anchor="middle">g₁</text><text x="132" y="184" fill="#233c45" font-size="17" font-weight="500" text-anchor="middle">g₂</text><text x="132" y="224" fill="#233c45" font-size="17" font-weight="500" text-anchor="middle">g₃</text><text x="132" y="264" fill="#233c45" font-size="17" font-weight="500" text-anchor="middle">g₄</text><text x="132" y="304" fill="#233c45" font-size="17" font-weight="500" text-anchor="middle">g₅ (现在)</text><text x="316" y="100" fill="#477fa5" font-size="17" font-weight="700" text-anchor="middle">β₁ = 0.9</text><text x="588" y="100" fill="#796ba3" font-size="17" font-weight="700" text-anchor="middle">β₂ = 0.999</text><rect x="212" y="125" width="118.098" height="16" rx="4" fill="#93b9d1" stroke="none"/><rect x="480" y="125" width="179.28107928018" height="16" rx="4" fill="#bcaddc" stroke="none"/><rect x="212" y="165" width="131.22000000000003" height="16" rx="4" fill="#93b9d1" stroke="none"/><rect x="480" y="165" width="179.46053982" height="16" rx="4" fill="#bcaddc" stroke="none"/><rect x="212" y="205" width="145.8" height="16" rx="4" fill="#93b9d1" stroke="none"/><rect x="480" y="205" width="179.64018000000002" height="16" rx="4" fill="#bcaddc" stroke="none"/><rect x="212" y="245" width="162" height="16" rx="4" fill="#93b9d1" stroke="none"/><rect x="480" y="245" width="179.82" height="16" rx="4" fill="#bcaddc" stroke="none"/><rect x="212" y="285" width="180" height="16" rx="4" fill="#93b9d1" stroke="none"/><rect x="480" y="285" width="180" height="16" rx="4" fill="#bcaddc" stroke="none"/><text x="380" y="341" fill="#657c80" font-size="13" font-weight="500" text-anchor="middle">只示意权重形状；m 用 g，v 用 g²，图中未表现初始质量缺失</text></svg>