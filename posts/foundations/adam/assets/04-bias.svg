<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 337" width="760" height="337" role="img" aria-labelledby="adam-fig04-title adam-fig04-desc" data-export="adam-fig04.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="adam-fig04-title">零初始化偏差修正的第一步</title><desc id="adam-fig04-desc">恒定梯度 g 等于 2 时，一阶矩 m1 等于 0.2 修正后等于 2，二阶原始矩 v1 等于 0.004 修正后等于 4。</desc><rect x="1" y="1" width="758" height="335" rx="16" fill="#fbfdfb" stroke="#e3ebe7"/><text x="380" y="43" fill="#233c45" font-size="20" font-weight="700" text-anchor="middle">假设第一步梯度 g₁ = 2，m₀ = v₀ = 0</text><rect x="35" y="66" width="330" height="216" rx="12" fill="#fff" stroke="#dae6e1"/><rect x="395" y="66" width="330" height="216" rx="12" fill="#fff" stroke="#dae6e1"/><text x="200" y="105" fill="#477fa5" font-size="17" font-weight="700" text-anchor="middle">方向记忆 · β₁ = 0.9</text><text x="560" y="105" fill="#796ba3" font-size="17" font-weight="700" text-anchor="middle">平方记忆 · β₂ = 0.999</text><text x="200" y="155" fill="#233c45" font-size="17" font-weight="500" text-anchor="middle">m₁ = 0.1 × 2 = 0.2</text><text x="560" y="155" fill="#233c45" font-size="17" font-weight="500" text-anchor="middle">v₁ = 0.001 × 4 = 0.004</text><line x1="200" y1="171" x2="200" y2="200" stroke="#477fa5" stroke-width="3"  stroke-linecap="round"/><polygon points="200,200 189,194 189,206" fill="#477fa5"/><line x1="560" y1="171" x2="560" y2="200" stroke="#796ba3" stroke-width="3"  stroke-linecap="round"/><polygon points="560,200 549,194 549,206" fill="#796ba3"/><rect x="105" y="208" width="190" height="54" rx="9" fill="#e7f1f7" stroke="none"/><rect x="465" y="208" width="190" height="54" rx="9" fill="#f3eaf8" stroke="none"/><text x="200" y="241" fill="#477fa5" font-size="17" font-weight="700" text-anchor="middle">m̂₁ = 0.2 / 0.1 = 2</text><text x="560" y="241" fill="#796ba3" font-size="16" font-weight="700" text-anchor="middle">v̂₁ = 0.004 / 0.001 = 4</text><text x="380" y="311" fill="#657c80" font-size="14" font-weight="500" text-anchor="middle">不修正并非“更保守”那么简单：分母和分子受偏差影响的程度不同</text></svg>