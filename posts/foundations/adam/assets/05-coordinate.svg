<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 343" width="760" height="343" role="img" aria-labelledby="adam-fig05-title adam-fig05-desc" data-export="adam-fig05.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="adam-fig05-title">逐参数的学习率缩放</title><desc id="adam-fig05-desc">坐标一的梯度是 4、坐标二的梯度是 1；第一次 Adam 更新按各自平方梯度归一化，两者的更新绝对值都约为 alpha。</desc><rect x="1" y="1" width="758" height="341" rx="16" fill="#fbfdfb" stroke="#e3ebe7"/><text x="380" y="40" fill="#233c45" font-size="20" font-weight="700" text-anchor="middle">第一次更新的逐坐标计算</text><rect x="45" y="67" width="670" height="220" rx="12" fill="#fff" stroke="#dae6e1"/><text x="140" y="109" fill="#657c80" font-size="16" font-weight="700" text-anchor="middle">坐标</text><text x="290" y="109" fill="#657c80" font-size="17" font-weight="700" text-anchor="middle">gᵢ</text><text x="453" y="109" fill="#657c80" font-size="17" font-weight="700" text-anchor="middle">√v̂ᵢ</text><text x="615" y="109" fill="#657c80" font-size="17" font-weight="700" text-anchor="middle">m̂ᵢ / √v̂ᵢ</text><line x1="90" y1="124" x2="672" y2="124" stroke="#dae6e1" stroke-width="2"  stroke-linecap="round"/><text x="140" y="162" fill="#477fa5" font-size="20" font-weight="700" text-anchor="middle">θ₁</text><text x="290" y="162" fill="#233c45" font-size="20" font-weight="500" text-anchor="middle">4</text><text x="453" y="162" fill="#233c45" font-size="20" font-weight="500" text-anchor="middle">4</text><text x="615" y="162" fill="#237e78" font-size="20" font-weight="750" text-anchor="middle">1</text><line x1="90" y1="184" x2="672" y2="184" stroke="#dae6e1" stroke-width="1"  stroke-linecap="round"/><text x="140" y="228" fill="#796ba3" font-size="20" font-weight="700" text-anchor="middle">θ₂</text><text x="290" y="228" fill="#233c45" font-size="20" font-weight="500" text-anchor="middle">1</text><text x="453" y="228" fill="#233c45" font-size="20" font-weight="500" text-anchor="middle">1</text><text x="615" y="228" fill="#237e78" font-size="20" font-weight="750" text-anchor="middle">1</text><text x="380" y="319" fill="#657c80" font-size="13" font-weight="500" text-anchor="middle">只在 t=1、零初始、ε=0、非零梯度时如此；不是所有时间步的恒等式</text></svg>