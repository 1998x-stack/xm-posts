<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" role="img" aria-labelledby="adam-fig06-title adam-fig06-desc" data-export="adam-fig06.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="adam-fig06-title">传统 L2 梯度正则与 AdamW 的不同路径</title><desc id="adam-fig06-desc">Adam 的 coupled L2 把 lambda theta 加到梯度，再进入两份历史矩；AdamW 用损失梯度更新矩，并直接对参数做可分离的权重衰减。</desc><rect x="1" y="1" width="758" height="360" rx="16" fill="#fbfdfb" stroke="#e3ebe7"/><text x="380" y="42" fill="#233c45" font-size="20" font-weight="700" text-anchor="middle">权重衰减放在哪里？</text><rect x="24" y="70" width="344" height="236" rx="12" fill="#fff" stroke="#dae6e1"/><rect x="392" y="70" width="344" height="236" rx="12" fill="#fff" stroke="#dae6e1"/><text x="196" y="104" fill="#cb7855" font-size="18" font-weight="700" text-anchor="middle">Adam + coupled L₂</text><text x="564" y="104" fill="#237e78" font-size="18" font-weight="700" text-anchor="middle">AdamW · decoupled</text><rect x="62" y="125" width="268" height="48" rx="8" fill="#fff1e6" stroke="none"/><text x="196" y="155" fill="#cb7855" font-size="17" font-weight="700" text-anchor="middle">g ← ∇L + λθ</text><line x1="196" y1="176" x2="196" y2="194" stroke="#cb7855" stroke-width="3"  stroke-linecap="round"/><polygon points="196,194 185,188 185,200" fill="#cb7855"/><rect x="68" y="197" width="256" height="46" rx="7" fill="#f3f4f6" stroke="none"/><text x="196" y="226" fill="#233c45" font-size="16" font-weight="500" text-anchor="middle">m, v 都会混入 λθ</text><text x="564" y="151" fill="#477fa5" font-size="18" font-weight="700" text-anchor="middle">g ← ∇L</text><line x1="564" y1="167" x2="564" y2="194" stroke="#237e78" stroke-width="3"  stroke-linecap="round"/><polygon points="564,194 553,188 553,200" fill="#237e78"/><rect x="438" y="197" width="252" height="46" rx="7" fill="#e6f5ef" stroke="none"/><text x="564" y="226" fill="#233c45" font-size="15" font-weight="500" text-anchor="middle">m, v 只跟踪损失梯度</text><text x="196" y="282" fill="#cb7855" font-size="14" font-weight="650" text-anchor="middle">衰减受自适应分母影响</text><text x="564" y="282" fill="#237e78" font-size="15" font-weight="650" text-anchor="middle">再执行 θ ← (1−αλ)θ</text><text x="380" y="338" fill="#657c80" font-size="13" font-weight="500" text-anchor="middle">两种操作一般不等价；右侧是 2019 年 AdamW 论文的思想，不是原始 Adam 算法</text></svg>