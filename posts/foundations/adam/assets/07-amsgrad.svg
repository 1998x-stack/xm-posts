<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" role="img" aria-labelledby="adam-fig07-title adam-fig07-desc" data-export="adam-fig07.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="adam-fig07-title">AMSGrad 保存第二矩历史上界</title><desc id="adam-fig07-desc">在连续估计 v_t 波动时，AMSGrad 保存逐坐标历史最大 v；这是后续为处理 Adam 收敛反例提出的变体。</desc><rect x="1" y="1" width="758" height="366" rx="16" fill="#fbfdfb" stroke="#e3ebe7"/><text x="380" y="42" fill="#233c45" font-size="20" font-weight="700" text-anchor="middle">可变的二阶矩估计 vs 保留历史最大值</text><text x="149" y="92" fill="#657c80" font-size="15" font-weight="650" text-anchor="middle">时间</text><text x="382" y="92" fill="#796ba3" font-size="17" font-weight="700" text-anchor="middle">Adam: vₜ</text><text x="625" y="92" fill="#237e78" font-size="17" font-weight="700" text-anchor="middle">AMSGrad: max(v₁…vₜ)</text><text x="145" y="137" fill="#233c45" font-size="15" font-weight="500" text-anchor="middle">t=1</text><rect x="278" y="118" width="45" height="24" rx="6" fill="#b7a6d6" stroke="none"/><rect x="517" y="118" width="45" height="24" rx="6" fill="#82bfb1" stroke="none"/><text x="145" y="186" fill="#233c45" font-size="15" font-weight="500" text-anchor="middle">t=2</text><rect x="278" y="167" width="180" height="24" rx="6" fill="#b7a6d6" stroke="none"/><rect x="517" y="167" width="180" height="24" rx="6" fill="#82bfb1" stroke="none"/><text x="145" y="235" fill="#233c45" font-size="15" font-weight="500" text-anchor="middle">t=3</text><rect x="278" y="216" width="90" height="24" rx="6" fill="#b7a6d6" stroke="none"/><rect x="517" y="216" width="180" height="24" rx="6" fill="#82bfb1" stroke="none"/><text x="145" y="284" fill="#233c45" font-size="15" font-weight="500" text-anchor="middle">t=4</text><rect x="278" y="265" width="68" height="24" rx="6" fill="#b7a6d6" stroke="none"/><rect x="517" y="265" width="180" height="24" rx="6" fill="#82bfb1" stroke="none"/><text x="380" y="340" fill="#657c80" font-size="13" font-weight="500" text-anchor="middle">示意序列不是论文中的反例；严格实现使用未校正的 v 上界再按时间修正</text></svg>