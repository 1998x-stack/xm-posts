<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SGD：同一条更新可以写成两种形式" viewBox="0 0 760 310" width="760" height="310"><title>SGD：同一条更新可以写成两种形式</title><desc>当衰减系数满足 delta 等于学习率乘以 L2 系数时，普通 SGD 的两个公式相同。</desc><rect x="0.5" y="0.5" width="759" height="309" rx="19" fill="#fbfcfa" stroke="#dce6e0"/><text x="30" y="39" fill="#203035" font-size="17" font-weight="700" text-anchor="start">FIG. 01  /  SGD：同一条更新可以写成两种形式</text><path d="M30 54 H730" stroke="#cdd8d6" stroke-width="1.5"/><rect x="30" y="93" width="195" height="76" rx="13" fill="#fff0e9" stroke="#c5684e" stroke-width="1.7"/><text x="127.5" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">损失函数加入 L₂</text><text x="127.5" y="148" text-anchor="middle" font-size="13" fill="#526b70">g + λL₂ · θ</text><path d="M232,131 L276,131" stroke="#c5684e" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M268,126 L276,131 L268,136" stroke="#c5684e" fill="none" stroke-width="2.7" stroke-linejoin="round"/><rect x="283" y="93" width="190" height="76" rx="13" fill="#fff0e9" stroke="#c5684e" stroke-width="1.7"/><text x="378" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">SGD 更新</text><text x="378" y="148" text-anchor="middle" font-size="13" fill="#526b70">θ − α(g + λL₂θ)</text><path d="M480,131 L518,131" stroke="#c5684e" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M510,126 L518,131 L510,136" stroke="#c5684e" fill="none" stroke-width="2.7" stroke-linejoin="round"/><rect x="526" y="93" width="203" height="76" rx="13" fill="#e8f4f0" stroke="#147f80" stroke-width="1.7"/><text x="627.5" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">结果</text><text x="627.5" y="148" text-anchor="middle" font-size="13" fill="#526b70">(1 − αλL₂)θ − αg</text><rect x="30" y="205" width="195" height="69" rx="13" fill="#e8f4f0" stroke="#147f80" stroke-width="1.7"/><text x="127.5" y="232.5" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">直接 Weight Decay</text><text x="127.5" y="256.5" text-anchor="middle" font-size="13" fill="#526b70">δ = α · λL₂</text><path d="M232,239 L276,239" stroke="#147f80" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M268,234 L276,239 L268,244" stroke="#147f80" fill="none" stroke-width="2.7" stroke-linejoin="round"/><rect x="283" y="205" width="190" height="69" rx="13" fill="#e8f4f0" stroke="#147f80" stroke-width="1.7"/><text x="378" y="232.5" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">先缩小，再走梯度</text><text x="378" y="256.5" text-anchor="middle" font-size="13" fill="#526b70">(1 − δ)θ − αg</text><path d="M480,239 L518,239" stroke="#147f80" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M510,234 L518,239 L510,244" stroke="#147f80" fill="none" stroke-width="2.7" stroke-linejoin="round"/><rect x="526" y="205" width="203" height="69" rx="13" fill="#e8f4f0" stroke="#147f80" stroke-width="1.7"/><text x="627.5" y="232.5" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">同一个参数点</text><text x="627.5" y="256.5" text-anchor="middle" font-size="13" fill="#526b70">等价：普通 SGD</text></svg>
