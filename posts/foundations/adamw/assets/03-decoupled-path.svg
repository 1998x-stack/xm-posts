<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="解耦：衰减绕开一阶与二阶统计" viewBox="0 0 760 310" width="760" height="310"><title>解耦：衰减绕开一阶与二阶统计</title><desc>Adam 的一阶与二阶动量仅由任务梯度计算；权重衰减直接作用于更新前的参数。</desc><rect x="0.5" y="0.5" width="759" height="309" rx="19" fill="#fbfcfa" stroke="#dce6e0"/><text x="30" y="39" fill="#203035" font-size="17" font-weight="700" text-anchor="start">FIG. 03  /  解耦：衰减绕开一阶与二阶统计</text><path d="M30 54 H730" stroke="#cdd8d6" stroke-width="1.5"/><rect x="33" y="101" width="149" height="72" rx="13" fill="#e8f4f0" stroke="#147f80" stroke-width="1.7"/><text x="107.5" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">任务梯度</text><text x="107.5" y="154" text-anchor="middle" font-size="13" fill="#526b70">gₜ</text><path d="M189,137 L244,137" stroke="#147f80" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M236,132 L244,137 L236,142" stroke="#147f80" fill="none" stroke-width="2.7" stroke-linejoin="round"/><rect x="251" y="101" width="165" height="72" rx="13" fill="#f0ebfb" stroke="#7660ad" stroke-width="1.7"/><text x="333.5" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">Adam 统计</text><text x="333.5" y="154" text-anchor="middle" font-size="13" fill="#526b70">mₜ、vₜ</text><path d="M423,137 L495,137" stroke="#7660ad" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M487,132 L495,137 L487,142" stroke="#7660ad" fill="none" stroke-width="2.7" stroke-linejoin="round"/><rect x="502" y="101" width="226" height="72" rx="13" fill="#f0ebfb" stroke="#7660ad" stroke-width="1.7"/><text x="615" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">自适应梯度步</text><text x="615" y="154" text-anchor="middle" font-size="13" fill="#526b70">−α · m̂ / (√v̂ + ε)</text><rect x="33" y="219" width="149" height="60" rx="13" fill="#fff0e9" stroke="#c5684e" stroke-width="1.7"/><text x="107.5" y="242" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">旧参数 θ</text><text x="107.5" y="266" text-anchor="middle" font-size="13" fill="#526b70">被缩小的对象</text><path d="M189,248 L244,248" stroke="#c5684e" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M236,243 L244,248 L236,253" stroke="#c5684e" fill="none" stroke-width="2.7" stroke-linejoin="round"/><rect x="251" y="212" width="165" height="72" rx="13" fill="#fff0e9" stroke="#c5684e" stroke-width="1.7"/><text x="333.5" y="241" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">直接衰减</text><text x="333.5" y="265" text-anchor="middle" font-size="13" fill="#526b70">−αλ · θ</text><path d="M423,248 L495,248" stroke="#c5684e" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M487,243 L495,248 L487,253" stroke="#c5684e" fill="none" stroke-width="2.7" stroke-linejoin="round"/><rect x="502" y="207" width="226" height="76" rx="13" fill="#e8f4f0" stroke="#147f80" stroke-width="1.7"/><text x="615" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">相加得到 θₜ</text><text x="615" y="262" text-anchor="middle" font-size="13" fill="#526b70">使用同一个旧 θ</text><path d="M616,180 L616,201" stroke="#7660ad" fill="none" stroke-width="2.7" stroke-linecap="round"/><path d="M608,196 L616,201 L608,206" stroke="#7660ad" fill="none" stroke-width="2.7" stroke-linejoin="round"/></svg>
