<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="坐标尺度：为什么 L₂ 被不同程度地缩放" viewBox="0 0 760 310" width="760" height="310"><title>坐标尺度：为什么 L₂ 被不同程度地缩放</title><desc>固定对角预条件器 P 为 diag(1,1/5)，零任务梯度的教学例子中耦合方法第二维衰减较弱。</desc><rect x="0.5" y="0.5" width="759" height="309" rx="19" fill="#fbfcfa" stroke="#dce6e0"/><text x="30" y="39" fill="#203035" font-size="17" font-weight="700" text-anchor="start">FIG. 04  /  坐标尺度：为什么 L₂ 被不同程度地缩放</text><path d="M30 54 H730" stroke="#cdd8d6" stroke-width="1.5"/><text x="30" y="92" fill="#526b70" font-size="16" font-weight="400" text-anchor="start">设 θ=(1,1)，α=0.1，λ=0.1，P=diag(1, 1/5)</text><rect x="35" y="115" width="328" height="76" rx="13" fill="#fff0e9" stroke="#c5684e" stroke-width="1.7"/><text x="199" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">耦合 L₂：θ'=(0.990, 0.998)</text><text x="199" y="170" text-anchor="middle" font-size="13" fill="#526b70">正则梯度也经过 P</text><rect x="398" y="115" width="327" height="76" rx="13" fill="#e8f4f0" stroke="#147f80" stroke-width="1.7"/><text x="561.5" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">解耦 AdamW：θ'=(0.990, 0.990)</text><text x="561.5" y="170" text-anchor="middle" font-size="13" fill="#526b70">参数直接乘以 0.99</text><text x="40" y="226" fill="#203035" font-size="15" font-weight="600" text-anchor="start">第 1 维  /  s₁ = 1</text><text x="398" y="226" fill="#203035" font-size="15" font-weight="600" text-anchor="start">第 2 维  /  s₂ = 5</text><rect x="40" y="243" width="290" height="16" rx="8" fill="#e7eeeb"/><rect x="40" y="243" width="287" height="16" rx="8" fill="#c5684e"/><rect x="399" y="243" width="290" height="16" rx="8" fill="#e7eeeb"/><rect x="399" y="243" width="289" height="16" rx="8" fill="#c5684e"/><text x="40" y="289" fill="#526b70" font-size="14" font-weight="400" text-anchor="start">图为固定 P 推导，并非 Adam 动量真实轨迹</text></svg>
