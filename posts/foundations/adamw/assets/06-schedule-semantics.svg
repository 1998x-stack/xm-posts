<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="别混淆论文与框架的衰减系数" viewBox="0 0 760 310" width="760" height="310"><title>别混淆论文与框架的衰减系数</title><desc>论文的参数项是 ηt λpaper θ；现代实现通常使用 lr_t λimpl θ。两者比较前需要统一单位。</desc><rect x="0.5" y="0.5" width="759" height="309" rx="19" fill="#fbfcfa" stroke="#dce6e0"/><text x="30" y="39" fill="#203035" font-size="17" font-weight="700" text-anchor="start">FIG. 06  /  别混淆论文与框架的衰减系数</text><path d="M30 54 H730" stroke="#cdd8d6" stroke-width="1.5"/><rect x="32" y="98" width="326" height="104" rx="13" fill="#fff0e9" stroke="#c5684e" stroke-width="1.7"/><text x="195" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">原论文 Algorithm 2</text><text x="195" y="167" text-anchor="middle" font-size="13" fill="#526b70">−ηₜ λpaper θ</text><rect x="402" y="98" width="326" height="104" rx="13" fill="#e8f4f0" stroke="#147f80" stroke-width="1.7"/><text x="565" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#203035">常见 PyTorch AdamW</text><text x="565" y="167" text-anchor="middle" font-size="13" fill="#526b70">−lrₜ λimpl θ</text><text x="37" y="239" fill="#526b70" font-size="15" font-weight="400" text-anchor="start">论文：梯度部分 = −ηₜ α · AdamDirection</text><text x="405" y="239" fill="#526b70" font-size="15" font-weight="400" text-anchor="start">实现：lrₜ = ηₜ α</text><text x="53" y="274" fill="#203035" font-size="17" font-weight="700" text-anchor="start">若 α 固定，要匹配同一步衰减：λimpl = λpaper / α</text></svg>
