<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BPE 三代变形" viewBox="0 0 860 272"><title>BPE 三代变形</title><desc>Gage 压缩、Sennrich 子词学习以及 GPT-2 字节级实现的历史脉络</desc><rect width="860" height="272" rx="19" fill="#fafcf9"/><style>text{font-family:system-ui,'Noto Sans SC',sans-serif} .t{font-size:21px;font-weight:700;fill:#203c3f}.s{font-size:17px;fill:#617b7c}.mono{font-family:ui-monospace,monospace;font-size:23px;fill:#174e4c;font-weight:700}.small{font-size:15px;fill:#526c6e}</style><text x="34" y="43" class="t">名字相同，初始单位与目标不同</text><rect x="34" y="78" width="218" height="56" rx="11" fill="#fce9db" stroke="#c3d6d0"/><text x="143" y="112" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#94512f">1994 · Gage</text><path d="M268 105 h42 m-10 -9 l10 9 -10 9" stroke="#d27b50" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="326" y="78" width="235" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="443.5" y="112" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">2016 · Subword</text><path d="M577 105 h42 m-10 -9 l10 9 -10 9" stroke="#d27b50" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="636" y="78" width="191" height="56" rx="11" fill="#f0edfb" stroke="#c3d6d0"/><text x="731.5" y="112" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#5a4c8f">2019 · GPT-2</text><text x="35" y="170" class="s">重复字节对 → 压缩</text><text x="326" y="170" class="s">词内字符/子词 → 词表</text><text x="636" y="170" class="s">UTF-8 字节 → 子词</text><text x="34" y="233" class="small">教学时间线；三者共享“频繁相邻对合并”的思想，但不可互换其编码规范。</text></svg>