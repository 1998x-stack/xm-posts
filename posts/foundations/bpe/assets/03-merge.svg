<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BPE 合并逐层展开" viewBox="0 0 860 272"><title>BPE 合并逐层展开</title><desc>用 low 的训练示意说明相邻符号如何逐步变成更大单位</desc><rect width="860" height="272" rx="19" fill="#fafcf9"/><style>text{font-family:system-ui,'Noto Sans SC',sans-serif} .t{font-size:21px;font-weight:700;fill:#203c3f}.s{font-size:17px;fill:#617b7c}.mono{font-family:ui-monospace,monospace;font-size:23px;fill:#174e4c;font-weight:700}.small{font-size:15px;fill:#526c6e}</style><text x="33" y="42" class="t">频次驱动的局部合并</text><rect x="45" y="85" width="76" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="83" y="119" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">l</text><rect x="135" y="85" width="76" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="173" y="119" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">o</text><rect x="225" y="85" width="76" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="263" y="119" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">w</text><rect x="315" y="85" width="110" height="56" rx="11" fill="#f0edfb" stroke="#c3d6d0"/><text x="370" y="119" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#5a4c8f">&lt;/w&gt;</text><path d="M465 111 h42 m-10 -9 l10 9 -10 9" stroke="#d27b50" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="535" y="85" width="96" height="56" rx="11" fill="#d9eee7" stroke="#c3d6d0"/><text x="583" y="119" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">lo</text><rect x="647" y="85" width="76" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="685" y="119" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">w</text><text x="34" y="200" class="s">先将 l + o 合成 lo；后续仍可能发生 lo + w → low。</text><text x="34" y="233" class="small">每一步按整个加权训练语料的最高频相邻对选取；本图只展示局部词片段。</text></svg>