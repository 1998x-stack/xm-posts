<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="训练与编码的不同流程" viewBox="0 0 860 272"><title>训练与编码的不同流程</title><desc>训练阶段从语料频次学习合并顺序，编码阶段重放冻结的规则</desc><rect width="860" height="272" rx="19" fill="#fafcf9"/><style>text{font-family:system-ui,'Noto Sans SC',sans-serif} .t{font-size:21px;font-weight:700;fill:#203c3f}.s{font-size:17px;fill:#617b7c}.mono{font-family:ui-monospace,monospace;font-size:23px;fill:#174e4c;font-weight:700}.small{font-size:15px;fill:#526c6e}</style><text x="28" y="42" class="t">训练一次，使用很多次</text><rect x="35" y="83" width="192" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="131" y="117" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">带频次的语料</text><path d="M242 110 h42 m-10 -9 l10 9 -10 9" stroke="#d27b50" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="301" y="83" width="196" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="399" y="117" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">学习合并规则</text><path d="M514 110 h42 m-10 -9 l10 9 -10 9" stroke="#d27b50" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="570" y="83" width="225" height="56" rx="11" fill="#f0edfb" stroke="#c3d6d0"/><text x="682.5" y="117" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#5a4c8f">有序 Merge 列表</text><path d="M680 140 v44 h-510 v14" stroke="#c5744d" stroke-width="2.5" fill="none"/><path d="M162 191 l8 7 8 -7" stroke="#c5744d" fill="none" stroke-width="2.5"/><text x="190" y="219" class="s">新词按规则顺序合并 → 子词 token 序列</text><text x="35" y="255" class="small">编码不重新统计新文本中频次；合并表由训练阶段决定。</text></svg>