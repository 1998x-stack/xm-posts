<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="字节级 BPE 管线" viewBox="0 0 860 272"><title>字节级 BPE 管线</title><desc>以汉字为例展示字符在 UTF-8 下变为多个字节后再参与学习</desc><rect width="860" height="272" rx="19" fill="#fafcf9"/><style>text{font-family:system-ui,'Noto Sans SC',sans-serif} .t{font-size:21px;font-weight:700;fill:#203c3f}.s{font-size:17px;fill:#617b7c}.mono{font-family:ui-monospace,monospace;font-size:23px;fill:#174e4c;font-weight:700}.small{font-size:15px;fill:#526c6e}</style><text x="32" y="41" class="t">Byte-level BPE 的初始单位是 byte，不是汉字或词</text><rect x="35" y="88" width="143" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="106.5" y="122" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">你</text><path d="M192 116 h42 m-10 -9 l10 9 -10 9" stroke="#d27b50" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="252" y="88" width="310" height="56" rx="11" fill="#f0edfb" stroke="#c3d6d0"/><text x="407" y="122" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#5a4c8f">E4 · BD · A0</text><path d="M578 116 h42 m-10 -9 l10 9 -10 9" stroke="#d27b50" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="638" y="88" width="184" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="730" y="122" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">BPE merges</text><text x="36" y="192" class="s">单个汉字「你」的 UTF-8 编码为 E4 BD A0（三个字节）。</text><text x="36" y="226" class="small">真实 GPT-2 tokenizer 还包含预分词、字节映射、特殊 token 约定，不能由此示意图直接复原。</text></svg>