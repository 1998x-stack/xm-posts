<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="词表和序列长度的折中" viewBox="0 0 860 272"><title>词表和序列长度的折中</title><desc>小词表较长序列与大词表较短序列之间的常见权衡，图为概念示意</desc><rect width="860" height="272" rx="19" fill="#fafcf9"/><style>text{font-family:system-ui,'Noto Sans SC',sans-serif} .t{font-size:21px;font-weight:700;fill:#203c3f}.s{font-size:17px;fill:#617b7c}.mono{font-family:ui-monospace,monospace;font-size:23px;fill:#174e4c;font-weight:700}.small{font-size:15px;fill:#526c6e}</style><text x="33" y="43" class="t">为什么不是“合并越多越好”？</text><rect x="44" y="95" width="315" height="56" rx="11" fill="#f0edfb" stroke="#c3d6d0"/><text x="201.5" y="129" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#5a4c8f">小词表 · 多个短 token</text><rect x="493" y="95" width="315" height="56" rx="11" fill="#e1f0ea" stroke="#c3d6d0"/><text x="650.5" y="129" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#205e59">较大词表 · 较少长 token</text><path d="M372 122 h107 m-12 -8 l12 8 -12 8" fill="none" stroke="#d27b50" stroke-width="3"/><text x="53" y="196" class="s">序列长、模型输入步数多</text><text x="500" y="196" class="s">嵌入表/输出层的词表开销更大</text><text x="44" y="240" class="small">概念性权衡，非测得曲线；实际效果受数据、模型结构与语言分布影响。</text></svg>