<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="emb1t emb1d" data-export="01-embedding.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif"><title id="emb1t">From ID to learnable geometry</title><desc id="emb1d">Original conceptual illustration for From ID to learnable geometry; not empirical measurements.</desc><rect x="1" y="1" width="758" height="288" rx="16" fill="#fbfdfb" stroke="#d9e8e0"/><text x="380" y="36" font-size="21" font-weight="700" text-anchor="middle" fill="#24434a">From ID to learnable geometry</text><rect x="40" y="103" width="240" height="83" rx="12" fill="#e8f0f9" stroke="#bfd9d2"/><text x="160" y="149.5" font-size="17" text-anchor="middle" fill="#284e54">one-hot: [0,1,0,0]</text><path d="M285 143L450 143" fill="none" stroke="#4b8d86" stroke-width="3" stroke-linecap="round"/><rect x="455" y="103" width="265" height="83" rx="12" fill="#e4f2ec" stroke="#bfd9d2"/><text x="587.5" y="149.5" font-size="17" text-anchor="middle" fill="#284e54">e ∈ R^d</text><text x="380" y="242" text-anchor="middle" fill="#5f797c" font-size="16">近邻是训练结果，而不是编号赋予的语义</text></svg>
