<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="is-f3-title is-f3-desc" data-export="is-f3.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="is-f3-title">重要性权重修正抽样频次</title><desc id="is-f3-desc">从 q 抽样并计算 p/q 权重，再乘目标函数，最后求平均，目标仍是 p 下的期望</desc><rect x="1" y="1" width="798" height="308" rx="15" fill="#fbfdfa" stroke="#dbe6de"/><text x="32" y="45" font-size="21" fill="#28464b" font-weight="700" text-anchor="start">用权重把提议分布的样本还原为目标估计</text><rect x="29" y="105" width="164" height="95" rx="10" fill="#e9f2f7" stroke="#d5e2dc"/><rect x="231" y="105" width="164" height="95" rx="10" fill="#e4f3ed" stroke="#d5e2dc"/><rect x="433" y="105" width="164" height="95" rx="10" fill="#fff0e6" stroke="#d5e2dc"/><rect x="635" y="105" width="140" height="95" rx="10" fill="#f1ecf7" stroke="#d5e2dc"/><text x="111" y="143" font-size="18" fill="#2a4650" font-weight="700" text-anchor="middle">从 q 抽样</text><text x="111" y="172" font-size="15" fill="#55737a" font-weight="600" text-anchor="middle">X ∼ q</text><text x="313" y="143" font-size="18" fill="#207a71" font-weight="700" text-anchor="middle">权重 p/q</text><text x="313" y="172" font-size="15" fill="#55737a" font-weight="600" text-anchor="middle">事件 A：0.05</text><text x="515" y="143" font-size="18" fill="#c97950" font-weight="700" text-anchor="middle">乘以 f(X)</text><text x="515" y="172" font-size="15" fill="#55737a" font-weight="600" text-anchor="middle">w × f</text><text x="705" y="143" font-size="18" fill="#7562a0" font-weight="700" text-anchor="middle">求均值</text><text x="705" y="172" font-size="15" fill="#55737a" font-weight="600" text-anchor="middle">估计 μ</text><path d="M193 151H231M395 151H433M597 151H635" stroke="#208277" stroke-width="3"/><text x="37" y="259" font-size="16" fill="#62797a" font-weight="600" text-anchor="start">事件出现得多，就让每次事件对目标概率的代表权重更小。</text></svg>
