<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="is-f4-title is-f4-desc" data-export="is-f4.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="is-f4-title">稀有事件的精确方差对照</title><desc id="is-f4-desc">直接从 p 抽样的单次方差 0.0099；从 q 抽样并加权后为 0.0004，解析降低 24.75 倍</desc><rect x="1" y="1" width="798" height="308" rx="15" fill="#fbfdfa" stroke="#dbe6de"/><text x="34" y="47" font-size="20" fill="#294750" font-weight="700" text-anchor="start">为稀有事件分配样本，能降低特定估计的方差</text><text x="32" y="113" font-size="17" fill="#397d97" font-weight="700" text-anchor="start">直接抽样</text><text x="32" y="205" font-size="17" fill="#208277" font-weight="700" text-anchor="start">重要性采样</text><rect x="188" y="83" width="525" height="46" rx="10" fill="#edf4f0" stroke="#d5e2dc"/><rect x="188" y="175" width="525" height="46" rx="10" fill="#edf4f0" stroke="#d5e2dc"/><rect x="188" y="83" width="519.75" height="46" fill="#397d97"/><rect x="188" y="175" width="21" height="46" fill="#208277"/><text x="721" y="114" font-size="16" fill="#28464b" font-weight="700" text-anchor="start">0.0099</text><text x="222" y="205" font-size="16" fill="#28464b" font-weight="700" text-anchor="start">0.0004</text><text x="34" y="272" font-size="18" fill="#c97950" font-weight="700" text-anchor="start">解析方差比：0.0099 / 0.0004 = 24.75</text></svg>
