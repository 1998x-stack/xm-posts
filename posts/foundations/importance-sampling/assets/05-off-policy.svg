<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="is-f5-title is-f5-desc" data-export="is-f5.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="is-f5-title">强化学习轨迹比率</title><desc id="is-f5-desc">行为策略与目标策略的两步已发生动作概率分别为 0.5 和 0.8，轨迹比率为 2.56</desc><rect x="1" y="1" width="798" height="308" rx="15" fill="#fbfdfa" stroke="#dbe6de"/><text x="33" y="47" font-size="22" fill="#294750" font-weight="700" text-anchor="start">从已有轨迹评价另一个策略</text><rect x="33" y="97" width="205" height="100" rx="10" fill="#e8f1f8" stroke="#d5e2dc"/><rect x="300" y="97" width="205" height="100" rx="10" fill="#e4f2e9" stroke="#d5e2dc"/><rect x="570" y="97" width="200" height="100" rx="10" fill="#f0eafa" stroke="#d5e2dc"/><text x="135" y="136" font-size="19" fill="#28464b" font-weight="700" text-anchor="middle">行为策略 β</text><text x="135" y="167" font-size="15" fill="#56737b" font-weight="600" text-anchor="middle">每步动作概率 0.5</text><text x="403" y="136" font-size="19" fill="#28464b" font-weight="700" text-anchor="middle">目标策略 π</text><text x="403" y="167" font-size="15" fill="#56737b" font-weight="600" text-anchor="middle">每步动作概率 0.8</text><text x="670" y="136" font-size="19" fill="#28464b" font-weight="700" text-anchor="middle">轨迹概率比</text><text x="670" y="167" font-size="17" fill="#7562a0" font-weight="700" text-anchor="middle">1.6 × 1.6 = 2.56</text><path d="M238 147H300M505 147H570" stroke="#268276" stroke-width="3"/><text x="33" y="264" font-size="16" fill="#c97950" font-weight="700" text-anchor="start">长轨迹连乘可能导致权重爆炸或消失；支持覆盖仍是前提。</text></svg>
