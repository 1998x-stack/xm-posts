<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="lse-f1-title lse-f1-desc"><title id="lse-f1-title">常数平移与 Softmax 不变性</title><desc id="lse-f1-desc">相同的四个 logit 整体加十，Softmax 概率条形长度不变；LogSumExp 恰好加十。</desc><rect x="1" y="1" width="958" height="388" rx="22" fill="#f9fcf9" stroke="#d9e7df"/>
