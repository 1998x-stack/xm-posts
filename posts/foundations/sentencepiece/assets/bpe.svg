<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BPE 的两次教学合并" viewBox="0 0 760 280"><title>BPE 的两次教学合并</title><rect width="760" height="280" fill="#fffdf8"/><text x="28" y="37" font-family="system-ui,sans-serif" font-size="16" fill="#b26a45">只展示合并机制，规则不是实际训练日志</text><rect x="30" y="62" width="320" height="73" rx="12" fill="#eef6ef" stroke="#b8d1c6"/><text x="190" y="104.5" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="650" fill="#214940">l  |  o  |  w</text><path d="M352 98 L405 98" stroke="#397f71" stroke-width="3" fill="none"/><path d="M398 92 L405 98 L398 104" stroke="#397f71" stroke-width="3" fill="none"/><rect x="408" y="62" width="319" height="73" rx="12" fill="#eef0fa" stroke="#b8d1c6"/><text x="567.5" y="104.5" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="650" fill="#214940">lo  |  w</text><path d="M185 141 L185 178" stroke="#397f71" stroke-width="3" fill="none"/><path d="M178 172 L185 178 L178 184" stroke="#397f71" stroke-width="3" fill="none"/><rect x="30" y="181" width="697" height="70" rx="12" fill="#fff0e5" stroke="#b8d1c6"/><text x="378.5" y="222" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="650" fill="#214940">lo + w → low</text><text x="38" y="270" font-family="system-ui,sans-serif" font-size="14" fill="#567568">真实合并规则取决于训练语料、频率与特殊符号预算。</text></svg>
