<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="空格 ▁ 保留原先文字边界" viewBox="0 0 760 280"><title>空格 ▁ 保留原先文字边界</title><rect width="760" height="280" fill="#fffdf8"/><text x="32" y="38" font-family="system-ui,sans-serif" font-size="16" fill="#b26a45">没有空格标记：词与标点之间的间距可能不再可知</text><rect x="32" y="58" width="690" height="62" rx="12" fill="#fff0e5" stroke="#b8d1c6"/><text x="377" y="95" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="650" fill="#214940">Hello  |  world  |  .</text><text x="32" y="169" font-family="system-ui,sans-serif" font-size="16" fill="#177768">把空格当作可见符号 U+2581 处理</text><rect x="32" y="185" width="690" height="62" rx="12" fill="#e8f4ee" stroke="#b8d1c6"/><text x="377" y="222" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="650" fill="#214940">▁Hello  |  ▁world  |  .</text><text x="32" y="268" font-family="system-ui,sans-serif" font-size="14" fill="#547168">拼接后将 ▁ 还原为空格 → Hello world.</text></svg>
