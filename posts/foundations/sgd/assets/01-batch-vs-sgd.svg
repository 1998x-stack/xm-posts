<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 353" width="760" height="353" role="img" aria-labelledby="sgd-fig01-title sgd-fig01-desc" data-export="sgd-fig01.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sgd-fig01-title">全批量梯度与单样本梯度的计算路径</title><desc id="sgd-fig01-desc">Batch GD 汇总所有四份梯度再更新一次参数；SGD 每次抽一个样本，用单份梯度立即更新参数；在固定学习率下两种步骤不能直接按相同次数比较。</desc><rect x="1" y="1" width="758" height="351" rx="15" fill="#fbfdfa" stroke="#e5eeea"/><text x="380" y="38" fill="#223c44" font-size="20" font-weight="750" text-anchor="middle">一次参数更新究竟需要看多少数据？</text><rect x="23" y="62" width="350" height="234" rx="10" fill="#fff" stroke="#dbe7e3"/><rect x="390" y="62" width="347" height="234" rx="10" fill="#fff" stroke="#dbe7e3"/><text x="198" y="96" fill="#397ca3" font-size="19" font-weight="750" text-anchor="middle">Batch GD · 全部 n 份</text><text x="563" y="96" fill="#237e78" font-size="19" font-weight="750" text-anchor="middle">SGD · 单份随机样本</text><rect x="45" y="118" width="61" height="44" rx="7" fill="#e7f2f9" stroke="#b3d1e0"/><text x="75" y="147" fill="#397ca3" font-size="17" font-weight="650" text-anchor="middle">z1</text><rect x="118" y="118" width="61" height="44" rx="7" fill="#e7f2f9" stroke="#b3d1e0"/><text x="148" y="147" fill="#397ca3" font-size="17" font-weight="650" text-anchor="middle">z2</text><rect x="191" y="118" width="61" height="44" rx="7" fill="#e7f2f9" stroke="#b3d1e0"/><text x="221" y="147" fill="#397ca3" font-size="17" font-weight="650" text-anchor="middle">z3</text><rect x="264" y="118" width="61" height="44" rx="7" fill="#e7f2f9" stroke="#b3d1e0"/><text x="294" y="147" fill="#397ca3" font-size="17" font-weight="650" text-anchor="middle">z4</text><path d="M198 168L198 198" fill="none" stroke="#397ca3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="198,198 187,192 187,204" fill="#397ca3"/><rect x="84" y="200" width="230" height="40" rx="6" fill="#e7f2f9" stroke="none"/><text x="199" y="225" fill="#397ca3" font-size="15" font-weight="650" text-anchor="middle">平均 n 份梯度</text><path d="M199 241L199 266" fill="none" stroke="#397ca3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="199,266 188,260 188,272" fill="#397ca3"/><rect x="523" y="118" width="80" height="44" rx="7" fill="#e6f5ee" stroke="#a4d6c6"/><text x="563" y="147" fill="#237e78" font-size="18" font-weight="700" text-anchor="middle">zᵢ</text><path d="M563 166L563 198" fill="none" stroke="#237e78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="563,198 552,192 552,204" fill="#237e78"/><rect x="452" y="200" width="223" height="40" rx="6" fill="#e6f5ee" stroke="none"/><text x="563" y="225" fill="#237e78" font-size="15" font-weight="650" text-anchor="middle">单份 ∇ℓᵢ</text><path d="M563 241L563 266" fill="none" stroke="#237e78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="563,266 552,260 552,272" fill="#237e78"/><text x="198" y="288" fill="#397ca3" font-size="15" font-weight="700" text-anchor="middle">θ ← θ − η·g_full</text><text x="563" y="288" fill="#237e78" font-size="15" font-weight="700" text-anchor="middle">θ ← θ − η·gᵢ</text><text x="380" y="327" fill="#617a7f" font-size="13" font-weight="500" text-anchor="middle">两种箭头都指向“更新”，但计算量、噪声与更新频率不同</text></svg>