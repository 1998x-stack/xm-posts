<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" role="img" aria-labelledby="sgd-fig02-title sgd-fig02-desc" data-export="sgd-fig02.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sgd-fig02-title">四个样本对同一参数给出的方向存在冲突</title><desc id="sgd-fig02-desc">θ=0 且 ℓ_i=0.5(θ−a_i)^2，样本 a 分别为 -3,1,3,7，对应梯度 3,-1,-3,-7；平均梯度是 -2。抽第一份会与整体方向相反。</desc><rect x="1" y="1" width="758" height="362" rx="15" fill="#fbfdfa" stroke="#e5eeea"/><text x="380" y="38" fill="#223c44" font-size="20" font-weight="750" text-anchor="middle">同一个 θ = 0，四个样本给出四种局部意见</text><text x="135" y="99" fill="#223c44" font-size="16" font-weight="650" text-anchor="middle">a₁ = −3</text><text x="265" y="99" fill="#c47b52" font-size="16" font-weight="700" text-anchor="middle">g₁ = +3</text><path d="M400 91L512.5 91" fill="none" stroke="#c47b52" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="512.5" cy="91" r="6" fill="#c47b52"/><text x="135" y="158" fill="#223c44" font-size="16" font-weight="650" text-anchor="middle">a₂ = +1</text><text x="265" y="158" fill="#397ca3" font-size="16" font-weight="700" text-anchor="middle">g₂ = −1</text><path d="M400 150L362.5 150" fill="none" stroke="#397ca3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="362.5" cy="150" r="6" fill="#397ca3"/><text x="135" y="217" fill="#223c44" font-size="16" font-weight="650" text-anchor="middle">a₃ = +3</text><text x="265" y="217" fill="#397ca3" font-size="16" font-weight="700" text-anchor="middle">g₃ = −3</text><path d="M400 209L287.5 209" fill="none" stroke="#397ca3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="287.5" cy="209" r="6" fill="#397ca3"/><text x="135" y="276" fill="#223c44" font-size="16" font-weight="650" text-anchor="middle">a₄ = +7</text><text x="265" y="276" fill="#397ca3" font-size="16" font-weight="700" text-anchor="middle">g₄ = −7</text><path d="M400 268L197.5 268" fill="none" stroke="#397ca3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="197.5" cy="268" r="6" fill="#397ca3"/><path d="M400 63L400 320" fill="none" stroke="#a7bab7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"/><text x="480" y="338" fill="#237e78" font-size="15" font-weight="720" text-anchor="middle">平均 g = −2，方向指向右侧更新</text></svg>