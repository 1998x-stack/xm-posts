<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 359" width="760" height="359" role="img" aria-labelledby="sgd-fig03-title sgd-fig03-desc" data-export="sgd-fig03.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sgd-fig03-title">均匀抽样给出无偏随机梯度，不保证每步方向正确</title><desc id="sgd-fig03-desc">四个单样本梯度为 3,-1,-3,-7，等概率抽取时 E[g_i]=(3-1-3-7)/4=-2，与全量均值相同；每个样本的实际梯度可以很不同。</desc><rect x="1" y="1" width="758" height="357" rx="15" fill="#fbfdfa" stroke="#e5eeea"/><text x="380" y="37" fill="#223c44" font-size="20" font-weight="750" text-anchor="middle">期望一致 ≠ 某次抽样恰好正确</text><rect x="35" y="72" width="142" height="103" rx="10" fill="#fff0e6" stroke="#d4e0df"/><text x="106" y="109" fill="#617a7f" font-size="15" font-weight="600" text-anchor="middle">抽到 z1</text><text x="106" y="148" fill="#c47b52" font-size="24" font-weight="780" text-anchor="middle">g = +3</text><rect x="218" y="72" width="142" height="103" rx="10" fill="#e9f2f8" stroke="#d4e0df"/><text x="289" y="109" fill="#617a7f" font-size="15" font-weight="600" text-anchor="middle">抽到 z2</text><text x="289" y="148" fill="#397ca3" font-size="24" font-weight="780" text-anchor="middle">g = -1</text><rect x="401" y="72" width="142" height="103" rx="10" fill="#e9f2f8" stroke="#d4e0df"/><text x="472" y="109" fill="#617a7f" font-size="15" font-weight="600" text-anchor="middle">抽到 z3</text><text x="472" y="148" fill="#397ca3" font-size="24" font-weight="780" text-anchor="middle">g = -3</text><rect x="584" y="72" width="142" height="103" rx="10" fill="#e9f2f8" stroke="#d4e0df"/><text x="655" y="109" fill="#617a7f" font-size="15" font-weight="600" text-anchor="middle">抽到 z4</text><text x="655" y="148" fill="#397ca3" font-size="24" font-weight="780" text-anchor="middle">g = -7</text><path d="M106 177L381 244" fill="none" stroke="#617a7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="381,244 370,238 370,250" fill="#617a7f"/><path d="M289 177L381 244" fill="none" stroke="#617a7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="381,244 370,238 370,250" fill="#617a7f"/><path d="M472 177L381 244" fill="none" stroke="#617a7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="381,244 370,238 370,250" fill="#617a7f"/><path d="M655 177L381 244" fill="none" stroke="#617a7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="381,244 370,238 370,250" fill="#617a7f"/><rect x="255" y="247" width="253" height="61" rx="10" fill="#e5f4ed" stroke="#b8d9cf"/><text x="381" y="275" fill="#237e78" font-size="21" font-weight="800" text-anchor="middle">E[gᵢ] = −2</text><text x="381" y="297" fill="#237e78" font-size="14" font-weight="650" text-anchor="middle">=(3−1−3−7)/4</text><text x="380" y="337" fill="#617a7f" font-size="13" font-weight="500" text-anchor="middle">前提：在同一参数 θ 处，对四样本等概率抽取</text></svg>