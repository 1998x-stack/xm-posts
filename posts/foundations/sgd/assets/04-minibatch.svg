<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 357" width="760" height="357" role="img" aria-labelledby="sgd-fig04-title sgd-fig04-desc" data-export="sgd-fig04.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sgd-fig04-title">Mini-batch 是样本梯度的均值，批量改变方差和每步工作量</title><desc id="sgd-fig04-desc">四个样本梯度 3,-1,-3,-7，左右两种两样本 batch 的均值分别为 1 与 -5；全部四个的均值为 -2。小批量仍可能与全批量方向不同。</desc><rect x="1" y="1" width="758" height="355" rx="15" fill="#fbfdfa" stroke="#e5eeea"/><text x="380" y="40" fill="#223c44" font-size="20" font-weight="750" text-anchor="middle">Mini-batch：每次平均 B 个样本的梯度</text><rect x="24" y="73" width="222" height="227" rx="10" fill="#fff" stroke="#dbe7e3"/><rect x="269" y="73" width="222" height="227" rx="10" fill="#fff" stroke="#dbe7e3"/><rect x="514" y="73" width="222" height="227" rx="10" fill="#fff" stroke="#dbe7e3"/><text x="135" y="111" fill="#c47b52" font-size="18" font-weight="750" text-anchor="middle">B = 2 · 前半批</text><text x="379" y="111" fill="#397ca3" font-size="18" font-weight="750" text-anchor="middle">B = 2 · 后半批</text><text x="625" y="111" fill="#237e78" font-size="18" font-weight="750" text-anchor="middle">B = 4 · 全部</text><text x="135" y="167" fill="#223c44" font-size="21" font-weight="600" text-anchor="middle">(+3 −1) / 2</text><text x="380" y="167" fill="#223c44" font-size="21" font-weight="600" text-anchor="middle">(−3 −7) / 2</text><text x="625" y="167" fill="#223c44" font-size="18" font-weight="600" text-anchor="middle">(3−1−3−7) / 4</text><text x="135" y="233" fill="#c47b52" font-size="24" font-weight="800" text-anchor="middle">g = +1</text><text x="380" y="233" fill="#397ca3" font-size="24" font-weight="800" text-anchor="middle">g = −5</text><text x="625" y="233" fill="#237e78" font-size="24" font-weight="800" text-anchor="middle">g = −2</text><text x="135" y="280" fill="#c47b52" font-size="14" font-weight="650" text-anchor="middle">θ 向左更新</text><text x="380" y="280" fill="#397ca3" font-size="14" font-weight="650" text-anchor="middle">θ 向右更新</text><text x="625" y="280" fill="#237e78" font-size="14" font-weight="650" text-anchor="middle">θ 向右更新</text><text x="380" y="335" fill="#617a7f" font-size="13" font-weight="500" text-anchor="middle">同一步使用不同的 batch，梯度方向和幅值可能大不相同</text></svg>