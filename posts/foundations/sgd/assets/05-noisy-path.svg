<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 351" width="760" height="351" role="img" aria-labelledby="sgd-fig05-title sgd-fig05-desc" data-export="sgd-fig05.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sgd-fig05-title">噪声使 SGD 的参数轨迹在最优点附近摇摆</title><desc id="sgd-fig05-desc">一维二次目标的平滑曲线和三种手工构造的迭代点；噪声大的更新会穿过谷底产生往返。不是论文中的实测轨迹或任一固定 SGD 运行。</desc><rect x="1" y="1" width="758" height="349" rx="15" fill="#fbfdfa" stroke="#e5eeea"/><text x="380" y="40" fill="#223c44" font-size="19" font-weight="750" text-anchor="middle">目标函数有谷底，但随机更新不总沿最短路走</text><path d="M95 80 Q380 485 665 80" fill="none" stroke="#9dbeb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 290L694 290" fill="none" stroke="#a9bbb9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 70L95 290" fill="none" stroke="#a9bbb9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="120" r="8" fill="#c47b52"/><text x="132" y="107" fill="#c47b52" font-size="14" font-weight="750" text-anchor="start">θ₀</text><circle cx="590" cy="185" r="8" fill="#c47b52"/><text x="602" y="172" fill="#c47b52" font-size="14" font-weight="750" text-anchor="start">θ₁</text><circle cx="270" cy="260" r="8" fill="#c47b52"/><text x="282" y="247" fill="#c47b52" font-size="14" font-weight="750" text-anchor="start">θ₂</text><circle cx="450" cy="272" r="8" fill="#c47b52"/><text x="462" y="259" fill="#c47b52" font-size="14" font-weight="750" text-anchor="start">θ₃</text><circle cx="380" cy="286" r="8" fill="#237e78"/><text x="392" y="273" fill="#237e78" font-size="14" font-weight="750" text-anchor="start">θ*</text><path d="M120 120L590 185L270 260L450 272" fill="none" stroke="#c47b52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="380" y="325" fill="#617a7f" font-size="13" font-weight="500" text-anchor="middle">手绘教学路径：序列并非从图中曲线精确求导得到</text></svg>