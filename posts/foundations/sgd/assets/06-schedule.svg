<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 361" width="760" height="361" role="img" aria-labelledby="sgd-fig06-title sgd-fig06-desc" data-export="sgd-fig06.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sgd-fig06-title">常数学习率与衰减学习率的变化</title><desc id="sgd-fig06-desc">横轴是迭代步，纵轴是学习率；常数 η 持续保持相同步幅，而 η_t = 0.5/(t+1) 递减。两条曲线只表达设置，非损失或验证精度。</desc><rect x="1" y="1" width="758" height="359" rx="15" fill="#fbfdfa" stroke="#e5eeea"/><text x="380" y="38" fill="#223c44" font-size="20" font-weight="750" text-anchor="middle">学习率决定“听从当前梯度”的力度</text><path d="M96 285L688 285" fill="none" stroke="#617a7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 70L96 285" fill="none" stroke="#617a7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="59" y="82" fill="#223c44" font-size="19" font-weight="700" text-anchor="middle">ηₜ</text><text x="694" y="310" fill="#223c44" font-size="17" font-weight="700" text-anchor="middle">t</text><path d="M101 168L657 168" fill="none" stroke="#c47b52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="575" y="155" fill="#c47b52" font-size="16" font-weight="700" text-anchor="middle">常数 η</text><path d="M103 91 C132 140 200 209 330 244 S550 270 656 272" fill="none" stroke="#237e78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="519" y="255" fill="#237e78" font-size="16" font-weight="700" text-anchor="middle">衰减 ηₜ</text><text x="380" y="338" fill="#617a7f" font-size="13" font-weight="500" text-anchor="middle">满足某些经典收敛条件需要更多前提，曲线本身不是收敛保证</text></svg>