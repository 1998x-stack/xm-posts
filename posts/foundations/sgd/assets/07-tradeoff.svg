<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="sgd-fig07-title sgd-fig07-desc" data-export="sgd-fig07.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sgd-fig07-title">有限训练计算预算下的统计误差与优化误差权衡</title><desc id="sgd-fig07-desc">Bottou 的论点是，在大数据情况下无需把有限训练集的经验目标优化到极高精度；应考虑近似误差、估计误差、优化误差与计算成本。三个误差类别是理论分解，不是可直接相加的独立观测曲线。</desc><rect x="1" y="1" width="758" height="342" rx="15" fill="#fbfdfa" stroke="#e5eeea"/><text x="380" y="39" fill="#223c44" font-size="20" font-weight="750" text-anchor="middle">学到多好，不只有“训练损失降了多少”</text><rect x="28" y="81" width="218" height="157" rx="10" fill="#edf5fa" stroke="#dce6e3"/><text x="137" y="125" fill="#397ca3" font-size="21" font-weight="760" text-anchor="middle">近似误差</text><text x="137" y="178" fill="#223c44" font-size="14" font-weight="500" text-anchor="middle">假设空间能否表达目标</text><rect x="270" y="81" width="218" height="157" rx="10" fill="#f3eef9" stroke="#dce6e3"/><text x="379" y="125" fill="#7f6cad" font-size="21" font-weight="760" text-anchor="middle">估计误差</text><text x="379" y="178" fill="#223c44" font-size="14" font-weight="500" text-anchor="middle">有限样本与未知分布差距</text><rect x="512" y="81" width="218" height="157" rx="10" fill="#fff2e7" stroke="#dce6e3"/><text x="621" y="125" fill="#c47b52" font-size="21" font-weight="760" text-anchor="middle">优化误差</text><text x="621" y="178" fill="#223c44" font-size="14" font-weight="500" text-anchor="middle">有限算力下离经验最优多远</text><text x="380" y="268" fill="#237e78" font-size="17" font-weight="700" text-anchor="middle">总 excess risk 的分析需要三项统筹，而非盲目增加全量迭代</text><text x="380" y="317" fill="#617a7f" font-size="13" font-weight="500" text-anchor="middle">框架：Bottou (2010) §3.1, Eq. (6)；并不意味着 SGD 始终优于 GD</text></svg>