<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="svd-geo-title svd-geo-desc" font-family='system-ui,-apple-system,Segoe UI,PingFang SC,sans-serif'><title id="svd-geo-title">SVD 的几何直觉：圆通过旋转、伸缩与旋转成为椭圆</title><desc id="svd-geo-desc">左侧单位圆；右侧一个任意矩阵将圆映射为椭圆，半轴长度对应两个奇异值。</desc><rect x="1" y="1" width="898" height="348" rx="18" fill="#fbfdfb" stroke="#dceae3"/>
<text x="450" y="40" text-anchor="middle" font-size="23" fill="#253e47" font-weight="700">同一个线性映射，从两个坐标系观察</text>
<g stroke="#d3e1de" stroke-width="2"><path d="M110 195H337M225 81V309M575 195H803M688 70V310" stroke-dasharray="6 7"/></g>
<circle cx="225" cy="195" r="90" fill="#e7f3f0" stroke="#287f79" stroke-width="3"/>
<line x1="225" y1="195" x2="315" y2="195" stroke="#df8258" stroke-width="5"/><line x1="225" y1="195" x2="225" y2="105" stroke="#517fac" stroke-width="5"/>
<text x="225" y="320" text-anchor="middle" font-size="16" fill="#526d74">输入：单位圆上的所有方向</text>
<path d="M372 192H517" stroke="#aa8bb2" stroke-width="4"/><path d="m517 192 -17 -10 v20z" fill="#aa8bb2"/>
<rect x="406" y="148" width="75" height="30" rx="15" fill="#efeaf5"/><text x="443" y="168" text-anchor="middle" font-size="18" fill="#76639d">A</text>
<g transform="rotate(-24 689 195)"><ellipse cx="689" cy="195" rx="155" ry="64" fill="#f6eae4" stroke="#be7959" stroke-width="3"/><path d="M534 195H844" stroke="#df8258" stroke-width="5"/><path d="M689 131V259" stroke="#517fac" stroke-width="5"/></g>
<text x="687" y="322" text-anchor="middle" font-size="16" fill="#526d74">输出：半轴由 σ₁、σ₂ 决定</text>
</svg>
