<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-labelledby="title desc"><title id="title">SGNS positive and negative training signals</title><desc id="desc">The center embedding is scored against one real context and three sampled noise contexts, with positive and negative logistic losses.</desc><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" stroke="#688175" stroke-width="1.5" fill="none"/></marker></defs><rect width="940" height="360" rx="18" fill="#fffefa"/><g font-family="sans-serif" font-size="15"><rect x="28" y="143" width="193" height="72" rx="10" fill="#147e72"/><text x="124" y="172" fill="white" text-anchor="middle" font-weight="700">center word</text><text x="124" y="193" fill="#e6fcf2" text-anchor="middle">v_c</text><path d="M221 179H327" fill="none" stroke="#688175" stroke-width="2" marker-end="url(#ar)"/><rect x="329" y="132" width="187" height="94" rx="9" fill="#e4f3eb" stroke="#badccc"/><text x="422" y="166" fill="#285e4e" text-anchor="middle">dot products</text><text x="422" y="191" fill="#285e4e" text-anchor="middle">score = u · v_c</text><g fill="none" stroke="#688175" stroke-width="2" marker-end="url(#ar)"><path d="M516 170L620 73M516 182L620 157M516 193L620 242M516 204L620 321"/></g><rect x="625" y="30" width="276" height="70" rx="9" fill="#d5ebdf"/><text x="643" y="58" fill="#166d5e" font-weight="700">positive: real context</text><text x="643" y="82" fill="#166d5e">−log σ(u_pos · v_c)</text><rect x="625" y="116" width="276" height="68" rx="9" fill="#fff0e6"/><text x="643" y="145" fill="#aa6137" font-weight="700">negative 1: sampled noise</text><text x="643" y="168" fill="#aa6137">−log σ(−u_n1 · v_c)</text><rect x="625" y="200" width="276" height="68" rx="9" fill="#fff0e6"/><text x="643" y="229" fill="#aa6137" font-weight="700">negative 2: sampled noise</text><text x="643" y="252" fill="#aa6137">−log σ(−u_n2 · v_c)</text><rect x="625" y="282" width="276" height="66" rx="9" fill="#fff0e6"/><text x="643" y="310" fill="#aa6137" font-weight="700">negative 3: sampled noise</text><text x="643" y="332" fill="#aa6137">−log σ(−u_n3 · v_c)</text></g></svg>
