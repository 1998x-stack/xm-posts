<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="全 softmax 与负采样运算量示意，不按比例" role="img" viewbox="0 0 750 191" xmlns="http://www.w3.org/2000/svg"><title>全 softmax 与负采样运算量示意，不按比例</title><text fill="#4c5b55" font-size="14" font-weight="700" x="16" y="27">Full Softmax</text><rect fill="#edc6b1" height="29" rx="4" width="555" x="165" y="9"></rect><text fill="#8d4929" font-family="monospace" font-size="13" x="175" y="29">与词表全部 V 个候选向量打分</text><text fill="#4c5b55" font-size="14" font-weight="700" x="16" y="91">Negative Sampling</text><rect fill="#bce0d3" height="29" rx="4" width="100" x="165" y="73"></rect><text fill="#165f52" font-family="monospace" font-size="13" x="177" y="92">k + 1</text><path d="M165 50H720" stroke="#e7e9e3"></path><text fill="#85958b" font-size="12" x="16" y="151">计算成本：</text><text fill="#9f5734" font-family="monospace" font-size="14" x="165" y="151">O(V·D) → O((k+1)·D)</text><text fill="#85958b" font-size="11" x="165" y="175">每个正样本的输出层打分；仅用于比较这两个目标的局部计算</text></svg>
