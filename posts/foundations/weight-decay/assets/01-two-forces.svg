<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 291" width="820" height="291" role="img" aria-label="任务梯度与收缩的两条更新路径"><title>任务梯度与收缩的两条更新路径</title><desc>数据梯度与权重收缩加在同一次参数更新中</desc><rect x="1" y="1" width="818" height="289" rx="18" fill="#fcfdfb" stroke="#dce7df"/><text x="29" y="40" font-size="18" font-weight="750" fill="#28464d">FIG 01 · 一次更新，两种力量</text><rect x="33" y="86" width="205" height="95" rx="14" fill="#fff0e7" stroke="#be6b4b" stroke-width="2"/><text x="135.5" y="126.5" font-size="19" text-anchor="middle" font-weight="750" fill="#28464d">数据梯度</text><text x="135.5" y="154.5" font-size="14" text-anchor="middle" fill="#536d72">−αg</text><rect x="302" y="86" width="208" height="95" rx="14" fill="#e7f3ee" stroke="#197d79" stroke-width="2"/><text x="406" y="126.5" font-size="19" text-anchor="middle" font-weight="750" fill="#28464d">上一时刻参数</text><text x="406" y="154.5" font-size="14" text-anchor="middle" fill="#536d72">θₜ</text><rect x="578" y="86" width="205" height="95" rx="14" fill="#e7f3ee" stroke="#197d79" stroke-width="2"/><text x="680.5" y="126.5" font-size="19" text-anchor="middle" font-weight="750" fill="#28464d">新参数</text><text x="680.5" y="154.5" font-size="14" text-anchor="middle" fill="#536d72">θₜ₊₁</text><path d="M244 134 H290" stroke="#be6b4b" stroke-width="3"/><path d="M280 128L290 134L280 140" fill="none" stroke="#be6b4b" stroke-width="3"/><path d="M518 134 H567" stroke="#197d79" stroke-width="3"/><path d="M557 128L567 134L557 140" fill="none" stroke="#197d79" stroke-width="3"/><text x="410" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#16736e">独立收缩： θₜ → (1−αλ)θₜ</text><text x="410" y="261" text-anchor="middle" font-size="14" fill="#60777b">衰减项按各权重自身大小缩小；不是每个坐标减去同一常数</text></svg>
