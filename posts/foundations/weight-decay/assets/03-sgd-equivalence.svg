<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 302" width="820" height="302" role="img" aria-label="无动量 SGD 的系数等价"><title>无动量 SGD 的系数等价</title><desc>在标准SGD中，L2梯度与直接收缩等价，需要直接衰减率δ等于学习率α乘惩罚系数λ</desc><rect x="1" y="1" width="818" height="300" rx="18" fill="#fcfdfb" stroke="#dce7df"/><text x="28" y="42" font-size="18" font-weight="750" fill="#28464d">FIG 03 · 标准 SGD 的代数等价</text><rect x="30" y="83" width="219" height="94" rx="14" fill="#fff0e7" stroke="#be6b4b" stroke-width="2"/><text x="139.5" y="123" font-size="19" text-anchor="middle" font-weight="750" fill="#28464d">L₂ 梯度</text><text x="139.5" y="151" font-size="14" text-anchor="middle" fill="#536d72">g + λθ</text><rect x="301" y="83" width="230" height="94" rx="14" fill="#fff0e7" stroke="#be6b4b" stroke-width="2"/><text x="416" y="123" font-size="19" text-anchor="middle" font-weight="750" fill="#28464d">SGD 更新</text><text x="416" y="151" font-size="14" text-anchor="middle" fill="#536d72">θ−α(g+λθ)</text><rect x="579" y="83" width="209" height="94" rx="14" fill="#e7f3ee" stroke="#197d79" stroke-width="2"/><text x="683.5" y="123" font-size="19" text-anchor="middle" font-weight="750" fill="#28464d">展开结果</text><text x="683.5" y="151" font-size="14" text-anchor="middle" fill="#536d72">(1−αλ)θ−αg</text><path d="M257 129 H290" stroke="#be6b4b" stroke-width="3"/><path d="M280 123L290 129L280 135" fill="none" stroke="#be6b4b" stroke-width="3"/><path d="M539 129 H568" stroke="#197d79" stroke-width="3"/><path d="M558 123L568 129L558 135" fill="none" stroke="#197d79" stroke-width="3"/><rect x="210" y="217" width="400" height="60" rx="12" fill="#e7f3ee"/><text x="410" y="254" text-anchor="middle" font-size="19" font-weight="750" fill="#14746f">直接单步衰减率：δ = α · λ</text></svg>
