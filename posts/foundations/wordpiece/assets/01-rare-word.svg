<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="罕见词与子词粒度" viewBox="0 0 900 295"><title>罕见词与子词粒度</title><desc>以 unaffable 示例对比未知整词和子词序列，不是测量数据</desc><rect width="900" height="295" rx="18" fill="#fcfdf9"/><g font-family="system-ui,'Noto Sans SC','PingFang SC',sans-serif"><text x="32" y="44" font-size="23" font-weight="700" fill="#233c3e">一个不常见的英文词：unaffable</text><text x="38" y="113" font-size="16" font-weight="500" fill="#526c68">固定整词词表</text><rect x="258" y="76" width="170" height="52" rx="12" fill="#fff0df" stroke="#a75d36" stroke-opacity=".22"/><text x="343" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#a75d36">[UNK]</text><text x="462" y="111" font-size="16" font-weight="500" fill="#526c68">整个词的字符信息消失</text><text x="38" y="203" font-size="16" font-weight="500" fill="#526c68">WordPiece 词表</text><rect x="258" y="163" width="140" height="52" rx="12" fill="#dff1e9" stroke="#1d675d" stroke-opacity=".22"/><text x="328" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#1d675d">un</text><rect x="410" y="163" width="163" height="52" rx="12" fill="#eeeafa" stroke="#675aa0" stroke-opacity=".22"/><text x="491.5" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#675aa0">##aff</text><rect x="585" y="163" width="164" height="52" rx="12" fill="#eeeafa" stroke="#675aa0" stroke-opacity=".22"/><text x="667" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#675aa0">##able</text><text x="258" y="252" font-size="15" font-weight="500" fill="#526c68">「##」表示词内部的续接片段，不是字面输出字符</text></g></svg>