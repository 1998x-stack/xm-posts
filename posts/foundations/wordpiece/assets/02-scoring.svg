<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同样的频次不等于同样的分数" viewBox="0 0 900 295"><title>同样的频次不等于同样的分数</title><desc>示意 BPE 的原始相邻频数与 WordPiece 教学重建评分可能选出不同相邻对</desc><rect width="900" height="295" rx="18" fill="#fcfdf9"/><g font-family="system-ui,'Noto Sans SC','PingFang SC',sans-serif"><text x="30" y="43" font-size="23" font-weight="700" fill="#233c3e">相同带权语料，不同选择准则</text><rect x="31" y="78" width="214" height="52" rx="12" fill="#e6eff8" stroke="#2d668e" stroke-opacity=".22"/><text x="138" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#2d668e">##u + ##g</text><rect x="341" y="78" width="214" height="52" rx="12" fill="#dff1e9" stroke="#1d675d" stroke-opacity=".22"/><text x="448" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#1d675d">##g + ##s</text><text x="31" y="158" font-size="19" font-weight="700" fill="#2b668d">pair count = 20</text><text x="341" y="158" font-size="19" font-weight="700" fill="#1d675d">pair count = 5</text><text x="31" y="196" font-size="19" font-weight="500" fill="#526c68">score = 1 / 36</text><text x="341" y="196" font-size="19" font-weight="500" fill="#526c68">score = 1 / 20</text><path d="M597 113 h74 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="710" y="78" width="148" height="52" rx="12" fill="#fff0df" stroke="#a75d36" stroke-opacity=".22"/><text x="784" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#a75d36">##gs</text><text x="30" y="258" font-size="15" font-weight="500" fill="#526c68">BPE 会优先看 20；教学 score 会优先选 1/20。这里不是 Google 原始 trainer 的复现。</text></g></svg>