<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="词表训练与推理编码分离" viewBox="0 0 900 295"><title>词表训练与推理编码分离</title><desc>训练阶段生成词表，编码阶段使用冻结的词表进行从左至右的最长前缀匹配</desc><rect width="900" height="295" rx="18" fill="#fcfdf9"/><g font-family="system-ui,'Noto Sans SC','PingFang SC',sans-serif"><text x="32" y="42" font-size="21" font-weight="700" fill="#233c3e">不要把“如何训练词表”和“如何使用词表”混成同一个算法</text><rect x="28" y="84" width="195" height="52" rx="12" fill="#e6eff8" stroke="#2d668e" stroke-opacity=".22"/><text x="125.5" y="116" text-anchor="middle" font-size="19" font-weight="700" fill="#2d668e">语料和词频</text><path d="M237 110 h45 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="296" y="84" width="213" height="52" rx="12" fill="#eeeafa" stroke="#675aa0" stroke-opacity=".22"/><text x="402.5" y="116" text-anchor="middle" font-size="19" font-weight="700" fill="#675aa0">词表学习</text><path d="M524 110 h42 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="581" y="84" width="249" height="52" rx="12" fill="#dff1e9" stroke="#1d675d" stroke-opacity=".22"/><text x="705.5" y="116" text-anchor="middle" font-size="19" font-weight="700" fill="#1d675d">最终 vocabulary</text><text x="41" y="193" font-size="16" font-weight="500" fill="#526c68">学习阶段：候选增量与数据统计</text><text x="41" y="230" font-size="16" font-weight="500" fill="#526c68">编码阶段：BasicTokenizer → MaxMatch → token IDs</text><text x="41" y="262" font-size="15" font-weight="500" fill="#526c68">BERT 编码时不重新学习 merge 排名；仅依赖词表成员资格。</text></g></svg>