<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MaxMatch 逐步选择最长匹配" viewBox="0 0 900 295"><title>MaxMatch 逐步选择最长匹配</title><desc>unaffable 先匹配 un，再匹配 ##aff，最后匹配 ##able；全部来自教学示例词表</desc><rect width="900" height="295" rx="18" fill="#fcfdf9"/><g font-family="system-ui,'Noto Sans SC','PingFang SC',sans-serif"><text x="30" y="40" font-size="21" font-weight="700" fill="#233c3e">MaxMatch 每一步挑当前剩余字符串的最长前缀</text><rect x="26" y="87" width="211" height="52" rx="12" fill="#dff1e9" stroke="#1d675d" stroke-opacity=".22"/><text x="131.5" y="119" text-anchor="middle" font-size="19" font-weight="700" fill="#1d675d">un</text><path d="M245 112 h38 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="301" y="87" width="224" height="52" rx="12" fill="#eeeafa" stroke="#675aa0" stroke-opacity=".22"/><text x="413" y="119" text-anchor="middle" font-size="19" font-weight="700" fill="#675aa0">##aff</text><path d="M535 112 h38 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="87" width="267" height="52" rx="12" fill="#eeeafa" stroke="#675aa0" stroke-opacity=".22"/><text x="723.5" y="119" text-anchor="middle" font-size="19" font-weight="700" fill="#675aa0">##able</text><text x="40" y="194" font-size="17" font-weight="500" fill="#526c68">start = 0：无 ## 前缀；匹配 un</text><text x="40" y="224" font-size="17" font-weight="500" fill="#526c68">start &gt; 0：先拼 ## 再查词表，依次匹配 ##aff 和 ##able</text><text x="40" y="260" font-size="15" font-weight="500" fill="#526c68">最长匹配是局部贪心规则，不保证全局 token 数最小。</text></g></svg>