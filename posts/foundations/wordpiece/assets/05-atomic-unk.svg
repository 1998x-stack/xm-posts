<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="未知词的原子回退" viewBox="0 0 900 295"><title>未知词的原子回退</title><desc>mug 的部分前缀虽然能匹配，但缺少 ##g 时整个词回退成 UNK</desc><rect width="900" height="295" rx="18" fill="#fcfdf9"/><g font-family="system-ui,'Noto Sans SC','PingFang SC',sans-serif"><text x="32" y="42" font-size="22" font-weight="700" fill="#233c3e">一次失败不只影响剩余字符，而会废弃整个词的已匹配部分</text><rect x="42" y="94" width="128" height="52" rx="12" fill="#dff1e9" stroke="#1d675d" stroke-opacity=".22"/><text x="106" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#1d675d">m</text><path d="M178 119 h36 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="229" y="94" width="130" height="52" rx="12" fill="#eeeafa" stroke="#675aa0" stroke-opacity=".22"/><text x="294" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#675aa0">##u</text><path d="M366 119 h36 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="94" width="137" height="52" rx="12" fill="#fff0df" stroke="#a75d36" stroke-opacity=".22"/><text x="488.5" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#a75d36">##g ?</text><path d="M565 119 h36 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="619" y="94" width="201" height="52" rx="12" fill="#fff0df" stroke="#a75d36" stroke-opacity=".22"/><text x="719.5" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#a75d36">[UNK]</text><text x="44" y="205" font-size="18" font-weight="500" fill="#526c68">已匹配片段 m / ##u 不会作为部分成功结果返回。</text><text x="44" y="248" font-size="15" font-weight="500" fill="#526c68">这是 BERT 原始 WordpieceTokenizer 的行为；真实结果还受 BasicTokenizer 影响。</text></g></svg>