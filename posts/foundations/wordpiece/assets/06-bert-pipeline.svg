<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BERT 文本到模型输入的管线" viewBox="0 0 900 295"><title>BERT 文本到模型输入的管线</title><desc>展示从 BasicTokenizer 到 WordPiece 再到 token ID 与特殊标记的独立阶段</desc><rect width="900" height="295" rx="18" fill="#fcfdf9"/><g font-family="system-ui,'Noto Sans SC','PingFang SC',sans-serif"><text x="28" y="43" font-size="22" font-weight="700" fill="#233c3e">BERT: Text → Basic token → WordPiece → Token IDs</text><rect x="27" y="87" width="164" height="52" rx="12" fill="#e6eff8" stroke="#2d668e" stroke-opacity=".22"/><text x="109" y="119" text-anchor="middle" font-size="19" font-weight="700" fill="#2d668e">原始文本</text><path d="M205 112 h30 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="245" y="87" width="190" height="52" rx="12" fill="#dff1e9" stroke="#1d675d" stroke-opacity=".22"/><text x="340" y="119" text-anchor="middle" font-size="19" font-weight="700" fill="#1d675d">BasicTokenizer</text><path d="M445 112 h29 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="484" y="87" width="162" height="52" rx="12" fill="#eeeafa" stroke="#675aa0" stroke-opacity=".22"/><text x="565" y="119" text-anchor="middle" font-size="19" font-weight="700" fill="#675aa0">WordPiece</text><path d="M656 112 h25 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="691" y="87" width="176" height="52" rx="12" fill="#fff0df" stroke="#a75d36" stroke-opacity=".22"/><text x="779" y="119" text-anchor="middle" font-size="19" font-weight="700" fill="#a75d36">Token IDs</text><text x="28" y="194" font-size="16" font-weight="500" fill="#526c68">BasicTokenizer：清理、大小写/音调（按配置）、标点及 CJK 边界</text><text x="28" y="228" font-size="16" font-weight="500" fill="#526c68">WordPiece：对每个预切分单词做 longest-match-first</text><text x="28" y="261" font-size="15" font-weight="500" fill="#526c68">[CLS] / [SEP]、padding、mask 属于后续模型输入组装规则。</text></g></svg>