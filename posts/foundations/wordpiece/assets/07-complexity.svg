<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MaxMatch 与快速 WordPiece" viewBox="0 0 900 295"><title>MaxMatch 与快速 WordPiece</title><desc>朴素最大匹配与基于 Trie 和失败链接的线性时间算法比较；无虚构计时条形图</desc><rect width="900" height="295" rx="18" fill="#fcfdf9"/><g font-family="system-ui,'Noto Sans SC','PingFang SC',sans-serif"><text x="30" y="42" font-size="23" font-weight="700" fill="#233c3e">同一个词表，编码实现可以更快</text><rect x="38" y="85" width="325" height="52" rx="12" fill="#fff0df" stroke="#a75d36" stroke-opacity=".22"/><text x="200.5" y="117" text-anchor="middle" font-size="19" font-weight="700" fill="#a75d36">朴素 MaxMatch: O(n²)</text><rect x="527" y="85" width="335" height="52" rx="12" fill="#dff1e9" stroke="#1d675d" stroke-opacity=".22"/><text x="694.5" y="117" text-anchor="middle" font-size="19" font-weight="700" fill="#1d675d">Fast WordPiece: O(n)</text><path d="M395 111 h100 m-12 -9 l12 9 -12 9" stroke="#cb774d" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="190" font-size="17" font-weight="500" fill="#526c68">不断尝试越来越短的候选前缀</text><text x="528" y="190" font-size="17" font-weight="500" fill="#526c68">Trie + failure links</text><text x="38" y="241" font-size="15" font-weight="500" fill="#526c68">Song et al., EMNLP 2021：其性能数据依赖论文指定系统与测试环境；本图只表示复杂度阶数。</text></g></svg>