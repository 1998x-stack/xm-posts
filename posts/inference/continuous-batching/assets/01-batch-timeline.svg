<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="cb-t1 cb-d1"><title id="cb-t1">请求级批处理与迭代级动态批处理的时间线</title><desc id="cb-d1">上方静态批次锁住请求 A B，C 必须等待；下方每次迭代重新组合批次，完成的 A 退出、C 加入。</desc><rect width="820" height="310" rx="14" fill="#fcfdf9"/><text x="24" y="35" font-size="20" fill="#173d4a" font-weight="700">同样的三个请求，谁可以早点开始？</text><text x="25" y="81" font-size="17" fill="#475f67">请求级</text><text x="25" y="213" font-size="17" fill="#475f67">迭代级</text><g font-size="17" font-weight="600" text-anchor="middle"><rect x="155" y="58" width="170" height="64" rx="9" fill="#f4dbd3"/><text x="240" y="95" fill="#863e36">A 结束，B 继续</text><rect x="334" y="58" width="170" height="64" rx="9" fill="#f4dbd3"/><text x="419" y="95" fill="#863e36">仍占用整个批次</text><rect x="513" y="58" width="274" height="64" rx="9" fill="#faedd8"/><text x="650" y="95" fill="#93622f">C 等待入场</text><rect x="155" y="190" width="170" height="64" rx="9" fill="#cce7de"/><text x="240" y="228" fill="#276454">A + B</text><rect x="334" y="190" width="170" height="64" rx="9" fill="#cce7de"/><text x="419" y="228" fill="#276454">B + C</text><rect x="513" y="190" width="274" height="64" rx="9" fill="#cce7de"/><text x="650" y="228" fill="#276454">每轮更新活跃集合</text></g><path d="M155 141 H786" stroke="#d5deda" stroke-width="2" stroke-dasharray="7 8"/><text x="158" y="285" font-size="14" fill="#60787a">教学示例：不是实测延迟或真实 GPU 执行时间。</text></svg>
