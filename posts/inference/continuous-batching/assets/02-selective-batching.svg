<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="cb-t2 cb-d2"><title id="cb-t2">ORCA 的 Selective Batching：线性算子批量运行，Attention 按请求计算</title><desc id="cb-d2">将不同长度请求的 token 按总 token 数展平执行参数密集线性层，之后拆开执行各请求独立的 Attention，再合并继续线性运算。</desc><rect width="820" height="310" rx="14" fill="#fffdfa"/><text x="30" y="36" font-size="21" fill="#244451" font-weight="700">不规则序列，也可以共享一次权重读取</text><g font-size="15" text-anchor="middle"><rect x="28" y="80" width="159" height="77" rx="10" fill="#dcebf5" stroke="#8bbacb"/><text x="107" y="109" fill="#28546b">请求 A：2 tokens</text><text x="107" y="134" fill="#28546b">请求 B：3 tokens</text><path d="M188 117 H215" stroke="#4e7d83" stroke-width="3"/><rect x="215" y="80" width="165" height="77" rx="10" fill="#d9eee2" stroke="#78b6a0"/><text x="297" y="108" fill="#265e50">合并 [5, H]</text><text x="297" y="134" fill="#265e50">Linear / LN</text><path d="M381 117 H407" stroke="#4e7d83" stroke-width="3"/><rect x="407" y="80" width="180" height="77" rx="10" fill="#fae9d8" stroke="#d2a67f"/><text x="497" y="108" fill="#845f43">分开 Attention</text><text x="497" y="134" fill="#845f43">各自读取 KV</text><path d="M588 117 H614" stroke="#4e7d83" stroke-width="3"/><rect x="614" y="80" width="178" height="77" rx="10" fill="#d9eee2" stroke="#78b6a0"/><text x="702" y="108" fill="#265e50">再次合并</text><text x="702" y="134" fill="#265e50">Attn Out / MLP</text></g><rect x="84" y="204" width="651" height="58" rx="8" fill="#f1f4f0"/><text x="409" y="231" font-size="17" text-anchor="middle" fill="#435f64">长度不同 ≠ 禁止所有算子批处理</text><text x="409" y="250" font-size="13" text-anchor="middle" fill="#718482">ORCA 对 Attention 使用较窄定义；QKV/输出投影仍属于可批量线性操作。</text></svg>
