<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 294" role="img" aria-labelledby="cb-t3 cb-d3"><title id="cb-t3">连续批处理中的请求状态与 KV 生命周期</title><desc id="cb-d3">等待队列送入新的请求，运行集合逐轮推进，完成请求释放所占用的 KV 状态；内存约束可能阻止新请求加入。</desc><rect width="820" height="294" rx="14" fill="#fcfdf9"/><text x="30" y="37" font-size="21" font-weight="700" fill="#193c4a">调度不是只有队列，还要看 KV 容量</text><g font-size="19" text-anchor="middle"><rect x="35" y="80" width="191" height="99" rx="11" fill="#f9e5d4" stroke="#e1ad7a"/><text x="129" y="115" fill="#76543d">等待队列</text><text x="129" y="145" fill="#76543d" font-size="15">Admission</text><path d="M229 130 H305" stroke="#72969c" stroke-width="4"/><rect x="308" y="80" width="202" height="99" rx="11" fill="#d4ebe1" stroke="#74b0a1"/><text x="409" y="115" fill="#235e51">运行批次</text><text x="409" y="145" fill="#235e51" font-size="15">一步 / 检查 EOS</text><path d="M512 130 H591" stroke="#72969c" stroke-width="4"/><rect x="592" y="80" width="191" height="99" rx="11" fill="#d9e9f4" stroke="#8cb1c9"/><text x="687" y="115" fill="#335a70">完成退出</text><text x="687" y="145" fill="#335a70" font-size="15">释放 KV</text></g><text x="409" y="235" font-size="17" fill="#566e71" text-anchor="middle">每轮决策受公平性、显存预算和引擎执行代价共同约束。</text><text x="409" y="261" font-size="13" fill="#7a8986" text-anchor="middle">这是一张逻辑状态图，不对应具体实现的显存分配策略。</text></svg>
