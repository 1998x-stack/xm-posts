<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="02-collision-title 02-collision-desc" data-export="02-collision.svg"><title id="02-collision-title">边缘正确不代表联合正确</title><desc id="02-collision-desc">两条正确路径 of course 和 no problem；独立采样还会产生交叉组合。</desc><rect width="720" height="250" rx="12" fill="#fffdf9"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#203035"><text x="26" y="31" font-weight="bold">每个位置的边缘分布均为 ½</text><rect x="55" y="55" width="115" height="42" rx="8" fill="#ebe5fa" stroke="#92aaa5"/><text x="112.5" y="82" text-anchor="middle">of</text><rect x="55" y="130" width="115" height="42" rx="8" fill="#ebe5fa" stroke="#92aaa5"/><text x="112.5" y="157" text-anchor="middle">no</text><rect x="290" y="55" width="145" height="42" rx="8" fill="#d8f1e9" stroke="#92aaa5"/><text x="362.5" y="82" text-anchor="middle">course</text><rect x="290" y="130" width="145" height="42" rx="8" fill="#d8f1e9" stroke="#92aaa5"/><text x="362.5" y="157" text-anchor="middle">problem</text><path d="M171 76 L289 76" stroke="#526e70" stroke-width="2.5" fill="none"/><path d="M281 71 l8 5 -8 5" stroke="#526e70" fill="none"/><path d="M171 151 L289 151" stroke="#526e70" stroke-width="2.5" fill="none"/><path d="M281 146 l8 5 -8 5" stroke="#526e70" fill="none"/><path d="M171 76 L290 151 M171 151 L290 76" stroke="#c36c45" stroke-dasharray="5 4" stroke-width="2"/><text x="466" y="83" >实线：正确组合</text><text x="466" y="116" >虚线：跨模式组合</text><text x="25" y="215" >读到前一个实际 token，才能修正后一个分布。</text></g></svg>
