<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="05-allocation-title 05-allocation-desc" data-export="05-allocation.svg"><title id="05-allocation-title">跨请求分配验证容量</title><desc id="05-allocation-desc">固定额外预算四行，选择 A1 B1 A2 A3，满足所有前缀约束。</desc><rect width="720" height="250" rx="12" fill="#fffdf9"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#203035"><text x="25" y="29" font-weight="bold">固定额外预算 K = 4（教学值）</text><text x="30" y="80" >请求 A</text><rect x="132" y="54" width="140" height="42" rx="8" fill="#d8f1e9" stroke="#92aaa5"/><text x="202" y="81" text-anchor="middle">A₁ .90</text><rect x="292" y="54" width="140" height="42" rx="8" fill="#d8f1e9" stroke="#92aaa5"/><text x="362" y="81" text-anchor="middle">A₂ .72</text><rect x="452" y="54" width="140" height="42" rx="8" fill="#d8f1e9" stroke="#92aaa5"/><text x="522" y="81" text-anchor="middle">A₃ .432</text><text x="30" y="145" >请求 B</text><rect x="132" y="119" width="140" height="42" rx="8" fill="#d8f1e9" stroke="#92aaa5"/><text x="202" y="146" text-anchor="middle">B₁ .80</text><rect x="292" y="119" width="140" height="42" rx="8" fill="#edf1f1" stroke="#92aaa5"/><text x="362" y="146" text-anchor="middle">B₂ .40</text><rect x="452" y="119" width="140" height="42" rx="8" fill="#edf1f1" stroke="#92aaa5"/><text x="522" y="146" text-anchor="middle">B₃ .12</text><text x="26" y="191" font-weight="bold">全局入选：A₁ → B₁ → A₂ → A₃</text><text x="26" y="224" >结果 ℓA=3，ℓB=1；无跳过前驱。</text></g></svg>
