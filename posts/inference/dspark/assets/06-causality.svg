<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="06-causality-title 06-causality-desc" data-export="06-causality.svg"><title id="06-causality-title">不允许回溯选择候选</title><desc id="06-causality-desc">当前 token 影响后续分数，若再倒推自身是否入选就会造成选择偏差；历史预算隔离当前抽样。</desc><rect width="720" height="270" rx="12" fill="#fffdf9"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#203035"><text x="22" y="29" font-weight="bold">错误：当前样本决定它自身是否入选</text><rect x="22" y="48" width="172" height="46" rx="8" fill="#ebe5fa" stroke="#92aaa5"/><text x="108" y="77" text-anchor="middle">抽样 x₁</text><path d="M195 71 L220 71" stroke="#526e70" stroke-width="2.5" fill="none"/><path d="M212 66 l8 5 -8 5" stroke="#526e70" fill="none"/><rect x="222" y="48" width="180" height="46" rx="8" fill="#fbe8d8" stroke="#92aaa5"/><text x="312" y="77" text-anchor="middle">后续 c₂</text><path d="M403 71 L429 71" stroke="#526e70" stroke-width="2.5" fill="none"/><path d="M421 66 l8 5 -8 5" stroke="#526e70" fill="none"/><rect x="431" y="48" width="260" height="46" rx="8" fill="#fbe8d8" stroke="#92aaa5"/><text x="561" y="77" text-anchor="middle">回溯接纳 x₁</text><path d="M565 95 V120 H100 V95" fill="none" stroke="#b65e3c" stroke-width="2.5" stroke-dasharray="5 4"/><text x="22" y="155" font-weight="bold">正确设计：历史预测先决定容量</text><rect x="22" y="174" width="190" height="46" rx="8" fill="#edf1f1" stroke="#92aaa5"/><text x="117" y="203" text-anchor="middle">t−2 历史分数</text><path d="M213 197 L239 197" stroke="#526e70" stroke-width="2.5" fill="none"/><path d="M231 192 l8 5 -8 5" stroke="#526e70" fill="none"/><rect x="241" y="174" width="155" height="46" rx="8" fill="#d8f1e9" stroke="#92aaa5"/><text x="318.5" y="203" text-anchor="middle">容量 K</text><path d="M397 197 L423 197" stroke="#526e70" stroke-width="2.5" fill="none"/><path d="M415 192 l8 5 -8 5" stroke="#526e70" fill="none"/><rect x="425" y="174" width="266" height="46" rx="8" fill="#d8f1e9" stroke="#92aaa5"/><text x="558" y="203" text-anchor="middle">当前前缀排序与验证</text><text x="22" y="252" >容量不使用本轮未来候选。</text></g></svg>
