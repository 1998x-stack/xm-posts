<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 337" width="820" height="337" role="img" aria-labelledby="kv-f2-title kv-f2-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="kv-f2-title">Prefill 与 Decode 的不同节奏</title><desc id="kv-f2-desc">Prefill 在完整提示上构造缓存；Decode 每轮计算一个新 token 并把 K/V 追加到缓存。</desc><rect x="0" y="0" width="820" height="337" rx="12" fill="#fcfdfb" stroke="#e4eae5" stroke-width="1.4"/>
<text x="30" y="42" fill="#23444b" font-size="16" font-weight="700">阶段 A · PREFILL</text><text x="448" y="42" fill="#23444b" font-size="16" font-weight="700">阶段 B · DECODE</text>
<rect x="27" y="65" width="220" height="88" rx="9" fill="#e4efef" stroke="#d6e4e2" stroke-width="1.4"/><text x="137" y="95" fill="#25646b" font-size="18" text-anchor="middle" font-weight="700">输入提示</text><text x="137" y="124" fill="#587880" font-size="16" text-anchor="middle">[t₁, t₂, t₃, t₄]</text>
<path d="M257 107 L296 107" fill="none" stroke="#76939b" stroke-width="2.3" stroke-linecap="round"/><path d="M289 102 L296 107 L289 112" fill="none" stroke="#76939b" stroke-width="2.3" stroke-linejoin="round"/><rect x="304" y="65" width="200" height="88" rx="9" fill="#f8e9dd" stroke="#d6e4e2" stroke-width="1.4"/><text x="404" y="97" fill="#945636" font-size="17" text-anchor="middle" font-weight="700">并行处理提示</text><text x="404" y="126" fill="#856c5e" font-size="14" text-anchor="middle">得到各层 K/V</text>
<path d="M514 107 L553 107" fill="none" stroke="#76939b" stroke-width="2.3" stroke-linecap="round"/><path d="M546 102 L553 107 L546 112" fill="none" stroke="#76939b" stroke-width="2.3" stroke-linejoin="round"/><rect x="559" y="65" width="230" height="88" rx="9" fill="#e7e6f5" stroke="#d6e4e2" stroke-width="1.4"/><text x="674" y="100" fill="#605584" font-size="17" text-anchor="middle" font-weight="700">缓存提示的 K/V</text><text x="674" y="127" fill="#6e6591" font-size="15" text-anchor="middle">t₁ … t₄</text>
<path d="M675 163 L675 205" fill="none" stroke="#8477ac" stroke-width="2.3" stroke-linecap="round"/><path d="M668 200 L675 205 L668 210" fill="none" stroke="#8477ac" stroke-width="2.3" stroke-linejoin="round"/><rect x="455" y="214" width="332" height="88" rx="9" fill="#e5f2ed" stroke="#d6e4e2" stroke-width="1.4"/><text x="621" y="246" fill="#216c68" font-size="17" text-anchor="middle" font-weight="700">当前 token → Q₅, K₅, V₅</text><text x="621" y="277" fill="#547b77" font-size="15" text-anchor="middle">Q₅ 读历史；K₅ / V₅ 追加</text>
<text x="30" y="230" fill="#23444b" font-size="16" font-weight="700">同一层内：</text><text x="30" y="260" fill="#61777b" font-size="13">历史 K/V 不再逐步重算</text><text x="30" y="286" fill="#61777b" font-size="13">但 Attention 仍需要读取过去</text>
</svg>