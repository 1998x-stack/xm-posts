<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="kv-f3-title kv-f3-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="kv-f3-title">单步 Decode 的 Q K V 和 softmax</title><desc id="kv-f3-desc">一个 Query 读取历史 Key 计算权重，权重乘 Value 得到输出。Key 与 Value 沿时间轴增长。</desc><rect x="0" y="0" width="820" height="330" rx="12" fill="#fcfdfb" stroke="#e4eae5" stroke-width="1.4"/>
