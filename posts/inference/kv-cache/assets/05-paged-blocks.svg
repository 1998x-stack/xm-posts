<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" role="img" aria-labelledby="kv-f5-title kv-f5-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="kv-f5-title">PagedAttention 的逻辑块表与非连续物理块</title><desc id="kv-f5-desc">三个逻辑 token 块分别映射到物理编号 4、0、7；KV 块在物理内存中无需连续。</desc><rect x="0" y="0" width="820" height="350" rx="12" fill="#fcfdfb" stroke="#e4eae5" stroke-width="1.4"/>
