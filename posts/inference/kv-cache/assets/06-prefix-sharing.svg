<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-labelledby="kv-f6-title kv-f6-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="kv-f6-title">相同前缀请求共享完整 KV Blocks</title><desc id="kv-f6-desc">请求 A 与 B 使用同一段已匹配的完整 token 块，后续不同部分分别拥有自己的 KV 块。</desc><rect x="0" y="0" width="820" height="360" rx="12" fill="#fcfdfb" stroke="#e4eae5" stroke-width="1.4"/>
<rect x="30" y="54" width="238" height="67" rx="9" fill="#e7f1ed" stroke="#d6e4e2" stroke-width="1.4"/><text x="149" y="81" fill="#236c65" font-size="18" text-anchor="middle" font-weight="700">相同系统提示</text><text x="149" y="105" fill="#59837c" font-size="14" text-anchor="middle">[prefix block A, B]</text>
<path d="M280 85 L341 85" fill="none" stroke="#2e827c" stroke-width="2.3" stroke-linecap="round"/><path d="M334 80 L341 85 L334 90" fill="none" stroke="#2e827c" stroke-width="2.3" stroke-linejoin="round"/><rect x="352" y="54" width="435" height="67" rx="9" fill="#e7e7f5" stroke="#d6e4e2" stroke-width="1.4"/><text x="570" y="81" fill="#61538c" font-size="18" text-anchor="middle" font-weight="700">可复用的完整 KV Blocks</text><text x="570" y="105" fill="#746a98" font-size="14" text-anchor="middle">同模型 · 同位置 · 同前缀上下文</text>
<path d="M574 126 L574 170" fill="none" stroke="#8477ac" stroke-width="2.3" stroke-linecap="round"/><path d="M567 165 L574 170 L567 175" fill="none" stroke="#8477ac" stroke-width="2.3" stroke-linejoin="round"/><path d="M572 171 L270 207" fill="none" stroke="#8477ac" stroke-width="2.3" stroke-linecap="round"/><path d="M263 202 L270 207 L263 212" fill="none" stroke="#8477ac" stroke-width="2.3" stroke-linejoin="round"/><path d="M578 171 L624 207" fill="none" stroke="#8477ac" stroke-width="2.3" stroke-linecap="round"/><path d="M617 202 L624 207 L617 212" fill="none" stroke="#8477ac" stroke-width="2.3" stroke-linejoin="round"/>
<rect x="40" y="222" width="340" height="77" rx="9" fill="#fff1e7" stroke="#ead0bf" stroke-width="1.4"/><rect x="443" y="222" width="340" height="77" rx="9" fill="#fff1e7" stroke="#ead0bf" stroke-width="1.4"/>
<text x="210" y="251" fill="#995b3c" font-size="18" text-anchor="middle" font-weight="700">请求 A：不同问题</text><text x="210" y="277" fill="#876e5f" font-size="14" text-anchor="middle">追加独立 suffix / KV</text>
<text x="613" y="251" fill="#995b3c" font-size="18" text-anchor="middle" font-weight="700">请求 B：不同问题</text><text x="613" y="277" fill="#876e5f" font-size="14" text-anchor="middle">追加独立 suffix / KV</text>
<text x="30" y="338" fill="#61777b" font-size="13">是否命中依赖完整前缀及缓存键一致性；缓存也可能被驱逐。</text>
</svg>