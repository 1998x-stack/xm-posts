<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" role="img" aria-label="共享前缀与写时复制 Copy-on-Write"><title>共享前缀与写时复制 Copy-on-Write</title><rect width="760" height="278" rx="16" fill="#f9fbf9"/><text x="25" y="34" fill="#35565d" text-anchor="start" font-size="16">两个候选输出共享同一段 prompt</text>
<rect x="25" y="52" width="185" height="58" rx="10" fill="#e1f1ec" stroke="#bfd2ce"/><text x="117.5" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">P5 · ref=2</text><text x="117.5" y="98" text-anchor="middle" font-size="12" fill="#536e70">shared prefix block</text>
<rect x="265" y="52" width="185" height="58" rx="10" fill="#e1f1ec" stroke="#bfd2ce"/><text x="357.5" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">P8 · ref=2</text><text x="357.5" y="98" text-anchor="middle" font-size="12" fill="#536e70">partial block</text>
<path d="M450 80L530 80" fill="none" stroke="#5d918c" stroke-width="2" stroke-linecap="round"/><text x="540" y="86" fill="#35565d" text-anchor="start" font-size="14">A、B 均引用</text>
<text x="26" y="150" fill="#35565d" text-anchor="start" font-size="16">A 继续写入时：P8 被复制成 P11；B 仍保留 P8</text>
<rect x="26" y="174" width="188" height="61" rx="10" fill="#e1f1ec" stroke="#bfd2ce"/><text x="120" y="197.5" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">A → P5</text><text x="120" y="221.5" text-anchor="middle" font-size="12" fill="#536e70">只读共享</text>
<rect x="232" y="174" width="188" height="61" rx="10" fill="#fae9db" stroke="#bfd2ce"/><text x="326" y="197.5" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">A → P11</text><text x="326" y="221.5" text-anchor="middle" font-size="12" fill="#536e70">私有可写</text>
<rect x="438" y="174" width="136" height="61" rx="10" fill="#e1f1ec" stroke="#bfd2ce"/><text x="506" y="197.5" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">B → P5</text><text x="506" y="221.5" text-anchor="middle" font-size="12" fill="#536e70">共享</text>
<rect x="588" y="174" width="144" height="61" rx="10" fill="#e1f1ec" stroke="#bfd2ce"/><text x="660" y="197.5" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">B → P8</text><text x="660" y="221.5" text-anchor="middle" font-size="12" fill="#536e70">原块</text>
<text x="27" y="259" fill="#627d7c" text-anchor="start" font-size="13">引用计数与拷贝保证：共享不会让两个分支相互改写 KV。</text></svg>
