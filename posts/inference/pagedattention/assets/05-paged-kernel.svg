<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-label="PagedAttention 读 KV 的数据路径"><title>PagedAttention 读 KV 的数据路径</title><rect width="760" height="272" rx="16" fill="#f9fbf9"/><rect x="22" y="56" width="119" height="72" rx="10" fill="#e9f3f2" stroke="#bfd2ce"/><text x="81.5" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">Query q</text><text x="81.5" y="109" text-anchor="middle" font-size="12" fill="#536e70">单步 decode</text>
<text x="157" y="98" fill="#35565d" text-anchor="start" font-size="26">→</text>
<rect x="186" y="56" width="148" height="72" rx="10" fill="#e2eee9" stroke="#bfd2ce"/><text x="260" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">逻辑索引</text><text x="260" y="109" text-anchor="middle" font-size="12" fill="#536e70">j // B</text>
<text x="348" y="98" fill="#35565d" text-anchor="start" font-size="26">→</text>
<rect x="377" y="56" width="169" height="72" rx="10" fill="#f7ecdf" stroke="#bfd2ce"/><text x="461.5" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">Block Table</text><text x="461.5" y="109" text-anchor="middle" font-size="12" fill="#536e70">physical id</text>
<text x="560" y="98" fill="#35565d" text-anchor="start" font-size="26">→</text>
<rect x="589" y="56" width="146" height="72" rx="10" fill="#e4edf9" stroke="#bfd2ce"/><text x="662" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#244d53">KV gather</text><text x="662" y="109" text-anchor="middle" font-size="12" fill="#536e70">分散物理页</text>
<text x="28" y="185" fill="#2e6467" text-anchor="start" font-size="19">每个 token j：physical = table[j // B]；offset = j % B</text>
<text x="28" y="219" fill="#35565d" text-anchor="start" font-size="16">对 K 做 q·k/√d，按可见 token softmax，再加权读取 V。</text>
<text x="28" y="251" fill="#5c7775" text-anchor="start" font-size="13">真实 CUDA/Triton 物理布局、warp 分工与 online softmax 由具体 backend 决定。</text></svg>
