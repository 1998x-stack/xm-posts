<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 322" role="img" aria-labelledby="sa-t1 sa-d1"><title id="sa-t1">完整 Prefill 和切块 Prefill 对正在执行的 Decode 的干扰对比</title><desc id="sa-d1">上图显示长 Prefill 独占一整轮造成流式解码空档；下图把 Prefill 分为三个 chunk 并与每轮 decode 混合执行。</desc><rect width="820" height="322" rx="14" fill="#fffdfa"/><text x="28" y="39" font-size="21" font-weight="700" fill="#304351">一段长 Prompt 为什么会让正在输出的文本卡顿？</text><text x="26" y="86" font-size="17" fill="#5e7478">全量 Prefill</text><text x="26" y="207" font-size="17" fill="#5e7478">Chunked Prefill</text><g text-anchor="middle" font-size="16" font-weight="700"><rect x="179" y="61" width="112" height="57" rx="8" fill="#d9ede2"/><text x="235" y="96" fill="#286756">D1</text><rect x="298" y="61" width="338" height="57" rx="8" fill="#f2dbcf"/><text x="467" y="96" fill="#915841">长 Prefill 占用迭代</text><rect x="645" y="61" width="150" height="57" rx="8" fill="#d9ede2"/><text x="720" y="96" fill="#286756">D2 延后</text><rect x="179" y="181" width="198" height="57" rx="8" fill="#d9ede2"/><text x="278" y="207" fill="#286756">D1 + C1</text><text x="278" y="227" fill="#537c6e" font-size="13">Decode + chunk</text><rect x="386" y="181" width="198" height="57" rx="8" fill="#d9ede2"/><text x="485" y="207" fill="#286756">D2 + C2</text><text x="485" y="227" fill="#537c6e" font-size="13">Decode + chunk</text><rect x="593" y="181" width="202" height="57" rx="8" fill="#d9ede2"/><text x="694" y="207" fill="#286756">D3 + C3</text><text x="694" y="227" fill="#537c6e" font-size="13">Decode + chunk</text></g><path d="M24 151 H799" stroke="#dfe6e1" stroke-width="2" stroke-dasharray="6 8"/><text x="27" y="280" font-size="14" fill="#6c7f82">图示是策略对照；真实迭代耗时依 token 数、模型、批大小及 kernel 而定。</text></svg>
