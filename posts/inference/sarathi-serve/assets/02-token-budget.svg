<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 323" role="img" aria-labelledby="sa-t2 sa-d2"><title id="sa-t2">预算为八个 token 的一次混合批次填充</title><desc id="sa-d2">两个正在解码的请求各占一 token 槽位，其余六个槽位放一个 Prefill Chunk，总量恰好等于预算 8。</desc><rect width="820" height="323" rx="14" fill="#fafcf9"/><text x="29" y="39" font-size="21" font-weight="700" fill="#25454c">同一轮先为 Decode 留座位，再填 Prefill</text><text x="30" y="85" font-size="18" fill="#4e656c">示例 token budget τ = 8</text><g font-size="17" text-anchor="middle" font-weight="700"><rect x="29" y="115" width="88" height="85" rx="8" fill="#d4e9e2" stroke="#8cbfac"/><text x="73" y="151" fill="#2e6856">Decode</text><text x="73" y="175" font-size="15" fill="#2e6856">D1</text><rect x="126" y="115" width="88" height="85" rx="8" fill="#d4e9e2" stroke="#8cbfac"/><text x="170" y="151" fill="#2e6856">Decode</text><text x="170" y="175" font-size="15" fill="#2e6856">D2</text><rect x="223" y="115" width="88" height="85" rx="8" fill="#f1e0cc" stroke="#d6b691"/><text x="267" y="151" fill="#925b37">Prefill</text><text x="267" y="175" font-size="15" fill="#925b37">C1</text><rect x="320" y="115" width="88" height="85" rx="8" fill="#f1e0cc" stroke="#d6b691"/><text x="364" y="151" fill="#925b37">Prefill</text><text x="364" y="175" font-size="15" fill="#925b37">C2</text><rect x="417" y="115" width="88" height="85" rx="8" fill="#f1e0cc" stroke="#d6b691"/><text x="461" y="151" fill="#925b37">Prefill</text><text x="461" y="175" font-size="15" fill="#925b37">C3</text><rect x="514" y="115" width="88" height="85" rx="8" fill="#f1e0cc" stroke="#d6b691"/><text x="558" y="151" fill="#925b37">Prefill</text><text x="558" y="175" font-size="15" fill="#925b37">C4</text><rect x="611" y="115" width="88" height="85" rx="8" fill="#f1e0cc" stroke="#d6b691"/><text x="655" y="151" fill="#925b37">Prefill</text><text x="655" y="175" font-size="15" fill="#925b37">C5</text><rect x="708" y="115" width="88" height="85" rx="8" fill="#f1e0cc" stroke="#d6b691"/><text x="752" y="151" fill="#925b37">Prefill</text><text x="752" y="175" font-size="15" fill="#925b37">C6</text></g><text x="30" y="242" font-size="17" fill="#3d6061">n_decode = 2；prefill chunk = min(剩余 prompt, 8 − 2) = 6。</text><text x="30" y="272" font-size="14" fill="#778a86">预算是限制每轮工作量的近似代理；τ 必须用真实模型吞吐/时延曲线标定。</text></svg>
