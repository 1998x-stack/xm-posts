<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 304" role="img" aria-labelledby="sa-t3 sa-d3"><title id="sa-t3">Chunked Prefill 的效率与时延权衡</title><desc id="sa-d3">小块可以缩短单次 decode 受到干扰的时间，但会增加跨块 KV 读取与 kernel 调度开销；大块相反，token 预算需要按 SLO 选择。</desc><rect width="820" height="304" rx="14" fill="#fcfdfb"/><text x="27" y="39" font-size="21" font-weight="700" fill="#284853">Chunk 不是越小越好</text><rect x="31" y="77" width="338" height="155" rx="12" fill="#e6f1ee" stroke="#98cabb"/><text x="199" y="113" text-anchor="middle" font-size="22" font-weight="700" fill="#2f6f5e">小 Chunk</text><text x="199" y="150" text-anchor="middle" font-size="18" fill="#517568">较短单轮迭代</text><text x="199" y="182" text-anchor="middle" font-size="18" fill="#517568">更多启动与历史 KV 读取</text><rect x="450" y="77" width="338" height="155" rx="12" fill="#f9e9d9" stroke="#dfb891"/><text x="619" y="113" text-anchor="middle" font-size="22" font-weight="700" fill="#916446">大 Chunk</text><text x="619" y="150" text-anchor="middle" font-size="18" fill="#a37458">更高 Prefill 效率</text><text x="619" y="182" text-anchor="middle" font-size="18" fill="#a37458">可能更大 Decode 干扰</text><text x="410" y="276" text-anchor="middle" font-size="16" fill="#688080">在满足 TBT/ITL 约束的可选区间内，选择效率更好的预算。</text></svg>
