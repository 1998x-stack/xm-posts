<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 325" role="img" aria-labelledby="sg-t1 sg-d1"><title id="sg-t1">三个提示请求组成的压缩前缀树</title><desc id="sg-d1">三个请求共享 SYS A 前缀，然后分别走向 QA、QB，或其他主题的 SYS Z 分支，节点表示压缩的 token 边。</desc><rect width="820" height="325" rx="14" fill="#fbfdfb"/><text x="26" y="36" font-size="21" font-weight="700" fill="#1d4648">为什么不是把每个完整 prompt 单独存一份？</text><g fill="none" stroke="#6f9b99" stroke-width="3"><path d="M114 149 H263"/><path d="M407 149 H508 V97 H572"/><path d="M508 149 V197 H572"/><path d="M187 149 V262 H572"/></g><g font-size="18" text-anchor="middle" font-weight="700"><rect x="25" y="117" width="133" height="64" rx="10" fill="#dce7eb" stroke="#8bb2b5"/><text x="91" y="154" fill="#355962">Root</text><rect x="263" y="117" width="144" height="64" rx="10" fill="#cceadf" stroke="#6cac95"/><text x="335" y="154" fill="#266753">SYS · A</text><rect x="572" y="65" width="209" height="64" rx="10" fill="#e8e0f6" stroke="#baa8dc"/><text x="676" y="102" fill="#5e5087">问答分支 Q1</text><rect x="572" y="165" width="209" height="64" rx="10" fill="#e8e0f6" stroke="#baa8dc"/><text x="676" y="202" fill="#5e5087">问答分支 Q2</text><rect x="572" y="234" width="209" height="64" rx="10" fill="#f5e9d5" stroke="#dfba81"/><text x="676" y="272" fill="#916735">SYS · B · Q3</text></g><text x="28" y="302" fill="#6c8380" font-size="13">边标签可以包含多个 token；绿色路径共享一份可复用的前缀 KV。教学示意，不是论文 Figure 3 的复刻。</text></svg>
