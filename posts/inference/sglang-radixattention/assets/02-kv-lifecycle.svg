<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="sg-t2 sg-d2"><title id="sg-t2">缓存匹配复用与淘汰的四个阶段</title><desc id="sg-d2">先匹配请求的最长前缀，再增加引用计数运行新请求，完成后降为可淘汰状态，内存不足时从最老叶节点逐步淘汰。</desc><rect width="820" height="310" rx="14" fill="#fcfdfb"/><text x="26" y="38" font-size="21" font-weight="700" fill="#284d55">缓存并不等于“永远存储”：还要管并发引用</text><g font-size="17" text-anchor="middle"><rect x="24" y="83" width="175" height="135" rx="11" fill="#dcecf8" stroke="#92b8d2"/><text x="111" y="125" fill="#285a79">① 找最长前缀</text><text x="111" y="155" fill="#4b7082" font-size="14">prefix match</text><path d="M200 147 H228" stroke="#6d9594" stroke-width="3"/><rect x="230" y="83" width="175" height="135" rx="11" fill="#d8eee0" stroke="#8dc3aa"/><text x="317" y="125" fill="#316b55">② 活跃请求引用</text><text x="317" y="155" fill="#4b8065" font-size="14">ref count &gt; 0</text><path d="M406 147 H433" stroke="#6d9594" stroke-width="3"/><rect x="435" y="83" width="175" height="135" rx="11" fill="#e9e4f5" stroke="#b6a9d5"/><text x="522" y="125" fill="#695385">③ 请求结束</text><text x="522" y="155" fill="#847399" font-size="14">ref count = 0</text><path d="M611 147 H638" stroke="#6d9594" stroke-width="3"/><rect x="641" y="83" width="154" height="135" rx="11" fill="#f8e8d9" stroke="#dfb190"/><text x="718" y="125" fill="#986441">④ 内存紧张时</text><text x="718" y="155" fill="#986441" font-size="14">evict LRU leaf</text></g><text x="410" y="264" fill="#617779" text-anchor="middle" font-size="16">活跃引用不可被逐出；叶子优先释放，才不会破坏仍共享的父前缀。</text></svg>
