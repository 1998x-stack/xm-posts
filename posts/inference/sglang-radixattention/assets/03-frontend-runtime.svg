<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="sg-t3 sg-d3"><title id="sg-t3">SGLang 前端和运行时优化边界</title><desc id="sg-d3">左侧语言前端通过 extend、gen、fork 与 join 形成结构化请求，右侧推理运行时进行 KV 前缀复用、压缩有限状态机解码；API 端点可采用另外的推测调用优化。</desc><rect width="820" height="310" rx="14" fill="#fcfdfb"/><text x="26" y="39" font-size="21" font-weight="700" fill="#284d55">SGLang 不是只有一种 KV Cache 优化</text><rect x="28" y="85" width="258" height="170" rx="12" fill="#e4f0ed" stroke="#81bbaa"/><text x="158" y="122" text-anchor="middle" font-size="21" font-weight="700" fill="#275f56">Frontend</text><text x="158" y="156" text-anchor="middle" font-size="17" fill="#356b62">extend · gen · select</text><text x="158" y="184" text-anchor="middle" font-size="17" fill="#356b62">fork · join</text><text x="158" y="216" text-anchor="middle" font-size="14" fill="#69847e">多次调用与控制流</text><path d="M288 172 H347" stroke="#739c99" stroke-width="4"/><rect x="351" y="85" width="441" height="170" rx="12" fill="#e7ecfa" stroke="#a4b0d4"/><text x="571" y="117" text-anchor="middle" font-size="21" font-weight="700" fill="#4a588b">Runtime / Backends</text><g font-size="17" text-anchor="middle"><rect x="373" y="141" width="180" height="80" rx="9" fill="#fff" stroke="#b8c8dc"/><text x="463" y="174" fill="#52628b">RadixAttention</text><text x="463" y="198" fill="#7786a0" font-size="13">KV reuse</text><rect x="564" y="141" width="206" height="80" rx="9" fill="#fff" stroke="#b8c8dc"/><text x="667" y="173" fill="#52628b">Compressed FSM</text><text x="667" y="198" fill="#7786a0" font-size="13">约束格式解码</text></g><text x="410" y="287" text-anchor="middle" font-size="14" fill="#6a7c80">API-only 模型的 speculative endpoint execution 属于论文的另一条优化路径。</text></svg>
