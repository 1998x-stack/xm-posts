<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">推测解码：从逐个解码到一次批量验证</title><desc id="svg-desc">上方常规解码逐次调用大模型，下方先用小模型提出三个候选再由大模型一次并行验证。</desc><rect width="960" height="360" rx="20" fill="#fafbf8"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="38" y="41" font-size="21" font-weight="700" fill="#213747">两种生成路径：大模型必须做几次串行工作？</text>
<text x="40" y="103" font-size="18" font-weight="700" fill="#5b517f">常规解码</text>
<rect x="220" y="70" width="107" height="72" rx="12" fill="#e2dcf3" stroke="#746799" stroke-width="1.4"/><text x="273" y="99" font-size="17" text-anchor="middle" fill="#453b67">目标模型</text><text x="273" y="121" font-size="13" text-anchor="middle" fill="#453b67">生成 1</text><rect x="356" y="70" width="107" height="72" rx="12" fill="#e2dcf3" stroke="#746799" stroke-width="1.4"/><text x="409" y="99" font-size="17" text-anchor="middle" fill="#453b67">目标模型</text><text x="409" y="121" font-size="13" text-anchor="middle" fill="#453b67">生成 2</text><rect x="492" y="70" width="107" height="72" rx="12" fill="#e2dcf3" stroke="#746799" stroke-width="1.4"/><text x="545" y="99" font-size="17" text-anchor="middle" fill="#453b67">目标模型</text><text x="545" y="121" font-size="13" text-anchor="middle" fill="#453b67">生成 3</text><rect x="628" y="70" width="107" height="72" rx="12" fill="#e2dcf3" stroke="#746799" stroke-width="1.4"/><text x="681" y="99" font-size="17" text-anchor="middle" fill="#453b67">目标模型</text><text x="681" y="121" font-size="13" text-anchor="middle" fill="#453b67">生成 4</text><rect x="764" y="70" width="107" height="72" rx="12" fill="#e2dcf3" stroke="#746799" stroke-width="1.4"/><text x="817" y="99" font-size="17" text-anchor="middle" fill="#453b67">目标模型</text><text x="817" y="121" font-size="13" text-anchor="middle" fill="#453b67">生成 5</text>
<text x="40" y="221" font-size="18" font-weight="700" fill="#14776b">推测解码</text>
<rect x="220" y="184" width="94" height="73" rx="11" fill="#cef0e7" stroke="#299d89"/><text x="267" y="212" font-size="17" text-anchor="middle" fill="#075f53">草稿 1</text><text x="267" y="235" font-size="13" text-anchor="middle" fill="#075f53">小模型</text><rect x="335" y="184" width="94" height="73" rx="11" fill="#cef0e7" stroke="#299d89"/><text x="382" y="212" font-size="17" text-anchor="middle" fill="#075f53">草稿 2</text><text x="382" y="235" font-size="13" text-anchor="middle" fill="#075f53">小模型</text><rect x="450" y="184" width="94" height="73" rx="11" fill="#cef0e7" stroke="#299d89"/><text x="497" y="212" font-size="17" text-anchor="middle" fill="#075f53">草稿 3</text><text x="497" y="235" font-size="13" text-anchor="middle" fill="#075f53">小模型</text>
<path d="M558 220 H609" stroke="#d17c4f" stroke-width="3"/><path d="M601 212 l12 8 -12 8" fill="none" stroke="#d17c4f" stroke-width="3"/>
<rect x="620" y="184" width="266" height="73" rx="11" fill="#e2dcf3" stroke="#746799" stroke-width="1.4"/>
<text x="753" y="213" font-size="18" text-anchor="middle" font-weight="700" fill="#453b67">目标模型 · 一次验证</text><text x="753" y="238" font-size="14" text-anchor="middle" fill="#453b67">并行计算多个位置的概率</text>
<rect x="32" y="283" width="896" height="51" rx="10" fill="#edf2f1"/><circle cx="55" cy="309" r="8" fill="#14776b"/><text x="72" y="315" font-size="16" fill="#274755">草稿只是提议；接受或纠正由目标分布 p 决定。右图不是固定 3 token 的速度保证。</text></g></svg>
