<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">首次拒绝与丢弃后续草稿</title><desc id="svg-desc">示意草稿 A B C 三个 token，目标模型接受 A、拒绝 B，此时从目标与草稿的残差分布采样替换 B，C 作废；不对 C 继续验收。</desc><rect width="960" height="360" rx="20" fill="#fafbf8"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="36" y="42" font-size="22" font-weight="700" fill="#213747">第一次拒绝发生在第 2 个 token</text>
<rect x="60" y="85" width="207" height="70" rx="11" fill="#d6f1e8" stroke="#16877a" stroke-width="2"/><text x="163" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#223e48">草稿 A</text><text x="163" y="140" text-anchor="middle" font-size="15" fill="#35535b">✓ 接受</text><rect x="308" y="85" width="207" height="70" rx="11" fill="#fbe5dc" stroke="#c77657" stroke-width="2"/><text x="411" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#223e48">草稿 B</text><text x="411" y="140" text-anchor="middle" font-size="15" fill="#35535b">× 拒绝</text><rect x="556" y="85" width="207" height="70" rx="11" fill="#edf0f0" stroke="#b1c1c1" stroke-width="2"/><text x="659" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#223e48">草稿 C</text><text x="659" y="140" text-anchor="middle" font-size="15" fill="#35535b">不再验证</text>
<path d="M163 160 V212 M411 160 V212" stroke="#557378" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="67" y="219" width="193" height="64" rx="10" fill="#d6f1e8" stroke="#16877a"/><text x="163" y="257" text-anchor="middle" font-size="19" fill="#165a51">保留 A</text>
<rect x="292" y="219" width="293" height="64" rx="10" fill="#ffeccd" stroke="#d17c4f"/><text x="438" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#92522b">按修正分布重采</text><text x="438" y="269" text-anchor="middle" font-size="13" fill="#92522b">r ∝ max(0, p − q)</text>
<path d="M707 165 V250 H608" fill="none" stroke="#adbdc1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="780" y="245" font-size="16" fill="#6a7d82">C 被丢弃</text>
<text x="480" y="326" text-anchor="middle" font-size="16" fill="#284955">本轮输出：1 个接受的草稿 token + 1 个修正 token</text></g></svg>
