<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">重叠概率与残差修正</title><desc id="svg-desc">示例中草稿分布 q 为 0.6、0.3、0.1，目标 p 为 0.3、0.4、0.3；被接受的质量为 0.3、0.3、0.1，被拒绝质量为 0.3，修正质量落到 B 和 C。</desc><rect width="960" height="360" rx="20" fill="#fafbf8"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="42" font-size="22" font-weight="700" fill="#213747">单步概率质量如何“无损”分解？</text>
<text x="154" y="85" font-size="19" font-weight="700" text-anchor="middle" fill="#243c48">Token A</text><text x="64" y="113" font-size="14" fill="#14776b">q = 0.6</text><rect x="64" y="123" width="171" height="28" rx="4" fill="#8bdac7"/><text x="64" y="181" font-size="14" fill="#685988">p = 0.3</text><rect x="64" y="190" width="85.5" height="28" rx="4" fill="#c7b8e8"/><text x="64" y="251" font-size="14" fill="#d17c4f">重叠 min(p,q) = 0.3</text><rect x="64" y="262" width="85.5" height="26" rx="4" fill="#14776b"/><text x="444" y="85" font-size="19" font-weight="700" text-anchor="middle" fill="#243c48">Token B</text><text x="354" y="113" font-size="14" fill="#14776b">q = 0.3</text><rect x="354" y="123" width="85.5" height="28" rx="4" fill="#8bdac7"/><text x="354" y="181" font-size="14" fill="#685988">p = 0.4</text><rect x="354" y="190" width="114" height="28" rx="4" fill="#c7b8e8"/><text x="354" y="251" font-size="14" fill="#d17c4f">重叠 min(p,q) = 0.3</text><rect x="354" y="262" width="85.5" height="26" rx="4" fill="#14776b"/><text x="734" y="85" font-size="19" font-weight="700" text-anchor="middle" fill="#243c48">Token C</text><text x="644" y="113" font-size="14" fill="#14776b">q = 0.1</text><rect x="644" y="123" width="28.5" height="28" rx="4" fill="#8bdac7"/><text x="644" y="181" font-size="14" fill="#685988">p = 0.3</text><rect x="644" y="190" width="85.5" height="28" rx="4" fill="#c7b8e8"/><text x="644" y="251" font-size="14" fill="#d17c4f">重叠 min(p,q) = 0.1</text><rect x="644" y="262" width="28.5" height="26" rx="4" fill="#14776b"/>
<text x="480" y="335" text-anchor="middle" font-size="16" fill="#314e53">接受质量 0.7 ＋ 拒绝后按 (p−q)₊ 修正 0.3 → 最终仍为 p</text></g></svg>
