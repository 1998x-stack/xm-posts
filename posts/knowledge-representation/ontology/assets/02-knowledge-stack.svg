<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-labelledby="title desc"><title id="title">本体工程的分层知识流水线</title><desc id="desc">从业务问题和能力问题开始，形成概念模型和公理，再编码为 RDF 图，使用 RDFS 与 OWL 推理，最后通过 SPARQL 和应用消费。</desc><defs><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#6d8c84"/></marker></defs><text x="470" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#274a4a">从“问题”到“可计算的语义”</text>
<rect x="120" y="72" width="700" height="76" rx="14" fill="#e8f2ec" stroke="#77a995" stroke-width="2"/><text x="470" y="103" text-anchor="middle" font-size="19" font-weight="700" fill="#27584f">业务问题 / Competency Questions</text><text x="470" y="128" text-anchor="middle" font-size="14" fill="#557b70">系统必须回答什么？谁会使用和维护知识？</text><path d="M470 148V174" stroke="#6d8c84" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="120" y="180" width="700" height="76" rx="14" fill="#f0edfa" stroke="#9b8cc9" stroke-width="2"/><text x="470" y="211" text-anchor="middle" font-size="19" font-weight="700" fill="#51477c">概念模型 / Ontology Schema</text><text x="470" y="236" text-anchor="middle" font-size="14" fill="#71679b">Classes · Properties · Axioms · Constraints</text><path d="M470 256V282" stroke="#6d8c84" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="120" y="288" width="700" height="76" rx="14" fill="#eaf2f8" stroke="#86a9c4" stroke-width="2"/><text x="470" y="319" text-anchor="middle" font-size="19" font-weight="700" fill="#365e7a">RDF Knowledge Graph / Data</text><text x="470" y="344" text-anchor="middle" font-size="14" fill="#5b7c93">IRI · Subject–Predicate–Object · Individuals</text><path d="M470 364V390" stroke="#6d8c84" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="120" y="396" width="700" height="76" rx="14" fill="#fff2e7" stroke="#d39a6e" stroke-width="2"/><text x="470" y="427" text-anchor="middle" font-size="19" font-weight="700" fill="#87552f">Reasoning / Validation</text><text x="470" y="452" text-anchor="middle" font-size="14" fill="#a27450">RDFS / OWL entailment · SHACL validation</text><path d="M470 472V498" stroke="#6d8c84" stroke-width="2.5" marker-end="url(#a2)"/>
