<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="520" viewBox="0 0 1020 520" role="img" aria-labelledby="title desc"><title id="title">大学领域的本体结构示例</title><desc id="desc">Person 是 Student 和 Professor 的上位类，ResearchStudent 是 Student 的子类，Course 是独立类。enrolledIn 连接 Student 和 Course，advisedBy 连接 Student 和 Professor。</desc><defs><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#728c85"/></marker></defs><text x="510" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#294d4d">University Ontology · Schema View</text>
<rect x="390" y="66" width="240" height="58" rx="12" fill="#eaf3ee" stroke="#579783" stroke-width="2"/><text x="510" y="102" text-anchor="middle" font-size="20" font-weight="700" fill="#28594f">Person</text><path d="M510 124V158H255V184M510 158H765V184" fill="none" stroke="#579783" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="145" y="188" width="220" height="58" rx="12" fill="#f0edfa" stroke="#8d7dc0" stroke-width="2"/><text x="255" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#50467c">Student</text><rect x="655" y="188" width="220" height="58" rx="12" fill="#f0edfa" stroke="#8d7dc0" stroke-width="2"/><text x="765" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#50467c">Professor</text><path d="M255 246V284" stroke="#8d7dc0" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="145" y="288" width="220" height="58" rx="12" fill="#fff1e6" stroke="#cf8b60" stroke-width="2"/><text x="255" y="324" text-anchor="middle" font-size="18" font-weight="700" fill="#8b5738">ResearchStudent</text><rect x="400" y="398" width="220" height="58" rx="12" fill="#eaf2f8" stroke="#82a7c1" stroke-width="2"/><text x="510" y="434" text-anchor="middle" font-size="19" font-weight="700" fill="#3e6580">Course</text>
<path d="M255 246C255 365 330 425 392 425" fill="none" stroke="#278b80" stroke-width="3" marker-end="url(#a3)"/><text x="310" y="374" font-size="15" fill="#24766f">enrolledIn</text><text x="310" y="394" font-size="12" fill="#68827e">domain: Student · range: Course</text><path d="M255 246C255 375 600 375 655 246" fill="none" stroke="#c67c53" stroke-width="3" marker-end="url(#a3)"/><text x="500" y="350" text-anchor="middle" font-size="15" fill="#a56745">advisedBy</text><text x="500" y="370" text-anchor="middle" font-size="12" fill="#8c786b">domain: Student · range: Professor</text>
<rect x="40" y="390" width="270" height="76" rx="12" fill="#fff" stroke="#d9e5df"/><text x="175" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#365c56">Data Property</text><text x="175" y="444" text-anchor="middle" font-size="13" fill="#69827c">hasStudentNumber : Student → String</text><rect x="710" y="390" width="270" height="76" rx="12" fill="#fff" stroke="#d9e5df"/><text x="845" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#365c56">Data Property</text><text x="845" y="444" text-anchor="middle" font-size="13" fill="#69827c">hasCredits : Course → Integer</text><text x="510" y="495" text-anchor="middle" font-size="13" fill="#718984">Schema 描述类别和关系语义；Alice、CS101 等具体对象属于实例层。</text></svg>