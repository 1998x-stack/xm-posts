<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title desc"><title id="title">RDF 三元组数据模型</title><desc id="desc">一个 RDF 三元组由主语、谓词和宾语组成。示例是 Alice enrolledIn CS101。</desc><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#27877d"/></marker></defs><text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#294c4b">RDF Triple = Subject + Predicate + Object</text>
<rect x="70" y="112" width="220" height="88" rx="15" fill="#e8f3ed" stroke="#4c9b85" stroke-width="2.5"/><text x="180" y="148" text-anchor="middle" font-size="14" fill="#5b7d70">Subject / 主语</text><text x="180" y="178" text-anchor="middle" font-size="23" font-weight="700" fill="#28594f">ex:alice</text><rect x="380" y="112" width="220" height="88" rx="15" fill="#f1edfb" stroke="#8b7cc0" stroke-width="2.5"/><text x="490" y="148" text-anchor="middle" font-size="14" fill="#73679c">Predicate / 谓词</text><text x="490" y="178" text-anchor="middle" font-size="23" font-weight="700" fill="#51467d">ex:enrolledIn</text><rect x="690" y="112" width="220" height="88" rx="15" fill="#fff1e7" stroke="#ce8a60" stroke-width="2.5"/><text x="800" y="148" text-anchor="middle" font-size="14" fill="#a37556">Object / 宾语</text><text x="800" y="178" text-anchor="middle" font-size="23" font-weight="700" fill="#89563b">ex:cs101</text><path d="M290 156H370M600 156H680" stroke="#27877d" stroke-width="3" marker-end="url(#a4)"/><text x="490" y="244" text-anchor="middle" font-size="17" fill="#3e6660">Alice 选修了课程 CS101</text><text x="490" y="272" text-anchor="middle" font-size="13" fill="#718984">IRI 标识资源 · Literal 表示值 · Blank Node 表示匿名资源</text></svg>