<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">闭世界假设与开放世界假设</title><desc id="desc">闭世界系统在数据中找不到导师关系时，通常按不存在处理；开放世界本体系统将缺失关系视为未知，除非明确声明否定。</desc><rect x="24" y="20" width="440" height="350" rx="18" fill="#eef4f1" stroke="#9ab9ac" stroke-width="2"/><rect x="496" y="20" width="440" height="350" rx="18" fill="#f3f0fb" stroke="#b7aadf" stroke-width="2"/><text x="244" y="62" text-anchor="middle" font-size="23" font-weight="700" fill="#28594f">Closed World</text><text x="716" y="62" text-anchor="middle" font-size="23" font-weight="700" fill="#51467d">Open World</text>
<rect x="100" y="98" width="288" height="58" rx="11" fill="#fff" stroke="#8eaaa0"/><text x="244" y="133" text-anchor="middle" font-size="17" fill="#365d53">数据库没有 hasAdvisor 记录</text><path d="M244 156V208" stroke="#6e9184" stroke-width="2.5"/><rect x="90" y="210" width="308" height="74" rx="12" fill="#f8e9e3" stroke="#c98361" stroke-width="2"/><text x="244" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#8d4d34">按查询约定视为不存在</text><text x="244" y="265" text-anchor="middle" font-size="13" fill="#9b705c">“没有查到” → false（闭世界语境）</text>
<rect x="572" y="98" width="288" height="58" rx="11" fill="#fff" stroke="#a99bcf"/><text x="716" y="133" text-anchor="middle" font-size="17" fill="#51467d">知识图谱没有 hasAdvisor 事实</text><path d="M716 156V208" stroke="#8a7eb7" stroke-width="2.5"/><rect x="562" y="210" width="308" height="74" rx="12" fill="#e8e2f8" stroke="#8d7cc2" stroke-width="2"/><text x="716" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#51467d">仍然未知</text><text x="716" y="265" text-anchor="middle" font-size="13" fill="#786e9f">“没有记录” ≠ false（开放世界）</text><text x="480" y="330" text-anchor="middle" font-size="14" fill="#6c807a">若要表达明确否定，必须使用明确的否定信息或约束机制。</text></svg>