<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="570" viewBox="0 0 1020 570" role="img" aria-labelledby="title desc"><title id="title">Ontology Development 101 七步迭代生命周期</title><desc id="desc">从定义领域和范围、复用已有本体、枚举术语、定义类层级、定义属性、定义约束和公理、创建实例与评估维护，形成持续迭代循环。</desc><defs><marker id="a6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#6f8d83"/></marker></defs><text x="510" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#294d4d">Ontology Development · Iterative Lifecycle</text>
<g font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" text-anchor="middle"><rect x="355" y="68" width="310" height="56" rx="12" fill="#e6f2eb" stroke="#5a9b83" stroke-width="2"/><text x="510" y="102" fill="#28594f">1 · 确定领域与能力问题</text><rect x="355" y="150" width="310" height="56" rx="12" fill="#eaf2f7" stroke="#83a8c1" stroke-width="2"/><text x="510" y="184" fill="#3c637e">2 · 复用已有本体与词汇</text><rect x="355" y="232" width="310" height="56" rx="12" fill="#f1edfb" stroke="#9485c6" stroke-width="2"/><text x="510" y="266" fill="#51467d">3 · 枚举关键术语</text><rect x="355" y="314" width="310" height="56" rx="12" fill="#fff2e8" stroke="#d29a70" stroke-width="2"/><text x="510" y="348" fill="#895638">4 · 定义类与层级</text><rect x="355" y="396" width="310" height="56" rx="12" fill="#eaf4f1" stroke="#65a194" stroke-width="2"/><text x="510" y="430" fill="#2b655d">5 · 定义对象与数据属性</text><rect x="355" y="478" width="310" height="56" rx="12" fill="#f5f0e3" stroke="#c5a25c" stroke-width="2"/><text x="510" y="512" fill="#81632b">6–7 · 公理、实例、评估与维护</text></g>
