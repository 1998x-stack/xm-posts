<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc"><title id="title">LLM 辅助本体工程的人机协同工作流</title><desc id="desc">领域文档和专家需求输入到 LLM，生成候选术语、公理和映射，再由语法验证、推理器、SHACL 和能力问题测试进行检查，最终由专家批准并版本化。</desc><defs><marker id="a7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#728c85"/></marker></defs><text x="520" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#294d4d">LLM-assisted Ontology Engineering</text>
<rect x="30" y="105" width="190" height="110" rx="14" fill="#eaf3ed" stroke="#67a18a" stroke-width="2"/><text x="125" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#28594f">领域资料</text><text x="125" y="174" text-anchor="middle" font-size="13" fill="#5b7d70">文档 · 数据库</text><text x="125" y="195" text-anchor="middle" font-size="13" fill="#5b7d70">标准 · 专家规则</text><path d="M220 160H260" stroke="#728c85" stroke-width="2.5" marker-end="url(#a7)"/>
<rect x="270" y="105" width="190" height="110" rx="14" fill="#f1edfb" stroke="#9484c7" stroke-width="2"/><text x="365" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#51467d">LLM 提案</text><text x="365" y="174" text-anchor="middle" font-size="13" fill="#746b9a">术语 · CQ · 公理</text><text x="365" y="195" text-anchor="middle" font-size="13" fill="#746b9a">映射 · 文档草案</text><path d="M460 160H500" stroke="#728c85" stroke-width="2.5" marker-end="url(#a7)"/>
<rect x="510" y="105" width="190" height="110" rx="14" fill="#eaf2f8" stroke="#83a9c3" stroke-width="2"/><text x="605" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#3e6580">形式化候选</text><text x="605" y="174" text-anchor="middle" font-size="13" fill="#5c7f98">RDF / OWL</text><text x="605" y="195" text-anchor="middle" font-size="13" fill="#5c7f98">Schema / Instances</text><path d="M700 160H740" stroke="#728c85" stroke-width="2.5" marker-end="url(#a7)"/>
<rect x="750" y="85" width="250" height="150" rx="14" fill="#fff2e8" stroke="#d09a70" stroke-width="2"/><text x="875" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#895638">自动化验证</text><text x="875" y="151" text-anchor="middle" font-size="13" fill="#956b4c">语法 · Reasoner</text><text x="875" y="175" text-anchor="middle" font-size="13" fill="#956b4c">SHACL · SPARQL CQ</text><text x="875" y="199" text-anchor="middle" font-size="13" fill="#956b4c">回归测试</text><path d="M875 235V295" stroke="#728c85" stroke-width="2.5" marker-end="url(#a7)"/>
<rect x="650" y="305" width="350" height="88" rx="14" fill="#e7f2ec" stroke="#68a18b" stroke-width="2"/><text x="825" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#28594f">领域专家审查与批准</text><text x="825" y="368" text-anchor="middle" font-size="13" fill="#5b7d70">语义正确性 · 风险决策 · 版本发布</text><path d="M650 350H590V265H365V225" fill="none" stroke="#c47b52" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a7)"/><text x="477" y="251" text-anchor="middle" font-size="12" fill="#a06e49">修订反馈</text><text x="520" y="452" text-anchor="middle" font-size="14" fill="#70867f">LLM 提供候选；标准工具负责形式检查；专家负责领域语义批准。</text></svg>