<rect x="251" y="235" width="180" height="60" rx="13" fill="#fff0e4" stroke="#ba754c" stroke-width="2"/><text x="341" y="270.94" text-anchor="middle" fill="#21484a" font-size="18" font-weight="600">遗漏条件</text><rect x="488" y="235" width="180" height="60" rx="13" fill="#fff0e4" stroke="#ba754c" stroke-width="2"/><text x="578" y="270.94" text-anchor="middle" fill="#21484a" font-size="18" font-weight="600">错误计算</text><rect x="713" y="235" width="146" height="60" rx="13" fill="#fff0e4" stroke="#ba754c" stroke-width="2"/><text x="786" y="270.94" text-anchor="middle" fill="#21484a" font-size="18" font-weight="600">错误答案</text>
