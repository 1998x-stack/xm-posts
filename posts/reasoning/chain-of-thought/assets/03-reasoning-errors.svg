<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" role="img" aria-labelledby="cot-fig3-title cot-fig3-desc"><title id="cot-fig3-title">复杂任务通过中间状态拆解</title><desc id="cot-fig3-desc">错误中间计算会传播；正确链路把语义拆解、算术运算和最终输出分离。</desc><rect width="900" height="375" rx="16" fill="#fbfcfa"/>
<text x="450" y="46" text-anchor="middle" font-size="22" fill="#26575e">ONE WRONG INTERMEDIATE STEP CAN PROPAGATE</text>
