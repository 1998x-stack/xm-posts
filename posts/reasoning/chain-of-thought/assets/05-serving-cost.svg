<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="cot-fig5-title cot-fig5-desc"><title id="cot-fig5-title">推理成本与内容质量权衡</title><desc id="cot-fig5-desc">更长的推理输出带来输出 token 成本，同时部分任务能获益；必须用验证决定是否采用。</desc><rect width="900" height="370" rx="16" fill="#fbfcfa"/>
<text x="450" y="44" text-anchor="middle" font-size="24" fill="#24525a">REASONING TOKENS ARE NOT FREE</text>
<rect x="45" y="91" width="350" height="72" rx="13" fill="#eaf1fa" stroke="#7894af" stroke-width="2"/><text x="220" y="132.94" text-anchor="middle" fill="#21484a" font-size="18" font-weight="600">直接答案：少量 token</text><rect x="500" y="91" width="350" height="72" rx="13" fill="#e6f3ec" stroke="#32847b" stroke-width="2"/><text x="675" y="132.94" text-anchor="middle" fill="#21484a" font-size="18" font-weight="600">多步过程：更多 token</text>
<path d="M220 163 L220 215" fill="none" stroke="#557e7b" stroke-width="3" stroke-linecap="round"/><path d="M675 163 L675 215" fill="none" stroke="#557e7b" stroke-width="3" stroke-linecap="round"/>
<rect x="45" y="216" width="350" height="80" rx="13" fill="#edf2fa" stroke="#7894af" stroke-width="2"/><text x="220" y="261.94" text-anchor="middle" fill="#21484a" font-size="18" font-weight="600">低输出延迟与成本</text><rect x="500" y="216" width="350" height="80" rx="13" fill="#e6f3ec" stroke="#32847b" stroke-width="2"/><text x="675" y="261.94" text-anchor="middle" fill="#21484a" font-size="18" font-weight="600">可逐步检查，但有额外生成成本</text>
<text x="450" y="346" text-anchor="middle" font-size="18" fill="#3a595d">是否使用 CoT，取决于任务难度、准确率、token 预算与可验证性。</text>
</svg>