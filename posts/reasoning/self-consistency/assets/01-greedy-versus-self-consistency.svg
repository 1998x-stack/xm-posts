/text><text x="573" y="242" fill="#157c75" font-size="17" text-anchor="middle" font-weight="600">答案 10</text><rect x="638" y="188" width="104" height="70" rx="12" fill="#fae9df" stroke="#bc704c" stroke-width="2"/><text x="690" y="217" fill="#253e45" font-size="16" text-anchor="middle" font-weight="600">路径 B</text><text x="690" y="242" fill="#bc704c" font-size="17" text-anchor="middle" font-weight="600">答案 13</text><rect x="758" y="188" width="104" height="70" rx="12" fill="#e1f1ed" stroke="#157c75" stroke-width="2"/><text x="810" y="217" fill="#253e45" font-size="16" text-anchor="middle" font-weight="600">路径 C</text><text x="810" y="242" fill="#157c75" font-size="17" text-anchor="middle" font-weight="600">答案 10</text><path d="M573 259 L692 283" stroke="#157c75" stroke-width="2" fill="none"/><path d="M690 259 L692 283" stroke="#bc704c" stroke-width="2" fill="none"/><path d="M810 259 L692 283" stroke="#157c75" stroke-width="2" fill="none"/><rect x="584" y="284" width="210" height="47" rx="12" fill="#e1f1ed" stroke="#157c75" stroke-width="2"/><text x="689" y="314" fill="#157c75" font-size="21" text-anchor="middle" font-weight="600">投票结果：10</text><text x="218" y="313" fill="#bc704c" font-size="16" text-anchor="middle" font-weight="600">一次失误即可影响最终答案</text></svg>