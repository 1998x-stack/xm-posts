<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 328" width="900" height="328" role="img" aria-labelledby="sc02-title sc02-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="sc02-title">多条思考路径的教育示例</title><desc id="sc02-desc">仓库原有8箱，卖出3箱又补进5箱，顺序计算和净变化均为10，错把卖出视为增加得到16。</desc><rect width="900" height="328" rx="16" fill="#fbfdfb"/><rect x="75" y="25" width="750" height="70" rx="12" fill="#edf4f1" stroke="#cfdeda" stroke-width="2"/><text x="450" y="56" fill="#253e45" font-size="21" text-anchor="middle" font-weight="600">原有 8 箱，卖出 3 箱，又补进 5 箱。现在多少箱？</text><text x="450" y="83" fill="#627779" font-size="14" text-anchor="middle" font-weight="600">教学例子：数据与推理路径均非原论文样本</text><path d="M450 95 L167 147" stroke="#a9baba" stroke-width="2" fill="none"/><rect x="35" y="146" width="264" height="150" rx="12" fill="#e2f3ed" stroke="#157c75" stroke-width="2"/><text x="167" y="181" fill="#253e45" font-size="18" text-anchor="middle" font-weight="600">顺序计算</text><text x="167" y="230" fill="#253e45" font-size="15" text-anchor="middle" font-weight="600">8 − 3 = 5；5 + 5 = 10</text><text x="167" y="276" fill="#157c75" font-size="20" text-anchor="middle" font-weight="600">答案 10</text><path d="M450 95 L462 147" stroke="#a9baba" stroke-width="2" fill="none"/><rect x="330" y="146" width="264" height="150" rx="12" fill="#e2f3ed" stroke="#157c75" stroke-width="2"/><text x="462" y="181" fill="#253e45" font-size="18" text-anchor="middle" font-weight="600">净变化法</text><text x="462" y="230" fill="#253e45" font-size="15" text-anchor="middle" font-weight="600">−3 + 5 = +2；8 + 2 = 10</text><text x="462" y="276" fill="#157c75" font-size="20" text-anchor="middle" font-weight="600">答案 10</text><path d="M450 95 L757 147" stroke="#a9baba" stroke-width="2" fill="none"/><rect x="625" y="146" width="264" height="150" rx="12" fill="#fae9df" stroke="#bc704c" stroke-width="2"/><text x="757" y="181" fill="#253e45" font-size="18" text-anchor="middle" font-weight="600">误读事件</text><text x="757" y="230" fill="#253e45" font-size="15" text-anchor="middle" font-weight="600">8 + 3 + 5 = 16</text><text x="757" y="276" fill="#bc704c" font-size="20" text-anchor="middle" font-weight="600">答案 16</text></svg>