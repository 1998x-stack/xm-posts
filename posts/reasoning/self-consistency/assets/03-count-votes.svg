<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-labelledby="sc03-title sc03-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="sc03-title">按最终答案聚合五条路径</title><desc id="sc03-desc">答案10三票，答案13与16各一票。条形显示计数，不是概率校准。</desc><rect width="900" height="392" rx="16" fill="#fbfdfb"/><text x="51" y="45" fill="#253e45" font-size="22" text-anchor="start" font-weight="600">把不同的推理文本映射到可比较的最终答案</text><text x="52" y="113" fill="#253e45" font-size="19" text-anchor="start" font-weight="600">答案 10</text><rect x="182" y="83" width="538" height="43" rx="12" fill="#ecf1ee" stroke="#ecf1ee" stroke-width="2"/><rect x="182" y="83" width="528" height="43" rx="12" fill="#157c75" stroke="#157c75" stroke-width="2"/><text x="744" y="113" fill="#157c75" font-size="18" text-anchor="start" font-weight="600">3 / 5 票</text><text x="52" y="191" fill="#253e45" font-size="19" text-anchor="start" font-weight="600">答案 13</text><rect x="182" y="161" width="538" height="43" rx="12" fill="#ecf1ee" stroke="#ecf1ee" stroke-width="2"/><rect x="182" y="161" width="176" height="43" rx="12" fill="#bc704c" stroke="#bc704c" stroke-width="2"/><text x="744" y="191" fill="#bc704c" font-size="18" text-anchor="start" font-weight="600">1 / 5 票</text><text x="52" y="269" fill="#253e45" font-size="19" text-anchor="start" font-weight="600">答案 16</text><rect x="182" y="239" width="538" height="43" rx="12" fill="#ecf1ee" stroke="#ecf1ee" stroke-width="2"/><rect x="182" y="239" width="176" height="43" rx="12" fill="#bc704c" stroke="#bc704c" stroke-width="2"/><text x="744" y="269" fill="#bc704c" font-size="18" text-anchor="start" font-weight="600">1 / 5 票</text><rect x="52" y="322" width="796" height="49" rx="12" fill="#e2f3ed" stroke="#157c75" stroke-width="2"/><text x="450" y="353" fill="#157c75" font-size="17" text-anchor="middle" font-weight="600">多数投票选择 10，但投票并不能验证步骤一定正确</text></svg>