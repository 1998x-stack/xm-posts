<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" width="900" height="345" role="img" aria-labelledby="sc04-title sc04-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="sc04-title">束搜索与随机采样的多样性</title><desc id="sc04-desc">束搜索输出高度类似的多个高分前缀，采样能探索不同路径，真实模型的分布不一定如此。</desc><rect width="900" height="345" rx="16" fill="#fbfdfb"/><text x="214" y="43" fill="#253e45" font-size="23" text-anchor="middle" font-weight="600">Beam search</text><text x="682" y="43" fill="#253e45" font-size="23" text-anchor="middle" font-weight="600">Stochastic sampling</text><rect x="140" y="68" width="148" height="54" rx="12" fill="#ece8fa" stroke="#675baf" stroke-width="2"/><rect x="608" y="68" width="148" height="54" rx="12" fill="#ece8fa" stroke="#675baf" stroke-width="2"/><text x="214" y="102" fill="#675baf" font-size="18" text-anchor="middle" font-weight="600">同一提示</text><text x="682" y="102" fill="#675baf" font-size="18" text-anchor="middle" font-weight="600">同一提示</text><path d="M214 122 L146 192" stroke="#bc704c" stroke-width="2" fill="none"/><path d="M214 122 L214 192" stroke="#bc704c" stroke-width="2" fill="none"/><path d="M214 122 L282 192" stroke="#bc704c" stroke-width="2" fill="none"/><path d="M682 122 L548 192" stroke="#157c75" stroke-width="2" fill="none"/><path d="M682 122 L684 192" stroke="#157c75" stroke-width="2" fill="none"/><path d="M682 122 L817 192" stroke="#157c75" stroke-width="2" fill="none"/><rect x="95" y="192" width="103" height="64" rx="12" fill="#fae9df" stroke="#bc704c" stroke-width="2"/><text x="146" y="231" fill="#bc704c" font-size="17" text-anchor="middle" font-weight="600">同类 1</text><rect x="163" y="192" width="103" height="64" rx="12" fill="#fae9df" stroke="#bc704c" stroke-width="2"/><text x="214" y="231" fill="#bc704c" font-size="17" text-anchor="middle" font-weight="600">同类 2</text><rect x="231" y="192" width="103" height="64" rx="12" fill="#fae9df" stroke="#bc704c" stroke-width="2"/><text x="282" y="231" fill="#bc704c" font-size="17" text-anchor="middle" font-weight="600">同类 3</text><rect x="496" y="192" width="104" height="64" rx="12" fill="#e2f3ed" stroke="#157c75" stroke-width="2"/><text x="548" y="231" fill="#157c75" font-size="17" text-anchor="middle" font-weight="600">方向 A</text><rect x="632" y="192" width="104" height="64" rx="12" fill="#e2f3ed" stroke="#157c75" stroke-width="2"/><text x="684" y="231" fill="#157c75" font-size="17" text-anchor="middle" font-weight="600">方向 B</text><rect x="765" y="192" width="104" height="64" rx="12" fill="#e2f3ed" stroke="#157c75" stroke-width="2"/><text x="817" y="231" fill="#157c75" font-size="17" text-anchor="middle" font-weight="600">方向 C</text><text x="214" y="315" fill="#bc704c" font-size="18" text-anchor="middle" font-weight="600">高概率前缀可能趋同</text><text x="682" y="315" fill="#157c75" font-size="18" text-anchor="middle" font-weight="600">不同路径产生答案多样性</text></svg>