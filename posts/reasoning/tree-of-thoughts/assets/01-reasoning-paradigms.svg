<g transform="translate(738 18)"><rect width="204" height="374" rx="14" fill="#edf6f1" stroke="#83b4a5" stroke-width="1.5"/><text x="102" y="34" text-anchor="middle" font-size="19" font-weight="700">ToT：思维树</text><rect x="38" y="62" width="128" height="40" rx="9" fill="#e4edf5" stroke="#7594ae"/><text x="102" y="88" text-anchor="middle" font-size="15">输入问题</text><path d="M102 102 L38 150 M102 102 L102 150 M102 102 L166 150" stroke="#547c79" stroke-width="2.5" fill="none"/><g fill="#dff0e8" stroke="#39877c"><rect x="4" y="152" width="68" height="42" rx="8"/><rect x="68" y="152" width="68" height="42" rx="8"/><rect x="132" y="152" width="68" height="42" rx="8"/></g><g font-size="14" text-anchor="middle"><text x="38" y="178">状态 A</text><text x="102" y="178">状态 B</text><text x="166" y="178">状态 C</text></g><path d="M38 194 L38 230 M102 194 L102 230" stroke="#547c79" stroke-width="2.5"/><rect x="4" y="232" width="68" height="40" rx="8" fill="#cce8dc" stroke="#39877c"/><rect x="68" y="232" width="68" height="40" rx="8" fill="#fff0e8" stroke="#c17b57"/><text x="38" y="257" font-size="14" text-anchor="middle">继续</text><text x="102" y="257" font-size="14" text-anchor="middle">剪枝</text><rect x="28" y="303" width="148" height="38" rx="9" fill="#fff4d9" stroke="#c49a43"/><text x="102" y="328" font-size="15" text-anchor="middle">评估 · 选择 · 回溯</text><text x="102" y="365" text-anchor="middle" font-size="13" fill="#52716e">中途控制搜索方向</text></g>
