<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="tot-paradigms-title tot-paradigms-desc">
<title id="tot-paradigms-title">四种大语言模型推理组织方式</title>
<desc id="tot-paradigms-desc">输入输出直接映射、单条思维链、多条完整思维链投票，以及在中间状态分支和评估的思维树。</desc>
<rect width="960" height="410" rx="18" fill="#fbfcfa"/>
<g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" fill="#203f46">
<g transform="translate(18 18)"><rect width="222" height="374" rx="14" fill="#f2f5f4" stroke="#d1ddda"/><text x="111" y="34" text-anchor="middle" font-size="19" font-weight="700">IO：直接映射</text><rect x="48" y="80" width="126" height="52" rx="10" fill="#e4edf5" stroke="#7594ae"/><text x="111" y="111" text-anchor="middle" font-size="17">输入问题</text><path d="M111 132 V218" stroke="#547c79" stroke-width="3" fill="none"/><path d="M103 208 L111 220 L119 208" fill="none" stroke="#547c79" stroke-width="3"/><rect x="48" y="222" width="126" height="52" rx="10" fill="#fff0e8" stroke="#c17b57"/><text x="111" y="253" text-anchor="middle" font-size="17">最终答案</text><text x="111" y="322" text-anchor="middle" font-size="14" fill="#657a7d">没有显式中间状态</text></g>
<g transform="translate(258 18)"><rect width="222" height="374" rx="14" fill="#f2f5f4" stroke="#d1ddda"/><text x="111" y="34" text-anchor="middle" font-size="19" font-weight="700">CoT：单条链</text><rect x="48" y="70" width="126" height="44" rx="9" fill="#e4edf5" stroke="#7594ae"/><text x="111" y="98" text-anchor="middle" font-size="16">输入问题</text><path d="M111 114 V143 M111 190 V215 M111 262 V287" stroke="#547c79" stroke-width="2.5"/><g fill="#e5f2ec" stroke="#39877c"><rect x="48" y="144" width="126" height="45" rx="9"/><rect x="48" y="216" width="126" height="45" rx="9"/></g><text x="111" y="173" text-anchor="middle" font-size="16">Thought 1</text><text x="111" y="245" text-anchor="middle" font-size="16">Thought 2</text><rect x="48" y="288" width="126" height="44" rx="9" fill="#fff0e8" stroke="#c17b57"/><text x="111" y="316" text-anchor="middle" font-size="16">答案</text><text x="111" y="360" text-anchor="middle" font-size="14" fill="#657a7d">中间步骤继续向前生成</text></g>
