<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="gl02-title gl02-desc">
<title id="gl02-title">共同评分建立用户邻域</title>
<desc id="gl02-desc">四位用户对若干文章进行评分。共同评分的列向量可用于比较用户偏好，目标文章的缺失单元格由已评分邻居提供信息。</desc>
