<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="gl03-title gl03-desc">
<title id="gl03-title">GroupLens 的开放式分布架构</title>
<desc id="gl03-desc">不同站点的新闻客户端连接本地新闻服务器并提交评分给 Better Bit Bureau。BBB 将评分打包成新闻文章，经由专用评分 newsgroup 在 Usenet 服务器间传播，再计算预测分数返回客户端。</desc>
<defs>
<marker id="gl03-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#25847b" stroke-width="1.6"/></marker>
<marker id="gl03-coral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#c27a55" stroke-width="1.6"/></marker>
</defs>
<rect x="8" y="8" width="944" height="454" rx="22" fill="#f7faf7"/>
<g font-family="Noto Sans CJK SC,system-ui,sans-serif">
<text x="42" y="48" font-size="14" font-weight="800" letter-spacing="2" fill="#8a715b">OPEN, DISTRIBUTED ARCHITECTURE</text>
<rect x="45" y="86" width="870" height="128" rx="16" fill="#edf3f1" stroke="#cbded5" stroke-width="1.5"/>
<text x="72" y="115" font-size="15" font-weight="750" fill="#416a67">Usenet news server network</text>
<g fill="#fff" stroke="#8db8a8" stroke-width="2">
<rect x="93" y="139" width="130" height="48" rx="10"/><rect x="306" y="139" width="130" height="48" rx="10"/><rect x="519" y="139" width="130" height="48" rx="10"/><rect x="732" y="139" width="130" height="48" rx="10"/>
</g>
<g fill="#2f6561" font-size="14" font-weight="700" text-anchor="middle"><text x="158" y="169">News Server A</text><text x="371" y="169">News Server B</text><text x="584" y="169">News Server C</text><text x="797" y="169">News Server D</text></g>
<g stroke="#4d7774" stroke-width="2.5" fill="none" marker-end="url(#gl03-teal)"><path d="M223 163H298"/><path d="M436 163H511"/><path d="M649 163H724"/></g>
<rect x="78" y="281" width="230" height="108" rx="14" fill="#e5f3ed" stroke="#8ab8a7" stroke-width="2"/>
<text x="193" y="312" text-anchor="middle" font-size="17" font-weight="750" fill="#236b65">News Clients</text>
<text x="193" y="339" text-anchor="middle" font-size="13" fill="#507a72">read · rate · display score</text>
<text x="193" y="365" text-anchor="middle" font-size="12" fill="#66887f">NewsWatcher / Gnus / NN</text>
<rect x="367" y="281" width="230" height="108" rx="14" fill="#fff0e5" stroke="#dba27b" stroke-width="2"/>
<text x="482" y="312" text-anchor="middle" font-size="17" font-weight="750" fill="#8b5839">Better Bit Bureau</text>
<text x="482" y="339" text-anchor="middle" font-size="13" fill="#946c55">collect · correlate · predict</text>
<text x="482" y="365" text-anchor="middle" font-size="12" fill="#9b7b65">rating server</text>
<rect x="656" y="281" width="230" height="108" rx="14" fill="#eae8f7" stroke="#aaa3d2" stroke-width="2"/>
<text x="771" y="312" text-anchor="middle" font-size="17" font-weight="750" fill="#514a86">Remote BBB</text>
<text x="771" y="339" text-anchor="middle" font-size="13" fill="#6b659d">alternative implementation</text>
<text x="771" y="365" text-anchor="middle" font-size="12" fill="#7c76a7">same open protocol</text>
<g stroke="#25847b" stroke-width="2.5" fill="none" marker-end="url(#gl03-teal)">
<path d="M193 281V228H482V273"/><path d="M482 281V224H158V214"/>
</g>
