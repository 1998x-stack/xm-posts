<path d="M482 281V245H584V214"/><path d="M771 281V231H797V214"/>
</g>
<path d="M597 335H648" stroke="#756db1" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gl03-teal)"/>
<path d="M367 375H316" stroke="#25847b" stroke-width="2.5" fill="none" marker-end="url(#gl03-teal)"/>
<text x="341" y="405" text-anchor="middle" font-size="11" fill="#5c7c77">prediction response</text>
<g font-size="12" fill="#5c7c77"><text x="245" y="238">predictions / ratings</text><text x="490" y="232">ratings article</text><text x="610" y="322">rating exchange</text></g>
<rect x="47" y="414" width="868" height="30" rx="8" fill="#fff" stroke="#dce8e1"/>
<text x="481" y="434" text-anchor="middle" font-size="13" fill="#547572">评分借用 Usenet 的传播网络；客户端不需要彼此直接连接，也不必接收全部原始评分。</text>
