<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="gl04-title gl04-desc">
<title id="gl04-title">评分数据的生命周期</title>
<desc id="gl04-desc">用户阅读文章后在客户端给出一到五分的评分。BBB 按会话批量打包评分记录，发布到专用 Usenet newsgroup，其他 BBB 收到后更新矩阵并计算预测，最后把分数返回客户端。</desc>
<defs><marker id="gl04-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#4d7774" stroke-width="1.5"/></marker></defs>
<rect x="8" y="8" width="944" height="344" rx="22" fill="#f7faf7"/>
<g font-family="Noto Sans CJK SC,system-ui,sans-serif" text-anchor="middle">
<rect x="35" y="95" width="150" height="132" rx="14" fill="#e4f3ec" stroke="#8ab8a7" stroke-width="2"/>
<text x="110" y="128" font-size="17" font-weight="750" fill="#236b65">Reader</text>
<text x="110" y="157" font-size="13" fill="#527b72">read article</text>
<g fill="#fff" stroke="#b6d6c7"><rect x="55" y="178" width="22" height="28" rx="5"/><rect x="81" y="178" width="22" height="28" rx="5"/><rect x="107" y="178" width="22" height="28" rx="5"/><rect x="133" y="178" width="22" height="28" rx="5"/></g>
<text x="110" y="197" font-size="11" fill="#24756c">1–5</text>
<rect x="230" y="95" width="150" height="132" rx="14" fill="#fff0e5" stroke="#dba27b" stroke-width="2"/>
<text x="305" y="128" font-size="17" font-weight="750" fill="#8b5839">News Client</text>
<text x="305" y="157" font-size="13" fill="#946c55">rating + pseudonym</text>
<text x="305" y="184" font-size="12" fill="#946c55">optional read seconds</text>
<rect x="425" y="95" width="150" height="132" rx="14" fill="#fff5dc" stroke="#d5b66d" stroke-width="2"/>
<text x="500" y="128" font-size="17" font-weight="750" fill="#80612c">Batch</text>
<text x="500" y="157" font-size="13" fill="#927843">session ratings</text>
<text x="500" y="184" font-size="12" fill="#927843">one ratings article</text>
<rect x="620" y="95" width="150" height="132" rx="14" fill="#e9e7f7" stroke="#aaa3d2" stroke-width="2"/>
<text x="695" y="128" font-size="17" font-weight="750" fill="#514a86">Usenet</text>
<text x="695" y="157" font-size="13" fill="#6b659d">ratings newsgroup</text>
<text x="695" y="184" font-size="12" fill="#7c76a7">server propagation</text>
<rect x="815" y="95" width="110" height="132" rx="14" fill="#e5f3ed" stroke="#8ab8a7" stroke-width="2"/>
<text x="870" y="128" font-size="17" font-weight="750" fill="#236b65">BBB</text>
<text x="870" y="157" font-size="13" fill="#527b72">update</text>
<text x="870" y="184" font-size="12" fill="#527b72">predict</text>
<g stroke="#4d7774" stroke-width="2.5" fill="none" marker-end="url(#gl04-arrow)"><path d="M185 161H222"/><path d="M380 161H417"/><path d="M575 161H612"/><path d="M770 161H807"/></g>
<path d="M870 227V277H110V235" stroke="#25847b" stroke-width="2.5" fill="none" marker-end="url(#gl04-arrow)"/>
<text x="490" y="305" font-size="14" fill="#3b7770">个性化预测分数返回客户端，供展示、排序或过滤</text>
