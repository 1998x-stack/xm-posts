<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="a3c-fig1-title a3c-fig1-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="a3c-fig1-title">轨迹相关性与并行探索</title><desc id="a3c-fig1-desc">单个 Actor 产生相邻相关的状态，多位独立 worker 各自探索不同环境，提供多样化在线更新。</desc><rect width="840" height="340" rx="20" fill="#f8fbf8"/><text x="35" y="39" font-size="20" fill="#995d40" font-weight="700" text-anchor="start">单条轨迹：相邻样本高度相关</text><text x="461" y="39" font-size="20" fill="#267d74" font-weight="700" text-anchor="start">多条轨迹：经验分布更丰富</text><rect x="23" y="62" width="390" height="244" rx="12" fill="#fff3ea" stroke="#efd7c4"/><rect x="427" y="62" width="390" height="244" rx="12" fill="#eaf5f0" stroke="#c7ded4"/><rect x="49" y="120" width="52" height="54" rx="8" fill="#f6d8c2" stroke="#dfab84"/><text x="75" y="151" font-size="16" fill="#985f3e" font-weight="700" text-anchor="middle">s1</text><path d="M101 147L119 147" stroke="#be815c" stroke-width="2" fill="none"/><rect x="119" y="120" width="52" height="54" rx="8" fill="#f6d8c2" stroke="#dfab84"/><text x="145" y="151" font-size="16" fill="#985f3e" font-weight="700" text-anchor="middle">s2</text><path d="M171 147L189 147" stroke="#be815c" stroke-width="2" fill="none"/><rect x="189" y="120" width="52" height="54" rx="8" fill="#f6d8c2" stroke="#dfab84"/><text x="215" y="151" font-size="16" fill="#985f3e" font-weight="700" text-anchor="middle">s3</text><path d="M241 147L259 147" stroke="#be815c" stroke-width="2" fill="none"/><rect x="259" y="120" width="52" height="54" rx="8" fill="#f6d8c2" stroke="#dfab84"/><text x="285" y="151" font-size="16" fill="#985f3e" font-weight="700" text-anchor="middle">s4</text><path d="M311 147L329 147" stroke="#be815c" stroke-width="2" fill="none"/><rect x="329" y="120" width="52" height="54" rx="8" fill="#efbe9e" stroke="#dfab84"/><text x="355" y="151" font-size="16" fill="#985f3e" font-weight="700" text-anchor="middle">s5</text><te