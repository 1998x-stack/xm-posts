<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="a3c-fig2-title a3c-fig2-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="a3c-fig2-title">共享参数和并行 Actor Learner</title><desc id="a3c-fig2-desc">三个 worker 各持一份局部模型与独立环境，周期性拉取共享参数、计算多步梯度，随后异步推送到共享模型。</desc><rect width="840" height="340" rx="20" fill="#f8fbf8"/><text x="30" y="38" font-size="21" fill="#255a58" font-weight="700" text-anchor="start">每个线程独立与环境交互，梯度异步写回共享参数</text><rect x="35" y="69" width="176" height="228" rx="12" fill="#e9f5f0" stroke="#b4d8cd"/><text x="123" y="99" font-size="18" fill="#28796e" font-weight="700" text-anchor="middle">共享模型 θ, θv</text><text x="123" y="133" font-size="15" fill="#4b7770" font-weight="600" text-anchor="middle">全局权重</text><text x="123" y="166" font-size="16" fill="#8b5c48" font-weight="700" text-anchor="middle">Hogwild!-式</text><text x="123" y="190" font-size="15" fill="#8b5c48" font-weight="500" text-anchor="middle">非锁步更新</text><text x="123" y="250" font-size="14" fill="#687f79" font-weight="500" text-anchor="middle">注意：梯度可能陈旧</text><rect x="335" y="76" width="175" height="60" rx="12" fill="#fff" stroke="#bedad1"/><text x="353" y="100" font-size="17" fill="#2f6766" font-weight="700" text-anchor="start">Actor 1</text><text x="353" y="122" font-size="13" fill="#71847f" font-weight="500" text-anchor="start">Env A → n-step 采样</text><rect x="603" y="76" width="199" height="60" rx="12" fill="#f6ece6" stroke="#d9dcdf"/><text x="620" y="100" font-size="15" fill="#5d6473" font-weight="700" text-anchor="start">局部参数 θ′</text><text x="620" y="121" font-size="13" fill="#6d7380" font-weight="500" text-anchor="start">计算策略/价值梯度</text><path d="M211 113L335 102" stroke="#6faba0" stroke-width="2" fill="none" stroke-dasharray="5 5"/><path d="M510 105L603 105" stroke="#377e7a" stroke-width="2" fill="none"/><path d="M603 130 Q 565 156 264 135 L212 118" fill="none" stroke="#ca7c54" stroke-width="2" stroke-dasharray="6 4"/><rect x="335" y="157" width="175" height="60" rx="12" fill="#fff" stroke="#bedad1"/><text x="353" y="181" font-size="17" fill="#2f6766" font-weight="700" text-anchor="start">Actor 2</text><text x="353" y="203" font-size="13" fill="#71847f" font-weight="500" text-anchor="start">Env B → n-step 采样</text><rect x="603" y="157" width="199" height="60" rx="12" fill="#eef3fa" stroke="#d9dcdf"/><text x="620" y="181" font-size="15" fill="#5d6473" font-weight="700" text-anchor="start">局部参数 θ′</text><text x="620" y="202" font-size="13" fill="#6d7380" font-weight="500" text-anchor="start">计算策略/价值梯度</text><path d="M211 172L335 183" stroke="#6faba0" stroke-width="2" fill="none" stroke-dasharray="5 5"/><path d="M510 186L603 186" stroke="#377e7a" stroke-width="2" fill="none"/><path d="M603 211 Q 565 237 264 216 L212 199" fill="none" stroke="#ca7c54" stroke-width="2" stroke-dasharray="6 4"/><rect x="335" y="238" width="175" height="60" rx="12" fill="#fff" stroke="#bedad1"/><text x="353" y="262" font-size="17" fill="#2f6766" font-weight="700" text-anchor="start">Actor 3</text><text x="353" y="284" font-size="13" fill="#71847f" font-weight="500" text-anchor="start">Env C → n-step 采样</text><rect x="603" y="238" width="199" height="60" rx="12" fill="#f4edf8" stroke="#d9dcdf"/><text x="620" y="262" font-size="15" fill="#5d6473" font-weight="700" text-anchor="start">局部参数 θ′</text><text x="620" y="283" font-size="13" fill="#6d7380" font-weight="500" text-anchor="start">计算策略/价值梯度</text><path d="M211 231L335 264" stroke="#6faba0" stroke-width="2" fill="none" stroke-dasharray="5 5"/><path d="M510 267L603 267" stroke="#377e7a" stroke-width="2" fill="none"/><path d="M603 292 Q 565 318 264 297 L212 280" fill="none" stroke="#ca7c54" stroke-width="2" stroke-dasharray="6 4"/><text x="419" y="329" font-size="13" fill="#69817a" font-weight="500" text-anchor="middle">实线：拉取权重 / 采样     虚线：异步梯度回传</text></svg>
