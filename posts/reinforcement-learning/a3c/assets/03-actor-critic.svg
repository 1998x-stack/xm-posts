<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="a3c-fig3-title a3c-fig3-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="a3c-fig3-title">A3C Actor Critic 共享主干</title><desc id="a3c-fig3-desc">共享特征主干连接策略分布输出和状态价值输出。策略学习行动概率，价值学习多步回报基线。</desc><rect width="840" height="340" rx="20" fill="#f8fbf8"/><text x="29" y="41" font-size="21" fill="#285a59" font-weight="700" text-anchor="start">一段状态编码，分出两个互补的学习任务</text><rect x="37" y="102" width="152" height="110" rx="12" fill="#f4f7fb" stroke="#cad8e3"/><text x="113" y="139" font-size="24" fill="#3c6276" font-weight="750" text-anchor="middle">sₜ</text><text x="113" y="173" font-size="15" fill="#607c86" font-weight="500" text-anchor="middle">环境状态</text><rect x="260" y="95" width="176" height="126" rx="12" fill="#e8f4ee" stroke="#c2dccd"/><text x="348" y="145" font-size="20" fill="#26766a" font-weight="700" text-anchor="middle">共享特征</text><text x="348" y="178" font-size="16" fill="#648178" font-weight="500" text-anchor="middle">CNN / LSTM</text><path d="M189 158L260 158" stroke="#3b8882" stroke-width="3" fill="none"/><rect x="528" y="62" width="267" height="101" rx="12" fill="#e9f2fa" stroke="#bcd7e7"/><text x="661" y="96" font-size="19" fill="#376ea0" font-weight="700" text-anchor="middle">Actor · π(a|s)</text><text x="661" y="123" font-size="15" fill="#5485a8" font-weight="500" text-anchor="middle">策略梯度 + 熵奖励</text><rect x="528" y="191" width="267" height="101" rx="12" fill="#fbf1e8" stroke="#e9cfb8"/><text x="661" y="224" font-size="19" fill="#a26643" font-weight="700" text-anchor="middle">Critic · V(s)</text><text x="661" y="251" font-size="15" fill="#986f54" font-weight="500" text-anchor="middle">n-step 目标回归</text><path d="M436 140L528 112" stroke="#397ca4" stroke-width="3" fill="none"/><path d="M436 178L528 242" stroke="#b57951" stroke-width="3" fill="none"/><text x="400" y="312" font-size="15" fill="#597a74" font-weight="600" text-anchor="middle">两个头可共享非输出层；π 决定动作，V 提供基线</text></svg>
