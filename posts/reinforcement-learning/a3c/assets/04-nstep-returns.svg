<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="a3c-fig4-title a3c-fig4-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="a3c-fig4-title">三步回报与价值自举</title><desc id="a3c-fig4-desc">三个即时奖励按折扣相加，末端非终止时使用价值网络估计未来；真正终止时自举为零。</desc><rect width="840" height="340" rx="20" fill="#f8fbf8"/><text x="29" y="41" font-size="20" fill="#285b59" font-weight="700" text-anchor="start">把一次奖励沿轨迹向前传播，并用 Critic 引导后续估计</text><rect x="37" y="87" width="160" height="93" rx="12" fill="#fff" stroke="#bdd8cc"/><text x="117" y="117" font-size="17" fill="#52776e" font-weight="700" text-anchor="middle">t + 0</text><text x="117" y="146" font-size="19" fill="#b06e44" font-weight="700" text-anchor="middle">rₜ₊0</text><path d="M197 133L228 133" stroke="#3b8882" stroke-width="3" fill="none"/><rect x="228" y="87" width="160" height="93" rx="12" fill="#fff" stroke="#bdd8cc"/><text x="308" y="117" font-size="17" fill="#52776e" font-weight="700" text-anchor="middle">t + 1</text><text x="308" y="146" font-size="19" fill="#b06e44" font-weight="700" text-anchor="middle">rₜ₊1</text><path d="M388 133L419 133" stroke="#3b8882" stroke-width="3" fill="none"/><rect x="419" y="87" width="160" height="93" rx="12" fill="#fff" stroke="#bdd8cc"/><text x="499" y="117" font-size="17" fill="#52776e" font-weight="700" text-anchor="middle">t + 2</text><text x="499" y="146" font-size="19" fill="#b06e44" font-weight="700" text-anchor="middle">rₜ₊2</text><path d="M579 133L610 133" stroke="#3b8882" stroke-width="3" fill="none"/><rect x="610" y="87" width="160" height="93" rx="12" fill="#e1f2ec" stroke="#bdd8cc"/><text x="690" y="117" font-size="17" fill="#52776e" font-weight="700" text-anchor="middle">t + 3</text><text x="690" y="146" font-size="19" fill="#288476" font-weight="700" text-anchor="middle">V(sₜ₊₃)</text><text x="53" y="230" font-size="21" fill="#276d67" font-weight="700" text-anchor="start">Gₜ⁽³⁾ = rₜ + γrₜ₊₁ + γ²rₜ₊₂ + γ³V(sₜ₊₃)</text><rect x="41" y="254" width="755" height="56" rx="12" fill="#edf6f0" stroke="#d2e3d8"/><text x="64" y="286" font-size="16" fill="#4c7870" font-weight="600" text-anchor="start">若在 rollout 末端真正终止：bootstrap = 0；不是终止则使用 V(s)</text></svg>
