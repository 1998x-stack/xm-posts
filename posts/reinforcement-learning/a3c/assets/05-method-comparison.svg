<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="a3c-fig5-title a3c-fig5-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="a3c-fig5-title">DQN A3C A2C 方法边界</title><desc id="a3c-fig5-desc">DQN 依赖经验回放，原始 A3C 使用异步并行工作线程；后续 A2C 一般采用同步批处理。</desc><rect width="840" height="340" rx="20" fill="#f8fbf8"/><text x="30" y="39" font-size="20" fill="#285b59" font-weight="700" text-anchor="start">看清三个算法，避免把后续 A2C 当成原论文 A3C</text><rect x="22" y="83" width="260" height="187" rx="14" fill="#f8eee4" stroke="#d2ded9"/><text x="152" y="120" font-size="21" fill="#ac704e" font-weight="750" text-anchor="middle">DQN (2015)</text><path d="M43 136L261 136" stroke="#c7d8d3" stroke-width="1" fill="none"/><text x="152" y="173" font-size="16" fill="#476c69" font-weight="600" text-anchor="middle">经验回放 Replay</text><text x="152" y="210" font-size="15" fill="#637f79" font-weight="500" text-anchor="middle">off-policy Q 学习</text><rect x="300" y="83" width="260" height="187" rx="14" fill="#e6f4ed" stroke="#d2ded9"/><text x="430" y="120" font-size="21" fill="#267f72" font-weight="750" text-anchor="middle">A3C (2016)</text><path d="M321 136L539 136" stroke="#c7d8d3" stroke-width="1" fill="none"/><text x="430" y="173" font-size="16" fill="#476c69" font-weight="600" text-anchor="middle">并行 worker 异步更新</text><text x="430" y="210" font-size="15" fill="#637f79" font-weight="500" text-anchor="middle">on-policy Actor–Critic</text><rect x="578" y="83" width="260" height="187" rx="14" fill="#eef0fb" stroke="#d2ded9"/><text x="708" y="120" font-size="21" fill="#6b74a5" font-weight="750" text-anchor="middle">A2C (后续实现)</text><path d="M599 136L817 136" stroke="#c7d8d3" stroke-width="1" fill="none"/><text x="708" y="173" font-size="16" fill="#476c69" font-weight="600" text-anchor="middle">批量同步等待</text><text x="708" y="210" font-size="15" fill="#637f79" font-weight="500" text-anchor="middle">on-policy Actor–Critic</text><text x="421" y="314" font-size="16" fill="#5a7d72" font-weight="600" text-anchor="middle">A3C 的关键系统边界：不等所有 worker 汇合再更新参数</text></svg>
