<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-label="Selection 选择最大 Q 加探索奖励，Expansion 建立子节点，Evaluation 价值网络与 rollout 估计，Backup 回传统计"><title>AlphaGo 搜索四阶段</title><rect width="1000" height="290" rx="16" fill="#f7faf6"/><rect x="15" y="36" width="230" height="213" rx="12" fill="#fff" stroke="#21857b" stroke-width="1.6"/><text x="43" y="77" font-family="Arial, sans-serif" font-size="20" fill="#21857b" font-weight="700" text-anchor="middle">01</text><text x="133" y="104" font-family="Arial, sans-serif" font-size="23" fill="#294c4d" font-weight="700" text-anchor="middle">Selection</text><path d="M77 135 L176 135" stroke="#21857b" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="77" cy="135" r="10" fill="#21857b"/><circle cx="129" cy="162" r="10" fill="#21857b"/><circle cx="176" cy="135" r="10" fill="#21857b"/><text x="130" y="208" font-family="Arial, sans-serif" font-size="17" fill="#21857b" font-weight="700" text-anchor="middle">Q + u(P)</text><text x="130" y="231" font-family="Arial, sans-serif" font-size="13" fill="#617b79" font-weight="500" text-anchor="middle">沿树选边</text><rect x="264" y="36" width="230" height="213" rx="12" fill="#fff" stroke="#cf7a45" stroke-width="1.6"/><text x="292" y="77" font-family="Arial, sans-serif" font-size="20" fill="#cf7a45" font-weight="700" text-anchor="middle">02</text><text x="382" y="104" font-family="Arial, sans-serif" font-size="23" fill="#294c4d" font-weight="700" text-anchor="middle">Expansion</text><path d="M326 135 L425 135" stroke="#cf7a45" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="326" cy="135" r="10" fill="#cf7a45"/><circle cx="378" cy="162" r="10" fill="#cf7a45"/><circle cx="425" cy="135" r="10" fill="#cf7a45"/><text x="379" y="208" font-family="Arial, sans-serif" font-size="17" fill="#cf7a45" font-weight="700" text-anchor="middle">P ← pσ</text><text x="379" y="231" font-family="Arial, sans-serif" font-size="13" fill="#617b79" font-weight="500" text-anchor="middle">扩展与入队</text><rect x="513" y="36" width="230" height="213" rx="12" fill="#fff" stroke="#7566a1" stroke-width="1.6"/><text x="541" y="77" font-family="Arial, sans-serif" font-size="20" fill="#7566a1" font-weight="700" text-anchor="middle">03</text><text x="631" y="104" font-family="Arial, sans-serif" font-size="23" fill="#294c4d" font-weight="700" text-anchor="middle">Evaluation</text><path d="M575 135 L674 135" stroke="#7566a1" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="575" cy="135" r="10" fill="#7566a1"/><circle cx="627" cy="162" r="10" fill="#7566a1"/><circle cx="674" cy="135" r="10" fill="#7566a1"/><text x="628" y="208" font-family="Arial, sans-serif" font-size="17" fill="#7566a1" font-weight="700" text-anchor="middle">vθ + rollout</text><text x="628" y="231" font-family="Arial, sans-serif" font-size="13" fill="#617b79" font-weight="500" text-anchor="middle">估计叶节点</text><rect x="762" y="36" width="230" height="213" rx="12" fill="#fff" stroke="#31565b" stroke-width="1.6"/><text x="790" y="77" font-family="Arial, sans-serif" font-size="20" fill="#31565b" font-weight="700" text-anchor="middle">04</text><text x="880" y="104" font-family="Arial, sans-serif" font-size="23" fill="#294c4d" font-weight="700" text-anchor="middle">Backup</text><path d="M824 135 L923 135" stroke="#31565b" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="824" cy="135" r="10" fill="#31565b"/><circle cx="876" cy="162" r="10" fill="#31565b"/><circle cx="923" cy="135" r="10" fill="#31565b"/><text x="877" y="208" font-family="Arial, sans-serif" font-size="17" fill="#31565b" font-weight="700" text-anchor="middle">Q ← mean</text><text x="877" y="231" font-family="Arial, sans-serif" font-size="13" fill="#617b79" font-weight="500" text-anchor="middle">向根回传</text><text x="500" y="278" font-family="Arial, sans-serif" font-size="15" fill="#536f70" font-weight="500" text-anchor="middle">一次模拟完成后，重复；最终按根节点访问次数选着</text></svg>
