<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-label="2016 Nature 报告的是 AlphaGo Fan，2016 AlphaGo Lee 击败李世石，2017 AlphaGo Zero 去掉人类棋谱监督和完整 rollout"><title>AlphaGo 家族的版本时间线</title><rect width="980" height="250" rx="16" fill="#f7faf6"/><path d="M95 99 L872 99" stroke="#b5cdc7" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="120" cy="99" r="13" fill="#21857b"/><text x="120" y="54" font-family="Arial, sans-serif" font-size="21" fill="#21857b" font-weight="700" text-anchor="middle">2016</text><text x="120" y="151" font-family="Arial, sans-serif" font-size="19" fill="#2d4e52" font-weight="700" text-anchor="middle">AlphaGo Fan</text><text x="120" y="179" font-family="Arial, sans-serif" font-size="14" fill="#607c7a" font-weight="500" text-anchor="middle">SL + RL + value + rollout</text><circle cx="489" cy="99" r="13" fill="#cf7a45"/><text x="489" y="54" font-family="Arial, sans-serif" font-size="21" fill="#cf7a45" font-weight="700" text-anchor="middle">2016</text><text x="489" y="151" font-family="Arial, sans-serif" font-size="19" fill="#2d4e52" font-weight="700" text-anchor="middle">AlphaGo Lee</text><text x="489" y="179" font-family="Arial, sans-serif" font-size="14" fill="#607c7a" font-weight="500" text-anchor="middle">对李世石 4–1</text><circle cx="855" cy="99" r="13" fill="#7566a1"/><text x="855" y="54" font-family="Arial, sans-serif" font-size="21" fill="#7566a1" font-weight="700" text-anchor="middle">2017</text><text x="855" y="151" font-family="Arial, sans-serif" font-size="19" fill="#2d4e52" font-weight="700" text-anchor="middle">AlphaGo Zero</text><text x="855" y="179" font-family="Arial, sans-serif" font-size="14" fill="#607c7a" font-weight="500" text-anchor="middle">不依赖人类棋谱</text><text x="490" y="231" font-family="Arial, sans-serif" font-size="16" fill="#4e7070" font-weight="500" text-anchor="middle">同一研究路线的不同系统；本文核心公式严格以 2016 Nature 版本为准</text></svg>
