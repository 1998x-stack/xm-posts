idth="3" stroke-linecap="round"/><rect x="861" y="287" width="164" height="44" rx="12" fill="#fff" stroke="#21877b" stroke-width="1.8"/><text x="943" y="314" font-size="17" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">仅 (sU+1, z)</text><text x="523" y="367" font-size="15" font-weight="600" fill="#5c7376" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">U ∼ Uniform[1,450]，样本来自不同对局；每盘保留一个局面标签</text></svg>
