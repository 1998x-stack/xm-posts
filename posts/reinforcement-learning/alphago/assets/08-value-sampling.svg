<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="每局先按监督策略走棋，随机插一步合法着法，再用 RL 策略走至终局，只提取一个 state outcome 训练对" viewBox="0 0 1050 377"><title>价值网络一局只采一个局面</title><desc>每局先按监督策略走棋，随机插一步合法着法，再用 RL 策略走至终局，只提取一个 state outcome 训练对</desc><rect width="1050" height="377" rx="18" fill="#f7faf7"/><text x="523" y="36" font-size="22" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">价值训练：降低相邻局面强相关</text><text x="31" y="121" font-size="17" font-weight="600" fill="#31565d" text-anchor="start" font-family="Arial, 'PingFang SC', sans-serif">独立对局 1</text><rect x="155" y="92" width="300" height="54" rx="12" fill="#def0e8" stroke="#21877b" stroke-width="1.8"/><rect x="456" y="92" width="80" height="54" rx="12" fill="#fbe7d7" stroke="#c87846" stroke-width="1.8"/><rect x="537" y="92" width="271" height="54" rx="12" fill="#eeeaf7" stroke="#7866a4" stroke-width="1.8"/><text x="305" y="124" font-size="18" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">前 U−1 步 pσ</text><text x="495" y="123" font-size="16" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">随机</text><text x="672" y="124" font-size="18" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">从 U+1 起 pρ</text><path d="M812 119 L849 119" fill="none" stroke="#7ca9a1" stroke-width="3" stroke-linecap="round"/><rect x="861" y="97" width="164" height="44" rx="12" fill="#fff" stroke="#21877b" stroke-width="1.8"/><text x="943" y="124" font-size="17" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">仅 (sU+1, z)</text><text x="31" y="216" font-size="17" font-weight="600" fill="#31565d" text-anchor="start" font-family="Arial, 'PingFang SC', sans-serif">独立对局 2</text><rect x="155" y="187" width="300" height="54" rx="12" fill="#def0e8" stroke="#21877b" stroke-width="1.8"/><rect x="456"