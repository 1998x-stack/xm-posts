<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="每个搜索边拥有 P、Q 和分别独立维护的 rollout 和 value 的访问次数与累计回报" viewBox="0 0 1050 327"><title>AlphaGo 搜索边的多流统计</title><desc>每个搜索边拥有 P、Q 和分别独立维护的 rollout 和 value 的访问次数与累计回报</desc><rect width="1050" height="327" rx="18" fill="#f7faf7"/><text x="525" y="41" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">一条树边不仅有一个 Q 值：两条回传流必须分别记账</text><rect x="33" y="104" width="180" height="143" rx="12" fill="#dff1ea" stroke="#21877b" stroke-width="1.8"/><text x="123" y="153" font-size="23" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">树边 (s,a)</text><text x="123" y="198" font-size="16" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">动作与局面</text><path d="M216 174 L265 174" fill="none" stroke="#7ca9a1" stroke-width="3" stroke-linecap="round"/><rect x="271" y="93" width="233" height="164" rx="12" fill="#fff" stroke="#21877b" stroke-width="1.8"/><text x="387" y="141" font-size="22" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">策略先验 P</text><text x="387" y="180" font-size="20" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Expansion</text><text x="387" y="215" font-size="16" font-weight="600" fill="#607878" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">预测偏好</text><rect x="526" y="93" width="233" height="164" rx="12" fill="#fff" stroke="#c87846" stroke-width="1.8"/><text x="642" y="141" font-size="22" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Nᵣ 与 Wᵣ</text><text x="642" y="180" font-size="20" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Rollout</text><text x="642" y="215" font-size="16" font-weight="600" fill="#607878" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">终局样本</text><rect x="781" y="93" width="233" height="164" rx="12" fill="#fff" stroke="#7866a4" stroke-width="1.8"/><text x="897" y="141" font-size="22" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Nᵥ 与 Wᵥ</text><text x="897" y="180" font-size="20" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Value</text><text x="897" y="215" font-size="16" font-weight="600" fill="#607878" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">网络估值</text><rect x="253" y="270" width="702" height="43" rx="12" fill="#eff5f1" stroke="#21877b" stroke-width="1.8"/><text x="604" y="297" font-size="18" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Q = (1−λ)Wᵥ/Nᵥ + λ Wᵣ/Nᵣ        Selection = Q + u(P)</text></svg>
