<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="沿着黑方、白方、黑方三个连续轮次向上回传，零和奖励逐层切换正负号" viewBox="0 0 1000 311"><title>零和博弈中结果视角交替</title><desc>沿着黑方、白方、黑方三个连续轮次向上回传，零和奖励逐层切换正负号</desc><rect width="1000" height="311" rx="18" fill="#f7faf7"/><text x="501" y="37" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">同一终局对不同轮到行动的一方有相反意义</text><rect x="20" y="87" width="305" height="150" rx="12" fill="#fff" stroke="#21877b" stroke-width="1.8"/><text x="172" y="142" font-size="22" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">根节点 · 黑方</text><text x="172" y="204" font-size="42" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">+1</text><rect x="346" y="87" width="305" height="150" rx="12" fill="#fff" stroke="#c87846" stroke-width="1.8"/><text x="498" y="142" font-size="22" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">子节点 · 白方</text><text x="498" y="204" font-size="42" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">−1</text><rect x="672" y="87" width="305" height="150" rx="12" fill="#fff" stroke="#7866a4" stroke-width="1.8"/><text x="824" y="142" font-size="22" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">叶节点 · 黑方</text><text x="824" y="204" font-size="42" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">+1</text><path d="M327 167 L347 167" fill="none" stroke="#7ca9a1" stroke-width="3" stroke-linecap="round"/><path d="M652 167 L673 167" fill="none" stroke="#7ca9a1" stroke-width="3" stroke-linecap="round"/><text x="500" y="287" font-size="16" font-weight="600" fill="#5b7477" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">从叶到根向上走；每经过一次行动方切换就交换收益符号</text></svg>
