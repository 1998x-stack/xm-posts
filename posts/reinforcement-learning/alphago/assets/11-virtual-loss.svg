<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="原始 rollout 边均值 4除以10；加虚拟损失 nvl等于3 后变成 1除以13；结果正一返回后变成 5除以11" viewBox="0 0 1000 322"><title>三阶段虚拟损失回滚</title><desc>原始 rollout 边均值 4除以10；加虚拟损失 nvl等于3 后变成 1除以13；结果正一返回后变成 5除以11</desc><rect width="1000" height="322" rx="18" fill="#f7faf7"/><text x="500" y="38" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程 1 占住一条边时，线程 2 应暂时更愿意探索别处</text><rect x="24" y="63" width="308" height="229" rx="12" fill="#fff" stroke="#21877b" stroke-width="1.8"/><text x="178" y="111" font-size="21" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">原始状态</text><text x="178" y="163" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Nᵣ=10，Wᵣ=4</text><text x="178" y="215" font-size="25" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Qᵣ=+0.400</text><text x="178" y="262" font-size="15" font-weight="600" fill="#60767a" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程 1 尚未出发</text><rect x="352" y="63" width="308" height="229" rx="12" fill="#fff" stroke="#c87846" stroke-width="1.8"/><text x="506" y="111" font-size="21" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">临时 nᵥₗ=3</text><text x="506" y="163" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Nᵣ=13，Wᵣ=1</text><text x="506" y="215" font-size="25" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Qᵣ=+0.077</text><text x="506" y="262" font-size="15" font-weight="600" fill="#60767a" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">暂时惩罚未完成的边</text><rect x="680" y="63" width="308" height="229" rx="12" fill="#fff" stroke="#7866a4" stroke-width="1.8"/><text x="834" y="111" font-size="21" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">真实 z=+1 返回</text><text x="834" y="163" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Nᵣ=11，Wᵣ=5</text><text x="834" y="215" font-size="25" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Qᵣ=+0.455</text><text x="834" y="262" font-size="15" font-weight="600" fill="#60767a" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">撤回惩罚 + 记录结果</text><text x="500" y="312" font-size="14" font-weight="600" fill="#5c7478" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">数字为教学算例，图中只展示 rollout 分支的统计，不是完整混合 Q</text></svg>
