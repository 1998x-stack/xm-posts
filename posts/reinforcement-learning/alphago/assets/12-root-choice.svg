<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三条根动作中 A 价值最高但访问19次，B 访问60次而价值较低，C 访问8次；AlphaGo 2016 按最大访问量选择B" viewBox="0 0 1000 315"><title>搜索最终落子依据访问数</title><desc>三条根动作中 A 价值最高但访问19次，B 访问60次而价值较低，C 访问8次；AlphaGo 2016 按最大访问量选择B</desc><rect width="1000" height="315" rx="18" fill="#f7faf7"/><text x="500" y="36" font-size="22" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">最好的瞬时 Q 不是搜索结束的最终决策规则</text><text x="68" y="115" font-size="20" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">候选 A</text><rect x="165" y="91" width="133" height="36" rx="12" fill="#21877b" stroke="#21877b" stroke-width="1.8"/><text x="641" y="115" font-size="20" font-weight="600" fill="#21877b" text-anchor="start" font-family="Arial, 'PingFang SC', sans-serif">N=19    Q=0.70</text><text x="68" y="182" font-size="20" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">候选 B</text><rect x="165" y="158" width="420" height="36" rx="12" fill="#c87846" stroke="#c87846" stroke-width="1.8"/><text x="641" y="182" font-size="20" font-weight="600" fill="#c87846" text-anchor="start" font-family="Arial, 'PingFang SC', sans-serif">N=60    Q=0.56</text><text x="68" y="249" font-size="20" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">候选 C</text><rect x="165" y="225" width="56" height="36" rx="12" fill="#7866a4" stroke="#7866a4" stroke-width="1.8"/><text x="641" y="249" font-size="20" font-weight="600" fill="#7866a4" text-anchor="start" font-family="Arial, 'PingFang SC', sans-serif">N=8    Q=0.42</text><rect x="169" y="285" width="662" height="23" rx="12" fill="#e6f0e9" stroke="transparent" stroke-width="1.8"/><text x="501" y="302" font-size="15" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">选择 B：访问最多（60 次），即使 A 的 Q 更高</text></svg>
