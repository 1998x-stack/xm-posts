<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CPU 执行搜索树与 rollout，GPU 批量执行策略和价值，两路返回异步更新统计并用虚拟损失协调线程" viewBox="0 0 1050 354"><title>CPU GPU 异步 APV-MCTS 计算路径</title><desc>CPU 执行搜索树与 rollout，GPU 批量执行策略和价值，两路返回异步更新统计并用虚拟损失协调线程</desc><rect width="1050" height="354" rx="18" fill="#f7faf7"/><text x="525" y="36" font-size="22" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">异步：不要把每一次 GPU 估值变成同步阻塞</text><rect x="30" y="93" width="291" height="205" rx="12" fill="#e1f1eb" stroke="#21877b" stroke-width="1.8"/><text x="175" y="145" font-size="23" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">共享 MCTS 树</text><text x="175" y="189" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">P · Q · Nᵣ · Nᵥ</text><text x="175" y="256" font-size="16" font-weight="600" fill="#647a7a" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">并发 Selection / Expansion</text><rect x="397" y="63" width="282" height="119" rx="12" fill="#fff0e6" stroke="#c87846" stroke-width="1.8"/><text x="538" y="108" font-size="23" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">CPU rollout</text><text x="538" y="150" font-size="19" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">pπ → 终局 z</text><rect x="397" y="218" width="282" height="119" rx="12" fill="#eeeafa" stroke="#7866a4" stroke-width="1.8"/><text x="538" y="261" font-size="22" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">GPU value 队列</text><text x="538" y="305" font-size="20" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">vθ(s)</text><rect x="756" y="97" width="269" height="202" rx="12" fill="#fff" stroke="#21877b" stroke-width="1.8"/><text x="888" y="153" font-size="21" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">GPU policy 队列</text><text x="888" y="200" font-size="20" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">pσᵝ 替换临时 P</text><text x="888" y="259" font-size="16" font-weight="600" fill="#657e7c" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">扩展阈值按吞吐调整</text><path d="M322 143 L397 124" fill="none" stroke="#c87846" stroke-width="3" stroke-linecap="round"/><path d="M322 259 L397 279" fill="none" stroke="#7866a4" stroke-width="3" stroke-linecap="round"/><path d="M680 120 L756 164" fill="none" stroke="#c87846" stroke-width="3" stroke-linecap="round"/><path d="M680 279 L756 232" fill="none" stroke="#7866a4" stroke-width="3" stroke-linecap="round"/><text x="525" y="347" font-size="14" font-weight="600" fill="#5e7477" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">GPU / CPU 结果非同时返回，维护独立 N 和 W，依次回传</text></svg>
