<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="四张不同颜色卡片对应 Selection Expansion Evaluation Backup，按钮会聚焦一个阶段并更新讲解" viewBox="0 0 1040 253"><title>可逐阶段聚焦 MCTS 的四个步骤</title><desc>四张不同颜色卡片对应 Selection Expansion Evaluation Backup，按钮会聚焦一个阶段并更新讲解</desc><rect width="1040" height="253" rx="18" fill="#f7faf7"/><g data-phase="1"><rect x="22" y="40" width="236" height="178" rx="12" fill="#fff" stroke="#21877b" stroke-width="1.8"/><circle cx="63" cy="83" r="24" fill="#21877b"/><text x="63" y="91" font-size="22" font-weight="600" fill="#fff" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">1</text><text x="150" y="91" font-size="22" font-weight="600" fill="#21877b" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Selection</text><text x="139" y="145" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Q + u(P)</text><text x="139" y="192" font-size="17" font-weight="600" fill="#627979" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">沿树选择</text></g><g data-phase="2"><rect x="278" y="40" width="236" height="178" rx="12" fill="#fff" stroke="#c87846" stroke-width="1.8"/><circle cx="319" cy="83" r="24" fill="#c87846"/><text x="319" y="91" font-size="22" font-weight="600" fill="#fff" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">2</text><text x="406" y="91" font-size="22" font-weight="600" fill="#c87846" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Expansion</text><text x="395" y="145" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">pσ 计算 P</text><text x="395" y="192" font-size="17" font-weight="600" fill="#627979" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">新节点入队</text></g><g data-phase="3"><rect x="534" y="40" width="236" height="178" rx="12" fill="#fff" stroke="#7866a4" stroke-width="1.8"/><circle cx="575" cy="83" r="24" fill="#7866a4"/><text x="575" y="91" font-size="22" font-weight="600" fill="#fff" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">3</text><text x="662" y="91" font-size="22" font-weight="600" fill="#7866a4" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Evaluation</text><text x="651" y="145" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">vθ 与 pπ</text><text x="651" y="192" font-size="17" font-weight="600" fill="#627979" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">网络 + 终局</text></g><g data-phase="4"><rect x="790" y="40" width="236" height="178" rx="12" fill="#fff" stroke="#315a63" stroke-width="1.8"/><circle cx="831" cy="83" r="24" fill="#315a63"/><text x="831" y="91" font-size="22" font-weight="600" fill="#fff" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">4</text><text x="918" y="91" font-size="22" font-weight="600" fill="#315a63" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Backup</text><text x="907" y="145" font-size="21" font-weight="600" fill="#28484e" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">更新 N 和 W</text><text x="907" y="192" font-size="17" font-weight="600" fill="#627979" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">回传两路</text></g><text x="520" y="240" font-size="14" font-weight="600" fill="#627878" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">按钮高亮对应阶段；SVG 单独打开时所有步骤都可见</text></svg>
