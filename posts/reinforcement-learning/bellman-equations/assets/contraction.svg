<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bellman 算子把两个价值估计之间的最大差距至少缩小到 γ 倍" viewBox="0 0 900 280"><title>Bellman 算子把两个价值估计之间的最大差距至少缩小到 γ 倍</title><rect width="900" height="280" rx="20" fill="#f9fcfa"/><rect x="51" y="44" width="325" height="73" rx="14" fill="#eef4fa" stroke="#38698a" stroke-width="2"/><text x="213.5" y="87.5" text-anchor="middle" font-size="21" font-weight="600" fill="#38698a">初始价值差距 Δ</text><rect x="523" y="44" width="324" height="73" rx="14" fill="#eef7f1" stroke="#23796e" stroke-width="2"/><text x="685" y="87.5" text-anchor="middle" font-size="21" font-weight="600" fill="#23796e">一次 Bellman 备份</text><path d="M380 81 L520 81" fill="none" stroke="#62777a" stroke-width="2.5" stroke-linecap="round"/><circle cx="520" cy="81" r="4" fill="#62777a"/><rect x="52" y="161" width="322" height="68" rx="14" fill="#eef4fa" stroke="#38698a" stroke-width="2"/><text x="213" y="202" text-anchor="middle" font-size="21" font-weight="600" fill="#38698a">|V − W|∞ = Δ</text><rect x="523" y="161" width="322" height="68" rx="14" fill="#eef7f1" stroke="#23796e" stroke-width="2"/><text x="684" y="202" text-anchor="middle" font-size="21" font-weight="600" fill="#23796e">|TV − TW|∞ ≤ γΔ</text><text x="451" y="265" text-anchor="middle" font-size="16" fill="#62777a" font-weight="400">有界奖励与 0 ≤ γ ＜ 1 下，折扣 Bellman 算子拥有唯一固定点</text></svg>
