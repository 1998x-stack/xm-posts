<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同一棵决策树：固定策略使用概率平均；最优决策使用最大值" viewBox="0 0 900 280"><title>同一棵决策树：固定策略使用概率平均；最优决策使用最大值</title><rect width="900" height="280" rx="20" fill="#f9fcfa"/><rect x="44" y="44" width="318" height="66" rx="14" fill="#edf5fa" stroke="#38698a" stroke-width="2"/><text x="203" y="84" text-anchor="middle" font-size="21" font-weight="600" fill="#38698a">固定策略 π</text><rect x="536" y="44" width="318" height="66" rx="14" fill="#fff5ec" stroke="#c27848" stroke-width="2"/><text x="695" y="84" text-anchor="middle" font-size="21" font-weight="600" fill="#c27848">最优控制 *</text><text x="206" y="151" text-anchor="middle" font-size="21" fill="#38698a" font-weight="700">∑ π(a | s) × 动作价值</text><text x="694" y="151" text-anchor="middle" font-size="21" fill="#c27848" font-weight="700">maxₐ 动作价值</text><path d="M206 114 L206 124" fill="none" stroke="#38698a" stroke-width="2.5" stroke-linecap="round"/><circle cx="206" cy="124" r="4" fill="#38698a"/><path d="M694 114 L694 124" fill="none" stroke="#c27848" stroke-width="2.5" stroke-linecap="round"/><circle cx="694" cy="124" r="4" fill="#c27848"/><text x="205" y="207" text-anchor="middle" font-size="19" fill="#263f46" font-weight="400">按动作概率做平均</text><text x="695" y="207" text-anchor="middle" font-size="19" fill="#263f46" font-weight="400">选择最好的动作</text><text x="447" y="256" text-anchor="middle" font-size="16" fill="#62777a" font-weight="400">环境随机性仍然需要求期望：max 只发生在代理可选择的动作上</text></svg>
