<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="已知模型用全期望备份；采样学习使用一次观测的 TD 目标" viewBox="0 0 900 280"><title>已知模型用全期望备份；采样学习使用一次观测的 TD 目标</title><rect width="900" height="280" rx="20" fill="#f9fcfa"/><rect x="30" y="43" width="255" height="80" rx="14" fill="#edf6fb" stroke="#38698a" stroke-width="2"/><text x="157.5" y="90" text-anchor="middle" font-size="21" font-weight="600" fill="#38698a">动态规划 DP</text><rect x="615" y="43" width="255" height="80" rx="14" fill="#edf8f0" stroke="#23796e" stroke-width="2"/><text x="742.5" y="90" text-anchor="middle" font-size="21" font-weight="600" fill="#23796e">TD / Q-learning</text><text x="155" y="168" text-anchor="middle" font-size="18" fill="#38698a" font-weight="700">已知 p(s′,r | s,a)</text><text x="742" y="168" text-anchor="middle" font-size="18" fill="#23796e" font-weight="700">样本 (s,a,r,s′)</text><text x="447" y="76" text-anchor="middle" font-size="27" fill="#263f46" font-weight="700">Bellman</text><text x="448" y="111" text-anchor="middle" font-size="17" fill="#62777a" font-weight="400">共同的目标结构</text><text x="155" y="211" text-anchor="middle" font-size="16" fill="#263f46" font-weight="400">枚举未来状态与奖励</text><text x="743" y="211" text-anchor="middle" font-size="16" fill="#263f46" font-weight="400">从真实转移做自举更新</text><text x="447" y="263" text-anchor="middle" font-size="15" fill="#62777a" font-weight="400">DQN 以神经网络近似动作价值；并非 Bellman 方程本身</text></svg>
