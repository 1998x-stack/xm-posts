<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="单状态教学 MDP：立即停止获得 1，或者每一步继续获得 0.3" viewBox="0 0 900 280"><title>单状态教学 MDP：立即停止获得 1，或者每一步继续获得 0.3</title><rect width="900" height="280" rx="20" fill="#f9fcfa"/><rect x="58" y="83" width="180" height="94" rx="14" fill="#eef7f1" stroke="#23796e" stroke-width="2"/><text x="148" y="137" text-anchor="middle" font-size="21" font-weight="600" fill="#23796e">状态 S</text><rect x="417" y="31" width="210" height="80" rx="14" fill="#fff6e8" stroke="#c27848" stroke-width="2"/><text x="522" y="78" text-anchor="middle" font-size="21" font-weight="600" fill="#c27848">停止：奖励 1</text><rect x="417" y="150" width="210" height="80" rx="14" fill="#eef8f2" stroke="#23796e" stroke-width="2"/><text x="522" y="197" text-anchor="middle" font-size="21" font-weight="600" fill="#23796e">继续：奖励 0.3</text><path d="M238 117 L417 70" fill="none" stroke="#62777a" stroke-width="2.5" stroke-linecap="round"/><circle cx="417" cy="70" r="4" fill="#62777a"/><path d="M238 150 L417 189" fill="none" stroke="#62777a" stroke-width="2.5" stroke-linecap="round"/><circle cx="417" cy="189" r="4" fill="#62777a"/><text x="735" y="74" text-anchor="middle" font-size="21" fill="#c27848" font-weight="700">→ 终止 ⊥</text><text x="741" y="188" text-anchor="middle" font-size="21" fill="#23796e" font-weight="700">↺ 回到 S</text><text x="449" y="261" text-anchor="middle" font-size="16" fill="#62777a" font-weight="400">折扣越接近 1，重复获得 0.3 的长期价值越高</text></svg>
