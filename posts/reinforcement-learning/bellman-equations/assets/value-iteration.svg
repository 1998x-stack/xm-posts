<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="价值迭代：每次把一步未来估计折回当前状态" viewBox="0 0 900 280"><title>价值迭代：每次把一步未来估计折回当前状态</title><rect width="900" height="280" rx="20" fill="#f9fcfa"/><rect x="30" y="108" width="174" height="72" rx="14" fill="#eff5fc" stroke="#38698a" stroke-width="2"/><text x="117" y="151" text-anchor="middle" font-size="21" font-weight="600" fill="#38698a">V₀(S) = 0</text><rect x="261" y="108" width="174" height="72" rx="14" fill="#eef7f1" stroke="#23796e" stroke-width="2"/><text x="348" y="151" text-anchor="middle" font-size="21" font-weight="600" fill="#23796e">V₁(S) = 1</text><rect x="491" y="108" width="174" height="72" rx="14" fill="#eef7f1" stroke="#23796e" stroke-width="2"/><text x="578" y="151" text-anchor="middle" font-size="21" font-weight="600" fill="#23796e">V₂(S) = 1.2</text><rect x="722" y="108" width="155" height="72" rx="14" fill="#eef7f1" stroke="#23796e" stroke-width="2"/><text x="799.5" y="151" text-anchor="middle" font-size="21" font-weight="600" fill="#23796e">V₃ = 1.38</text><path d="M205 145 L260 145" fill="none" stroke="#62777a" stroke-width="2.5" stroke-linecap="round"/><circle cx="260" cy="145" r="4" fill="#62777a"/><path d="M436 145 L490 145" fill="none" stroke="#62777a" stroke-width="2.5" stroke-linecap="round"/><circle cx="490" cy="145" r="4" fill="#62777a"/><path d="M666 145 L721 145" fill="none" stroke="#62777a" stroke-width="2.5" stroke-linecap="round"/><circle cx="721" cy="145" r="4" fill="#62777a"/><text x="448" y="49" text-anchor="middle" font-size="18" fill="#263f46" font-weight="700">γ = 0.9, 每次 Vₖ₊₁ = max(1, 0.3 + 0.9 Vₖ)</text><text x="449" y="240" text-anchor="middle" font-size="17" fill="#62777a" font-weight="400">每步只看一层，但数值会不断反映越来越远的未来</text></svg>
