<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">C51 交叉熵训练：目标概率与当前预测</title><desc id="desc">五个教学原子上目标分布与预测分布的柱状对比，说明交叉熵调整概率而不移动固定原子。</desc><rect width="900" height="340" rx="18" fill="#f3f9fa"/><text x="40" y="46" font-family="sans-serif" font-size="24" font-weight="700" fill="#183944">固定原子，学习概率</text><text x="40" y="77" font-family="sans-serif" font-size="16" fill="#526c76">教学示意：目标 m 与网络预测 pθ（非论文实验数据）</text><g stroke="#a6bec5" stroke-width="2"><path d="M80 260H850"/><path d="M80 105V260"/></g><g fill="#087f8c"><rect x="137" y="222" width="43" height="38"/><rect x="280" y="170" width="43" height="90"/><rect x="423" y="118" width="43" height="142"/><rect x="566" y="196" width="43" height="64"/><rect x="709" y="234" width="43" height="26"/></g><g fill="#db8a41"><rect x="185" y="209" width="43" height="51"/><rect x="328" y="196" width="43" height="64"/><rect x="471" y="157" width="43" height="103"/><rect x="614" y="183" width="43" height="77"/><rect x="757" y="196" width="43" height="64"/></g><g font-family="sans-serif" fill="#183944" font-size="18" text-anchor="middle"><text x="184" y="290">z₀</text><text x="327" y="290">z₁</text><text x="470" y="290">z₂</text><text x="613" y="290">z₃</text><text x="756" y="290">z₄</text></g><rect x="550" y="29" width="20" height="15" fill="#087f8c"/><text x="577" y="43" font-family="sans-serif" font-size="15" fill="#183944">目标 m</text><rect x="690" y="29" width="20" height="15" fill="#db8a41"/><text x="717" y="43" font-family="sans-serif" font-size="15" fill="#183944">预测 pθ</text><text x="450" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#526c76">C51 实际使用 51 个原子；此图仅展示五原子教学示例</text></svg>