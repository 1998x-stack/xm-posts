<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="pt pd"><title id="pt">C51 线性投影算例</title><desc id="pd">位于 1.4 的概率质量 0.6 分给原子 1 和 2，权重分别为 0.36 和 0.24。</desc><rect width="900" height="350" rx="20" fill="#f5f9fb"/><g font-family="sans-serif" fill="#173b49"><text x="35" y="49" font-size="25" font-weight="700">一个目标质量如何落回固定网格？</text><text x="40" y="92" font-size="18">目标位置 1.4，质量 0.6</text></g><path d="M90 264H810" stroke="#7295a2" stroke-width="4"/><g font-family="sans-serif" text-anchor="middle" font-size="21" fill="#173b49"><text x="200" y="299">原子 1</text><text x="690" y="299">原子 2</text><text x="396" y="146">1.4</text></g><path d="M396 158V204" stroke="#bd6b30" stroke-width="4"/><circle cx="396" cy="204" r="11" fill="#bd6b30"/><path d="M388 215 200 242M405 215 690 242" stroke="#2a7280" stroke-width="4" fill="none"/><g font-family="sans-serif" font-size="20" fill="#155763"><text x="95" y="214">0.6 × 0.6 = 0.36</text><text x="588" y="214">0.6 × 0.4 = 0.24</text></g><rect x="177" y="220" width="46" height="44" rx="5" fill="#087f8c"/><rect x="667" y="234" width="46" height="30" rx="5" fill="#d4783b"/></svg>