<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="c51title c51desc"><title id="c51title">C51 回报分布与标量价值的区别</title><desc id="c51desc">左边相同均值的两种回报分布，右边是 C51 将 Bellman 目标的概率质量投影回固定支持点。</desc><rect width="900" height="420" rx="24" fill="#f4f8f9"/><g font-family="sans-serif" fill="#163c4a"><text x="40" y="48" font-size="26" font-weight="700">同样的期望值，不同的回报分布</text><text x="44" y="89" font-size="17">动作 A：稳定获得 2</text><text x="44" y="225" font-size="17">动作 B：0 与 4 各有 50% 概率</text></g><g stroke="#7896a0" stroke-width="2"><path d="M55 185H415M55 320H415"/></g><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#224a56"><text x="90" y="207">0</text><text x="170" y="207">1</text><text x="250" y="207">2</text><text x="330" y="207">3</text><text x="410" y="207">4</text><text x="90" y="345">0</text><text x="250" y="345">2</text><text x="410" y="345">4</text></g><rect x="230" y="105" width="40" height="80" rx="7" fill="#087f8c"/><rect x="70" y="278" width="40" height="42" rx="7" fill="#d4783b"/><rect x="390" y="278" width="40" height="42" rx="7" fill="#d4783b"/><path d="M458 70V370" stroke="#c8d9df" stroke-width="2"/><g font-family="sans-serif" fill="#163c4a"><text x="495" y="89" font-size="22" font-weight="700">C51：51 个固定原子</text><text x="495" y="121" font-size="16">Bellman 目标移动位置</text><text x="495" y="145" font-size="16">概率质量再分配给邻近原子</text></g><path d="M510 328H850" stroke="#7896a0" stroke-width="3"/><g fill="#b3d8df"><rect x="520" y="285" width="22" height="43" rx="4"/><rect x="558" y="263" width="22" height="65" rx="4"/><rect x="596" y="238" width="22" height="90" rx="4"/><rect x="634" y="202" width="22" height="126" rx="4"/><rect x="672" y="218" width="22" height="110" rx="4"/><rect x="710" y="260" width="22" height="68" rx="4"/><rect x="748" y="287" width="22" height="41" rx="4"/></g><path d="M647 182V203" stroke="#d4783b" stroke-width="4"/><path d="m637 194 10 11 10-11" fill="none" stroke="#d4783b" stroke-width="4"/><g font-family="sans-serif" fill="#42606c" font-size="15"><text x="510" y="363">vmin</text><text x="807" y="363">vmax</text><text x="505" y="394">示意：仅画部分原子；实际 C51 使用 51 个</text></g></svg>