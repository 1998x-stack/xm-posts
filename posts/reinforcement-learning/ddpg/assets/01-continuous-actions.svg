<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" role="img" style="font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif" aria-labelledby="ddpg-fig1-title ddpg-fig1-desc"><title id="ddpg-fig1-title">为什么连续动作难以枚举</title><desc id="ddpg-fig1-desc">7 维关节每个只有三种离散动作时已经产生 2187 组组合；Actor 直接输出连续动作向量。</desc><rect width="800" height="316" rx="18" fill="#f9fbf9"/><text x="38" y="42" font-size="20" font-weight="700" fill="#27454a">逐个枚举动作</text><text x="434" y="42" font-size="20" font-weight="700" fill="#277d78">直接学习动作函数</text><rect x="26" y="65" width="338" height="222" rx="14" fill="#fff2ea" stroke="#ecd4c0"/><rect x="416" y="65" width="356" height="222" rx="14" fill="#e9f5ef" stroke="#b9d9cf"/><g fill="#c57c50"><rect x="46" y="102" width="35" height="32" rx="6" opacity="0.55"/><text x="63" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text><rect x="91" y="110" width="35" height="32" rx="6" opacity="0.60"/><text x="108" y="131" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text><rect x="136" y="102" width="35" height="32" rx="6" opacity="0.65"/><text x="153" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text><rect x="181" y="110" width="35" height="32" rx="6" opacity="0.70"/><text x="198" y="131" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text><rect x="226" y="102" width="35" height="32" rx="6" opacity="0.75"/><text x="243" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text><rect x="271" y="110" width="35" height="32" rx="6" opacity="0.80"/><text x="288" y="131" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text><rect x="316" y="102" width="35" height="32" rx="6" opacity="0.85"/><text x="333" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text></g><text x="197" y="184" text-anchor="middle" font-size="16" fill="#536b6b">3 × 3 × … × 3</text><text x="197" y="233" text-anchor="middle" font-size="35" font-weight="800" fill="#a75e35">3⁷ = 2187</text><text x="197" y="266" text-anchor="middle" font-size="13" fill="#6c7878">只允许三档时就已有这么多选择</text><rect x="453" y="110" width="108" height="76" rx="12" fill="#fff" stroke="#b1d5cb"/><text x="507" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#276b65">状态 s</text><text x="507" y="163" text-anchor="middle" font-size="12" fill="#617a78">观测向量</text><path d="M561 149H598" stroke="#27827b" stroke-width="3"/><path d="M596 142L609 149L596 156" fill="none" stroke="#27827b" stroke-width="3"/><rect x="610" y="107" width="135" height="80" rx="12" fill="#d3ebe1" stroke="#a6cbbd"/><text x="677" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#23675e">Actor μ(s)</text><text x="677" y="163" text-anchor="middle" font-size="12" fill="#54756b">实值动作向量</text><text x="591" y="230" text-anchor="middle" font-size="15" font-weight="650" fill="#266a64">无需对动作网格穷举 argmax</text><text x="591" y="262" text-anchor="middle" font-size="13" fill="#607c75">仍需训练 Critic 指导 Actor</text></svg>
