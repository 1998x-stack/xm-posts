<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" role="img" style="font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif" aria-labelledby="ddpg-fig3-title ddpg-fig3-desc"><title id="ddpg-fig3-title">回放数据到双目标网络的 Bellman 目标</title><desc id="ddpg-fig3-desc">随机回放转移供在线 Critic 计算 Q(s,a)，目标 Actor 为下一个状态提供动作，目标 Critic 输出稳定目标，用平方误差更新在线 Critic。</desc><rect width="800" height="316" rx="18" fill="#f9fbf9"/><rect x="22" y="99" width="162" height="110" rx="12" fill="#e9f1f7" stroke="#c0d8de"/><text x="103" y="128" text-anchor="middle" font-size="19" font-weight="750" fill="#387286">Replay Buffer</text><text x="103" y="153" text-anchor="middle" font-size="14" fill="#557786">(s,a,r,s′,d)</text><text x="103" y="176" text-anchor="middle" font-size="12" fill="#5b777a">随机 mini-batch</text><rect x="255" y="34" width="178" height="74" rx="11" fill="#e5f1ea" stroke="#c4dece"/><text x="344" y="63" text-anchor="middle" font-size="17" font-weight="700" fill="#246c61">Online Critic</text><text x="344" y="87" text-anchor="middle" font-size="15" fill="#51736b">Qφ(s,a)</text><rect x="255" y="195" width="178" height="79" rx="11" fill="#f2eafa" stroke="#d6c3e4"/><text x="344" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#745b9a">Target Actor</text><text x="344" y="251" text-anchor="middle" font-size="15" fill="#746981">μθ′(s′)</text><rect x="518" y="195" width="241" height="79" rx="11" fill="#f2eafa" stroke="#d6c3e4"/><text x="638" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#745b9a">Target Critic</text><text x="638" y="251" text-anchor="middle" font-size="14" fill="#746981">r + γ(1−d)Qφ′(s′, μθ′(s′))</text><path d="M184 122L254 73M184 180L254 235M433 234H516" stroke="#769892" stroke-width="2.6" fill="none"/><path d="M242 71L254 73L250 86M241 229L254 235L245 244M504 228L518 234L504 240" stroke="#769892" stroke-width="2.4" fill="none"/><path d="M639 194V148H434V83" stroke="#c97a45" stroke-width="2.8" stroke-dasharray="7 5" fill="none"/><path d="M427 94L434 81L441 94" stroke="#c97a45" stroke-width="2.6" fill="none"/><text x="536" y="137" font-size="14" font-weight="700" fill="#b26f42">停止梯度的目标 y</text><text x="403" y="302" text-anchor="middle" font-size="14" fill="#536e70">在线网络被优化；目标网络只进行缓慢软更新（Polyak）</text></svg>
