<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" role="img" style="font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif" aria-labelledby="ddpg-fig4-title ddpg-fig4-desc"><title id="ddpg-fig4-title">探索策略与部署策略的区别</title><desc id="ddpg-fig4-desc">训练时确定性 Actor 的动作叠加 OU 时间相关噪声并裁剪到动作范围，评价时通常去掉噪声。</desc><rect width="800" height="316" rx="18" fill="#f9fbf9"/><rect x="37" y="62" width="329" height="207" rx="14" fill="#fff0e7" stroke="#e9d0bd"/><rect x="434" y="62" width="329" height="207" rx="14" fill="#e9f5ee" stroke="#bad8c8"/><text x="200" y="100" text-anchor="middle" font-size="20" font-weight="750" fill="#ac6d46">训练 / 收集经验</text><text x="200" y="134" text-anchor="middle" font-size="18" fill="#5b6e72">a = clip( μ(s) + Nₜ )</text><path d="M75 191L112 177L149 206L186 165L223 189L260 143L297 167L333 138" stroke="#c17746" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M75 198L333 154" stroke="#547c78" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/><text x="200" y="242" text-anchor="middle" font-size="13" fill="#755b48">实线：加噪动作 · 虚线：基础策略</text><text x="599" y="100" text-anchor="middle" font-size="20" font-weight="750" fill="#246f63">评估 / 执行</text><text x="599" y="134" text-anchor="middle" font-size="18" fill="#536f66">a = μ(s)</text><path d="M474 198L731 154" stroke="#258879" stroke-width="4" fill="none" stroke-linecap="round"/><text x="599" y="242" text-anchor="middle" font-size="13" fill="#536f66">不额外注入探索噪声</text><text x="400" y="301" text-anchor="middle" font-size="13" fill="#677a79">OU 是论文中的探索选择；它不是 Critic 的目标策略平滑噪声</text></svg>
