<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" role="img" style="font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif" aria-labelledby="ddpg-fig5-title ddpg-fig5-desc"><title id="ddpg-fig5-title">DDPG 的一次参数更新</title><desc id="ddpg-fig5-desc">依次采样状态和动作，写入回放，计算 TD 目标，更新 Critic，沿 Critic 对动作的梯度更新 Actor，最后软更新两套目标网络。</desc><rect width="800" height="316" rx="18" fill="#f9fbf9"/><g><rect x="33" y="50" width="223" height="90" rx="12" fill="#e7f2f8" stroke="#cddbd7"/><text x="49" y="77" font-size="13" font-weight="750" fill="#397489">01</text><text x="144" y="99" text-anchor="middle" font-size="18" font-weight="750" fill="#397489">行为策略</text><text x="144" y="122" text-anchor="middle" font-size="13" fill="#627a78">μ(s)+noise</text><rect x="295" y="50" width="223" height="90" rx="12" fill="#e7f2f8" stroke="#cddbd7"/><text x="311" y="77" font-size="13" font-weight="750" fill="#397489">02</text><text x="406" y="99" text-anchor="middle" font-size="18" font-weight="750" fill="#397489">Replay</text><text x="406" y="122" text-anchor="middle" font-size="13" fill="#627a78">(s,a,r,s′,d)</text><rect x="557" y="50" width="223" height="90" rx="12" fill="#eee9f7" stroke="#cddbd7"/><text x="573" y="77" font-size="13" font-weight="750" fill="#755b98">03</text><text x="668" y="99" text-anchor="middle" font-size="18" font-weight="750" fill="#755b98">TD target</text><text x="668" y="122" text-anchor="middle" font-size="13" fill="#627a78">r+γQ′</text><rect x="33" y="182" width="223" height="90" rx="12" fill="#eee9f7" stroke="#cddbd7"/><text x="49" y="209" font-size="13" font-weight="750" fill="#755b98">04</text><text x="144" y="231" text-anchor="middle" font-size="18" font-weight="750" fill="#755b98">Critic</text><text x="144" y="254" text-anchor="middle" font-size="13" fill="#627a78">min MSE</text><rect x="295" y="182" width="223" height="90" rx="12" fill="#e6f4ea" stroke="#cddbd7"/><text x="311" y="209" font-size="13" font-weight="750" fill="#267368">05</text><text x="406" y="231" text-anchor="middle" font-size="18" font-weight="750" fill="#267368">Actor</text><text x="406" y="254" text-anchor="middle" font-size="13" fill="#627a78">max Q(s,μ(s))</text><rect x="557" y="182" width="223" height="90" rx="12" fill="#e6f4ea" stroke="#cddbd7"/><text x="573" y="209" font-size="13" font-weight="750" fill="#267368">06</text><text x="668" y="231" text-anchor="middle" font-size="18" font-weight="750" fill="#267368">Soft update</text><text x="668" y="254" text-anchor="middle" font-size="13" fill="#627a78">θ′←τθ+(1−τ)θ′</text></g><g stroke="#879e99" stroke-width="3" fill="none"><path d="M256 95H291"/><path d="M518 95H552"/><path d="M681 142V162H146V182"/><path d="M256 227H291"/><path d="M518 227H552"/></g><text x="399" y="305" text-anchor="middle" font-size="13" fill="#667f7a">右上到左下：下一阶段开始；概念顺序，而非执行时间比例</text></svg>
