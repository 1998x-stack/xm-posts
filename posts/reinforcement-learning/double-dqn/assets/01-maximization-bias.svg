<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="t d"><title id="t">最大化带噪声估计导致乐观偏差</title><desc id="d">两个真实价值都为五的动作，噪声使估计值变为六和四，最大化选择六，超过真实最优值五。</desc><rect width="900" height="350" rx="22" fill="#f3f8fa"/><g font-family="sans-serif" fill="#173a49"><text x="40" y="50" font-size="28" font-weight="700">最大化操作会偏爱正向噪声</text><text x="40" y="85" font-size="17">同一状态，两个动作的真实 Q 值都为 5</text></g><path d="M110 274H790" stroke="#688c9a" stroke-width="3"/><path d="M110 171H790" stroke="#718d97" stroke-dasharray="8 7" stroke-width="2"/><text x="48" y="177" font-size="18" font-family="sans-serif" fill="#516a75">5</text><rect x="238" y="151" width="115" height="123" rx="8" fill="#087f8c"/><rect x="535" y="192" width="115" height="82" rx="8" fill="#e19b52"/><g font-family="sans-serif" text-anchor="middle" fill="#173a49"><text x="295" y="136" font-size="22" font-weight="700">6</text><text x="593" y="180" font-size="22" font-weight="700">4</text><text x="295" y="307" font-size="21">动作 A</text><text x="593" y="307" font-size="21">动作 B</text><text x="450" y="332" font-size="15">估计误差 +1 / −1；max(6,4)=6，但 max(5,5)=5</text></g></svg>