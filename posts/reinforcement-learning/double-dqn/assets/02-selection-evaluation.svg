<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="ttl desc"><title id="ttl">DQN 与 Double DQN 的目标值计算</title><desc id="desc">DQN 使用同一目标网络选动作并评价，Double DQN 使用在线网络选动作，目标网络评价选中的动作。</desc><rect width="900" height="390" rx="22" fill="#f1f7fa"/><g font-family="sans-serif" fill="#173a49"><text x="34" y="45" font-size="29" font-weight="700">同一组估计误差，两个不同的目标</text><text x="35" y="79" font-size="17">教学算例：下一状态有 A、B 两个动作；真实价值均为 5</text></g><rect x="45" y="108" width="190" height="120" rx="15" fill="#d7ecf2" stroke="#2e788b" stroke-width="2"/><rect x="665" y="108" width="190" height="120" rx="15" fill="#fbe9d6" stroke="#ba7638" stroke-width="2"/><g font-family="sans-serif" text-anchor="middle" font-size="18" fill="#153c4c"><text x="140" y="137">在线网络 Qθ</text><text x="140" y="175">A = 6</text><text x="140" y="205">B = 4</text><text x="760" y="137">目标网络 Qθ⁻</text><text x="760" y="175">A = 4.5</text><text x="760" y="205">B = 5.5</text></g><g fill="none" stroke="#2e788b" stroke-width="4"><path d="M237 155H418"/><path d="m406 145 12 10-12 10"/></g><g fill="none" stroke="#ba7638" stroke-width="4"><path d="M665 185H483"/><path d="m495 175-12 10 12 10"/></g><rect x="353" y="127" width="194" height="105" rx="15" fill="#fff" stroke="#a1bfc9"/><g font-family="sans-serif" text-anchor="middle" fill="#173a49"><text x="450" y="158" font-size="20" font-weight="700">Double DQN</text><text x="450" y="187" font-size="18">在线选 A</text><text x="450" y="212" font-size="18">目标网络评 A = 4.5</text></g><rect x="45" y="273" width="385" height="76" rx="14" fill="#e1eef3"/><rect x="470" y="273" width="385" height="76" rx="14" fill="#f8e8d8"/><g font-family="sans-serif" fill="#173a49" text-anchor="middle"><text x="237" y="304" font-size="21" font-weight="700">DQN: max Qθ⁻ = 5.5</text><text x="237" y="331" font-size="16">选择 B 并评价 B</text><text x="662" y="304" font-size="21" font-weight="700">Double DQN: Qθ⁻(A) = 4.5</text><text x="662" y="331" font-size="16">在线网络选 A，目标网络评 A</text></g><text x="450" y="376" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#536e7b">此例展示估计机制，不代表论文的实验指标；Double DQN 不保证每次都更接近真实值</text></svg>