<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title desc"><title id="title">Double DQN 训练目标的五步计算流程</title><desc id="desc">从经验回放采样状态动作奖励下一状态，在线网络选择下一动作，目标网络评价该动作，构造贝尔曼目标，最后更新在线网络。</desc><rect width="920" height="340" rx="22" fill="#f3f8fa"/><text x="34" y="49" font-size="28" font-family="sans-serif" font-weight="700" fill="#173b49">Double DQN：一次训练更新如何发生？</text><text x="34" y="80" font-size="17" font-family="sans-serif" fill="#536c79">选动作和评动作使用不同参数；梯度只更新在线网络</text><g font-family="sans-serif" text-anchor="middle" fill="#173b49"><rect x="28" y="121" width="154" height="117" rx="13" fill="#dcecf1" stroke="#407c90" stroke-width="2"/><text x="105" y="156" font-size="18" font-weight="700">① 采样经验</text><text x="105" y="185" font-size="16">s, a, r, s′</text><text x="105" y="211" font-size="14">Replay buffer</text><rect x="208" y="121" width="154" height="117" rx="13" fill="#d6eff0" stroke="#087f8c" stroke-width="2"/><text x="285" y="156" font-size="18" font-weight="700">② 在线网络</text><text x="285" y="185" font-size="16">argmax Qθ</text><text x="285" y="211" font-size="14">选择 a*</text><rect x="388" y="121" width="154" height="117" rx="13" fill="#fbe9d6" stroke="#b77738" stroke-width="2"/><text x="465" y="156" font-size="18" font-weight="700">③ 目标网络</text><text x="465" y="185" font-size="16">Qθ⁻(s′,a*)</text><text x="465" y="211" font-size="14">只评价 a*</text><rect x="568" y="121" width="154" height="117" rx="13" fill="#e7e5f5" stroke="#7463a3" stroke-width="2"/><text x="645" y="156" font-size="18" font-weight="700">④ 构造目标</text><text x="645" y="185" font-size="16">y = r + γQ</text><text x="645" y="211" font-size="14">终止时无后继项</text><rect x="748" y="121" width="144" height="117" rx="13" fill="#dcecf1" stroke="#407c90" stroke-width="2"/><text x="820" y="156" font-size="18" font-weight="700">⑤ 梯度更新</text><text x="820" y="185" font-size="16">[y−Qθ]²</text><text x="820" y="211" font-size="14">仅更新 θ</text></g><g fill="none" stroke="#536c79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M182 180h23m-8 -7 8 7-8 7"/><path d="M362 180h23m-8 -7 8 7-8 7"/><path d="M542 180h23m-8 -7 8 7-8 7"/><path d="M722 180h23m-8 -7 8 7-8 7"/></g><text x="460" y="283" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#173b49">周期性复制在线参数 θ → 目标参数 θ⁻，而不是每步同时更新两套网络</text><text x="460" y="314" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#536c79">流程为教学概括；目标网络同步频率、损失函数细节取决于实现</text></svg>