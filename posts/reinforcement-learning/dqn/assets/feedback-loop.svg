<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="状态与奖励闭环：图像状态流向Q网络，选择动作后环境返回新状态和奖励" viewBox="0 0 800 310"><title>状态与奖励闭环：图像状态流向Q网络，选择动作后环境返回新状态和奖励</title><rect width="800" height="310" rx="16" fill="#fbfcf9"/><rect x="28" y="96" width="182" height="88" rx="12" fill="#e9f2f7" stroke="#9cbab2"/><text x="119" y="129" font-size="20" font-weight="700" fill="#234a4e" text-anchor="middle">观察状态</text><text x="119" y="158" font-size="14" fill="#48636a" text-anchor="middle">sₜ：四帧画面</text><path d="M214 141 H247" stroke="#398c85" stroke-width="3" fill="none"/><path d="M244 134 L256 141 L244 148" fill="none" stroke="#398c85" stroke-width="3" stroke-linejoin="round"/><rect x="258" y="96" width="174" height="88" rx="12" fill="#ececf8" stroke="#9cbab2"/><text x="345" y="129" font-size="20" font-weight="700" fill="#234a4e" text-anchor="middle">Q 网络</text><text x="345" y="158" font-size="14" fill="#48636a" text-anchor="middle">每个动作一个分数</text><path d="M436 141 H469" stroke="#398c85" stroke-width="3" fill="none"/><path d="M466 134 L478 141 L466 148" fill="none" stroke="#398c85" stroke-width="3" stroke-linejoin="round"/><rect x="480" y="96" width="147" height="88" rx="12" fill="#fff1e4" stroke="#9cbab2"/><text x="553.5" y="129" font-size="20" font-weight="700" fill="#234a4e" text-anchor="middle">选择动作</text><text x="553.5" y="158" font-size="14" fill="#48636a" text-anchor="middle">ε-greedy</text><path d="M631 141 H659" stroke="#398c85" stroke-width="3" fill="none"/><path d="M656 134 L668 141 L656 148" fill="none" stroke="#398c85" stroke-width="3" stroke-linejoin="round"/><rect x="670" y="96" width="112" height="88" rx="12" fill="#e9f2e9" stroke="#9cbab2"/><text x="726" y="129" font-size="20" font-weight="700" fill="#234a4e" text-anchor="middle">环境</text><text x="726" y="158" font-size="14" fill="#48636a" text-anchor="middle">r, s′</text><path d="M724 190 V240 H120 V190" fill="none" stroke="#d58353" stroke-width="2.5" stroke-dasharray="7 5"/><text x="413" y="265" text-anchor="middle" font-size="16" fill="#945c38">交互产生数据，也改变后续训练样本分布</text></svg>
