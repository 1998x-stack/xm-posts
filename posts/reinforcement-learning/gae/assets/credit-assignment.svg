<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gae-credit-title gae-credit-desc" viewBox="0 0 780 300"><title id="gae-credit-title">延迟奖励与信用分配</title><desc id="gae-credit-desc">晚到的奖励使早期动作贡献难以估计</desc><rect width="780" height="300" rx="14" fill="#fbfcfa"/><text x="390" y="48" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="21" font-weight="700" fill="#26434b">一个动作，好不好？可能很久以后才知道</text><rect x="68" y="90" width="143" height="83" rx="10" fill="#eaf4f0" stroke="#b9d0ca" stroke-width="2"/><text x="139" y="123" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#237f77">动作 1</text><text x="139" y="153" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#26434b">a0</text><rect x="235" y="90" width="143" height="83" rx="10" fill="#eaf4f0" stroke="#b9d0ca" stroke-width="2"/><text x="306" y="123" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#237f77">动作 2</text><text x="306" y="153" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#26434b">a1</text><rect x="402" y="90" width="143" height="83" rx="10" fill="#eaf4f0" stroke="#b9d0ca" stroke-width="2"/><text x="473" y="123" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#237f77">动作 3</text><text x="473" y="153" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#26434b">a2</text><rect x="569" y="90" width="143" height="83" rx="10" fill="#fff0e4" stroke="#b9d0ca" stroke-width="2"/><text x="640" y="123" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#c9824f">延迟奖励</text><text x="640" y="153" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="17" font-weight="400" fill="#26434b">r₃ = +4</text><path d="M213 130L233 130" stroke="#237f77" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M380 130L400 130" stroke="#237f77" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M547 130L567 130" stroke="#237f77" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M640 186Q620 268 138 268Q90 250 130 191" stroke="#c9824f" stroke-width="2" stroke-dasharray="7 6" fill="none"/><text x="390" y="242" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="17" font-weight="700" fill="#c9824f">归因需要远期反馈，但未来也引入噪声</text></svg>
