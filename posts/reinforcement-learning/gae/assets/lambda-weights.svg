<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gae-lambda-title gae-lambda-desc" viewBox="0 0 780 300"><title id="gae-lambda-title">λ 影响未来 TD residual 权重</title><desc id="gae-lambda-desc">gamma 为 0.9 lambda 为 0.8，未来 TD 误差权重分别为 1、0.72、0.518、0.373</desc><rect width="780" height="300" rx="14" fill="#fbfcfa"/><text x="390" y="39" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="21" font-weight="700" fill="#26434b">γ = 0.9，λ = 0.8 → 每步 × 0.72</text><text x="105" y="86" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26434b">δₜ </text><rect x="172" y="64" rx="7" width="420" height="29" fill="#e7eeea"/><rect x="172" y="64" rx="7" width="420.00" height="29" fill="#237f77"/><text x="646" y="86" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="16" font-weight="700" fill="#237f77">1.000</text><text x="105" y="138" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26434b">δₜ + 1</text><rect x="172" y="116" rx="7" width="420" height="29" fill="#e7eeea"/><rect x="172" y="116" rx="7" width="302.40" height="29" fill="#237f77"/><text x="646" y="138" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="16" font-weight="700" fill="#237f77">0.720</text><text x="105" y="190" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26434b">δₜ + 2</text><rect x="172" y="168" rx="7" width="420" height="29" fill="#e7eeea"/><rect x="172" y="168" rx="7" width="217.73" height="29" fill="#3a809b"/><text x="646" y="190" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="16" font-weight="700" fill="#237f77">0.518</text><text x="105" y="242" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="16" font-weight="400" fill="#26434b">δₜ + 3</text><rect x="172" y="220" rx="7" width="420" height="29" fill="#e7eeea"/><rect x="172" y="220" rx="7" width="156.76" height="29" fill="#3a809b"/><text x="646" y="242" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="16" font-weight="700" fill="#237f77">0.373</text><text x="390" y="287" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#c9824f">仅为衰减机制示意，不是论文实验曲线</text></svg>
