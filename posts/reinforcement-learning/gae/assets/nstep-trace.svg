<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gae-nstep-title gae-nstep-desc" viewBox="0 0 780 300"><title id="gae-nstep-title">多步优势与相消</title><desc id="gae-nstep-desc">从一步到三步的 TD residual 展开，把价值函数的尾部估计推得更远</desc><rect width="780" height="300" rx="14" fill="#fbfcfa"/><text x="390" y="39" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="21" font-weight="700" fill="#26434b">同一个时间步，选择看多远</text><rect x="42" y="57" width="696" height="62" rx="10" fill="#e9f5f9" stroke="#b9d0ca" stroke-width="2"/><text x="115" y="95" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#237f77">一步</text><text x="370" y="95" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="19" font-weight="700" fill="#26434b">δₜ</text><text x="639" y="95" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#7866a0">从下一状态自举</text><rect x="42" y="135" width="696" height="62" rx="10" fill="#edf6ed" stroke="#b9d0ca" stroke-width="2"/><text x="115" y="173" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#237f77">两步</text><text x="370" y="173" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="19" font-weight="700" fill="#26434b">δₜ + γδₜ₊₁</text><text x="639" y="173" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#7866a0">从两步后自举</text><rect x="42" y="213" width="696" height="62" rx="10" fill="#f3effb" stroke="#b9d0ca" stroke-width="2"/><text x="115" y="251" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#237f77">三步</text><text x="370" y="251" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="19" font-weight="700" fill="#26434b">δₜ + γδₜ₊₁ + γ²δₜ₊₂</text><text x="639" y="251" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="14" font-weight="400" fill="#7866a0">从三步后自举</text></svg>
