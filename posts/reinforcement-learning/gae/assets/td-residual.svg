<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gae-residual-title gae-residual-desc" viewBox="0 0 780 300"><title id="gae-residual-title">一步 TD residual</title><desc id="gae-residual-desc">奖励加下一个状态预测，再减去当前价值预测</desc><rect width="780" height="300" rx="14" fill="#fbfcfa"/><text x="390" y="47" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="21" font-weight="700" fill="#26434b">一步“超出预期”的信号</text><rect x="28" y="93" width="206" height="110" rx="10" fill="#eaf4f8" stroke="#b9d0ca" stroke-width="2"/><rect x="288" y="93" width="204" height="110" rx="10" fill="#e9f6ee" stroke="#b9d0ca" stroke-width="2"/><rect x="548" y="93" width="204" height="110" rx="10" fill="#fff2e6" stroke="#b9d0ca" stroke-width="2"/><text x="131" y="132" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#3a809b">即时奖励</text><text x="131" y="164" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="25" font-weight="400" fill="#26434b">rₜ</text><text x="390" y="132" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#237f77">未来价值估计</text><text x="390" y="164" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#26434b">γ V(sₜ₊₁)</text><text x="650" y="132" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#c9824f">当前价值基线</text><text x="650" y="164" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#26434b">− V(sₜ)</text><text x="260" y="156" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="31" font-weight="700" fill="#237f77">+</text><text x="520" y="156" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="31" font-weight="700" fill="#237f77">+</text><text x="390" y="254" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="23" font-weight="700" fill="#237f77">δₜ = rₜ + γV(sₜ₊₁) − V(sₜ)</text></svg>
