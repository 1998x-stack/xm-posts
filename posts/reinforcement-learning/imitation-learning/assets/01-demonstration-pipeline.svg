<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="il-fig1-title il-fig1-desc">
<title id="il-fig1-title">专家示范到闭环策略的学习流程</title><desc id="il-fig1-desc">专家产生状态动作轨迹，数据集训练策略，策略进入环境执行，环境再返回新的观测形成闭环。</desc>
