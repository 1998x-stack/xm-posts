<g><rect x="30" y="84" width="170" height="122" rx="16" fill="#d8eee8" stroke="#6aa69a" stroke-width="2"/><text x="115" y="119" text-anchor="middle" font-size="21" font-weight="700" fill="#244e4b">专家 / 人类</text><text x="115" y="151" text-anchor="middle" font-size="16" fill="#315f5a">观测与动作</text><text x="115" y="179" text-anchor="middle" font-size="14" fill="#315f5a">示范轨迹 τ</text></g>
<g><rect x="252" y="84" width="168" height="122" rx="16" fill="#fff0db" stroke="#d59b4e" stroke-width="2"/><text x="336" y="119" text-anchor="middle" font-size="21" font-weight="700" fill="#714d1c">示范数据集</text><text x="336" y="151" text-anchor="middle" font-size="16" fill="#805c2b">Dₑ = {(s, a)}</text><text x="336" y="179" text-anchor="middle" font-size="14" fill="#805c2b">清洗 / 对齐 / 标注</text></g>
<g><rect x="472" y="84" width="168" height="122" rx="16" fill="#e9e4fb" stroke="#8a79c4" stroke-width="2"/><text x="556" y="119" text-anchor="middle" font-size="21" font-weight="700" fill="#4d417e">学习策略</text><text x="556" y="151" text-anchor="middle" font-size="16" fill="#5e5290">πθ(a | s)</text><text x="556" y="179" text-anchor="middle" font-size="14" fill="#5e5290">监督 / 生成 / 推断</text></g>
