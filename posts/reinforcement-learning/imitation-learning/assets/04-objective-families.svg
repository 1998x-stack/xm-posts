<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="il-fig4-title il-fig4-desc">
<title id="il-fig4-title">行为克隆、逆强化学习与 GAIL 的学习目标对比</title><desc id="il-fig4-desc">行为克隆直接从状态动作对学习策略；逆强化学习先从专家轨迹推断奖励，再优化策略；GAIL 通过判别器比较专家和学习者的状态动作分布并更新策略。</desc>
<rect x="10" y="10" width="880" height="370" rx="18" fill="#f7faf8"/>
<g><rect x="28" y="48" width="260" height="292" rx="14" fill="#edf6f1" stroke="#c7dfd4"/><text x="158" y="82" text-anchor="middle" font-size="21" font-weight="700" fill="#28584f">Behavior Cloning</text><rect x="65" y="111" width="186" height="56" rx="10" fill="#d8eee8"/><text x="158" y="146" text-anchor="middle" font-size="17" fill="#244e4b">专家 (s, a) 数据</text><path d="M158 167 V208" stroke="#477b78" stroke-width="3"/><path d="M151 199 L158 210 L165 199" fill="none" stroke="#477b78" stroke-width="3"/><rect x="65" y="210" width="186" height="56" rx="10" fill="#e9e4fb"/><text x="158" y="245" text-anchor="middle" font-size="17" fill="#4d417e">监督学习 πθ</text><text x="158" y="306" text-anchor="middle" font-size="14" fill="#536d69">直接拟合专家动作</text></g>
<g><rect x="320" y="48" width="260" height="292" rx="14" fill="#fff6e9" stroke="#ead9b8"/><text x="450" y="82" text-anchor="middle" font-size="21" font-weight="700" fill="#805a24">Inverse RL</text><rect x="357" y="111" width="186" height="50" rx="10" fill="#fff0db"/><text x="450" y="142" text-anchor="middle" font-size="17" fill="#714d1c">专家轨迹 τE</text><path d="M450 161 V190" stroke="#b58a43" stroke-width="3"/><path d="M443 181 L450 192 L457 181" fill="none" stroke="#b58a43" stroke-width="3"/><rect x="357" y="192" width="186" height="50" rx="10" fill="#f7e6e1"/><text x="450" y="223" text-anchor="middle" font-size="17" fill="#824637">推断奖励 Rψ</text><path d="M450 242 V271" stroke="#b58a43" stroke-width="3"/><path d="M443 262 L450 273 L457 262" fill="none" stroke="#b58a43" stroke-width="3"/><rect x="357" y="273" width="186" height="42" rx="10" fill="#e9e4fb"/><text x="450" y="300" text-anchor="middle" font-size="16" fill="#4d417e">再优化策略 π</text></g>
