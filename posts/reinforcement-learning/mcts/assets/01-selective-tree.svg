<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 305" width="840" height="305" role="img" aria-labelledby="mc01-t mc01-d"><title id="mc01-t">有限预算与非对称搜索</title><desc id="mc01-d">右边树优先探索有希望的分支，左边平均试探。</desc><rect width="840" height="305" rx="15" fill="#fbfdfb"/><text x="205" y="39" text-anchor="middle" font-family="system-ui,Arial" font-size="21" fill="#2c5658" font-weight="600">均匀：每条路都试</text><text x="630" y="39" text-anchor="middle" font-family="system-ui,Arial" font-size="21" fill="#237c70" font-weight="600">MCTS：让预算有偏向</text><circle cx="205" cy="98" r="27" fill="#dbefe6" stroke="#9fc6b8" stroke-width="2"/><text x="205" y="104" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">根</text><circle cx="630" cy="98" r="27" fill="#cae9dd" stroke="#9fc6b8" stroke-width="2"/><text x="630" y="104" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">根</text><path d="M205 124L90 182" stroke="#8daca4" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="90" cy="209" r="27" fill="#f1f4f2" stroke="#9fc6b8" stroke-width="2"/><text x="90" y="215" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">5</text><path d="M205 124L170 182" stroke="#8daca4" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="170" cy="209" r="27" fill="#f1f4f2" stroke="#9fc6b8" stroke-width="2"/><text x="170" y="215" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">5</text><path d="M205 124L250 182" stroke="#8daca4" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="250" cy="209" r="27" fill="#f1f4f2" stroke="#9fc6b8" stroke-width="2"/><text x="250" y="215" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">5</text><path d="M205 124L330 182" stroke="#8daca4" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="330" cy="209" r="27" fill="#f1f4f2" stroke="#9fc6b8" stroke-width="2"/><text x="330" y="215" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">5</text><path d="M630 124L515 182" stroke="#b4cac2" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="515" cy="209" r="27" fill="#ecf3ef" stroke="#9fc6b8" stroke-width="2"/><text x="515" y="215" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">2</text><path d="M630 124L590 182" stroke="#b4cac2" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="590" cy="209" r="27" fill="#ecf3ef" stroke="#9fc6b8" stroke-width="2"/><text x="590" y="215" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">6</text><path d="M630 124L665 182" stroke="#2d887e" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="665" cy="209" r="27" fill="#a7dbc9" stroke="#9fc6b8" stroke-width="2"/><text x="665" y="215" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">15</text><path d="M630 124L740 182" stroke="#b4cac2" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="740" cy="209" r="27" fill="#ecf3ef" stroke="#9fc6b8" stroke-width="2"/><text x="740" y="215" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">1</text><text x="205" y="273" text-anchor="middle" font-family="system-ui,Arial" font-size="15" fill="#718a81" font-weight="600">每个候选得到相似的访问数</text><text x="630" y="273" text-anchor="middle" font-family="system-ui,Arial" font-size="15" fill="#237c70" font-weight="600">更好的分支获得更多模拟</text></svg>