<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 303" width="840" height="303" role="img" aria-labelledby="mc02-t mc02-d"><title id="mc02-t">MCTS 四阶段</title><desc id="mc02-d">选择、扩展、模拟、回传构成一个迭代。</desc><rect width="840" height="303" rx="15" fill="#fbfdfb"/><text x="420" y="39" text-anchor="middle" font-family="system-ui,Arial" font-size="19" fill="#2c5658" font-weight="600">从根节点开始，每次模拟只更新自己走过的路径</text><rect x="16" y="90" width="185" height="130" rx="10" fill="#e5f1e9" stroke="#c3d9d1" stroke-width="2"/><text x="108" y="127" text-anchor="middle" font-family="system-ui,Arial" font-size="14" fill="#b67d52" font-weight="800">01</text><text x="108" y="162" text-anchor="middle" font-family="system-ui,Arial" font-size="19" fill="#286d6b" font-weight="800">Selection</text><text x="108" y="193" text-anchor="middle" font-family="system-ui,Arial" font-size="15" fill="#2c5658" font-weight="600">树内选路</text><rect x="226" y="90" width="185" height="130" rx="10" fill="#fff0e4" stroke="#c3d9d1" stroke-width="2"/><text x="318" y="127" text-anchor="middle" font-family="system-ui,Arial" font-size="14" fill="#b67d52" font-weight="800">02</text><text x="318" y="162" text-anchor="middle" font-family="system-ui,Arial" font-size="19" fill="#286d6b" font-weight="800">Expansion</text><text x="318" y="193" text-anchor="middle" font-family="system-ui,Arial" font-size="15" fill="#2c5658" font-weight="600">扩展动作</text><rect x="436" y="90" width="185" height="130" rx="10" fill="#eeeafa" stroke="#c3d9d1" stroke-width="2"/><text x="528" y="127" text-anchor="middle" font-family="system-ui,Arial" font-size="14" fill="#b67d52" font-weight="800">03</text><text x="528" y="162" text-anchor="middle" font-family="system-ui,Arial" font-size="19" fill="#286d6b" font-weight="800">Simulation</text><text x="528" y="193" text-anchor="middle" font-family="system-ui,Arial" font-size="15" fill="#2c5658" font-weight="600">估计回报</text><rect x="646" y="90" width="185" height="130" rx="10" fill="#e5f1e9" stroke="#c3d9d1" stroke-width="2"/><text x="738" y="127" text-anchor="middle" font-family="system-ui,Arial" font-size="14" fill="#b67d52" font-weight="800">04</text><text x="738" y="162" text-anchor="middle" font-family="system-ui,Arial" font-size="19" fill="#286d6b" font-weight="800">Backprop</text><text x="738" y="193" text-anchor="middle" font-family="system-ui,Arial" font-size="15" fill="#2c5658" font-weight="600">更新统计</text><path d="M175 249L665 249" stroke="#329180" stroke-width="3" fill="none" stroke-linecap="round"/><text x="420" y="282" text-anchor="middle" font-family="system-ui,Arial" font-size="15" fill="#397d74" font-weight="600">回传后的访问记录用于下一次 Selection</text></svg>