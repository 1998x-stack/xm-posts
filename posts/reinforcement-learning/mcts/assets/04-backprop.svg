<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-labelledby="mc04-t mc04-d"><title id="mc04-t">回传更新沿途统计</title><desc id="mc04-d">获得模拟结果后仅给访问过的节点更新次数和累计收益。</desc><rect width="840" height="310" rx="15" fill="#fbfdfb"/><circle cx="420" cy="64" r="27" fill="#d6efe4" stroke="#9fc6b8" stroke-width="2"/><text x="420" y="70" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">根</text><circle cx="420" cy="157" r="27" fill="#e4f2e9" stroke="#9fc6b8" stroke-width="2"/><text x="420" y="163" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">子</text><circle cx="420" cy="250" r="27" fill="#ffe8d6" stroke="#9fc6b8" stroke-width="2"/><text x="420" y="256" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">叶</text><path d="M420 223L420 189" stroke="#298b7b" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M420 127L420 95" stroke="#298b7b" stroke-width="4" fill="none" stroke-linecap="round"/><text x="590" y="68" text-anchor="middle" font-family="system-ui,Arial" font-size="20" fill="#2a8073" font-weight="600">N ← N + 1</text><text x="590" y="100" text-anchor="middle" font-family="system-ui,Arial" font-size="20" fill="#2a8073" font-weight="600">W ← W + G</text><text x="595" y="250" text-anchor="middle" font-family="system-ui,Arial" font-size="18" fill="#a96e44" font-weight="600">Rollout 得到 G</text><text x="211" y="146" text-anchor="middle" font-family="system-ui,Arial" font-size="18" fill="#527a70" font-weight="600">只更新该路径</text><text x="205" y="179" text-anchor="middle" font-family="system-ui,Arial" font-size="18" fill="#527a70" font-weight="600">不更新兄弟节点</text></svg>