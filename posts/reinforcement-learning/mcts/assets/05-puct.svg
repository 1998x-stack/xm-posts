<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 311" width="840" height="311" role="img" aria-labelledby="mc05-t mc05-d"><title id="mc05-t">UCT 和后续 PUCT 的区别</title><desc id="mc05-d">PUCT 的探索项由神经网络策略先验加权，叶子可用网络价值评估。</desc><rect width="840" height="311" rx="15" fill="#fbfdfb"/><rect x="18" y="61" width="380" height="194" rx="10" fill="#e7f3ee" stroke="#c3d9d1" stroke-width="2"/><rect x="442" y="61" width="380" height="194" rx="10" fill="#f0ecf9" stroke="#c3d9d1" stroke-width="2"/><text x="210" y="105" text-anchor="middle" font-family="system-ui,Arial" font-size="28" fill="#20786c" font-weight="800">UCT</text><text x="630" y="105" text-anchor="middle" font-family="system-ui,Arial" font-size="28" fill="#725e9c" font-weight="800">PUCT</text><text x="210" y="150" text-anchor="middle" font-family="system-ui,Arial" font-size="19" fill="#2c5658" font-weight="600">Q + counts bonus</text><text x="630" y="150" text-anchor="middle" font-family="system-ui,Arial" font-size="19" fill="#675d86" font-weight="600">Q + prior P × bonus</text><text x="210" y="195" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#2c5658" font-weight="600">模型模拟 / Rollout</text><text x="630" y="195" text-anchor="middle" font-family="system-ui,Arial" font-size="17" fill="#675d86" font-weight="600">神经策略先验 / 价值网络</text><text x="420" y="295" text-anchor="middle" font-family="system-ui,Arial" font-size="14" fill="#7a8f86" font-weight="600">不要将 AlphaZero 搜索公式回写成 2006 UCT 的原式</text></svg>