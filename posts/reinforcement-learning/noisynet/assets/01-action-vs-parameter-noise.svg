<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" role="img" aria-label="逐步抖动与参数空间噪声对照"><title>逐步抖动与参数空间噪声对照</title><desc>上方每步随机动作打断连续探索，下方一组参数扰动在多步内形成一致方向。</desc><rect width="800" height="326" rx="15" fill="#fcfdfb"/><text x="28" y="37" font-size="16" fill="#a45a36">ACTION NOISE · 每一步重新掷骰</text><text x="28" y="175" font-size="16" fill="#197970">PARAMETER NOISE · 一组权重改变整段策略</text><rect x="34" y="53" width="165" height="76" rx="13" fill="#fff1e5" stroke="#e8c5a4" stroke-width="1.5"/><text x="116.5" y="84" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">step 1</text><text x="116.5" y="111" font-size="14" text-anchor="middle" fill="#4e666b">向左 / random</text><rect x="226" y="53" width="165" height="76" rx="13" fill="#fff1e5" stroke="#e8c5a4" stroke-width="1.5"/><text x="308.5" y="84" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">step 2</text><text x="308.5" y="111" font-size="14" text-anchor="middle" fill="#4e666b">向右 / random</text><rect x="418" y="53" width="165" height="76" rx="13" fill="#fff1e5" stroke="#e8c5a4" stroke-width="1.5"/><text x="500.5" y="84" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">step 3</text><text x="500.5" y="111" font-size="14" text-anchor="middle" fill="#4e666b">向左 / random</text><rect x="610" y="53" width="165" height="76" rx="13" fill="#fff1e5" stroke="#e8c5a4" stroke-width="1.5"/><text x="692.5" y="84" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">step 4</text><text x="692.5" y="111" font-size="14" text-anchor="middle" fill="#4e666b">向右 / random</text><rect x="34" y="192" width="165" height="76" rx="13" fill="#e9f5f0" stroke="#9bcdc0" stroke-width="1.5"/><text x="116.5" y="223" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">step 1</text><text x="116.5" y="250" font-size="14" text-anchor="middle" fill="#4e666b">保持向右 / policy</text><rect x="226" y="192" width="165" height="76" rx="13" fill="#e9f5f0" stroke="#9bcdc0" stroke-width="1.5"/><text x="308.5" y="223" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">step 2</text><text x="308.5" y="250" font-size="14" text-anchor="middle" fill="#4e666b">保持向右 / policy</text><rect x="418" y="192" width="165" height="76" rx="13" fill="#e9f5f0" stroke="#9bcdc0" stroke-width="1.5"/><text x="500.5" y="223" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">step 3</text><text x="500.5" y="250" font-size="14" text-anchor="middle" fill="#4e666b">保持向右 / policy</text><rect x="610" y="192" width="165" height="76" rx="13" fill="#e9f5f0" stroke="#9bcdc0" stroke-width="1.5"/><text x="692.5" y="223" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">step 4</text><text x="692.5" y="250" font-size="14" text-anchor="middle" fill="#4e666b">保持向右 / policy</text><path d="M199 93 L226 93" stroke="#24817a" stroke-width="3" fill="none"/><path d="M217 87 L226 93 L217 99" fill="none" stroke="#24817a" stroke-width="3" stroke-linejoin="round"/><path d="M391 93 L418 93" stroke="#24817a" stroke-width="3" fill="none"/><path d="M409 87 L418 93 L409 99" fill="none" stroke="#24817a" stroke-width="3" stroke-linejoin="round"/><path d="M583 93 L610 93" stroke="#24817a" stroke-width="3" fill="none"/><path d="M601 87 L610 93 L601 99" fill="none" stroke="#24817a" stroke-width="3" stroke-linejoin="round"/><path d="M199 232 L226 232" stroke="#24817a" stroke-width="3" fill="none"/><path d="M217 226 L226 232 L217 238" fill="none" stroke="#24817a" stroke-width="3" stroke-linejoin="round"/><path d="M391 232 L418 232" stroke="#24817a" stroke-width="3" fill="none"/><path d="M409 226 L418 232 L409 238" fill="none" stroke="#24817a" stroke-width="3" stroke-linejoin="round"/><path d="M583 232 L610 232" stroke="#24817a" stroke-width="3" fill="none"/><path d="M601 226 L610 232 L601 238" fill="none" stroke="#24817a" stroke-width="3" stroke-linejoin="round"/><text x="38" y="300" font-size="13" fill="#435d62">这是教学示意：参数扰动让状态依赖的行为在若干时间步内保持相关，并非