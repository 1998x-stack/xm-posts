<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-label="Noisy Linear 层：均值通路与噪声通路"><title>Noisy Linear 层：均值通路与噪声通路</title><desc>输入 x 经由可学习均值权重与可学习尺度乘随机扰动共同影响输出 y。</desc><rect width="800" height="310" rx="15" fill="#fcfdfb"/><rect x="35" y="112" width="148" height="86" rx="13" fill="#e9f3f0" stroke="#a7ccc2" stroke-width="1.5"/><text x="109" y="143" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">输入 x</text><text x="109" y="170" font-size="14" text-anchor="middle" fill="#4e666b">p 个输入</text><rect x="294" y="40" width="215" height="83" rx="13" fill="#e6f2ee" stroke="#a7ccc2" stroke-width="1.5"/><text x="401.5" y="71" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">均值 μ</text><text x="401.5" y="98" font-size="14" text-anchor="middle" fill="#4e666b">μᵂ · x + μᵇ</text><rect x="294" y="192" width="215" height="83" rx="13" fill="#fff2e7" stroke="#e2b38d" stroke-width="1.5"/><text x="401.5" y="223" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">噪声 σ ⊙ ε</text><text x="401.5" y="250" font-size="14" text-anchor="middle" fill="#4e666b">σᵂ, σᵇ 均可学习</text><rect x="620" y="112" width="150" height="86" rx="13" fill="#e9f3f0" stroke="#a7ccc2" stroke-width="1.5"/><text x="695" y="143" font-size="20" font-weight="700" text-anchor="middle" fill="#234148">输出 y</text><text x="695" y="170" font-size="14" text-anchor="middle" fill="#4e666b">q 个输出</text><path d="M183 151 L286 82" stroke="#24817a" stroke-width="3" fill="none"/><path d="M277 76 L286 82 L277 88" fill="none" stroke="#24817a" stroke-width="3" stroke-linejoin="round"/><path d="M183 165 L286 233" stroke="#ba6c3c" stroke-width="3" fill="none"/><path d="M277 227 L286 233 L277 239" fill="none" stroke="#ba6c3c" stroke-width="3" stroke-linejoin="round"/><path d="M509 82 L612 145" stroke="#24817a" stroke-width="3" fill="none"/><path d="M603 139 L612 145 L603 151" fill="none" stroke="#24817a" stroke-width="3" stroke-linejoin="round"/><path d="M50