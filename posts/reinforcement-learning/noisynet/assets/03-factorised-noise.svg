<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-label="独立噪声和因子化噪声的采样成本"><title>独立噪声和因子化噪声的采样成本</title><desc>以四输入二输出为例，独立高斯需要十个随机抽样，因子化只需要六个，但可学习参数仍逐连接保留。</desc><rect width="800" height="310" rx="15" fill="#fcfdfb"/><text x="43" y="37" font-size="20" fill="#9f5a36">Independent Gaussian noise</text><text x="431" y="37" font-size="20" fill="#197970">Factorised Gaussian noise</text><rect x="48" y="57" width="58" height="56" rx="7" fill="#fbe4cd" stroke="#d3b89c"/><text x="57" y="91" font-size="15" fill="#805238">ε11</text><rect x="117" y="57" width="58" height="56" rx="7" fill="#f4d9b7" stroke="#d3b89c"/><text x="126" y="91" font-size="15" fill="#805238">ε12</text><rect x="186" y="57" width="58" height="56" rx="7" fill="#f9e8d6" stroke="#d3b89c"/><text x="195" y="91" font-size="15" fill="#805238">ε13</text><rect x="255" y="57" width="58" height="56" rx="7" fill="#eed2ae" stroke="#d3b89c"/><text x="264" y="91" font-size="15" fill="#805238">ε14</text><rect x="48" y="125" width="58" height="56" rx="7" fill="#f4d9b7" stroke="#d3b89c"/><text x="57" y="159" font-size="15" fill="#805238">ε21</text><rect x="117" y="125" width="58" height="56" rx="7" fill="#f9e8d6" stroke="#d3b89c"/><text x="126" y="159" font-size="15" fill="#805238">ε22</text><rect x="186" y="125" width="58" height="56" rx="7" fill="#eed2ae" stroke="#d3b89c"/><text x="195" y="159" font-size="15" fill="#805238">ε23</text><rect x="255" y="125" width="58" height="56" rx="7" fill="#fbe4cd" stroke="#d3b89c"/><text x="264" y="159" font-size="15" fill="#805238">ε24</text><rect x="455" y="57" width="58" height="56" rx="7" fill="#e4f2ed" stroke="#9ec8bb"/><text x="460" y="91" font-size="13" fill="#25645a">u1v1</text><rect x="522" y="57" width="58" height="56" rx="7" fill="#e4f2ed" stroke="#9ec8bb"/><text x="527" y="91" font-size="13" fill="#25645a">u1v2</text><rect x="589" y="57" width="58" height="56" rx="7" fill="#e4f2ed" stroke="#9ec8bb"/><text x="594" y="91" font-size="13" fill="#25645a">u1v3</text><rect x="656" y="57" width="58" height="56" rx="7" fill="#e4f2ed" stroke="#9ec8bb"/><text x="661" y="91" font-size="13" fill="#25645a">u1v4</text><rect x="455" y="125" width="58" height="56" rx="7" fill="#cfe9e0" stroke="#9ec8bb"/><text x="460" y="159" font-size="13" fill="#25645a">u2v1</text><rect x="522" y="125" width="58" height="56" rx="7" fill="#cfe9e0" stroke="#9ec8bb"/><text x="527" y="159" font-size="13" fill="#25645a">u2v2</text><rect x="589" y="125" width="58" height="56" rx="7" fill="#cfe9e0" stroke="#9ec8bb"/><text x="594" y="159" font-size="13" fill="#25645a">u2v3</text><rect x="656" y="125" width="58" height="56" rx="7" fill="#cfe9e0" stroke="#9ec8bb"/><text x="661" y="159" font-size="13" fill="#25645a">u2v4</text><text x="47" y="243" font-size="16" fill="#865a36">p·q + q 个独立随机量（含 bias）</text><text x="450" y="243" font-size="16" fill="#256d66">p + q 个独立随机量（含 bias）</text><text x="46" y="280" font-size="15" fill="#435d62">示例 p = 4, q = 2：独立 10 个；因子化 6 个；σ 的参数数目并未减少。</text></svg>
