<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ppo-s1-title ppo-s1-desc" data-export="rollout-loop.svg" viewBox="0 0 780 300" width="780" height="300" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="ppo-s1-title">rollout-loop</title><desc id="ppo-s1-desc">由旧策略采集轨迹，估计优势，多轮优化后重新采样。</desc><rect width="780" height="300" rx="14" fill="#fbfcfa"/><rect x="24" y="90" width="166" height="98" rx="10" fill="#e9f2f6" stroke="#c2d8df" stroke-width="1.6"/><text x="107" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#347f99">环境</text><text x="107" y="157" text-anchor="middle" font-size="14" fill="#526d70">状态·动作·奖励</text><rect x="217" y="90" width="164" height="98" rx="10" fill="#fff1e8" stroke="#eed2bf" stroke-width="1.6"/><text x="299" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#c47749">π_old 采样</text><text x="299" y="157" text-anchor="middle" font-size="14" fill="#526d70">固定轨迹</text><rect x="408" y="90" width="164" height="98" rx="10" fill="#f2eff9" stroke="#d8d0e9" stroke-width="1.6"/><text x="490" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#7561a4">计算优势</text><text x="490" y="157" text-anchor="middle" font-size="14" fill="#526d70">Â 与旧 log p</text><rect x="599" y="90" width="162" height="98" rx="10" fill="#edf5f0" stroke="#c9dcd3" stroke-width="1.6"/><text x="680" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#284249">多轮更新</text><text x="680" y="157" text-anchor="middle" font-size="14" fill="#526d70">K 个 epoch</text><path d="M190 139H215 M381 139H406 M572 139H597" stroke="#278179" stroke-width="3"  fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 190V248H110V190" stroke="#278179" stroke-width="2" stroke-dasharray="7 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="394" y="275" font-size="15" text-anchor="middle" font-weight="600" fill="#278179">下一迭代用更新后的策略重新采样，而不是永久复用旧数据</text></svg>
