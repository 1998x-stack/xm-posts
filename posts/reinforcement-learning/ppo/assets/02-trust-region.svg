<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ppo-s2-title ppo-s2-desc" data-export="trust-region-comparison.svg" viewBox="0 0 780 300" width="780" height="300" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="ppo-s2-title">trust-region-comparison</title><desc id="ppo-s2-desc">直接重复策略梯度、TRPO 约束、PPO 裁剪代理目标对比。</desc><rect width="780" height="300" rx="14" fill="#fbfcfa"/><rect x="28" y="72" width="220" height="135" rx="10" fill="#fff0e8" stroke="#eed0bd" stroke-width="1.6"/><text x="138" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#c47749">普通 PG</text><text x="138" y="139" text-anchor="middle" font-size="14" fill="#526d70">多步更新缺乏保护</text><rect x="279" y="72" width="220" height="135" rx="10" fill="#f1eef9" stroke="#dad1e9" stroke-width="1.6"/><text x="389" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#7561a4">TRPO</text><text x="389" y="139" text-anchor="middle" font-size="14" fill="#526d70">最大平均 KL 约束</text><rect x="531" y="72" width="220" height="135" rx="10" fill="#eaf5ee" stroke="#c8dfd1" stroke-width="1.6"/><text x="641" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#278179">PPO-Clip</text><text x="641" y="139" text-anchor="middle" font-size="14" fill="#526d70">去掉过度获益的激励</text><text x="139" y="252" font-size="15" text-anchor="middle" font-weight="600" fill="#c47749">可能过度更新</text><text x="389" y="252" font-size="15" text-anchor="middle" font-weight="600" fill="#7561a4">显式约束、求解复杂</text><text x="639" y="252" font-size="15" text-anchor="middle" font-weight="600" fill="#278179">一阶优化、非硬约束</text></svg>
