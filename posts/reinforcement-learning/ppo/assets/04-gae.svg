<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ppo-s4-title ppo-s4-desc" data-export="gae-time-recursion.svg" viewBox="0 0 780 300" width="780" height="300" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="ppo-s4-title">gae-time-recursion</title><desc id="ppo-s4-desc">三个时间步的 TD 残差按 γλ 权重向前累加，真实终止状态截断未来项。</desc><rect width="780" height="300" rx="14" fill="#fbfcfa"/><rect x="46" y="87" width="181" height="99" rx="10" fill="#eaf4ef" stroke="#c5dfd1" stroke-width="1.6"/><text x="136.5" y="125" text-anchor="middle" font-size="19" font-weight="700" fill="#278179">δₜ</text><text x="136.5" y="154" text-anchor="middle" font-size="14" fill="#526d70">TD residual</text><rect x="300" y="87" width="181" height="99" rx="10" fill="#edf2fa" stroke="#c9d6ee" stroke-width="1.6"/><text x="390.5" y="125" text-anchor="middle" font-size="19" font-weight="700" fill="#347f99">δₜ₊₁</text><text x="390.5" y="154" text-anchor="middle" font-size="14" fill="#526d70">weighted by γλ</text><rect x="554" y="87" width="181" height="99" rx="10" fill="#f3eef9" stroke="#dcd2ea" stroke-width="1.6"/><text x="644.5" y="125" text-anchor="middle" font-size="19" font-weight="700" fill="#7561a4">δₜ₊₂</text><text x="644.5" y="154" text-anchor="middle" font-size="14" fill="#526d70">weighted by (γλ)²</text><path d="M227 137H295 M481 137H549" stroke="#278179" stroke-width="3"  fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="226" font-size="22" text-anchor="middle" font-weight="600" fill="#284249">Âₜ = δₜ + γλ·δₜ₊₁ + (γλ)²·δₜ₊₂ + …</text><text x="390" y="267" font-size="15" text-anchor="middle" font-weight="600" fill="#658080">terminal ⇒ 后续项归零；truncation ⇒ 视情形 bootstrap</text></svg>
