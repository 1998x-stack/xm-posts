<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ppo-s6-title ppo-s6-desc" data-export="old-versus-reference.svg" viewBox="0 0 780 303" width="780" height="303" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="ppo-s6-title">old-versus-reference</title><desc id="ppo-s6-desc">旧策略是每轮采样时的快照，参考策略是 RLHF 场景中独立的固定锚点。</desc><rect width="780" height="303" rx="14" fill="#fbfcfa"/><rect x="23" y="67" width="218" height="122" rx="10" fill="#fff1e7" stroke="#edd2bc" stroke-width="1.6"/><text x="132" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#c47749">π_old</text><text x="132" y="134" text-anchor="middle" font-size="14" fill="#526d70">当前数据采样快照</text><rect x="281" y="67" width="218" height="122" rx="10" fill="#e8f4ed" stroke="#c7dfd0" stroke-width="1.6"/><text x="390" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#278179">πθ</text><text x="390" y="134" text-anchor="middle" font-size="14" fill="#526d70">正在更新的策略</text><rect x="539" y="67" width="218" height="122" rx="10" fill="#f2eef9" stroke="#ddd4ec" stroke-width="1.6"/><text x="648" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#7561a4">π_ref</text><text x="648" y="134" text-anchor="middle" font-size="14" fill="#526d70">固定参考模型</text><path d="M245 128H277" stroke="#278179" stroke-width="3"  fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M503 128H535" stroke="#7561a4" stroke-width="3" stroke-dasharray="7 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="256" y="47" font-size="15" text-anchor="middle" font-weight="600" fill="#c47749">PPO ratio / policy KL</text><text x="635" y="47" font-size="15" text-anchor="middle" font-weight="600" fill="#7561a4">RLHF reference KL</text><text x="390" y="239" font-size="17" text-anchor="middle" font-weight="600" fill="#284249">两种不同的比较参照，不能把指标当作同一个 KL</text><text x="390" y="273" font-size="14" text-anchor="middle" font-weight="600" fill="#658080">具体 KL 方向、估计方式与系数由实现决定</text></svg>
