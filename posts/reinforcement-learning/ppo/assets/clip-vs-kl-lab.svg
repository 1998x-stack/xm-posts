<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 297" role="img" aria-labelledby="title desc"><title id="title">PPO 裁剪目标已不变但策略 KL 距离仍增长</title><desc id="desc">旧策略 A B 各百分之五十。新策略 A 为百分之六十与九十时裁剪目标均为零点二，但 KL 从零点零二增至零点五一。</desc><rect width="820" height="297" rx="16" fill="#fdfdfa"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="24" y="37" fill="#284249" font-size="21" font-weight="700">代理目标进入平台 ≠ 策略概率被锁定</text>
<rect x="23" y="55" width="373" height="187" rx="12" fill="#e8f4ef" stroke="#b4d6c5"/><rect x="425" y="55" width="371" height="187" rx="12" fill="#fcf0e5" stroke="#e5caae"/>
<text x="42" y="85" fill="#216c66" font-size="17" font-weight="700">新策略 p(A) = 0.60</text>
<rect x="42" y="100" width="327" height="23" rx="5" fill="#d4a17c"/><rect x="42" y="100" width="196.2" height="23" rx="5" fill="#2a8178"/>
<text x="42" y="151" fill="#27494b" font-size="15">Lclip = 0.200</text><text x="42" y="176" fill="#27494b" font-size="15">KL(old∥new) ≈ 0.020</text><text x="42" y="215" fill="#216c66" font-size="14">刚到 ε = 0.2 边界</text>
<text x="445" y="85" fill="#9d5c36" font-size="17" font-weight="700">新策略 p(A) = 0.90</text>
<rect x="445" y="100" width="325" height="23" rx="5" fill="#d4a17c"/><rect x="445" y="100" width="292.5" height="23" rx="5" fill="#2a8178"/>
<text x="445" y="151" fill="#27494b" font-size="15">Lclip = 0.200（未继续增长）</text><text x="445" y="176" fill="#27494b" font-size="15">KL(old∥new) ≈ 0.511</text><text x="445" y="215" fill="#9d5c36" font-size="14">概率已明显远离旧策略</text>
<text x="25" y="276" fill="#536d70" font-size="14">青色 = 动作 A；赭色 = 动作 B；数值来自两样本教学算例。</text></g></svg>
