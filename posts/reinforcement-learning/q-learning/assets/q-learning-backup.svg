<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" role="img" aria-labelledby="title desc"><title id="title">Q-learning 单步更新机制</title><desc id="desc">从状态与动作得到奖励及下一状态，选下一状态最大 Q 值，形成 TD 目标并更新原 Q 值。</desc><rect width="860" height="370" rx="22" fill="#f4f8f6"/><g font-family="sans-serif" text-anchor="middle"><rect x="36" y="65" width="160" height="94" rx="14" fill="#dbece7" stroke="#1b756b" stroke-width="2"/><text x="116" y="102" font-size="22" fill="#164e49">当前 (s,a)</text><text x="116" y="130" font-size="17" fill="#164e49">Q = 2.0</text><path d="M198 112H284" stroke="#315c65" stroke-width="4"/><path d="m276 102 14 10-14 10" fill="none" stroke="#315c65" stroke-width="4"/><rect x="291" y="65" width="225" height="94" rx="14" fill="#e7edf8" stroke="#4a6e9a" stroke-width="2"/><text x="403" y="101" font-size="21" fill="#244a72">观察奖励 r = 1</text><text x="403" y="131" font-size="18" fill="#244a72">下一状态 s'</text><path d="M518 112H605" stroke="#315c65" stroke-width="4"/><path d="m597 102 14 10-14 10" fill="none" stroke="#315c65" stroke-width="4"/><rect x="612" y="65" width="213" height="94" rx="14" fill="#f9ead6" stroke="#aa7540" stroke-width="2"/><text x="718" y="102" font-size="19" fill="#74471c">max Q(s',·) = 4</text><text x="718" y="131" font-size="16" fill="#74471c">γ = 0.9</text><path d="M718 160V214H428" stroke="#315c65" stroke-width="3" fill="none"/><path d="m438 205-12 9 12 9" fill="none" stroke="#315c65" stroke-width="3"/><rect x="247" y="214" width="371" height="106" rx="16" fill="#17695f"/><text x="432" y="249" font-size="22" fill="#fff">目标 y = 1 + 0.9 × 4 = 4.6</text><text x="432" y="283" font-size="20" fill="#fff">α = 0.5 → 新 Q = 3.3</text></g></svg>