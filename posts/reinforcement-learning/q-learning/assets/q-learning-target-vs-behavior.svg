<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Q-learning 的行为策略与目标策略</title><desc id="desc">左侧 epsilon-greedy 行为策略实际探索动作，右侧学习目标使用下一状态最大 Q 值，两条路径不同，体现离策略学习。</desc><rect width="900" height="430" rx="24" fill="#f7faf8"/><g font-family="sans-serif"><text x="38" y="54" font-size="29" font-weight="700" fill="#173e41">行为策略 ≠ 更新目标</text><rect x="38" y="88" width="390" height="272" rx="18" fill="#e4f2ed" stroke="#167467" stroke-width="2"/><rect x="472" y="88" width="390" height="272" rx="18" fill="#eaf0fa" stroke="#466c9d" stroke-width="2"/><text x="64" y="132" font-size="23" font-weight="700" fill="#14574f">实际交互：ε-greedy</text><text x="64" y="175" font-size="19" fill="#244c49">探索动作 a，获得样本</text><text x="64" y="217" font-size="20" fill="#244c49">(s, a, r, s′)</text><text x="64" y="270" font-size="18" fill="#244c49">可能不是当前最优动作</text><text x="498" y="132" font-size="23" font-weight="700" fill="#254d7c">学习目标：greedy</text><text x="498" y="175" font-size="19" fill="#254d7c">从下一状态 s′ 选择最大值</text><text x="498" y="217" font-size="22" fill="#254d7c">r + γ max Q(s′, a′)</text><text x="498" y="270" font-size="18" fill="#254d7c">不要求实际执行该动作</text><path d="M428 224H472" stroke="#456b71" stroke-width="4"/><path d="m462 215 11 9-11 9" fill="none" stroke="#456b71" stroke-width="3"/><text x="40" y="400" font-size="17" fill="#52686b">表格型 Q-learning：利用探索得到的样本，逼近贪心目标策略的动作价值。</text></g></svg>