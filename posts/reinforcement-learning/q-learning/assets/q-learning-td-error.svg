<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">TD 误差如何修正 Q 值</title><desc id="desc">旧估计 2.0、TD 目标 4.6、学习率 0.5 时，新估计为 3.3，处于两者中点。</desc><rect width="900" height="420" rx="24" fill="#f8faf7"/><g font-family="sans-serif"><text x="44" y="56" font-size="28" font-weight="700" fill="#183f46">一次 TD 更新 = 朝目标移动一部分</text><line x1="95" y1="226" x2="814" y2="226" stroke="#48666b" stroke-width="5"/><g stroke="#48666b" stroke-width="3"><line x1="125" y1="210" x2="125" y2="243"/><line x1="455" y1="210" x2="455" y2="243"/><line x1="785" y1="210" x2="785" y2="243"/></g><circle cx="125" cy="226" r="14" fill="#a35a37"/><circle cx="455" cy="226" r="14" fill="#167467"/><circle cx="785" cy="226" r="14" fill="#416ea1"/><text x="85" y="186" font-size="21" fill="#8a482b">旧 Q = 2.0</text><text x="387" y="186" font-size="21" fill="#145d53">新 Q = 3.3</text><text x="712" y="186" font-size="21" fill="#315985">目标 y = 4.6</text><path d="M143 279H438" stroke="#167467" stroke-width="4"/><path d="m426 269 13 10-13 10" fill="none" stroke="#167467" stroke-width="3"/><text x="228" y="316" font-size="19" fill="#145d53">α = 0.5</text><text x="45" y="372" font-size="20" fill="#294d52">TD 误差 δ = y − Q = 2.6；更新量 αδ = 1.3；Q ← 2 + 1.3 = 3.3</text></g></svg>