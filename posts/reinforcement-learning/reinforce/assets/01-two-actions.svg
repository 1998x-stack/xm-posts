<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-01-title rf-01-desc" viewBox="0 0 800 320" width="800" height="320"><title id="rf-01-title">两动作老虎机的随机决策</title><desc id="rf-01-desc">策略以 35% 概率选择动作一，以 65% 概率选择动作零，回报不同，但都参与期望梯度。</desc><rect width="800" height="320" rx="18" fill="#f9fbf9"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="22" y="105" width="175" height="110" rx="12" fill="#ecf4f1" stroke="#d7e5df" stroke-width="2"/><text x="110" y="143" text-anchor="middle" font-size="25" font-weight="600" fill="#216c65">策略 πθ</text><text x="110" y="175" text-anchor="middle" font-size="17" font-weight="500" fill="#4e6d6b">p(a=1)=0.35</text>
<path d="M197 158 L306 83 M197 162 L306 245" stroke="#38867d" stroke-width="3" fill="none" stroke-linecap="round" /><text x="248" y="98" text-anchor="middle" font-size="17" font-weight="600" fill="#b36d45">35%</text><text x="247" y="239" text-anchor="middle" font-size="17" font-weight="600" fill="#377c91">65%</text>
<rect x="308" y="30" width="210" height="110" rx="12" fill="#fff0e7" stroke="#e8cbb7" stroke-width="2"/><text x="413" y="76" text-anchor="middle" font-size="21" font-weight="600" fill="#ad6236">动作 1：探索</text><text x="413" y="108" text-anchor="middle" font-size="19" font-weight="600" fill="#ac6235">奖励 +2</text>
<rect x="308" y="186" width="210" height="110" rx="12" fill="#e9f2f9" stroke="#c6dbe7" stroke-width="2"/><text x="413" y="233" text-anchor="middle" font-size="21" font-weight="600" fill="#316d88">动作 0：保守</text><text x="413" y="263" text-anchor="middle" font-size="19" font-weight="600" fill="#316d88">奖励 0</text>
<path d="M518 84 H570 V160 H615 M518 241 H570 V165 H615" stroke="#81a7a0" stroke-width="3" fill="none" stroke-linecap="round" /><rect x="616" y="109" width="166" height="103" rx="12" fill="#eef7eb" stroke="#d3e5cd" stroke-width="2"/><text x="699" y="148" text-anchor="middle" font-size="20" font-weight="600" fill="#336f58">期望奖励</text><text x="699" y="181" text-anchor="middle" font-size="22" font-weight="600" fill="#336f58">J = 0.70</text>
</g></svg>
