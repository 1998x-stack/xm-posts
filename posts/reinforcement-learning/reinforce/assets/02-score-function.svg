<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-02-title rf-02-desc" viewBox="0 0 800 320" width="800" height="320"><title id="rf-02-title">不穿过环境求导的概率梯度</title><desc id="rf-02-desc">通过动作的对数概率梯度乘奖励构成学习信号，而环境奖励本身无需可微。</desc><rect width="800" height="320" rx="18" fill="#f9fbf9"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="16" y="88" width="165" height="142" rx="12" fill="#e6f3ef" stroke="#d7e5df" stroke-width="2"/><text x="99" y="135" text-anchor="middle" font-size="25" font-weight="600" fill="#216c65">参数 θ</text><text x="99" y="172" text-anchor="middle" font-size="18" font-weight="600" fill="#216c65">随机策略 πθ</text>
<path d="M181 158 H239" stroke="#38867d" stroke-width="3" fill="none" stroke-linecap="round" /><rect x="242" y="88" width="168" height="142" rx="12" fill="#fff0e6" stroke="#e9ceba" stroke-width="2"/><text x="326" y="133" text-anchor="middle" font-size="21" font-weight="600" fill="#a96840">采样动作 a</text><text x="326" y="166" text-anchor="middle" font-size="18" font-weight="600" fill="#a96840">log πθ(a)</text>
<path d="M411 158 H470" stroke="#38867d" stroke-width="3" fill="none" stroke-linecap="round" /><rect x="474" y="88" width="145" height="142" rx="12" fill="#edf0fa" stroke="#d8d6e9" stroke-width="2"/><text x="546" y="136" text-anchor="middle" font-size="21" font-weight="600" fill="#7061a5">环境反馈</text><text x="546" y="171" text-anchor="middle" font-size="21" font-weight="600" fill="#7061a5">r(a)</text>
<path d="M620 158 H667" stroke="#38867d" stroke-width="3" fill="none" stroke-linecap="round" /><rect x="669" y="88" width="117" height="142" rx="12" fill="#eaf4e6" stroke="#d1e0cb" stroke-width="2"/><text x="727" y="137" text-anchor="middle" font-size="21" font-weight="600" fill="#3d7754">更新 θ</text><text x="727" y="173" text-anchor="middle" font-size="15" font-weight="600" fill="#3d7754">r ∇ log π</text>
<path d="M326 230 V272 H727 V230" stroke="#bc855c" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="7 6"/><text x="520" y="299" text-anchor="middle" font-size="16" font-weight="500" fill="#647b79">奖励是乘子；梯度走的是策略概率路径</text>
</g></svg>
