<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-04-title rf-04-desc" viewBox="0 0 800 320" width="800" height="320"><title id="rf-04-title">基线改动样本方差而非均值</title><desc id="rf-04-desc">同一两动作策略下，b 为零时方差较大，b 等于一 点 三时方差为零，三个情况下梯度期望相等。</desc><rect width="800" height="320" rx="18" fill="#f9fbf9"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="400" y="48" text-anchor="middle" font-size="23" font-weight="600" fill="#24675f">同一个真梯度：E[g] = 0.455</text>
<rect x="46" y="83" width="216" height="204" rx="12" fill="#fff3e9" stroke="#ecd4c1" stroke-width="2"/><text x="154" y="117" text-anchor="middle" font-size="23" font-weight="600" fill="#a5693e">b = 0</text><rect x="78" y="175" width="151" height="78" rx="7" fill="#d99b75" stroke="none" stroke-width="2"/><text x="154" y="162" text-anchor="middle" font-size="17" font-weight="600" fill="#995f38">Var = 0.384475</text><text x="154" y="223" text-anchor="middle" font-size="20" font-weight="600" fill="#fffaf2">高方差</text>
<rect x="292" y="83" width="216" height="204" rx="12" fill="#e8f4eb" stroke="#c8ddcc" stroke-width="2"/><text x="400" y="117" text-anchor="middle" font-size="23" font-weight="600" fill="#3e7958">b = 1.3</text><rect x="324" y="242" width="151" height="11" rx="6" fill="#6ca887" stroke="none" stroke-width="2"/><text x="400" y="162" text-anchor="middle" font-size="19" font-weight="600" fill="#3e7958">Var = 0</text><text x="400" y="221" text-anchor="middle" font-size="18" font-weight="600" fill="#3e7958">恒定单次估计</text>
<rect x="538" y="83" width="216" height="204" rx="12" fill="#f0effa" stroke="#dad5ea" stroke-width="2"/><text x="646" y="117" text-anchor="middle" font-size="23" font-weight="600" fill="#7465a0">b = 2</text><rect x="570" y="196" width="151" height="57" rx="7" fill="#a397c9" stroke="none" stroke-width="2"/><text x="646" y="162" text-anchor="middle" font-size="17" font-weight="600" fill="#7465a0">Var = 0.111475</text><text x="646" y="235" text-anchor="middle" font-size="18" font-weight="600" fill="#fff">方差反弹</text>
</g></svg>
