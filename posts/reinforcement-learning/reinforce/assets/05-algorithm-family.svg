<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-05-title rf-05-desc" viewBox="0 0 800 320" width="800" height="320"><title id="rf-05-title">REINFORCE与后续策略优化方法关系</title><desc id="rf-05-desc">REINFORCE 是采样回报的策略梯度基础，添加值函数基线形成常见 actor critic 路线，PPO 再引入重要性比和裁剪目标。</desc><rect width="800" height="320" rx="18" fill="#f9fbf9"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="26" y="90" width="207" height="135" rx="12" fill="#e8f3ef" stroke="#d7e5df" stroke-width="2"/><text x="130" y="136" text-anchor="middle" font-size="23" font-weight="600" fill="#28776a">REINFORCE</text><text x="130" y="171" text-anchor="middle" font-size="16" font-weight="600" fill="#4f7770">Monte Carlo 回报</text>
<path d="M234 157 H296" stroke="#539187" stroke-width="3" fill="none" stroke-linecap="round" /><text x="264" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#61827c">+ baseline</text>
<rect x="300" y="90" width="207" height="135" rx="12" fill="#fff1e7" stroke="#e8cfbd" stroke-width="2"/><text x="403" y="136" text-anchor="middle" font-size="23" font-weight="600" fill="#a46c42">Actor–Critic</text><text x="403" y="171" text-anchor="middle" font-size="16" font-weight="600" fill="#9d755a">学习 V(s) / 优势</text>
<path d="M508 157 H566" stroke="#539187" stroke-width="3" fill="none" stroke-linecap="round" /><text x="536" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#61827c">+ surrogate</text>
<rect x="570" y="90" width="207" height="135" rx="12" fill="#eef0fa" stroke="#d5d4e9" stroke-width="2"/><text x="673" y="136" text-anchor="middle" font-size="23" font-weight="600" fill="#7362a2">PPO</text><text x="673" y="171" text-anchor="middle" font-size="16" font-weight="600" fill="#7362a2">Clip / KL 约束近似</text>
<text x="402" y="271" text-anchor="middle" font-size="16" font-weight="500" fill="#637d7a">概念演进示意：并非严格的单链继承或相同实验协议</text>
</g></svg>
