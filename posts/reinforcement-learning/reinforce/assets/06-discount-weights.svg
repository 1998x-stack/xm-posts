<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-06-title rf-06-desc" viewBox="0 0 800 310" width="800" height="310"><title id="rf-06-title">折扣回报与绝对时间权重</title><desc id="rf-06-desc">三步奖励的折扣回报分别为2.92、2.4、3，乘以绝对时间权重后为2.92、1.92、1.92。</desc><rect width="800" height="310" rx="18" fill="#f9fbf9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="400" y="34" text-anchor="middle" font-size="22" fill="#216c65">γ = 0.8 · 三步回合</text><rect x="75" y="52" width="170" height="55" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="160" y="85" text-anchor="middle" font-size="18" fill="#263c42">r₀ = 1</text><rect x="75" y="132" width="170" height="54" rx="9" fill="#fff0e7" stroke="#e8cbb7" stroke-width="2"/><text x="160" y="165" text-anchor="middle" font-size="18" fill="#ad6236">G₀ = 2.92</text><path d="M160 186 L160 219" stroke="#38867d" stroke-width="3" fill="none"/><rect x="75" y="219" width="170" height="49" rx="9" fill="#eef0fa" stroke="#d5d4e9" stroke-width="2"/><text x="160" y="250" text-anchor="middle" font-size="18" fill="#7062a2">1 × 2.92</text><rect x="315" y="52" width="170" height="55" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="400" y="85" text-anchor="middle" font-size="18" fill="#263c42">r₁ = 0</text><rect x="315" y="132" width="170" height="54" rx="9" fill="#fff0e7" stroke="#e8cbb7" stroke-width="2"/><text x="400" y="165" text-anchor="middle" font-size="18" fill="#ad6236">G₁ = 2.40</text><path d="M400 186 L400 219" stroke="#38867d" stroke-width="3" fill="none"/><rect x="315" y="219" width="170" height="49" rx="9" fill="#eef0fa" stroke="#d5d4e9" stroke-width="2"/><text x="400" y="250" text-anchor="middle" font-size="18" fill="#7062a2">0.8 × 2.40</text><rect x="555" y="52" width="170" height="55" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="640" y="85" text-anchor="middle" font-size="18" fill="#263c42">r₂ = 3</text><rect x="555" y="132" width="170" height="54" rx="9" fill="#fff0e7" stroke="#e8cbb7" stroke-width="2"/><text x="640" y="165" text-anchor="middle" font-size="18" fill="#ad6236">G₂ = 3</text><path d="M640 186 L640 219" stroke="#38867d" stroke-width="3" fill="none"/><rect x="555" y="219" width="170" height="49" rx="9" fill="#eef0fa" stroke="#d5d4e9" stroke-width="2"/><text x="640" y="250" text-anchor="middle" font-size="18" fill="#7062a2">0.64 × 3</text><text x="400" y="291" text-anchor="middle" font-size="17" fill="#7062a2">乘 γᵗ 后才是起点折扣目标的梯度权重</text></g></svg>
