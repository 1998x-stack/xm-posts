<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-07-title rf-07-desc" viewBox="0 0 800 310" width="800" height="310"><title id="rf-07-title">生成序列与训练重算</title><desc id="rf-07-desc">prompt 不参加损失，生成三个 token 后由 verifier 得到回报，训练端重算三个条件 log probability，乘同一个回报。</desc><rect width="800" height="310" rx="18" fill="#f9fbf9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="22" y="50" width="136" height="62" rx="9" fill="#eef0fa" stroke="#c6dbd3" stroke-width="2"/><text x="90" y="87" text-anchor="middle" font-size="18" fill="#263c42">Prompt</text><path d="M161 81 L192 81" stroke="#38867d" stroke-width="3" fill="none"/><path d="M183 76 L192 81 L183 86" fill="none" stroke="#38867d" stroke-width="3"/><rect x="195" y="50" width="113" height="62" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="251" y="87" text-anchor="middle" font-size="18" fill="#263c42">token 1</text><path d="M308 81 L339 81" stroke="#38867d" stroke-width="3" fill="none"/><path d="M330 76 L339 81 L330 86" fill="none" stroke="#38867d" stroke-width="3"/><rect x="342" y="50" width="113" height="62" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="398" y="87" text-anchor="middle" font-size="18" fill="#263c42">token 2</text><path d="M455 81 L486 81" stroke="#38867d" stroke-width="3" fill="none"/><path d="M477 76 L486 81 L477 86" fill="none" stroke="#38867d" stroke-width="3"/><rect x="489" y="50" width="113" height="62" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="545" y="87" text-anchor="middle" font-size="18" fill="#263c42">EOS</text><path d="M602 81 L636 81" stroke="#38867d" stroke-width="3" fill="none"/><path d="M627 76 L636 81 L627 86" fill="none" stroke="#38867d" stroke-width="3"/><rect x="640" y="50" width="136" height="62" rx="9" fill="#fff0e7" stroke="#c6dbd3" stroke-width="2"/><text x="708" y="87" text-anchor="middle" font-size="18" fill="#ad6236">Reward R</text><text x="90" y="137" text-anchor="middle" font-size="16" fill="#7062a2">mask = 0</text><path d="M251 112 L251 172" stroke="#38867d" stroke-width="3" fill="none"/><rect x="189" y="172" width="124" height="54" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="251" y="205" text-anchor="middle" font-size="18" fill="#216c65">log π₁</text><path d="M398 112 L398 172" stroke="#38867d" stroke-width="3" fill="none"/><rect x="336" y="172" width="124" height="54" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="398" y="205" text-anchor="middle" font-size="18" fill="#216c65">log π₂</text><path d="M545 112 L545 172" stroke="#38867d" stroke-width="3" fill="none"/><rect x="483" y="172" width="124" height="54" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="545" y="205" text-anchor="middle" font-size="18" fill="#216c65">log π₃</text><text x="400" y="258" text-anchor="middle" font-size="21" fill="#ad6236">训练端：R × (log π₁ + log π₂ + log π₃)</text><text x="400" y="287" text-anchor="middle" font-size="16" fill="#587078">固定生成的 token；重算可微 log probability</text></g></svg>
