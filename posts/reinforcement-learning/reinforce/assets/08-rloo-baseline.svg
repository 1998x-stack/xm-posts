<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rf-08-title rf-08-desc" viewBox="0 0 800 310" width="800" height="310"><title id="rf-08-title">Leave-one-out 基线</title><desc id="rf-08-desc">同题四个奖励为1、1、0、0；每个回答使用其余三个奖励的均值，优势为2/3、2/3、-2/3、-2/3。</desc><rect width="800" height="310" rx="18" fill="#f9fbf9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="400" y="32" text-anchor="middle" font-size="22" fill="#216c65">同一 prompt，独立采样 K = 4</text><rect x="32" y="53" width="156" height="61" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="110" y="78" text-anchor="middle" font-size="18" fill="#263c42">回答 1</text><text x="110" y="103" text-anchor="middle" font-size="17" fill="#216c65">R = 1</text><path d="M110 114 L110 146" stroke="#38867d" stroke-width="3" fill="none"/><rect x="32" y="146" width="156" height="61" rx="9" fill="#eef0fa" stroke="#d5d4e9" stroke-width="2"/><text x="110" y="171" text-anchor="middle" font-size="16" fill="#7062a2">其余三个均值</text><text x="110" y="195" text-anchor="middle" font-size="19" fill="#7062a2">1/3</text><path d="M110 207 L110 239" stroke="#38867d" stroke-width="3" fill="none"/><text x="110" y="260" text-anchor="middle" font-size="20" fill="#216c65">A = +2/3</text><rect x="225" y="53" width="156" height="61" rx="9" fill="#e9f3ee" stroke="#c6dbd3" stroke-width="2"/><text x="303" y="78" text-anchor="middle" font-size="18" fill="#263c42">回答 2</text><text x="303" y="103" text-anchor="middle" font-size="17" fill="#216c65">R = 1</text><path d="M303 114 L303 146" stroke="#38867d" stroke-width="3" fill="none"/><rect x="225" y="146" width="156" height="61" rx="9" fill="#eef0fa" stroke="#d5d4e9" stroke-width="2"/><text x="303" y="171" text-anchor="middle" font-size="16" fill="#7062a2">其余三个均值</text><text x="303" y="195" text-anchor="middle" font-size="19" fill="#7062a2">1/3</text><path d="M303 207 L303 239" stroke="#38867d" stroke-width="3" fill="none"/><text x="303" y="260" text-anchor="middle" font-size="20" fill="#216c65">A = +2/3</text><rect x="418" y="53" width="156" height="61" rx="9" fill="#fff0e7" stroke="#c6dbd3" stroke-width="2"/><text x="496" y="78" text-anchor="middle" font-size="18" fill="#263c42">回答 3</text><text x="496" y="103" text-anchor="middle" font-size="17" fill="#ad6236">R = 0</text><path d="M496 114 L496 146" stroke="#38867d" stroke-width="3" fill="none"/><rect x="418" y="146" width="156" height="61" rx="9" fill="#eef0fa" stroke="#d5d4e9" stroke-width="2"/><text x="496" y="171" text-anchor="middle" font-size="16" fill="#7062a2">其余三个均值</text><text x="496" y="195" text-anchor="middle" font-size="19" fill="#7062a2">2/3</text><path d="M496 207 L496 239" stroke="#38867d" stroke-width="3" fill="none"/><text x="496" y="260" text-anchor="middle" font-size="20" fill="#ad6236">A = −2/3</text><rect x="611" y="53" width="156" height="61" rx="9" fill="#fff0e7" stroke="#c6dbd3" stroke-width="2"/><text x="689" y="78" text-anchor="middle" font-size="18" fill="#263c42">回答 4</text><text x="689" y="103" text-anchor="middle" font-size="17" fill="#ad6236">R = 0</text><path d="M689 114 L689 146" stroke="#38867d" stroke-width="3" fill="none"/><rect x="611" y="146" width="156" height="61" rx="9" fill="#eef0fa" stroke="#d5d4e9" stroke-width="2"/><text x="689" y="171" text-anchor="middle" font-size="16" fill="#7062a2">其余三个均值</text><text x="689" y="195" text-anchor="middle" font-size="19" fill="#7062a2">2/3</text><path d="M689 207 L689 239" stroke="#38867d" stroke-width="3" fill="none"/><text x="689" y="260" text-anchor="middle" font-size="20" fill="#ad6236">A = −2/3</text><text x="400" y="294" text-anchor="middle" font-size="17" fill="#587078">不是剔除低分回答，而是所有样本互为对照</text></g></svg>
