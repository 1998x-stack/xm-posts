<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="sac-entropy-choice-title sac-entropy-choice-desc" data-export="entropy-choice.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sac-entropy-choice-title">相同收益下不同熵的策略</title><desc id="sac-entropy-choice-desc">三个动作的概率比较：高度确定与保持多种高收益选择，两者目标随熵权重改变。</desc><rect width="800" height="270" rx="16" fill="#fbfcfa"/><text x="32" y="35" font-size="17" fill="#48666e">同一状态的三种候选动作：左 / 中 / 右</text><rect x="24" y="65" width="220" height="94" rx="13" fill="#fff0e5" stroke="#ebd3bd" stroke-width="1.8"/><text x="134" y="102" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">低熵策略</text><text x="134" y="131" text-anchor="middle" fill="#5a7579" font-size="14">0.90 / 0.08 / 0.02</text><rect x="290" y="65" width="220" height="94" rx="13" fill="#e6f2ed" stroke="#c6dbd3" stroke-width="1.8"/><text x="400" y="102" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">较高熵策略</text><text x="400" y="131" text-anchor="middle" fill="#5a7579" font-size="14">0.45 / 0.45 / 0.10</text><rect x="556" y="65" width="220" height="94" rx="13" fill="#f0eef9" stroke="#d9d1ec" stroke-width="1.8"/><text x="666" y="102" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">均匀但无辨别</text><text x="666" y="131" text-anchor="middle" fill="#5a7579" font-size="14">0.33 / 0.33 / 0.34</text><text x="40" y="213" fill="#667e7d" font-size="16">探索不是盲目平均：奖励与熵共同决定偏好。</text><path d="M42 232H752" stroke="#d9e7de" stroke-width="2"/></svg>
