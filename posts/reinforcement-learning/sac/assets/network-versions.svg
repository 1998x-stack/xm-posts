<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="sac-network-versions-title sac-network-versions-desc" data-export="network-versions.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sac-network-versions-title">两代 SAC 网络结构差别</title><desc id="sac-network-versions-desc">2018 ICML 版有两个 Q 及独立 V 和目标 V；后续版本通常用两个 Q 及目标 Q，不再单独训练 V。</desc><rect width="800" height="270" rx="16" fill="#fbfcfa"/><rect x="25" y="45" width="335" height="96" rx="13" fill="#fff0e8" stroke="#e9d4c6" stroke-width="1.8"/><text x="192.5" y="82" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">ICML 2018</text><text x="192.5" y="111" text-anchor="middle" fill="#5a7579" font-size="14">Actor + Q₁/Q₂ + V + target V</text><rect x="435" y="45" width="340" height="96" rx="13" fill="#e8f3ee" stroke="#c6e0d3" stroke-width="1.8"/><text x="605" y="82" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">现代 SAC</text><text x="605" y="111" text-anchor="middle" fill="#5a7579" font-size="14">Actor + Q₁/Q₂ + target Q₁/Q₂</text><text x="190" y="180" text-anchor="middle" fill="#6a5c54" font-size="17">原论文 Eq. (5)–(13) / Algorithm 1</text><text x="605" y="180" text-anchor="middle" fill="#397c73" font-size="17">2018 后续论文与现代工程实现</text><path d="M40 208H760" stroke="#d8e7df" stroke-width="2"/><text x="400" y="241" text-anchor="middle" fill="#5d7777" font-size="15">双 Q 在两版均重要；“没有 V 网络”不是 ICML 2018 的原始配置</text></svg>
