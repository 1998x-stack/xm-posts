<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="sac-replay-loop-title sac-replay-loop-desc" data-export="replay-loop.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sac-replay-loop-title">SAC 离策略经验回放循环</title><desc id="sac-replay-loop-desc">环境交互产生历史样本，Replay Buffer 向双 Critic 和随机 Actor 提供数据，多次梯度更新后继续收集。</desc><rect width="800" height="270" rx="16" fill="#fbfcfa"/><rect x="22" y="65" width="155" height="100" rx="13" fill="#eaf2f8" stroke="#cee0e9" stroke-width="1.8"/><text x="99.5" y="102" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">环境</text><text x="99.5" y="131" text-anchor="middle" fill="#5a7579" font-size="14">s, a, r, s′</text><rect x="230" y="65" width="165" height="100" rx="13" fill="#fff0e4" stroke="#ebd0bc" stroke-width="1.8"/><text x="312.5" y="102" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">Replay Buffer</text><text x="312.5" y="131" text-anchor="middle" fill="#5a7579" font-size="14">保存旧经验</text><rect x="455" y="65" width="147" height="100" rx="13" fill="#edf0fa" stroke="#d2d8ed" stroke-width="1.8"/><text x="528.5" y="102" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">双 Critic</text><text x="528.5" y="131" text-anchor="middle" fill="#5a7579" font-size="14">拟合 soft Q</text><rect x="647" y="65" width="131" height="100" rx="13" fill="#e6f3ed" stroke="#c3dfd3" stroke-width="1.8"/><text x="712.5" y="102" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">Actor π</text><text x="712.5" y="131" text-anchor="middle" fill="#5a7579" font-size="14">采样新动作</text><path d="M177 115 L218 115" stroke="#26847a" stroke-width="3" fill="none"/><path d="M217 108 L230 115 L217 122" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M395 115 L443 115" stroke="#26847a" stroke-width="3" fill="none"/><path d="M442 108 L455 115 L442 122" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M602 115 L635 115" stroke="#26847a" stroke-width="3" fill="none"/><path d="M634 108 L647 115 L634 122" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M714 170V227H100V170" stroke="#258278" stroke-width="2.5" stroke-dasharray="7 7" fill="none"/><text x="400" y="251" text-anchor="middle" fill="#47736c" font-size="15">历史数据可反复抽样；新策略继续与环境交互</text></svg>
