<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="sac-soft-backup-title sac-soft-backup-desc" data-export="soft-backup.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sac-soft-backup-title">Soft Bellman backup 的信息流</title><desc id="sac-soft-backup-desc">下一状态采样动作，双目标 Q 取最小后减去温度乘对数概率，再结合奖励折扣构成目标。</desc><rect width="800" height="270" rx="16" fill="#fbfcfa"/><rect x="20" y="70" width="135" height="100" rx="13" fill="#e7f1fa" stroke="#c9dfe9" stroke-width="1.8"/><text x="87.5" y="107" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">s′</text><text x="87.5" y="136" text-anchor="middle" fill="#5a7579" font-size="14">下一状态</text><rect x="191" y="70" width="150" height="100" rx="13" fill="#e9f3eb" stroke="#c8ded2" stroke-width="1.8"/><text x="266" y="107" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">a′ ~ π</text><text x="266" y="136" text-anchor="middle" fill="#5a7579" font-size="14">重参数采样</text><rect x="385" y="20" width="170" height="93" rx="13" fill="#f0edf9" stroke="#d6cdea" stroke-width="1.8"/><text x="470" y="57" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">min Q̄₁,Q̄₂</text><text x="470" y="86" text-anchor="middle" fill="#5a7579" font-size="14">抑制过估计</text><rect x="385" y="140" width="170" height="93" rx="13" fill="#fff1e5" stroke="#e6d2bd" stroke-width="1.8"/><text x="470" y="177" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">−α log π</text><text x="470" y="206" text-anchor="middle" fill="#5a7579" font-size="14">软值的熵项</text><rect x="622" y="70" width="158" height="100" rx="13" fill="#e8f2ee" stroke="#cadecf" stroke-width="1.8"/><text x="701" y="107" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">r + γ(1−d)·</text><text x="701" y="136" text-anchor="middle" fill="#5a7579" font-size="14">组合目标 y</text><path d="M155 120 L179 120" stroke="#26847a" stroke-width="3" fill="none"/><path d="M178 113 L191 120 L178 127" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M341 120 L368 65" stroke="#26847a" stroke-width="3" fill="none"/><path d="M367 58 L380 65 L367 72" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M341 120 L368 186" stroke="#26847a" stroke-width="3" fill="none"/><path d="M367 179 L380 186 L367 193" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M555 65 L608 105" stroke="#26847a" stroke-width="3" fill="none"/><path d="M607 98 L620 105 L607 112" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M555 186 L608 139" stroke="#26847a" stroke-width="3" fill="none"/><path d="M607 132 L620 139 L607 146" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="254" text-anchor="middle" font-size="14" fill="#647c7a">终止样本 d=1 时不再 bootstrap；Q̄ 是缓慢更新的目标 Critic</text></svg>
