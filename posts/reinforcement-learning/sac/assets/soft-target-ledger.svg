<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="title desc"><title id="title">SAC Soft Bellman 数值账本</title><desc id="desc">下一状态的两个目标 Q 为三和二点五，最小值为二点五；温度零点五、下一动作对数密度负零点七产生零点三五；折扣后目标为三点五六五。终止时目标为一。</desc><rect width="820" height="290" rx="16" fill="#fdfdfa"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="22" y="37" fill="#29444a" font-size="21" font-weight="700">一笔 Replay 数据，拆开 y 的每一项</text>
<rect x="24" y="68" width="170" height="122" rx="12" fill="#e7f3ee" stroke="#bad8c9"/>
<text x="109" y="99" text-anchor="middle" font-size="15" fill="#567477">目标双 Q</text><text x="109" y="136" text-anchor="middle" font-size="23" font-weight="700" fill="#276d67">min(3,2.5)</text><text x="109" y="163" text-anchor="middle" font-size="17" fill="#276d67">= 2.50</text>
<text x="202" y="130" font-size="23" fill="#516b70">+</text>
<rect x="237" y="68" width="166" height="122" rx="12" fill="#fff0e4" stroke="#e8cfb3"/>
<text x="320" y="99" text-anchor="middle" font-size="15" fill="#85684d">熵项 −α log π</text><text x="320" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#aa673b">−0.5×(−0.7)</text><text x="320" y="163" text-anchor="middle" font-size="17" fill="#aa673b">= +0.35</text>
<text x="414" y="130" font-size="22" fill="#516b70">→</text>
<rect x="449" y="68" width="150" height="122" rx="12" fill="#eaf0fa" stroke="#cad5e9"/>
<text x="524" y="99" text-anchor="middle" font-size="15" fill="#586d86">Soft next value</text><text x="524" y="146" text-anchor="middle" font-size="28" font-weight="700" fill="#3e5c80">2.85</text>
<text x="609" y="130" font-size="22" fill="#516b70">→</text>
<rect x="643" y="68" width="155" height="122" rx="12" fill="#e7f3ee" stroke="#bad8c9"/>
<text x="720" y="99" text-anchor="middle" font-size="15" fill="#276d67">r + γ ×</text><text x="720" y="146" text-anchor="middle" font-size="27" font-weight="700" fill="#276d67">3.565</text>
<text x="31" y="229" font-size="16" fill="#35565a">非终止：1 + 0.9 × (2.50 + 0.35) = 3.565</text>
<text x="31" y="264" font-size="16" fill="#a26640">终止 d = 1：未来项整体归零，y = 1</text></g></svg>
