<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="sac-tanh-policy-title sac-tanh-policy-desc" data-export="tanh-policy.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sac-tanh-policy-title">Tanh 高斯策略与密度修正</title><desc id="sac-tanh-policy-desc">高斯噪声重参数化采样 u，再 tanh 映射到有限动作范围；log π 必须包含雅可比行列式修正。</desc><rect width="800" height="270" rx="16" fill="#fbfcfa"/><rect x="20" y="72" width="164" height="98" rx="13" fill="#ecf3f9" stroke="#cedde7" stroke-width="1.8"/><text x="102" y="109" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">ε ~ N(0,1)</text><text x="102" y="138" text-anchor="middle" fill="#5a7579" font-size="14">可微随机噪声</text><rect x="227" y="72" width="171" height="98" rx="13" fill="#f0eef8" stroke="#d7cee8" stroke-width="1.8"/><text x="312.5" y="109" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">u = μ + σε</text><text x="312.5" y="138" text-anchor="middle" fill="#5a7579" font-size="14">未限幅高斯变量</text><rect x="443" y="72" width="147" height="98" rx="13" fill="#e9f4ee" stroke="#c5e1d1" stroke-width="1.8"/><text x="516.5" y="109" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">a = tanh(u)</text><text x="516.5" y="138" text-anchor="middle" fill="#5a7579" font-size="14">限定动作区间</text><rect x="641" y="72" width="138" height="98" rx="13" fill="#fff1e5" stroke="#ead6c1" stroke-width="1.8"/><text x="710" y="109" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">log π(a|s)</text><text x="710" y="138" text-anchor="middle" fill="#5a7579" font-size="14">Jacobian 修正</text><path d="M184 122 L215 122" stroke="#26847a" stroke-width="3" fill="none"/><path d="M214 115 L227 122 L214 129" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M398 122 L431 122" stroke="#26847a" stroke-width="3" fill="none"/><path d="M430 115 L443 122 L430 129" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 122 L629 122" stroke="#26847a" stroke-width="3" fill="none"/><path d="M628 115 L641 122 L628 129" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="224" text-anchor="middle" font-size="17" fill="#566e73">单变量：log π(a|s) = log N(u; μ, σ²) − log(1 − tanh² u)</text></svg>
