<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="sac-temperature-title sac-temperature-desc" data-export="temperature.svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="sac-temperature-title">自动温度调节的反馈回路</title><desc id="sac-temperature-desc">目标熵与当前策略熵比较并调节非负温度 alpha，再影响 Actor 偏好探索的程度。</desc><rect width="800" height="270" rx="16" fill="#fbfcfa"/><rect x="30" y="67" width="180" height="110" rx="13" fill="#f2eff9" stroke="#d8cfe9" stroke-width="1.8"/><text x="120" y="104" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">目标熵 H̄</text><text x="120" y="133" text-anchor="middle" fill="#5a7579" font-size="14">期望随机程度</text><rect x="311" y="67" width="178" height="110" rx="13" fill="#fff1e7" stroke="#ead5c6" stroke-width="1.8"/><text x="400" y="104" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">更新 α ≥ 0</text><text x="400" y="133" text-anchor="middle" fill="#5a7579" font-size="14">dual optimization</text><rect x="599" y="67" width="178" height="110" rx="13" fill="#e6f3ec" stroke="#c8ded2" stroke-width="1.8"/><text x="688" y="104" text-anchor="middle" fill="#294951" font-size="19" font-weight="700">Actor πθ</text><text x="688" y="133" text-anchor="middle" fill="#5a7579" font-size="14">Q vs entropy</text><path d="M210 122 L299 122" stroke="#26847a" stroke-width="3" fill="none"/><path d="M298 115 L311 122 L298 129" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M489 122 L587 122" stroke="#26847a" stroke-width="3" fill="none"/><path d="M586 115 L599 122 L586 129" fill="none" stroke="#26847a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M688 180V219H122V182" stroke="#2a887d" stroke-width="2" stroke-dasharray="8 6" fill="none"/><text x="404" y="245" text-anchor="middle" font-size="15" fill="#527778">策略熵反馈给温度：不是把每个状态的熵强行设成同一个数</text></svg>
