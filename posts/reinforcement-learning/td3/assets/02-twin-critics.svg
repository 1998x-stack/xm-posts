<rect x="285" y="169" width="202" height="94" rx="14" fill="#edf0fb" stroke="#cfd5e9" stroke-width="1.6"/><text x="386" y="204" font-size="21" font-weight="800" fill="#6b65a3" text-anchor="middle">目标 Q′₂</text><text x="386" y="237" font-size="16" font-weight="600" fill="#6b65a3" text-anchor="middle">例如 6</text>
<path d="M487 92L585 148" stroke="#6d9292" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M574 142L585 148L574 154" fill="none" stroke="#6d9292" stroke-width="2.5" stroke-linejoin="round"/><path d="M487 216L585 157" stroke="#6d9292" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M574 151L585 157L574 163" fill="none" stroke="#6d9292" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="585" y="112" width="170" height="87" rx="14" fill="#fff0e3" stroke="#edc9a8" stroke-width="1.6"/><text x="670" y="145" font-size="19" font-weight="800" fill="#ae6e43" text-anchor="middle">min(10, 6)</text><text x="670" y="172" font-size="24" font-weight="800" fill="#ae6e43" text-anchor="middle">= 6</text>
