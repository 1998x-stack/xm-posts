<path d="M205 148L285 95" stroke="#6d9292" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M274 89L285 95L274 101" fill="none" stroke="#6d9292" stroke-width="2.5" stroke-linejoin="round"/><path d="M205 148L285 221" stroke="#6d9292" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M274 215L285 221L274 227" fill="none" stroke="#6d9292" stroke-width="2.5" stroke-linejoin="round"/>
