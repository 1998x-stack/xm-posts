<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" role="img" aria-labelledby="td3-fig2-title td3-fig2-desc" style="font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif"><title id="td3-fig2-title">两个 Critic 为同一动作评分并选取较小值</title><desc id="td3-fig2-desc">两个独立训练的目标 Critic 对同一目标动作评分，取最小值形成 Bellman 目标，两个在线 Critic 仍共同拟合该目标。</desc><rect width="900" height="306" rx="18" fill="#f7faf8"/>
