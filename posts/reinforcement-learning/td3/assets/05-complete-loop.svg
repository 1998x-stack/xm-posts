<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 367" role="img" aria-labelledby="td3-fig5-title td3-fig5-desc" style="font-family:system-ui,-apple-system,'Segoe UI','PingFang SC',sans-serif"><title id="td3-fig5-title">TD3 网络与更新的完整路径</title><desc id="td3-fig5-desc">经验回放批次先由目标 Actor 和截断噪声产生目标动作，双目标 Critic 的最小值训练双在线 Critic，在线 Actor 只在延迟时刻沿 Q1 梯度更新，最后软更新目标网络。</desc><rect width="900" height="367" rx="18" fill="#f7faf8"/>
<rect x="24" y="128" width="144" height="94" rx="14" fill="#e7f1f5" stroke="#b7d8df" stroke-width="1.6"/><text x="96" y="164" font-size="21" font-weight="800" fill="#337384" text-anchor="middle">Replay</text><text x="96" y="194" font-size="14" font-weight="500" fill="#4c7983" text-anchor="middle">(s,a,r,s′,d)</text>
<path d="M168 176L245 176" stroke="#6d9292" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M234 170L245 176L234 182" fill="none" stroke="#6d9292" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="245" y="45" width="200" height="88" rx="14" fill="#e7f4eb" stroke="#b5d6c7" stroke-width="1.6"/><text x="345" y="79" font-size="18" font-weight="800" fill="#267f6a" text-anchor="middle">目标 Actor π′</text><text x="345" y="107" font-size="14" font-weight="500" fill="#3c8171" text-anchor="middle">ã = π′(s′)+ε</text>
<rect x="245" y="217" width="200" height="103" rx="14" fill="#dff1ea" stroke="#b5d6c7" stroke-width="1.6"/><text x="345" y="257" font-size="18" font-weight="800" fill="#267f6a" text-anchor="middle">在线 Critic</text><text x="345" y="281" font-size="18" font-weight="800" fill="#267f6a" text-anchor="middle">Q₁ 与 Q₂</text>
<path d="M445 87L536 110" stroke="#6d9292" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M525 104L536 110L525 116" fill="none" stroke="#6d9292" stroke-width="2.5" stroke-linejoin="round"/><path d="M445 271L535 246" stroke="#6d9292" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M524 240L535 246L524 252" fill="none" stroke="#6d9292" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="536" y="64" width="205" height="91" rx="14" fill="#edf0fb" stroke="#d0d5e9" stroke-width="1.6"/><text x="639" y="101" font-size="18" font-weight="800" fill="#7066a5" text-anchor="middle">双目标 Critic</text><text x="639" y="128" font-size="17" font-weight="700" fill="#7066a5" text-anchor="middle">min(Q′₁,Q′₂)</text>
<rect x="536" y="207" width="205" height="94" rx="14" fill="#fff1e4" stroke="#e9c7a5" stroke-width="1.6"/><text x="639" y="244" font-size="18" font-weight="800" fill="#a86943" text-anchor="middle">在线 Actor π</text><text x="639" y="270" font-size="15" font-weight="700" fill="#a86943" text-anchor="middle">每 d 步更新</text>
<path d="M639 155L639 207" stroke="#a88aa6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M628 201L639 207L628 213" fill="none" stroke="#a88aa6" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M741 251L838 251" stroke="#b47748" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M827 245L838 251L827 257" fill="none" stroke="#b47748" stroke-width="2.5" stroke-linejoin="round"/>
<text x="855" y="229" font-size="15" font-weight="800" fill="#a86943" text-anchor="end">软</text><text x="855" y="273" font-size="15" font-weight="800" fill="#a86943" text-anchor="end">更新</text>
<text x="36" y="340" font-size="15" font-weight="600" fill="#587572" text-anchor="start">注：两条 Q 路径的更新不是两个 Actor；在线 Actor 只利用 Q₁ 的动作梯度。</text></svg>
