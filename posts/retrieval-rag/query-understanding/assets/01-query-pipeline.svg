<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="fig01-title fig01-desc"><title id="fig01-title">Query Understanding Pipeline</title><desc id="fig01-desc">Natural language is contextualized, parsed into a semantic frame, checked for ambiguity, then routed to retrieval or agent planning.</desc><defs><marker id="arrow-p1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#496a70" stroke-width="1.5"/></marker></defs><rect width="960" height="410" rx="24" fill="#f4f8f5"/><g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle"><rect x="28" y="144" width="150" height="104" rx="16" fill="#e1eee9" stroke="#76a99a" stroke-width="2"/><text x="103" y="181" font-size="20" fill="#24444a" font-weight="700">用户请求</text><text x="103" y="211" font-size="14" fill="#526f70">自然语言</text><rect x="218" y="144" width="150" height="104" rx="16" fill="#e9e5fa" stroke="#a49acb" stroke-width="2"/><text x="293" y="181" font-size="20" fill="#332f59" font-weight="700">上下文恢复</text><text x="293" y="211" font-size="14" fill="#665e8b">对话状态 / 指代</text><rect x="408" y="144" width="150" height="104" rx="16" fill="#fff0df" stroke="#d6a26c" stroke-width="2"/><text x="483" y="181" font-size="20" fill="#6a4428" font-weight="700">语义解析</text><text x="483" y="211" font-size="14" fill="#8a6446">意图 / 实体 / 槽位</text><rect x="598" y="144" width="150" height="104" rx="16" fill="#fce8e4" stroke="#d99b8e" stroke-width="2"/><text x="673" y="181" font-size="20" fill="#743e35" font-weight="700">决策检查</text><text x="673" y="211" font-size="14" fill="#9a665c">置信度 / 歧义</text><rect x="790" y="72" width="142" height="92" rx="15" fill="#dff1e8" stroke="#72aa8e" stroke-width="2"/><text x="861" y="108" font-size="19" fill="#24533e" font-weight="700">检索路径</text><text x="861" y="135" font-size="13" fill="#507966">BM25 / Dense / RAG</text><rect x="790" y="245" width="142" height="92" rx="15" fill="#e8e4fa" stroke="#9c91c8" stroke-width="2"/><text x="861" y="281" font-size="19" fill="#39345f" font-weight="700">Agent 路由</text><text x="861" y="308" font-size="13" fill="#69618d">Plan / Tool / Workflow</text><path d="M178 196 H218 M368 196 H408 M558 196 H598 M748 177 L790 126 M748 215 L790 290" fill="none" stroke="#496a70" stroke-width="3" marker-end="url(#arrow-p1)"/><path d="M673 248 V365 H293 V248" fill="none" stroke="#b17c4b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-p1)"/><text x="480" y="390" font-size="14" fill="#8a603b">澄清 / 用户反馈：修正语义状态</text><text x="480" y="54" font-size="15" fill="#637d79">理解 → 表示 → 决策 → 下游使用</text></g></svg>