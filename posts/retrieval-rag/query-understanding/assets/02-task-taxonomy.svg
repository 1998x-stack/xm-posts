<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Query Understanding Task Taxonomy</title><desc id="desc">Three task clusters: understand, transform and interact, with conversational context and evaluation spanning them.</desc><rect width="960" height="440" rx="24" fill="#f4f8f5"/><g font-family="Arial,'PingFang SC',sans-serif"><rect x="32" y="44" width="280" height="285" rx="18" fill="#e4f0eb" stroke="#83b5a3" stroke-width="2"/><rect x="340" y="44" width="280" height="285" rx="18" fill="#fff0df" stroke="#d7aa76" stroke-width="2"/><rect x="648" y="44" width="280" height="285" rx="18" fill="#ece8fa" stroke="#a59bd0" stroke-width="2"/><g text-anchor="middle" font-weight="700"><text x="172" y="88" font-size="25" fill="#24584e">UNDERSTAND</text><text x="480" y="88" font-size="25" fill="#80532e">TRANSFORM</text><text x="788" y="88" font-size="25" fill="#51477e">INTERACT</text></g><g font-size="17" fill="#34575a"><text x="60" y="137">• Query classification</text><text x="60" y="178">• Intent detection</text><text x="60" y="219">• Segmentation / tagging</text><text x="60" y="260">• Entity linking / parsing</text><text x="368" y="137">• Spelling correction</text><text x="368" y="178">• Query rewriting</text><text x="368" y="219">• Query expansion</text><text x="368" y="260">• Query decomposition</text><text x="676" y="137">• Autocomplete</text><text x="676" y="178">• Query suggestion</text><text x="676" y="219">• Clarification</text><text x="676" y="260">• Proactive management</text></g><rect x="32" y="352" width="896" height="54" rx="14" fill="#e9edf0" stroke="#b6c4c8"/><text x="480" y="385" text-anchor="middle" font-size="19" fill="#435b63" font-weight="700">横切能力：Context Modeling · Uncertainty · Evaluation · Robustness</text></g></svg>