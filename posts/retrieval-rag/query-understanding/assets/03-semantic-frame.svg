<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="fig03-title fig03-desc"><title id="fig03-title">From Query Text to Semantic Frame</title><desc id="fig03-desc">A natural-language query is mapped into intent, entities, time constraints and optimization objectives; ambiguous time is left unresolved.</desc><rect width="960" height="490" rx="24" fill="#f7f9f6"/><g font-family="Arial,'PingFang SC',sans-serif"><text x="48" y="54" font-size="18" fill="#48646a" font-weight="700">RAW QUERY</text><rect x="42" y="76" width="876" height="104" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2"/><text x="70" y="119" font-size="22" fill="#24444a">Find recent papers about efficient LLM inference,</text><text x="70" y="151" font-size="22" fill="#24444a">especially methods that reduce KV cache memory.</text><rect x="42" y="215" width="190" height="88" rx="14" fill="#e5f1eb" stroke="#7eae9c"/><text x="137" y="249" text-anchor="middle" font-size="18" font-weight="700" fill="#28574c">Intent</text><text x="137" y="278" text-anchor="middle" font-size="15" fill="#456d61">Research search</text><rect x="258" y="215" width="190" height="88" rx="14" fill="#e9e5fa" stroke="#a39ac9"/><text x="353" y="249" text-anchor="middle" font-size="18" font-weight="700" fill="#453c72">Entities</text><text x="353" y="278" text-anchor="middle" font-size="15" fill="#6a6090">LLM inference · KV Cache</text><rect x="474" y="215" width="190" height="88" rx="14" fill="#fff0df" stroke="#d5a36f"/><text x="569" y="249" text-anchor="middle" font-size="18" font-weight="700" fill="#79512e">Constraint</text><text x="569" y="278" text-anchor="middle" font-size="15" fill="#946b43">Reduce memory</text><rect x="690" y="215" width="228" height="88" rx="14" fill="#fce9e5" stroke="#d69c90"/><text x="804" y="249" text-anchor="middle" font-size="18" font-weight="700" fill="#7c4038">Time slot</text><text x="804" y="278" text-anchor="middle" font-size="15" fill="#9a655b">recent · unresolved</text><g stroke="#7c9891" stroke-width="2.5" fill="none"><path d="M137 180 V215 M353 180 V215 M569 180 V215 M804 180 V215"/></g><rect x="42" y="340" width="876" height="104" rx="14" fill="#fff" stroke="#cbdcd5" stroke-width="2"/><text x="70" y="378" font-size="16" fill="#5d7775" font-weight="700">STRUCTURED QUERY FRAME</text><text x="70" y="411" font-size="18" fill="#24444a">intent + entities + constraints + ambiguity + provenance</text><path d="M480 303 V340" stroke="#557a73" stroke-width="3"/></g></svg>