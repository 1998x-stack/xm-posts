<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="fig04-title fig04-desc"><title id="fig04-title">Rewrite Expand Decompose</title><desc id="fig04-desc">Three distinct transformations: rewrite preserves one intent, expansion adds matching terms, decomposition splits a compound query into subqueries.</desc><rect width="960" height="440" rx="24" fill="#f7f9f6"/><rect x="32" y="40" width="896" height="68" rx="14" fill="#e5efeb"/><text x="480" y="82" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#24444a">原始需求：寻找降低 LLM 推理 KV Cache 显存占用的方法</text><g font-family="Arial,'PingFang SC',sans-serif"><rect x="32" y="144" width="280" height="250" rx="16" fill="#e2f1ea" stroke="#83b29f" stroke-width="2"/><text x="172" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#28594c">REWRITE</text><text x="56" y="232" font-size="16" fill="#345d52">规范表达</text><text x="56" y="269" font-size="15" fill="#456d61">“研究降低大语言模型</text><text x="56" y="293" font-size="15" fill="#456d61">推理阶段 KV Cache 显存</text><text x="56" y="317" font-size="15" fill="#456d61">占用的方法。”</text><text x="56" y="365" font-size="13" fill="#597d70">意图保持 · 表达修复</text><rect x="340" y="144" width="280" height="250" rx="16" fill="#fff0df" stroke="#d6a36e" stroke-width="2"/><text x="480" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#80552f">EXPAND</text><text x="364" y="232" font-size="16" fill="#80552f">增加匹配线索</text><text x="364" y="269" font-size="15" fill="#936a43">cache compression</text><text x="364" y="293" font-size="15" fill="#936a43">memory footprint</text><text x="364" y="317" font-size="15" fill="#936a43">quantization · eviction</text><text x="364" y="365" font-size="13" fill="#9b754f">覆盖提升 · 可能引入噪声</text><rect x="648" y="144" width="280" height="250" rx="16" fill="#ece8fa" stroke="#a49acd" stroke-width="2"/><text x="788" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#4f467b">DECOMPOSE</text><text x="672" y="232" font-size="16" fill="#51487b">拆分子目标</text><rect x="672" y="252" width="232" height="34" rx="8" fill="#fff" stroke="#bcb4db"/><text x="788" y="275" text-anchor="middle" font-size="14" fill="#51487b">显存降低机制</text><rect x="672" y="294" width="232" height="34" rx="8" fill="#fff" stroke="#bcb4db"/><text x="788" y="317" text-anchor="middle" font-size="14" fill="#51487b">质量 / 精度影响</text><rect x="672" y="336" width="232" height="34" rx="8" fill="#fff" stroke="#bcb4db"/><text x="788" y="359" text-anchor="middle" font-size="14" fill="#51487b">并发与服务成本</text></g></svg>