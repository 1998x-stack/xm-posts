<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="fig05-title fig05-desc><title id="fig05-title">Conversational Query State</title><desc id="fig05-desc">Each turn updates a structured state: topic, constraints, comparison target and output request, with provenance.</desc><rect width="960" height="470" rx="24" fill="#f6f8f6"/><g font-family="Arial,'PingFang SC',sans-serif"><rect x="34" y="45" width="270" height="90" rx="14" fill="#e2f0e9" stroke="#8bb7a5"/><text x="58" y="78" font-size="15" fill="#51736a" font-weight="700">TURN 1</text><text x="58" y="108" font-size="18" fill="#284c46">找 KV Cache 压缩论文</text><rect x="34" y="175" width="270" height="90" rx="14" fill="#fff0df" stroke="#d5a56f"/><text x="58" y="208" font-size="15" fill="#8d643b" font-weight="700">TURN 2</text><text x="58" y="238" font-size="18" fill="#6f4b2e">只看质量损失较小的方法</text><rect x="34" y="305" width="270" height="90" rx="14" fill="#ece8fa" stroke="#aaa0d0"/><text x="58" y="338" font-size="15" fill="#6c6294" font-weight="700">TURN 3</text><text x="58" y="368" font-size="18" fill="#4c4575">把它们和量化比较</text><path d="M304 90 H365 M304 220 H365 M304 350 H365" stroke="#66877e" stroke-width="2.5" fill="none"/><rect x="365" y="45" width="560" height="350" rx="18" fill="#fff" stroke="#bdcec7" stroke-width="2"/><text x="395" y="86" font-size="20" fill="#284c46" font-weight="700">ACTIVE QUERY STATE</text><g font-size="17" fill="#45615d"><text x="395" y="139">Topic</text><text x="590" y="139" font-weight="700" fill="#24444a">KV Cache compression</text><text x="395" y="190">Constraint</text><text x="590" y="190" font-weight="700" fill="#24444a">quality loss should be small</text><text x="395" y="241">Comparison</text><text x="590" y="241" font-weight="700" fill="#24444a">compression methods vs quantization</text><text x="395" y="292">Output</text><text x="590" y="292" font-weight="700" fill="#24444a">comparative analysis</text><text x="395" y="350">Provenance</text><text x="590" y="350" font-weight="700" fill="#24444a">turn 1 / turn 2 / turn 3</text></g><path d="M170 135 V175 M170 265 V305" stroke="#66877e" stroke-width="2" stroke-dasharray="5 5"/><rect x="365" y="415" width="560" height="34" rx="9" fill="#e7eeeb"/><text x="645" y="438" text-anchor="middle" font-size="14" fill="#4d6963">状态可以新增、覆盖、撤回；每个字段保留来源</text></g></svg>