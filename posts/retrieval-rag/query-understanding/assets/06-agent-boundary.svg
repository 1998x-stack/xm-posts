<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="fig06-title fig06-desc"><title id="fig06-title">Query Understanding and Agent Execution Boundary</title><desc id="fig06-desc">Understanding proposes intent and parameters. Retrieval can proceed with validated queries. Side-effectful tool execution passes through planning, schema validation, authorization and confirmation.</desc><rect width="960" height="420" rx="24" fill="#f6f8f6"/><g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle"><rect x="28" y="150" width="150" height="100" rx="14" fill="#e3efea" stroke="#83b29f" stroke-width="2"/><text x="103" y="188" font-size="19" font-weight="700" fill="#28564b">用户请求</text><text x="103" y="219" font-size="14" fill="#52756a">自然语言</text><rect x="230" y="150" width="190" height="100" rx="14" fill="#ece8fa" stroke="#a59bd0" stroke-width="2"/><text x="325" y="188" font-size="19" font-weight="700" fill="#51477e">Query Understanding</text><text x="325" y="219" font-size="14" fill="#716894">intent · entities · slots</text><rect x="486" y="54" width="190" height="90" rx="14" fill="#e2f1e9" stroke="#83b49a" stroke-width="2"/><text x="581" y="91" font-size="19" font-weight="700" fill="#285943">Retrieval</text><text x="581" y="119" font-size="14" fill="#567b67">Search / RAG</text><rect x="486" y="270" width="190" height="90" rx="14" fill="#fff0df" stroke="#d7a56f" stroke-width="2"/><text x="581" y="307" font-size="19" font-weight="700" fill="#80532e">Agent Planning</text><text x="581" y="335" font-size="14" fill="#966c43">Tool / Workflow</text><rect x="744" y="270" width="188" height="90" rx="14" fill="#fce9e5" stroke="#d69b8f" stroke-width="2"/><text x="838" y="307" font-size="18" font-weight="700" fill="#7a4038">执行前门禁</text><text x="838" y="335" font-size="13" fill="#9a665c">schema · permission</text><path d="M178 200 H230 M420 180 L486 99 M420 220 L486 315 M676 315 H744" fill="none" stroke="#526f70" stroke-width="3"/><rect x="744" y="54" width="188" height="90" rx="14" fill="#e8f1ed" stroke="#83b49a" stroke-width="2"/><text x="838" y="91" font-size="18" font-weight="700" fill="#285943">检索结果</text><text x="838" y="119" font-size="13" fill="#567b67">候选文档 / 证据</text><path d="M676 99 H744" stroke="#526f70" stroke-width="3"/><text x="480" y="29" font-size="14" fill="#617a74">理解层只提出语义解释与候选参数</text><text x="838" y="392" font-size="14" fill="#8c5148">意图 ≠ 授权</text></g></svg>