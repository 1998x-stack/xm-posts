<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="fig07-title fig07-desc"><title id="fig07-title">Query Understanding Evaluation Layers</title><desc id="fig07-desc">Evaluation progresses from intrinsic query understanding metrics to retrieval metrics and final task or interaction outcomes.</desc><rect width="960" height="430" rx="24" fill="#f6f8f6"/><g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle"><rect x="40" y="65" width="260" height="250" rx="17" fill="#e2f0e9" stroke="#83b39f" stroke-width="2"/><text x="170" y="108" font-size="22" font-weight="700" fill="#28594d">INTRINSIC</text><text x="170" y="140" font-size="15" fill="#56776c">理解任务本身</text><g font-size="16" fill="#365d52"><text x="170" y="193">Intent Macro-F1</text><text x="170" y="231">Slot Precision / Recall</text><text x="170" y="269">Entity Linking Accuracy</text></g><rect x="350" y="65" width="260" height="250" rx="17" fill="#fff0df" stroke="#d6a46f" stroke-width="2"/><text x="480" y="108" font-size="22" font-weight="700" fill="#80552f">EXTRINSIC</text><text x="480" y="140" font-size="15" fill="#916b46">检索质量</text><g font-size="16" fill="#805d3b"><text x="480" y="193">Recall@k</text><text x="480" y="231">MRR / nDCG@k</text><text x="480" y="269">Evidence Coverage</text></g><rect x="660" y="65" width="260" height="250" rx="17" fill="#ece8fa" stroke="#a69bd0" stroke-width="2"/><text x="790" y="108" font-size="22" font-weight="700" fill="#51477d">TASK OUTCOME</text><text x="790" y="140" font-size="15" fill="#716792">系统与用户价值</text><g font-size="16" fill="#51477d"><text x="790" y="193">Task Success Rate</text><text x="790" y="231">Clarification Turns</text><text x="790" y="269">Latency / Token Cost</text></g><path d="M300 190 H350 M610 190 H660" stroke="#5e7e76" stroke-width="3"/><path d="M790 315 V365 H170 V315" fill="none" stroke="#7c8e8b" stroke-width="2.5" stroke-dasharray="7 6"/><text x="480" y="398" font-size="15" fill="#5e7771">错误分析反馈：定位理解、检索还是执行阶段的问题</text></g></svg>