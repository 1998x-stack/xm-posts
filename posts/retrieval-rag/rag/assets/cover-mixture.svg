<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="cv-title cv-desc">
<title id="cv-title">RAG-Sequence 与 RAG-Token 的证据路径对比</title><desc id="cv-desc">Sequence 对完整答案使用同一潜在文档；Token 在每个输出词重新按文档权重混合预测。</desc>
<rect width="900" height="360" rx="22" fill="#f8fbf7"/><text x="26" y="42" fill="#25434a" font-size="24" font-weight="750" font-family="system-ui,sans-serif">证据在生成过程中，能不能换？</text><text x="26" y="72" fill="#536f75" font-size="15" font-family="system-ui,sans-serif">同样是 Top-K 文档，两种不同的概率合并方式</text>
<rect x="22" y="91" width="856" height="106" rx="16" fill="#e8f4ef" stroke="#b9d8ce"/><text x="40" y="127" fill="#17665d" font-family="system-ui,sans-serif" font-size="19" font-weight="700">Sequence</text>
<rect x="171" y="110" width="140" height="65" rx="10" fill="#177e70"/><text x="241" y="137" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="18">文档 A</text><text x="241" y="159" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13">同一条路径</text>
<path d="M311 142 H355 l-10 -7 m10 7 l-10 7" stroke="#47847a" stroke-width="3" fill="none"/>
<rect x="366" y="113" width="190" height="61" rx="11" fill="#fff" stroke="#b4d0c8"/><text x="461" y="139" text-anchor="middle" font-family="system-ui,sans-serif" fill="#25434a" font-size="17">预测词 1</text><text x="461" y="160" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5c7575" font-size="14">P(y₁ | A)</text>
<path d="M556 142 H605 l-10 -7 m10 7 l-10 7" stroke="#47847a" stroke-width="3" fill="none"/>
<rect x="616" y="113" width="230" height="61" rx="11" fill="#fff" stroke="#b4d0c8"/><text x="731" y="139" text-anchor="middle" font-family="system-ui,sans-serif" fill="#25434a" font-size="17">预测词 2</text><text x="731" y="160" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5c7575" font-size="14">P(y₂ | A, y₁)</text>
<rect x="22" y="214" width="856" height="121" rx="16" fill="#fdf0e4" stroke="#ead2bc"/><text x="40" y="249" fill="#9b5c2c" font-family="system-ui,sans-serif" font-size="19" font-weight="700">Token</text>
<rect x="171" y="229" width="140" height="38" rx="8" fill="#177e70"/><text x="241" y="254" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16">文档 A</text>
<rect x="171" y="280" width="140" height="38" rx="8" fill="#be773e"/><text x="241" y="305" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16">文档 B</text>
<path d="M314 250 Q340 250 354 272 M314 298 Q340 300 354 285 M314 250 Q564 225 606 273 M314 298 Q565 340 606 298" stroke="#78908b" stroke-width="2.5" fill="none"/>
<rect x="366" y="252" width="190" height="60" rx="11" fill="#fff" stroke="#e2c5a8"/><text x="461" y="277" text-anchor="middle" font-family="system-ui,sans-serif" fill="#25434a" font-size="17">词 1</text><text x="461" y="299" text-anchor="middle" font-family="system-ui,sans-serif" fill="#9c6236" font-size="14">混合 A / B</text>
<rect x="616" y="252" width="230" height="60" rx="11" fill="#fff" stroke="#e2c5a8"/><text x="731" y="277" text-anchor="middle" font-family="system-ui,sans-serif" fill="#25434a" font-size="17">词 2</text><text x="731" y="299" text-anchor="middle" font-family="system-ui,sans-serif" fill="#9c6236" font-size="14">再次混合 A / B</text></svg>