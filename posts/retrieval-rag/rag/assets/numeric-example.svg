<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="num-title num-desc"><title id="num-title">RAG-Sequence 和 RAG-Token 两篇文档算例</title><desc id="num-desc">文档A权重0.6，B权重0.4；Sequence先乘后和得到0.226，Token先和后乘得到0.31。</desc><rect width="900" height="310" rx="20" fill="#f8fbf7"/>
<text x="24" y="42" fill="#25434a" font-size="23" font-weight="750" font-family="system-ui,sans-serif">算术上的区别：乘积在求和里面，还是外面？</text>
<rect x="22" y="68" width="410" height="217" rx="15" fill="#e7f4ef" stroke="#b5d2c9"/><text x="43" y="103" fill="#1b7063" font-size="20" font-weight="750" font-family="system-ui,sans-serif">Sequence · 先乘再和</text>
<text x="43" y="144" fill="#315b56" font-size="18" font-family="system-ui,sans-serif">A：0.6 × (0.9 × 0.3) = 0.162</text><text x="43" y="177" fill="#315b56" font-size="18" font-family="system-ui,sans-serif">B：0.4 × (0.2 × 0.8) = 0.064</text><path d="M43 205 H405" stroke="#b2d2c8"/><text x="43" y="256" fill="#19796c" font-size="34" font-weight="850" font-family="system-ui,sans-serif">0.226</text>
<rect x="448" y="68" width="429" height="217" rx="15" fill="#fbede0" stroke="#e5c7aa"/><text x="469" y="103" fill="#9e622e" font-size="20" font-weight="750" font-family="system-ui,sans-serif">Token · 先和再乘</text>
<text x="469" y="144" fill="#875b37" font-size="18" font-family="system-ui,sans-serif">词1：0.6×0.9 + 0.4×0.2 = 0.62</text><text x="469" y="177" fill="#875b37" font-size="18" font-family="system-ui,sans-serif">词2：0.6×0.3 + 0.4×0.8 = 0.50</text><path d="M469 205 H854" stroke="#e7c5a7"/><text x="469" y="256" fill="#a66130" font-size="30" font-weight="850" font-family="system-ui,sans-serif">0.62 × 0.50 = 0.31</text><text x="24" y="302" fill="#667c77" font-size="13" font-family="system-ui,sans-serif">独立教学算例，不是论文实验数据。</text></svg>