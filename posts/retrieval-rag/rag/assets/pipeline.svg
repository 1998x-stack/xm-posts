<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 330" role="img" aria-labelledby="pipe-title pipe-desc"><title id="pipe-title">检索增强生成的概率流程</title><desc id="pipe-desc">输入问题经DPR查询编码器在文档索引查找Top K段落；BART对每段落预测，最后用检索权重边际化。</desc>
