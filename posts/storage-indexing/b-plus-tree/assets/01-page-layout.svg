<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="bt-f01-title bt-f01-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="bt-f01-title">页式 B+ 树的内部节点、叶节点与链接</title><desc id="bt-f01-desc">根节点以20和40分隔三个子区间；记录只在叶子，叶子顺序相连。</desc><rect x="1" y="1" width="898" height="358" rx="16" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="450" y="39" text-anchor="middle" font-size="20" font-weight="600" fill="#233c44">一个内部页决定去哪里；叶子页回答有什么</text><rect x="360" y="72" width="180" height="60" rx="9" fill="#eeeafa" stroke="#6d61ad" stroke-width="2"/><text x="405" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">20</text><path d="M450 77V127" fill="none" stroke="#6d61ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="495" y="110" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">40</text><path d="M393 132L170 199" fill="none" stroke="#6d61ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M450 132L450 199" fill="none" stroke="#6d61ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M507 132L730 199" fill="none" stroke="#6d61ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="54" y="205" width="225" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="91.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">5</text><path d="M129 210V260" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="166.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">10</text><path d="M204 210V260" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="241.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">15</text><rect x="337" y="205" width="225" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="374.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">20</text><path d="M412 210V260" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="449.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">25</text><path d="M487 210V260" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="524.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">30</text><rect x="620" y="205" width="225" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="657.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">40</text><path d="M695 210V260" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="732.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">45</text><path d="M770 210V260" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="807.5" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">50</text><path d="M279 236H337" fill="none" stroke="#cc764d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M562 236H620" fill="none" stroke="#cc764d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="168" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#526b70">小于 20</text><text x="450" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#526b70">[20,40)</text><text x="731" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#526b70">大于等于 40</text><text x="450" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#526b70">橙色横线 = 叶子 next 指针；紫色连线 = 内部页 downlink</text></svg>