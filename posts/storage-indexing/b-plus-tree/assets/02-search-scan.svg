<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="bt-f02-title bt-f02-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="bt-f02-title">点查找和范围扫描的路径</title><desc id="bt-f02-desc">点查找经根节点定向到一片叶子；范围扫描一次下降后遍历多个链接叶子。</desc><rect x="1" y="1" width="898" height="358" rx="16" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="196" y="51" text-anchor="middle" font-size="19" font-weight="600" fill="#217f78">POINT LOOKUP: k = 27</text><text x="671" y="51" text-anchor="middle" font-size="19" font-weight="600" fill="#cc764d">RANGE: 25 ≤ k ≤ 45</text><rect x="110" y="88" width="172" height="60" rx="9" fill="#eeeafa" stroke="#6d61ad" stroke-width="2"/><text x="153" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">20</text><path d="M196 93V143" fill="none" stroke="#6d61ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="239" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">40</text><rect x="585" y="88" width="172" height="60" rx="9" fill="#eeeafa" stroke="#6d61ad" stroke-width="2"/><text x="628" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">20</text><path d="M671 93V143" fill="none" stroke="#6d61ad" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="714" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">40</text><path d="M196 148V182" fill="none" stroke="#6d61ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M671 148V182" fill="none" stroke="#6d61ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="76" y="191" width="240" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="116" y="229" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">20</text><path d="M156 196V246" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="196" y="229" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">25</text><path d="M236 196V246" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="276" y="229" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">30</text><rect x="539" y="191" width="130" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="571.5" y="229" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">20</text><path d="M604 196V246" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="636.5" y="229" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">25</text><rect x="682" y="191" width="130" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="703.6666666666666" y="229" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">30</text><path d="M725.3333333333334 196V246" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="747" y="229" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">40</text><path d="M768.6666666666666 196V246" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="790.3333333333334" y="229" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">45</text><path d="M669 222H682" fill="none" stroke="#cc764d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="196" y="288" text-anchor="middle" font-size="16" font-weight="600" fill="#526b70">27 不在叶子中 → miss</text><text x="677" y="288" text-anchor="middle" font-size="16" font-weight="600" fill="#cc764d">25 → 30 → 40 → 45</text><text x="450" y="330" text-anchor="middle" font-size="16" font-weight="600" fill="#526b70">点查只要下降 + 叶内比较；范围查依赖叶页顺序与邻接关系</text></svg>