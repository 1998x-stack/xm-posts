<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="bt-f05-title bt-f05-desc" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title id="bt-f05-title">叶子下溢时的借位与合并决策</title><desc id="bt-f05-desc">删除后节点少于最小容量，能借则重分配，不能借则合并并更新父键。</desc><rect x="1" y="1" width="898" height="358" rx="16" fill="#fff" stroke="#dbe6e1" stroke-width="2"/><text x="450" y="43" text-anchor="middle" font-size="20" font-weight="600" fill="#233c44">删除 key → 叶子不足下界 → 先问兄弟能否借出</text><rect x="87" y="85" width="313" height="89" rx="12" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><rect x="500" y="85" width="313" height="89" rx="12" fill="#fff0e5" stroke="#cc764d" stroke-width="2"/><text x="243" y="118" text-anchor="middle" font-size="18" font-weight="600" fill="#217f78">兄弟富余：重新分配</text><text x="243" y="147" text-anchor="middle" font-size="16" font-weight="600" fill="#526b70">调整父页 separator</text><text x="656" y="118" text-anchor="middle" font-size="18" font-weight="600" fill="#cc764d">兄弟也在下界：合并</text><text x="656" y="147" text-anchor="middle" font-size="16" font-weight="600" fill="#526b70">删除一个父 downlink</text><path d="M450 75L243 85" fill="none" stroke="#6d61ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M450 75L656 85" fill="none" stroke="#6d61ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="124" y="220" width="122" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="154.5" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">20</text><path d="M185 225V275" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="215.5" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">25</text><rect x="270" y="220" width="122" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="290.3333333333333" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">30</text><path d="M310.6666666666667 225V275" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="331" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">35</text><path d="M351.3333333333333 225V275" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="371.66666666666663" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">37</text><text x="256" y="311" text-anchor="middle" font-size="15" font-weight="600" fill="#526b70">借位后仍要满足有序与占用约束</text><rect x="534" y="220" width="125" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="596.5" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">20</text><rect x="680" y="220" width="125" height="60" rx="9" fill="#e0f2ec" stroke="#217f78" stroke-width="2"/><text x="711.25" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">30</text><path d="M742.5 225V275" fill="none" stroke="#217f78" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="773.75" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="#233c44">35</text><text x="669" y="311" text-anchor="middle" font-size="15" font-weight="600" fill="#526b70">合并可成 [20,30,35]</text></svg>