<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-labelledby="source-cover-title source-cover-desc"><title id="source-cover-title">从完整 Git clone 到按需对象读取</title><desc id="source-cover-desc">传统客户端获取完整仓库副本，Agent-scale 架构通过服务端查询和缓存按需读取对象。</desc><rect width="840" height="260" rx="18" fill="#eff5f3"/><g font-family="Arial,sans-serif"><text x="30" y="38" fill="#315d57" font-size="16" font-weight="700">THE BOTTLENECK MOVES FROM CODE TO DEVELOPER INFRASTRUCTURE</text><rect x="30" y="78" width="350" height="136" rx="14" fill="#fff" stroke="#c3d7d0" stroke-width="2"/><text x="54" y="112" fill="#315d57" font-size="18" font-weight="700">Git-style clone</text><rect x="54" y="135" width="290" height="48" rx="8" fill="#e8eee9"/><rect x="54" y="135" width="290" height="48" rx="8" fill="none" stroke="#8ab5a7" stroke-width="2"/><text x="76" y="165" fill="#456965" font-size="15">完整历史 / 对象副本</text><rect x="460" y="78" width="350" height="136" rx="14" fill="#fff" stroke="#9fcbb8" stroke-width="2"/><text x="484" y="112" fill="#287d70" font-size="18" font-weight="700">Scion-style service</text><rect x="484" y="135" width="86" height="48" rx="8" fill="#dcefe5"/><rect x="588" y="135" width="86" height="48" rx="8" fill="#dcefe5"/><rect x="692" y="135" width="94" height="48" rx="8" fill="#dcefe5"/><text x="496" y="165" fill="#315d57" font-size="13">trees</text><text x="601" y="165" fill="#315d57" font-size="13">blobs</text><text x="702" y="165" fill="#315d57" font-size="13">API</text><path d="M390 145 H448" stroke="#4c8c7d" stroke-width="4"/><path d="M440 137 L450 145 L440 153" fill="none" stroke="#4c8c7d" stroke-width="3"/><text x="30" y="240" fill="#68847c" font-size="13">Teaching comparison · Scion is an internal design for extreme monorepo / agent workloads, not a general Git replacement.</text></g></svg>
