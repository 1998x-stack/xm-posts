<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="source-changeset-title source-changeset-desc"><title id="source-changeset-title">Changeset 与派生索引</title><desc id="source-changeset-desc">Changeset 记录相对父版本变化的文件和内容寻址 blob；blame、路径历史和提交图索引由 changeset 递归派生。</desc><rect width="840" height="300" rx="18" fill="#f1f6f3"/><g font-family="Arial,sans-serif"><rect x="35" y="84" width="215" height="130" rx="13" fill="#fff" stroke="#a9cfc0" stroke-width="2"/><text x="58" y="119" fill="#287d70" font-size="18" font-weight="700">Changeset</text><text x="58" y="151" fill="#496a66" font-size="14">parent + changed paths</text><text x="58" y="178" fill="#496a66" font-size="14">blob content references</text><path d="M252 149 H311" stroke="#478b7d" stroke-width="4"/><path d="M303 141 L313 149 L303 157" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="320" y="84" width="190" height="130" rx="13" fill="#fff" stroke="#a9cfc0" stroke-width="2"/><text x="343" y="119" fill="#287d70" font-size="18" font-weight="700">Immutable blobs</text><text x="343" y="151" fill="#496a66" font-size="14">content-addressed</text><text x="343" y="178" fill="#496a66" font-size="14">compressed file data</text><path d="M512 149 H571" stroke="#478b7d" stroke-width="4"/><path d="M563 141 L573 149 L563 157" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="580" y="84" width="225" height="130" rx="13" fill="#fff" stroke="#a9cfc0" stroke-width="2"/><text x="603" y="119" fill="#287d70" font-size="18" font-weight="700">Derived data</text><text x="603" y="151" fill="#496a66" font-size="14">blame · path history</text><text x="603" y="178" fill="#496a66" font-size="14">commit graph · search</text><path d="M690 220 V250 H140 V214" fill="none" stroke="#bc8055" stroke-width="3" stroke-dasharray="7 6"/><text x="310" y="275" fill="#925f40" font-size="14">可按需 eager / lazy 计算，不把所有索引塞进每次写入</text></g></svg>
