<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="source-cache-title source-cache-desc"><title id="source-cache-title">Scion 分层对象缓存</title><desc id="source-cache-desc">本机 daemon 连接区域 cache，cache 未命中时再向服务端读取 Spanner 或云对象存储；各层使用相同 RPC 协议。</desc><rect width="840" height="300" rx="18" fill="#f1f6f3"/><g font-family="Arial,sans-serif"><rect x="25" y="86" width="150" height="112" rx="12" fill="#fff" stroke="#b8d5c8" stroke-width="2"/><text x="47" y="121" fill="#287d70" font-size="17" font-weight="700">Agent / CI</text><text x="47" y="151" fill="#496a66" font-size="14">sparse client</text><path d="M177 142 H220" stroke="#478b7d" stroke-width="4"/><path d="M212 134 L222 142 L212 150" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="230" y="86" width="160" height="112" rx="12" fill="#fff" stroke="#b8d5c8" stroke-width="2"/><text x="252" y="121" fill="#287d70" font-size="17" font-weight="700">scion-daemon</text><text x="252" y="151" fill="#496a66" font-size="14">node object store</text><path d="M392 142 H435" stroke="#478b7d" stroke-width="4"/><path d="M427 134 L437 142 L427 150" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="445" y="86" width="150" height="112" rx="12" fill="#fff" stroke="#b8d5c8" stroke-width="2"/><text x="467" y="121" fill="#287d70" font-size="17" font-weight="700">scion-cache</text><text x="467" y="151" fill="#496a66" font-size="14">regional cache</text><path d="M597 142 H640" stroke="#478b7d" stroke-width="4"/><path d="M632 134 L642 142 L632 150" fill="none" stroke="#478b7d" stroke-width="3"/><rect x="650" y="86" width="165" height="112" rx="12" fill="#fff" stroke="#b8d5c8" stroke-width="2"/><text x="672" y="121" fill="#287d70" font-size="17" font-weight="700">scion-server</text><text x="672" y="151" fill="#496a66" font-size="14">Spanner / blob</text><text x="25" y="240" fill="#68847c" font-size="13">对象不可变 → 任意缓存可复用；缺失时逐层回源；故障域通过 tiering 隔离。</text></g></svg>
