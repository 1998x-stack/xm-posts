<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="source-results-title source-results-desc"><title id="source-results-title">Anthropic 报告的 Scion 工程结果</title><desc id="source-results-desc">官方文章报告缓存命中率超过百分之九十九、基础设施 CPU 和内存 footprint 缩小约二百倍、CI 与研究 checkout 提速两个数量级，CI 获得百分之二十五 CPU 容量收益。</desc><rect width="840" height="270" rx="18" fill="#eff5f1"/><g font-family="Arial,sans-serif"><g><rect x="30" y="56" width="180" height="150" rx="13" fill="#fff" stroke="#b9d4c8" stroke-width="2"/><text x="52" y="105" fill="#287d70" font-size="32" font-weight="700">&gt;99%</text><text x="52" y="139" fill="#496a66" font-size="14">cache hit rate</text><text x="52" y="170" fill="#68847c" font-size="12">Anthropic reported</text></g><g><rect x="230" y="56" width="180" height="150" rx="13" fill="#fff" stroke="#b9d4c8" stroke-width="2"/><text x="252" y="105" fill="#287d70" font-size="32" font-weight="700">200×</text><text x="252" y="139" fill="#496a66" font-size="14">CPU / memory</text><text x="252" y="170" fill="#68847c" font-size="12">smaller footprint</text></g><g><rect x="430" y="56" width="180" height="150" rx="13" fill="#fff" stroke="#b9d4c8" stroke-width="2"/><text x="452" y="105" fill="#287d70" font-size="32" font-weight="700">100×</text><text x="452" y="139" fill="#496a66" font-size="14">checkout speed</text><text x="452" y="170" fill="#68847c" font-size="12">orders of magnitude</text></g><g><rect x="630" y="56" width="180" height="150" rx="13" fill="#fff" stroke="#b9d4c8" stroke-width="2"/><text x="652" y="105" fill="#287d70" font-size="32" font-weight="700">25%</text><text x="652" y="139" fill="#496a66" font-size="14">CI CPU capacity</text><text x="652" y="170" fill="#68847c" font-size="12">reported gain</text></g><text x="30" y="239" fill="#68847c" font-size="13">Company-reported results, not an independent benchmark; see source scope and caveats.</text></g></svg>
