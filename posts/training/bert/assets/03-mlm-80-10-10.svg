<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 297" role="img" aria-labelledby="bert-mask-rules-title bert-mask-rules-desc"><title id="bert-mask-rules-title">MLM 80/10/10 替换规则</title><desc id="bert-mask-rules-desc">从 15% 目标位置的条件概率中 80% MASK、10% 随机、10% 原词。</desc><rect width="900" height="297" fill="#fbfcfa"/><text x="450" y="41" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="650" fill="#2d5b59">抽取 15% 的可训练 WordPiece 位置作为监督目标</text><rect x="40" y="74" width="270" height="142" rx="11" fill="#def0e6" stroke="#c6ded1"/><text x="175" y="112" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="27" font-weight="650" fill="#2d5b59">80%</text><text x="175" y="152" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">[MASK]</text><text x="175" y="183" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" fill="#2d5b59">hairy → [MASK]</text><rect x="334" y="74" width="270" height="142" rx="11" fill="#faeadb" stroke="#c6ded1"/><text x="469" y="112" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="27" font-weight="650" fill="#2d5b59">10%</text><text x="469" y="152" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">随机 token</text><text x="469" y="183" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" fill="#2d5b59">hairy → apple</text><rect x="628" y="74" width="270" height="142" rx="11" fill="#ece8f7" stroke="#c6ded1"/><text x="763" y="112" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="27" font-weight="650" fill="#2d5b59">10%</text><text x="763" y="152" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">保持原词</text><text x="763" y="183" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" fill="#2d5b59">hairy → hairy</text><text x="450" y="267" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" fill="#2d5b59">三条分支均用原始 token 作为 target；未选中的位置不计入 MLM Loss。</text></svg>
