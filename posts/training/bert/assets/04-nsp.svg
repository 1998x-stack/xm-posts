<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 293" role="img" aria-labelledby="bert-nsp-title bert-nsp-desc"><title id="bert-nsp-title">BERT Next Sentence Prediction</title><desc id="bert-nsp-desc">正样本 B 为 A 实际后续文本片段，负样本 B 随机采样。</desc><rect width="900" height="293" fill="#fbfcfa"/><text x="450" y="40" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="650" fill="#2d5b59">NSP：50% IsNext / 50% NotNext</text><rect x="32" y="69" width="405" height="152" rx="11" fill="#e3f3e9" stroke="#c6ded1"/><rect x="463" y="69" width="405" height="152" rx="11" fill="#fae9df" stroke="#c6ded1"/><text x="235" y="100" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">真实后续片段</text><text x="665" y="100" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">随机片段</text><text x="235" y="148" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="650" fill="#2d5b59">A：她打开一本书。</text><text x="235" y="181" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="650" fill="#2d5b59">B：随后翻到第一页。</text><text x="665" y="148" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="650" fill="#2d5b59">A：她打开一本书。</text><text x="665" y="181" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="650" fill="#2d5b59">B：火星是一颗行星。</text><text x="450" y="267" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" fill="#2d5b59">[CLS] 最终隐藏状态承担是否相邻的二分类；例句为教学示例。</text></svg>
