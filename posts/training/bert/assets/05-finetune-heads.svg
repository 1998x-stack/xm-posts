<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 289" role="img" aria-labelledby="bert-heads-title bert-heads-desc"><title id="bert-heads-title">BERT 针对多个下游任务微调</title><desc id="bert-heads-desc">句子分类用 CLS，token 任务读取各位置隐藏态，问答预测起止位置。</desc><rect width="900" height="289" fill="#fbfcfa"/><text x="450" y="42" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="650" fill="#2d5b59">同一预训练 Encoder → 各任务分别初始化并微调</text><rect x="34" y="73" width="260" height="64" rx="11" fill="#e7e7f7" stroke="#c6ded1"/><text x="164" y="100" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">句子级分类</text><text x="164" y="126" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" fill="#2d5b59">[CLS] → class</text><path d="M164 150v25" stroke="#84ada0" stroke-width="3" fill="none"/><rect x="34" y="182" width="260" height="70" rx="11" fill="#dff1e9" stroke="#c6ded1"/><text x="164" y="225" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">BERT Encoder</text><rect x="326" y="73" width="260" height="64" rx="11" fill="#e7e7f7" stroke="#c6ded1"/><text x="456" y="100" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">Token 标注</text><text x="456" y="126" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" fill="#2d5b59">Tᵢ → tag</text><path d="M456 150v25" stroke="#84ada0" stroke-width="3" fill="none"/><rect x="326" y="182" width="260" height="70" rx="11" fill="#dff1e9" stroke="#c6ded1"/><text x="456" y="225" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">BERT Encoder</text><rect x="618" y="73" width="260" height="64" rx="11" fill="#e7e7f7" stroke="#c6ded1"/><text x="748" y="100" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">抽取式 QA</text><text x="748" y="126" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="650" fill="#2d5b59">Tᵢ → start / end</text><path d="M748 150v25" stroke="#84ada0" stroke-width="3" fill="none"/><rect x="618" y="182" width="260" height="70" rx="11" fill="#dff1e9" stroke="#c6ded1"/><text x="748" y="225" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2d5b59">BERT Encoder</text></svg>
