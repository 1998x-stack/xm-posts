<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="cc-alloc-title cc-alloc-desc"><title id="cc-alloc-title">同一训练预算的两种分配方案</title><desc id="cc-alloc-desc">Gopher 为280B参数和300B训练token，Chinchilla为70B参数和1400B训练token；两者训练计算量接近。</desc><rect x="1" y="1" width="798" height="358" rx="18" fill="#fbfdfb" stroke="#d8e6dd"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#23434a" font-weight="750" >同一个训练 FLOPs 预算：参数和数据怎么分？</text><rect x="30" y="85" width="348" height="190" rx="13" fill="#f1e9e0" stroke="#eed6c7"/><text x="54" y="116" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#a45b3c" font-weight="800" >GOPHER · 2021</text><text x="54" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="47" fill="#a45b3c" font-weight="800" >280B</text><text x="207" y="165" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#315258" font-weight="500" >parameters</text><text x="54" y="213" font-family="system-ui,'PingFang SC',sans-serif" font-size="35" fill="#a45b3c" font-weight="750" >300B</text><text x="178" y="210" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#315258" font-weight="500" >training tokens</text><rect x="422" y="85" width="348" height="190" rx="13" fill="#e5f3ed" stroke="#cae2d4"/><text x="446" y="116" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#08776e" font-weight="800" >CHINCHILLA · 2022</text><text x="446" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="47" fill="#08776e" font-weight="800" >70B</text><text x="574" y="165" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#315258" font-weight="500" >parameters</text><text x="446" y="213" font-family="system-ui,'PingFang SC',sans-serif" font-size="35" fill="#08776e" font-weight="750" >1.4T</text><text x="565" y="210" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#315258" font-weight="500" >training tokens</text><text x="40" y="318" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#a45b3c" font-weight="700" >参数 1/4</text><text x="423" y="318" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#08776e" font-weight="700" >数据约 4.7×（按表 1 四舍五入数据计算）</text></svg>
