<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="cc-isoflop-title cc-isoflop-desc"><title id="cc-isoflop-title">等计算量下的损失谷底</title><desc id="cc-isoflop-desc">保持训练计算量不变时，过小模型与过大模型都可能增加最终损失；曲线仅为机制示意，不是论文原始数据。</desc><rect x="1" y="1" width="798" height="358" rx="18" fill="#fbfdfb" stroke="#d8e6dd"/><text x="36" y="43" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#23434a" font-weight="750" >IsoFLOP：固定预算，寻找最低损失</text><path d="M92 80V280H747" fill="none" stroke="#8ea8a4" stroke-width="2"/><text x="22" y="87" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#315258" font-weight="500" >Loss</text><text x="540" y="315" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#315258" font-weight="500" >模型参数量 N →</text><path d="M112 125 C220 215 255 272 384 275 C522 270 572 150 715 110" fill="none" stroke="#297f77" stroke-width="6" stroke-linecap="round"/><path d="M384 275V82" stroke="#b36c4a" stroke-width="2" stroke-dasharray="8 7"/><circle cx="384" cy="275" r="9" fill="#b36c4a" stroke="white" stroke-width="4"/><rect x="280" y="100" width="220" height="69" rx="13" fill="#fff6ef" stroke="#e6c8b1"/><text x="298" y="129" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#9a5f3c" font-weight="750" >损失最低：</text><text x="298" y="152" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#9a5f3c" font-weight="500" >参数 / token 平衡</text><text x="106" y="235" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#627b7d" font-weight="500" >模型小、数据多</text><text x="569" y="239" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#627b7d" font-weight="500" >模型大、数据少</text><text x="43" y="343" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#718789" font-weight="500" >示意曲线：形状说明 trade-off，不代表 Figure 3 的测量点</text></svg>
