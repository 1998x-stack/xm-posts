<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="cc-methods-title cc-methods-desc"><title id="cc-methods-title">三种推导路径相互验证</title><desc id="cc-methods-desc">方法一对不同训练步数的曲线取最小包络；方法二在九组固定FLOPs下找到最低点；方法三拟合参数化损失函数。</desc><rect x="1" y="1" width="798" height="358" rx="18" fill="#fbfdfb" stroke="#d8e6dd"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#23434a" font-weight="750" >三条路径 · 同一个结论</text><rect x="28" y="75" width="238" height="216" rx="13" fill="#e9f3f0" stroke="#b9d9ce"/><text x="46" y="109" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#08776e" font-weight="800" >01 · Curve envelope</text><path d="M48 218 C95 160 135 174 244 141" stroke="#247f78" stroke-width="4" fill="none"/><path d="M48 253 C110 221 175 204 244 204" stroke="#ca8460" stroke-width="4" fill="none"/><path d="M48 260 C130 231 188 195 244 141" stroke="#4c78a0" stroke-width="3" fill="none" stroke-dasharray="5 4"/><text x="48" y="281" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#315258" font-weight="500" >取最优训练曲线包络</text><rect x="281" y="75" width="238" height="216" rx="13" fill="#f8efe6" stroke="#e7d7c8"/><text x="299" y="109" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#a45b3c" font-weight="800" >02 · IsoFLOP valleys</text><path d="M304 161 Q397 282 494 162" stroke="#c87955" stroke-width="5" fill="none"/><circle cx="399" cy="222" r="8" fill="#a45b3c"/><text x="302" y="281" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#315258" font-weight="500" >固定 C，横向扫模型大小</text><rect x="534" y="75" width="238" height="216" rx="13" fill="#eeeaf7" stroke="#ded4ee"/><text x="552" y="109" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#66549e" font-weight="800" >03 · Fitted loss</text><text x="554" y="164" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#66549e" font-weight="700" >E + A/N^α</text><text x="554" y="204" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#66549e" font-weight="700" >+ B/D^β</text><text x="552" y="281" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#315258" font-weight="500" >拟合 L(N, D) 后求约束最优</text><text x="58" y="328" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#276d6a" font-weight="700" >三个方法都推得：增加预算时，参数与 tokens 大致按相近比例扩大。</text></svg>
