<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="cc-frontier-title cc-frontier-desc"><title id="cc-frontier-title">固定训练计算的双曲线与最优位置</title><desc id="cc-frontier-desc">简化成本约束C约等于6ND；在固定C时D与N成反比，最优点由损失函数而非成本公式单独确定。</desc><rect x="1" y="1" width="798" height="358" rx="18" fill="#fbfdfb" stroke="#d8e6dd"/><text x="30" y="43" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#23434a" font-weight="750" >固定 C：D = C / (6N)</text><path d="M105 85V290H745" stroke="#819f9e" stroke-width="2" fill="none"/><text x="22" y="98" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#315258" font-weight="500" >Tokens D</text><text x="603" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#315258" font-weight="500" >Parameters N</text><path d="M150 105C220 170 309 219 390 248S590 270 708 280" stroke="#247d78" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="390" cy="248" r="10" fill="#b9704b" stroke="white" stroke-width="4"/><path d="M390 248V287M390 248H106" stroke="#b9704b" stroke-width="2" stroke-dasharray="5 5"/><rect x="431" y="128" width="293" height="92" rx="13" fill="#fff4e9" stroke="#e6ceb7"/><text x="452" y="156" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#9d593a" font-weight="700" >Chinchilla 参考点</text><text x="452" y="185" font-family="system-ui,'PingFang SC',sans-serif" font-size="26" fill="#9d593a" font-weight="800" >70B / 1.4T</text><text x="80" y="350" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#657d7d" font-weight="500" >成本曲线上每一点预算相近，但预测损失可能不同</text></svg>
