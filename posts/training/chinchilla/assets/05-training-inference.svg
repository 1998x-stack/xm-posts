<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="cc-boundary-title cc-boundary-desc"><title id="cc-boundary-title">训练算力最优与推理部署最优不同</title><desc id="cc-boundary-desc">在相同训练FLOPs约束下，较小参数规模可带来更低的单token权重访问与模型存储开销；实际成本随系统、序列长度和请求量变化。</desc><rect x="1" y="1" width="798" height="358" rx="18" fill="#fbfdfb" stroke="#d8e6dd"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#23434a" font-weight="750" >训练 FLOPs 不等于全生命周期成本</text><rect x="38" y="90" width="724" height="90" rx="13" fill="#edf4f0" stroke="#b9d9ce"/><text x="56" y="121" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#277a71" font-weight="800" >训练</text><text x="56" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#315258" font-weight="500" >C_train ≈ 6 N D；先定义训练预算，再优化预训练损失</text><rect x="38" y="201" width="724" height="90" rx="13" fill="#f9efe6" stroke="#e9d3be"/><text x="56" y="232" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#b46e4e" font-weight="800" >部署</text><text x="56" y="261" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#315258" font-weight="500" >模型权重 / KV Cache / 批量 / 延迟 / 服务 token 数，共同决定总成本</text><text x="44" y="330" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#697d7b" font-weight="500" >20 tokens/parameter 是训练期经验参考，不是所有系统的通用最优解。</text></svg>
