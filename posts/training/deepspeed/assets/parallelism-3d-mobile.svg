<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 790" role="img" aria-labelledby="pm-title pm-desc">
<title id="pm-title">DP、TP、PP 三种模型并行方式</title><desc id="pm-desc">DP 切分样本，TP 切分同一层的矩阵，PP 将不同层放在不同设备阶段；三者可组合为 3D parallelism。</desc>
<rect width="560" height="790" rx="20" fill="#f5f8f4"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="28" y="48" font-size="25" font-weight="750" fill="#203c3e">三种并行：切分的对象不同</text>
<g fill="#fff" stroke="#d6e1da"><rect x="30" y="83" width="500" height="170" rx="13"/><rect x="30" y="276" width="500" height="170" rx="13"/><rect x="30" y="469" width="500" height="170" rx="13"/></g>
<text x="55" y="121" font-size="23" font-weight="800" fill="#1d796f">Data Parallel · DP</text><text x="55" y="160" font-size="17" fill="#526c66">每张卡运行完整模型副本</text><text x="55" y="190" font-size="17" fill="#526c66">不同 rank 处理不同样本</text><text x="55" y="220" font-size="17" fill="#526c66">ZeRO 在 DP 组内切分模型状态</text>
<text x="55" y="314" font-size="23" font-weight="800" fill="#6d66a9">Tensor Parallel · TP</text><text x="55" y="353" font-size="17" fill="#526c66">同一层的权重矩阵被切成多个 shard</text><text x="55" y="383" font-size="17" fill="#526c66">各 GPU 计算部分结果，再做集合通信</text><text x="55" y="413" font-size="17" fill="#526c66">适合单层矩阵本身过大的情况</text>
<text x="55" y="507" font-size="23" font-weight="800" fill="#b16f42">Pipeline Parallel · PP</text><text x="55" y="546" font-size="17" fill="#526c66">不同 Transformer 层分配到不同阶段</text><text x="55" y="576" font-size="17" fill="#526c66">micro-batch 依次通过各个阶段</text><text x="55" y="606" font-size="17" fill="#526c66">需要管理 pipeline bubble 与负载平衡</text>
<rect x="30" y="671" width="500" height="75" rx="12" fill="#e4f1eb"/><text x="280" y="704" font-size="20" text-anchor="middle" font-weight="800" fill="#276d64">3D Parallelism = DP × TP × PP</text><text x="280" y="729" font-size="14" text-anchor="middle" fill="#54766d">ZeRO 通常作用于 DP 维度的模型状态分片</text>
</g></svg>