<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="parallel-title parallel-desc">
<title id="parallel-title">数据并行、张量并行与流水线并行的职责差异</title>
<desc id="parallel-desc">数据并行把样本分给多个模型副本；张量并行把一个层的矩阵计算切到多个 GPU；流水线并行把不同层分配给不同设备并用 micro-batch 填充流水线。大模型训练可以组合三者，并在数据并行维度使用 ZeRO。</desc>
<rect width="960" height="410" rx="22" fill="#f5f8f4"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="45" font-size="22" font-weight="750" fill="#203c3e">并行不是同一种切法：切数据、切层内矩阵、切层</text>
<g fill="#fff" stroke="#d6e1da">
<rect x="34" y="82" width="282" height="248" rx="13"/><rect x="339" y="82" width="282" height="248" rx="13"/><rect x="644" y="82" width="282" height="248" rx="13"/>
</g>
<g font-size="18" font-weight="800" text-anchor="middle"><text x="175" y="116" fill="#1d796f">Data Parallel · DP</text><text x="480" y="116" fill="#6d66a9">Tensor Parallel · TP</text><text x="785" y="116" fill="#b16f42">Pipeline Parallel · PP</text></g>
<g fill="#e7f3ef" stroke="#8ebeb0"><rect x="60" y="142" width="94" height="62" rx="7"/><rect x="195" y="142" width="94" height="62" rx="7"/></g>
<g fill="#fff" stroke="#8ebeb0"><rect x="69" y="153" width="76" height="38" rx="4"/><rect x="204" y="153" width="76" height="38" rx="4"/></g>
<g font-size="12" text-anchor="middle" fill="#3e6e66"><text x="107" y="176">模型副本 A</text><text x="242" y="176">模型副本 B</text><text x="107" y="226">Batch A</text><text x="242" y="226">Batch B</text></g>
<path d="M154 173 H195" stroke="#1d796f" stroke-width="2.5"/><path d="M187 167 L195 173 L187 179" fill="none" stroke="#1d796f" stroke-width="2.5"/>
<g fill="#eeeefa" stroke="#aaa7d0"><rect x="366" y="142" width="78" height="76" rx="7"/><rect x="450" y="142" width="78" height="76" rx="7"/><rect x="534" y="142" width="62" height="76" rx="7"/></g>
<g font-size="12" text-anchor="middle" fill="#5c5892"><text x="405" y="173">W₁</text><text x="489" y="173">W₂</text><text x="565" y="173">W₃</text><text x="405" y="198">切片</text><text x="489" y="198">切片</text><text x="565" y="198">切片</text></g>
<g fill="#fbefe5" stroke="#d8ae88"><rect x="670" y="142" width="70" height="76" rx="7"/><rect x="750" y="142" width="70" height="76" rx="7"/><rect x="830" y="142" width="70" height="76" rx="7"/></g>
<g font-size="12" text-anchor="middle" fill="#9b663f"><text x="705" y="170">Stage 1</text><text x="785" y="170">Stage 2</text><text x="865" y="170">Stage 3</text><text x="705" y="195">Layers</text><text x="785" y="195">Layers</text><text x="865" y="195">Layers</text></g>
<g font-size="13" fill="#526c66"><text x="60" y="270">每个 rank 处理不同样本</text><text x="60" y="293">梯度同步 / ZeRO 切分状态</text><text x="365" y="270">同一层的矩阵分片</text><text x="365" y="293">局部乘法 + 集合通信</text><text x="670" y="270">不同层驻留不同设备</text><text x="670" y="293">micro-batch 流过阶段</text></g>
<rect x="34" y="350" width="892" height="38" rx="8" fill="#e4f1eb"/>
<text x="480" y="375" font-size="15" text-anchor="middle" font-weight="750" fill="#276d64">3D Parallelism = DP × TP × PP；ZeRO 通常作用于 DP 维度的模型状态分片</text>
</g>
</svg>