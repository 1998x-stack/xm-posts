<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="dpo-fig-1-title dpo-fig-1-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dpo-fig-1-title">传统 RLHF 与 DPO 的训练路径</title><desc id="dpo-fig-1-desc">传统路线包含奖励模型和 PPO 更新；DPO 在偏好成对数据上直接优化策略，不需要独立奖励模型训练或在线 PPO 采样。</desc><rect x="0" y="0" width="760" height="320" rx="12" fill="#fbfcfa" stroke="#fbfcfa" stroke-width="1.5"/><text x="36" y="40" font-size="18" fill="#496068" font-weight="700" text-anchor="start">传统 RLHF</text><rect x="20" y="61" width="207" height="93" rx="14" fill="#eaf2f5" stroke="#c8dbe2" stroke-width="1.5"/><text x="123" y="99" font-size="19" fill="#29444a" font-weight="600" text-anchor="middle">SFT 策略</text><text x="123" y="127" font-size="14" fill="#617981" font-weight="600" text-anchor="middle">πref 初始化</text><rect x="276" y="61" width="207" height="93" rx="14" fill="#f9ebdd" stroke="#e9c4a5" stroke-width="1.5"/><text x="379" y="99" font-size="18" fill="#925d39" font-weight="600" text-anchor="middle">训练奖励模型</text><text x="379" y="127" font-size="16" fill="#925d39" font-weight="600" text-anchor="middle">rφ(x, y)</text><rect x="533" y="61" width="207" height="93" rx="14" fill="#f7e8e4" stroke="#eac5bb" stroke-width="1.5"/><text x="636" y="99" font-size="19" fill="#a35d4d" font-weight="600" text-anchor="middle">PPO / RL</text><text x="636" y="127" font-size="14" fill="#975e4d" font-weight="600" text-anchor="middle">策略迭代与采样</text><line x1="227" y1="107" x2="276" y2="107" stroke="#2e827a" stroke-width="2" /><line x1="483" y1="107" x2="533" y2="107" stroke="#2e827a" stroke-width="2" /><text x="380" y="185" font-size="16" fill="#47646b" font-weight="600" text-anchor="middle">同一份偏好对数据 D = {(x, yw, yl)}</text><rect x="20" y="207" width="207" height="85" rx="14" fill="#eaf2f5" stroke="#c8dbe2" stroke-width="1.5"/><text x="123" y="243" font-size="19" fill="#29444a" font-weight="600" text-anchor="middle">SFT 策略</text><text x="123" y="269" font-size="14" fill="#617981" font-weight="600" text-anchor="middle">冻结参考 πref</text><rect x="276" y="207" width="464" height="85" rx="14" fill="#e1f2ed" stroke="#a4d0c2" stroke-width="1.5"/><text x="508" y="243" font-size="18" fill="#207269" font-weight="600" text-anchor="middle">DPO：直接比较相对对数概率</text><text x="508" y="270" font-size="14" fill="#207269" font-weight="600" text-anchor="middle">更新 πθ，不单独训练 rφ 或 PPO</text><line x1="227" y1="247" x2="276" y2="247" stroke="#2e827a" stroke-width="2" /><text x="36" y="198" font-size="18" fill="#207269" font-weight="700" text-anchor="start">DPO</text></svg>
