<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="dpo-fig-2-title dpo-fig-2-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dpo-fig-2-title">同一个 prompt 的偏好对</title><desc id="dpo-fig-2-desc">输入 x 对应 chosen 与 rejected 两个回答；两者都经过可训练策略和冻结参考策略的概率评估。</desc><rect x="0" y="0" width="760" height="300" rx="12" fill="#fbfcfa" stroke="#fbfcfa" stroke-width="1.5"/><rect x="24" y="34" width="712" height="64" rx="14" fill="#eef3f0" stroke="#c9ddd5" stroke-width="1.5"/><text x="380" y="60" font-size="18" fill="#29444a" font-weight="600" text-anchor="middle">Prompt x：如何解释梯度裁剪？</text><text x="380" y="84" font-size="13" fill="#698078" font-weight="600" text-anchor="middle">同一输入条件，不是两个独立问题</text><rect x="26" y="138" width="334" height="107" rx="14" fill="#e3f2ed" stroke="#add6ca" stroke-width="1.5"/><text x="193" y="169" font-size="18" fill="#1f7368" font-weight="700" text-anchor="middle">chosen  yw</text><text x="193" y="197" font-size="16" fill="#29444a" font-weight="600" text-anchor="middle">给出定义、阈值与使用情景</text><text x="193" y="226" font-size="14" fill="#1f7368" font-weight="600" text-anchor="middle">偏好标签：更好</text><rect x="400" y="138" width="334" height="107" rx="14" fill="#fbede4" stroke="#e4bfaa" stroke-width="1.5"/><text x="567" y="169" font-size="18" fill="#b16b45" font-weight="700" text-anchor="middle">rejected  yl</text><text x="567" y="197" font-size="16" fill="#29444a" font-weight="600" text-anchor="middle">只说“调低学习率即可”</text><text x="567" y="226" font-size="14" fill="#b16b45" font-weight="600" text-anchor="middle">偏好标签：较差</text><line x1="196" y1="98" x2="196" y2="138" stroke="#688580" stroke-width="2" /><line x1="564" y1="98" x2="564" y2="138" stroke="#688580" stroke-width="2" /><text x="380" y="279" font-size="15" fill="#49656b" font-weight="600" text-anchor="middle">比较的是相对参考模型的变化，不是回答本身的绝对概率</text></svg>
