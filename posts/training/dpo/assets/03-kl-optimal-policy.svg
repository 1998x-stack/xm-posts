<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" role="img" aria-labelledby="dpo-fig-3-title dpo-fig-3-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dpo-fig-3-title">KL 正则化目标到指数倾斜分布</title><desc id="dpo-fig-3-desc">从最大化期望奖励减去 beta KL 出发，最优策略等于参考分布乘以奖励指数权重并重新归一化。</desc><rect x="0" y="0" width="760" height="308" rx="12" fill="#fbfcfa" stroke="#fbfcfa" stroke-width="1.5"/><rect x="28" y="33" width="704" height="59" rx="14" fill="#edf3f0" stroke="#cbded4" stroke-width="1.5"/><text x="380" y="69" font-size="19" fill="#284b4c" font-weight="600" text-anchor="middle">最大化   Eπ[r(x,y)] − β KL(π || πref)</text><text x="380" y="125" font-size="15" fill="#60777b" font-weight="600" text-anchor="middle">固定 x，对所有候选 y 做归一化</text><rect x="28" y="146" width="331" height="100" rx="14" fill="#e7f3f1" stroke="#b4d6cc" stroke-width="1.5"/><text x="193" y="184" font-size="21" fill="#207269" font-weight="600" text-anchor="middle">πref(y | x)</text><text x="193" y="214" font-size="15" fill="#4b716e" font-weight="600" text-anchor="middle">原始概率质量</text><rect x="400" y="146" width="332" height="100" rx="14" fill="#f9eee5" stroke="#e4c5b1" stroke-width="1.5"/><text x="566" y="184" font-size="20" fill="#a36644" font-weight="600" text-anchor="middle">exp(r(x,y) / β)</text><text x="566" y="214" font-size="15" fill="#8c6e59" font-weight="600" text-anchor="middle">奖励偏置权重</text><text x="380" y="199" font-size="28" fill="#526b72" font-weight="600" text-anchor="middle">×</text><text x="380" y="275" font-size="19" fill="#294c4e" font-weight="600" text-anchor="middle">π*(y | x) = πref(y | x) · exp(r/β) / Z(x)</text></svg>
