<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-labelledby="dpo-fig-4-title dpo-fig-4-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dpo-fig-4-title">隐式奖励中的归一化项抵消</title><desc id="dpo-fig-4-desc">同一个 prompt 的两个候选答案相减时，依赖 x 的 beta log Z(x) 在奖励差中严格抵消。</desc><rect x="0" y="0" width="760" height="348" rx="12" fill="#fbfcfa" stroke="#fbfcfa" stroke-width="1.5"/><rect x="24" y="32" width="712" height="56" rx="14" fill="#eff5f2" stroke="#d8e5df" stroke-width="1.5"/><text x="380" y="67" font-size="17" fill="#2a4b50" font-weight="600" text-anchor="middle">r(x,y) = β log [ π*(y|x) / πref(y|x) ] + β log Z(x)</text><rect x="29" y="124" width="330" height="113" rx="14" fill="#e4f2ed" stroke="#b5d4c8" stroke-width="1.5"/><text x="194" y="161" font-size="19" fill="#257369" font-weight="600" text-anchor="middle">r(x, yw)</text><text x="194" y="191" font-size="15" fill="#406865" font-weight="600" text-anchor="middle">β log ratio(w) + β log Z(x)</text><rect x="401" y="124" width="330" height="113" rx="14" fill="#f9eee6" stroke="#e8ceb9" stroke-width="1.5"/><text x="566" y="161" font-size="19" fill="#aa6a43" font-weight="600" text-anchor="middle">r(x, yl)</text><text x="566" y="191" font-size="15" fill="#826756" font-weight="600" text-anchor="middle">β log ratio(l) + β log Z(x)</text><text x="380" y="186" font-size="29" fill="#536870" font-weight="600" text-anchor="middle">−</text><rect x="29" y="264" width="702" height="58" rx="14" fill="#e6f2eb" stroke="#b7d8c9" stroke-width="1.5"/><text x="380" y="300" font-size="20" fill="#236e65" font-weight="600" text-anchor="middle">Δr = β [ log ratio(w) − log ratio(l) ]</text><line x1="194" y1="237" x2="194" y2="264" stroke="#2e827a" stroke-width="2" /><line x1="566" y1="237" x2="566" y2="264" stroke="#2e827a" stroke-width="2" /></svg>
