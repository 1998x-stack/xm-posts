<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" role="img" aria-labelledby="dpo-fig-5-title dpo-fig-5-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dpo-fig-5-title">Completion-only 概率的 token 级计算</title><desc id="dpo-fig-5-desc">自回归模型总对数概率为生成答案各 token 的条件对数概率求和，prompt 和 padding 必须排除。</desc><rect x="0" y="0" width="760" height="305" rx="12" fill="#fbfcfa" stroke="#fbfcfa" stroke-width="1.5"/><rect x="21" y="32" width="718" height="65" rx="14" fill="#eef3f1" stroke="#cfded9" stroke-width="1.5"/><text x="380" y="60" font-size="19" fill="#29444a" font-weight="600" text-anchor="middle">πθ(y|x) = ∏ₜ pθ(yₜ | x, y&lt;t)</text><text x="380" y="83" font-size="17" fill="#60777c" font-weight="600" text-anchor="middle">log πθ(y|x) = Σₜ log pθ(yₜ | x, y&lt;t)</text><rect x="31" y="138" width="151" height="77" rx="14" fill="#e9ecee" stroke="#c4d0d5" stroke-width="1.5"/><text x="106" y="168" font-size="16" fill="#29444a" font-weight="600" text-anchor="middle">Prompt token</text><text x="106" y="192" font-size="14" fill="#71848b" font-weight="600" text-anchor="middle">mask = 0</text><rect x="194" y="138" width="158" height="77" rx="14" fill="#e2f1ea" stroke="#add2c0" stroke-width="1.5"/><text x="273" y="168" font-size="16" fill="#226e63" font-weight="600" text-anchor="middle">Response ①</text><text x="273" y="192" font-size="14" fill="#226e63" font-weight="600" text-anchor="middle">mask = 1</text><rect x="364" y="138" width="158" height="77" rx="14" fill="#e2f1ea" stroke="#add2c0" stroke-width="1.5"/><text x="443" y="168" font-size="16" fill="#226e63" font-weight="600" text-anchor="middle">Response ②</text><text x="443" y="192" font-size="14" fill="#226e63" font-weight="600" text-anchor="middle">mask = 1</text><rect x="534" y="138" width="197" height="77" rx="14" fill="#e9ecee" stroke="#c4d0d5" stroke-width="1.5"/><text x="631" y="168" font-size="16" fill="#29444a" font-weight="600" text-anchor="middle">Padding / EOS* </text><text x="631" y="192" font-size="12" fill="#71848b" font-weight="600" text-anchor="middle">依据模板及标签 mask</text><text x="380" y="251" font-size="17" fill="#2b6660" font-weight="600" text-anchor="middle">只累加被标注为 completion 的 token log p</text><text x="380" y="280" font-size="13" fill="#6b7f84" font-weight="600" text-anchor="middle">* 是否计入 EOS 取决于训练数据与模板配置，必须保持一致</text></svg>
