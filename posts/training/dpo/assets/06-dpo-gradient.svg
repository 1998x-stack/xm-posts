<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" role="img" aria-labelledby="dpo-fig-6-title dpo-fig-6-desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><title id="dpo-fig-6-title">DPO 梯度权重随 margin 改变</title><desc id="dpo-fig-6-desc">DPO 对 chosen 和 rejected 的更新方向相反；困难样本的 sigmoid(-beta delta) 权重更大，已满足偏好的样本权重更小。</desc><rect x="0" y="0" width="760" height="314" rx="12" fill="#fbfcfa" stroke="#fbfcfa" stroke-width="1.5"/><rect x="30" y="30" width="700" height="72" rx="14" fill="#f0f5f1" stroke="#d1e2d6" stroke-width="1.5"/><text x="380" y="57" font-size="17" fill="#29444a" font-weight="600" text-anchor="middle">∇θ L = −β σ(−βΔ) · [ ∇θ log πθ(yw|x) − ∇θ log πθ(yl|x) ]</text><text x="380" y="86" font-size="15" fill="#5d777a" font-weight="600" text-anchor="middle">Δ = log ratio(w) − log ratio(l)</text><rect x="29" y="139" width="333" height="113" rx="14" fill="#fbebdf" stroke="#e9c7ae" stroke-width="1.5"/><text x="195" y="174" font-size="19" fill="#9b6144" font-weight="600" text-anchor="middle">Δ &lt; 0：偏好排序做错</text><text x="195" y="204" font-size="17" fill="#8d654d" font-weight="600" text-anchor="middle">更新权重更大</text><text x="195" y="230" font-size="14" fill="#906d58" font-weight="600" text-anchor="middle">纠错优先（同一 β）</text><rect x="398" y="139" width="333" height="113" rx="14" fill="#e6f2ec" stroke="#bfdbcb" stroke-width="1.5"/><text x="564" y="174" font-size="18" fill="#20766a" font-weight="600" text-anchor="middle">Δ &gt; 0：偏好排序已满足</text><text x="564" y="204" font-size="17" fill="#47786e" font-weight="600" text-anchor="middle">更新权重更小</text><text x="564" y="230" font-size="14" fill="#5c7b74" font-weight="600" text-anchor="middle">并不意味着梯度必为零</text><text x="380" y="289" font-size="14" fill="#526d71" font-weight="600" text-anchor="middle">这是对策略 log-prob 的方向分析，不等于保证两个绝对概率同步增减</text></svg>
