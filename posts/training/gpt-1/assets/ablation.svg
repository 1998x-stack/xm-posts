<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 333" role="img" aria-labelledby="g1-ablation-title g1-ablation-desc"><title id="g1-ablation-title">GPT-1 预训练与辅助损失消融</title><desc id="g1-ablation-desc">论文 Table 5 平均分：完整模型74.7、无预训练59.9、无辅助语言模型75.0、LSTM69.1。</desc><rect width="840" height="333" rx="14" fill="#fbfdfa"/><g font-family="system-ui,'PingFang SC',sans-serif"><text x="20" y="34" font-size="18" fill="#316a66" font-weight="750">Table 5 · 八个任务的不加权平均分</text><text x="22" y="85" fill="#3f595f" font-size="18">完整模型 + 辅助 LM</text><rect x="245" y="63" width="500" height="30" rx="7" fill="#e8efe9"/><rect x="245" y="63" width="373.5" height="30" rx="7" fill="#28837c"/><text x="766" y="84" fill="#28434b" font-size="18" font-weight="750">74.7</text><text x="22" y="140" fill="#3f595f" font-size="18">无预训练</text><rect x="245" y="118" width="500" height="30" rx="7" fill="#e8efe9"/><rect x="245" y="118" width="299.5" height="30" rx="7" fill="#c8845e"/><text x="766" y="139" fill="#28434b" font-size="18" font-weight="750">59.9</text><text x="22" y="195" fill="#3f595f" font-size="18">无辅助 LM</text><rect x="245" y="173" width="500" height="30" rx="7" fill="#e8efe9"/><rect x="245" y="173" width="375" height="30" rx="7" fill="#4b80a6"/><text x="766" y="194" fill="#28434b" font-size="18" font-weight="750">75.0</text><text x="22" y="250" fill="#3f595f" font-size="18">LSTM 对照</text><rect x="245" y="228" width="500" height="30" rx="7" fill="#e8efe9"/><rect x="245" y="228" width="345.5" height="30" rx="7" fill="#9680b4"/><text x="766" y="249" fill="#28434b" font-size="18" font-weight="750">69.1</text><text x="20" y="312" fill="#637879" font-size="14">此图不是官方 GLUE overall 分；无需假设辅助 LM 在每项任务都更好。</text></g></svg>
