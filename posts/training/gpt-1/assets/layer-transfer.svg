<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="g1-transfer-title g1-transfer-desc"><title id="g1-transfer-title">深层表示迁移</title><desc id="g1-transfer-desc">展示从嵌入到完整十二层的迁移范围扩大，不杜撰原论文没有表格化的逐层数值。</desc><rect width="840" height="270" rx="14" fill="#fbfdfa"/><g font-family="system-ui,'PingFang SC',sans-serif"><text x="20" y="38" font-size="18" fill="#316d67" font-weight="750">从只迁移 Embedding，到迁移所有 12 层 Transformer</text><rect x="24" y="99" width="132" height="64" rx="10" fill="#e6edfc" stroke="#aacbc3"/><text x="90" y="137" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Embed</text><rect x="163" y="99" width="102" height="64" rx="10" fill="#dceee7" stroke="#aacbc3"/><text x="214" y="137" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">L1–2</text><rect x="272" y="99" width="102" height="64" rx="10" fill="#dceee7" stroke="#aacbc3"/><text x="323" y="137" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">L3–4</text><rect x="381" y="99" width="102" height="64" rx="10" fill="#dceee7" stroke="#aacbc3"/><text x="432" y="137" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">L5–6</text><rect x="490" y="99" width="102" height="64" rx="10" fill="#dceee7" stroke="#aacbc3"/><text x="541" y="137" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">L7–8</text><rect x="599" y="99" width="102" height="64" rx="10" fill="#dceee7" stroke="#aacbc3"/><text x="650" y="137" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">L9–10</text><rect x="708" y="99" width="102" height="64" rx="10" fill="#dceee7" stroke="#aacbc3"/><text x="759" y="137" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">L11–12</text><text x="24" y="211" font-size="17" fill="#567576">Figure 2 (left)：迁移更多层，MultiNLI / RACE 效果整体改善。</text><text x="24" y="241" font-size="14" fill="#728485">教学示意，不是图二中数值曲线的重画。</text></g></svg>
