<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="g1-pipeline-title g1-pipeline-desc"><title id="g1-pipeline-title">从海量无标签书籍到有监督任务</title><desc id="g1-pipeline-desc">预训练模型通过预测下一个 token 学得参数，然后迁移到不同 NLP 任务。</desc><rect width="840" height="270" rx="14" fill="#fbfdfa"/><g font-family="system-ui,'PingFang SC',sans-serif"><text x="20" y="34" font-size="17" font-weight="750" fill="#247a74">STAGE 1 · 生成式预训练</text><rect x="24" y="64" width="207" height="66" rx="10" fill="#e6edfc" stroke="#aacbc3"/><text x="127.5" y="103" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">BooksCorpus</text><path d="M231 97L270 97" stroke="#73938c" stroke-width="3" fill="none"/><rect x="270" y="64" width="275" height="66" rx="10" fill="#dceee7" stroke="#aacbc3"/><text x="407.5" y="103" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Causal Transformer</text><path d="M545 97L586 97" stroke="#73938c" stroke-width="3" fill="none"/><rect x="586" y="64" width="230" height="66" rx="10" fill="#fcebd9" stroke="#aacbc3"/><text x="701" y="103" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Next token</text><text x="22" y="168" font-size="15" fill="#667e7f">同一个主干被迁移；不是为每种任务重新训练一套网络。</text><path d="M410 132V211" stroke="#789d94" stroke-dasharray="6 5" stroke-width="3"/><rect x="247" y="207" width="326" height="53" rx="10" fill="#dceee7" stroke="#aacbc3"/><text x="410" y="239.5" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">迁移预训练权重</text><path d="M573 233L612 233" stroke="#73938c" stroke-width="3" fill="none"/><rect x="612" y="207" width="204" height="53" rx="10" fill="#fcebd9" stroke="#aacbc3"/><text x="714" y="239.5" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">任务分类头</text></g></svg>
