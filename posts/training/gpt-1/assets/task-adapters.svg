<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 315" role="img" aria-labelledby="g1-adapter-title g1-adapter-desc"><title id="g1-adapter-title">任务输入转换</title><desc id="g1-adapter-desc">分类、蕴含和问答等任务被展平成一段 token 序列，问答对候选答案分别打分。</desc><rect width="840" height="315" rx="14" fill="#fbfdfa"/><g font-family="system-ui,'PingFang SC',sans-serif"><text x="22" y="34" font-size="18" font-weight="750" fill="#276e6b">统一 Decoder，只修改输入拼接和轻量任务头</text><text x="24" y="90" font-size="19" fill="#32575a" font-weight="700">分类</text><rect x="147" y="59" width="106" height="52" rx="10" fill="#f8e9d4" stroke="#aacbc3"/><text x="200" y="91" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">〈s〉</text><rect x="259" y="59" width="106" height="52" rx="10" fill="#e2f1e9" stroke="#aacbc3"/><text x="312" y="91" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Text</text><rect x="371" y="59" width="106" height="52" rx="10" fill="#f8e9d4" stroke="#aacbc3"/><text x="424" y="91" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">〈e〉</text><text x="24" y="167" font-size="19" fill="#32575a" font-weight="700">蕴含</text><rect x="147" y="136" width="106" height="52" rx="10" fill="#f8e9d4" stroke="#aacbc3"/><text x="200" y="168" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">〈s〉</text><rect x="259" y="136" width="106" height="52" rx="10" fill="#e2f1e9" stroke="#aacbc3"/><text x="312" y="168" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Premise</text><rect x="371" y="136" width="106" height="52" rx="10" fill="#f8e9d4" stroke="#aacbc3"/><text x="424" y="168" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">$</text><rect x="483" y="136" width="106" height="52" rx="10" fill="#e2f1e9" stroke="#aacbc3"/><text x="536" y="168" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Hypothesis</text><rect x="595" y="136" width="106" height="52" rx="10" fill="#f8e9d4" stroke="#aacbc3"/><text x="648" y="168" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">〈e〉</text><text x="24" y="244" font-size="19" fill="#32575a" font-weight="700">多选题</text><rect x="147" y="213" width="106" height="52" rx="10" fill="#f8e9d4" stroke="#aacbc3"/><text x="200" y="245" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">〈s〉</text><rect x="259" y="213" width="106" height="52" rx="10" fill="#e2f1e9" stroke="#aacbc3"/><text x="312" y="245" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Context</text><rect x="371" y="213" width="106" height="52" rx="10" fill="#e2f1e9" stroke="#aacbc3"/><text x="424" y="245" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Question</text><rect x="483" y="213" width="106" height="52" rx="10" fill="#f8e9d4" stroke="#aacbc3"/><text x="536" y="245" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">$</text><rect x="595" y="213" width="106" height="52" rx="10" fill="#e2f1e9" stroke="#aacbc3"/><text x="648" y="245" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">Answer k</text><rect x="707" y="213" width="106" height="52" rx="10" fill="#f8e9d4" stroke="#aacbc3"/><text x="760" y="245" text-anchor="middle" fill="#29464b" font-size="19" font-weight="650">〈e〉</text><text x="148" y="299" font-size="14" fill="#627978">语义相似：A/B 与 B/A 分别编码，将表示逐元素相加。</text></g></svg>
