ze="18" fill="#243c43" font-weight="600" text-anchor="middle">旧策略 πold</text><text x="477" y="126" font-size="14" fill="#627a7d" font-weight="400" text-anchor="middle">同题多次采样</text><rect x="590" y="72" width="135" height="72" rx="10" fill="#fff1e9" stroke="#cad9d6" stroke-width="1.5"/><text x="657" y="103" font-size="18" fill="#243c43" font-weight="600" text-anchor="middle">G 个回报</text><text x="657" y="126" font-size="16" fill="#c87452" font-weight="700" text-anchor="middle">r₁ … rG</text><line x1="547" y1="110" x2="587" y2="110" stroke="#257a77" stroke-width="3"/><path d="M577 104 L587 110 L577 116" fill="none" stroke="#257a77" stroke-width="3"/><rect x="443" y="190" width="250" height="70" rx="10" fill="#edf4f6" stroke="#cad9d6" stroke-width="1.5"/><text x="568" y="220" font-size="19" fill="#243c43" font-weight="600" text-anchor="middle">Aᵢ = (rᵢ − μ) / σ</text><text x="568" y="245" font-size="14" fill="#627a7d" font-weight="400" text-anchor="middle">无需单独价值网络</text><path d="M657 144 V188" fill="none" stroke="#c87452" stroke-width="3"/><text x="380" y="318" font-size="15" fill="#627a7d" font-weight="500" text-anchor="middle">两侧都可以保留 PPO-style clipped policy update</text></svg>