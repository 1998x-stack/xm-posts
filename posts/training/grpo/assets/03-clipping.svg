<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="正优势和负优势下 PPO 裁剪目标取较小值，限制概率比例的危险变化" style="font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><title>正优势和负优势下 PPO 裁剪目标取较小值，限制概率比例的危险变化</title><rect x="1" y="1" width="758" height="354" rx="13" fill="#f9fbf8" stroke="#e3eae4"/><text x="380" y="39" font-size="23" fill="#243c43" font-weight="600" text-anchor="middle">裁剪不是强行把 ρ 改成一个新概率</text><rect x="30" y="63" width="334" height="228" rx="10" fill="#dceee7" stroke="#cad9d6" stroke-width="1.5"/><text x="197" y="98" font-size="21" fill="#257a77" font-weight="600" text-anchor="middle">正优势 A = +1</text><text x="197" y="131" font-size="19" fill="#243c43" font-weight="600" text-anchor="middle">ρ = 1.50</text><text x="197" y="175" font-size="17" fill="#243c43" font-weight="500" text-anchor="middle">未裁剪：1.50</text><text x="197" y="202" font-size="17" fill="#243c43" font-weight="500" text-anchor="middle">裁剪后：1.20</text><rect x="81" y="221" width="232" height="48" rx="10" fill="#fff" stroke="#cad9d6" stroke-width="1.5"/><text x="197" y="251" font-size="18" fill="#257a77" font-weight="750" text-anchor="middle">取 min → 1.20</text><rect x="395" y="63" width="334" height="228" rx="10" fill="#f8eae5" stroke="#cad9d6" stroke-width="1.5"/><text x="562" y="98" font-size="21" fill="#c87452" font-weight="600" text-anchor="middle">负优势 A = −1</text><text x="562" y="131" font-size="19" fill="#243c43" font-weight="600" text-anchor="middle">ρ = 0.50</text><text x="562" y="175" font-size="17" fill="#243c43" font-weight="500" text-anchor="middle">未裁剪：−0.50</text><text x="562" y="202" font-size="17" fill="#243c43" font-weight="500" text-anchor="middle">裁剪后：−0.80</text><rect x="446" y="221" width="232" height="48" rx="10" fill="#fff" stroke="#cad9d6" stroke-width="1.5"/><text x="562" y="251" font-size="18" fill="#c87452" font-weight="750" text-anchor="middle">取 min → −0.80</text><text x="380" y="329" font-size="17" fill="#627a7d" font-weight="500" text-anchor="middle">示例 ε = 0.2；真正优化 min(ρA, clip(ρ)A)</text></svg>