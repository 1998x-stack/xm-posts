<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="cover-title cover-desc">
<title id="cover-title">教师模型向学生模型传递知识</title>
<desc id="cover-desc">输入样本送入教师和学生模型，教师输出软目标分布，蒸馏损失指导学生学习，学生模型规模更小。</desc>
<rect width="920" height="460" rx="20" fill="#fbfdf9"/>
<text x="42" y="52" font-size="15" font-weight="800" letter-spacing="2" fill="#62817b">TEACHER → TRANSFER SIGNAL → STUDENT</text>
<rect x="40" y="145" width="130" height="118" rx="14" fill="#e9f2ed" stroke="#bdd7cb" stroke-width="2"/>
<text x="105" y="190" text-anchor="middle" font-size="18" font-weight="800" fill="#2c625d">输入 x</text>
<text x="105" y="220" text-anchor="middle" font-size="13" fill="#55746e">样本 / prompt</text>
<path d="M170 204 H230" fill="none" stroke="#6f9990" stroke-width="4" stroke-linecap="round"/>
<path d="M219 194 L232 204 L219 214" fill="none" stroke="#6f9990" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="236" y="100" width="220" height="205" rx="18" fill="#f8eadd" stroke="#d7a77f" stroke-width="2"/>
<rect x="265" y="130" width="162" height="44" rx="9" fill="#fffaf5" stroke="#d8ad89"/>
<rect x="265" y="185" width="162" height="44" rx="9" fill="#fffaf5" stroke="#d8ad89"/>
<rect x="265" y="240" width="162" height="34" rx="8" fill="#fffaf5" stroke="#d8ad89"/>
<text x="346" y="158" text-anchor="middle" font-size="16" font-weight="800" fill="#895b39">Teacher</text>
<text x="346" y="213" text-anchor="middle" font-size="13" fill="#805e46">较大 / 较强模型</text>
<text x="346" y="262" text-anchor="middle" font-size="12" fill="#805e46">冻结参数</text>
<text x="346" y="333" text-anchor="middle" font-size="14" font-weight="700" fill="#996c4a">教师输出分布</text>
<path d="M456 204 H520" fill="none" stroke="#c18759" stroke-width="4" stroke-linecap="round"/>
<path d="M509 194 L522 204 L509 214" fill="none" stroke="#c18759" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="524" y="112" width="165" height="184" rx="16" fill="#eeeaf7" stroke="#c6bce1" stroke-width="2"/>
<text x="606" y="147" text-anchor="middle" font-size="16" font-weight="800" fill="#5b4f88">Soft targets</text>
<g fill="#7869a8"><rect x="553" y="174" width="90" height="16" rx="5"/><rect x="553" y="201" width="58" height="16" rx="5" opacity=".75"/><rect x="553" y="228" width="28" height="16" rx="5" opacity=".5"/></g>
<text x="606" y="270" text-anchor="middle" font-size="12" fill="#685e8c">KL / Feature / Relation</text>
<path d="M689 204 H744" fill="none" stroke="#7d71ac" stroke-width="4" stroke-linecap="round"/>
<path d="M733 194 L746 204 L733 214" fill="none" stroke="#7d71ac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="748" y="137" width="132" height="134" rx="16" fill="#e4f1eb" stroke="#9dc9b8" stroke-width="2"/>
<rect x="772" y="163" width="84" height="24" rx="6" fill="#fff" stroke="#a9cfc0"/>
<rect x="772" y="197" width="84" height="24" rx="6" fill="#fff" stroke="#a9cfc0"/>
<text x="814" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="#2c6b61">Student</text>
<text x="814" y="214" text-anchor="middle" font-size="11" fill="#4d7770">小模型</text>
<text x="814" y="249" text-anchor="middle" font-size="11" fill="#4d7770">更新参数</text>
<path d="M606 296 V370 H814 V271" fill="none" stroke="#7d71ac" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="260" y="374" width="430" height="54" rx="12" fill="#eaf3ee" stroke="#bfd8cd"/>
<text x="475" y="407" text-anchor="middle" font-size="16" font-weight="800" fill="#2b625c">学生学习教师的行为信号，而不是复制教师权重</text>
<text x="105" y="295" text-anchor="middle" font-size="12" fill="#6a8580">同一输入</text>
</svg>