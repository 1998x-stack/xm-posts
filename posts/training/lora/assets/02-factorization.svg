<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="lora-f02-title lora-f02-desc"><title id="lora-f02-title">LoRA 双支路矩阵乘法及张量形状</title><desc id="lora-f02-desc">输入 x 同时经过冻结 W0 和可训练 A 再 B，乘上 alpha/r 后相加。A 是 r 乘 k，B 是 d 乘 r。</desc><rect width="800" height="350" rx="14" fill="#f9fbf8"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="28" y="126" width="92" height="70" rx="10" fill="#e7eeec" stroke="none"/><text x="60" y="158" font-size="24" fill="#244651" font-weight="700">x</text><text x="44" y="178" font-size="12" fill="#25414a" >k × 1</text>
<path d="M120 160 L164 160" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M164 160 L164 69" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M164 160 L164 251" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M164 69 L202 69" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M164 251 L202 251" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/>
<rect x="202" y="29" width="192" height="84" rx="10" fill="#dcefeb" stroke="none"/><text x="226" y="63" font-size="23" fill="#19776f" font-weight="700">W₀ · x</text><text x="216" y="90" font-size="14" fill="#567777" >d × k · k × 1</text>
<rect x="202" y="210" width="132" height="83" rx="10" fill="#f9e1d1" stroke="none"/><text x="247" y="243" font-size="22" fill="#a35c37" font-weight="700">A · x</text><text x="220" y="271" font-size="14" fill="#25414a" >r × k</text>
<path d="M334 252 L372 252" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="372" y="210" width="132" height="83" rx="10" fill="#ebe6fa" stroke="none"/><text x="408" y="243" font-size="18" fill="#6a5ea1" font-weight="700">B · (Ax)</text><text x="389" y="271" font-size="14" fill="#25414a" >d × r</text>
<path d="M504 252 L540 252" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="540" y="210" width="80" height="83" rx="10" fill="#f4efce" stroke="none"/><text x="551" y="244" font-size="21" fill="#8d722f" font-weight="700">α / r</text>
<path d="M394 69 L652 69" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M652 69 L652 148" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M620 252 L652 252" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M652 252 L652 181" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/>
<rect x="623" y="148" width="59" height="38" rx="19" fill="#d8ede8" stroke="none"/><text x="640" y="175" font-size="25" fill="#206b66" font-weight="700">+</text>
<path d="M682 168 L714 168" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="714" y="134" width="63" height="70" rx="10" fill="#deede8" stroke="none"/><text x="735" y="177" font-size="23" fill="#22645e" font-weight="700">h</text>
<text x="35" y="325" font-size="16" fill="#37575c" >h = W₀x + (α/r)BAx    ·    W₀ 冻结；A、B 可训练</text>
</g></svg>
