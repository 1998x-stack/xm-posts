<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="lora-f04-title lora-f04-desc"><title id="lora-f04-title">A随机初始化、B零初始化的训练初态</title><desc id="lora-f04-desc">LoRA起始时A为随机高斯，B为零，所以BA为零；第一步B先收到梯度，A需要后续更新才可能收到非零梯度。</desc><rect width="800" height="310" rx="14" fill="#f9fbf8"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="35" y="48" width="215" height="104" rx="10" fill="#dcefeb" stroke="none"/><text x="57" y="78" font-size="24" fill="#20786f" font-weight="700">W₀</text><text x="57" y="108" font-size="16" fill="#25414a" >冻结的预训练矩阵</text><text x="57" y="131" font-size="13" fill="#25414a" >权重不被优化器更新</text>
<rect x="293" y="48" width="215" height="104" rx="10" fill="#f6dfd3" stroke="none"/><text x="316" y="78" font-size="24" fill="#ad643f" font-weight="700">A</text><text x="316" y="108" font-size="16" fill="#25414a" >随机初始化</text><text x="316" y="131" font-size="13" fill="#25414a" >初始通常非零</text>
<rect x="550" y="48" width="215" height="104" rx="10" fill="#e8e3f5" stroke="none"/><text x="574" y="78" font-size="24" fill="#6b5fa6" font-weight="700">B</text><text x="574" y="108" font-size="16" fill="#25414a" >初始化为零</text><text x="574" y="131" font-size="13" fill="#25414a" >训练可更新</text>
<path d="M400 154 L400 185" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M655 154 L655 185" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M400 185 L655 185" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M527 185 L527 202" stroke="#64818a" stroke-width="3" fill="none" stroke-linecap="round"/>
<rect x="233" y="204" width="565" height="79" rx="10" fill="#edf2ef" stroke="none"/><text x="255" y="236" font-size="18" fill="#315b5c" font-weight="700">初始 ΔW = BA = 0，所以前向输出等于原模型</text><text x="255" y="261" font-size="15" fill="#5f7373" >首步：B 可接收梯度；A 的梯度为零（忽略其他项）</text>
</g></svg>
