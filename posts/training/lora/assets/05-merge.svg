<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 303" role="img" aria-labelledby="lora-f05-title lora-f05-desc"><title id="lora-f05-title">训练双支路与推理时合并的等价变换</title><desc id="lora-f05-desc">左侧未合并需要计算两路输出相加，右侧将低秩增量加到主权重只执行一次线性层。</desc><rect width="800" height="303" rx="14" fill="#f9fbf8"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="45" y="42" font-size="17" fill="#b16a43" font-weight="700">训练 / 未合并执行</text><text x="465" y="42" font-size="17" fill="#16847d" font-weight="700">合并后执行</text>
<rect x="50" y="77" width="305" height="119" rx="10" fill="#fbebdf" stroke="none"/><text x="79" y="124" font-size="25" fill="#965b3d" font-weight="700">W₀x + (α/r)BAx</text><text x="80" y="161" font-size="15" fill="#657679" >两条计算路径，输出相加</text>
<path d="M355 136 L445 136" stroke="#6f8587" stroke-width="4" fill="none" stroke-linecap="round"/><text x="384" y="119" font-size="14" fill="#597878" >合并</text>
<rect x="445" y="77" width="310" height="119" rx="10" fill="#e1f1eb" stroke="none"/><text x="480" y="124" font-size="25" fill="#24796e" font-weight="700">Wₘₑᵣgₑd · x</text><text x="480" y="161" font-size="16" fill="#547a77" >Wₘₑᵣgₑd = W₀ + (α/r)BA</text>
<text x="56" y="242" font-size="16" fill="#445b60" >代数上等价：同一适配器、相同数值精度假设下成立。</text>
<text x="56" y="271" font-size="15" fill="#718183" >量化权重、多 Adapter 动态切换和运行时实现可能改变实际成本。</text>
</g></svg>
