<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="lora-f06-title lora-f06-desc"><title id="lora-f06-title">论文表5固定预算下选择哪些注意力矩阵</title><desc id="lora-f06-desc">在GPT-3 175B与约18M可训练参数预算下，WikiSQL验证准确率Wq 70.4，Wv 73.0，WqWv 73.7，全四项73.7。</desc><rect width="800" height="350" rx="14" fill="#f9fbf8"/><g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="39" font-size="19" fill="#2c4b50" font-weight="700">固定约 18M 参数预算 · WikiSQL 验证准确率</text>
<text x="34" y="78" font-size="13" fill="#6e8081" >权重目标</text><text x="367" y="78" font-size="13" fill="#6e8081" >准确率（%）</text>
<text x="36" y="122" font-size="16" fill="#294c53" >Wq</text><rect x="309" y="101" width="367" height="23" rx="3" fill="#e9eeeb" stroke="none"/><rect x="309" y="101" width="258.36800000000005" height="23" rx="3" fill="#8da3a6" stroke="none"/><text x="695" y="121" font-size="16" fill="#31575c" font-weight="700">70.4</text><text x="36" y="175" font-size="16" fill="#294c53" >Wv</text><rect x="309" y="154" width="367" height="23" rx="3" fill="#e9eeeb" stroke="none"/><rect x="309" y="154" width="267.91" height="23" rx="3" fill="#a98dbe" stroke="none"/><text x="695" y="174" font-size="16" fill="#31575c" font-weight="700">73.0</text><text x="36" y="228" font-size="16" fill="#294c53" >Wq + Wv</text><rect x="309" y="207" width="367" height="23" rx="3" fill="#e9eeeb" stroke="none"/><rect x="309" y="207" width="270.47900000000004" height="23" rx="3" fill="#29958b" stroke="none"/><text x="695" y="227" font-size="16" fill="#31575c" font-weight="700">73.7</text><text x="36" y="281" font-size="16" fill="#294c53" >Wq + Wk + Wv + Wo</text><rect x="309" y="260" width="367" height="23" rx="3" fill="#e9eeeb" stroke="none"/><rect x="309" y="260" width="270.47900000000004" height="23" rx="3" fill="#cc8d64" stroke="none"/><text x="695" y="280" font-size="16" fill="#31575c" font-weight="700">73.7</text>
<text x="36" y="330" font-size="13" fill="#6e8383" >数据：Hu et al. (2022), Table 5；条形从 0% 起，不代表显著性。</text>
