<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" role="img" aria-labelledby="f1t f1d"><title id="f1t">全参数微调与 LoRA QLoRA 的内存层级</title><desc id="f1d">QLoRA 用 NF4 存储冻结主干，低秩适配器保持可训练，非按比例示意</desc><rect width="760" height="282" rx="12" fill="#fbfcfa"/><g font-family="system-ui,Arial,'PingFang SC',sans-serif"><text x="28" y="36" font-size="21" fill="#284c50">为什么 LoRA 仍然可能放不下 65B 主干？</text><rect x="27" y="60" width="705" height="48" rx="9" fill="#f7e5da"/><text x="42" y="90" font-size="18" fill="#92563f">Full FT · BF16 权重 + 全量梯度 + 优化器</text><rect x="27" y="123" width="705" height="48" rx="9" fill="#edf2ed"/><text x="42" y="153" font-size="18" fill="#284c50">LoRA · 冻结 BF16 权重</text><rect x="503" y="132" width="213" height="29" rx="9" fill="#b0dcd0"/><text x="518" y="151" font-size="14" fill="#284c50">训练 Adapter</text><rect x="27" y="185" width="705" height="48" rx="9" fill="#e2f4eb"/><text x="42" y="214" font-size="18" fill="#15776f">QLoRA · 冻结 NF4 权重</text><rect x="503" y="194" width="213" height="29" rx="9" fill="#93c9b7"/><text x="518" y="213" font-size="14" fill="#284c50">训练 Adapter</text><text x="28" y="260" font-size="13" fill="#284c50">主干存储精度与可训练参数量是两个独立维度；实际显存还包括激活和运行时缓冲。</text></g></svg>
