<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" role="img" aria-labelledby="f2t f2d"><title id="f2t">QLoRA 存储与计算路径</title><desc id="f2d">NF4 权重反量化成 BF16 后参与矩阵乘法，梯度更新 LoRA 分支但不更新冻结主干</desc><rect width="760" height="282" rx="12" fill="#fbfcfa"/><g font-family="system-ui,Arial,'PingFang SC',sans-serif"><text x="28" y="35" font-size="19" fill="#284c50">4-bit = 存储精度；BF16 = 计算精度（原论文典型配置）</text><rect x="28" y="62" width="195" height="64" rx="9" fill="#dfe9e3"/><text x="43" y="88" font-size="16" fill="#284c50">W · NF4 Storage</text><text x="43" y="110" font-size="13" fill="#284c50">冻结主干</text><text x="233" y="101" font-size="28" fill="#284c50">→</text><rect x="273" y="62" width="193" height="64" rx="9" fill="#e2eff4"/><text x="287" y="88" font-size="16" fill="#284c50">Double dequant</text><text x="287" y="110" font-size="13" fill="#284c50">BF16 权重计算</text><text x="475" y="101" font-size="28" fill="#284c50">→</text><rect x="519" y="62" width="207" height="64" rx="9" fill="#dff2e8"/><text x="538" y="95" font-size="21" fill="#284c50">X × D(W)</text><rect x="28" y="169" width="300" height="65" rx="9" fill="#fae9df"/><text x="44" y="198" font-size="17" fill="#975839">LoRA: trainable L₁, L₂</text><text x="44" y="218" font-size="13" fill="#284c50">梯度只更新小矩阵</text><text x="337" y="205" font-size="28" fill="#284c50">→</text><rect x="379" y="169" width="347" height="65" rx="9" fill="#fcecd9"/><text x="399" y="199" font-size="19" fill="#96593a">s × X × L₁ × L₂</text><text x="28" y="263" font-size="13" fill="#284c50">两路输出相加；冻结权重仍用于计算输入/适配器相关梯度。</text></g></svg>
