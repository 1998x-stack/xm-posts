<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" role="img" aria-labelledby="f4t f4d"><title id="f4t">Double Quantization 的两层尺度</title><desc id="f4d">第一层 64 个权重一个 FP32 scale；第二层 256 个第一层 scale 共享第二层 FP32 scale</desc><rect width="760" height="282" rx="12" fill="#fbfcfa"/><g font-family="system-ui,Arial,'PingFang SC',sans-serif"><text x="27" y="37" font-size="20" fill="#284c50">权重仅 4 bit，量化常数为何仍要再压缩？</text><rect x="27" y="67" width="335" height="125" rx="9" fill="#e3f1ec"/><text x="42" y="94" font-size="17" fill="#284c50">第一层：64 weights / scale</text><rect x="42" y="111" width="28" height="25" rx="9" fill="#62ab96"/><rect x="78" y="111" width="28" height="25" rx="9" fill="#9bd1bf"/><rect x="114" y="111" width="28" height="25" rx="9" fill="#62ab96"/><rect x="150" y="111" width="28" height="25" rx="9" fill="#9bd1bf"/><rect x="186" y="111" width="28" height="25" rx="9" fill="#62ab96"/><rect x="222" y="111" width="28" height="25" rx="9" fill="#9bd1bf"/><rect x="258" y="111" width="28" height="25" rx="9" fill="#62ab96"/><rect x="294" y="111" width="28" height="25" rx="9" fill="#9bd1bf"/><text x="42" y="168" font-size="13" fill="#284c50">FP32 scale = 32/64 bit/weight</text><text x="365" y="132" font-size="29" fill="#284c50">→</text><rect x="406" y="67" width="327" height="125" rx="9" fill="#f8e8db"/><text x="422" y="94" font-size="17" fill="#956042">第二层：量化 scale</text><rect x="421" y="111" width="28" height="25" rx="9" fill="#cb8966"/><rect x="457" y="111" width="28" height="25" rx="9" fill="#e4b492"/><rect x="493" y="111" width="28" height="25" rx="9" fill="#cb8966"/><rect x="529" y="111" width="28" height="25" rx="9" fill="#e4b492"/><rect x="565" y="111" width="28" height="25" rx="9" fill="#cb8966"/><rect x="601" y="111" width="28" height="25" rx="9" fill="#e4b492"/><rect x="637" y="111" width="28" height="25" rx="9" fill="#cb8966"/><rect x="673" y="111" width="28" height="25" rx="9" fill="#e4b492"/><text x="423" y="168" font-size="13" fill="#815d49">FP8 scales + FP32 hyper-scale</text><text x="27" y="233" font-size="21" fill="#136f65">0.500 → 0.127 bit / weight</text><text x="27" y="262" font-size="13" fill="#284c50">节省约 0.373 bit/参数，不是将模型本身压到 2-bit。</text></g></svg>
