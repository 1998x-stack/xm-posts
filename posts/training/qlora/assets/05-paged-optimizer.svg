<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" role="img" aria-labelledby="f5t f5d"><title id="f5t">Paged Optimizer 的峰值内存调度</title><desc id="f5d">训练峰值时优化器状态可被 CUDA Unified Memory 迁到 CPU RAM，随后迁回</desc><rect width="760" height="282" rx="12" fill="#fbfcfa"/><g font-family="system-ui,Arial,'PingFang SC',sans-serif"><text x="27" y="38" font-size="20" fill="#284c50">显存峰值不是常驻权重那么简单</text><rect x="27" y="70" width="329" height="143" rx="9" fill="#e1f1ea"/><text x="43" y="97" font-size="18" fill="#284c50">GPU VRAM</text><rect x="43" y="114" width="297" height="34" rx="9" fill="#70b6a4"/><text x="54" y="137" font-size="13" fill="#1b4845">NF4 backbone + activations</text><rect x="43" y="154" width="199" height="34" rx="9" fill="#a5cebf"/><text x="55" y="176" font-size="13" fill="#284c50">Adapter + optimizer</text><text x="358" y="159" font-size="32" fill="#b57450">⇄</text><rect x="418" y="70" width="315" height="143" rx="9" fill="#f9ebdd"/><text x="433" y="97" font-size="18" fill="#946145">CPU RAM</text><rect x="436" y="122" width="273" height="48" rx="9" fill="#e7bea1"/><text x="448" y="151" font-size="12" fill="#754d3b">temporarily paged optimizer state</text><text x="27" y="258" font-size="13" fill="#284c50">Paged Optimizers 不是 vLLM PagedAttention；迁移带宽仍可能有成本。</text></g></svg>
