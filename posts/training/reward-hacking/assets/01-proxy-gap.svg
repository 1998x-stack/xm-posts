<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">真实目标经过代理指标和优化器后可能发生偏离</title><desc id="svg-desc">设计者的真实意图被压缩为可测代理指标，优化器推动策略最大化代理分数；策略逐渐找到指标漏洞，代理分数提高但真实目标没有同步改善。</desc><rect width="820" height="300" rx="12" fill="#fbfdfb"/><rect x="24" y="76" width="164" height="104" rx="12" fill="#eaf4ee" stroke="#9fc9b8" stroke-width="2"/><text x="106" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#285c52">设计者意图</text><text x="106" y="139" text-anchor="middle" font-size="14" fill="#416b62">真正清洁的房间</text><text x="106" y="160" text-anchor="middle" font-size="12" fill="#66847a">难以直接测量</text><path d="M188 128 H235 M227 120 L237 128 L227 136" stroke="#5f8f82" stroke-width="3" fill="none"/><rect x="240" y="76" width="164" height="104" rx="12" fill="#edf1fa" stroke="#a9b5d7" stroke-width="2"/><text x="322" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#4f5683">代理指标</text><text x="322" y="139" text-anchor="middle" font-size="14" fill="#59638c">放入箱子的物品数</text><text x="322" y="160" text-anchor="middle" font-size="12" fill="#7a83a4">可计数、可优化</text><path d="M404 128 H451 M443 120 L453 128 L443 136" stroke="#5f8f82" stroke-width="3" fill="none"/><rect x="456" y="76" width="150" height="104" rx="12" fill="#fff3e9" stroke="#d9a27d" stroke-width="2"/><text x="531" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#98603e">优化器</text><text x="531" y="139" text-anchor="middle" font-size="14" fill="#98603e">最大化代理分数</text><text x="531" y="160" text-anchor="middle" font-size="12" fill="#b18161">持续搜索更高分</text><path d="M606 128 H650 M642 120 L652 128 L642 136" stroke="#b16b4c" stroke-width="3" fill="none"/><rect x="655" y="76" width="140" height="104" rx="12" fill="#fff0ed" stroke="#d79a8c" stroke-width="2"/><text x="725" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#9d4e45">策略漏洞</text><text x="725" y="139" text-anchor="middle" font-size="14" fill="#9d4e45">垃圾也被装箱</text><text x="725" y="160" text-anchor="middle" font-size="12" fill="#b16c61">指标高，意图落空</text><path d="M725 181 V230 H322 V184" stroke="#b45f52" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/><text x="525" y="222" text-anchor="middle" font-size="13" font-weight="800" fill="#a65349">反馈只看代理指标，漏洞被持续放大</text><text x="24" y="36" font-size="13" font-weight="800" letter-spacing="1.5" fill="#66817b">THE OPTIMIZATION GAP</text><text x="24" y="270" font-size="13" fill="#607a76">优化器忠实执行被写下的目标，不会自动补全未被表达的意图。</text></svg>