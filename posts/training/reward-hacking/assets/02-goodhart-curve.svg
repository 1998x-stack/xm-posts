<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">代理回报与真实回报随优化压力的分离</title><desc id="svg-desc">上方代理回报单调上升，下方真实回报单调下降，表示优化压力可能放大代理偏差。</desc><rect width="760" height="470" rx="10" fill="#fcfefa"/><text x="26" y="29" font-size="14" font-weight="800" fill="#4b716b">PROXY RETURN</text><path d="M75 48 V213 H718 M75 130 H718" fill="none" stroke="#9bbdb0" stroke-width="1.8"/><path d="M75 213 Q190 194 248 175 T421 124 T595 77 T718 48" fill="none" stroke="#287f75" stroke-width="4" stroke-linecap="round"/><text x="28" y="54" font-size="11" fill="#68847b">5.25</text><text x="44" y="214" font-size="11" fill="#68847b">0</text><text x="26" y="275" font-size="14" font-weight="800" fill="#a15f45">TRUE RETURN</text><path d="M75 294 V438 H718 M75 294 H718" fill="none" stroke="#c8a28d" stroke-width="1.8"/><path d="M75 294 Q190 297 248 310 T421 353 T595 403 T718 438" fill="none" stroke="#c27650" stroke-width="4" stroke-linecap="round"/><text x="35" y="300" font-size="11" fill="#9b715c">0</text><text x="24" y="438" font-size="11" fill="#9b715c">−2.25</text><text x="78" y="458" font-size="11" fill="#68847b">优化压力 α 增大 →</text></svg>