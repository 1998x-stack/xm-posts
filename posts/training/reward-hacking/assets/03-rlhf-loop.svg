<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">RLHF 中人类偏好、奖励模型与策略优化的反馈闭环</title><desc id="svg-desc">人类比较候选回答，偏好数据训练奖励模型；策略模型生成回答并最大化奖励模型分数，更新后的策略又产生新的回答。独立的人类评估应位于优化闭环之外。</desc><rect width="820" height="310" rx="12" fill="#fbfdfb"/><rect x="22" y="78" width="142" height="92" rx="10" fill="#edf5ef" stroke="#a8c9b8" stroke-width="2"/><text x="93" y="109" text-anchor="middle" font-size="16" font-weight="800" fill="#315e54">人类比较</text><text x="93" y="136" text-anchor="middle" font-size="13" fill="#58786d">A 比 B 更好？</text><text x="93" y="155" text-anchor="middle" font-size="11" fill="#7b948a">偏好数据 D</text><path d="M164 124 H212 M204 116 L214 124 L204 132" stroke="#5e9184" stroke-width="2.8" fill="none"/><rect x="217" y="78" width="148" height="92" rx="10" fill="#edf1fa" stroke="#aeb8d7" stroke-width="2"/><text x="291" y="109" text-anchor="middle" font-size="16" font-weight="800" fill="#555d88">奖励模型 RM</text><text x="291" y="136" text-anchor="middle" font-size="13" fill="#626c94">预测偏好分数</text><text x="291" y="155" text-anchor="middle" font-size="11" fill="#8189aa">rφ(x, y)</text><path d="M365 124 H414 M406 116 L416 124 L406 132" stroke="#5e9184" stroke-width="2.8" fill="none"/><rect x="419" y="78" width="156" height="92" rx="10" fill="#fff2e8" stroke="#d8a27d" stroke-width="2"/><text x="497" y="109" text-anchor="middle" font-size="16" font-weight="800" fill="#95603f">策略优化</text><text x="497" y="136" text-anchor="middle" font-size="13" fill="#9c6d4c">PPO / Best-of-N</text><text x="497" y="155" text-anchor="middle" font-size="11" fill="#b18465">最大化 RM 分数</text><path d="M575 124 H624 M616 116 L626 124 L616 132" stroke="#5e9184" stroke-width="2.8" fill="none"/><rect x="629" y="78" width="168" height="92" rx="10" fill="#f1eef9" stroke="#b7add5" stroke-width="2"/><text x="713" y="109" text-anchor="middle" font-size="16" font-weight="800" fill="#665b91">新策略输出</text><text x="713" y="136" text-anchor="middle" font-size="13" fill="#74699e">回答分布改变</text><text x="713" y="155" text-anchor="middle" font-size="11" fill="#9389b4">可能偏离 RM 训练分布</text><path d="M713 171 V218 H291 V173" stroke="#806fae" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/><text x="505" y="210" text-anchor="middle" font-size="12" font-weight="800" fill="#70629d">新的回答继续由 RM 打分</text><rect x="220" y="244" width="360" height="42" rx="9" fill="#edf7f1" stroke="#a6cbbb"/><text x="400" y="270" text-anchor="middle" font-size="14" font-weight="800" fill="#2c6b60">独立的人类 / 真实任务评估：闭环之外的校准点</text><path d="M713 171 V264 H583" stroke="#2f8878" stroke-width="2" stroke-dasharray="4 5" fill="none"/></svg>