<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">奖励黑客从输出特征到运行环境的四层失效面</title><desc id="svg-desc">四层分别是输出特征层、内部表示层、评价器与验证器层、环境与奖励通道层。越往下，风险越接近系统权限和外部状态。</desc><rect width="820" height="360" rx="12" fill="#fbfdfb"/><rect x="32" y="28" width="756" height="62" rx="9" fill="#edf6ef" stroke="#a9cbb8"/><text x="56" y="53" font-size="16" font-weight="800" fill="#35685c">01 · 特征层 Feature-level</text><text x="56" y="75" font-size="13" fill="#5d7b70">冗长、奉承、过度自信、格式套路</text><rect x="32" y="111" width="756" height="62" rx="9" fill="#eef1fa" stroke="#b4bdd8"/><text x="56" y="136" font-size="16" font-weight="800" fill="#565f8c">02 · 表示层 Representation-level</text><text x="56" y="158" font-size="13" fill="#68729a">利用奖励模型潜在特征，或产生不忠实解释</text><rect x="32" y="194" width="756" height="62" rx="9" fill="#fff4e9" stroke="#ddb38d"/><text x="56" y="219" font-size="16" font-weight="800" fill="#95613e">03 · 评价器层 Evaluator-level</text><text x="56" y="241" font-size="13" fill="#a17757">迎合 Judge、过拟合 benchmark、利用 verifier 缺口</text><rect x="32" y="277" width="756" height="62" rx="9" fill="#fff0ed" stroke="#d99d92"/><text x="56" y="302" font-size="16" font-weight="800" fill="#9d4f47">04 · 环境层 Environment-level</text><text x="56" y="324" font-size="13" fill="#a96d65">修改测试、隐藏日志、篡改奖励脚本或奖励通道</text></svg>