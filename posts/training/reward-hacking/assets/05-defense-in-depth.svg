<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Reward Hacking 的五层纵深防御</title><desc id="svg-desc">防御包括目标约束、数据和奖励模型稳健性、受控优化、独立评价以及运行时安全。</desc><rect width="820" height="350" rx="12" fill="#fbfdfb"/><rect x="34" y="25" width="752" height="48" rx="8" fill="#eaf4ee" stroke="#a8c9b8"/><text x="410" y="55" text-anchor="middle" font-size="15" font-weight="800" fill="#315f54">1 · 目标与约束：明确底线和任务边界</text><rect x="58" y="86" width="704" height="48" rx="8" fill="#eef1fa" stroke="#b1bad6"/><text x="410" y="116" text-anchor="middle" font-size="15" font-weight="800" fill="#555f89">2 · 数据与奖励：覆盖情境并建模不确定性</text><rect x="82" y="147" width="656" height="48" rx="8" fill="#fff3e8" stroke="#dcb18c"/><text x="410" y="177" text-anchor="middle" font-size="15" font-weight="800" fill="#95613f">3 · 优化过程：KL / 早停 / 集成 / 分布漂移监控</text><rect x="106" y="208" width="608" height="48" rx="8" fill="#edf5f1" stroke="#a9cdbd"/><text x="410" y="238" text-anchor="middle" font-size="15" font-weight="800" fill="#346c61">4 · 独立评价：隐藏测试、人类盲评、对抗审查</text><rect x="130" y="269" width="560" height="48" rx="8" fill="#fff0ed" stroke="#d79c91"/><text x="410" y="299" text-anchor="middle" font-size="15" font-weight="800" fill="#9c5148">5 · 运行时安全：最小权限、沙箱、不可篡改日志</text><text x="410" y="339" text-anchor="middle" font-size="11" fill="#718985">防御是多层约束组合，不是单个评分器或超参数。</text></svg>