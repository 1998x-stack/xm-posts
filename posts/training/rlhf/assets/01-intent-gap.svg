<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="语言模型的似然目标与人的偏好并不总相同"><title>语言模型的似然目标与人的偏好并不总相同</title><desc>同一道指令下，两个可用的回答都可能很流畅，但更符合用户意图的回答应被偏好。</desc><rect x="0" y="0" width="960" height="340" rx="20" fill="#f8fbfa"/><text x="28" y="42" fill="#617778" font-size="17" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">同一条用户指令</text><rect x="28" y="65" width="250" height="98" rx="14" fill="#e9f4f0" stroke="#b1d5ca" stroke-width="2"/><text x="48" y="106" fill="#235a58" font-size="20" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">“请用一句话解释 KL。”</text><text x="48" y="136" fill="#60797b" font-size="16" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">x：输入提示</text><path d="M282 112 L340 112" fill="none" stroke="#6b9899" stroke-width="3" stroke-linecap="round"/><text x="302" y="96" fill="#718388" font-size="15" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">候选</text><rect x="344" y="40" width="306" height="120" rx="14" fill="#ffffff" stroke="#a9cec4" stroke-width="2"/><text x="365" y="72" fill="#1d7973" font-size="20" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">回答 A · 清晰</text><text x="365" y="106" fill="#365357" font-size="18" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">“衡量两个概率分布</text><text x="365" y="135" fill="#365357" font-size="18" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">有多不一样。”</text><rect x="344" y="186" width="306" height="116" rx="14" fill="#ffffff" stroke="#e3c8b5" stroke-width="2"/><text x="365" y="220" fill="#a16946" font-size="20" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">回答 B · 冗长</text><text 