<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="经典 RLHF 三阶段"><title>经典 RLHF 三阶段</title><desc>示范教会策略基本行为，比较数据训练奖励模型，策略在奖励与参考约束下迭代优化。</desc><rect x="0" y="0" width="960" height="340" rx="20" fill="#f8fbfa"/><rect x="18" y="54" width="279" height="225" rx="14" fill="#eff8f5" stroke="#bedbd2" stroke-width="2"/><text x="38" y="89" fill="#2c8a80" font-size="21" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">01</text><text x="38" y="125" fill="#285d59" font-size="24" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">示范数据 → SFT</text><text x="38" y="168" fill="#4a6f6d" font-size="21" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">(x, y*)</text><text x="38" y="204" fill="#4a6f6d" font-size="19" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">最小化 -log π(y*|x)</text><text x="38" y="247" fill="#4a6f6d" font-size="17" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">得到初始策略 π_SFT</text><path d="M303 170 L330 170" fill="none" stroke="#6f9d99" stroke-width="4" stroke-linecap="round"/><text x="315" y="154" fill="#6f9d99" font-size="27" font-weight="600" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">→</text><rect x="341" y="54" width="279" height="225" rx="14" fill="#f6f2fc" stroke="#d6c9e4" stroke-width="2"/><text x="361" y="89" fill="#7c62a0" font-size="21" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">02</text><text x="361" y="125" fill="#62507c" font-size="24" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">偏好排序 → RM</text><text x="361" y="168" fill="#6c6480" font-size="20" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">(x, y_w, y_l)</text><text x="361" y="204" fill="#6c6480" font-size="18" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">拟合 P(y_w ≻ y_l)</text><text x="361" y="247" fill="#6c6480" font-size="17" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">得到评分 r_φ(x,y)</text><path d="M625 170 L652 170" fill="none" stroke="#6f9d99" stroke-width="4" stroke-linecap="round"/><text x="638" y="154" fill="#6f9d99" font-size="27" font-weight="600" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">→</text><rect x="663" y="54" width="279" height="225" rx="14" fill="#fdf2eb" stroke="#e7cbb5" stroke-width="2"/><text x="683" y="89" fill="#b86f44" font-size="21" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">03</text><text x="683" y="125" fill="#935630" font-size="24" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">采样 → PPO</text><text x="683" y="168" fill="#835f4a" font-size="17" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">reward = r - β log π/π_ref</text><text x="683" y="204" fill="#835f4a" font-size="18" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">更新 π_θ 与 value head</text><text x="683" y="247" fill="#835f4a" font-size="17" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">得到偏好优化策略</text><text x="32" y="316" fill="#536f6c" font-size="17" font-weight="600" text-anchor="start" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">π_ref 通常冻结在 SFT 检查点；RM 作为评估器，不直接生成最终回复。</text></svg>
