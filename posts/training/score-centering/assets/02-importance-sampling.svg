<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sc02t sc02d"><title id="sc02t">Importance sampling 用概率比重加权采样样本</title><desc id="sc02d">sampler 对某 token 的概率很小而 learner 概率较大时，importance ratio 会很大。</desc>
<rect width="900" height="300" rx="18" fill="#f5f8f6"/><g font-family="system-ui,sans-serif" fill="#334f54"><text x="38" y="44" font-size="18" font-weight="700">同一个 token 的概率比：r = p / q</text><text x="70" y="100" font-size="16">常见 token</text><text x="70" y="192" font-size="16">稀有 token</text></g>
<g><rect x="220" y="75" width="130" height="28" rx="5" fill="#277b76"/><rect x="220" y="111" width="110" height="28" rx="5" fill="#c1764e"/><rect x="220" y="166" width="130" height="28" rx="5" fill="#277b76"/><rect x="220" y="202" width="18" height="28" rx="5" fill="#c1764e"/></g>
<g font-family="system-ui,sans-serif" font-size="14" fill="#fff"><text x="285" y="95" text-anchor="middle">p=.30</text><text x="275" y="131" text-anchor="middle">q=.27</text><text x="285" y="185" text-anchor="middle">p=.20</text><text x="229" y="221">q=.01</text></g>
<g font-family="system-ui,sans-serif" font-size="22" font-weight="700"><text x="715" y="110" fill="#277b76">1.11</text><text x="715" y="202" fill="#c1764e">20.0</text></g><text x="680" y="76" font-size="14" fill="#6d8180">ratio</text><path d="M690 218 H820" stroke="#c1764e" stroke-width="3" stroke-dasharray="5 5"/><text x="755" y="248" font-size="13" fill="#8a5b42" text-anchor="middle">clip 上界例如 2</text><text x="38" y="274" font-size="14" fill="#657a79">截断控制极端权重，但改变原始 IS 权重，因此引入 bias。</text></svg>
