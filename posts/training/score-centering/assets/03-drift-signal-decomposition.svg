<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sc03t sc03d"><title id="sc03t">Off-policy policy gradient 分解为 drift 与 signal</title><desc id="sc03d">期望优势乘以期望 score 是 drift；优势与 score 的协方差是学习信号。</desc>
<rect width="900" height="300" rx="18" fill="#f5f8f6"/><g font-family="system-ui,sans-serif" fill="#2f4e52">
<rect x="30" y="90" width="215" height="112" rx="13" fill="#e4edf0" stroke="#8aa6aa" stroke-width="2"/><text x="137" y="130" text-anchor="middle" font-size="18" font-weight="700">E_q[A s]</text><text x="137" y="160" text-anchor="middle" font-size="14">原始 off-policy</text><text x="137" y="181" text-anchor="middle" font-size="14">梯度期望</text><text x="276" y="155" font-size="28" font-weight="700">=</text>
<rect x="328" y="90" width="235" height="112" rx="13" fill="#fae9df" stroke="#c77a58" stroke-width="2"/><text x="445" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#9b553a">E_q[A] · E_q[s]</text><text x="445" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#9b553a">DRIFT</text><text x="445" y="183" text-anchor="middle" font-size="13">不区分 token-specific reward</text><text x="589" y="155" font-size="28" font-weight="700">+</text>
<rect x="641" y="90" width="229" height="112" rx="13" fill="#dff1eb" stroke="#398c7f" stroke-width="2"/><text x="755" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#236b61">Cov_q(A,s)</text><text x="755" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#236b61">SIGNAL</text><text x="755" y="183" text-anchor="middle" font-size="13">奖励与 token score 的关联</text></g><text x="450" y="264" text-anchor="middle" font-size="14" fill="#657a79">固定 prefix 下，score centering 精确消除 drift 分量</text></svg>
