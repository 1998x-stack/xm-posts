<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sc04t sc04d"><title id="sc04t">Group mean 为零不代表 prefix 条件均值为零</title><desc id="sc04d">四条 rollout 的组内 advantage 相加为零，但不同 prefix 的条件均值仍可能分别为正和负。</desc>
<rect width="900" height="300" rx="18" fill="#f5f8f6"/><g font-family="system-ui,sans-serif" fill="#344f54"><text x="38" y="40" font-size="18" font-weight="700">四条 rollout：组内优势中心化</text><g font-size="15" text-anchor="middle"><rect x="45" y="58" width="160" height="48" rx="8" fill="#e0f0ea"/><text x="125" y="88">A₁ = +1</text><rect x="225" y="58" width="160" height="48" rx="8" fill="#e0f0ea"/><text x="305" y="88">A₂ = +1</text><rect x="405" y="58" width="160" height="48" rx="8" fill="#f8e9e0"/><text x="485" y="88">A₃ = −1</text><rect x="585" y="58" width="160" height="48" rx="8" fill="#f8e9e0"/><text x="665" y="88">A₄ = −1</text></g><text x="785" y="88" font-size="17" font-weight="700">ΣA=0</text>
<rect x="85" y="150" width="300" height="88" rx="12" fill="#dff1eb" stroke="#398c7f" stroke-width="2"/><rect x="515" y="150" width="300" height="88" rx="12" fill="#fae9df" stroke="#c77a58" stroke-width="2"/><text x="235" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#236b61">prefix h_good</text><text x="235" y="213" text-anchor="middle" font-size="15" fill="#236b61">E[A | h_good] &gt; 0</text><text x="665" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#9b553a">prefix h_bad</text><text x="665" y="213" text-anchor="middle" font-size="15" fill="#9b553a">E[A | h_bad] &lt; 0</text><text x="450" y="278" text-anchor="middle" font-size="14" fill="#657a79">Σ group A = 0 ≠ 每个 prefix 的条件期望为 0</text></g></svg>
