<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sc05t sc05d"><title id="sc05t">Score centering 从每个 token score 中减去 sampler 期望 score</title><desc id="sc05d">每个动作的 trainer score 是参数空间向量，减去同一 prefix 下 sampler 对所有 token score 的期望向量。</desc>
<rect width="900" height="300" rx="18" fill="#f5f8f6"/><g font-family="system-ui,sans-serif" fill="#344f54"><text x="42" y="40" font-size="18" font-weight="700">在固定 prefix h 下，对参数梯度向量做中心化</text><text x="65" y="78" font-size="15" font-weight="700">原始 score</text><g stroke-width="5" stroke-linecap="round"><path d="M130 225 L250 140" stroke="#277b76"/><path d="M130 225 L280 240" stroke="#c1764e"/><path d="M130 225 L185 95" stroke="#7770ad"/></g><circle cx="130" cy="225" r="6" fill="#344f54"/><path d="M130 225 L205 185" stroke="#6b7476" stroke-width="3" stroke-dasharray="6 5"/><circle cx="205" cy="185" r="6" fill="#6b7476"/><text x="212" y="180" font-size="14">s̄q</text><text x="250" y="128" font-size="14" fill="#277b76">s₁</text><text x="286" y="247" font-size="14" fill="#c1764e">s₂</text><text x="177" y="86" font-size="14" fill="#7770ad">s₃</text><path d="M390 160 H490" stroke="#8aa09c" stroke-width="2"/><path d="M482 152 L492 160 L482 168" fill="none" stroke="#8aa09c" stroke-width="2"/><text x="438" y="140" text-anchor="middle" font-size="14">减去均值</text><text x="560" y="78" font-size="15" font-weight="700">centered score</text><g stroke-width="5" stroke-linecap="round"><path d="M600 200 L680 150" stroke="#277b76"/><path d="M600 200 L680 255" stroke="#c1764e"/><path d="M600 200 L545 105" stroke="#7770ad"/></g><circle cx="600" cy="200" r="6" fill="#344f54"/><text x="688" y="145" font-size="14" fill="#277b76">s₁ − s̄q</text><text x="688" y="260" font-size="14" fill="#c1764e">s₂ − s̄q</text><text x="510" y="98" font-size="14" fill="#7770ad">s₃ − s̄q</text><text x="450" y="286" text-anchor="middle" font-size="14" fill="#657a79">中心化对象是 score 向量，不是 reward 或 log probability</text></g></svg>
