<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sc06t sc06d"><title id="sc06t">Top-k 精确保留 sampler head，用 trainer 分布重建 tail</title><desc id="sc06d">采样器提供 top-k token 的概率质量；未记录尾部按 trainer 概率形状近似并匹配剩余质量。</desc>
<rect width="900" height="300" rx="18" fill="#f5f8f6"/><g font-family="system-ui,sans-serif" fill="#344f54"><text x="40" y="40" font-size="18" font-weight="700">把词表拆成 Head H 与 Tail T</text><rect x="55" y="70" width="360" height="145" rx="12" fill="#e1f0eb" stroke="#3d8b80" stroke-width="2"/><rect x="435" y="70" width="410" height="145" rx="12" fill="#ece9f8" stroke="#8176b1" stroke-width="2"/><text x="80" y="100" font-size="17" font-weight="700" fill="#236b61">Head H：采样器精确记录</text><text x="460" y="100" font-size="17" font-weight="700" fill="#574c83">Tail T：trainer 形状近似</text></g><g fill="#3d8b80"><rect x="85" y="125" width="54" height="62" rx="5"/><rect x="150" y="142" width="54" height="45" rx="5"/><rect x="215" y="155" width="54" height="32" rx="5"/><rect x="280" y="167" width="54" height="20" rx="5"/></g><g font-size="13" fill="#fff" text-anchor="middle"><text x="112" y="162">q₁</text><text x="177" y="171">q₂</text><text x="242" y="176">q₃</text><text x="307" y="181">q₄</text></g><path d="M470 180 C530 130 580 160 630 140 S740 165 810 125" stroke="#8176b1" stroke-width="5" fill="none"/><text x="630" y="205" font-size="16" text-anchor="middle" fill="#574c83">q̂ᵥ = ρ pᵥ</text><text x="450" y="255" font-size="15" text-anchor="middle">ρ = sampler tail mass / trainer tail mass</text><text x="450" y="282" font-size="14" text-anchor="middle" fill="#657a79">Tail 不被忽略，而是显式建模并匹配剩余概率质量</text></svg>
