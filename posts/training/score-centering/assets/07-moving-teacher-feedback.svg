<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sc07t sc07d"><title id="sc07t">在线 RL 中有偏 sampler 作为移动教师可能形成正反馈</title><desc id="sc07d">数值误差或陈旧权重污染 sampler；trainer 的 drift 项将其蒸馏进参数，再同步回 sampler。</desc>
<rect width="900" height="300" rx="18" fill="#f5f8f6"/><g font-family="system-ui,sans-serif" fill="#344f54"><rect x="50" y="80" width="180" height="88" rx="12" fill="#fae9df" stroke="#c77a58" stroke-width="2"/><rect x="360" y="80" width="180" height="88" rx="12" fill="#e5edf1" stroke="#7c9da4" stroke-width="2"/><rect x="670" y="80" width="180" height="88" rx="12" fill="#ece9f8" stroke="#8176b1" stroke-width="2"/><text x="140" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#9b553a">Sampler q</text><text x="140" y="143" text-anchor="middle" font-size="14">量化 / 陈旧 / 偏差</text><text x="450" y="115" text-anchor="middle" font-size="18" font-weight="700">Trainer pθ</text><text x="450" y="143" text-anchor="middle" font-size="14">rollout + update</text><text x="760" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#574c83">同步权重</text><text x="760" y="143" text-anchor="middle" font-size="14">刷新 sampler</text></g><g stroke="#b36a4b" stroke-width="3" fill="none"><path d="M230 124 H350"/><path d="M340 116 L352 124 L340 132"/><path d="M540 124 H660"/><path d="M650 116 L662 124 L650 132"/></g><path d="M760 180 V245 H140 V180" fill="none" stroke="#b36a4b" stroke-width="3" stroke-dasharray="8 6"/><text x="450" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#9b553a">偏差可能在下一轮重新采样与训练中继续累积</text><text x="450" y="276" text-anchor="middle" font-size="14" fill="#657a79">固定 teacher 的离线蒸馏，与 teacher 随 student 移动的在线反馈不是同一动力学</text></svg>
