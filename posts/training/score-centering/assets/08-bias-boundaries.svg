<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sc08t sc08d"><title id="sc08t">Score centering 消除 drift 后仍保留多个 mismatch 来源</title><desc id="sc08d">中心化保留 q 下的 reward-score covariance；它与 p 下的目标 covariance 不必相等。</desc>
<rect width="900" height="300" rx="18" fill="#f5f8f6"/><rect x="38" y="75" width="245" height="150" rx="12" fill="#e0f0ea" stroke="#398c7f" stroke-width="2"/><text x="160" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#236b61">SC 保留</text><text x="160" y="148" text-anchor="middle" font-size="17">Cov_q(A,s)</text><text x="160" y="180" text-anchor="middle" font-size="14">固定 prefix 下的</text><text x="160" y="202" text-anchor="middle" font-size="14">reward-score 关联</text><g font-family="system-ui,sans-serif"><rect x="345" y="42" width="515" height="65" rx="10" fill="#fae9df" stroke="#c77a58"/><text x="370" y="69" font-size="17" font-weight="700" fill="#9b553a">1 · Action distribution</text><text x="370" y="92" font-size="14">Cov_q(A,s) 不一定等于 Cov_p(A,s)</text><rect x="345" y="126" width="515" height="65" rx="10" fill="#ece9f8" stroke="#8176b1"/><text x="370" y="153" font-size="17" font-weight="700" fill="#574c83">2 · Prefix / state distribution</text><text x="370" y="176" font-size="14">训练仍使用由 q 产生的历史 h，不会自动变成 d_p(h)</text><rect x="345" y="210" width="515" height="65" rx="10" fill="#e8eef1" stroke="#7c9da4"/><text x="370" y="237" font-size="17" font-weight="700">3 · Continuation / advantage</text><text x="370" y="260" font-size="14">A^q(h,a) 与 A^p(h,a) 可能不同</text></g></svg>
