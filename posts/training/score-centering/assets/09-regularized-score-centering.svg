<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sc09t sc09d"><title id="sc09t">RSC 在 score correction 外增加 KL 距离约束</title><desc id="sc09d">RSC 保留 score centering 的 baseline correction，同时对 learner 与 behavior policy 施加 reverse KL 正则。</desc>
<rect width="900" height="300" rx="18" fill="#f5f8f6"/><rect x="60" y="65" width="310" height="150" rx="13" fill="#e0f0ea" stroke="#398c7f" stroke-width="2"/><text x="215" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="#236b61">Score Centering</text><text x="215" y="140" text-anchor="middle" font-size="16">减去 behavior expected score</text><text x="215" y="175" text-anchor="middle" font-size="14">消除 reward baseline drift</text><text x="450" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#687c7b">+</text><rect x="530" y="65" width="310" height="150" rx="13" fill="#ece9f8" stroke="#8176b1" stroke-width="2"/><text x="685" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="#574c83">Reverse KL</text><text x="685" y="140" text-anchor="middle" font-size="16">KL(πθ || μ)</text><text x="685" y="175" text-anchor="middle" font-size="14">限制 learner 远离 behavior policy</text><text x="450" y="266" text-anchor="middle" font-size="14" fill="#657a79">RSC = SC + KL（可再组合 TIS）</text></svg>
