<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="sft-fig01-title sft-fig01-desc"><title id="sft-fig01-title">从预训练到监督微调</title><desc id="sft-fig01-desc">预训练模型学习通用文本的下一个 token 分布，再通过指令与示范回答学习条件化的回答方式。</desc><defs><marker id="sft-arrow-01" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#427c78" stroke-width="1.6"/></marker></defs><rect x="18" y="20" width="864" height="260" rx="22" fill="#f6faf8"/><rect x="48" y="72" width="210" height="126" rx="16" fill="#e5edf5" stroke="#8ea9bd" stroke-width="2"/><text x="153" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#29485b">预训练模型</text><text x="153" y="139" text-anchor="middle" font-size="15" fill="#486577">通用文本</text><text x="153" y="164" text-anchor="middle" font-size="15" fill="#486577">下一个 Token</text><path d="M258 135 H337" stroke="#427c78" stroke-width="4" marker-end="url(#sft-arrow-01)"/><rect x="344" y="72" width="212" height="126" rx="16" fill="#fff0df" stroke="#d4a16c" stroke-width="2"/><text x="450" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#80552f">SFT 示范数据</text><text x="450" y="139" text-anchor="middle" font-size="15" fill="#8b6748">指令 / 上下文</text><text x="450" y="164" text-anchor="middle" font-size="15" fill="#8b6748">高质量目标回答</text><path d="M556 135 H635" stroke="#427c78" stroke-width="4" marker-end="url(#sft-arrow-01)"/><rect x="642" y="72" width="210" height="126" rx="16" fill="#e1f2eb" stroke="#75aa96" stroke-width="2"/><text x="747" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#275e4d">指令微调模型</text><text x="747" y="139" text-anchor="middle" font-size="15" fill="#477866">给定输入</text><text x="747" y="164" text-anchor="middle" font-size="15" fill="#477866">生成示范风格回答</text><text x="153" y="228" text-anchor="middle" font-size="13" fill="#647b84">学习“语言如何延续”</text><text x="450" y="228" text-anchor="middle" font-size="13" fill="#8b6748">提供“任务该如何完成”</text><text x="747" y="228" text-anchor="middle" font-size="13" fill="#477866">学习“在此条件下如何回答”</text><text x="450" y="262" text-anchor="middle" font-size="13" fill="#6b7f7c">SFT 改变模型参数与条件输出分布，不是另造一种 Transformer 架构</text></svg>
