<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="sft-fig02-title sft-fig02-desc"><title id="sft-fig02-title">监督微调数据的三类来源与质量控制</title><desc id="sft-fig02-desc">人工编写、任务数据集模板化和教师模型合成三类数据经过去重、事实核验、隐私过滤、格式统一与任务平衡，形成可训练的指令回答样本。</desc><defs><marker id="sft-arrow-02" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#527c79" stroke-width="1.6"/></marker></defs><rect x="16" y="18" width="868" height="344" rx="20" fill="#f8faf8"/><rect x="38" y="48" width="218" height="72" rx="12" fill="#e9f1f8" stroke="#9bb6ca"/><text x="147" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#34576d">人工示范 / 筛选</text><text x="147" y="101" text-anchor="middle" font-size="13" fill="#557285">专家、标注员、真实案例</text><rect x="38" y="154" width="218" height="72" rx="12" fill="#f1ebfb" stroke="#b7a5d5"/><text x="147" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#5e4c83">任务数据集转换</text><text x="147" y="207" text-anchor="middle" font-size="13" fill="#756796">模板化指令 / 多任务集合</text><rect x="38" y="260" width="218" height="72" rx="12" fill="#fff0e4" stroke="#d6a67f"/><text x="147" y="290" text-anchor="middle" font-size="17" font-weight="700" fill="#855a39">教师模型合成</text><text x="147" y="313" text-anchor="middle" font-size="13" fill="#936d4f">蒸馏 / Self-Instruct</text><path d="M256 84 H330 V190 H365 M256 190 H365 M256 296 H330 V190" fill="none" stroke="#527c79" stroke-width="3" marker-end="url(#sft-arrow-02)"/><rect x="372" y="112" width="232" height="156" rx="16" fill="#fff8e9" stroke="#d6bd83" stroke-width="2"/><text x="488" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#725a2b">数据质量闸门</text><text x="488" y="176" text-anchor="middle" font-size="14" fill="#786846">去重 · 隐私过滤</text><text x="488" y="201" text-anchor="middle" font-size="14" fill="#786846">事实 / 代码核验</text><text x="488" y="226" text-anchor="middle" font-size="14" fill="#786846">格式统一 · 任务平衡</text><path d="M604 190 H670" stroke="#527c79" stroke-width="3" marker-end="url(#sft-arrow-02)"/><rect x="678" y="112" width="186" height="156" rx="16" fill="#e3f2eb" stroke="#82b59e" stroke-width="2"/><text x="771" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#2e654f">SFT 样本</text><text x="771" y="182" text-anchor="middle" font-size="14" fill="#4d7a68">instruction</text><text x="771" y="207" text-anchor="middle" font-size="14" fill="#4d7a68">optional input</text><text x="771" y="232" text-anchor="middle" font-size="14" fill="#4d7a68">target response</text><text x="488" y="305" text-anchor="middle" font-size="13" fill="#6f817c">数量只是规模；覆盖、正确性、去重和分布决定训练信号</text></svg>
