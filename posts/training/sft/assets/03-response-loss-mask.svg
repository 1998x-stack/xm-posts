<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="sft-fig03-title sft-fig03-desc"><title id="sft-fig03-title">Response-only loss masking：上下文可见，但不一定计入损失</title><desc id="sft-fig03-desc">System、User 和 Assistant header 作为模型输入上下文；Assistant 的回答 token 与结束标记作为监督目标。损失掩码不等于注意力掩码。</desc><rect x="16" y="18" width="868" height="324" rx="20" fill="#f8faf8"/><text x="42" y="58" font-size="18" font-weight="700" fill="#31565a">同一条序列：模型前向时都能读取，计算损失时只选择目标位置</text><g font-size="14" text-anchor="middle"><rect x="34" y="92" width="104" height="76" rx="10" fill="#e8eef4" stroke="#9aafc1"/><text x="86" y="121" fill="#39576b" font-weight="700">SYSTEM</text><text x="86" y="145" fill="#587285">角色设定</text><rect x="146" y="92" width="104" height="76" rx="10" fill="#e8eef4" stroke="#9aafc1"/><text x="198" y="121" fill="#39576b" font-weight="700">USER</text><text x="198" y="145" fill="#587285">问题</text><rect x="258" y="92" width="104" height="76" rx="10" fill="#e8eef4" stroke="#9aafc1"/><text x="310" y="121" fill="#39576b" font-weight="700">QUESTION</text><text x="310" y="145" fill="#587285">补充上下文</text><rect x="370" y="92" width="112" height="76" rx="10" fill="#e8eef4" stroke="#9aafc1"/><text x="426" y="121" fill="#39576b" font-weight="700">ASSISTANT</text><text x="426" y="145" fill="#587285">角色边界</text><rect x="490" y="92" width="112" height="76" rx="10" fill="#dff1e8" stroke="#78ad95" stroke-width="2"/><text x="546" y="121" fill="#28634e" font-weight="700">ANSWER 1</text><text x="546" y="145" fill="#4d806b">回答 token</text><rect x="610" y="92" width="112" height="76" rx="10" fill="#dff1e8" stroke="#78ad95" stroke-width="2"/><text x="666" y="121" fill="#28634e" font-weight="700">ANSWER 2</text><text x="666" y="145" fill="#4d806b">后续 token</text><rect x="730" y="92" width="132" height="76" rx="10" fill="#dff1e8" stroke="#78ad95" stroke-width="2"/><text x="796" y="121" fill="#28634e" font-weight="700">END-OF-TURN</text><text x="796" y="145" fill="#4d806b">学会停止</text></g><text x="42" y="210" font-size="14" font-weight="700" fill="#526c76">Attention / 前向上下文</text><rect x="258" y="192" width="604" height="28" rx="8" fill="#dce8f0"/><text x="560" y="211" text-anchor="middle" font-size="13" fill="#405e70">所有前序 token 都参与条件化；回答依赖 system 与 user 信息</text><text x="42" y="260" font-size="14" font-weight="700" fill="#526c76">Loss mask m</text><g font-size="13" text-anchor="middle"><rect x="34" y="276" width="104" height="34" rx="7" fill="#edf0f1" stroke="#c6d0d2"/><text x="86" y="298" fill="#748589">m = 0</text><rect x="146" y="276" width="104" height="34" rx="7" fill="#edf0f1" stroke="#c6d0d2"/><text x="198" y="298" fill="#748589">m = 0</text><rect x="258" y="276" width="104" height="34" rx="7" fill="#edf0f1" stroke="#c6d0d2"/><text x="310" y="298" fill="#748589">m = 0</text><rect x="370" y="276" width="112" height="34" rx="7" fill="#edf0f1" stroke="#c6d0d2"/><text x="426" y="298" fill="#748589">m = 0</text><rect x="490" y="276" width="112" height="34" rx="7" fill="#cce8d9" stroke="#78ad95"/><text x="546" y="298" fill="#28634e">m = 1</text><rect x="610" y="276" width="112" height="34" rx="7" fill="#cce8d9" stroke="#78ad95"/><text x="666" y="298" fill="#28634e">m = 1</text><rect x="730" y="276" width="132" height="34" rx="7" fill="#cce8d9" stroke="#78ad95"/><text x="796" y="298" fill="#28634e">m = 1</text></g><text x="450" y="329" text-anchor="middle" font-size="13" fill="#657d7b">注意力掩码回答“能看见谁”；损失掩码回答“谁是学习目标”</text></svg>
