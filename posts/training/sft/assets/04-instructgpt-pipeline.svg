<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="sft-fig04-title sft-fig04-desc"><title id="sft-fig04-title">InstructGPT 中的 SFT、奖励模型和 PPO 三阶段</title><desc id="sft-fig04-desc">第一阶段用人工示范训练 SFT policy；第二阶段对多个模型回答排序并训练奖励模型；第三阶段使用奖励模型与 PPO 更新策略。SFT 是 RLHF 流程的起点，不等于整个 RLHF。</desc><defs><marker id="sft-arrow-04" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#537e78" stroke-width="1.7"/></marker></defs><rect x="16" y="18" width="868" height="304" rx="20" fill="#f8faf8"/><rect x="38" y="72" width="240" height="170" rx="15" fill="#e6f0f7" stroke="#8eafc5" stroke-width="2"/><text x="158" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#31566c">① SFT</text><text x="158" y="140" text-anchor="middle" font-size="15" fill="#4d7185">人工示范 (prompt, answer)</text><text x="158" y="169" text-anchor="middle" font-size="15" fill="#4d7185">最大似然 / token CE</text><text x="158" y="207" text-anchor="middle" font-size="14" fill="#31566c">得到初始策略 πSFT</text><path d="M278 156 H334" stroke="#537e78" stroke-width="3" marker-end="url(#sft-arrow-04)"/><rect x="342" y="72" width="240" height="170" rx="15" fill="#fff0df" stroke="#d2a06e" stroke-width="2"/><text x="462" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#825a34">② Reward Model</text><text x="462" y="140" text-anchor="middle" font-size="15" fill="#906b4b">同一 prompt 的多个回答</text><text x="462" y="169" text-anchor="middle" font-size="15" fill="#906b4b">人类偏好排序</text><text x="462" y="207" text-anchor="middle" font-size="14" fill="#825a34">学习标量奖励 r(x, y)</text><path d="M582 156 H638" stroke="#537e78" stroke-width="3" marker-end="url(#sft-arrow-04)"/><rect x="646" y="72" width="216" height="170" rx="15" fill="#e7f2e9" stroke="#89b69a" stroke-width="2"/><text x="754" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#2e654b">③ PPO</text><text x="754" y="140" text-anchor="middle" font-size="15" fill="#4e7c62">采样回答并获得奖励</text><text x="754" y="169" text-anchor="middle" font-size="15" fill="#4e7c62">KL 约束 / 策略更新</text><text x="754" y="207" text-anchor="middle" font-size="14" fill="#2e654b">优化后的策略 πθ</text><path d="M754 242 V275 H158 V242" fill="none" stroke="#8d9d9a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#sft-arrow-04)"/><text x="456" y="299" text-anchor="middle" font-size="13" fill="#687f7b">后续策略可继续采样，收集新偏好，再迭代更新 RM 与 policy</text></svg>
