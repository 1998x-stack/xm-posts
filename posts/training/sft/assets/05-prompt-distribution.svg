<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="sft-fig05-title sft-fig05-desc"><title id="sft-fig05-title">InstructGPT API prompt 的任务分布</title><desc id="sft-fig05-desc">Ouyang 等人在 InstructGPT 论文表一中报告的 API prompt 用途分布：生成 45.6%，开放式问答 12.4%，头脑风暴 11.2%，对话 8.4%，改写 6.6%，摘要 4.2%，分类 3.5%，其他 3.5%，封闭式问答 2.6%，抽取 1.9%。</desc><rect x="16" y="18" width="868" height="444" rx="20" fill="#fbfaf7"/><text x="44" y="54" font-size="18" font-weight="700" fill="#334f54">InstructGPT API prompt：训练场景并不是均匀分布</text><text x="44" y="78" font-size="12" fill="#758785">来源：Ouyang et al. (2022), Table 1；不是所有 SFT 数据集的通用分布</text><g font-size="13" fill="#4b666b" text-anchor="end"><text x="214" y="119">生成</text><text x="214" y="155">开放式问答</text><text x="214" y="191">头脑风暴</text><text x="214" y="227">对话</text><text x="214" y="263">改写</text><text x="214" y="299">摘要</text><text x="214" y="335">分类</text><text x="214" y="371">其他</text><text x="214" y="407">封闭式问答</text><text x="214" y="443">抽取</text></g><g fill="#dce8e5"><rect x="236" y="101" width="420" height="22" rx="5"/><rect x="236" y="137" width="420" height="22" rx="5"/><rect x="236" y="173" width="420" height="22" rx="5"/><rect x="236" y="209" width="420" height="22" rx="5"/><rect x="236" y="245" width="420" height="22" rx="5"/><rect x="236" y="281" width="420" height="22" rx="5"/><rect x="236" y="317" width="420" height="22" rx="5"/><rect x="236" y="353" width="420" height="22" rx="5"/><rect x="236" y="389" width="420" height="22" rx="5"/><rect x="236" y="425" width="420" height="22" rx="5"/></g><g fill="#398579"><rect x="236" y="101" width="383" height="22" rx="5"/><rect x="236" y="137" width="104" height="22" rx="5"/><rect x="236" y="173" width="94" height="22" rx="5"/><rect x="236" y="209" width="71" height="22" rx="5"/><rect x="236" y="245" width="55" height="22" rx="5"/><rect x="236" y="281" width="35" height="22" rx="5"/><rect x="236" y="317" width="29" height="22" rx="5"/><rect x="236" y="353" width="29" height="22" rx="5"/><rect x="236" y="389" width="22" height="22" rx="5"/><rect x="236" y="425" width="16" height="22" rx="5"/></g><g font-size="13" font-weight="700" fill="#365e59"><text x="630" y="118">45.6%</text><text x="351" y="154">12.4%</text><text x="341" y="190">11.2%</text><text x="318" y="226">8.4%</text><text x="302" y="262">6.6%</text><text x="282" y="298">4.2%</text><text x="276" y="334">3.5%</text><text x="276" y="370">3.5%</text><text x="269" y="406">2.6%</text><text x="262" y="442">1.9%</text></g></svg>
