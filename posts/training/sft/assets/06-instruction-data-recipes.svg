<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="sft-fig06-title sft-fig06-desc"><title id="sft-fig06-title">三种代表性的指令数据构建路线</title><desc id="sft-fig06-desc">FLAN 通过多任务集合与模板扩展覆盖面；LIMA 通过少量高质量、多样化人工策展样本强调质量；Self-Instruct 通过教师模型生成指令和答案并过滤无效或相似样本扩展规模。</desc><rect x="16" y="18" width="868" height="294" rx="20" fill="#f8faf8"/><rect x="38" y="58" width="250" height="210" rx="16" fill="#e8f0f8" stroke="#9bb5ca" stroke-width="2"/><text x="163" y="94" text-anchor="middle" font-size="21" font-weight="700" fill="#31566d">FLAN</text><text x="163" y="126" text-anchor="middle" font-size="15" fill="#4d6f83">多任务聚合</text><rect x="68" y="149" width="190" height="36" rx="8" fill="#d2e1ed"/><text x="163" y="172" text-anchor="middle" font-size="13" fill="#3f6076">Task A · Task B · Task C</text><rect x="68" y="193" width="190" height="36" rx="8" fill="#d2e1ed"/><text x="163" y="216" text-anchor="middle" font-size="13" fill="#3f6076">Zero / Few-shot / CoT</text><text x="163" y="250" text-anchor="middle" font-size="12" fill="#5f7b8a">任务平衡与提示丰富</text><rect x="325" y="58" width="250" height="210" rx="16" fill="#e9f3eb" stroke="#8fb89b" stroke-width="2"/><text x="450" y="94" text-anchor="middle" font-size="21" font-weight="700" fill="#2d654d">LIMA</text><text x="450" y="126" text-anchor="middle" font-size="15" fill="#4d7b61">精选少量示范</text><rect x="355" y="149" width="190" height="36" rx="8" fill="#d5eadb"/><text x="450" y="172" text-anchor="middle" font-size="13" fill="#3d6f54">1,000 examples</text><rect x="355" y="193" width="190" height="36" rx="8" fill="#d5eadb"/><text x="450" y="216" text-anchor="middle" font-size="13" fill="#3d6f54">Quality + Diversity</text><text x="450" y="250" text-anchor="middle" font-size="12" fill="#5f806b">示范质量与格式一致</text><rect x="612" y="58" width="250" height="210" rx="16" fill="#fff0e3" stroke="#d7a47b" stroke-width="2"/><text x="737" y="94" text-anchor="middle" font-size="21" font-weight="700" fill="#875a38">Self-Instruct</text><text x="737" y="126" text-anchor="middle" font-size="15" fill="#936c4c">模型生成再过滤</text><rect x="642" y="149" width="190" height="36" rx="8" fill="#f6dfca"/><text x="737" y="172" text-anchor="middle" font-size="13" fill="#865b3d">Generate instructions</text><rect x="642" y="193" width="190" height="36" rx="8" fill="#f6dfca"/><text x="737" y="216" text-anchor="middle" font-size="13" fill="#865b3d">Filter + Deduplicate</text><text x="737" y="250" text-anchor="middle" font-size="12" fill="#936c4c">控制教师偏差与噪声</text><text x="450" y="294" text-anchor="middle" font-size="13" fill="#687d79">三种路线可以混合；没有一种数据构造方式天然保证正确性</text></svg>
