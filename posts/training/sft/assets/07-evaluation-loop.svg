<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="sft-fig07-title sft-fig07-desc"><title id="sft-fig07-title">SFT 训练与评估闭环</title><desc id="sft-fig07-desc">训练集用于参数更新，验证集用于模型选择，测试集只在最终评估时使用；评测同时检查指令遵循、事实正确性、格式、安全性和分布外泛化。</desc><defs><marker id="sft-arrow-07" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#527c79" stroke-width="1.6"/></marker></defs><rect x="16" y="18" width="868" height="304" rx="20" fill="#f8faf8"/><rect x="40" y="76" width="205" height="122" rx="14" fill="#e7eff7" stroke="#99b2c6" stroke-width="2"/><text x="142" y="111" text-anchor="middle" font-size="19" font-weight="700" fill="#355b70">训练集</text><text x="142" y="144" text-anchor="middle" font-size="14" fill="#567487">计算梯度</text><text x="142" y="169" text-anchor="middle" font-size="14" fill="#567487">更新参数 θ</text><path d="M245 137 H330" stroke="#527c79" stroke-width="3" marker-end="url(#sft-arrow-07)"/><rect x="338" y="76" width="205" height="122" rx="14" fill="#fff0df" stroke="#d4a477" stroke-width="2"/><text x="440" y="111" text-anchor="middle" font-size="19" font-weight="700" fill="#815a36">验证集</text><text x="440" y="144" text-anchor="middle" font-size="14" fill="#936e4f">选 checkpoint</text><text x="440" y="169" text-anchor="middle" font-size="14" fill="#936e4f">调超参数 / 早停</text><path d="M543 137 H628" stroke="#527c79" stroke-width="3" marker-end="url(#sft-arrow-07)"/><rect x="636" y="76" width="224" height="122" rx="14" fill="#e3f1e8" stroke="#8cb59a" stroke-width="2"/><text x="748" y="111" text-anchor="middle" font-size="19" font-weight="700" fill="#2f654d">独立测试</text><text x="748" y="144" text-anchor="middle" font-size="14" fill="#4e7a62">最终报告</text><text x="748" y="169" text-anchor="middle" font-size="14" fill="#4e7a62">不参与调参</text><path d="M440 198 V245 H142 V198" fill="none" stroke="#8b9b98" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#sft-arrow-07)"/><text x="440" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#425f5e">不要只看 token loss</text><text x="440" y="294" text-anchor="middle" font-size="13" fill="#687e7a">指令遵循 · 正确性 · 格式 · 安全 · 鲁棒性 · 分布外泛化</text></svg>
