<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-label="上方教师强制总是把真实上一词传到下一步，下方自由生成把模型上一步预测传到下一步"><title>Teacher Forcing 与自由运行的两条反馈路径</title><desc>第一条轨道输入上一真实词 I 和 love，第二条轨道从模型错误预测 We 开始进入 We、like 的自回归路径。紫色代表真值，青色代表模型预测。</desc><rect width="900" height="370" rx="19" fill="#f8faf7"/><text x="28" y="40" font-size="23" font-weight="750" fill="#24454b" font-family="system-ui,sans-serif">同一模型，两种“下一步输入”</text><rect x="28" y="62" width="845" height="130" rx="14" fill="#f0eafa" stroke="#d6c4e5"/><text x="48" y="90" font-size="18" fill="#674d89" font-weight="750" font-family="system-ui,sans-serif">训练 · Teacher forcing</text><g font-family="system-ui,sans-serif" font-size="17" text-anchor="middle"><rect x="54" y="111" width="155" height="56" rx="10" fill="#fff" stroke="#bda3d4"/><text x="132" y="134" fill="#614281">真实上一词</text><text x="132" y="156" font-weight="750" fill="#614281">I</text><rect x="296" y="111" width="167" height="56" rx="10" fill="#fff" stroke="#badbd7"/><text x="380" y="134" fill="#246f6d">模型预测</text><text x="380" y="157" font-weight="750" fill="#246f6d">love</text><rect x="553" y="111" width="163" height="56" rx="10" fill="#fff" stroke="#bda3d4"/><text x="634" y="134" fill="#614281">下一步输入</text><text x="634" y="156" font-weight="750" fill="#614281">真实 love</text></g><path d="M209 139 H284 M463 139 H540" stroke="#8f77b4" stroke-width="3" stroke-linecap="round"/><path d="M278 132 l8 7 -8 7 M534 132 l8 7 -8 7" fill="none" stroke="#8f77b4" stroke-width="3"/><text x="779" y="140" text-anchor="middle" font-size="14" fill="#745c8f" font-family="system-ui,sans-serif">不回喂预测</text><rect x="28" y="211" width="845" height="130" rx="14" fill="#e5f5f2" stroke="#b0d9d3"/><text x="48" y="239" font-size="18" fill="#226d69" font-weight="750" font-family="system-ui,sans-serif">生成 · Free running</text><g font-family="system-ui,sans-serif" font-size="17" text-anchor="middle"><rect x="54" y="261" width="155" height="56" rx="10" fill="#fff" stroke="#bda3d4"/><text x="132" y="284" fill="#614281">起始输入</text><text x="132" y="306" fill="#614281" font-weight="750">&lt;bos&gt;</text><rect x="296" y="261" width="167" height="56" rx="10" fill="#fff" stroke="#90c9c1"/><text x="380" y="284" fill="#246f6d">模型预测</text><text x="380" y="306" font-weight="750" fill="#246f6d">We</text><rect x="553" y="261" width="163" height="56" rx="10" fill="#fff" stroke="#90c9c1"/><text x="634" y="284" fill="#246f6d">下一步输入</text><text x="634" y="306" font-weight="750" fill="#246f6d">预测 We</text></g><path d="M209 289 H284 M463 289 H540" stroke="#2c9185" stroke-width="3" stroke-linecap="round"/><path d="M278 282 l8 7 -8 7 M534 282 l8 7 -8 7" fill="none" stroke="#2c9185" stroke-width="3"/><text x="779" y="291" text-anchor="middle" font-size="14" fill="#226d69" font-family="system-ui,sans-serif">回喂预测</text><text x="450" y="360" text-anchor="middle" font-size="13" fill="#61777b" font-family="system-ui,sans-serif">紫色 = 标准答案   ·   青色 = 模型预测   ·   示例词仅用于教学</text></svg>