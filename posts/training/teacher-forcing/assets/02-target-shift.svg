<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="教师强制的训练输入与标签错开一位：输入 BOS 我 爱 机器 学习，标签 我 爱 机器 学习 EOS"><title>自回归训练中的右移一位</title><rect width="900" height="320" rx="18" fill="#f9faf8"/><text x="32" y="44" fill="#24454b" font-size="23" font-weight="750" font-family="system-ui,sans-serif">一条序列，向右错开一个 token</text><g font-family="system-ui,sans-serif" text-anchor="middle" font-size="17"><text x="79" y="107" fill="#61777b" font-weight="700">解码输入</text><text x="79" y="198" fill="#61777b" font-weight="700">预测目标</text></g><g font-family="system-ui,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><rect x="160" y="72" width="115" height="64" rx="10" fill="#f0eafa" stroke="#bea9d3"/><text x="217" y="112" fill="#665287">BOS</text><rect x="296" y="72" width="115" height="64" rx="10" fill="#f0eafa" stroke="#bea9d3"/><text x="353" y="112" fill="#665287">我</text><rect x="432" y="72" width="115" height="64" rx="10" fill="#f0eafa" stroke="#bea9d3"/><text x="489" y="112" fill="#665287">爱</text><rect x="568" y="72" width="115" height="64" rx="10" fill="#f0eafa" stroke="#bea9d3"/><text x="625" y="112" fill="#665287">机器</text><rect x="704" y="72" width="115" height="64" rx="10" fill="#f0eafa" stroke="#bea9d3"/><text x="761" y="112" fill="#665287">学习</text><rect x="160" y="171" width="115" height="64" rx="10" fill="#e4f4f1" stroke="#98c9c0"/><text x="217" y="211" fill="#206c69">我</text><rect x="296" y="171" width="115" height="64" rx="10" fill="#e4f4f1" stroke="#98c9c0"/><text x="353" y="211" fill="#206c69">爱</text><rect x="432" y="171" width="115" height="64" rx="10" fill="#e4f4f1" stroke="#98c9c0"/><text x="489" y="211" fill="#206c69">机器</text><rect x="568" y="171" width="115" height="64" rx="10" fill="#e4f4f1" stroke="#98c9c0"/><text x="625" y="211" fill="#206c69">学习</text><rect x="704" y="171" width="115" height="64" rx="10" fill="#e4f4f1" stroke="#98c9c0"/><text x="761" y="211" fill="#206c69">EOS</text></g><g fill="none" stroke="#9bafa9" stroke-width="2.5" stroke-linecap="round"><path d="M217 140 v24 m-7 -8 l7 8 7 -8 M353 140 v24 m-7 -8 l7 8 7 -8 M489 140 v24 m-7 -8 l7 8 7 -8 M625 140 v24 m-7 -8 l7 8 7 -8 M761 140 v24 m-7 -8 l7 8 7 -8"/></g><text x="450" y="282" text-anchor="middle" font-size="16" fill="#516f72" font-family="system-ui,sans-serif">每个位置读到的是目标序列的左侧前缀，再预测本位置的下一个词。</text></svg>