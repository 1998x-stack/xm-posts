<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-label="训练的真实前缀 I love cats 与生成中的错误路径 We like dogs；第一次偏差后下一步条件随之改变"><title>Exposure bias：一次错误改变后续输入分布</title><rect width="900" height="370" rx="18" fill="#f8faf7"/><text x="30" y="40" font-size="23" font-weight="740" fill="#24454b" font-family="system-ui,sans-serif">一次偏差，下一步的条件也变了</text><g font-family="system-ui,sans-serif"><text x="32" y="104" font-size="17" fill="#665287" font-weight="700">训练中的真实前缀</text><text x="32" y="226" font-size="17" fill="#23786f" font-weight="700">生成中的自回馈</text><g font-size="19" text-anchor="middle" font-weight="700"><rect x="260" y="67" width="155" height="73" rx="12" fill="#efe7f9" stroke="#cfb9df"/><text x="338" y="111" fill="#655080">I</text><rect x="473" y="67" width="155" height="73" rx="12" fill="#efe7f9" stroke="#cfb9df"/><text x="551" y="111" fill="#655080">love</text><rect x="686" y="67" width="155" height="73" rx="12" fill="#efe7f9" stroke="#cfb9df"/><text x="764" y="111" fill="#655080">cats</text><rect x="260" y="192" width="155" height="73" rx="12" fill="#fce8e5" stroke="#deaa9c"/><text x="338" y="236" fill="#a34b42">We</text><rect x="473" y="192" width="155" height="73" rx="12" fill="#e3f4ef" stroke="#92c9bd"/><text x="551" y="236" fill="#226e67">like</text><rect x="686" y="192" width="155" height="73" rx="12" fill="#e3f4ef" stroke="#92c9bd"/><text x="764" y="236" fill="#226e67">dogs</text></g><g stroke-width="3" fill="none"><path d="M415 103 H470 M628 103 H682" stroke="#9779b0"/><path d="M415 228 H470 M628 228 H682" stroke="#279080"/><path d="M338 142 V188" stroke="#c36c63" stroke-dasharray="7 6"/></g><g font-size="14"><text x="341" y="174" fill="#b15d55">第一步选错</text><text x="552" y="292" text-anchor="middle" fill="#487373">后续输入已不同，误差可能累积</text></g><rect x="255" y="307" width="597" height="43" rx="8" fill="#fff5e9" stroke="#edd7bd"/><text x="554" y="335" text-anchor="middle" font-size="16" fill="#825f3e">“可能累积” ≠ “必然越错越多”：是否恢复取决于模型。</text></g></svg>