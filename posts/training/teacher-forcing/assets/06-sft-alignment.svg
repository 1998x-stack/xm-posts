<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="06-sft-alignment-title 06-sft-alignment-desc" data-export="06-sft-alignment.svg"><title id="06-sft-alignment-title">SFT：输入、目标与监督掩码</title><desc id="06-sft-alignment-desc">序列 BOS Q A1 A2 EOS；预测目标为下一词，Q 不监督，A1 A2 EOS 监督。</desc><rect width="800" height="300" rx="12" fill="#f8faf7"/><g font-family="system-ui, sans-serif"><text x="28" y="34" fill="#24454b" font-size="20" text-anchor="start">同一序列，三种不同职责</text><text x="25" y="91" fill="#24454b" font-size="18" text-anchor="start">输入位置</text><text x="25" y="166" fill="#24454b" font-size="18" text-anchor="start">下一词标签</text><text x="25" y="241" fill="#24454b" font-size="18" text-anchor="start">Loss mask</text><rect x="166" y="60" width="104" height="48" rx="9" fill="#efe7f9" stroke="#bda8cf"/><text x="218" y="90" fill="#24454b" font-size="19" text-anchor="middle">BOS</text><rect x="282" y="60" width="104" height="48" rx="9" fill="#efe7f9" stroke="#bda8cf"/><text x="334" y="90" fill="#24454b" font-size="19" text-anchor="middle">Q</text><rect x="398" y="60" width="104" height="48" rx="9" fill="#efe7f9" stroke="#bda8cf"/><text x="450" y="90" fill="#24454b" font-size="19" text-anchor="middle">A1</text><rect x="514" y="60" width="104" height="48" rx="9" fill="#efe7f9" stroke="#bda8cf"/><text x="566" y="90" fill="#24454b" font-size="19" text-anchor="middle">A2</text><rect x="630" y="60" width="104" height="48" rx="9" fill="#efe7f9" stroke="#bda8cf"/><text x="682" y="90" fill="#24454b" font-size="19" text-anchor="middle">EOS</text><rect x="166" y="135" width="104" height="48" rx="9" fill="#f1f2f0" stroke="#b1cec5"/><text x="218" y="165" fill="#24454b" font-size="19" text-anchor="middle">Q</text><rect x="282" y="135" width="104" height="48" rx="9" fill="#e3f4ef" stroke="#b1cec5"/><text x="334" y="165" fill="#24454b" font-size="19" text-anchor="middle">A1</text><rect x="398" y="135" width="104" height="48" rx="9" fill="#e3f4ef" stroke="#b1cec5"/><text x="450" y="165" fill="#24454b" font-size="19" text-anchor="middle">A2</text><rect x="514" y="135" width="104" height="48" rx="9" fill="#e3f4ef" stroke="#b1cec5"/><text x="566" y="165" fill="#24454b" font-size="19" text-anchor="middle">EOS</text><rect x="630" y="135" width="104" height="48" rx="9" fill="#f1f2f0" stroke="#b1cec5"/><text x="682" y="165" fill="#24454b" font-size="19" text-anchor="middle">—</text><rect x="166" y="210" width="104" height="48" rx="9" fill="#f1f2f0" stroke="#d4a887"/><text x="218" y="240" fill="#24454b" font-size="19" text-anchor="middle">0</text><rect x="282" y="210" width="104" height="48" rx="9" fill="#fff1e7" stroke="#d4a887"/><text x="334" y="240" fill="#24454b" font-size="19" text-anchor="middle">1</text><rect x="398" y="210" width="104" height="48" rx="9" fill="#fff1e7" stroke="#d4a887"/><text x="450" y="240" fill="#24454b" font-size="19" text-anchor="middle">1</text><rect x="514" y="210" width="104" height="48" rx="9" fill="#fff1e7" stroke="#d4a887"/><text x="566" y="240" fill="#24454b" font-size="19" text-anchor="middle">1</text><rect x="630" y="210" width="104" height="48" rx="9" fill="#f1f2f0" stroke="#d4a887"/><text x="682" y="240" fill="#24454b" font-size="19" text-anchor="middle">—</text><text x="400" y="285" fill="#227a72" font-size="17" text-anchor="middle">Q 仍是上下文；从 Q 的 logits 开始监督 A1</text></g></svg>
