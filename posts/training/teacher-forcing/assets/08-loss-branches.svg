<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="08-loss-branches-title 08-loss-branches-desc" data-export="08-loss-branches.svg"><title id="08-loss-branches-title">预测分布与真实标签共同进入损失</title><desc id="08-loss-branches-desc">输入历史送入模型，模型分布与真实标签各自进入交叉熵；标签可成为下一步的输入。</desc><rect width="800" height="300" rx="12" fill="#f8faf7"/><g font-family="system-ui, sans-serif"><rect x="30" y="65" width="170" height="60" rx="9" fill="#efe7f9" stroke="#bda8cf"/><text x="115" y="100" fill="#24454b" font-size="19" text-anchor="middle">真实历史</text><rect x="290" y="65" width="180" height="60" rx="9" fill="#e3f4ef" stroke="#92c9bd"/><text x="380" y="100" fill="#24454b" font-size="19" text-anchor="middle">模型分布</text><rect x="290" y="170" width="180" height="60" rx="9" fill="#efe7f9" stroke="#bda8cf"/><text x="380" y="205" fill="#24454b" font-size="19" text-anchor="middle">真实标签</text><rect x="580" y="115" width="190" height="70" rx="9" fill="#fff1e7" stroke="#d4a887"/><text x="675" y="156" fill="#24454b" font-size="19" text-anchor="middle">交叉熵损失</text><path d="M202 95 L286 95 M278.10175694298664 99.31482984743782 L286 95 L278.10175694298664 90.68517015256218" fill="none" stroke="#438e82" stroke-width="2.5"/><path d="M472 95 L577 138 M568.0556975793179 138.99972706644382 L577 138 L571.3261314585839 131.0137838728874" fill="none" stroke="#438e82" stroke-width="2.5"/><path d="M472 200 L577 163 M570.9847589807487 169.69454072213438 L577 163 L568.1166896326549 161.55542500457105" fill="none" stroke="#438e82" stroke-width="2.5"/><text x="400" y="271" fill="#227a72" font-size="18" text-anchor="middle">标签并非预测的输出：二者共同决定损失</text></g></svg>
